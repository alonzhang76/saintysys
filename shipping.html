<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出运管理 - 舜天汉唐服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260812">
<style>
/* ==================== Scoped shipping documents CSS ==================== */
/* CSS variables scoped to .sd-docs and #printArea (for print support) */
.sd-docs, #printArea {
  --primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f1f5f9;--card-bg:#fff;
  --border:#cbd5e1;--text:#1e293b;--text-light:#64748b;--success:#16a34a;
  --danger:#dc2626;--warning:#d97706;--header-yellow:#ffff00;
}
/* Tab Bar */
.sd-docs .tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.sd-docs .tab-btn{flex:1;padding:10px 16px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.sd-docs .tab-btn:hover{background:#f8fafc;color:var(--text);}
.sd-docs .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:#eff6ff;}
.sd-docs .tab-btn .icon{font-size:15px;}
/* Tab Content */
.sd-docs .tab-content{display:none;padding:16px;max-width:1400px;margin:0 auto;}
.sd-docs .tab-content.active{display:block;}
/* Form Sections */
.sd-docs .section{background:var(--card-bg);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.sd-docs .section-title{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.sd-docs .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.sd-docs .form-group{display:flex;flex-direction:column;gap:3px;}
.sd-docs .form-group label{font-size:11px;font-weight:600;color:var(--text-light);}
.sd-docs .form-group input,.sd-docs .form-group select,.sd-docs .form-group textarea{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;transition:border-color .2s;}
.sd-docs .form-group input:focus,.sd-docs .form-group select:focus,.sd-docs .form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.1);}
.sd-docs .form-group input[readonly]{background:#f8fafc;color:var(--text-light);}
.sd-docs .form-group input.input-empty,.sd-docs .form-group textarea.input-empty{background:#fffbeb;border-color:#fcd34d;}
/* Buttons */
.sd-docs .btn{padding:6px 12px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.sd-docs .btn-primary{background:var(--primary);color:#fff;}
.sd-docs .btn-primary:hover{background:var(--primary-dark);}
.sd-docs .btn-success{background:var(--success);color:#fff;}
.sd-docs .btn-success:hover{background:#15803d;}
.sd-docs .btn-danger{background:var(--danger);color:#fff;}
.sd-docs .btn-danger:hover{background:#b91c1c;}
.sd-docs .btn-warning{background:var(--warning);color:#fff;}
.sd-docs .btn-warning:hover{background:#b45309;}
.sd-docs .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.sd-docs .btn-outline:hover{background:#f8fafc;border-color:var(--primary);}
.sd-docs .btn-sm{padding:3px 8px;font-size:11px;}
.sd-docs .btn-icon{padding:4px 7px;font-size:13px;line-height:1;}
/* Carton Table */
.sd-docs .table-wrap{overflow-x:auto;}
.sd-docs .data-table{width:100%;border-collapse:collapse;font-size:11px;}
.sd-docs .data-table th{background:#f1f5f9;padding:4px 6px;text-align:center;border:1px solid var(--border);font-weight:600;white-space:nowrap;}
.sd-docs .data-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;}
.sd-docs .data-table td input{width:100%;padding:3px 4px;border:1px solid transparent;border-radius:3px;font-size:11px;text-align:center;font-family:inherit;background:transparent;}
.sd-docs .data-table td input:focus{outline:none;border-color:var(--primary);background:#fff;}
.sd-docs .data-table td input[readonly]{font-weight:600;color:var(--primary);}
.sd-docs .data-table .col-del{width:30px;}
.sd-docs .data-table .total-row td{background:#eff6ff;font-weight:700;}
/* Size Manager */
.sd-docs .size-manager{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.sd-docs .size-tag{display:inline-flex;align-items:center;gap:4px;background:#e0e7ff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.sd-docs .size-tag .remove{cursor:pointer;color:var(--danger);font-weight:bold;}
.sd-docs .size-input{width:50px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;text-align:center;}
/* Order Qty Table */
.sd-docs .order-qty-table{width:100%;border-collapse:collapse;font-size:11px;}
.sd-docs .order-qty-table th{background:#f1f5f9;padding:5px;border:1px solid var(--border);text-align:center;}
.sd-docs .order-qty-table td{padding:5px;border:1px solid var(--border);text-align:center;}
.sd-docs .order-qty-table td input{width:100%;padding:3px;border:1px solid transparent;text-align:center;font-size:11px;font-family:inherit;background:transparent;}
.sd-docs .order-qty-table td input:focus{outline:none;border-color:var(--primary);background:#fff;}
/* Remove number input spinners in all tables */
.sd-docs input[type="number"]::-webkit-inner-spin-button,
.sd-docs input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
.sd-docs input[type="number"]{ -moz-appearance:textfield; }
#printArea input[type="number"]::-webkit-inner-spin-button,
#printArea input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
#printArea input[type="number"]{ -moz-appearance:textfield; }
/* Cards */
.sd-docs .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.sd-docs .record-card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 2px 4px rgba(0,0,0,.06);border:1px solid var(--border);transition:box-shadow .2s;cursor:pointer;position:relative;}
.sd-docs .record-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);}
.sd-docs .record-card .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.sd-docs .record-card .card-style{font-size:15px;font-weight:700;color:var(--primary);}
.sd-docs .record-card .card-date{font-size:10px;color:var(--text-light);}
.sd-docs .record-card .card-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
.sd-docs .record-card .card-info .label{color:var(--text-light);font-size:11px;}
.sd-docs .record-card .card-info .value{font-weight:600;}
.sd-docs .record-card .card-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.sd-docs .record-card .stat{flex:1;text-align:center;}
.sd-docs .record-card .stat .num{font-size:16px;font-weight:700;color:var(--primary);}
.sd-docs .record-card .stat .lbl{font-size:10px;color:var(--text-light);}
.sd-docs .record-card .card-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.sd-docs .record-card .card-actions .btn{flex:1;justify-content:center;}
.sd-docs .empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
.sd-docs .empty-state .icon{font-size:48px;margin-bottom:12px;}
/* PL Document */
.sd-docs .pl-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.sd-docs .pl-select{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;min-width:300px;}
.sd-docs .pl-preview{background:#fff;border:1px solid var(--border);border-radius:4px;overflow:auto;}
/* PL Table (Excel replica) - global for print support (#printArea is outside .sd-docs) */
.pl-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;max-width:277mm;}
.pl-table td,.pl-table th{border:1px solid #000;padding:1px 3px;}
.pl-table .company-name{background:var(--header-yellow);font-size:20pt;font-weight:bold;text-align:center;vertical-align:middle;padding:4px;border:none !important;}
.pl-table .info-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .info-value{text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .info-value.bold{font-weight:bold;}
.pl-table .section-header{font-size:14pt;font-weight:bold;text-align:left;padding:2px 5px;}
.pl-table .col-header{font-weight:bold;text-align:center;vertical-align:middle;font-size:10pt;padding:2px 3px;}
.pl-table .col-sub{text-align:center;font-size:10pt;padding:1px 3px;}
.pl-table .data-cell{text-align:left;font-size:10pt;padding:1px 3px;}
.pl-table .data-cell.right{text-align:left;}
.pl-table .data-cell.center{text-align:left;}
.pl-table .total-cell{font-weight:bold;text-align:left;font-size:10pt;padding:1px 3px;}
.pl-table .total-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .summary-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .summary-cell{text-align:left;font-size:10pt;padding:1px 3px;}
.pl-table .summary-cell.bold{font-weight:bold;}
/* Invoice Table */
.inv-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt;margin:0 auto;max-width:170mm;}
.inv-table td{border:1px solid #000;padding:2px 5px;}
.inv-table .inv-company{font-family:Arial,sans-serif;font-size:18pt;font-weight:bold;text-align:center;padding:6px;border:none !important;}
.inv-table .inv-addr{font-family:Arial,sans-serif;font-size:12pt;text-align:center;padding:2px 5px;border:none !important;}
.inv-table .inv-title{font-family:Arial,sans-serif;font-size:12pt;text-align:center;padding:2px 5px;border:none !important;}
.inv-table .inv-label{text-align:left;font-size:10pt;padding:1px 5px;white-space:nowrap;}
.inv-table .inv-val{text-align:left;font-size:11pt;padding:1px 5px;}
.inv-table .inv-text{font-size:11pt;padding:1px 5px;text-align:left;}
.inv-table .inv-header{text-align:center;font-size:12pt;padding:3px 5px;font-weight:normal;}
.inv-table .inv-cell{text-align:left;font-size:12pt;padding:2px 5px;}
.inv-table .inv-cell.left{text-align:left;}
.inv-table .inv-cell.right{text-align:right;}
.inv-table .inv-terms{text-align:left;font-size:12pt;padding:1px 5px;}
.inv-table .inv-total{text-align:left;font-size:12pt;padding:2px 5px;}
.inv-table .inv-ttl-label{text-align:left;font-size:12pt;padding:2px 5px;}
.inv-table .inv-remark{font-family:Arial,sans-serif;font-size:9pt;text-align:left;padding:1px 5px;border:none;}
.inv-table .inv-remark-label{font-family:Arial,sans-serif;font-size:9pt;text-align:left;padding:1px 5px;border:none;}
.inv-table .inv-noborder{border:none;padding:1px 5px;}
.inv-table .inv-section-label{font-family:Arial,sans-serif;font-size:9pt;text-align:left;padding:1px 5px;border:none;}
/* Customs Table (with borders) */
.cus-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:12pt;margin:0 auto;max-width:170mm;}
.cus-table td{border:1px solid #000;padding:4px 6px;font-size:12pt;text-align:left;}
/* Customs Declaration Table */
.cus-decl-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;max-width:170mm;}
.cus-decl-table td{border:1px solid #000;padding:3px 5px;font-size:10pt;line-height:1.6;text-align:left;}
/* Customs Invoice Form (borderless, left-aligned) */
.cus-form{font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;max-width:170mm;border-collapse:collapse;}
.cus-form td{padding:3px 5px;font-size:10pt;border:none;vertical-align:top;line-height:1.5;}
.cus-form .ctr{text-align:center;}
.cus-form .rgt{text-align:right;}
.cus-form .b{font-weight:bold;}
.cus-form .l{font-size:16pt;font-weight:bold;padding:6px 5px;}
.cus-form .m{font-size:14pt;font-weight:bold;padding:4px 5px;}
.cus-form .s{font-size:10pt;padding:3px 5px;}
.cus-form .bt{border-top:1px solid #000;}
.cus-form .bb{border-bottom:1px solid #000;}
.cus-form .bl{border-left:1px solid #000;}
.cus-form .br{border-right:1px solid #000;}
.cus-form .gap{height:14px;border:none;}
/* Customs PL Form */
.cus-pl-form{font-family:Arial,sans-serif;font-size:12pt;margin:0 auto;width:100%;border-collapse:collapse;}
.cus-pl-form td{padding:4px 6px;font-size:12pt;border:none;vertical-align:top;line-height:1.5;}
.cus-pl-form .ctr{text-align:center;}
.cus-pl-form .rgt{text-align:right;}
.cus-pl-form .b{font-weight:bold;}
.cus-pl-form .kt{font-family:Arial,sans-serif;font-size:14pt;font-weight:bold;}
.cus-pl-form .en{font-family:Arial,sans-serif;font-size:12pt;}
.cus-pl-form .gap{height:24px;border:none;}
/* Declaration Elements Form (no borders, no header) */
.cus-elem-form{font-family:Arial,sans-serif;font-size:14pt;margin:0 auto;width:100%;border-collapse:collapse;}
.cus-elem-form td{padding:5px 8px;font-size:14pt;border:none;vertical-align:top;line-height:1.5;}
.cus-elem-form .label{font-family:Arial,sans-serif;font-size:14pt;}
.cus-elem-form .value{font-family:Arial,sans-serif;font-size:14pt;}
/* Doc Cards */
.sd-docs .doc-cards{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center;}
.sd-docs .doc-card{background:#fff;border:2px solid var(--border);border-radius:4px;padding:4px 8px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;height:10mm;min-width:20mm;font-size:11px;font-weight:600;white-space:nowrap;}
.sd-docs .doc-card:hover{border-color:var(--primary);box-shadow:0 1px 4px rgba(37,99,235,.1);}
.sd-docs .doc-card.active{border-color:var(--primary);background:#eff6ff;}
.sd-docs .doc-card .doc-icon{font-size:14px;}
.sd-docs .doc-card .doc-name{font-size:11px;font-weight:600;}
.sd-docs .doc-print-btn{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600;height:10mm;display:inline-flex;align-items:center;gap:4px;transition:background .15s;}
.sd-docs .doc-print-btn:hover{background:var(--primary-dark);}
/* Print */
@media print{
  .app-layout,.tab-bar,.tab-content,.pl-toolbar,.doc-cards,.doc-print-btn,.doc-print-group{display:none!important;}
  #printArea{display:block!important;margin:0;padding:0;position:relative;}
  body{background:#fff;margin:0;padding:0;}
  html,body,#printArea{height:auto!important;min-height:0!important;overflow:visible!important;}
  @page landscape-page{size:A4 landscape;margin:0;}
  @page portrait-page{size:A4 portrait;margin:0;}
  .print-doc-landscape{page:landscape-page;margin:0;padding:0;page-break-after:auto;page-break-inside:auto;}
  .print-doc-portrait{page:portrait-page;margin:0;padding:0;page-break-after:auto;page-break-inside:auto;}
  /* 分页：仅在非第一页前插入分页符 */
  .print-doc-landscape + .print-doc-landscape,
  .print-doc-landscape + .print-doc-portrait,
  .print-doc-portrait + .print-doc-landscape,
  .print-doc-portrait + .print-doc-portrait{page-break-before:always;}
  .page-break{display:none!important;}
  .pl-table,.inv-table,.cus-table,.cus-decl-table{page-break-inside:auto;}
  .pl-table tr,.inv-table tr{page-break-inside:avoid;}
  .company-name,.inv-company{page-break-after:avoid;}
  /* 内层缩放 + 边距容器（zoom 改变布局尺寸，分页计算正确） */
  .inner-cus-landscape{zoom:0.6;margin:10mm 15mm;}
  .inner-cus-portrait{zoom:0.6;margin:15mm 20mm;}
  .inner-decl-landscape{zoom:0.7;margin:7mm 10mm;}
  .inner-decl-portrait{zoom:0.7;margin:12mm 15mm;}
}
#printArea{display:none;margin:0;padding:0;}
/* Modal (renamed to avoid conflict with App.modal system) */
.sd-docs .sd-modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.sd-docs .sd-modal-overlay.show{display:flex;}
.sd-docs .sd-modal{background:#fff;border-radius:8px;padding:20px;max-width:400px;width:90%;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.sd-docs .sd-modal h3{margin-bottom:12px;font-size:15px;}
.sd-docs .sd-modal p{font-size:13px;color:var(--text-light);margin-bottom:16px;}
.sd-docs .sd-modal-actions{display:flex;gap:8px;justify-content:flex-end;}
/* Style Entry (multi-style collapsible) */
.sd-docs .style-entry{background:#f8fafc;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;}
.sd-docs .style-entry-header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#eef2ff;cursor:pointer;border-bottom:1px solid var(--border);}
.sd-docs .style-entry-header:hover{background:#e0e7ff;}
.sd-docs .style-entry-toggle{background:none;border:none;font-size:12px;cursor:pointer;color:var(--primary);font-weight:700;width:18px;text-align:center;}
.sd-docs .style-entry-title{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.sd-docs .style-entry-title .sub{font-size:11px;font-weight:500;color:var(--text-light);margin-left:6px;}
.sd-docs .style-entry-body{padding:10px;}
.sd-docs .style-entry-body.collapsed{display:none;}
.sd-docs .sub-section{background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px;margin-bottom:8px;}
.sd-docs .sub-section .section-title{font-size:12px;margin-bottom:8px;padding-bottom:5px;display:flex;align-items:center;gap:6px;}
.sd-docs .style-entry-header .se-del{margin-left:auto;}
.sd-docs .style-entry .section-title{display:flex;align-items:center;gap:6px;}
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-area">
    <div class="app-header">
      <button class="header-toggle">☰</button>
      <span class="header-title">出运管理</span>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="App.backupData()">📦</button>
        <div class="header-user"><span>👤</span><span class="user-name">管理员</span></div>
        <button class="btn btn-sm" onclick="App.logout()">🚪</button>
      </div>
    </div>
    <div class="app-content">
      <!-- TOP-LEVEL TABS -->
      <div class="tabs">
        <div class="tab-item active" onclick="switchMainTab('records', this)">📦 出运记录</div>
        <div class="tab-item" onclick="switchMainTab('docs', this)">📄 出运文件</div>
      </div>

      <!-- TAB 1: 出运记录 (existing shipping.html content) -->
      <div id="main-tab-records" class="main-tab-content">
        <!-- 统计卡片 -->
        <div class="stat-grid" id="statCards"></div>

        <!-- 筛选栏（始终显示） -->
        <div class="filter-bar">
          <div class="search-input">
            <input type="text" id="searchInput" class="form-input" placeholder="搜索单号/款号/订单/目的港/发票号/客户/集装箱/提单号" oninput="renderTable()">
          </div>
          <select id="statusFilter" class="form-select" onchange="renderTable()">
            <option value="">全部状态</option>
            <option value="待出运">待出运</option>
            <option value="已装柜">已装柜</option>
            <option value="已出运">已出运</option>
            <option value="已到港">已到港</option>
          </select>
          <select id="shipMethodFilter" class="form-select" onchange="renderTable()">
            <option value="">全部运输</option>
            <option value="海运">海运</option>
            <option value="空运">空运</option>
            <option value="陆运">陆运</option>
          </select>
          <button class="btn btn-sm" onclick="resetFilter()" title="重置筛选">🔄</button>
        </div>

        <!-- 普通记录表格区域 -->
        <div class="table-wrap" id="normalTableWrap">
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">出运记录</span>
            </div>
          </div>
          <div id="shipTable"></div>
        </div>

        <!-- PL records 卡片容器 (sd-docs 作用域内以保留 record-card 样式) -->
        <div class="table-wrap" style="margin-top:12px;display:none;" id="plCardsWrap">
          <div class="sd-docs">
            <div id="recordsContainer"></div>
          </div>
        </div>
      </div>

      <!-- TAB 2: 出运文件 (shipping documents content) -->
      <div id="main-tab-docs" class="main-tab-content" style="display:none;">
        <div class="sd-docs">

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('entry')"><span class="icon">✏</span>数据录入</button>
  <button class="tab-btn" onclick="switchTab('docs')"><span class="icon">📄</span>报关和清关文件</button>
</div>

<!-- Tab 1: Data Entry -->
<div id="tab-entry" class="tab-content active">
  <!-- A. 共用信息区 -->
  <div class="section">

<script>
// ==================== Main Tab Switching ====================
function switchMainTab(tab, el) {
  const items = document.querySelectorAll('.app-content > .tabs .tab-item');
  items.forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  else { const idx = tab === 'records' ? 0 : 1; if (items[idx]) items[idx].classList.add('active'); }
  document.getElementById('main-tab-records').style.display = tab === 'records' ? '' : 'none';
  document.getElementById('main-tab-docs').style.display = tab === 'docs' ? '' : 'none';
}

// ==================== 出运记录 (Shipping Records) ====================
// ===== 状态变量 =====
let filterState = { search: '', status: '', packType: '', shipMethod: '' };

// ===== 包装方式颜色映射 =====
const packTypeColors = { '挂衣': '#0d9488', '纸箱包装': '#6d28d9' };
const shipMethodColors = { '海运': '#004D6D', '空运': '#d9883a', '陆运': '#2d9d5f' };

// ===== 出运状态自定义映射 =====
const shipStatusMap = {
  '待出运': 'tag-gray',
  '已装柜': 'tag-orange',
  '已出运': 'tag-blue',
  '已到港': 'tag-green',
};

// ===== 数据获取 =====
function getShippings() {
  return App.store.get('shippings', []);
}
function getOrders() {
  const v = App.store.get('orders', []);
  return Array.isArray(v) ? v : [];
}
function getStyles() {
  const v = App.store.get('styles', []);
  return Array.isArray(v) ? v : [];
}
function getCustomers() {
  const v = App.store.get('customers', []);
  return Array.isArray(v) ? v : [];
}

// 获取货代公司（从通讯录中筛选类型为货代的）
function getForwarders() {
  const contacts = App.store.get('contacts', []);
  const arr = Array.isArray(contacts) ? contacts : [];
  return arr.filter(c => c.type === '货代');
}

// 获取客户名称
function getCustomerName(customerId) {
  const customers = getCustomers();
  const c = customers.find(c => c.id === customerId);
  return c ? c.name : customerId || '-';
}

// 获取款名
function getStyleName(styleNo) {
  const styles = getStyles();
  const s = styles.find(s => s.styleNo === styleNo);
  return s ? s.styleName : '-';
}

// 生成出运单号
function genShipNo() {
  const ships = getShippings();
  let maxNum = 0;
  ships.forEach(s => {
    const match = s.shipNo && s.shipNo.match(/SH-(\d+)/);
    if (match) {
      const num = parseInt(match[1]);
      if (num > maxNum) maxNum = num;
    }
  });
  const nextNum = String(maxNum + 1).padStart(4, '0');
  return `SH-${nextNum}`;
}

// ===== 包装方式标签 =====
function packTypeTag(v) {
  if (!v) return '<span class="text-muted">-</span>';
  const color = packTypeColors[v] || '#6b7280';
  return `<span class="tag" style="background:${color}1a;color:${color};border:1px solid ${color}33;">${App.utils.escapeHtml(v)}</span>`;
}

// ===== 运输方式标签 =====
function shipMethodTag(v) {
  if (!v) return '<span class="text-muted">-</span>';
  const color = shipMethodColors[v] || '#6b7280';
  return `<span class="tag" style="background:${color}1a;color:${color};border:1px solid ${color}33;">${App.utils.escapeHtml(v)}</span>`;
}

// ===== 渲染统计卡片 =====
function renderStats() {
  const ships = getShippings();
  const total = ships.length;
  const pending = ships.filter(s => calcShipStatus(s) === '待出运').length;
  const loaded = ships.filter(s => calcShipStatus(s) === '已装柜').length;
  const shipped = ships.filter(s => calcShipStatus(s) === '已出运').length;
  const arrived = ships.filter(s => calcShipStatus(s) === '已到港').length;

  const cards = [
    { icon: '🚢', bg: '#e8f1f5', color: '#004D6D', label: '出运总数', value: total, sub: '全部出运记录' },
    { icon: '📦', bg: '#f1f5f9', color: '#64748b', label: '待出运', value: pending, sub: '等待装柜出运' },
    { icon: '📋', bg: '#fff8ed', color: '#d9883a', label: '已装柜', value: loaded, sub: '已装柜待出运' },
    { icon: '✈️', bg: '#e8f1f5', color: '#004D6D', label: '已出运', value: shipped, sub: '运输在途中' },
    { icon: '✅', bg: '#ecfdf5', color: '#2d9d5f', label: '已到港', value: arrived, sub: '已到达目的港' },
  ];

  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg};color:${c.color};">${c.icon}</div>
      <div class="stat-info">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value" style="color:${c.color};">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    </div>
  `).join('');
}

// ===== 重置筛选 =====
function resetFilter() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('shipMethodFilter').value = '';
  renderTable();
}

// ===== 根据日期自动计算状态 =====
function calcShipStatus(rec) {
  if (rec.actualArrival) return '已到港';
  if (rec.etd) return '已出运';
  if (rec.loadingDate) return '已装柜';
  return '待出运';
}

// ===== 获取筛选后数据 =====
function getFilteredShips() {
  const ships = getShippings();
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const shipMethod = document.getElementById('shipMethodFilter').value;

  return App.utils.sortByDateDesc(ships.filter(s => {
    if (search) {
      const fields = s.source === 'pl'
        ? [s.shipNo, s.styleNo, s.orderNo, s.destinationPort, s.customerName, s.blNo, s.containerNo, s.buyer, s.poNo, s.style, s.itemDesc, s.invoiceNo, s.etd, s.forwarder, s.loadingPort, s.customsNo]
        : [s.shipNo, s.styleNo, s.orderNo, s.destinationPort, s.customerName, s.blNo, s.containerNo];
      const matches = fields.some(v => (v || '').toString().toLowerCase().includes(search));
      if (!matches) return false;
    }
    if (status && calcShipStatus(s) !== status) return false;
    if (shipMethod && s.shipMethod !== shipMethod) return false;
    return true;
  }), ['loadingDate', 'eta', 'actualArrival', 'createDate', 'createDate']);
}

// ===== 渲染：普通记录表格 + PL 记录卡片 =====
function renderTable() {
  const all = getFilteredShips();
  const normal = all.filter(s => s.source !== 'pl');
  const plRows = all.filter(s => s.source === 'pl');

  // 无普通记录时隐藏表格区域，仅显示 PL 卡片
  const tableWrap = document.getElementById('normalTableWrap');
  if (normal.length === 0) {
    tableWrap.style.display = 'none';
  } else {
    tableWrap.style.display = '';
    // 渲染普通出运记录表格
    App.renderTable('shipTable', {
    columns: [
      { key: 'shipNo', title: '出运单号', width: '120px', render: (v) => `<strong>${App.utils.escapeHtml(v)}</strong>` },
      { key: 'orderNo', title: '订单号', width: '130px' },
      { key: 'styleNo', title: '款号', width: '140px' },
      { key: 'customerName', title: '客户', width: '120px', render: (v) => App.utils.escapeHtml(v || '-') },
      { key: 'packType', title: '包装方式', width: '100px', render: (v) => packTypeTag(v) },
      { key: 'quantity', title: '出运数量', width: '90px', render: (v) => v ? Number(v).toLocaleString() : '-' },
      { key: 'packCount', title: '箱数/杆数', width: '90px', render: (v, row) => {
        if (!v) return '-';
        return row.packType === '挂衣' ? `${v}杆` : `${v}箱`;
      }},
      { key: 'volume', title: '体积(CBM)', width: '90px', render: (v) => v || '-' },
      { key: 'grossWeight', title: '毛重(KGS)', width: '100px', render: (v) => v || '-' },
      { key: 'shipMethod', title: '运输方式', width: '80px', render: (v) => shipMethodTag(v) },
      { key: 'destinationPort', title: '目的港', width: '120px', render: (v) => App.utils.escapeHtml(v || '-') },
      { key: 'status', title: '状态', width: '80px', render: (v, row) => App.statusTag(calcShipStatus(row), shipStatusMap) },
    ],
    data: normal,
    actions: (row) => `
      <button class="btn btn-sm" title="编辑" onclick="openForm('${row.id}')">✏️</button>
      <button class="btn btn-sm btn-danger" title="删除" onclick="deleteShip('${row.id}')">🗑️</button>
    `
  });
  }

  // 渲染 PL 卡片
  const wrap = document.getElementById('plCardsWrap');
  const hasSearch = document.getElementById('searchInput').value.trim() || document.getElementById('statusFilter').value || document.getElementById('shipMethodFilter').value;
  if (plRows.length === 0 && normal.length === 0) {
    wrap.style.display = '';
    const emptyMsg = hasSearch
      ? '<div class="empty-state"><div class="icon">🔍</div><div>未找到匹配的记录</div><div style="font-size:12px;margin-top:6px;">请尝试修改搜索条件或重置筛选</div></div>'
      : '<div class="empty-state"><div class="icon">📦</div><div>暂无出运记录</div><div style="font-size:12px;margin-top:6px;">请前往「出运文件」录入装箱数据</div></div>';
    document.getElementById('recordsContainer').innerHTML = emptyMsg;
    return;
  }
  if (plRows.length === 0) {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = '';
  const container = document.getElementById('recordsContainer');
  container.innerHTML = '<div class="cards-grid">';
  plRows.forEach(rec => {
    const date = new Date(rec.createDate || rec.createdAt || Date.now()).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const plId = rec.plRefId || rec.id;
    const colors = (rec.plColors || []).join(', ') || '-';
    // 计算总箱数：优先用 totalCtn，否则从 PL 原始记录中重新计算
    let totalCtn = rec.totalCtn;
    if (totalCtn === undefined) {
      const plRec = records.find(r => r.id === plId);
      if (plRec) {
        const allCartons = (plRec.styleEntries || []).flatMap(e => e.cartons || []);
        totalCtn = allCartons.reduce((s, c) => s + (parseInt(c.ctnNum) || 0), 0);
      } else {
        totalCtn = rec.packCount || 0;
      }
    }
    // ETD日期：优先用 rec.etd，否则从 PL 原始记录中读取
    let etdVal = rec.etd;
    if (!etdVal) {
      const plRec = records.find(r => r.id === plId);
      if (plRec) etdVal = plRec.etd || '';
    }
    // 自动计算状态
    const shipStatus = calcShipStatus(rec);
    const statusStyles = {
      '待出运': { bg: '#f1f5f9', color: '#64748b', border: '#cbd5e1' },
      '已装柜': { bg: '#fff8ed', color: '#d9883a', border: '#fdba74' },
      '已出运': { bg: '#eff6ff', color: '#2563eb', border: '#93c5fd' },
      '已到港': { bg: '#ecfdf5', color: '#16a34a', border: '#86efac' },
    };
    const ss = statusStyles[shipStatus] || statusStyles['待出运'];
    const card = document.createElement('div');
    card.className = 'record-card';
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-style">${(rec.styleNo || rec.style || '未命名') + (rec.invoiceNo ? ` · ${rec.invoiceNo}` : '')}</div>
          <div style="font-size:11px;color:var(--text-light);margin-top:2px;">${rec.buyerFull || rec.buyer || rec.customerName || ''} · ${rec.poNo || rec.orderNo || ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <span style="display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;background:${ss.bg};color:${ss.color};border:1px solid ${ss.border};">${shipStatus}</span>
          <div class="card-date">${date}</div>
        </div>
      </div>
      <div class="card-info">
        <div><div class="label">商品描述</div><div class="value">${rec.itemDesc || '-'}</div></div>
        <div><div class="label">颜色</div><div class="value">${colors}</div></div>
        <div><div class="label">ETD日期</div><div class="value">${etdVal || '-'}</div></div>
        <div><div class="label">箱数</div><div class="value">${totalCtn}</div></div>
      </div>
      <div class="card-stats">
        <div class="stat"><div class="num">${rec.totalOrderQty||0}</div><div class="lbl">订单数量</div></div>
        <div class="stat"><div class="num">${rec.totalActualQty||rec.quantity||0}</div><div class="lbl">实际数量</div></div>
        <div class="stat"><div class="num" style="color:var(--warning);">${rec.variation||0}</div><div class="lbl">短溢装</div></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();generateDoc('${plId}')">📄 生成DOC</button>
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();loadRecordForEdit('${plId}')">✏ 编辑</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteShip('${rec.id}')">🗑</button>
      </div>
    `;
    container.querySelector('.cards-grid').appendChild(card);
  });
}

  if (packType === '纸箱包装') {

  }
}

// ===== 选择订单时自动带出款号、客户、数量 =====
function onOrderChange() {
  const orderNo = document.getElementById('f_orderNo').value;
  if (!orderNo) return;

  const orders = getOrders();
  const order = orders.find(o => o.orderNo === orderNo);
  if (!order) return;

  // 带出款号
  if (order.styleNo) {
    document.getElementById('f_styleNo').value = order.styleNo;
  }
  // 带出客户名称
  if (order.customerId) {
    document.getElementById('f_customerName').value = getCustomerName(order.customerId);
  }
  // 带出数量
  if (order.quantity && !document.getElementById('f_quantity').value) {
    document.getElementById('f_quantity').value = order.quantity;
  }
}

function saveForm(id) {
  const shipNo = document.getElementById('f_shipNo').value.trim();
  const packType = document.getElementById('f_packType').value;

  if (!shipNo) { App.toast('请输入出运单号', 'error'); return; }
  if (!packType) { App.toast('请选择包装方式', 'error'); return; }

  const data = {
    shipNo,
    orderNo: document.getElementById('f_orderNo').value,
    styleNo: document.getElementById('f_styleNo').value,
    customerName: document.getElementById('f_customerName').value.trim(),
    packType,
    quantity: document.getElementById('f_quantity').value.trim(),
    cartonCount: document.getElementById('f_cartonCount').value.trim(),
    piecesPerCarton: document.getElementById('f_piecesPerCarton').value.trim(),
    cartonSize: document.getElementById('f_cartonSize').value.trim(),
    hangerBars: document.getElementById('f_hangerBars').value.trim(),
    piecesPerBar: document.getElementById('f_piecesPerBar').value.trim(),
    volume: document.getElementById('f_volume').value.trim(),
    grossWeight: document.getElementById('f_grossWeight').value.trim(),
    shipMethod: document.getElementById('f_shipMethod').value,
    forwarder: document.getElementById('f_forwarder').value,
    loadingPort: document.getElementById('f_loadingPort').value.trim(),
    destinationPort: document.getElementById('f_destinationPort').value.trim(),
    containerNo: document.getElementById('f_containerNo').value.trim(),
    blNo: document.getElementById('f_blNo').value.trim(),
    customsNo: document.getElementById('f_customsNo').value.trim(),
    loadingDate: document.getElementById('f_loadingDate').value,
    eta: document.getElementById('f_eta').value,
    actualArrival: document.getElementById('f_actualArrival').value,
    status: document.getElementById('f_status').value,
    remarks: document.getElementById('f_remarks').value.trim(),
    // 统一packCount字段用于表格显示
    packCount: packType === '挂衣'
      ? document.getElementById('f_hangerBars').value.trim()
      : document.getElementById('f_cartonCount').value.trim(),
  };

  const ships = getShippings();

  if (id) {
    const idx = ships.findIndex(s => s.id === id);
    if (idx >= 0) {
      ships[idx] = { ...ships[idx], ...data };
    }
    App.toast('出运记录更新成功', 'success');
  } else {
    ships.push({ id: App.utils.genId('SH'), ...data, createDate: App.utils.today() });
    App.toast('出运记录创建成功', 'success');
  }

  App.store.set('shippings', ships);
  App.modal.close();
  renderAll();
}

// ===== 删除 =====
function deleteShip(id) {
  const ships = getShippings();
  const target = ships.find(s => s.id === id);
  const msg = target && target.source === 'pl' ? '确定要删除此装箱单记录吗？同时会删除出运文件中的原始数据。' : '确定要删除此出运记录吗？';
  App.confirm(msg, () => {
    let ships2 = getShippings();
    // 如果是 PL 来源，同时清理 pl_records_v1
    if (target && target.source === 'pl' && target.plRefId) {
      records = records.filter(r => r.id !== target.plRefId);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }
    ships2 = ships2.filter(s => s.id !== id);
    App.store.set('shippings', ships2);
    App.toast('记录已删除', 'success');
    renderAll();
  });
}

    id: 'se_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    style: '', poNo: '', itemDesc: '',
    fullDesc: '', unitPrice: 0, hangingFee: 1.10,

function renderStyleEntries() {
  const container = document.getElementById('styleEntriesContainer');
  if (!container) return;
  container.innerHTML = '';
  if (styleEntries.length === 0) {
    styleEntries.push(makeEmptyEntry());
  }
  styleEntries.forEach((entry, idx) => {
    container.appendChild(createStyleEntryElement(entry, idx));
  });
  // DOM 已挂载，现在渲染尺码标签、订单数量表和装箱明细表
  styleEntries.forEach((entry, idx) => {
    // 先渲染尺码标签和订单数量表（依赖DOM元素存在）
    renderSizeTags(idx);
    renderOrderQtyTable(idx);
    // 再渲染装箱明细表头
    renderCartonTable(idx);
    // 填充数据行
    const bodyEl = document.getElementById('se-cartonBody-' + idx);
    if (!bodyEl) return;
    bodyEl.innerHTML = '';
    if (entry.cartons && entry.cartons.length > 0) {
      entry.cartons.forEach(c => addCartonRow(idx, c));
    } else {
      addCartonRow(idx);
    }
  });
  recalculateAll();
}

function addStyleEntry(data) {
  syncEntriesFromDOM();

  renderStyleEntries();

function removeStyleEntry(idx) {
  if (styleEntries.length <= 1) { showToast('至少需要保留一个款号条目', 'error'); return; }
  syncEntriesFromDOM();
  styleEntries.splice(idx, 1);
  renderStyleEntries();
}

function toggleStyleEntry(idx) {
  const body = document.getElementById('se-body-' + idx);
  if (!body) return;
  const collapsed = body.classList.toggle('collapsed');
  const toggle = document.querySelector('#style-entry-' + idx + ' .style-entry-toggle');
  if (toggle) toggle.textContent = collapsed ? '▶' : '▼';
}

// 通用更新辅助：同步输入到 styleEntries[idx]，可选触发重算
function seUpdate(idx, field, value, recalc) {
  if (styleEntries[idx]) styleEntries[idx][field] = value;
  // 报关单价 = 单价 + 衣架费
  if (field === 'unitPrice' || field === 'hangingFee') {
    const up = parseFloat(styleEntries[idx].unitPrice) || 0;
    const hf = parseFloat(styleEntries[idx].hangingFee) || 0;
    const cp = (up + hf).toFixed(2);
    styleEntries[idx].customsPrice = parseFloat(cp);
    const cpEl = document.getElementById('se-customsPrice-' + idx);
    if (cpEl) cpEl.value = cp;
  }
  if (recalc) recalculateAll();
}

// 在重新渲染前，把当前 DOM 中的输入回写到 styleEntries，避免数据丢失
function syncEntriesFromDOM() {
  const fields = ['style','poNo','itemDesc','fullDesc','unitPrice','hangingFee','hsCode','cnName','customsPrice','weaveMethod','declCategory','declGender','compositionCn','fullOpen','hasZipper','declBrand','customsItemNo'];
  styleEntries.forEach((entry, idx) => {
    fields.forEach(f => {
      const el = document.getElementById('se-' + f + '-' + idx);
      if (el) entry[f] = el.value;
    });
    entry.unitPrice = parseFloat(entry.unitPrice) || 0;
    entry.hangingFee = parseFloat(entry.hangingFee) || 0;
    entry.customsPrice = parseFloat(entry.customsPrice) || 0;
    entry.orderQty = entry.orderQty || {};
    (entry.sizes || []).forEach((s, i) => {
      const el = document.getElementById('se-orderQty-' + idx + '-' + i);
      if (el) entry.orderQty[s] = parseInt(el.value) || 0;
    });
    entry.cartons = collectEntryCartons(idx);
  });
}

// 收集指定款号条目的装箱明细（从 DOM 读取）
function collectEntryCartons(idx) {
  const body = document.getElementById('se-cartonBody-' + idx);
  if (!body) return [];
  const arr = [];
  body.querySelectorAll('tr').forEach(row => {
    const sizesData = {};
    row.querySelectorAll('.ctn-size').forEach(inp => {
      sizesData[inp.dataset.size] = parseInt(inp.value) || 0;
    });
    arr.push({
      from: parseInt(row.querySelector('.ctn-from')?.value) || 0,
      to: parseInt(row.querySelector('.ctn-to')?.value) || 0,
      code: row.querySelector('.ctn-code')?.value || '',
      color: row.querySelector('.ctn-color')?.value || '',
      sizes: sizesData,
      perCtn: parseInt(row.querySelector('.ctn-per')?.value) || 0,
      ctnNum: parseInt(row.querySelector('.ctn-num')?.value) || 0,
      totalQty: parseInt(row.querySelector('.ctn-total')?.value) || 0,
      grossPer: parseFloat(row.querySelector('.ctn-gross')?.value) || 0,
      netPer: parseFloat(row.querySelector('.ctn-net')?.value) || 0,
      grossTotal: parseFloat(row.querySelector('.ctn-gross-total')?.value) || 0,
      netTotal: parseFloat(row.querySelector('.ctn-net-total')?.value) || 0,
      dimL: parseFloat(row.querySelector('.ctn-dimL')?.value) || 0,
      dimW: parseFloat(row.querySelector('.ctn-dimW')?.value) || 0,
      dimH: parseFloat(row.querySelector('.ctn-dimH')?.value) || 0,
      volume: parseFloat(row.querySelector('.ctn-vol')?.value) || 0,
    });
  });
  return arr;
}

function onEntryStyleChange(idx) {
  const entry = styleEntries[idx];
  if (!entry) return;
  const styleVal = document.getElementById('se-style-' + idx).value.trim();
  entry.style = styleVal;
  const titleEl = document.getElementById('se-title-' + idx);
  if (titleEl) titleEl.textContent = styleVal || '未命名款号';
  if (!styleVal) {
    entry.poNo = ''; entry.itemDesc = '';
    const poEl = document.getElementById('se-poNo-' + idx); if (poEl) poEl.value = '';
    const descEl = document.getElementById('se-itemDesc-' + idx); if (descEl) descEl.value = '';
    recalculateAll();
    return;
  }
  const orders = getOrders();
  const matched = orders.filter(o => o.styleNo === styleVal);
  if (matched.length === 0) {
    showToast('未在订单管理中找到款号: ' + styleVal, 'error');
    // 清理旧数据，保留已有尺码和装箱数据不变
  } else {
    const poNos = [];
    let firstDesc = '';
    let firstUnitPrice = 0;
    let mergedSizes = new Set();
    let mergedQty = {};
    matched.forEach(o => {
      if (o.orderNo && !poNos.includes(o.orderNo)) poNos.push(o.orderNo);
      if (!firstDesc && o.styleDescription) firstDesc = o.styleDescription;
      if (!firstUnitPrice && o.unitPrice) firstUnitPrice = parseFloat(o.unitPrice) || 0;
      // 收集尺码和数量
      if (o.sizeMatrix && o.sizeMatrix.sizes) {
        o.sizeMatrix.sizes.forEach(s => mergedSizes.add(s));
      }
      if (o.sizeMatrix && o.sizeMatrix.rows) {
        const isSolid = (o.type === 'SOLID');
        o.sizeMatrix.rows.forEach(row => {
          if (row.quantities) {
            const ctns = isSolid ? 1 : (parseInt(row.noOfCartons) || 1);
            Object.keys(row.quantities).forEach(size => {
              mergedSizes.add(size);
              mergedQty[size] = (mergedQty[size] || 0) + (parseInt(row.quantities[size]) || 0) * ctns;
            });
          }
        });
      }
    });
    // 填充基本信息
    entry.poNo = poNos.join(', ');
    entry.itemDesc = firstDesc;
    const poEl = document.getElementById('se-poNo-' + idx); if (poEl) poEl.value = entry.poNo;
    const descEl = document.getElementById('se-itemDesc-' + idx); if (descEl) descEl.value = entry.itemDesc;
    // 填充发票信息 - 单价
    if (firstUnitPrice) {
      entry.unitPrice = firstUnitPrice;
      const upEl = document.getElementById('se-unitPrice-' + idx); if (upEl) upEl.value = firstUnitPrice;
    }
    // 报关单价 = 单价 + 衣架费
    const up = parseFloat(entry.unitPrice) || 0;
    const hf = parseFloat(entry.hangingFee) || 0;
    entry.customsPrice = parseFloat((up + hf).toFixed(2));
    const cpEl = document.getElementById('se-customsPrice-' + idx); if (cpEl) cpEl.value = entry.customsPrice;
    // 货号 = 款号
    entry.customsItemNo = styleVal;
    const cinoEl = document.getElementById('se-customsItemNo-' + idx); if (cinoEl) cinoEl.value = styleVal;
    // 填充尺码和订单数量
    if (mergedSizes.size > 0) {
      // 保留已有的装箱数据（若有）
      const existingCartons = entry.cartons && entry.cartons.length > 0
        ? entry.cartons
        : null;
      entry.sizes = sortSizes(Array.from(mergedSizes));
      entry.orderQty = mergedQty;
      renderSizeTags(idx);
      renderOrderQtyTable(idx);
      renderCartonTable(idx);
      // 重建表格后重新填入装箱数据
      const bodyEl = document.getElementById('se-cartonBody-' + idx);
      if (bodyEl) {
        bodyEl.innerHTML = '';
        if (existingCartons) {
          existingCartons.forEach(c => addCartonRow(idx, c));
        } else {
          addCartonRow(idx);
        }
      }
    }
  }
  recalculateAll();
}

  // （它们使用 document.getElementById 查找元素，未挂载时找不到）
  return wrap;
}

function toggleBankEdit() {
  const btn = document.getElementById('bankEditBtn');
  if (btn.textContent === '修改') {
    const pwd = prompt('请输入密码以修改银行信息：');
    if (pwd === null) return;
    if (pwd !== '2601') { showToast('密码错误', 'error'); return; }
    BANK_FIELD_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.removeAttribute('readonly'); el.style.background = ''; el.style.color = ''; }
    });
    btn.textContent = '锁定';
    btn.classList.remove('btn-outline');
    btn.classList.add('btn-warning');
  } else {
    lockBankFields();
  }
}

function lockBankFields() {
  const btn = document.getElementById('bankEditBtn');
  BANK_FIELD_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.setAttribute('readonly', ''); el.style.background = '#f8fafc'; el.style.color = 'var(--text-light)'; }
  });
  if (btn) { btn.textContent = '修改'; btn.classList.remove('btn-warning'); btn.classList.add('btn-outline'); }
}

// ==================== Size Management (per style entry) ====================

// 尺码排序权重表（字母尺码）
const SIZE_ALPHA_ORDER = {
  'XXXS': -3, 'XXS': -2, 'XS': -1,
  'S': 0, 'M': 1, 'L': 2,
  'XL': 3, 'XXL': 4, 'XXXL': 5, 'XXXXL': 6,
  '2XL': 4, '3XL': 5, '4XL': 6, '5XL': 7,
  'T': -10, '2T': -9, '3T': -8, '4T': -7, '5T': -6, '6T': -5,
  '0M': -15, '3M': -14, '6M': -13, '9M': -12, '12M': -11, '18M': -10, '24M': -9,
  'FREE': 999, 'F': 999
};

/**
 * 智能尺码排序函数
 * 支持格式：纯数字(34,36)、数字+单位(34cm)、字母(XS,S,M,L,XL)、数字/字母(1/S,2/M)、童装(2T,3T)
 * @param {Array} sizes - 尺码数组
 * @returns {Array} - 排序后的尺码数组
 */
function sortSizes(sizes) {
  if (!sizes || !Array.isArray(sizes)) return [];

  const getSortKey = (size) => {
    if (!size) return [9999, 9999, ''];
    const s = String(size).trim().toUpperCase();

    // 格式0: 先处理数字+字母的混合尺码 (如 2XL, 3XL, 4XL, 5XL 等)，避免被当成纯数字排序
    const alphaNumMatch = s.match(/^(\d+)(XS|S|M|L|XL)$/i);
    if (alphaNumMatch) {
      const alpha = alphaNumMatch[2];
      const num = parseInt(alphaNumMatch[1]);
      let weight;
      if (alpha === 'XL') {
        // 特殊: 2XL ~= XXL(4), 3XL ~= XXXL(5), 4XL ~= XXXXL(6), 5XL(7)
        // 数字 N + XL = 权重 N + 2
        weight = num + 2;
      } else if (alpha === 'L') {
        // 理论上不会有 2L，但处理一下：数字 + L = 权重 N + 2 - 1? 不做特殊处理
        weight = SIZE_ALPHA_ORDER[alpha] !== undefined ? SIZE_ALPHA_ORDER[alpha] : 2;
      } else {
        weight = SIZE_ALPHA_ORDER[alpha] !== undefined ? SIZE_ALPHA_ORDER[alpha] : 0;
      }
      // 加 0.01*num：让 nXL 比同级别标准写法(XXL)稍微靠后一点，即 XXL < 2XL
      return [1000 + weight + num * 0.001, 0, s];
    }

    // 格式1: 纯数字或数字+单位 (如 34, 36, 34cm, 110, 120, 130)
    const numMatch = s.match(/^(\d+(?:\.\d+)?)/);
    if (numMatch) {
      const num = parseFloat(numMatch[1]);
      // 检查是否是 0/XS, 1/S 这种前缀数字的格式
      const restMatch = s.match(/^\d+\/?([A-Z]+)$/);
      if (restMatch) {
        const alpha = restMatch[1];
        const alphaWeight = SIZE_ALPHA_ORDER[alpha] !== undefined ? SIZE_ALPHA_ORDER[alpha] : 50;
        // 使用与纯字母尺码相同的 1000+ 基准范围，避免纯数字(如0)被当作最小尺码排在最前面
        // 数字部分作为微调：0/XS 与 纯XS接近，0/XS 略小于 纯XS（排在左边）
        // 这样 XXS(-2→998) < 0/XS(-1→999+微调) < XS(-1→999) < 1/S(0→1000+微调) < S(0→1000)
        return [1000 + alphaWeight + num * 0.001 - 0.0001, 0, s];
      }
      // 检查是否是 2T, 3T 等童装尺码
      const tMatch = s.match(/^\d+T$/);
      if (tMatch) {
        return [num + (SIZE_ALPHA_ORDER['2T'] || -9), 0, s];
      }
      return [num, 0, s];
    }

    // 格式2: 纯字母 (XS, S, M, L, XL, XXL, FREE)
    const pureAlpha = s.replace(/[^A-Z0-9]/g, '');
    if (SIZE_ALPHA_ORDER[pureAlpha] !== undefined) {
      return [1000 + SIZE_ALPHA_ORDER[pureAlpha], 0, s];
    }
    if (SIZE_ALPHA_ORDER[s] !== undefined) {
      return [1000 + SIZE_ALPHA_ORDER[s], 0, s];
    }

    // 格式3: 字母开头 (如 S-M 等复合)
    for (const key of Object.keys(SIZE_ALPHA_ORDER).sort((a, b) => b.length - a.length)) {
      if (s.startsWith(key)) {
        return [1000 + SIZE_ALPHA_ORDER[key], 0, s];
      }
    }

    // 其他：按字符串排序，放在后面
    return [9000, 0, s];
  };

  return [...sizes].sort((a, b) => {
    const ka = getSortKey(a);
    const kb = getSortKey(b);
    if (ka[0] !== kb[0]) return ka[0] - kb[0];
    if (ka[1] !== kb[1]) return ka[1] - kb[1];
    return ka[2].localeCompare(kb[2]);
  });
}

function renderSizeTags(idx) {
  const c = document.getElementById('se-size-tags-' + idx);
  if (!c) return;
  const entry = styleEntries[idx];
  const sizes = entry ? (entry.sizes || []) : [];
  c.innerHTML = '';
  sizes.forEach((s, i) => {
    const tag = document.createElement('span');
    tag.className = 'size-tag';
    tag.innerHTML = `${s} <span class="remove" onclick="removeSize(${i},${idx})">×</span>`;
    c.appendChild(tag);
  });
}

function addSize(idx) {
  const inp = document.getElementById('se-newSize-' + idx);
  if (!inp) return;
  const val = inp.value.trim();
  const entry = styleEntries[idx];
  if (!entry) return;
  if (val && !(entry.sizes || []).includes(val)) {
    entry.sizes = entry.sizes || [];
    entry.sizes.push(val);
    // 新增后自动按尺码大小排序
    entry.sizes = sortSizes(entry.sizes);
    inp.value = '';
    // 保留已有的装箱数据
    const existingCartons = entry.cartons && entry.cartons.length > 0
      ? entry.cartons : null;
    renderSizeTags(idx);
    renderOrderQtyTable(idx);
    renderCartonTable(idx);
    if (existingCartons) {
      const bodyEl = document.getElementById('se-cartonBody-' + idx);
      if (bodyEl) {
        bodyEl.innerHTML = '';
        existingCartons.forEach(c => addCartonRow(idx, c));
      }
    } else {
      addCartonRow(idx);
    }
    recalculateAll();
  }
}

function removeSize(i, idx) {
  const entry = styleEntries[idx];
  if (!entry || !entry.sizes) return;

    ? entry.cartons : null;

      bodyEl.innerHTML = '';
      existingCartons.forEach(c => addCartonRow(idx, c));
    }
  } else {
    addCartonRow(idx);
  }
  recalculateAll();
}

/**
 * 选择尺码组并应用到指定款号条目
 */
function selectSizeGroup(idx, groupId) {
  const groups = App.store.get('maintSizes', []);
  const group = groups.find(g => g.id === groupId);
  if (!group) return;

  const entry = styleEntries[idx];
  if (!entry) return;

  const newSizes = group.sizes || [];
  if (newSizes.length === 0) {
    showToast('该尺码组为空', 'error');
    return;
  }

  const mergeMode = document.getElementById('sz_merge_mode') && document.getElementById('sz_merge_mode').checked;

  // 保留现有 orderQty 中的数量数据（key 是尺码名）
  const oldQty = entry.orderQty || {};
  const oldSizes = entry.sizes || [];

  let finalSizes;
  if (mergeMode) {
    // 合并模式：去重后合并
    const merged = Array.from(new Set([...oldSizes, ...newSizes]));
    finalSizes = sortSizes(merged);
  } else {
    // 替换模式
    finalSizes = sortSizes([...newSizes]);
  }

  entry.sizes = finalSizes;

  // 重建 orderQty，保留已存在尺码的数量
  const newQty = {};
  finalSizes.forEach(s => {
    newQty[s] = oldQty[s] || 0;
  });
  entry.orderQty = newQty;

  App.modal.close();

  // 保留已有的装箱数据
  const existingCartons = entry.cartons && entry.cartons.length > 0
    ? entry.cartons : null;

  renderSizeTags(idx);
  renderOrderQtyTable(idx);
  renderCartonTable(idx);
  if (existingCartons) {
    const bodyEl = document.getElementById('se-cartonBody-' + idx);
    if (bodyEl) {
      bodyEl.innerHTML = '';
      existingCartons.forEach(c => addCartonRow(idx, c));
    }
  } else {
    addCartonRow(idx);
  }
  recalculateAll();

  showToast(`已${mergeMode ? '合并' : '应用'}尺码组：${group.part || group.category}（${finalSizes.length}个尺码）`, 'success');
}

function applyCartonWeight(idx) {
  const weightInp = document.getElementById('se-cartonWeight-' + idx);
  if (!weightInp) return;
  const cartonWt = parseFloat(weightInp.value) || 0;
  if (cartonWt <= 0) {
    showToast('请输入有效的纸箱重量', 'error');
    return;
  }
  const body = document.getElementById('se-cartonBody-' + idx);
  if (!body) return;
  let count = 0;
  body.querySelectorAll('tr').forEach(row => {
    const netInp = row.querySelector('.ctn-net');
    const grossInp = row.querySelector('.ctn-gross');
    if (netInp && grossInp) {
      const netVal = parseFloat(netInp.value) || 0;
      grossInp.value = (netVal + cartonWt).toFixed(2);
      count++;
    }
  });
  if (count > 0) {
    recalculateAll();
    showToast(`已更新 ${count} 行毛重（净重 + ${cartonWt}kg）`, 'success');
  } else {
    showToast('没有可更新的装箱行', 'error');
  }
}

function importCartonExcel(idx, fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheets = wb.SheetNames;
      if (sheets.length === 0) { showToast('Excel文件中没有数据', 'error'); return; }

      // 表头名称映射（Excel表头 → 内部字段）
      // 用于从合并后的表头中提取对应字段值
      const headerMap = {
        'Carton no. From': 'from', 'Carton no. To': 'to',
        'Code': 'code', 'Color': 'color',
        'Qty of ctn (CTN)': 'ctnNum', 'CTN': 'ctnNum',
        'Qty of ctn': 'perCtn',
        'Gross W (KG)': 'grossPer', 'Gross W': 'grossPer',
        'Net W (KG)': 'netPer', 'Net W': 'netPer',
        'L': 'dimL', 'W': 'dimW', 'H': 'dimH'
      };

      const styleGroups = {};

      sheets.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (aoa.length < 2) return;

        // 智能检测表头行数：在前5行中找包含"Code"的行
        let headerEndRow = 0;
        for (let r = 0; r < Math.min(aoa.length, 5); r++) {
          const rowStr = (aoa[r] || []).map(c => String(c).trim().toLowerCase()).join('|');
          if (rowStr.includes('code') || rowStr.includes('款号')) {
            const nextRow = aoa[r + 1] || [];
            const nextStr = nextRow.map(c => String(c).trim().toLowerCase()).join('|');
            if (nextStr.includes('from') && nextStr.includes('to')) {
              headerEndRow = r + 1;
            } else {
              headerEndRow = r;
            }
            break;
          }
        }

        // 合并表头
        const colCount = Math.max(...aoa.slice(0, headerEndRow + 1).map(r => r.length));
        const mergedHeaders = [];
        for (let c = 0; c < colCount; c++) {
          let parts = [];
          for (let r = 0; r <= headerEndRow; r++) {
            const v = String(aoa[r][c] || '').trim();
            if (v) parts.push(v);
          }
          const h = parts.join(' ').replace(/\s+/g, ' ').trim();
          mergedHeaders.push(h);
        }

        const codeColIdx = mergedHeaders.findIndex(h => h.toLowerCase() === 'code' || h.toLowerCase() === '款号');
        if (codeColIdx < 0) return;

        const sizeCols = [];
        // 智能识别尺码列：在 Color 列 和 Qty of ctn (pc) / Qty of ctn (CTN) 列之间的列都视为尺码
        const colorColIdx = mergedHeaders.findIndex(h => {
          const hl = h.replace(/\s+/g, ' ').trim().toLowerCase();
          return hl === 'color' || hl === '颜色';
        });
        const qtyPercColIdx = mergedHeaders.findIndex(h => {
          const hl = h.replace(/\s+/g, ' ').trim().toLowerCase();
          return hl.includes('qty of ctn') && !hl.includes('ctn (ctn)');
        });
        const qtyCtnColIdx = mergedHeaders.findIndex(h => {
          const hl = h.replace(/\s+/g, ' ').trim().toLowerCase();
          return hl.includes('ctn (ctn)') || hl === 'ctn';
        });
        const sizeEndBound = qtyPercColIdx >= 0 ? qtyPercColIdx : (qtyCtnColIdx >= 0 ? qtyCtnColIdx : mergedHeaders.length);

        if (colorColIdx >= 0 && sizeEndBound > colorColIdx) {
          // 在 Color 和 Qty of ctn 之间找尺码列
          for (let i = colorColIdx + 1; i < sizeEndBound; i++) {
            const h = mergedHeaders[i].replace(/\s+/g, ' ').trim();
            if (h) {
              // 清理尺码名：去除可能的 "SIZES" 前缀
              let sizeName = h.replace(/^SIZES\s*/i, '').trim();
              // 如果清理后为空，使用原始值
              if (sizeName && sizeName.toLowerCase() !== 'sizes') {
                sizeCols.push({ col: i, size: sizeName });
              }
            }
          }
        } else {
          // 回退：使用原有逻辑匹配纯数字尺码
          mergedHeaders.forEach((h, i) => {
            if (/^\d+$/.test(h.trim())) {
              sizeCols.push({ col: i, size: h.trim() });
            }
          });
        }

        // 找到数据起始行
        let dataStartRow = headerEndRow + 1;
        for (let r = headerEndRow + 1; r < aoa.length; r++) {
          const rowArr = aoa[r] || [];
          const codeVal = String(rowArr[codeColIdx] ?? '').trim().toLowerCase();
          if (codeVal && codeVal !== 'code' && codeVal !== '款号') {
            dataStartRow = r;
            break;
          }
          if (!rowArr || rowArr.every(c => String(c).trim() === '')) continue;
          dataStartRow = r + 1;
        }

        // 读取数据，支持同行 Code 为空时继承上一行的 Code
        // 同时支持 L/W/H、grossPer、netPer、ctnNum、color、from、to 等字段向下填充
        let lastCode = '';
        let lastDimL = '', lastDimW = '', lastDimH = '';
        let lastGrossPer = '', lastNetPer = '';
        let lastCtnNum = '';
        let lastColor = '';
        let lastFrom = '', lastTo = '';

        for (let r = dataStartRow; r < aoa.length; r++) {
          const rowArr = aoa[r];
          if (!rowArr || rowArr.every(c => String(c).trim() === '')) continue;

          let code = String(rowArr[codeColIdx] ?? '').trim();
          if (!code) code = lastCode; // 继承上一行的 Code
          if (!code) continue;
          lastCode = code;

          const sizesData = {};
          sizeCols.forEach(({ col, size }) => {
            const v = String(rowArr[col] ?? '').trim();
            if (v) sizesData[size] = v;
          });

          const cartonData = {
            from: '', to: '', code: code, color: '', sizes: sizesData,
            ctnNum: '', grossPer: '', netPer: '',
            dimL: '', dimW: '', dimH: ''
          };
          mergedHeaders.forEach((h, i) => {
            const hClean = h.replace(/\s+/g, ' ').trim();
            const val = String(rowArr[i] ?? '').trim();
            if (headerMap[hClean]) {
              cartonData[headerMap[hClean]] = val;
              return;
            }
            const hl = hClean.toLowerCase();
            if (hl === 'carton no. from' || hl === 'from' || hl === '起始箱号') cartonData.from = val;
            else if (hl === 'carton no. to' || hl === 'to' || hl === '结束箱号') cartonData.to = val;
            else if (hl === 'code' || hl === '款号') cartonData.code = val;
            else if (hl === 'color' || hl === '颜色') cartonData.color = val;
            else if (hl === 'qty of ctn (ctn)' || hl === 'ctn' || hl === '箱数') cartonData.ctnNum = val;
            else if (hl === 'gross w (kg)' || hl === 'gross w' || hl === '毛重') cartonData.grossPer = val;
            else if (hl === 'net w (kg)' || hl === 'net w' || hl === '净重') cartonData.netPer = val;
            else if (hl === 'l' || hl === 'length' || hl === '长') cartonData.dimL = val;
            else if (hl === 'w' || hl === 'width' || hl === '宽') cartonData.dimW = val;
            else if (hl === 'h' || hl === 'height' || hl === '高') cartonData.dimH = val;
          });

          // 向下填充：如果当前行的字段为空，使用上一行的值
          if (!cartonData.dimL) cartonData.dimL = lastDimL;
          else lastDimL = cartonData.dimL;
          if (!cartonData.dimW) cartonData.dimW = lastDimW;
          else lastDimW = cartonData.dimW;
          if (!cartonData.dimH) cartonData.dimH = lastDimH;
          else lastDimH = cartonData.dimH;
          if (!cartonData.grossPer) cartonData.grossPer = lastGrossPer;
          else lastGrossPer = cartonData.grossPer;
          if (!cartonData.netPer) cartonData.netPer = lastNetPer;
          else lastNetPer = cartonData.netPer;
          if (!cartonData.ctnNum) cartonData.ctnNum = lastCtnNum;
          else lastCtnNum = cartonData.ctnNum;
          if (!cartonData.color) cartonData.color = lastColor;
          else lastColor = cartonData.color;
          if (!cartonData.from) cartonData.from = lastFrom;
          else lastFrom = cartonData.from;
          if (!cartonData.to) cartonData.to = lastTo;
          else lastTo = cartonData.to;

          // 如果当前行没有任何数据（所有关键字段都为空），跳过
          if (!cartonData.from && !cartonData.to && !cartonData.ctnNum &&
              !cartonData.dimL && !cartonData.dimW && !cartonData.dimH &&
              Object.keys(sizesData).length === 0) continue;

          if (!styleGroups[code]) styleGroups[code] = [];
          styleGroups[code].push({ cartonData });
        }
      });

      if (Object.keys(styleGroups).length === 0) {
        showToast('未找到有效的 Code（款号）列', 'error');
        return;
      }

      const styleCodes = Object.keys(styleGroups);
      let totalImported = 0;

      // 为每个款号独立提取尺码（不跨款号合并）
      const styleSizesMap = {};
      styleCodes.forEach(code => {
        const group = styleGroups[code];
        const codeSizes = new Set();
        group.forEach(item => {
          const sizesData = item.cartonData.sizes || {};
          Object.keys(sizesData).forEach(s => {
            if (s && s !== 'undefined' && String(s).trim()) {
              codeSizes.add(String(s).trim());
            }
          });
        });
        styleSizesMap[code] = sortSizes(Array.from(codeSizes));
      });

      // 第一步：处理所有款号的数据（只更新数据，不渲染）
      // 首先检查当前点击的款号条目：如果其style为空，则将Excel中的第一个Code赋给它
      const currentEntry = (idx >= 0 && styleEntries[idx]) ? styleEntries[idx] : null;
      const firstCode = styleCodes[0];
      if (currentEntry && !currentEntry.style && firstCode) {
        currentEntry.style = firstCode;
      }

      styleCodes.forEach(code => {
        const group = styleGroups[code];
        let targetIdx = -1;
        for (let i = 0; i < styleEntries.length; i++) {
          if (styleEntries[i].style === code) { targetIdx = i; break; }
        }
        // 如果当前idx的条目style为空，使用当前code填充它
        if (idx >= 0 && styleEntries[idx] && !styleEntries[idx].style) {
          styleEntries[idx].style = code;
          targetIdx = idx;
        } else if (idx >= 0 && styleEntries[idx] && styleEntries[idx].style === code) {
          targetIdx = idx;
        }
        let targetEntry;
        if (targetIdx >= 0) {
          targetEntry = styleEntries[targetIdx];
        } else {
          targetEntry = makeEmptyEntry();
          targetEntry.style = code;
          styleEntries.push(targetEntry);
          targetIdx = styleEntries.length - 1;
        }
        // 替换尺码（使用当前款号独立的尺码列表，过滤掉 undefined 和空字符串）
        // 用新数据替换现有数据，避免跨工作簿合并问题
        const codeSizes = styleSizesMap[code] || [];
        const cleanNewSizes = codeSizes.filter(s => s && s !== 'undefined' && String(s).trim());
        targetEntry.sizes = sortSizes(Array.from(new Set(cleanNewSizes)));
        // 更新装箱数据
        const cartons = group.map(item => item.cartonData);
        targetEntry.cartons = cartons;
        targetEntry.orderQty = targetEntry.orderQty || {};
        // 自动填充基本信息
        if (!targetEntry.poNo || targetEntry.poNo === '') {
          const orders = getOrders();
          const matched = orders.filter(o => o.styleNo === code);
          if (matched.length > 0) {
            const poNos = [];
            let firstDesc = '';
            let firstUnitPrice = 0;
            let mergedQty = {};
            const isSolid = (matched[0].type === 'SOLID');
            matched.forEach(o => {
              if (o.orderNo && !poNos.includes(o.orderNo)) poNos.push(o.orderNo);
              if (!firstDesc && o.styleDescription) firstDesc = o.styleDescription;
              if (!firstUnitPrice && o.unitPrice) firstUnitPrice = parseFloat(o.unitPrice) || 0;
              if (o.sizeMatrix && o.sizeMatrix.rows) {
                o.sizeMatrix.rows.forEach(row => {
                  if (row.quantities) {
                    const ctns = isSolid ? 1 : (parseInt(row.noOfCartons) || 1);
                    Object.keys(row.quantities).forEach(size => {
                      mergedQty[size] = (mergedQty[size] || 0) + (parseInt(row.quantities[size]) || 0) * ctns;
                    });
                  }
                });
              }
            });
            targetEntry.poNo = poNos.join(', ');
            targetEntry.itemDesc = firstDesc;
            if (firstUnitPrice) {
              targetEntry.unitPrice = firstUnitPrice;
              targetEntry.customsPrice = parseFloat((firstUnitPrice + (parseFloat(targetEntry.hangingFee) || 0)).toFixed(2));
            }
            targetEntry.orderQty = mergedQty;
            targetEntry.customsItemNo = code;
          }
        }
        totalImported += cartons.length;
      });

      // 第二步：一次性渲染所有款号（避免多次渲染互相覆盖）
      renderStyleEntries();
      recalculateAll();
      syncEntriesFromDOM();
      refreshEmptyHighlight();
      showToast(`已导入 ${totalImported} 行装箱明细，涉及 ${styleCodes.length} 个款号`, 'success');
    } catch (err) {
      console.error('Import error:', err);
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

// ==================== Auto Calculations (iterate all style entries) ====================
function recalculateAll() {
  let grandOrder = 0, grandActual = 0, grandGoods = 0, grandHanging = 0, grandCustoms = 0;
  styleEntries.forEach((entry, idx) => {
    const sizes = entry.sizes || [];
    const sizeTotals = {};
    sizes.forEach(s => sizeTotals[s] = 0);
    let totalCtn = 0, totalQty = 0, totalGross = 0, totalNet = 0, totalVol = 0;
    const body = document.getElementById('se-cartonBody-' + idx);
    if (body) {
      body.querySelectorAll('tr').forEach(row => {
        let perCtn = 0;
        const ctnNum = parseFloat(row.querySelector('.ctn-num')?.value) || 0;
        row.querySelectorAll('.ctn-size').forEach(inp => {
          const v = parseFloat(inp.value) || 0;
          perCtn += v;
          sizeTotals[inp.dataset.size] = (sizeTotals[inp.dataset.size] || 0) + v * ctnNum;
        });
        const perEl = row.querySelector('.ctn-per'); if (perEl) perEl.value = perCtn || '';
        const totalQ = perCtn * ctnNum;
        const totalEl = row.querySelector('.ctn-total'); if (totalEl) totalEl.value = totalQ || '';
        const grossPer = parseFloat(row.querySelector('.ctn-gross')?.value) || 0;
        const netPer = parseFloat(row.querySelector('.ctn-net')?.value) || 0;
        const grossTotal = grossPer * ctnNum;
        const netTotal = netPer * ctnNum;
        const gtEl = row.querySelector('.ctn-gross-total'); if (gtEl) gtEl.value = grossTotal ? +grossTotal.toFixed(2) : '';
        const ntEl = row.querySelector('.ctn-net-total'); if (ntEl) ntEl.value = netTotal ? +netTotal.toFixed(2) : '';
        const dimL = parseFloat(row.querySelector('.ctn-dimL')?.value) || 0;
        const dimW = parseFloat(row.querySelector('.ctn-dimW')?.value) || 0;
        const dimH = parseFloat(row.querySelector('.ctn-dimH')?.value) || 0;
        const vol = (dimL * dimW * dimH / 1000000) * ctnNum;
        const volEl = row.querySelector('.ctn-vol'); if (volEl) volEl.value = vol ? +(vol.toFixed(2)) : '';
        totalCtn += ctnNum;
        totalQty += totalQ;
        totalGross += grossTotal;
        totalNet += netTotal;
        totalVol += vol;
      });
    }
    // entry footer totals
    const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    sizes.forEach((s, i) => setTxt('se-totalSize-' + idx + '-' + i, sizeTotals[s] || ''));
    setTxt('se-totalCtn-' + idx, totalCtn || '');
    setTxt('se-totalQty-' + idx, totalQty || '');
    setTxt('se-totalGrossW-' + idx, totalGross ? +totalGross.toFixed(2) : '');
    setTxt('se-totalNetW-' + idx, totalNet ? +totalNet.toFixed(2) : '');
    setTxt('se-totalVolume-' + idx, totalVol ? +totalVol.toFixed(2) : '');
    // entry order qty total
    let orderTotal = 0;
    sizes.forEach((s, i) => {
      const el = document.getElementById('se-orderQty-' + idx + '-' + i);
      orderTotal += parseFloat(el?.value) || 0;
    });
    const oqt = document.getElementById('se-orderQtyTotal-' + idx);
    if (oqt) oqt.value = orderTotal || '';
    grandOrder += orderTotal;
    grandActual += totalQty;
    const unitPrice = parseFloat(document.getElementById('se-unitPrice-' + idx)?.value) || 0;
    const hangingFee = parseFloat(document.getElementById('se-hangingFee-' + idx)?.value) || 0;
    const customsPrice = parseFloat(document.getElementById('se-customsPrice-' + idx)?.value) || 0;
    grandGoods += totalQty * unitPrice;
    grandHanging += totalQty * hangingFee;
    grandCustoms += totalQty * customsPrice;
  });
  // 更新顶部汇总字段
  const setV = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  setV('f-totalOrder', grandOrder || '');
  setV('f-totalActual', grandActual || '');
  const variation = grandActual - grandOrder;
  setV('f-variation', variation || '');
  setV('f-variationPct', grandOrder > 0 ? +(variation / grandOrder * 100).toFixed(1) : '');
  setV('f-goodsAmount', grandGoods ? +grandGoods.toFixed(2) : '');
  setV('f-hangingTotal', grandHanging ? +grandHanging.toFixed(2) : '');
  setV('f-invoiceTotal', (grandGoods + grandHanging) ? +(grandGoods + grandHanging).toFixed(2) : '');
  setV('f-customsTotal', grandCustoms ? +grandCustoms.toFixed(2) : '');
}

    id: e.id,

    fullDesc: e.fullDesc || '', unitPrice: parseFloat(e.unitPrice) || 0, hangingFee: parseFloat(e.hangingFee) || 0,

    fullDesc: first.fullDesc || '',
    unitPrice: first.unitPrice || 0,
    hangingFee: first.hangingFee || 0,
    hsCode: first.hsCode || '',
    cnName: first.cnName || '',
    customsPrice: first.customsPrice || 0,
    weaveMethod: first.weaveMethod || '',
    declCategory: first.declCategory || '',
    declGender: first.declGender || '',
    compositionCn: first.compositionCn || '',
    fullOpen: first.fullOpen || '',
    hasZipper: first.hasZipper || '',
    declBrand: first.declBrand || '',
    customsItemNo: first.customsItemNo || '',
    // 汇总字段

    // 多款号条目

function saveRecord() {
  const data = collectFormData();
  if (!data.style) { showToast('请填写款号 (Style)', 'error'); return; }
  if (data.cartons.length === 0) { showToast('请至少添加一行装箱明细', 'error'); return; }

  // 发票号不能与出运记录重复（非空时检查）
  if (data.invoiceNo && data.invoiceNo.trim()) {
    const invNo = data.invoiceNo.trim();
    const dup = records.find(r => r.id !== editingId && r.invoiceNo && r.invoiceNo.trim() === invNo);
    if (dup) { showToast('发票号 "' + invNo + '" 在出运记录中已存在，不能重复！', 'error'); return; }
  }

  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) records[idx] = data;
  } else {
    records.push(data);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));

  // 同步到 shippings 列表（以 source='pl' 标记）
  const ships = getShippings();
  // 汇总所有款号条目的装箱明细
  const allCartons = (data.styleEntries || []).flatMap(e => e.cartons || []);
  const colorSet = new Set();
  allCartons.forEach(c => { if(c.color) colorSet.add(c.color); });
  let totalGross = 0, totalVolume = 0, totalCtn = 0;
  allCartons.forEach(c => {
    totalGross += parseFloat(c.grossTotal) || 0;
    totalVolume += parseFloat(c.volume) || 0;
    totalCtn += parseInt(c.ctnNum) || 0;
  });
  const allSizes = Array.from(new Set((data.styleEntries || []).flatMap(e => e.sizes || [])));
  const shipSyncData = {
    source: 'pl',
    plRefId: data.id,
    shipNo: data.invoiceNo || ('PL-' + (data.style || '').toUpperCase().replace(/[^A-Z0-9]/g, '') + '-' + String(records.length).padStart(3,'0')),
    orderNo: data.poNo || '',
    styleNo: data.style || '',
    customerName: data.buyerFull || data.buyer || '',
    buyer: data.buyerFull || data.buyer || '',
    poNo: data.poNo || '',
    style: data.style || '',
    itemDesc: data.itemDesc || '',
    invoiceNo: data.invoiceNo || '',
    packType: data.packType || '纸箱包装',
    quantity: data.totalActualQty || 0,
    packCount: totalCtn,
    volume: totalVolume ? Number(totalVolume.toFixed(2)) : '',
    grossWeight: totalGross ? Number(totalGross.toFixed(1)) : '',
    shipMethod: data.shipMethod || '海运',
    forwarder: data.forwarder || '',
    loadingPort: data.fromPort || '',
    destinationPort: data.toPort || data.destPort || '',
    containerNo: data.containerNo || '',
    blNo: data.blNo || '',
    customsNo: data.customsNo || '',
    loadingDate: data.loadingDate || '',
    etd: data.etd || '',
    eta: data.eta || '',
    actualArrival: data.actualArrival || '',
    remarks: data.remarks || '',
    totalOrderQty: data.totalOrderQty || 0,
    totalActualQty: data.totalActualQty || 0,
    variation: data.variation || 0,
    plColors: Array.from(colorSet),
    plSizes: allSizes,
    plCartonLines: allCartons.length,
    totalCtn: totalCtn,
    createDate: App.utils.today(),
  };
  const existingIdx = ships.findIndex(s => s.source === 'pl' && s.plRefId === data.id);
  if (existingIdx >= 0) {
    shipSyncData.id = ships[existingIdx].id;
    ships[existingIdx] = { ...ships[existingIdx], ...shipSyncData };
  } else {
    shipSyncData.id = App.utils.genId('PLSHIP');
    ships.push(shipSyncData);
  }
  App.store.set('shippings', ships);

  editingId = null;
  lockBankFields();
  showToast('保存成功！', 'success');
  switchMainTab('records');
  renderAll();
  clearForm();
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;top:60px;right:20px;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:opacity .3s;background:${type==='success'?'#16a34a':type==='error'?'#dc2626':'#2563eb'};`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity='0'; setTimeout(()=>toast.remove(), 300); }, 2000);
}

// ==================== Empty Input Highlight ====================
function refreshEmptyHighlight() {
  document.querySelectorAll('.sd-docs .form-group input[id^="f-"], .sd-docs .form-group textarea[id^="f-"]').forEach(el => {
    if (el.readOnly || el.type === 'hidden') return;
    if (!el.value || el.value.trim() === '') {
      el.classList.add('input-empty');
    } else {
      el.classList.remove('input-empty');
    }
  });
}
document.addEventListener('input', function(e) {
  if (e.target.matches('.sd-docs .form-group input[id^="f-"], .sd-docs .form-group textarea[id^="f-"]')) {
    if (e.target.value && e.target.value.trim()) {
      e.target.classList.remove('input-empty');
    } else {
      e.target.classList.add('input-empty');
    }
  }
});

function loadDraft() {
  const raw = localStorage.getItem(DRAFT_KEY);
  if (!raw) return false;
  try {
    const draft = JSON.parse(raw);
    // 恢复表单字段
    Object.keys(draft.fields || {}).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = draft.fields[id];
    });
    // 恢复款号条目
    if (draft.styleEntries && draft.styleEntries.length > 0) {
      styleEntries = draft.styleEntries.map(e => ({
        ...e,
        sizes: e.sizes ? [...e.sizes] : [],
        orderQty: { ...(e.orderQty || {}) },
        cartons: (e.cartons || []).map(c => ({ ...c, sizes: { ...c.sizes } })),
      }));
    }
    renderStyleEntries();
    lockBankFields();
    const savedTime = draft.savedAt ? new Date(draft.savedAt).toLocaleString('zh-CN') : '';
    showToast('已恢复草稿数据' + (savedTime ? '（' + savedTime + '）' : ''), 'success');
    refreshEmptyHighlight();
    return true;
  } catch(e) {
    console.error('Load draft error:', e);
    return false;
  }
}
