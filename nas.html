<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云盘 NAS - AA服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260822">
<style>
  /* ===== 全局 ===== */
  html, body { height: 100%; margin: 0; }
  .nas {
    display: flex; flex-direction: column; height: calc(100vh - 48px);
    padding: 0; background: #fff;
  }
  .nas .topbar {
    flex: 0 0 auto;
    background: #fff; border-bottom: 1px solid #e5e7eb;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .nas .topbar-actions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nas .topbar .nas-btn { padding: 5px 10px; font-size: 12px; height: 28px; line-height: 1; }
  .nas .topbar .view-switch button { padding: 5px 10px; font-size: 12px; height: 28px; line-height: 1; }
  .nas .topbar .search { min-width: 200px; }
  .nas .status-dot { display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#9ca3af;vertical-align:middle; }
  .nas .status-dot.ok { background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.15); }
  .nas .status-dot.err { background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.15); }
  .nas .status-dot.warn { background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15); }
  .nas .conn-title { font-weight:600;font-size:14px;color:#0f172a;display:inline-flex;align-items:center; }
  .nas .search {
    padding:6px 10px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;min-width:220px;
    background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") 8px 50% no-repeat; padding-left:28px;
  }
  .nas .toolbar-filler { flex:1; }

  /* ===== 地址栏（面包屑） ===== */
  .nas .breadcrumb {
    flex: 0 0 auto;
    display:flex;align-items:center;gap:4px;flex-wrap:wrap;
    padding:8px 14px;border-bottom:1px solid #e5e7eb;background:#fafafa;
    font-size:13px;
  }
  .nas .breadcrumb .crumb {
    padding:3px 10px;border-radius:4px;cursor:pointer;color:#2563eb;transition:background .12s;
    max-width: 260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .nas .breadcrumb .crumb:hover { background:#eff6ff; }
  .nas .breadcrumb .crumb.home { color:#111;font-weight:600;background:#eef2ff;border:1px solid #c7d2fe; }
  .nas .breadcrumb .crumb.home:hover { background:#e0e7ff; }
  .nas .breadcrumb .sep { color:#9ca3af; padding:0 2px; }
  .nas .breadcrumb .current {
    color:#111;font-weight:600;background:#fff;border:1px solid #d1d5db;
    border-radius:4px;padding:3px 10px;
    max-width: 360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .nas .breadcrumb .spacer { flex:1; }
  .nas .breadcrumb .info { color:#64748b; font-size:12px; }

  /* ===== Explorer 主体：左树 + 右内容 ===== */
  .nas .explorer { flex:1 1 auto; display:flex; min-height:0; overflow:hidden; }
  .nas .tree {
    width: 240px; min-width: 180px; flex: 0 0 240px;
    border-right:1px solid #e5e7eb; overflow-y:auto; background:#fafbfc;
    padding: 8px 0;
  }
  .nas .tree .tree-node { user-select:none; }
  .nas .tree .tree-row {
    display:flex; align-items:center; gap:4px;
    padding:4px 8px 4px 2px; cursor:pointer;
    border:1px solid transparent; border-radius:4px;
    font-size:13px; margin:0 6px;
    transition: background .1s;
    white-space:nowrap;
  }
  .nas .tree .tree-row:hover { background:#eef2ff; }
  .nas .tree .tree-row.active {
    background:#dbeafe; border-color:#93c5fd; color:#1e3a8a; font-weight:600;
  }
  .nas .tree .tree-row.drop-target {
    background:#bbf7d0; border-color:#22c55e;
  }
  .nas .tree .chev {
    display:inline-flex; align-items:center; justify-content:center;
    width: 18px; height: 18px; flex: 0 0 18px;
    font-size: 10px; color:#64748b;
    transition: transform .12s ease-out;
  }
  .nas .tree .chev.open { transform: rotate(90deg); }
  .nas .tree .chev.empty { visibility: hidden; }
  .nas .tree .t-ico { flex:0 0 20px; display:inline-flex; justify-content:center; font-size:15px; }
  .nas .tree .t-label {
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .nas .tree .tree-children {
    overflow: hidden;
    max-height: 0;
    transition: max-height .18s ease-out;
  }
  .nas .tree .tree-children.open {
    max-height: 10000px;
  }
  .nas .tree .tree-level-0 .tree-row { padding-left: 4px; }
  .nas .tree .tree-level-1 { padding-left: 12px; }
  .nas .tree .tree-level-2 { padding-left: 12px; }
  .nas .tree .tree-level-3 { padding-left: 12px; }
  .nas .tree .tree-level-4 { padding-left: 12px; }
  .nas .tree .tree-level-5 { padding-left: 12px; }

  /* ===== 右侧内容区 ===== */
  .nas .content {
    flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
    background:#fff;
  }
  .nas .content .content-inner {
    flex:1 1 auto; overflow:auto; padding: 10px 14px 20px;
    position:relative;
  }

  /* 内容区：文件表格（Win 风格） */
  .nas .file-table {
    width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fff;
    border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;
  }
  .nas .file-table th, .nas .file-table td {
    border-bottom:1px solid #f1f5f9;padding:7px 12px;text-align:left;vertical-align:middle;
  }
  .nas .file-table th {
    background:#f3f4f6;color:#374151;font-weight:600;font-size:12px;white-space:nowrap;
    position: sticky; top:0; z-index: 1;
    border-bottom:1px solid #e5e7eb;
  }
  .nas .file-table th.sortable { cursor:pointer; user-select:none; padding-right:20px; position:relative; transition: background .1s; }
  .nas .file-table th.sortable:hover { background:#e5e7eb; }
  .nas .file-table th.sortable::after {
    content:'↕'; position:absolute; right:6px; top:50%; transform:translateY(-50%);
    color:#9ca3af; font-size:12px; font-weight:400; opacity:.7;
  }
  .nas .file-table th.sortable.sort-asc::after,
  .nas .file-table th.sortable.sort-desc::after {
    opacity:1; color:#2563eb; font-weight:700;
  }
  .nas .file-table th.sortable.sort-asc::after { content:'▲'; }
  .nas .file-table th.sortable.sort-desc::after { content:'▼'; }
  .nas .file-table tbody tr { cursor: pointer; transition: background .08s; }
  .nas .file-table tbody tr:hover { background:#eff6ff; }
  .nas .file-table tbody tr.selected { background:#dbeafe; }
  .nas .file-table tbody tr.drop-target { background:#bbf7d0; }
  .nas .file-table tbody td:last-child { border-right: none; }
  .nas .file-table td.name-cell {
    display:flex;align-items:center;gap:10px;
  }
  .nas .file-table .file-ico {
    font-size:20px;width:30px;height:30px;flex:0 0 30px;
    display:flex;align-items:center;justify-content:center;border-radius:5px;background:#f3f4f6;
  }
  .nas .file-table .file-ico.img { background:#eef2ff; }
  .nas .file-table .file-ico.folder { background:#fef3c7; }
  .nas .file-table .thumb {
    width:30px;height:30px;object-fit:cover;border-radius:5px;background:#000;border:1px solid #e5e7eb;flex:0 0 30px;
  }
  .nas .file-table .meta { display:flex;flex-direction:column;gap:2px; }
  .nas .file-table .meta .fname { font-weight:500;color:#0f172a;word-break:break-all; }
  .nas .file-table .meta .fsize { font-size:11px;color:#94a3b8; }
  .nas .file-table .op-cell { white-space:nowrap; }
  .nas .file-table .op-cell button { margin-right:4px; }

  .nas .empty {
    padding:60px 12px;text-align:center;color:#94a3b8;
  }
  .nas .empty .ico { font-size:56px;margin-bottom:10px; opacity: .7; }

  /* ===== 拖放遮罩 ===== */
  .nas-drop-mask {
    position: fixed; inset:0; background: rgba(37, 99, 235, .08);
    border: 4px dashed #2563eb; z-index: 9990;
    display: none; align-items:center; justify-content:center;
    font-size: 28px; font-weight: 700; color:#1e40af; pointer-events:none;
    backdrop-filter: blur(1px);
  }
  .nas-drop-mask.active { display:flex; }
  .nas-drop-mask .inner {
    background:#fff; padding:28px 40px; border-radius:14px;
    box-shadow: 0 14px 36px rgba(30, 64, 175, .2);
    text-align: center; pointer-events:none;
  }
  .nas-drop-mask .sub { font-size: 13px; color:#475569; font-weight:400; margin-top: 8px; }

  /* 上传进度 */
  .nas .upload-progress {
    position:fixed;top:0;left:0;right:0;height:3px;background:#e5e7eb;z-index:9999;
  }
  .nas .upload-progress > div {
    height:100%;background:linear-gradient(90deg,#2563eb,#1d4ed8);width:0%;transition:width .2s;
  }
  .nas .upload-toasts {
    position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:9998;
    max-height:40vh; overflow-y:auto;
  }
  .nas .upload-toast {
    min-width:300px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;
    box-shadow:0 6px 20px rgba(15,23,42,.12);font-size:12px;
  }
  .nas .upload-toast .t-title { font-weight:600;margin-bottom:4px;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px; }
  .nas .upload-toast .t-bar { height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden; }
  .nas .upload-toast .t-bar > span { display:block;height:100%;background:#2563eb;width:0%;transition:width .1s; }
  .nas .upload-toast.ok { border-color:#bbf7d0; }
  .nas .upload-toast.err { border-color:#fecaca; }

  /* 图片预览模态框 */
  .nas-preview-overlay {
    position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:9999;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .nas-preview-overlay.active { display:flex; }
  .nas-preview-box { position:relative;max-width:94vw;max-height:94vh; }
  .nas-preview-box img { max-width:94vw;max-height:92vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.4); }
  .nas-preview-box .close-x {
    position:absolute;top:-16px;right:-16px;width:36px;height:36px;border-radius:50%;
    background:#fff;color:#0f172a;font-size:20px;cursor:pointer;border:none;font-weight:700;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .nas-preview-box .p-caption {
    margin-top:8px;color:#e2e8f0;font-size:12px;text-align:center;
  }

  /* 权限模态框 */
  .perm-overlay {
    position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:9999;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .perm-overlay.active { display:flex; }
  .perm-modal {
    width:100%;max-width:700px;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(15,23,42,.25);
    max-height:90vh;overflow-y:auto;
  }
  .perm-modal .pm-h { padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center; }
  .perm-modal .pm-h h3 { margin:0;font-size:15px; }
  .perm-modal .pm-h .close-x { background:none;border:none;font-size:20px;color:#64748b;cursor:pointer; }
  .perm-modal .pm-body { padding:16px 20px; }
  .perm-modal .pm-path {
    background:#f1f5f9;padding:6px 10px;border-radius:6px;font-size:12px;color:#334155;margin-bottom:12px;word-break:break-all;
  }
  .perm-modal table { width:100%;border-collapse:collapse;font-size:13px; }
  .perm-modal th, .perm-modal td { border:1px solid #e2e8f0;padding:8px 10px;text-align:center; }
  .perm-modal th { background:#f8fafc;color:#334155;font-weight:600; }
  .perm-modal td:first-child { text-align:left;font-weight:500;color:#0f172a; }
  .perm-modal td label { display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:10px;font-size:12px; }
  .perm-modal .pm-footer { padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px; }
  .perm-modal .pm-hint { font-size:12px;color:#64748b;margin-top:8px;line-height:1.7; }

  /* ===== 视图切换按钮 ===== */
  .nas .view-switch {
    display:inline-flex; align-items:center; background:#f3f4f6; border:1px solid #e5e7eb;
    border-radius:6px; padding:2px; gap:2px;
  }
  .nas .view-switch button {
    background:transparent; border:none; padding:4px 9px; cursor:pointer;
    border-radius:4px; font-size:13px; color:#475569; transition: all .1s;
  }
  .nas .view-switch button:hover { background:#fff; }
  .nas .view-switch button.active {
    background:#fff; color:#1d4ed8; box-shadow:0 1px 3px rgba(0,0,0,.08); font-weight:600;
  }

  /* ===== 大图标 / 小图标 视图 ===== */
  .nas .view-grid {
    display:flex; flex-wrap:wrap; gap:12px; padding: 14px 10px 24px;
  }
  /* 大图标：96×112 卡片 */
  .nas .item-card {
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:10px 6px 8px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; transition: all .12s; text-align:center;
    overflow:hidden;
  }
  .nas .item-card:hover { background:#eff6ff; border-color:#bfdbfe; }
  .nas .item-card.selected { background:#dbeafe; border-color:#93c5fd; }
  .nas .item-card.drop-target { background:#bbf7d0; border-color:#22c55e; }
  .nas .item-card.lg { width: 116px; min-height: 120px; }
  .nas .item-card.lg .card-ico {
    width:68px; height:68px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:#f3f4f6; font-size:40px; margin-bottom:8px; flex:0 0 68px;
    box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  .nas .item-card.lg .card-ico.folder { background:#fef3c7; }
  .nas .item-card.lg .card-ico.img { background:#eef2ff; }
  .nas .item-card.lg img.card-thumb {
    width:68px; height:68px; object-fit:cover; border-radius:10px; border:1px solid #e5e7eb;
    background:#000; margin-bottom:8px;
  }
  .nas .item-card.lg .card-name {
    font-size:12px; line-height:1.35; color:#0f172a; font-weight:500;
    max-width:100%; word-break:break-all;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .nas .item-card.lg .card-meta {
    font-size:11px; color:#94a3b8; margin-top:4px; white-space:nowrap;
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
  }
  /* 小图标：紧凑 160 宽一行两个 */
  .nas .view-small {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap:4px 16px; padding:14px 14px 24px;
  }
  .nas .item-card.sm {
    flex-direction:row; align-items:center; gap:8px; padding:4px 6px; min-height:30px;
    justify-content:flex-start; text-align:left;
    border-radius:6px;
  }
  .nas .item-card.sm .card-ico {
    width:22px; height:22px; border-radius:4px; flex:0 0 22px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; background:#f3f4f6;
  }
  .nas .item-card.sm .card-ico.folder { background:#fef3c7; }
  .nas .item-card.sm .card-ico.img { background:#eef2ff; }
  .nas .item-card.sm img.card-thumb {
    width:22px; height:22px; object-fit:cover; border-radius:4px; border:1px solid #e5e7eb; flex:0 0 22px;
  }
  .nas .item-card.sm .card-name {
    font-size:13px; color:#0f172a; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0;
  }
  .nas .item-card.sm .card-meta {
    font-size:11px; color:#94a3b8; white-space:nowrap; flex:0 0 auto;
  }

  /* ===== 重命名输入框 ===== */
  .nas .rename-input {
    width:100%; font-size:inherit; padding:2px 4px;
    border:1px solid #2563eb; border-radius:3px; background:#fff;
    outline:none; box-shadow:0 0 0 3px rgba(37,99,235,.18);
  }
  .nas .item-card.lg .rename-input { text-align:center; }
  .nas tr .name-wrap { display:contents; }

  /* 响应式 */
  @media (max-width: 900px) {
    .nas .tree { display:none; }
  }
  @media (max-width: 768px) {
    .nas .toolbar .search { min-width:100%; }
    .nas .file-table th:nth-child(3), .nas .file-table td:nth-child(3),
    .nas .file-table th:nth-child(4), .nas .file-table td:nth-child(4) { display:none; }
  }
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-area">
    <div class="app-header">
      <button class="header-toggle">☰</button>
      <span class="header-title">云盘 NAS</span>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="App.backupData()">📦</button>
        <div class="header-user"><span>👤</span><span class="user-name" id="userName">管理员</span></div>
        <button class="btn btn-sm" onclick="App.logout()">🚪</button>
      </div>
    </div>
    <div class="app-content nas">
      <!-- 上传进度 -->
      <div class="upload-progress" id="uploadProgress" style="display:none;"><div id="uploadProgressBar"></div></div>
      <div class="upload-toasts" id="uploadToasts"></div>

      <!-- 顶部工具栏 -->
      <div class="topbar">
        <span class="conn-title"><span id="connStatus"><span class="status-dot"></span>正在读取配置...</span></span>
        <span id="writeBtns" class="topbar-actions" style="display:none;">
          <button class="btn btn-sm nas-btn" onclick="NAS.mkDir()" title="在当前目录新建文件夹">📂新建文件夹</button>
          <button class="btn btn-sm nas-btn btn-primary" onclick="NAS.pickUpload()" title="上传整个文件夹（保留原始目录结构）">📁上传文件夹</button>
          <button class="btn btn-sm nas-btn btn-primary" onclick="NAS.pickUploadFiles()" title="上传一个或多个文件（支持所有格式）">📄上传文件</button>
          <button class="btn btn-sm nas-btn" onclick="NAS.renameSelected()" title="重命名选中的文件或文件夹（也可按 F2 或双击名称）">✏️重命名</button>
          <button class="btn btn-sm nas-btn" onclick="NAS.refresh()" title="重新加载当前目录">🔄刷新</button>
        </span>
        <button class="btn btn-sm" onclick="NAS.openSettings()" title="诊断连接失败、重新设置 WebDAV 地址/账号密码" style="margin-left:6px;background:#fef2f2;border-color:#fecaca;color:#b91c1c;">🩺 诊断连接</button>
        <input type="file" id="filePicker" multiple style="display:none;" onchange="NAS.onFilePick(event)">
        <input type="file" id="folderPicker" webkitdirectory directory multiple style="display:none;" onchange="NAS.onFilePick(event)">
        <div class="view-switch" id="viewSwitch" title="切换查看方式">
          <button data-view="large" onclick="NAS.setViewMode('large')" title="大图标">🔲大图标</button>
          <button data-view="small" onclick="NAS.setViewMode('small')" title="小图标">▫️小图标</button>
          <button data-view="details" onclick="NAS.setViewMode('details')" title="详细信息">☰详细信息</button>
        </div>
        <div class="toolbar-filler"></div>
        <input type="text" class="search" id="searchInput" placeholder="搜索当前目录文件名..." oninput="NAS.renderList()">
      </div>

      <!-- 地址栏 -->
      <div class="breadcrumb" id="breadcrumb"></div>

      <!-- Explorer 主体 -->
      <div class="explorer">
        <!-- 左侧树形目录 -->
        <div class="tree" id="treeHost"></div>
        <!-- 右侧内容 -->
        <div class="content">
          <div class="content-inner" id="dropZone">
            <div id="fileListArea"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 拖放遮罩 -->
<div class="nas-drop-mask" id="dropMask">
  <div class="inner">
    <div style="font-size:52px;margin-bottom:8px;">⬆️</div>
    <div>释放以上传文件到：<b id="dropTargetPath">当前目录</b></div>
    <div class="sub">支持多文件、整个文件夹（保留原始目录结构）</div>
  </div>
</div>

<!-- 图片预览模态框 -->
<div class="nas-preview-overlay" id="previewOverlay" onclick="if(event.target===this)NAS.closePreview()">
  <div class="nas-preview-box">
    <button class="close-x" onclick="NAS.closePreview()">×</button>
    <img id="previewImg" alt="预览">
    <div class="p-caption" id="previewCaption"></div>
  </div>
</div>

<!-- 文件夹权限模态框 -->
<div class="perm-overlay" id="permOverlay" onclick="if(event.target===this)NAS.closePermModal()">
  <div class="perm-modal">
    <div class="pm-h">
      <h3>🔧 文件夹权限配置</h3>
      <button class="close-x" onclick="NAS.closePermModal()">×</button>
    </div>
    <div class="pm-body">
      <div class="pm-path">📁 路径：<span id="permPath"></span></div>
      <table>
        <thead>
          <tr><th style="width:32%;">角色</th><th>✅ 读取</th><th>✏️ 读写</th><th>🚫 禁止</th><th>↩️ 继承</th></tr>
        </thead>
        <tbody id="permTbody"></tbody>
      </table>
      <div class="pm-hint">
        · 未设置的角色会继承该文件夹的父级权限（向上查找直到 / 根目录）<br>
        · 「禁止」优先级最高，任何上级「读写」都会被覆盖<br>
        · 模块级权限（设置→用户组）控制是否能进入该页面；这里是每个目录的细粒度权限
      </div>
    </div>
    <div class="pm-footer">
      <button class="btn" onclick="NAS.closePermModal()">取消</button>
      <button class="btn btn-primary" onclick="NAS.saveFolderPerm()">💾 保存权限</button>
    </div>
  </div>
</div>

<script>
// ==============================================
// 云盘 NAS 主逻辑：WebDAV + 文件夹级权限（角色）
//   新版：左树右内容（Win 资源管理器风格）+ 整页拖放 + 拖文件夹保留目录结构
// ==============================================
(function(){
  var NAS = {
    // ===== 内部状态 =====
    currentPath: '/',        // 逻辑路径（相对系统根 rootFolder），永远以 / 开头
    rawList: [],             // 当前目录缓存
    cfg: null,
    canWrite: false,
    isAdmin: false,
    roleKey: 'user',
    permsEditing: null,
    // 树缓存：logicPath -> { open:true/false, children: [node] | null, loaded:true/false }
    treeCache: {},
    // 选择态
    selectedPath: null,
    // 拖放：当前悬停的目标逻辑路径
    dragTargetLogicPath: null,
    // 排序
    sortBy: 'name',          // name | date | type | size
    sortAsc: true,
    // 视图：details（详细信息）| small（小图标）| large（大图标）
    viewMode: 'details',
    // 正在重命名的名称（避免重复）
    _renamingOldName: null,

    init: async function() {
      var self = this;
      var modPerm = App.getPermission('nasDrive');
      if (modPerm === 'hidden' || modPerm === 'none') {
        document.querySelector('.app-content').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 16px;color:#6b7280;">
            <div style="font-size:64px;margin-bottom:16px;">🔒</div>
            <div style="font-size:20px;font-weight:600;margin-bottom:8px;">无访问权限</div>
            <div style="font-size:14px;">您当前的角色无权访问「云盘 NAS」，请联系管理员在 设置 → 用户组 中开通</div>
          </div>`;
        return;
      }
      var u = App.getCurrentUser();
      if (u) {
        self.roleKey = u.role || 'user';
        var adminEmails = window.ADMIN_EMAILS || [];
        self.isAdmin = !!(App.roles[self.roleKey] && App.roles[self.roleKey].isAdmin) || (adminEmails.indexOf(u.email) >= 0);
      }
      self.canWrite = (modPerm === 'write' || self.isAdmin);
      document.getElementById('userName').textContent = (u && u.username) || '管理员';
      var wb = document.getElementById('writeBtns');
      if (wb) wb.style.display = self.canWrite ? 'inline-flex' : 'none';
      var ab = document.getElementById('adminBtns');
      if (ab) ab.style.display = self.isAdmin ? 'inline-flex' : 'none';

      self.cfg = self._loadCfg();
      // ---- 如果本机/当前用户还没有 NAS 配置，立即从云端拉管理员发布的全局配置 & 权限规则 ----
      // 这一步保证：管理员在自己的电脑上配置一次 → 任何其他电脑的其他用户（业务员/财务 等）登录后首次打开云盘就直接能用，无需管理员去每台电脑登录。
      if (!self.cfg.serverUrl) {
        self.setStatus('warn', '本机无 NAS 配置，正在从云端加载管理员发布的连接参数…');
        try {
          var pull = await self._fetchSharedNasKeysFromCloud(7000);
          if (pull && (pull.pulledNasConfig || pull.pulledFolderPerms)) {
            self.cfg = self._loadCfg(); // 重新读取：此时 origLS 已被 pull 写入，已能读到管理员发布的值
          }
        } catch(_cloudErr) { /* 网络异常忽略，沿用空配置走下面的提示 */ }
      }

      self._restoreSort();
      self._restoreViewMode();
      if (!self.cfg.serverUrl) {
        self.setStatus('warn', '未配置：请先在 设置 → ☁️云盘NAS 中填写 WebDAV 连接参数');
        self.renderBreadcrumb();
        self.renderTree();
        var tipExtra = self.isAdmin
          ? '请使用右上角「🩺 诊断连接」，填入 NAS 地址并保存。保存后，会自动同步到云端，其他用户登录任意电脑都可以直接使用。'
          : '管理员尚未发布 WebDAV 连接参数，或该参数正在同步中。请稍后刷新重试，或联系管理员在「🩺 诊断连接」里配置好后再使用。';
        self.showEmpty('🗂️ 尚未连接 NAS', tipExtra);
        return;
      }
      self.setStatus('warn', '正在连接 NAS...');
      self._bindDragAndDrop();
      // F2 快捷键：重命名选中项
      window.addEventListener('keydown', function(e){
        if (e.key === 'F2') {
          var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
          if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
          e.preventDefault();
          NAS.renameSelected();
        }
      });
      self.refresh();
    },

    // ===== 配置读取 =====
    _loadCfg: function() {
      var def = {
        serverUrl: 'https://100.75.76.59:44763', webdavPath: '/', rootFolder: '/saintydoc',
        username: '', password: '', mode: 'lan', uploadMaxMb: 500, verifySsl: true
      };
      try {
        var raw = App.store.get('nas_config', null);
        if (raw && raw.serverUrl) return Object.assign(def, raw);
      } catch (e) {}
      return def;
    },

    /**
     * 从 Supabase app_data_store 表直接拉取管理员发布的 NAS 全局共享配置 & 权限规则
     * （绕过用户级 RLS 的私有缓存；使用与 init-page independentPoll 相同的 apikey URL 模式）
     * 成功后写入 native localStorage，下次 App.store.get 就能读到。
     * @returns Promise<{ pulledNasConfig:boolean, pulledFolderPerms:boolean }>
     */
    _fetchSharedNasKeysFromCloud: function(timeoutMs) {
      var me = this;
      timeoutMs = timeoutMs || 6000;
      var REST_URL = 'https://ugoyacuagslqhqguxyqe.supabase.co/rest/v1/app_data_store';
      var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnb3lhY3VhZ3NscWhxZ3V4eXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzI5NTUsImV4cCI6MjEwMjUwODk1NX0._GdWOGWblSpOYm3y8f_d3aVQszfn2YbRjHN0FqZiLtI';
      return new Promise(function(resolve){
        var ctrl = new AbortController();
        var t = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
        fetch(REST_URL + '?select=store_key,payload,updated_at&apikey=' + encodeURIComponent(ANON_KEY), {
          cache: 'no-store',
          signal: ctrl.signal,
          credentials: 'omit',
        }).then(function(resp){
          clearTimeout(t);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.json();
        }).then(function(rows){
          if (!Array.isArray(rows)) return resolve({ pulledNasConfig: false, pulledFolderPerms: false, error: 'unexpected' });
          var origLS = window._origLocalStorage || window.localStorage;
          var out = { pulledNasConfig: false, pulledFolderPerms: false, loadedKeys: [] };
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            if (!r || !r.store_key) continue;
            if (r.store_key !== 'nas_config' && r.store_key !== 'nas_folder_perms') continue;
            if (r.payload === null || r.payload === undefined) continue;
            var serialized;
            try { serialized = JSON.stringify(r.payload); } catch(_) { continue; }
            try { origLS.setItem(r.store_key, serialized); } catch(_) {}
            if (r.store_key === 'nas_config') out.pulledNasConfig = true;
            if (r.store_key === 'nas_folder_perms') out.pulledFolderPerms = true;
            out.loadedKeys.push(r.store_key);
          }
          resolve(out);
        }).catch(function(err){
          clearTimeout(t);
          resolve({ pulledNasConfig: false, pulledFolderPerms: false, error: (err && err.message) || String(err || 'unknown') });
        });
      });
    },

    setStatus: function(kind, text) {
      var el = document.getElementById('connStatus');
      if (!el) return;
      var cls = kind === 'ok' ? 'ok' : (kind === 'err' ? 'err' : 'warn');
      el.innerHTML = '<span class="status-dot ' + cls + '"></span>' + text;
    },

    // ===== WebDAV 路径 =====
    _davBase: function() {
      var c = this.cfg;
      if (!c || !c.serverUrl) return null;
      var base = c.serverUrl.replace(/\/+$/, '');
      var wd = c.webdavPath.startsWith('/') ? c.webdavPath : '/' + c.webdavPath;
      return base + wd;
    },
    // 把「逻辑路径」转成 WebDAV 服务器上的绝对 path（不含协议主机，便于 self 判定）
    _absDavPath: function(logicPath) {
      var c = this.cfg;
      var wd = c.webdavPath.startsWith('/') ? c.webdavPath : '/' + c.webdavPath;
      var root = c.rootFolder.startsWith('/') ? c.rootFolder : '/' + c.rootFolder;
      var lp = logicPath;
      if (!lp || lp === '') lp = '/';
      if (lp.charAt(0) !== '/') lp = '/' + lp;
      if (lp === '/') lp = '';
      var p = (wd + root + lp).replace(/\/+/g, '/');
      return p;
    },
    _absUrl: function(logicPath) {
      var rawBase = this._davBase();
      if (!rawBase) return null;
      var base = rawBase.replace(/\/+$/, '');
      var c = this.cfg;
      var root = c.rootFolder.startsWith('/') ? c.rootFolder : '/' + c.rootFolder;
      root = root.replace(/\/+$/g, '');
      if (!root.startsWith('/')) root = '/' + root;
      var lp = logicPath;
      if (!lp || lp === '') lp = '/';
      if (lp.charAt(0) !== '/') lp = '/' + lp;
      if (lp === '/') lp = '';
      // rootFolder + logicPath 作为相对 davBase 的路径部分
      var pathPart = (root + lp).replace(/\/+/g, '/');
      if (pathPart.length > 1 && pathPart.charAt(pathPart.length - 1) === '/') pathPart = pathPart.slice(0, -1);
      return base + pathPart;
    },
    _absUrlEncoded: function(logicPath) {
      var base = this._davBase();
      if (!base) return null;
      var c = this.cfg;
      var root = c.rootFolder.startsWith('/') ? c.rootFolder : '/' + c.rootFolder;
      root = root.replace(/\/+$/g, '');
      if (!root.startsWith('/')) root = '/' + root;
      var lp = logicPath;
      if (!lp || lp === '') lp = '/';
      if (lp.charAt(0) !== '/') lp = '/' + lp;
      if (lp === '/') lp = '';
      var raw = (root + lp).replace(/\/+/g, '/');
      if (raw.length > 1 && raw.charAt(raw.length - 1) === '/') raw = raw.slice(0, -1);
      var encoded = raw.split('/').map(encodeURIComponent).join('/');
      return base.replace(/\/+$/, '') + encoded;
    },
    // 直接构造「物理 WebDAV 路径」的 URL，不走 rootFolder 映射（供 initRoot 等用）
    _physicalUrlEncoded: function(relDavPath) {
      var base = this._davBase();
      if (!base) return null;
      var rel = relDavPath || '';
      if (rel && !rel.startsWith('/')) rel = '/' + rel;
      rel = rel.replace(/\/+/g, '/');
      if (rel.length > 1 && rel.charAt(rel.length - 1) === '/') rel = rel.slice(0, -1);
      var encoded = rel.split('/').map(encodeURIComponent).join('/');
      return base.replace(/\/+$/, '') + encoded;
    },
    _headers: function(extra) {
      var h = extra ? Object.assign({}, extra) : {};
      var c = this.cfg;
      if (c && c.username) {
        try { h['Authorization'] = 'Basic ' + btoa(c.username + ':' + (c.password || '')); } catch(e) {}
      }
      return h;
    },

    // ===== 读取目录 =====
    listFolder: async function(logicPath) {
      var self = this;
      var encUrl = self._absUrlEncoded(logicPath);
      if (!encUrl) return [];

      // 0) 混合内容预检：https 页面 fetch http 目标会直接抛 Failed to fetch，被误判为 CORS
      var pageProto = (window.location.protocol || '').toLowerCase();
      var urlProtoMatch = encUrl.match(/^([a-zA-Z]+):\/\//);
      var targetProto = urlProtoMatch ? urlProtoMatch[1].toLowerCase() : '';
      if (pageProto === 'https:' && targetProto === 'http') {
        throw new Error('混合内容被拦截(Mixed Content)：当前页面是 HTTPS，但 WebDAV 地址是 HTTP。请改用 HTTPS 的 WebDAV 地址，或把 NAS 配置为 HTTPS 访问；或整站使用 HTTP 打开。（URL=' + encUrl + '）');
      }

      // 1) 浏览器在线？
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        throw new Error('浏览器离线(offline)：请检查 WiFi/网线 是否已连接。');
      }

      // 2) 带超时的 fetch（目标 NAS 机器关机/断网 → IP 不通 → fetch 会挂 2 分钟才抛，加 8 秒超时）
      var timeoutMs = 8000;
      var controller = new AbortController();
      var timerId = setTimeout(function(){ controller.abort(); }, timeoutMs);
      var resp;
      try {
        resp = await fetch(encUrl, {
          method: 'PROPFIND',
          headers: self._headers({ 'Depth': '1' }),
          credentials: 'omit',
          signal: controller.signal,
        });
        clearTimeout(timerId);
      } catch (fetchErr) {
        clearTimeout(timerId);
        var name = (fetchErr && fetchErr.name) ? fetchErr.name : '';
        var msg = (fetchErr && fetchErr.message) ? fetchErr.message : String(fetchErr || '');

        // 超时 → NAS 找不到（路由器给了新 IP / NAS 断电 / 端口没开）
        if (name === 'AbortError' || /timeout|timed?\s*out/i.test(msg)) {
          var ipInfo = '';
          try {
            var u = new URL(encUrl);
            ipInfo = '（目标主机 ' + u.hostname + ':' + (u.port || (u.protocol === 'https:' ? 443 : 80)) + '）';
          } catch(_) {}
          throw new Error('NAS 连接超时(8秒无响应)' + ipInfo +
            '。常见原因：①NAS 电脑关机或睡眠；②路由器给 NAS 重新分配了 IP；③防火墙阻止了 WebDAV 端口；④局域网 IP 段变了。请点击右上角「🩺 诊断连接」自动修复。');
        }

        // 非超时情况下，只有 "Failed to fetch" 这种无法精确判定的，再跑一次 OPTIONS 探针判断是不是 CORS
        var isLikelyCors = await self._probeCors(encUrl);
        if (isLikelyCors) {
          throw new Error('CORS 未配置：NAS WebDAV 响应缺少 Access-Control-Allow-Origin 头。请在 NAS Web 服务（Nginx/Apache/群晖/DSM）中给 WebDAV 路径加上：' +
            'add_header "Access-Control-Allow-Origin" "' + window.location.origin + '" always; add_header "Access-Control-Allow-Methods" "GET,HEAD,POST,PUT,DELETE,PROPFIND,PROPPATCH,MKCOL,COPY,MOVE,OPTIONS" always; add_header "Access-Control-Allow-Headers" "Depth,Authorization,Content-Type,If-Match,If-None-Match,Destination,Overwrite" always; add_header "Access-Control-Allow-Credentials" "true" always; 并对 OPTIONS 预检直接返回 204。原始错误：' + msg);
        }
        // 其它（DNS 解析失败、ERR_CONNECTION_REFUSED 等）
        var hostText = '';
        try { var uu = new URL(encUrl); hostText = '（主机 ' + uu.host + ' 拒绝连接或 DNS 解析失败）'; } catch(_) {}
        throw new Error('WebDAV 无法连接' + hostText + '。请检查：①服务器地址是否正确；②NAS 是否已开机；③WebDAV 服务是否启动；④端口/防火墙是否放行。原始错误：' + msg);
      }

      if (resp.status === 404) throw new Error('路径不存在(404)：请确认 WebDAV 路径 或 初始化根目录（在 设置→云盘NAS 核对根目录）。当前目录：' + (logicPath || '/'));
      if (resp.status === 401) throw new Error('认证失败(401)：NAS 账号密码不对，或 WebDAV 未授权该账号访问。请点击「🩺 诊断连接」重新输入账号密码。');
      if (resp.status === 403) throw new Error('权限不足(403)：WebDAV 账号禁止访问该路径。请检查 NAS 共享权限或切换账号。');
      if (resp.status >= 500) throw new Error('服务器内部错误(HTTP ' + resp.status + ')：NAS WebDAV 服务异常，尝试重启 NAS 的 Web 服务或 WebDAV 插件。');
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
      var xmlTxt = await resp.text();
      return self._parseMultistatus(xmlTxt, logicPath);
    },

    /**
     * 轻量 CORS 探针：用 OPTIONS 预检请求看浏览器是否能收到响应
     * - 返回 true  → 确实是 CORS 拦截（OPTIONS preflight 无响应头）
     * - 返回 false → 可能是 DNS/主机未到/协议错误
     */
    _probeCors: async function(targetUrl) {
      try {
        var origin = window.location.origin || '';
        var ctrl = new AbortController();
        var to = setTimeout(function(){ ctrl.abort(); }, 6000);
        var resp = await fetch(targetUrl, {
          method: 'OPTIONS',
          headers: {
            'Access-Control-Request-Method': 'PROPFIND',
            'Access-Control-Request-Headers': 'authorization,depth',
          },
          signal: ctrl.signal,
          credentials: 'omit',
        });
        clearTimeout(to);
        var acao = resp.headers.get('Access-Control-Allow-Origin');
        if (!acao) return true; // 没返回 ACAO → 就是 CORS 配置缺失
        if (acao !== '*' && acao !== origin) return true; // origin 未匹配 → CORS 配置错
        return false;
      } catch(e) {
        return false; // OPTIONS 自己都发不通，不是 CORS 的问题（主机/网络/协议层）
      }
    },

    _parseMultistatus: function(xmlTxt, logicPath) {
      var self = this;
      var parser = new DOMParser();
      var doc = parser.parseFromString(xmlTxt, 'application/xml');
      if (!doc || doc.documentElement.nodeName === 'parsererror') throw new Error('WebDAV 响应解析失败，可能不是 WebDAV 服务');
      var responses = doc.getElementsByTagNameNS('DAV:', 'response');
      if (responses.length === 0) responses = doc.getElementsByTagName('response');
      var items = [];
      var davAbsPathOfCurrent = self._absDavPath(logicPath);
      if (!davAbsPathOfCurrent.endsWith('/')) davAbsPathOfCurrent += '/';
      for (var i = 0; i < responses.length; i++) {
        var item = self._parseResponse(responses[i], logicPath, davAbsPathOfCurrent);
        if (!item || item._isSelf) continue;
        items.push(item);
      }
      items.sort(function(a,b){
        if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
        return a.name.localeCompare(b.name, 'zh');
      });
      return items;
    },
    _textOf: function(el, tagLocal) {
      if (!el) return null;
      var list = el.getElementsByTagNameNS('DAV:', tagLocal);
      if (!list || list.length === 0) list = el.getElementsByTagName(tagLocal);
      if (!list || list.length === 0) return null;
      return (list[0].textContent || '').trim();
    },
    _parseResponse: function(respEl, logicPath, davAbsPathOfCurrent) {
      var self = this;
      var href = self._textOf(respEl, 'href');
      if (!href) return null;
      try { if (href.indexOf('http') === 0) { var u = new URL(href); href = u.pathname; } } catch(e) {}
      // 规范化 href
      var props = null;
      var propstatEls = respEl.getElementsByTagNameNS('DAV:', 'propstat');
      if (!propstatEls || propstatEls.length === 0) propstatEls = respEl.getElementsByTagName('propstat');
      if (propstatEls && propstatEls.length) {
        for (var j = 0; j < propstatEls.length; j++) {
          var st = self._textOf(propstatEls[j], 'status') || '';
          if (st.indexOf(' 200 ') > 0) { props = propstatEls[j]; break; }
        }
        if (!props) props = propstatEls[0];
      } else {
        var propEls = respEl.getElementsByTagNameNS('DAV:', 'prop');
        if (!propEls || propEls.length === 0) propEls = respEl.getElementsByTagName('prop');
        if (propEls && propEls.length) props = propEls[0];
      }
      var isFolder = false;
      var resType = props ? props.getElementsByTagNameNS('DAV:', 'resourcetype') : null;
      if (!resType || !resType.length) resType = props ? props.getElementsByTagName('resourcetype') : null;
      if (resType && resType.length) {
        var rt = resType[0];
        var coll = rt.getElementsByTagNameNS('DAV:', 'collection');
        if (!coll || coll.length === 0) coll = rt.getElementsByTagName('collection');
        if (coll && coll.length) isFolder = true;
      }
      var size = self._textOf(props, 'getcontentlength');
      size = size ? parseInt(size, 10) : 0;
      if (isNaN(size)) size = 0;
      var lastMod = self._textOf(props, 'getlastmodified') || '';
      // 规范化 href 为 DavPath
      var hrefNorm = href.replace(/\/+$/g, '');
      var name = decodeURIComponent(hrefNorm.split('/').pop() || '');
      if (!name) return null;
      // 判断 self：如果 href 的 path 去掉末尾 / 后 等于 davAbsPathOfCurrent 去掉末尾 /
      var hrefForCmp = (href.replace(/\/+$/, '') + '/');
      var isSelf = (hrefForCmp === davAbsPathOfCurrent);
      return {
        name: name,
        href: href,
        isFolder: isFolder,
        size: size,
        lastModified: lastMod,
        _isSelf: isSelf,
      };
    },

    // ===== 新建文件夹 MKCOL =====
    mkDir: async function(name, logicPath) {
      if (!this.canWrite) { App.toast('您对当前模块无写权限', 'error'); return; }
      if (logicPath == null) logicPath = this.currentPath;
      if (!name) name = prompt('请输入新文件夹名称：', '新建文件夹');
      if (!name) return;
      name = name.trim().replace(/[\\/:*?"<>|]/g, '');
      if (!name) return App.toast('文件夹名称不合法', 'error');
      if (!this._folderWriteable(logicPath)) { App.toast('您在当前文件夹没有创建权限', 'error'); return; }
      try {
        var target = logicPath === '/' ? ('/' + name) : (logicPath + '/' + name);
        var url = this._absUrlEncoded(target);
        var resp = await fetch(url, { method: 'MKCOL', headers: this._headers(), credentials: 'omit' });
        if (!resp.ok) {
          if (resp.status === 405) throw new Error('该文件夹已存在(405)或父目录不存在');
          if (resp.status === 409) throw new Error('父目录不存在(409)');
          throw new Error('HTTP ' + resp.status);
        }
        // 清 tree cache 使父级下次重列
        this._invalidateTreeCache(logicPath);
        App.toast('✅ 文件夹已创建：' + name, 'success');
        this.refresh();
      } catch (e) {
        console.warn('[NAS] mkCol err:', e);
        App.toast('❌ 创建失败：' + (e && e.message ? e.message : String(e)), 'error');
      }
    },

    // ===== 初始化根目录 =====
    initRoot: async function() {
      if (!this.isAdmin) { App.toast('仅管理员可执行初始化', 'error'); return; }
      var root = (this.cfg.rootFolder || '/');
      if (!confirm('将在 WebDAV 上创建系统根目录「' + root + '」（若不存在），是否继续？')) return;
      var self = this;
      try {
        // 检查是否存在：用逻辑 / 对应的物理 URL（已拼 rootFolder）
        var url = self._absUrlEncoded('/');
        var resp = await fetch(url, { method: 'PROPFIND', headers: self._headers({ 'Depth': '0' }), credentials: 'omit' });
        if (resp.ok) {
          App.toast('✅ 根目录已就绪：' + root, 'success');
          self.refresh();
          return;
        }
        if (resp.status === 404) {
          // 逐级创建：built 是「物理路径片段（相对 davBase）」，直接走 _physicalUrlEncoded
          var parts = (root.startsWith('/') ? root.slice(1) : root).split('/').filter(Boolean);
          var built = '';
          for (var i = 0; i < parts.length; i++) {
            built += '/' + parts[i];
            var sub = self._physicalUrlEncoded(built);  // 不走 rootFolder 映射，避免叠加
            var r = await fetch(sub, { method: 'PROPFIND', headers: self._headers({ 'Depth': '0' }), credentials: 'omit' });
            if (r.ok) continue;
            if (r.status !== 404) throw new Error('创建「' + built + '」失败 HTTP ' + r.status);
            var rr = await fetch(sub, { method: 'MKCOL', headers: self._headers(), credentials: 'omit' });
            if (!rr.ok) throw new Error('创建「' + built + '」失败 HTTP ' + rr.status);
          }
          self._ensureRootFolderPerm();
          self.treeCache = {};
          App.toast('✅ 根目录初始化成功：' + root, 'success');
          self.refresh();
          return;
        }
        throw new Error('HTTP ' + resp.status);
      } catch (e) {
        App.toast('❌ 初始化失败：' + (e && e.message ? e.message : String(e)), 'error');
      }
    },

    // ===== 删除 =====
    deleteItem: async function(item) {

      if (!this._folderWriteable(this.currentPath)) { App.toast('您在当前目录无删除权限', 'error'); return; }
      try {
        var url = this._absUrlEncoded(sub) + (item.isFolder ? '/' : '');

    // ===== 下载 =====
    downloadItem: async function(item) {

      var sub = this.currentPath === '/' ? '/' + item.name : this.currentPath + '/' + item.name;
      try {
        var url = this._absUrlEncoded(sub);

    // ===== 预览 =====
    previewItem: async function(item) {

        this.cd(sub);

        return this.downloadItem(item);
      }
      var sub = this.currentPath === '/' ? '/' + item.name : this.currentPath + '/' + item.name;
      try {
        var url = this._absUrlEncoded(sub);
        var base64Auth = this.cfg.username ? btoa(this.cfg.username + ':' + (this.cfg.password || '')) : null;
        var resp = await fetch(url, {
          method: 'GET',
          headers: base64Auth ? { 'Authorization': 'Basic ' + base64Auth } : {},
          credentials: 'omit',
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        var blob = await resp.blob();
        var obj = URL.createObjectURL(blob);
        if (['pdf'].indexOf(ext) >= 0) { window.open(obj, '_blank'); return; }
        document.getElementById('previewImg').src = obj;
        document.getElementById('previewCaption').textContent = item.name + '  ·  ' + this._fmtSize(item.size) + '  ·  ' + (item.lastModified || '-');
        document.getElementById('previewOverlay').classList.add('active');
      } catch (e) {
        App.toast('❌ 预览失败：' + (e && e.message ? e.message : String(e)), 'error');
      }
    },

    // ===== 排序 =====
    toggleSort: function(field) {
      if (['name','date','type','size'].indexOf(field) < 0) return;
      if (this.sortBy === field) this.sortAsc = !this.sortAsc;
      else { this.sortBy = field; this.sortAsc = (field === 'date' ? false : true); }  // 修改日期默认新→旧
      try {
        App.store.set('nas_sort', { by: this.sortBy, asc: this.sortAsc });
      } catch(_) {}
      this.renderList();
    },
    _restoreSort: function() {
      try {
        var s = App.store.get('nas_sort', null);
        if (s && typeof s === 'object' && s.by) {
          if (['name','date','type','size'].indexOf(s.by) >= 0) this.sortBy = s.by;
          this.sortAsc = !!s.asc;
        }
      } catch(_) {}
    },
    _tsOfDate: function(s) {
      try {
        if (!s) return 0;
        var d = new Date(s);
        if (isNaN(d.getTime())) return 0;
        return d.getTime();
      } catch(e) { return 0; }
    },
    _typeOf: function(item) {
      if (item.isFolder) return '文件夹';
      var n = item.name || '';
      var idx = n.lastIndexOf('.');
      if (idx < 0 || idx === n.length - 1) return '文件';
      var ext = n.substring(idx + 1).toLowerCase();
      var map = {
        png:'PNG 图片', jpg:'JPEG 图片', jpeg:'JPEG 图片', gif:'GIF 图片',
        bmp:'BMP 图片', webp:'WebP 图片', svg:'SVG 图片', ico:'图标', avif:'AVIF 图片',
        pdf:'PDF 文档', doc:'Word 文档', docx:'Word 文档',
        xls:'Excel 表格', xlsx:'Excel 表格', csv:'CSV 表格',
        ppt:'PPT 演示', pptx:'PPT 演示',
        txt:'文本文件', md:'Markdown',
        zip:'压缩包', rar:'压缩包', '7z':'压缩包', tar:'压缩包', gz:'压缩包',
        js:'JavaScript', ts:'TypeScript', html:'网页', css:'样式表', json:'JSON',
        mp3:'音频', wav:'音频', flac:'音频', aac:'音频',
        mp4:'视频', mov:'视频', avi:'视频', mkv:'视频',
      };
      return map[ext] ? map[ext] : (ext.toUpperCase() + ' 文件');
    },
    _extOf: function(item) {
      if (item.isFolder) return '';
      var n = item.name || '';
      var idx = n.lastIndexOf('.');
      if (idx < 0 || idx === n.length - 1) return '';
      return n.substring(idx + 1).toLowerCase();
    },
    _sortList: function(list) {
      var self = this;
      var f = self.sortBy, asc = self.sortAsc ? 1 : -1;
      return list.slice().sort(function(a,b){
        // 文件夹永远在前
        if (a.isFolder !== b.isFolder) return a.isFolder ? -1 : 1;
        var va, vb;
        switch (f) {
          case 'date':
            va = self._tsOfDate(a.lastModified); vb = self._tsOfDate(b.lastModified);
            if (va === vb) break;
            return (va - vb) * asc;
          case 'size':
            va = (a.isFolder ? 0 : (a.size || 0)); vb = (b.isFolder ? 0 : (b.size || 0));
            if (va === vb) break;
            return (va - vb) * asc;
          case 'type':
            va = self._typeOf(a); vb = self._typeOf(b);
            if (va === vb) break;
            return va.localeCompare(vb, 'zh') * asc;
          case 'name':
          default:
            va = a.name; vb = b.name;
            if (va === vb) return 0;
            return va.localeCompare(vb, 'zh') * asc;
        }
        // 次排序：名称
        return a.name.localeCompare(b.name, 'zh');
      });
    },

    // ===== 重命名 =====
    renameSelected: function() {
      var self = this;
      var name = self.selectedPath ? self.selectedPath.split('/').pop() : null;
      if (!name) { App.toast('请先选中要重命名的文件或文件夹', 'info'); return; }
      var item = self.findItemByName(name);
      if (!item) { App.toast('未找到选中项', 'info'); return; }
      self.renameItem(item);
    },
    renameByName: function(name) {
      var item = this.findItemByName(name);
      if (!item) return;
      this.renameItem(item);
    },
    renameItem: function(item) {
      if (!this.canWrite) { App.toast('无写权限', 'error'); return; }
      if (!item) return;
      if (!this._folderWriteable(this.currentPath)) { App.toast('当前目录无修改权限', 'error'); return; }
      // 找到 DOM 上对应条目，触发内联重命名
      var sel = null;
      if (this.viewMode === 'details') {
        sel = document.querySelector('#fileListArea tr[data-name="' + CSS.escape(item.name) + '"]');
      } else {
        sel = document.querySelector('#fileListArea .item-card[data-name="' + CSS.escape(item.name) + '"]');
      }
      if (sel) this._beginInlineRename(sel, item);
      else this._promptRename(item);  // fallback
    },
    _promptRename: function(item) {
      var self = this;
      var n = prompt('请输入新的名称：', item.name);
      if (n == null) return;
      n = n.trim();
      if (!n || n === item.name) return;
      self._doRename(item.name, n);
    },
    _beginInlineRename: function(el, item) {
      var self = this;
      self._renamingOldName = item.name;
      // 找名称文本位置替换成 input
      // details 视图：td 内 .fname；图标视图：.card-name
      var nameEl = el.querySelector('.fname') || el.querySelector('.card-name');
      if (!nameEl) { self._promptRename(item); return; }
      var oldHtml = nameEl.innerHTML;
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'rename-input';
      input.value = item.name;
      // 选中主文件名（不含扩展名，文件夹全选）
      var selEnd = item.name.length;
      if (!item.isFolder) {
        var idx = item.name.lastIndexOf('.');
        if (idx > 0) selEnd = idx;
      }
      nameEl.innerHTML = '';
      nameEl.appendChild(input);
      setTimeout(function(){
        input.focus();
        try { input.setSelectionRange(0, selEnd); } catch(e) { input.select(); }
      }, 10);
      function commit(cancel) {
        if (!input.parentElement) return;
        var newName = input.value.trim();
        nameEl.innerHTML = oldHtml;
        self._renamingOldName = null;
        if (cancel || !newName || newName === item.name) return;
        self._doRename(item.name, newName);
      }
      input.addEventListener('blur', function(){ commit(false); });
      input.addEventListener('keydown', function(e){
        if (e.key === 'Enter') { e.preventDefault(); commit(false); }
        else if (e.key === 'Escape') { e.preventDefault(); commit(true); }
      });
      input.addEventListener('click', function(e){ e.stopPropagation(); });
    },
    _doRename: async function(oldName, newName) {
      var self = this;
      if (!oldName || !newName || oldName === newName) return;
      // 基础校验
      if (/[\\/:*?"<>|]/.test(newName)) { App.toast('名称不能包含 \\ / : * ? " < > |', 'error'); return; }
      var cleanNew = newName.trim();
      if (!cleanNew) return;
      if (cleanNew === oldName) return;
      // 同级重名检查
      var exist = (self.rawList || []).find(function(x){ return x.name.toLowerCase() === cleanNew.toLowerCase(); });
      if (exist) { App.toast('该目录下已存在同名项：' + cleanNew, 'error'); return; }
      var logicOld = self.currentPath === '/' ? '/' + oldName : self.currentPath + '/' + oldName;
      var logicNew = self.currentPath === '/' ? '/' + cleanNew : self.currentPath + '/' + cleanNew;
      try {
        var srcUrl = self._absUrlEncoded(logicOld);
        var destAbsPath = self._absDavPath(logicNew);  // 服务器上的绝对路径
        // Destination 需要用完整 URL 才兼容多数 WebDAV 实现
        var destFullUrl = self._absUrl(logicNew);
        var resp = await fetch(srcUrl, {
          method: 'MOVE',
          headers: self._headers({
            'Destination': destFullUrl,
            'Overwrite': 'F'
          }),
          credentials: 'omit'
        });
        if (!resp.ok) {
          if (resp.status === 409) throw new Error('目标路径不存在(409)');
          if (resp.status === 412) throw new Error('已存在同名项(412)');
          throw new Error('HTTP ' + resp.status);
        }
        self._invalidateTreeCache(self.currentPath);
        App.toast('✅ 已重命名：' + oldName + ' → ' + cleanNew, 'success');
        // 若有选中，同步刷新
        self.selectedPath = null;
        self.refresh();
      } catch (e) {
        console.warn('[NAS] rename err:', e);
        App.toast('❌ 重命名失败：' + (e && e.message ? e.message : String(e)), 'error');
      }
    },

    // ===== 上传：多选 + 拖放文件夹（保留相对结构） =====
    pickUpload: function() {
      var el = document.getElementById('folderPicker');
      if (el) { el.value = ''; el.click(); }
    },
    pickUploadFiles: function() {
      var el = document.getElementById('filePicker');
      if (el) { el.value = ''; el.click(); }
    },
    onFilePick: function(ev) {
      if (!ev || !ev.target || !ev.target.files || ev.target.files.length === 0) return;
      var list = this._fileListToEntries(Array.from(ev.target.files), ev.target);
      this.uploadEntries(list, this.currentPath);
      ev.target.value = '';
    },
    // 把 FileList + (optional) webkitRelativePath 转成统一的「条目」数组：{relPath, file}
    _fileListToEntries: function(files, pickerEl) {
      var out = [];
      files.forEach(function(f){
        var rel = (f.webkitRelativePath || f.name || '').replace(/\\/g, '/');
        // 若有 webkitRelativePath，形如 "我的文件夹/子目录/a.png"，其首段就是顶层选择的文件夹名；
        // 如果只是多选文件则无相对路径
        out.push({ relPath: rel, file: f });
      });
      return out;
    },
    // 拖放：绑定整页
    _bindDragAndDrop: function() {
      var self = this;
      if (!self.canWrite) return;
      var dragCount = 0;
      var mask = document.getElementById('dropMask');
      var content = document.querySelector('.nas .content-inner');
      var treeHost = document.getElementById('treeHost');

      function showMask(target) {
        if (!mask) return;
        mask.classList.add('active');
        var dp = document.getElementById('dropTargetPath');
        if (dp) dp.textContent = self._logicPathDisplay(target || self.currentPath);
      }
      function hideMask() {
        if (mask) mask.classList.remove('active');
        self._clearDragHighlights();
        self.dragTargetLogicPath = null;
      }

      // 全局 dragenter/dragleave 控制遮罩
      window.addEventListener('dragenter', function(e){
        if (!self._isFileDrag(e)) return;
        e.preventDefault();
        dragCount++;
        // 找悬停目标
        var t = self._resolveDragTarget(e);
        self.dragTargetLogicPath = t;
        showMask(t);
        self._highlightDragTarget(t);
      }, true);
      window.addEventListener('dragover', function(e){
        if (!self._isFileDrag(e)) return;
        e.preventDefault();
        var t = self._resolveDragTarget(e);
        if (t !== self.dragTargetLogicPath) {
          self.dragTargetLogicPath = t;
          self._highlightDragTarget(t);
          var dp = document.getElementById('dropTargetPath');
          if (dp) dp.textContent = self._logicPathDisplay(t || self.currentPath);
        }
        if (e.dataTransfer) try { e.dataTransfer.dropEffect = 'copy'; } catch(_) {}
      }, true);
      window.addEventListener('dragleave', function(e){
        if (!self._isFileDrag(e)) return;
        dragCount = Math.max(0, dragCount - 1);
        if (dragCount === 0) hideMask();
      }, true);
      window.addEventListener('drop', function(e){
        if (!self._isFileDrag(e)) return;
        e.preventDefault(); dragCount = 0;
        var target = self.dragTargetLogicPath || self.currentPath;
        hideMask();
        if (!self._folderWriteable(target)) { App.toast('目标文件夹没有上传权限', 'error'); return; }
        self._handleDrop(e, target);
      }, true);
    },
    _isFileDrag: function(e) {
      if (!e || !e.dataTransfer) return false;
      var types = e.dataTransfer.types;
      if (!types) return false;
      for (var i = 0; i < types.length; i++) if (types[i] === 'Files') return true;
      return false;
    },
    _resolveDragTarget: function(e) {
      var self = this;
      // 优先：悬停在左树某个 tree-row 上
      var tr = e.target && e.target.closest ? e.target.closest('.tree-row') : null;
      if (tr) {
        var lp = tr.getAttribute('data-logic-path');
        if (lp != null) return lp;
      }
      // 其次：悬停在右内容区的表格行（文件夹行）
      var row = e.target && e.target.closest ? e.target.closest('tbody tr') : null;
      if (row) {
        var nameEl = row.querySelector('.name-cell .fname');
        if (!nameEl) return self.currentPath;
        var nm = nameEl.textContent;
        var entry = self.rawList && self.rawList.find(function(x){ return x.name === nm; });
        if (entry && entry.isFolder) {
          return self.currentPath === '/' ? '/' + nm : self.currentPath + '/' + nm;
        }
      }
      // 再其次：悬停在图标视图（大/小图标）的 item-card 上
      var card = e.target && e.target.closest ? e.target.closest('.item-card') : null;
      if (card) {
        var nm2 = card.getAttribute('data-name');
        if (nm2) {
          var entry2 = self.rawList && self.rawList.find(function(x){ return x.name === nm2; });
          if (entry2 && entry2.isFolder) {
            return self.currentPath === '/' ? '/' + nm2 : self.currentPath + '/' + nm2;
          }
        }
      }
      return self.currentPath;
    },

    _logicPathDisplay: function(lp) {

    _rootDisplayName: function() {

      r = r.replace(/\/+/g, '/');

    _handleDrop: async function(e, targetLogicPath) {
      var self = this;
      var dt = e.dataTransfer;
      if (!dt) return;
      var entries = [];
      // 优先用 DataTransferItem + webkitGetAsEntry（支持文件夹递归）
      if (dt.items && dt.items.length) {
        try {
          for (var i = 0; i < dt.items.length; i++) {
            var it = dt.items[i];
            if (it.kind !== 'file') continue;
            var entry = (it.webkitGetAsEntry && it.webkitGetAsEntry()) || null;
            if (entry) entries.push({ __entry: entry, relPrefix: '' });
            else {
              // fallback 到 file
              var f = it.getAsFile();
              if (f) entries.push({ __file: f, relPrefix: '' });
            }
          }
        } catch(_) {}
      }
      if (entries.length === 0 && dt.files && dt.files.length) {
        Array.from(dt.files).forEach(function(f){ entries.push({ __file: f, relPrefix: '' }); });
      }
      if (!entries.length) return;
      var flat = await self._flattenEntries(entries);
      if (!flat || !flat.length) return;
      self.uploadEntries(flat, targetLogicPath);
    },
    // 把 DataTransferItem Entry（含目录结构）递归扁平化：[{relPath, file}]
    _flattenEntries: function(entries) {
      var self = this;
      var out = [];
      function readDir(entry, prefix) {
        return new Promise(function(res){
          var reader = entry.createReader();
          var all = [];
          function step() {
            reader.readEntries(function(results){
              if (!results || !results.length) return res(all);
              all = all.concat(results);
              step();
            }, function(){ res(all); });
          }
          step();
        });
      }
      async function walk(e, prefix) {
        if (e.__file) {
          out.push({ relPath: prefix + e.__file.name, file: e.__file });
          return;
        }
        var entry = e.__entry;
        var pfx = e.relPrefix || prefix || '';
        if (!entry) return;
        if (entry.isFile) {
          await new Promise(function(res){
            entry.file(function(f){
              out.push({ relPath: pfx + entry.name, file: f });
              res();
            }, function(){ res(); });
          });
        } else if (entry.isDirectory) {
          var subPrefix = pfx + entry.name + '/';
          var children = await readDir(entry, pfx);
          for (var i = 0; i < children.length; i++) {
            await walk({ __entry: children[i], relPrefix: subPrefix }, subPrefix);
          }
        }
      }
      return Promise.all(entries.map(function(e){ return walk(e, ''); })).then(function(){ return out; });
    },

    uploadEntries: async function(entryList, targetLogicPath) {
      var self = this;
      if (!self.canWrite) { App.toast('无写权限', 'error'); return; }
      if (!self._folderWriteable(targetLogicPath)) { App.toast('目标文件夹没有上传权限', 'error'); return; }
      if (!entryList || !entryList.length) return;
      var maxMb = (self.cfg && self.cfg.uploadMaxMb) || 500;
      // 分组：按 relPath 的父级目录，先 MKCOL 所有父级目录，再逐个 PUT 文件
      var needDirs = new Set();
      var safeList = [];
      entryList.forEach(function(e){
        var rel = (e.relPath || '').replace(/\\/g, '/').replace(/^\/+/, '');
        if (!rel) rel = e.file ? e.file.name : '';
        if (!rel) return;
        var segs = rel.split('/');
        if (segs.length > 1) {
          var acc = '';
          for (var i = 0; i < segs.length - 1; i++) {
            acc += (acc ? '/' : '') + segs[i];
            needDirs.add(acc);
          }
        }
        if (e.file.size > maxMb * 1024 * 1024) {
          App.toast('「' + (e.file.name || rel) + '」超过 ' + maxMb + 'MB，已跳过', 'warning');
          return;
        }
        safeList.push({ relPath: rel, file: e.file });
      });
      // 逐层 MKCOL（先短后长，依赖父）
      var sortedDirs = Array.from(needDirs).sort(function(a,b){ return a.length - b.length; });
      for (var i = 0; i < sortedDirs.length; i++) {
        var dirRel = sortedDirs[i];
        var logicDir = targetLogicPath === '/' ? '/' + dirRel : targetLogicPath + '/' + dirRel;
        try {
          var u = self._absUrlEncoded(logicDir);
          var r = await fetch(u, { method: 'PROPFIND', headers: self._headers({ 'Depth':'0' }), credentials:'omit' });
          if (!r.ok && r.status === 404) {
            var rr = await fetch(u, { method: 'MKCOL', headers: self._headers(), credentials:'omit' });
            if (!rr.ok && rr.status !== 405) console.warn('[NAS] mkcol upload dir fail:', logicDir, rr.status);
          }
        } catch(err) { console.warn('[NAS] ensureDir err:', logicDir, err); }
      }
      // 上传文件（并发控制 2 个）
      var idx = 0; var ok = 0, err = 0;
      async function worker() {
        while (idx < safeList.length) {
          var cur = idx++;
          var ent = safeList[cur];
          var logicFile = targetLogicPath === '/' ? '/' + ent.relPath : targetLogicPath + '/' + ent.relPath;
          try { await self.uploadOne(ent.file, logicFile); ok++; }
          catch (e) { err++; console.warn('[NAS] upload err:', ent.relPath, e); }
        }
      }
      await Promise.all([worker(), worker()]);
      self._invalidateTreeCache(targetLogicPath);
      self.refresh();
      if (safeList.length) {
        App.toast('✅ 上传完成：成功 ' + ok + '，失败 ' + err, err ? 'warning' : 'success');
      }
    },

    uploadOne: function(file, logicPath) {
      var self = this;
      var url = self._absUrlEncoded(logicPath);
      var displayName = file.name;
      return new Promise(function(resolve, reject){
        var xhr = new XMLHttpRequest();
        var toastId = self._showUploadToast(displayName);
        xhr.open('PUT', url, true);
        if (self.cfg && self.cfg.username) {
          xhr.setRequestHeader('Authorization', 'Basic ' + btoa(self.cfg.username + ':' + (self.cfg.password || '')));
        }
        var bar = self._getUploadToastBar(toastId);
        if (xhr.upload) {
          xhr.upload.onprogress = function(e){
            if (e.lengthComputable) {
              var pct = Math.max(1, Math.round(e.loaded / e.total * 100));
              self._setUploadProgress(pct);
              self._setUploadToast(toastId, pct);
            }
          };
        }
        xhr.onload = function(){
          self._setUploadProgress(0);
          if (xhr.status >= 200 && xhr.status < 300) {
            self._setUploadToast(toastId, 100, 'ok', '✓ 上传成功');
            setTimeout(function(){ self._hideUploadToast(toastId); }, 2000);
            resolve();
          } else {
            self._setUploadToast(toastId, 0, 'err', '✗ 失败：HTTP ' + xhr.status);
            reject(new Error('HTTP ' + xhr.status));
          }
        };
        xhr.onerror = function(){
          self._setUploadProgress(0);
          self._setUploadToast(toastId, 0, 'err', '✗ 网络错误或 CORS 未开启');
          reject(new Error('network'));
        };
        xhr.send(file);
      });
    },

    _setUploadProgress: function(pct) {
      var el = document.getElementById('uploadProgress');
      var bar = document.getElementById('uploadProgressBar');
      if (!el || !bar) return;
      if (pct <= 0 || pct >= 100) { el.style.display = 'none'; bar.style.width = '0%'; }
      else { el.style.display = 'block'; bar.style.width = pct + '%'; }
    },
    _showUploadToast: function(name) {
      var host = document.getElementById('uploadToasts');
      var id = 't_' + Date.now() + '_' + Math.round(Math.random()*1000);
      var el = document.createElement('div');
      el.className = 'upload-toast';
      el.id = id;
      el.innerHTML = '<div class="t-title">' + App.utils.escapeHtml(name) + '</div><div class="t-bar"><span style="width:0%;"></span></div>';
      host.appendChild(el);
      return id;
    },

    closeSettings: function() {
