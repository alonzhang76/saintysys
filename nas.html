    },
    /** 用给定 cfg 快速构造一次 PROPFIND 请求到 /webdav + rootFolder，返回 {ok, err, detail} */
    _probeCfg: async function(cfg) {
      if (!cfg || !cfg.serverUrl) return { ok: false, err: '缺少 serverUrl', detail: '' };
      var base = cfg.serverUrl.replace(/\/+$/, '');
      var wd = (cfg.webdavPath || '/webdav').replace(/\/+$/, '');
      if (!wd.startsWith('/')) wd = '/' + wd;
      var root = (cfg.rootFolder || '/saintydoc').replace(/\/+$/, '');
      if (!root.startsWith('/')) root = '/' + root;
      // 组合目标 URL：先对路径段逐个 encodeURIComponent，再用 / 拼起来，避免中文/空格失败
      var pathParts = (wd + root).split('/').filter(Boolean);
      var encodedPath = '/' + pathParts.map(function(p){ return encodeURIComponent(p); }).join('/');
      var target = base + encodedPath;
      var hostTextForHuman = '';
      try { var uu = new URL(target); hostTextForHuman = uu.hostname + ':' + (uu.port || (uu.protocol === 'https:' ? '443' : '80')); } catch(_) {}

      // 0) 混合内容：HTTPS 页面不能直接 fetch HTTP
      var pageProto = (window.location.protocol || '').toLowerCase();
      var targetProtoMatch = base.match(/^([a-zA-Z]+):\/\//);
      var targetProto = targetProtoMatch ? targetProtoMatch[1].toLowerCase() : '';
      if (pageProto === 'https:' && targetProto === 'http') {
        return { ok: false, err: '混合内容拦截(Mixed Content)：当前页面是 HTTPS，但你填的 NAS 地址是 HTTP，浏览器禁止这种请求。',
          detail: '解决：①把整站改为 HTTP 打开；或 ②在 NAS 上开启 HTTPS（自签也行）后填 HTTPS 地址。' };
      }

      // 1) 浏览器离线？
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        return { ok: false, err: '浏览器离线(offline)：本机网卡/WiFi 未连接到网络。', detail: '请先确认本机能联网，并能 ping NAS 主机。' };
      }

      var headers = {};
      if (cfg.username) {
        try { headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(cfg.username + ':' + (cfg.password || '')))); }
        catch(_) {
          // btoa 对纯中文/中日韩会抛；这里退回到 header 原样设置（大多数浏览器支持 UTF-8 Basic 中的 Latin-1 兼容）
          try { headers['Authorization'] = 'Basic ' + btoa(cfg.username + ':' + (cfg.password || '')); } catch(_2) {}
        }
      }
      headers['Depth'] = '1';

      var ctrl = new AbortController();
      var timeoutMs = 6000;
      var t = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
      try {
        var resp = await fetch(target, { method: 'PROPFIND', headers: headers, credentials: 'omit', signal: ctrl.signal });
        clearTimeout(t);
        if (resp.status === 404) return { ok: false, status: resp.status, err: 'HTTP 404：路径不存在', detail: 'NAS WebDAV 根目录 + 业务根路径 ' + wd + root + ' 在服务器上不存在。请核对 WebDAV 子路径（常见 /webdav、/dav、空）、系统根目录（常见 /saintydoc、/、/share）。URL：' + target };
        if (resp.status === 401) return { ok: false, status: resp.status, err: 'HTTP 401：账号或密码错误', detail: '或该账号未开通 WebDAV 权限。请在 NAS 管理后台核对账号密码/WebDAV 权限。用户名：' + (cfg.username || '(匿名)') };
        if (resp.status === 403) return { ok: false, status: resp.status, err: 'HTTP 403：账号无权限访问该路径', detail: '请在 NAS 共享中心/WebDAV 设置里给该账号分配目录 ' + wd + root + ' 的读取权限。' };
        if (resp.status === 405 || resp.status === 501) return { ok: false, status: resp.status, err: 'HTTP ' + resp.status + '：服务器不支持 PROPFIND', detail: '这可能不是一个 WebDAV 服务端 (很可能你填的端口是 Synology DSM/普通 HTTP 站点，不是 WebDAV 端口)。请改用正确的 WebDAV 端口。' };
        if (resp.status >= 500) return { ok: false, status: resp.status, err: 'HTTP ' + resp.status + ' ' + resp.statusText, detail: 'NAS WebDAV 服务端异常，建议重启 NPM/Nginx/WebDAV 服务。' };
        if (resp.status >= 200 && resp.status < 300) return { ok: true, status: resp.status, detail: 'URL=' + target };
        return { ok: false, status: resp.status, err: 'HTTP ' + resp.status + ' ' + resp.statusText, detail: 'URL=' + target };
      } catch(e) {
        clearTimeout(t);
        var name = (e && e.name) ? e.name : '';
        var msg = (e && e.message) ? e.message : String(e || '');
        var outMsg = '';
        var outDetail = '';
        // 超时
        if (name === 'AbortError' || /timeout|timed?\s*out/i.test(msg)) {
          outMsg = '连接超时(' + (timeoutMs/1000) + 's 无响应)：主机 ' + hostTextForHuman + ' 无法到达';
          outDetail = '最常见原因（按优先级）：\n' +
            '① NAS 机器上的 Windows 防火墙拦截了该端口 → 请在 NAS 机器上把 NPM/WebDAV 监听的端口加到"入站规则-允许"，或临时关闭 Windows 防火墙测试 1 分钟；\n' +
            '② NPM/Nginx/WebDAV 只监听在 127.0.0.1（回环）→ 请改为 0.0.0.0 或 NAS 的局域网 IP；\n' +
            '③ 路由器 AP 隔离/访客 WiFi/双频合一 导致跨客户端不可达 → 请确认两台电脑都连同一个 2.4G/同一个有线交换机，并关闭"客户端隔离"；\n' +
            '④ NAS 机器的 IP 已变/端口填错 → 你填的 serverUrl=' + base;
          return { ok: false, err: outMsg, detail: outDetail, timedOut: true };
        }

        // 非超时但 Failed to fetch → 再分情况
        // 先跑 CORS 探针
        var cors = false;
        try { cors = await NAS._probeCors(target); } catch(_) {}
        if (cors) {
          return { ok: false, err: 'CORS 拦截：NAS WebDAV 没有返回 Access-Control-Allow-Origin 头',
            detail: '请在 NAS 的 Nginx/NPM/WebDAV 反向代理配置中加上响应头：\n' +
              'add_header "Access-Control-Allow-Origin" "' + window.location.origin + '" always;\n' +
              'add_header "Access-Control-Allow-Methods" "GET,HEAD,POST,PUT,DELETE,PROPFIND,PROPPATCH,MKCOL,COPY,MOVE,OPTIONS" always;\n' +
              'add_header "Access-Control-Allow-Headers" "Depth,Authorization,Content-Type,If-Match,If-None-Match,Destination,Overwrite" always;\n' +
              'add_header "Access-Control-Allow-Credentials" "true" always;\n' +
              '并对 OPTIONS 预检直接 return 204;\n原始错误: ' + msg };
        }

        // HTTPS 的 Failed to fetch 极大概率是自签证书未被浏览器信任
        if (targetProto === 'https') {
          outMsg = 'HTTPS 证书未被信任/SSL握手失败';
          outDetail = '请新开一个浏览器标签页，手动访问以下地址并"接受风险/继续访问"（把自签证书导入浏览器信任一次即可）：\n' + target + '\n然后再回到这里点 🧪 测试连接。\n如果确认不需要 HTTPS，直接改成 HTTP 地址也可（但整站也要是 HTTP）。原始错误: ' + msg;
          return { ok: false, err: outMsg, detail: outDetail };
        }

        // 其它（DNS 解析失败、连接被拒 等）
        outMsg = '连接失败: ' + msg;
        outDetail = '请用下面三步快速定位根因：\n' +
          '① 在当前电脑新开标签页直接打开 → ' + target + ' ← 看浏览器能不能加载；\n' +
          '② 如果浏览器提示"无法访问此站点/拒绝连接"，说明 NAS 的端口没开放/没监听/防火墙拦截；\n' +
          '③ 如果浏览器弹出 401 输入账号密码，说明主机和端口是通的 → 回到本页重新确认账号密码/子路径。\n主机: ' + hostTextForHuman + '；原始错误: ' + msg;
        return { ok: false, err: outMsg, detail: outDetail, rawTarget: target };
      }
    },
    async testConnection() {
      this._diagClear();
      var cfg = this._readSettingsForm();
      var base = (cfg.serverUrl || '').replace(/\/+$/, '');
      var wd = (cfg.webdavPath || '/webdav').replace(/\/+$/, ''); if (!wd.startsWith('/')) wd = '/' + wd;
      var root = (cfg.rootFolder || '/saintydoc').replace(/\/+$/, ''); if (!root.startsWith('/')) root = '/' + root;
      var pathParts = (wd + root).split('/').filter(Boolean);
      var encodedPath = '/' + pathParts.map(function(p){ return encodeURIComponent(p); }).join('/');
      var target = base + encodedPath;
      this._diag('🧪 开始测试连接…');
      this._diag('  serverUrl = ' + (cfg.serverUrl || '(空)'));
      this._diag('  最终请求 URL = ' + target);
      this._diag('  （👉 请先手动把上面这一整行 URL，复制到当前电脑的浏览器新标签里打开，这是最快的排查手段！）');
      this._diag('  账号 = ' + (cfg.username || '(匿名)'));
      this._diag('');
      var r = await this._probeCfg(cfg);
      if (r.ok) {
        this._diag('✅ 连接成功（HTTP ' + (r.status || '207') + '）。可以点「💾 保存」把这个配置发布给所有电脑用户。');
        if (r.detail) this._diag('详情: ' + r.detail);
      } else {
        this._diag('❌ 连接失败：' + (r.err || '未知错误'), true);
        if (r.detail) this._diag('🔎 排查提示：\n' + r.detail, true);
        if (r.timedOut) {
          this._diag('');
          this._diag('⚠️  这是"连端口都没连上"的典型症状。请先按下面的 1-2-3 做：');
          this._diag('  1) 在 NAS 机器上：Win+R → 输入 WF.msc → 入站规则 → 新建规则 → 端口 → TCP → 填你 WebDAV 的端口号 → 允许连接 → 域/专用/公网 全勾 → 命名"WebDAV入站"。勾完立刻再测一次。');
          this._diag('  2) 在 NAS 机器上，打开 PowerShell 输入:  netstat -ano | findstr LISTENING  看 WebDAV 端口是不是在 0.0.0.0:<端口> 上 LISTENING。如果只有 127.0.0.1:<端口>，说明绑定错了，需要改 NPM/Nginx 监听为 0.0.0.0。');
          this._diag('  3) 当前电脑打开 cmd 试:  ping <NAS主机名或IP>   看 ping 通不通。不通 → 两台电脑不在同一局域网/AP隔离。');
        }
      }
    },
    async saveSettings() {
      // 防御性检查：非管理员绝对不能写入全局共享 nas_config
      if (!this.isAdmin) {
        if (App && App.toast) App.toast('🛑 非管理员不能修改全局 WebDAV 配置。请联系管理员操作。', 'error', 3000);
        this._diag('🛑 当前账号不是管理员，禁止修改全局配置。', true);
        return;
      }
      var cfg = this._readSettingsForm();
      if (!cfg.serverUrl) { if (App && App.toast) App.toast('请先填写 NAS 服务器地址', 'warning'); return; }
      // 保存前先做一次快速测试
      this._diagClear();
      this._diag('💾 正在保存前测试连接…');
      var r = await this._probeCfg(cfg);
      var me = this;
      if (!r.ok) {
        this._diag('⚠️  测试未通过：' + r.err + '。仍然准备二次确认…', true);
        if (App && typeof App.confirm === 'function') {
          try {
            App.confirm('测试连接失败，仍然要保存吗？（' + r.err + '）', function(){ me._doSaveSettings(cfg); }, function(){ me._diag('已取消保存。'); });
            return;
          } catch(e) { /* 忽略 App.confirm 兼容性问题，直接保存 */ }
        } else {
          // 没有 confirm，直接保存
        }
      } else {
        this._diag('✅ 测试通过：HTTP ' + (r.status || '207'));
      }
      this._doSaveSettings(cfg);
    },
    _doSaveSettings: function(cfg) {
      // 保存到 nas_config（App.store → 已加入 SUPERSET_KEYS → 自动同步云端）
      // 再加 cloud-write-request 保证独立 REST 通道兜底上传；非管理员会被 init-page 的写入守卫丢弃
      try { App.store.set('nas_config', cfg); } catch(_) {}
      try {
        window.dispatchEvent(new CustomEvent('cloud-write-request', {
          detail: { key: 'nas_config', value: cfg, ts: Date.now() }
        }));
      } catch(_) {}
      this.cfg = cfg;
      if (App && App.toast) App.toast('✅ 配置已保存并同步到云端，所有电脑/用户登录后都可直接使用', 'success', 2500);
      this.closeSettings();
      this.setStatus('warn', '正在使用新配置重新连接 NAS…');
      try { this.refresh(); } catch(_) {}
    },

    /**
     * 生成常见的候选 IP/主机名 + 端口 + WebDAV 路径组合，用于扫描。
     * 针对"昨天能用今天不能"这种典型场景（路由器给 NAS 分配了同网段另一个 IP）
     */
    _guessNasCandidates: function() {
      var list = [];
      var push = function(serverUrl) { if (serverUrl) list.push(serverUrl); };
      // 1) 自己原始配置
      var c = this.cfg || {};
      if (c.serverUrl) push(c.serverUrl);
      // 2) hostname 解析（同机 DSM 服务常见名）
      var host = window.location.hostname;
      push('http://' + host + ':5005');       // 自搭常见 WebDAV 端口
      push('http://' + host + ':5006');
      push('http://' + host + ':8080');       // 通用 HTTP 端口
      push('http://' + host + ':80');
      push('https://' + host + ':5006');
      push('https://' + host + ':443');
      // 群晖/TrueNAS/DSM 默认
      push('http://' + host + ':5000');       // DSM 默认 HTTP
      push('https://' + host + ':5001');      // DSM 默认 HTTPS
      push('http://nas.local:5005');
      push('http://dxp4800plus-ring.local:5005');
      push('http://nas.local:8080');
      push('http://127.0.0.1:5005');
      push('http://localhost:5005');
      push('http://127.0.0.1:8080');
      // 3) 若当前页面在局域网，拿其 IP 三段去扫尾号 1-254（挑几个最常见的 NAS 尾号：1,2,10,100,108,200,201,250）
      var own = '';
      if (host && /^\d+\.\d+\.\d+\.\d+$/.test(host)) own = host;
      else if (window.RUNTIME_NAS_LAN_PREFIX) own = window.RUNTIME_NAS_LAN_PREFIX;
      if (own) {
        var m = own.match(/^(\d+\.\d+\.\d+)\.\d+$/);
        if (m) {
          var pre = m[1];
          [1,2,3,4,5,10,20,50,60,80,100,108,110,150,200,201,220,230,240,250,251].forEach(function(tail){
            push('http://' + pre + '.' + tail + ':5005');
            push('http://' + pre + '.' + tail + ':5000');
            push('https://' + pre + '.' + tail + ':5001');
            push('http://' + pre + '.' + tail + ':8080');
          });
        }
      } else {
        // 没抓到当前主机 IP，兜底扫最常用的两个内网段几个尾号
        ['192.168.1','192.168.31','192.168.0','10.0.0'].forEach(function(pre){
          [1,2,10,20,100,108,200,250].forEach(function(tail){
            push('http://' + pre + '.' + tail + ':5005');
            push('http://' + pre + '.' + tail + ':8080');
          });
        });
      }
      // 去重
      var seen = {}; var out = [];
      for (var i = 0; i < list.length; i++) if (!seen[list[i]]) { seen[list[i]] = 1; out.push(list[i]); }
      return out;
    },

    async scanLocalNas() {
      this._diagClear();
      var me = this;
      var servers = me._guessNasCandidates();
      me._diag('🔍 扫描本地 NAS：' + servers.length + ' 个候选地址（每台 3 秒超时，逐个并发 6 个）');
      var currentCandidates = [];
      servers.forEach(function(s){
        currentCandidates.push({
          serverUrl: s, webdavPath: (me.cfg && me.cfg.webdavPath) || '/webdav',
          rootFolder: (me.cfg && me.cfg.rootFolder) || '/saintydoc',
          username: (me.cfg && me.cfg.username) || '',
          password: (me.cfg && me.cfg.password) || '',
        });
      });
      var hit = await me._probeCandidates(currentCandidates, 6, 3000);
      if (hit) {
        me._diag('✅ 找到可用服务器：' + hit.serverUrl + '。已自动填入，请保存。');
        document.getElementById('nas_s_serverUrl').value = hit.serverUrl;
      } else {
        me._diag('❌ 常见组合均未命中，请手动填写服务器地址/账号密码后点「🧪 测试连接」。', true);
      }
    },

    /**
     * 暴力自动修复：综合扫描 serverUrl 候选 × 3 套常见账号 × 3 套 rootFolder
     */
    async autoRepair() {
      this._diagClear();
      var me = this;
      var servers = me._guessNasCandidates();
      // 账号组合：旧配置 / admin空 / admin+admin / 空
      var creds = [];
      if (me.cfg && (me.cfg.username || me.cfg.password)) creds.push({ username: me.cfg.username || '', password: me.cfg.password || '' });
      creds.push({ username: 'admin', password: 'admin' });
      creds.push({ username: 'admin', password: '' });
      creds.push({ username: '', password: '' });
      // rootFolder 组合：旧配置 / saintydoc / '' / webdav 下直连
      var roots = [];
      if (me.cfg && me.cfg.rootFolder) roots.push(me.cfg.rootFolder);
      roots.push('/saintydoc');
      roots.push('/');
      var wd = (me.cfg && me.cfg.webdavPath) || '/webdav';
      var cands = [];
      servers.forEach(function(s){
        creds.forEach(function(cr){
          roots.forEach(function(rt){
            cands.push({ serverUrl: s, webdavPath: wd, rootFolder: rt, username: cr.username, password: cr.password });
          });
        });
      });
      me._diag('⚡ 自动修复模式：共 ' + cands.length + ' 种组合（服务器×账号×根路径），并发 8 台…');
      var hit = await me._probeCandidates(cands, 8, 2500);
      if (hit) {
        me._diag('✅ 命中可用配置：' + hit.serverUrl + ' | root=' + hit.rootFolder + ' | user=' + (hit.username || '(匿名)'));
        document.getElementById('nas_s_serverUrl').value = hit.serverUrl;
        document.getElementById('nas_s_webdavPath').value = hit.webdavPath;
        document.getElementById('nas_s_rootFolder').value = hit.rootFolder;
        document.getElementById('nas_s_username').value = hit.username || '';
        document.getElementById('nas_s_password').value = hit.password || '';
        me._diag('请点击「💾 保存并重连」确认。');
      } else {
        me._diag('❌ 均未命中。请核对 NAS 是否开机、是否在同一局域网、WebDAV 服务是否正常、账号密码是否正确。', true);
      }
    },

    /**
     * 并发探测一批候选配置，限制并发数，每个探测有独立超时。返回第一个成功的配置，或 null。
     */
    _probeCandidates: async function(cands, concurrency, perTimeoutMs) {
      if (!Array.isArray(cands) || cands.length === 0) return null;
      var me = this;
      concurrency = concurrency || 6;
      perTimeoutMs = perTimeoutMs || 3500;
      var idx = 0;
      var winner = null;
      var done = false;
      var completed = 0;
      var total = cands.length;
      var worker = async function() {
        while (!done && idx < total) {
          var i = idx++;
          var cfg = cands[i];
          var resp0;
          try {
            // 复用 _probeCfg，但使用 perTimeoutMs 超时（_probeCfg 内部是 5s，这里包一层 Abort 以覆盖）
            var ctrl = new AbortController();
            var timerId = setTimeout(function(){ ctrl.abort(); }, perTimeoutMs);
            var result = null;
            try {
              result = await Promise.race([
                me._probeCfg(cfg),
                new Promise(function(_,rej){ ctrl.signal.addEventListener('abort', function(){ rej(new Error('AbortError')); }); })
              ]);
            } finally { clearTimeout(timerId); }
            resp0 = result;
            if (result && result.ok) { winner = cfg; done = true; return; }
          } catch(_e) {
            // 忽略单个探测错误
          } finally {
            completed++;
            if (completed % 20 === 0) {
              me._diag('…进度 ' + completed + '/' + total + (winner ? ' 已找到！' : ''));
            }
          }
        }
      };
      var workers = [];
      for (var w = 0; w < concurrency; w++) workers.push(worker());
      await Promise.all(workers);
      return winner;
    },
    _getUploadToastBar: function(id) {

        if (!t.getAttribute('data-orig')) t.setAttribute('data-orig', orig);
        t.textContent = orig + ' · ' + titleAppend + ' ' + pct + '%';
      }
    },

      if (el) { setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 400); }
    },

    // ===== 导航 & 刷新 =====
    cd: function(logicSub) {
      if (!logicSub) logicSub = '/';
      if (logicSub.charAt(0) !== '/') logicSub = '/' + logicSub;
      var s = logicSub.replace(/\/+/g, '/');
      if (s.length > 1 && s.charAt(s.length - 1) === '/') s = s.substring(0, s.length - 1);
      this.currentPath = s;
      this.selectedPath = null;
      this.refresh();
    },
    refresh: async function() {
      var self = this;
      try {
        var list = await self.listFolder(self.currentPath);
        self.rawList = list;
        self.setStatus('ok', '已连接：' + (self.cfg.serverUrl || '') + ' · 共 ' + list.length + ' 项');
        // 把当前目录在树中标记 open 并尝试展开父级路径
        await self._ensureTreeAncestorsLoaded(self.currentPath);
        self._markTreeCacheOpen(self.currentPath, true);
        self.renderBreadcrumb();
        self.renderTree();
        self.renderList();
      } catch (e) {
        console.warn('[NAS] refresh err:', e);
        var msg = e && e.message ? e.message : String(e);
        self.setStatus('err', '连接失败：' + msg);
        self.renderBreadcrumb();
        self.renderTree();
        if (msg.indexOf('CORS') >= 0 || msg.indexOf('Failed to fetch') >= 0) {
          self.showEmpty('🚫 浏览器 CORS 拦截',
            'WebDAV 请求被浏览器跨域策略拦截。请在 NAS 侧给 WebDAV 加响应头 <code>Access-Control-Allow-Origin</code>。<br><br>错误信息：<span style="color:#ef4444;">' + App.utils.escapeHtml(msg) + '</span>');
        } else if (msg.indexOf('404') >= 0) {
          self.showEmpty('📁 根目录不存在(404)',
            '请先点击左上角「✨初始化根」按钮（仅管理员），或在 设置→云盘NAS 修改系统根目录路径。<br><span style="color:#ef4444;">' + App.utils.escapeHtml(msg) + '</span>');
        } else if (msg.indexOf('401') >= 0) {
          self.showEmpty('🔐 认证失败(401)', 'NAS 账号或密码不正确，或该账号未开通 WebDAV 权限。<br>请前往 设置 → ☁️云盘NAS 修改。');
        } else {
          self.showEmpty('⚠️ 读取失败：' + App.utils.escapeHtml(msg), '请检查服务器地址/WebDAV路径/网络，点击 🔄刷新 重试。');
        }
      }
    },

    // ===== 面包屑 =====
    renderBreadcrumb: function() {
      var host = document.getElementById('breadcrumb');
      if (!host) return;
      var parts = this.currentPath.split('/').filter(Boolean);
      var rootName = this._rootLabelShort();
      var html = '<span class="crumb home" onclick="NAS.cd(\'/\')" title="系统根">🏠 ' + App.utils.escapeHtml(rootName) + '</span>';
      var acc = '';
      parts.forEach(function(p, i){
        acc += '/' + p;
        var enc = acc.replace(/'/g, "\\'");
        html += '<span class="sep">›</span>';
        if (i === parts.length - 1) {
          html += '<span class="current">' + App.utils.escapeHtml(p) + '</span>';
        } else {
          html += '<span class="crumb" onclick="NAS.cd(\'' + enc + '\')">' + App.utils.escapeHtml(p) + '</span>';
        }
      });
      html += '<span class="spacer"></span>';
      html += '<span class="info" id="pathInfo"></span>';
      host.innerHTML = html;
      var info = document.getElementById('pathInfo');
      if (info) info.textContent = (this.rawList ? this.rawList.length + ' 项' : '');
    },
    _rootLabelShort: function() {
      var r = (this.cfg && this.cfg.rootFolder) ? this.cfg.rootFolder : '/';
      r = r.replace(/\/+/g, '/');
      var parts = r.split('/').filter(Boolean);
      if (!parts.length) return '根';
      return parts[parts.length - 1];
    },

    // ===== 树形目录（懒加载） =====
    // treeCache[logicPath] = { open:bool, children:[{name,isFolder}], loaded:bool }
    _invalidateTreeCache: function(ancestorLogicPath) {
      // 清 ancestor 及其所有父节点的 loaded（触发重新读）
      var c = {};
      for (var k in this.treeCache) {
        if (k === ancestorLogicPath || ancestorLogicPath.indexOf(k + '/') === 0 || ancestorLogicPath === '/' + k === '/') continue;
        c[k] = this.treeCache[k];
      }
      var arr = this._ancestorsOf(ancestorLogicPath);
      for (var i = 0; i < arr.length; i++) delete c[arr[i]];
      this.treeCache = c;
    },
    _ancestorsOf: function(logicPath) {
      var out = [];
      var parts = logicPath.split('/').filter(Boolean);
      var acc = '';
      out.push('/');
      for (var i = 0; i < parts.length - 1; i++) {
        acc += '/' + parts[i];
        out.push(acc);
      }
      return out;
    },
    async _ensureTreeAncestorsLoaded(logicPath) {
      var self = this;
      var anc = self._ancestorsOf(logicPath);
      anc.push(logicPath);
      for (var i = 0; i < anc.length; i++) {
        var lp = anc[i];
        if (!self.treeCache[lp] || !self.treeCache[lp].loaded) {
          try {
            var list = await self.listFolder(lp);
            var kids = list.filter(function(x){ return x.isFolder; })
                           .filter(function(x){
                              var sub = lp === '/' ? '/' + x.name : lp + '/' + x.name;
                              return self._visibleFilterLogic(sub, true /*tree*/);
                            })
                           .map(function(x){ return { name:x.name, isFolder:true }; });
            self.treeCache[lp] = self.treeCache[lp] || { open:false };
            self.treeCache[lp].children = kids;
            self.treeCache[lp].loaded = true;
          } catch(e) { /* 读不到就算了 */ if (!self.treeCache[lp]) self.treeCache[lp] = { open:false, children:[], loaded:false }; }
        }
      }
    },
    // 仅懒加载某一级（树节点点击 ▶ 时）
    _loadTreeLevel: async function(logicPath) {
      var self = this;
      try {
        var list = await self.listFolder(logicPath);
        var kids = list.filter(function(x){ return x.isFolder; })
                       .filter(function(x){
                          var sub = logicPath === '/' ? '/' + x.name : logicPath + '/' + x.name;
                          return self._visibleFilterLogic(sub, true);
                        })
                       .map(function(x){ return { name:x.name, isFolder:true }; });
        self.treeCache[logicPath] = self.treeCache[logicPath] || { open:false };
        self.treeCache[logicPath].children = kids;
        self.treeCache[logicPath].loaded = true;
        return kids;
      } catch(e) { return []; }
    },
    _markTreeCacheOpen: function(logicPath, open) {
      if (!this.treeCache[logicPath]) this.treeCache[logicPath] = { open:false, children:[], loaded:false };
      this.treeCache[logicPath].open = !!open;
    },

    renderTree: function() {
      var host = document.getElementById('treeHost');
      if (!host) return;
      var self = this;
      // 根：系统根目录（逻辑 / 对应 WebDAV 上的 /rootFolder）
      var html = self._renderTreeNode('/', self._rootLabelShort(), 0, true);
      host.innerHTML = html;
    },
    _renderTreeNode: function(logicPath, displayName, level, isRoot) {
      var self = this;
      var node = self.treeCache[logicPath] || { open:false, children:[], loaded:false };
      var hasChildFolders = (node.children && node.children.length > 0) || !node.loaded;
      // 未 loaded 假设先显示三角（点了再读）
      var chevClass = 'chev' + ((!hasChildFolders && node.loaded) ? ' empty' : (node.open ? ' open' : ''));
      var chevron = '<span class="' + chevClass + '" data-toggle-path="' + (logicPath === '/' ? '/' : logicPath) + '">' + (hasChildFolders ? '▶' : '·') + '</span>';
      var rowClass = 'tree-row' + (logicPath === self.currentPath ? ' active' : '');
      var attrs =
        ' data-logic-path="' + (logicPath === '/' ? '/' : logicPath) + '"' +
        ' onclick="NAS._onTreeClick(event, \'' + (logicPath === '/' ? '/' : logicPath.replace(/'/g, "\\'")) + '\')"';
      var title = isRoot ? ('系统根：' + ((self.cfg && self.cfg.rootFolder) ? self.cfg.rootFolder : '/')) : displayName;
      var row = '<div class="tree-level-' + (level + 0) + '"><div class="tree-row ' + rowClass + '" title="' + App.utils.escapeHtml(title) + '"' + attrs + '>' +
        chevron +
        '<span class="t-ico">📁</span>' +
        '<span class="t-label">' + App.utils.escapeHtml(displayName) + '</span>' +
        '</div>';
      if (node.open) {
        var childrenHtml = '';
        var kids = node.children || [];
        for (var i = 0; i < kids.length; i++) {
          var k = kids[i];
          var childPath = logicPath === '/' ? '/' + k.name : logicPath + '/' + k.name;
          childrenHtml += self._renderTreeNode(childPath, k.name, level + 1, false);
        }
        row += '<div class="tree-children tree-level-' + (level + 1) + ' open">' + childrenHtml + '</div>';
      } else if (!node.loaded || (node.children && node.children.length)) {
        // 占位空容器（点击后展开会重渲染）
        row += '<div class="tree-children tree-level-' + (level + 1) + '"></div>';
      }
      row += '</div>';
      return row;
    },

    _onTreeClick: async function(e, logicPath) {
      var self = this;
      // 判断是否点在三角上
      if (e.target.classList && e.target.classList.contains('chev') && !e.target.classList.contains('empty')) {
        e.stopPropagation();
        var node = self.treeCache[logicPath];
        if (!node || !node.loaded) {
          await self._loadTreeLevel(logicPath);
          self._markTreeCacheOpen(logicPath, true);
        } else {
          self._markTreeCacheOpen(logicPath, !node.open);
        }
        self.renderTree();
        return;
      }
      // 否则：切换到该目录
      self.cd(logicPath);
    },

    // ===== 内容区渲染 =====
    _visibleFilter: function(item) {
      if (this.isAdmin) return true;
      if (!item.isFolder) return true;
      var subPath = this.currentPath === '/' ? '/' + item.name : this.currentPath + '/' + item.name;
      return this._visibleFilterLogic(subPath, false);
    },
    _visibleFilterLogic: function(logicSubPath, _tree) {
      if (this.isAdmin) return true;
      var p = this._resolveFolderPerm(logicSubPath, this.roleKey);
      return p !== 'deny';
    },

    renderList: function() {
      var self = this;
      var host = document.getElementById('fileListArea');
      if (!host) return;
      var q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      var list = (self.rawList || []).filter(self._visibleFilter.bind(self));
      if (q) list = list.filter(function(x){ return x.name.toLowerCase().indexOf(q) >= 0; });
      list = self._sortList(list);

      if (list.length === 0) {
        host.innerHTML = `
          <div class="empty">
            <div class="ico">📭</div>
            <div style="font-size:15px;font-weight:600;">当前目录为空</div>
            <div style="font-size:13px;margin-top:6px;color:#64748b;">
              ${self.canWrite ? '可以点击「📂新建文件夹」「⬆️上传文件」或把文件拖入窗口开始使用' : '当前目录没有您可查看的文件，请联系管理员'}
            </div>
          </div>`;

      }

      // 构建每个条目的统一「元数据 + 按钮」
      var selfIsAdmin = self.isAdmin;
      var canWriteHere = self._folderWriteable(self.currentPath);
      var currentSelName = self.selectedPath ? self.selectedPath.split('/').pop() : null;

      function itemMeta(item) {
        var ext = (item.name.indexOf('.') >= 0 ? item.name.split('.').pop().toLowerCase() : '');
        var isImg = ['png','jpg','jpeg','gif','bmp','webp','svg','ico','avif'].indexOf(ext) >= 0;
        var sizeHtml = item.isFolder
          ? '<span style="color:#9ca3af;">—</span>'
          : '<span>' + self._fmtSize(item.size) + '</span>';
        var subPath = self.currentPath === '/' ? '/' + item.name : self.currentPath + '/' + item.name;
        var clickSub = item.isFolder ? subPath : null;
        // 操作按钮 HTML（仅 details 视图用）
        var opHtml = '';
        opHtml += '<button class="btn btn-xs" onclick="event.stopPropagation();NAS.downloadItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))">⬇下载</button>';
        if (!item.isFolder && (isImg || ext === 'pdf')) {
          opHtml += '<button class="btn btn-xs btn-primary" onclick="event.stopPropagation();NAS.previewItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))">👁预览</button>';
        }
        if (selfIsAdmin && item.isFolder) {
          opHtml += '<button class="btn btn-xs" onclick="event.stopPropagation();NAS.openPermModal(\'' + subPath.replace(/'/g, "\\'") + '\')" style="background:#fff7ed;border-color:#fed7aa;color:#c2410c;">🔧权限</button>';
        }
        if (canWriteHere) {
          opHtml += '<button class="btn btn-xs" onclick="event.stopPropagation();NAS.renameByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\')" title="重命名">✏️改</button>';
          opHtml += '<button class="btn btn-xs" onclick="event.stopPropagation();NAS.deleteItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))" style="color:#ef4444;border-color:#fecaca;">🗑删</button>';
        }
        return {
          ext: ext, isImg: isImg, sizeHtml: sizeHtml, subPath: subPath,
          clickSub: clickSub, opHtml: opHtml
        };
      }

      var mode = self.viewMode;

      if (mode === 'details') {
        // ===== 详细信息（表格）：名称 / 修改日期 / 类型 / 大小 / 操作 =====
        var sortCls = function(f){
          var c = 'sortable';
          if (self.sortBy === f) c += (self.sortAsc ? ' sort-asc' : ' sort-desc');
          return c;
        };
        var rows = list.map(function(item){
          var m = itemMeta(item);
          var icon = item.isFolder ? '<div class="file-ico folder">📁</div>'
                   : (m.isImg ? '<div class="file-ico img">🖼️</div>'
                            : '<div class="file-ico">📄</div>');
          var thumb = '';
          if (m.isImg && !item.isFolder) {
            thumb = '<img class="thumb" alt="" loading="lazy" src="javascript:void(0);" data-sub="' + App.utils.escapeHtml(m.subPath) + '" onclick="event.stopPropagation();event.preventDefault();NAS.previewItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))">';
          }
          var clickAction = item.isFolder
            ? 'NAS.cd(\'' + m.subPath.replace(/'/g, "\\'") + '\')'
            : 'NAS.previewItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))';
          var selClass = (currentSelName === item.name) ? 'selected' : '';
          var ondblclick = canWriteHere
            ? ' ondblclick="event.stopPropagation();NAS.renameByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\')"'
            : '';
          return '<tr class="' + selClass + '" data-name="' + App.utils.escapeHtml(item.name) + '"' +
            ' onclick="NAS._onSelectItem(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\')" ' + ondblclick + '>' +
            '<td><div class="name-cell" onclick="' + clickAction + '">' +
              (thumb || icon) +
              '<div class="meta"><span class="fname">' + App.utils.escapeHtml(item.name) + '</span><span class="fsize">' + (item.isFolder ? '文件夹' : self._fmtSize(item.size)) + '</span></div>' +
            '</div></td>' +
            '<td style="width:170px;color:#64748b;font-size:12px;">' + self._fmtDate(item.lastModified) + '</td>' +
            '<td style="width:140px;color:#64748b;font-size:12px;">' + self._typeOf(item) + '</td>' +
            '<td style="width:110px;color:#64748b;font-size:12px;">' + m.sizeHtml + '</td>' +
            '<td style="width:420px;" class="op-cell">' + m.opHtml + '</td>' +
          '</tr>';
        }).join('');
        host.innerHTML = `
          <table class="file-table">
            <thead>
              <tr>
                <th style="min-width:260px;" class="${sortCls('name')}" onclick="NAS.toggleSort('name')">名称</th>
                <th style="width:170px;" class="${sortCls('date')}" onclick="NAS.toggleSort('date')">修改日期</th>
                <th style="width:140px;" class="${sortCls('type')}" onclick="NAS.toggleSort('type')">类型</th>
                <th style="width:110px;" class="${sortCls('size')}" onclick="NAS.toggleSort('size')">大小</th>
                <th style="width:420px;">操作</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } else if (mode === 'large') {
        // ===== 大图标 =====
        var cards = list.map(function(item){
          var m = itemMeta(item);
          var selClass = (currentSelName === item.name) ? 'selected' : '';
          var clickAction = item.isFolder
            ? 'NAS.cd(\'' + m.subPath.replace(/'/g, "\\'") + '\')'
            : 'NAS.previewItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))';
          var icoCls = item.isFolder ? 'folder' : (m.isImg ? 'img' : '');
          var iconOrImg;
          if (m.isImg && !item.isFolder) {
            iconOrImg = '<img class="card-thumb" alt="" loading="lazy" src="javascript:void(0);" data-sub="' + App.utils.escapeHtml(m.subPath) + '" onclick="event.stopPropagation();event.preventDefault();' + clickAction + '">';
          } else {
            var emo = item.isFolder ? '📁' : (m.isImg ? '🖼️' : '📄');
            iconOrImg = '<div class="card-ico ' + icoCls + '">' + emo + '</div>';
          }
          var metaLine = item.isFolder ? '文件夹' : (self._fmtSize(item.size) + ' · ' + self._typeOf(item));
          var ondblclick = canWriteHere
            ? ' ondblclick="event.stopPropagation();NAS.renameByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\')"'
            : '';
          return '<div class="item-card lg ' + selClass + '" data-name="' + App.utils.escapeHtml(item.name) + '"' +
            ' onclick="event.stopPropagation();NAS._onSelectItem(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'); ' + clickAction + '" ' + ondblclick + '>' +
            iconOrImg +
            '<div class="card-name">' + App.utils.escapeHtml(item.name) + '</div>' +
            '<div class="card-meta">' + App.utils.escapeHtml(metaLine) + '</div>' +
          '</div>';
        }).join('');
        host.innerHTML = `<div class="view-grid">${cards}</div>`;
      } else {
        // ===== 小图标 =====
        var cards = list.map(function(item){
          var m = itemMeta(item);
          var selClass = (currentSelName === item.name) ? 'selected' : '';
          var clickAction = item.isFolder
            ? 'NAS.cd(\'' + m.subPath.replace(/'/g, "\\'") + '\')'
            : 'NAS.previewItem(NAS.findItemByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'))';
          var icoCls = item.isFolder ? 'folder' : (m.isImg ? 'img' : '');
          var iconOrImg;
          if (m.isImg && !item.isFolder) {
            iconOrImg = '<img class="card-thumb" alt="" loading="lazy" src="javascript:void(0);" data-sub="' + App.utils.escapeHtml(m.subPath) + '" onclick="event.stopPropagation();event.preventDefault();' + clickAction + '">';
          } else {
            var emo = item.isFolder ? '📁' : (m.isImg ? '🖼️' : '📄');
            iconOrImg = '<div class="card-ico ' + icoCls + '">' + emo + '</div>';
          }
          var meta = item.isFolder ? '' : self._fmtSize(item.size);
          var ondblclick = canWriteHere
            ? ' ondblclick="event.stopPropagation();NAS.renameByName(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\')"'
            : '';
          return '<div class="item-card sm ' + selClass + '" data-name="' + App.utils.escapeHtml(item.name) + '"' +
            ' onclick="event.stopPropagation();NAS._onSelectItem(\'' + App.utils.escapeHtml(item.name).replace(/'/g, "\\'") + '\'); ' + clickAction + '" ' + ondblclick + '>' +
            iconOrImg +
            '<div class="card-name">' + App.utils.escapeHtml(item.name) + '</div>' +
            '<div class="card-meta">' + meta + '</div>' +
          '</div>';
        }).join('');
        host.innerHTML = `<div class="view-small">${cards}</div>`;
      }
      self._lazyThumbs();
    },
    _onSelectItem: function(name) {
      var self = this;
      var sub = self.currentPath === '/' ? '/' + name : self.currentPath + '/' + name;
      self.selectedPath = sub;
      // 更新 UI 的 selected 类
      var area = document.getElementById('fileListArea');
      if (!area) return;
      var sel = null;
      if (self.viewMode === 'details') sel = area.querySelectorAll('tr.selected');
      else sel = area.querySelectorAll('.item-card.selected');
      for (var i = 0; i < sel.length; i++) sel[i].classList.remove('selected');
      var tgt = null;
      try {
        if (self.viewMode === 'details') tgt = area.querySelector('tr[data-name="' + CSS.escape(name) + '"]');
        else tgt = area.querySelector('.item-card[data-name="' + CSS.escape(name) + '"]');
      } catch(e) {}
      if (tgt) tgt.classList.add('selected');
    },
    findItemByName: function(name) {
      return (this.rawList || []).find(function(x){ return x.name === name; }) || null;
    },
    _lazyThumbs: function() {
      var self = this;
      var imgs = document.querySelectorAll('#fileListArea img[data-sub]');
      if (!imgs || !imgs.length) return;
      var idx = 0;
      function step() {
        if (idx >= imgs.length) return;
        var el = imgs[idx++];
        var sub = el.getAttribute('data-sub');
        if (!sub) { step(); return; }
        var url = self._absUrlEncoded(sub);
        var headers = {};
        if (self.cfg && self.cfg.username) headers['Authorization'] = 'Basic ' + btoa(self.cfg.username + ':' + (self.cfg.password || ''));
        fetch(url, { method: 'GET', headers: headers, credentials: 'omit' })
          .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
          .then(function(b){ el.src = URL.createObjectURL(b); })
          .catch(function(){})
          .then(function(){ setTimeout(step, 10); });
      }
      step();
    },
    _fmtSize: function(bytes) {
      if (!bytes) return '0 B';
      var units = ['B','KB','MB','GB','TB']; var i = 0; var v = bytes;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (v < 10 ? v.toFixed(2) : v.toFixed(1)) + ' ' + units[i];
    },
    _fmtDate: function(s) {
      if (!s) return '-';
      try {
        var d = new Date(s);
        if (isNaN(d.getTime())) return s;
        var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
        var hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
        return y + '-' + m + '-' + day + ' ' + hh + ':' + mm;
      } catch(e) { return s; }
    },
    showEmpty: function(title, htmlSub) {
      var host = document.getElementById('fileListArea');
      if (!host) return;
      host.innerHTML = `
        <div class="empty">
          <div class="ico">📂</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:8px;color:#0f172a;">${title}</div>
          <div style="font-size:13px;line-height:1.8;color:#475569;">${htmlSub || ''}</div>
        </div>`;
    },

    // ===== 文件夹级权限 =====
    _getFolderPermsStore: function() {
      try { var s = App.store.get('nas_folder_perms', null); return (s && typeof s === 'object') ? s : {}; } catch(e) { return {}; }
    },
    _saveFolderPermsStore: function(obj) {
      App.store.set('nas_folder_perms', obj);
      try { localStorage.setItem('nas_folder_perms', JSON.stringify(obj)); } catch(e) {}
      if (window.SupabaseStore && typeof window.SupabaseStore.setSync === 'function') {
        try { window.SupabaseStore.setSync('nas_folder_perms', obj); } catch(e) {}
      }
      // 关键：通过独立 REST 通道把权限规则上传到 app_data_store 全局共享表，让所有电脑/用户都能读到
      // （注意：非管理员尝试上传会被 init-page.js 的写入守卫静默丢弃，不会覆盖管理员发布的）
      try {
        window.dispatchEvent(new CustomEvent('cloud-write-request', {
          detail: { key: 'nas_folder_perms', value: obj && typeof obj === 'object' ? obj : {}, ts: Date.now() }
        }));
      } catch(e) {}
    },
    _ensureRootFolderPerm: function() {
      var store = this._getFolderPermsStore();
      if (store && store['/']) return;
      var root = {};
      var self = this;
      Object.keys(App.roles || {}).forEach(function(rk){
        var r = App.roles[rk];
        if (r && r.isAdmin) root[rk] = 'write';
        else root[rk] = 'read';
      });
      ['merchandiser','purchaser','designer','qc','finance','documentary','manager','user'].forEach(function(rk){
        if (!root[rk]) root[rk] = 'read';
      });
      if (!root.manager) root.manager = 'write';
      if (!root.user) root.user = 'write';
      store['/'] = root;
      this._saveFolderPermsStore(store);
    },
    _resolveFolderPerm: function(logicPath, roleKey) {
      var store = this._getFolderPermsStore();
      if (!store) return 'read';
      var p = logicPath;
      if (!p || p === '' || p.charAt(0) !== '/') p = '/' + (p || '');
      p = p.replace(/\/+/g, '/');
      if (p.length > 1 && p.charAt(p.length - 1) === '/') p = p.substring(0, p.length - 1);
      var pathArr = p.split('/').filter(Boolean);
      var perm = null;
      while (true) {
        var key = '/' + pathArr.join('/');
        if (key === '//') key = '/';
        if (store[key] && typeof store[key][roleKey] === 'string') {
          var v = store[key][roleKey];
          if (v === 'deny') return 'deny';
          if (!perm) perm = v;
        }
        if (key === '/') break;
        pathArr.pop();
      }
      return perm || 'read';
    },
    _folderWriteable: function(logicPath) {
      if (this.isAdmin) return true;
      if (!this.canWrite) return false;
      return this._resolveFolderPerm(logicPath, this.roleKey) === 'write';
    },
    // ===== 权限模态框 =====
    openPermModal: function(folderPath) {
      if (!this.isAdmin) { App.toast('仅管理员可配置权限', 'error'); return; }
      this._ensureRootFolderPerm();
      var store = this._getFolderPermsStore();
      var rules = (store[folderPath] ? JSON.parse(JSON.stringify(store[folderPath])) : {});
      var rolesMap = {};
      Object.keys(App.roles || {}).forEach(function(rk){ rolesMap[rk] = App.roles[rk] && App.roles[rk].name ? App.roles[rk].name : rk; });
      var nameMap = { merchandiser:'业务员', purchaser:'采购', designer:'设计', qc:'QC', finance:'财务', documentary:'跟单', manager:'经理', user:'普通用户' };
      ['merchandiser','purchaser','designer','qc','finance','documentary','manager','user'].forEach(function(rk){
        if (!rolesMap[rk]) rolesMap[rk] = nameMap[rk] || rk;
      });
      document.getElementById('permPath').textContent = folderPath;
      var rows = Object.keys(rolesMap).map(function(rk){
        var cur = rules[rk] || '';
        return '<tr>' +
          '<td>' + App.utils.escapeHtml(rolesMap[rk]) + ' <span style="color:#94a3b8;font-size:11px;">(' + App.utils.escapeHtml(rk) + ')</span></td>' +
          '<td><label><input type="radio" name="perm_' + rk + '" value="read"' + (cur === 'read' ? ' checked' : '') + ' onclick="NAS.permsEditing.rules[\'' + rk + '\']=\'read\'">读</label></td>' +
          '<td><label><input type="radio" name="perm_' + rk + '" value="write"' + (cur === 'write' ? ' checked' : '') + ' onclick="NAS.permsEditing.rules[\'' + rk + '\']=\'write\'">写</label></td>' +
          '<td><label><input type="radio" name="perm_' + rk + '" value="deny"' + (cur === 'deny' ? ' checked' : '') + ' onclick="NAS.permsEditing.rules[\'' + rk + '\']=\'deny\'">禁</label></td>' +
          '<td><label><input type="radio" name="perm_' + rk + '" value=""' + (!cur ? ' checked' : '') + ' onclick="delete NAS.permsEditing.rules[\'' + rk + '\']">继承</label></td>' +
        '</tr>';
      }).join('');
      document.getElementById('permTbody').parentNode.querySelector('thead').innerHTML =
        '<tr><th style=\'width:32%;\'>角色</th><th>✅ 读取</th><th>✏️ 读写</th><th>🚫 禁止</th><th>↩️ 继承</th></tr>';
      document.getElementById('permTbody').innerHTML = rows;
      this.permsEditing = { folderPath: folderPath, rules: rules };
      document.getElementById('permOverlay').classList.add('active');
    },
    closePermModal: function() {
      document.getElementById('permOverlay').classList.remove('active');
      this.permsEditing = null;
    },
    saveFolderPerm: function() {
      if (!this.permsEditing) return;
      var fp = this.permsEditing.folderPath;
      var rules = this.permsEditing.rules || {};
      Object.keys(rules).forEach(function(k){ if (!rules[k]) delete rules[k]; });
      var store = this._getFolderPermsStore();
      if (Object.keys(rules).length === 0) delete store[fp];
      else store[fp] = rules;
      this._saveFolderPermsStore(store);
      App.toast('✅ 文件夹权限已保存（同步到云端）', 'success');
      this.closePermModal();
      this.renderList();
      this.renderTree();
    },
  };

  // 云端同步监听
  window.addEventListener('cloud-data-updated', function(e){
    var keys = (e && e.detail && e.detail.keys) || [];
    if (keys.indexOf('nas_folder_perms') >= 0 || keys.indexOf('nas_config') >= 0) {
      try { NAS.cfg = NAS._loadCfg(); NAS.renderList(); NAS.renderTree(); } catch(_) {}
    }
  });

  window.NAS = NAS;

          '<div style="display:flex;gap:6px;">' +
            '<input id="nas_s_serverUrl" class="form-input" placeholder="例：http://192.168.31.100:5005 或 https://nas.example.com" style="flex:1;">' +
            '<button class="btn btn-sm" onclick="NAS.scanLocalNas()" title="自动扫描局域网常见 IP/主机名 + 默认端口">🔍 扫描本地 NAS</button>' +
          '</div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-top:4px;">不带尾部 /webdav，下面单独填 WebDAV 子路径</div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          '<div><label style="font-size:12px;font-weight:600;color:#334155;display:block;margin-bottom:4px;">WebDAV 子路径</label>' +
            '<input id="nas_s_webdavPath" class="form-input" value="/webdav"></div>' +
          '<div><label style="font-size:12px;font-weight:600;color:#334155;display:block;margin-bottom:4px;">系统根目录（业务文件夹）</label>' +
            '<input id="nas_s_rootFolder" class="form-input" value="/saintydoc"></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          '<div><label style="font-size:12px;font-weight:600;color:#334155;display:block;margin-bottom:4px;">NAS 用户名</label>' +
            '<input id="nas_s_username" class="form-input" placeholder="admin 或你的 NAS 账号" autocomplete="off"></div>' +
          '<div><label style="font-size:12px;font-weight:600;color:#334155;display:block;margin-bottom:4px;">NAS 密码</label>' +
            '<input id="nas_s_password" type="password" class="form-input" placeholder="填写后会加密保存在 Supabase" autocomplete="new-password"></div>' +
        '</div>' +
        '<div id="nas_s_diag" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;font-size:12px;color:#475569;white-space:pre-wrap;line-height:1.6;display:none;"></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="btn btn-sm" onclick="NAS.testConnection()" style="background:#ecfdf5;border-color:#a7f3d0;color:#065f46;">🧪 测试连接</button>' +
          '<button class="btn btn-sm btn-primary" onclick="NAS.saveSettings()">💾 保存并重连</button>' +
          '<button class="btn btn-sm" onclick="NAS.autoRepair()" style="background:#eff6ff;border-color:#bfdbfe;color:#1e40af;">⚡ 自动修复（尝试多个常见 IP/端口 + 账号）</button>' +
        '</div>' +
        '<div style="font-size:11px;color:#94a3b8;margin-top:4px;">说明：保存后会写入 nas_config 并同步到 Supabase，之后所有登录同账号的电脑都会用这个设置。</div>' +
      '</div></div>';
    document.body.appendChild(wrap);
  })();

  // ready
  document.addEventListener('DOMContentLoaded', function(){
    App.init('nasDrive');
    App.initSampleData();
    try { NAS._ensureRootFolderPerm(); } catch(_) {}
    try { NAS.init(); } catch(e) { console.error(e); }
  });
})();
</script>
</body>
</html>
