}

  const sheets = getSizeSheets();

  const typeFilter = document.getElementById('sizeTypeFilter').value;
  const container = document.getElementById('sizeSheetContainer');
  const countEl = document.getElementById('sizeSheetCount');

  let filtered = sheets;
  if (search) {
    filtered = filtered.filter(s =>
      (s.orderNo && s.orderNo.toLowerCase().includes(search)) ||
      (s.styleNo && s.styleNo.toLowerCase().includes(search))
    );
  }
  if (typeFilter) {
    filtered = filtered.filter(s => (s.sampleType || '大货') === typeFilter);
  }

  countEl.textContent = sheets.length > 0 ? `（共 ${sheets.length} 份尺寸表，筛选 ${filtered.length} 份）` : '';

// 处理尺寸表Excel导入
function handleSizeImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '', header: 1, raw: false });

      if (rows.length < 2) {
        App.toast('文件格式错误，至少需要2行数据', 'error');
        return;
      }

      const sheets = getSizeSheets();
      let importCount = 0;
      let skipCount = 0;

      const { processed, skipped } = parseSizeSheetRows(rows);
      processed.forEach(sheet => {
        const existsIdx = sheets.findIndex(s => s.orderNo === sheet.orderNo && s.styleNo === sheet.styleNo && (s.sampleType || '大货') === (sheet.sampleType || '大货'));
        if (existsIdx >= 0) {
          sheets[existsIdx] = sheet;
        } else {
          sheets.push(sheet);
        }
        importCount++;
      });
      skipCount = skipped;

      saveSizeSheets(sheets);
      renderSizeSheets();

      let msg = `导入完成：成功 ${importCount} 份尺寸表`;
      if (skipCount > 0) msg += `，跳过 ${skipCount} 行（格式不匹配）`;
      App.toast(msg, 'success');
    } catch (err) {
      console.error('导入失败:', err);
      App.toast('导入失败，请检查文件格式', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Excel日期序列号转字符串
function formatExcelDate(val) {
  if (val === null || val === undefined || val === '') return '';
  // 已经是字符串日期（如 2026/7/3）
  if (typeof val === 'string') return val.trim();
  // Date对象（cellDates:true时）
  if (val instanceof Date) {
    const y = val.getFullYear();
    const m = val.getMonth() + 1;
    const d = val.getDate();
    return `${y}/${m}/${d}`;
  }
  // 数字序列号（如46243）
  if (typeof val === 'number') {
    const date = new Date(Math.round((val - 25569) * 86400 * 1000));
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + 1;
    const d = date.getUTCDate();
    return `${y}/${m}/${d}`;
  }
  return String(val).trim();
}

// 解析尺寸表数据行
function parseSizeSheetRows(rows) {
  const result = { processed: [], skipped: 0 };
  if (rows.length < 2) return result;

  const headerRow = rows[0].map(h => String(h).trim());
  const headers = {
    po: headerRow.findIndex(h => h.includes('PO') || h.includes('po') || h === 'PO号'),
    styleNo: headerRow.findIndex(h => h.includes('款号') || h.includes('style') || h.toLowerCase().includes('style')),
    sampleType: headerRow.findIndex(h => h === '类型' || h === '样衣类型'),
    date: headerRow.findIndex(h => h === '日期' || h === 'date' || h.toLowerCase() === 'date'),
    code: headerRow.findIndex(h => h === '部位编号' || h === '部位'),
    en: headerRow.findIndex(h => h === '英文名称' || h === '英文'),
    cn: headerRow.findIndex(h => h === '中文名称' || h === '中文'),
    tolerance: headerRow.findIndex(h => h === '公差' || h === 'tolerance' || h.toLowerCase() === 'tolerance'),
  };

  if (headers.po === -1 || headers.styleNo === -1 || headers.code === -1) {
    result.skipped = rows.length - 1;
    return result;
  }

  const sizeStartIdx = Math.max(
    headers.en, headers.cn, headers.tolerance,
    headers.po, headers.styleNo, headers.date, headers.code,
    headers.sampleType
  ) + 1;

  const sizeCols = [];
  for (let i = sizeStartIdx; i < headerRow.length; i++) {
    if (headerRow[i]) sizeCols.push({ col: i, size: headerRow[i] });
  }

  const sheetMap = {};
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;

    const orderNo = headers.po >= 0 ? String(row[headers.po] || '').trim() : '';
    const styleNo = headers.styleNo >= 0 ? String(row[headers.styleNo] || '').trim() : '';
    const sampleType = headers.sampleType >= 0 ? String(row[headers.sampleType] || '').trim() : '';
    const date = headers.date >= 0 ? formatExcelDate(row[headers.date]) : '';
    const code = headers.code >= 0 ? String(row[headers.code] || '').trim() : '';
    const en = headers.en >= 0 ? String(row[headers.en] || '').trim() : '';
    const cn = headers.cn >= 0 ? String(row[headers.cn] || '').trim() : '';
    const tolerance = headers.tolerance >= 0 ? String(row[headers.tolerance] || '').trim() : '';

    if (!code) { result.skipped++; continue; }

    const key = `${orderNo}_${styleNo}_${sampleType}`;
    if (!sheetMap[key]) {
      sheetMap[key] = {
        id: App.utils.genId('SS'),
        orderNo, styleNo, sampleType: sampleType || '大货', date,
        sizes: sizeCols.map(sc => sc.size),
        rows: []
      };
    }

    const values = {};
    sizeCols.forEach(sc => {
      values[sc.size] = row[sc.col] !== undefined && row[sc.col] !== null ? String(row[sc.col]).trim() : '';
    });

    sheetMap[key].rows.push({ code, en, cn, tolerance, values });
  }

  result.processed = Object.values(sheetMap);
  return result;
}

// 通用：根据款号找订单号（优先取第一个匹配的订单）
function getOrderNoByStyleNo(styleNo) {
  if (!styleNo) return '';
  const orders = App.store.get('orders', []);
  const o = orders.find(x => x.styleNo === styleNo);
  return o ? o.orderNo : '';
}

// 渲染订单下拉筛选
function renderMaterialOrderFilter() {
  const sel = document.getElementById('matOrderFilter');
  if (!sel) return;
  const orders = App.store.get('orders', []);
  const cur = sel.value;
  const opts = ['<option value="">全部订单</option>'];
  orders
    .slice()
    .sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || ''))
    .forEach(o => opts.push(`<option value="${o.orderNo}" ${o.orderNo === cur ? 'selected' : ''}>${o.orderNo}${o.styleNo ? ' · ' + o.styleNo : ''}</option>`));
  sel.innerHTML = opts.join('');
}

// 获取筛选后的耗料登记及状态列表
function getFilteredMaterials() {
  const list = getOrderMaterials();
  const search = (document.getElementById('matSearchInput')?.value || '').trim().toLowerCase();
  const cat = document.getElementById('matCategoryFilter')?.value || '';
  const order = document.getElementById('matOrderFilter')?.value || '';

  return list.filter(m => {
    if (cat && m.category !== cat) return false;
    if (order && m.orderNo !== order) return false;
    if (search) {
      const str = [m.orderNo, m.styleNo, m.name, m.supplier, m.spec, m.remark, m.washMethod, m.usagePart].join(' ').toLowerCase();
      if (!str.includes(search)) return false;
    }
    return true;
  });
}

// 生成水洗单号（WS-XXXX）
function _matGenWashNo() {
  const washes = App.store.get('washes', []);
  let maxNum = 0;
  washes.forEach(w => {
    const m = w.washNo && w.washNo.match(/WS-(\d+)/);
    if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
  });
  return `WS-${String(maxNum + 1).padStart(4, '0')}`;
}

// 生成面里衬 / 辅料编号：STIG + YYYYMM + 4位随机
function _matGenCode(prefix) {
  const d = new Date();
  const ym = d.getFullYear().toString() + String(d.getMonth() + 1).padStart(2, '0');
  const r = String(Math.floor(Math.random() * 9000) + 1000);
  return `${prefix || 'STIG'}${ym}${r}`;
}

// 类别切换时切换字段显示与供应商选项

  const cat = MAT_CATEGORIES._map[val] || MAT_CATEGORIES[0];

  const accessorySuppliers = contacts.filter(c => c.type === '辅料厂').map(c => `<option value="${App.utils.escapeHtml(c.name)}" ${m.supplier === c.name ? 'selected' : ''}>${c.name}</option>`).join('');
  const washFactories = contacts.filter(c => c.type === '水洗厂').map(c => `<option value="${App.utils.escapeHtml(c.name)}" ${m.supplier === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

  const isFabric = cat.target === 'fabric';
  const isAccessory = cat.target === 'accessory';
  const isWash = cat.target === 'wash';

  const labelName = document.getElementById('label_name');

  const show = (id, bool) => { const el = document.getElementById(id); if (el) el.style.display = bool ? '' : 'none'; };
  show('group_usagePart', !isWash);
  show('group_spec', !isWash);

// 保存耗料登记及状态并自动同步到对应模块
function saveMaterial() {
  const category = document.getElementById('m_category').value;
  const cat = MAT_CATEGORIES._map[category];
  const orderNo = document.getElementById('m_orderNo').value.trim();
  const styleNo = document.getElementById('m_styleNo').value.trim();
  const name = document.getElementById('m_name').value.trim();
  if (!category || !name) { App.toast('请填写类别和名称', 'warning'); return; }

  const data = {
    orderNo,
    styleNo,
    category,
    name,
    usagePart: document.getElementById('m_usagePart').value.trim(),
    supplier: document.getElementById('m_supplier').value,
    spec: document.getElementById('m_spec').value.trim(),
    color: document.getElementById('m_color').value.trim(),
    fabricComposition: document.getElementById('m_composition').value.trim(),
    washMethod: document.getElementById('m_washMethod')?.value?.trim() || '',
    washCategory: document.getElementById('m_washCategory')?.value || '面料水洗',
    qtyOrdered: Number(document.getElementById('m_qty').value) || 0,
    unit: document.getElementById('m_unit').value,
    unitPrice: Number(document.getElementById('m_price').value) || 0,
    shipFactory: document.getElementById('m_shipFactory').value,
    date: document.getElementById('m_date1').value,
    contractDate: document.getElementById('m_date2').value,
    confirmedDate: document.getElementById('m_date3').value,
    shipDate: document.getElementById('m_shipDate').value,
    arrivalDate: document.getElementById('m_arrivalDate').value,
    remark: document.getElementById('m_remark').value.trim(),
    updateDate: App.utils.today(),
  };

  const list = getOrderMaterials();
  let syncedTargetId = null;
  if (_matEditingId) {
    const idx = list.findIndex(x => x.id === _matEditingId);
    if (idx !== -1) {
      syncedTargetId = list[idx].syncedTargetId || null;
      list[idx] = { ...list[idx], ...data, syncedToModule: false };
    }
  } else {
    data.id = App.utils.genId('OM');
    data.createDate = App.utils.today();
    data.syncedToModule = false;
    list.push(data);
  }

  // 先保存登记
  saveOrderMaterials(list);

  // 同步到对应模块
  try {
    const targetInfo = syncOneMaterialToModules({ ...data, syncedTargetId }, true);
    // 回写同步状态和目标ID
    const idx = list.findIndex(x => x.id === data.id || x.id === _matEditingId);
    if (idx !== -1 && targetInfo) {
      list[idx].syncedToModule = true;
      list[idx].syncedTargetId = targetInfo.id;
      list[idx].syncedTargetTable = targetInfo.table;
      saveOrderMaterials(list);
    }
    App.toast('已保存并同步到' + (cat.target === 'fabric' ? '面里衬采购' : cat.target === 'accessory' ? '辅料采购' : '水洗管理'), 'success');
  } catch (e) {
    console.error(e);
    App.toast('保存成功，但同步失败：' + (e.message || e), 'error');
  }

  App.modal.close();
  renderMaterials();
}

// 单条同步（从列表按钮触发）
function syncOneMaterial(id) {
  const list = getOrderMaterials();
  const idx = list.findIndex(x => x.id === id);
  if (idx === -1) return;
  const m = list[idx];
  try {
    const info = syncOneMaterialToModules(m, true);
    if (info) {
      list[idx].syncedToModule = true;
      list[idx].syncedTargetId = info.id;
      list[idx].syncedTargetTable = info.table;
      saveOrderMaterials(list);
      App.toast('同步成功 → ' + (info.table === 'fabrics' ? '面里衬采购' : info.table === 'accessories' ? '辅料采购' : '水洗管理'), 'success');
      renderMaterials();
    }
  } catch (e) {
    console.error(e);
    App.toast('同步失败：' + (e.message || e), 'error');
  }
}

// 批量同步所有未同步的数据
function syncMaterialsToModules() {
  const list = getOrderMaterials();
  let updated = 0;
  list.forEach((m, idx) => {
    try {
      const info = syncOneMaterialToModules(m, false);
      if (info) {
        list[idx].syncedToModule = true;
        list[idx].syncedTargetId = info.id;
        list[idx].syncedTargetTable = info.table;
        updated++;
      }
    } catch (e) {
      console.error('同步失败:', m.id, e);
    }
  });
  saveOrderMaterials(list);
  App.toast(`已同步 ${updated} 条记录到各模块`, updated ? 'success' : 'info');
  renderMaterials();
}

// 核心：将一条耗料登记及状态记录同步到 fabric / accessory / wash 模块
// 若记录已带 syncedTargetId，则更新该条，否则新增
// forceDuplicate=false 时若已存在 styleNo+name+category 的相同记录，则跳过，返回 { id, table }
function syncOneMaterialToModules(m, forceDuplicate = false) {
  const cat = MAT_CATEGORIES._map[m.category];
  if (!cat) throw new Error('未知类别');

  const today = App.utils.today();

  if (cat.target === 'fabric') {
    const fabrics = App.store.get('fabrics', []);
    const sampleSentDate = m.date || '';
    const base = {
      styleNo: m.styleNo || '',
      fabricType: cat.fabricType || m.category,
      fabricName: m.name,
      usagePart: m.usagePart || '',
      supplier: m.supplier || '',
      composition: m.fabricComposition || '',
      color: m.color || '',
      colorCard: '',
      weightGsm: 0,
      width: '',
      sampleRounds: 1,
      sampleSentDate,
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
      contractNo: '',
      contractDate: m.contractDate || '',
      unitPrice: m.unitPrice || 0,
      qtyOrdered: m.qtyOrdered || 0,
      unit: m.unit || '米',
      shipFactory: m.shipFactory || '',
      shipDate: m.shipDate || '',
      arrivalDate: m.arrivalDate || '',
      remark: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
    };

    // 根据日期自动推进状态
    let status = '待打样';
    const STATUS_FLOW = ['待打样', '寄样中', '已确认', '采购合同', '发货中', '已到货'];
    if (base.arrivalDate) status = '已到货';
    else if (base.shipDate) status = '发货中';
    else if (base.contractDate) status = '采购合同';
    else if (base.confirmedDate) status = '已确认';
    else if (base.sampleSentDate) status = '寄样中';
    base.status = status;

    // 编号：有则保留，无则生成
    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = fabrics.findIndex(f => f.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = fabrics.findIndex(f =>
        (f.styleNo || '') === (m.styleNo || '') &&
        (f.fabricName || '') === (m.name || '') &&
        (f.fabricType || '') === (cat.fabricType || m.category)
      );
    }

    if (targetIdx !== -1) {
      const f = fabrics[targetIdx];
      fabrics[targetIdx] = { ...f, ...base, fabricCode: f.fabricCode || _matGenCode('STIG'), id: f.id };
    } else {
      base.id = App.utils.genId('F');
      base.fabricCode = _matGenCode('STIG');
      fabrics.push(base);
    }
    App.store.set('fabrics', fabrics);
    return { id: base.id || fabrics[targetIdx].id, table: 'fabrics' };
  }

  if (cat.target === 'accessory') {
    const accessories = App.store.get('accessories', []);
    const sampleSentDate = m.date || '';
    const base = {
      styleNo: m.styleNo || '',
      accessoryName: m.name,
      usagePart: m.usagePart || '',
      supplier: m.supplier || '',
      spec: m.spec || '',
      color: m.color || '',
      sampleRounds: 1,
      sampleSentDate,
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
      contractNo: '',
      contractDate: m.contractDate || '',
      unitPrice: m.unitPrice || 0,
      qtyOrdered: m.qtyOrdered || 0,
      unit: m.unit || '个',
      shipFactory: m.shipFactory || '',
      shipDate: m.shipDate || '',
      arrivalDate: m.arrivalDate || '',
      remark: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
    };

    let status = '待打样';
    const STATUS_FLOW = ['待打样', '寄样中', '已确认', '采购合同', '发货中', '已到货'];
    if (base.arrivalDate) status = '已到货';
    else if (base.shipDate) status = '发货中';
    else if (base.contractDate) status = '采购合同';
    else if (base.confirmedDate) status = '已确认';
    else if (base.sampleSentDate) status = '寄样中';
    base.status = status;

    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = accessories.findIndex(a => a.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = accessories.findIndex(a =>
        (a.styleNo || '') === (m.styleNo || '') &&
        (a.accessoryName || '') === (m.name || '') &&
        (a.color || '') === (m.color || '')
      );
    }

    if (targetIdx !== -1) {
      const a = accessories[targetIdx];
      accessories[targetIdx] = { ...a, ...base, accessoryCode: a.accessoryCode || _matGenCode('STIG'), id: a.id };
    } else {
      base.id = App.utils.genId('A');
      base.accessoryCode = _matGenCode('STIG');
      accessories.push(base);
    }
    App.store.set('accessories', accessories);
    return { id: base.id || accessories[targetIdx].id, table: 'accessories' };
  }

  if (cat.target === 'wash') {
    const washes = App.store.get('washes', []);
    const washCategory = m.washCategory || '面料水洗';
    const washDate = m.date || today;
    const factory = m.supplier || '';
    const rounds = [{
      round: 1,
      washDate,
      factory,
      washResult: m.washMethod || '',
      status: '寄样中',
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
    }];
    const base = {
      washNo: '',
      washCategory,
      styleNo: m.styleNo || '',
      itemName: m.name,
      washMethod: m.washMethod || '',
      targetColor: m.color || '',
      techNotes: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
      factory,
      rounds,
      status: '寄样中',
      remark: m.orderNo ? ('[PO: ' + m.orderNo + ']') : '',
      createDate: today,
    };
    // 已确认就推进状态
    if (m.confirmedDate) base.status = '已确认';

    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = washes.findIndex(w => w.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = washes.findIndex(w =>
        (w.styleNo || '') === (m.styleNo || '') &&
        (w.itemName || '') === (m.name || '') &&
        (w.washCategory || '') === washCategory
      );
    }

    if (targetIdx !== -1) {
      const w = washes[targetIdx];
      // 已有水洗记录：追加一轮
      const existingRounds = w.rounds && w.rounds.length ? w.rounds.slice() : [];
      const nextRound = existingRounds.length + 1;
      existingRounds.push({ ...rounds[0], round: nextRound, status: m.confirmedDate ? '已确认' : '寄样中', confirmedDate: m.confirmedDate || '' });
      washes[targetIdx] = {
        ...w,
        washMethod: base.washMethod || w.washMethod,
        targetColor: base.targetColor || w.targetColor,
        techNotes: base.techNotes || w.techNotes,
        factory: base.factory || w.factory,
        rounds: existingRounds,
        status: m.confirmedDate ? '已确认' : w.status,
      };
    } else {
      base.id = App.utils.genId('WS');
      base.washNo = _matGenWashNo();
      washes.push(base);
    }
    App.store.set('washes', washes);
    return { id: base.id || washes[targetIdx].id, table: 'washes' };
  }

  throw new Error('未知目标模块');
}

// 删除耗料登记及状态
function deleteMaterial(id) {
  App.confirm('删除这条耗料登记记录？（不会删除已同步到各模块的数据）', () => {
    const list = getOrderMaterials().filter(x => x.id !== id);
    saveOrderMaterials(list);
    App.toast('已删除', 'success');
    renderMaterials();
  });
}

renderCustomerFilter();
renderTable();
