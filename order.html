// ===== 打印订单详情PDF =====
function printOrderPDF(id) {
  const orders = App.store.get('orders', []);
  const order = orders.find(o => o.id === id);
  if (!order) { App.toast('订单不存在', 'error'); return; }

  const seasonMap = { SS: '春夏', FW: '秋冬', AW: '秋冬', Holiday: '假日' };
  const shipMap = { Sea: '海运', Air: '空运', Express: '快递' };
  const customerName = getCustomerName(order.customerId);
  const plannerName = order.planner ? getContactPersonName(order.planner) : '-';
  const designerName = order.designer ? getContactPersonName(order.designer) : '-';
  const pManagerName = order.pManager ? getContactPersonName(order.pManager) : '-';
  const totalCartons = (order.noOfCartons && order.noOfCartons > 0) ? order.noOfCartons :
    (order.sizeMatrix ? order.sizeMatrix.rows.reduce((s,r)=>s+(parseInt(r.noOfCartons)||0),0) : 0);

  // 关联数据
  const styleNo = order.styleNo;
  const fabrics = App.store.get('fabrics', []).filter(f => f.styleNo === styleNo);
  const accessories = App.store.get('accessories', []).filter(a => a.styleNo === styleNo);
  const samples = App.store.get('samples', []).filter(s => s.styleNo === styleNo);
  const productions = App.store.get('productions', []).filter(p => p.styleNo === styleNo || p.orderNo === order.orderNo);

  const esc = App.utils.escapeHtml;
  const bgCA = '-webkit-print-color-adjust:exact;print-color-adjust:exact;';
  const thStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;background:#e8f1f5;text-align:left;' + bgCA;
  const tdStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;';
  const tcStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;text-align:center;';

  // 尺码矩阵HTML（SOLID不乘箱数，A/B/C/D乘箱数）
  let matrixHtml = '';
  if (order.sizeMatrix && order.sizeMatrix.sizes && order.sizeMatrix.sizes.length) {
    const sm = order.sizeMatrix;
    const sizeCols = sm.sizes.map(s => `<th style="${tcStyle}background:#e8f1f5;${bgCA}">${esc(s)}</th>`).join('');
    let rowsHtml = '';
    sm.rows.forEach(row => {
      const qtyCells = sm.sizes.map(s => {
        const val = row.quantities && row.quantities[s] ? row.quantities[s] : '-';
        return `<td style="${tcStyle}">${val}</td>`;
      }).join('');
      const sizeSum = sm.sizes.reduce((sum, s) => sum + (parseInt(row.quantities?.[s]) || 0), 0);
      const cartons = parseInt(row.noOfCartons) || 0;
      const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
      rowsHtml += `<tr>
        <td style="${tdStyle}">${esc(row.packageId || '-')}</td>
        <td style="${tcStyle}">${esc(row.assType || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorCode || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorName || '-')}</td>
        <td style="${tcStyle}">${row.noOfCartons || '-'}</td>
        ${qtyCells}
        <td style="${tcStyle}font-weight:600;">${rowTotal}</td>
      </tr>`;
    });
    const totalCells = sm.sizes.map(s => {
      const colSum = sm.rows.reduce((sum, r) => {
        const qty = parseInt(r.quantities?.[s]) || 0;
        return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
      }, 0);
      return `<td style="${tcStyle}font-weight:600;background:#f3f4f6;${bgCA}">${colSum}</td>`;
    }).join('');
    const grandTotal = sm.rows.reduce((sum, r) => {
      const sizeSum = sm.sizes.reduce((s, sz) => s + (parseInt(r.quantities?.[sz]) || 0), 0);
      const cartons = parseInt(r.noOfCartons) || 0;
      return sum + (r.assType === 'SOLID' ? sizeSum : sizeSum * cartons);
    }, 0);
    matrixHtml = `
      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;">
        <thead>
          <tr>
            <th style="${thStyle}">包装ID</th>
            <th style="${thStyle}">类型</th>
            <th style="${thStyle}">色号</th>
            <th style="${thStyle}">颜色</th>
            <th style="${thStyle}">箱数</th>
            ${sizeCols}
            <th style="${thStyle}">小计</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          <tr style="background:#f3f4f6;${bgCA}">
            <td colspan="5" style="${tdStyle}text-align:right;font-weight:600;">合计：</td>
            ${totalCells}
            <td style="${tcStyle}font-weight:700;">${grandTotal}</td>
          </tr>
        </tfoot>
      </table>`;
  }

  // 通用表格生成
  const buildTable = (columns, data) => {
    if (!data || data.length === 0) return '<div style="font-size:10px;color:#999;padding:4px;">暂无数据</div>';
    const heads = columns.map(c => `<th style="${thStyle}">${c.title}</th>`).join('');
    const rows = data.map(row => {
      const cells = columns.map(c => {
        let v = row[c.key];
        if (c.render) v = c.render(row[c.key], row);
        if (v === null || v === undefined || v === '') v = '-';
        return `<td style="${tdStyle}">${v}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;margin-bottom:10px;"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  };

  const samplesTable = buildTable([
    { key: 'stage', title: '阶段' },
    { key: 'round', title: '轮次' },
    { key: 'sampleDate', title: '日期' },
    { key: 'factory', title: '打样厂' },
    { key: 'size', title: '尺码' },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], samples);

  const fabricsTable = buildTable([
    { key: 'fabricName', title: '面料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'composition', title: '成分' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], fabrics);

  const accessoriesTable = buildTable([
    { key: 'accessoryName', title: '辅料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'spec', title: '规格' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], accessories);

  const productionsTable = buildTable([
    { key: 'factoryType', title: '工厂类型' },

    { key: 'startDate', title: '开始日期' },

  .doc-header .doc-title .kv { display: flex; justify-content: flex-end; gap: 2px; margin-top: 2px; font-size: 11px; }
  .doc-header .doc-title .kv .k { background: #d32f2f; color: #fff; padding: 2px 8px; font-weight: 600; border-radius: 3px 0 0 3px; white-space: nowrap; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc-header .doc-title .kv .v { background: #d32f2f; color: #fff; padding: 2px 8px; font-weight: 700; border-radius: 0 3px 3px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .section-title { font-size: 11px; font-weight: 700; color: #004D6D; border-left: 3px solid #004D6D; padding-left: 5px; margin: 8px 0 4px; }

// ===== 尺寸表标签页 =====
let currentOrderTab = 'orders';
let _sizeSheetSearch = '';

function switchOrderTab(tab) {
  currentOrderTab = tab;
  document.querySelectorAll('#orderTabs .tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.getElementById('ordersTab').style.display = tab === 'orders' ? '' : 'none';
  document.getElementById('sizesTab').style.display = tab === 'sizes' ? '' : 'none';
  document.getElementById('quotationTab').style.display = tab === 'quotation' ? '' : 'none';
  if (tab === 'sizes') renderSizeSheets();
  if (tab === 'quotation') q_initIfNeeded();
}

// 尺寸表数据管理
function getSizeSheets() {
  return App.store.get('sizeSheets', []);
}

function saveSizeSheets(sheets) {
  App.store.set('sizeSheets', sheets);
}

// 渲染尺寸表列表（卡片式）
function renderSizeSheets() {
  const sheets = getSizeSheets();
  _sizeSheetSearch = document.getElementById('sizeSearchInput').value;
  const search = (_sizeSheetSearch || '').toLowerCase().trim();
  const typeFilter = document.getElementById('sizeTypeFilter').value;
  const container = document.getElementById('sizeSheetContainer');
  const countEl = document.getElementById('sizeSheetCount');

  let filtered = sheets;
  if (search) {
    filtered = filtered.filter(s =>
      (s.orderNo && s.orderNo.toLowerCase().includes(search)) ||
      (s.styleNo && s.styleNo.toLowerCase().includes(search))
    );
  }
  if (typeFilter) {
    filtered = filtered.filter(s => (s.sampleType || '大货') === typeFilter);
  }

  countEl.textContent = sheets.length > 0 ? `（共 ${sheets.length} 份尺寸表，筛选 ${filtered.length} 份）` : '';

  if (filtered.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:#999;">
        <div style="font-size:48px;margin-bottom:12px;">📐</div>
        <div style="margin-bottom:16px;">${sheets.length === 0 ? '暂无尺寸表数据，请导入Excel文件' : '没有匹配的尺寸表'}</div>
        ${sheets.length === 0 ? '<div style="font-size:12px;color:#999;">点击"📄 模板"下载模板，点击"📥 导入"上传数据</div>' : ''}
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(sheet => {
    const sizeCount = sheet.sizes ? sheet.sizes.length : 0;
    const rowCount = sheet.rows ? sheet.rows.length : 0;
    return `
      <div class="size-sheet-card" style="border:1px solid var(--border);border-radius:8px;margin-bottom:12px;background:#fff;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-light);background:#f8f9fa;">
          <div style="display:flex;gap:20px;align-items:center;">
            <div>
              <span style="color:var(--muted);font-size:12px;">类型：</span>
              ${App.statusTag(sheet.sampleType || '大货')}
            </div>
            <div>

// 处理尺寸表Excel导入
function handleSizeImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '', header: 1, raw: false });

      if (rows.length < 2) {
        App.toast('文件格式错误，至少需要2行数据', 'error');
        return;
      }

      const sheets = getSizeSheets();
      let importCount = 0;
      let skipCount = 0;

      const { processed, skipped } = parseSizeSheetRows(rows);
      processed.forEach(sheet => {
        const existsIdx = sheets.findIndex(s => s.orderNo === sheet.orderNo && s.styleNo === sheet.styleNo && (s.sampleType || '大货') === (sheet.sampleType || '大货'));
        if (existsIdx >= 0) {
          sheets[existsIdx] = sheet;
        } else {
          sheets.push(sheet);
        }
        importCount++;
      });
      skipCount = skipped;

      saveSizeSheets(sheets);
      renderSizeSheets();

      let msg = `导入完成：成功 ${importCount} 份尺寸表`;
      if (skipCount > 0) msg += `，跳过 ${skipCount} 行（格式不匹配）`;
      App.toast(msg, 'success');
    } catch (err) {
      console.error('导入失败:', err);
      App.toast('导入失败，请检查文件格式', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Excel日期序列号转字符串
function formatExcelDate(val) {
  if (val === null || val === undefined || val === '') return '';
  // 已经是字符串日期（如 2026/7/3）
  if (typeof val === 'string') return val.trim();
  // Date对象（cellDates:true时）
  if (val instanceof Date) {
    const y = val.getFullYear();
    const m = val.getMonth() + 1;
    const d = val.getDate();
    return `${y}/${m}/${d}`;
  }
  // 数字序列号（如46243）
  if (typeof val === 'number') {
    const date = new Date(Math.round((val - 25569) * 86400 * 1000));
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + 1;
    const d = date.getUTCDate();
    return `${y}/${m}/${d}`;
  }
  return String(val).trim();
}

// 解析尺寸表数据行
function parseSizeSheetRows(rows) {
  const result = { processed: [], skipped: 0 };
  if (rows.length < 2) return result;

  const headerRow = rows[0].map(h => String(h).trim());
  const headers = {
    po: headerRow.findIndex(h => h.includes('PO') || h.includes('po') || h === 'PO号'),
    styleNo: headerRow.findIndex(h => h.includes('款号') || h.includes('style') || h.toLowerCase().includes('style')),
    sampleType: headerRow.findIndex(h => h === '类型' || h === '样衣类型'),
    date: headerRow.findIndex(h => h === '日期' || h === 'date' || h.toLowerCase() === 'date'),
    code: headerRow.findIndex(h => h === '部位编号' || h === '部位'),
    en: headerRow.findIndex(h => h === '英文名称' || h === '英文'),
    cn: headerRow.findIndex(h => h === '中文名称' || h === '中文'),
    tolerance: headerRow.findIndex(h => h === '公差' || h === 'tolerance' || h.toLowerCase() === 'tolerance'),
  };

  if (headers.po === -1 || headers.styleNo === -1 || headers.code === -1) {
    result.skipped = rows.length - 1;
    return result;
  }

  const sizeStartIdx = Math.max(
    headers.en, headers.cn, headers.tolerance,
    headers.po, headers.styleNo, headers.date, headers.code,
    headers.sampleType
  ) + 1;

  const sizeCols = [];
  for (let i = sizeStartIdx; i < headerRow.length; i++) {
    if (headerRow[i]) sizeCols.push({ col: i, size: headerRow[i] });
  }

  const sheetMap = {};
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;

    const orderNo = headers.po >= 0 ? String(row[headers.po] || '').trim() : '';
    const styleNo = headers.styleNo >= 0 ? String(row[headers.styleNo] || '').trim() : '';
    const sampleType = headers.sampleType >= 0 ? String(row[headers.sampleType] || '').trim() : '';
    const date = headers.date >= 0 ? formatExcelDate(row[headers.date]) : '';
    const code = headers.code >= 0 ? String(row[headers.code] || '').trim() : '';
    const en = headers.en >= 0 ? String(row[headers.en] || '').trim() : '';
    const cn = headers.cn >= 0 ? String(row[headers.cn] || '').trim() : '';
    const tolerance = headers.tolerance >= 0 ? String(row[headers.tolerance] || '').trim() : '';

    if (!code) { result.skipped++; continue; }

    const key = `${orderNo}_${styleNo}_${sampleType}`;
    if (!sheetMap[key]) {
      sheetMap[key] = {
        id: App.utils.genId('SS'),
        orderNo, styleNo, sampleType: sampleType || '大货', date,
        sizes: sizeCols.map(sc => sc.size),
        rows: []
      };
    }

    const values = {};
    sizeCols.forEach(sc => {
      values[sc.size] = row[sc.col] !== undefined && row[sc.col] !== null ? String(row[sc.col]).trim() : '';
    });

    sheetMap[key].rows.push({ code, en, cn, tolerance, values });
  }

  result.processed = Object.values(sheetMap);
  return result;
}

function q_duplicateQuotation(id) {
  var data = q_getData();
  var q = data.find(function (x) { return x.id === id; });
  if (!q) return;
  var copy = JSON.parse(JSON.stringify(q));
  copy.id = q_uid();
  copy.quoteNo = q_generateQuoteNo();
  copy.quoteDate = q_todayStr();
  copy.validUntil = q_addDays(q_todayStr(), 30);
  copy.status = 'draft';
  copy.createdAt = new Date().toISOString();
  copy.updatedAt = new Date().toISOString();
  data.push(copy);
  q_saveData(data);
  q_showToast('Quotation duplicated', 'success');
  q_renderList();
}

function q_addItemRow(data, idx) {
  var body = document.getElementById('qf_itemsBody');
  if (!body) return;
  var i = idx !== undefined ? idx : body.children.length;
  data = data || { styleNo: '', productName: '', description: '', fabric: '', colors: '', sizes: '', moq: '', unitPrice: 0, quantity: 0, total: 0 };

  var tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="row-num" style="text-align:center;color:var(--muted);font-size:10px;">' + (i + 1) + '</td>' +
    '<td><input type="text" class="col-style" value="' + q_escapeHtml(data.styleNo) + '" placeholder="ST-001" oninput="q_recalc()"></td>' +
    '<td><input type="text" value="' + q_escapeHtml(data.productName) + '" placeholder="Cotton Blouse" oninput="q_recalc()"></td>' +
    '<td><input type="text" value="' + q_escapeHtml(data.description) + '" placeholder="Brief description" oninput="q_recalc()"></td>' +
    '<td><input type="text" value="' + q_escapeHtml(data.fabric) + '" placeholder="100% Cotton" oninput="q_recalc()"></td>' +
    '<td><input type="text" value="' + q_escapeHtml(data.colors) + '" placeholder="White, Black" oninput="q_recalc()"></td>' +
    '<td><input type="text" value="' + q_escapeHtml(data.sizes) + '" placeholder="S, M, L, XL" oninput="q_recalc()"></td>' +
    '<td><input type="number" value="' + (data.moq || 0) + '" placeholder="500" oninput="q_recalc()" style="text-align:right;" min="0"></td>' +
    '<td><input type="number" class="col-price" value="' + (data.unitPrice || 0) + '" placeholder="0.00" oninput="q_recalc()" style="text-align:right;" step="0.01"></td>' +
    '<td class="col-total-cell">0.00</td>' +
    '<td class="col-del"><button class="btn btn-icon btn-sm" onclick="q_removeRow(this)" title="Remove" style="color:var(--error);">✕</button></td>';
  body.appendChild(tr);
  q_recalc();
}

function q_removeRow(btn) {
  var body = document.getElementById('qf_itemsBody');
  if (body.children.length <= 1) { q_showToast('At least one row required', 'error'); return; }
  var tr = btn.closest('tr');
  tr.remove();
  var rows = body.querySelectorAll('tr');
  rows.forEach(function (r, i) {
    var cell = r.querySelector('.row-num');
    if (cell) cell.textContent = (i + 1);
  });
  q_recalc();
}

function q_recalc() {
  var body = document.getElementById('qf_itemsBody');
  if (!body) return;
  var currency = (document.getElementById('qf_currency') || {}).value || 'USD';
  var subtotal = 0;
  var rows = body.querySelectorAll('tr');
  rows.forEach(function (r) {
    var inputs = r.querySelectorAll('input');
    var moq = parseFloat(inputs[6].value) || 0;
    var price = parseFloat(inputs[7].value) || 0;
    var total = moq * price;
    r.querySelector('.col-total-cell').textContent = q_formatMoney(total);
    subtotal += total;
  });

  var discountVal = parseFloat(document.getElementById('qf_discount').value) || 0;
  var discountType = document.getElementById('qf_discountType').value;
  var discountAmount = discountType === 'percentage' ? subtotal * discountVal / 100 : discountVal;
  if (discountAmount > subtotal) discountAmount = subtotal;

  var hangerCost = parseFloat(document.getElementById('qf_hangerCost').value) || 0;
  var totalMOQ = 0;
  rows.forEach(function (r) {
    var inputs = r.querySelectorAll('input');
    totalMOQ += parseFloat(inputs[6].value) || 0;
  });
  var hangerAmount = totalMOQ * hangerCost;
  var grand = subtotal - discountAmount + hangerAmount;

  document.getElementById('qf_calc_subtotal').textContent = currency + ' ' + q_formatMoney(subtotal);
  document.getElementById('qf_calc_discount').textContent = '- ' + q_formatMoney(discountAmount);
  document.getElementById('qf_calc_hanger').textContent = q_formatMoney(hangerAmount);
  document.getElementById('qf_calc_grand').textContent = currency + ' ' + q_formatMoney(grand);
}

function q_saveQuotation(preview) {
  var items = [];
  var rows = document.querySelectorAll('#qf_itemsBody tr');
  rows.forEach(function (r) {
    var inputs = r.querySelectorAll('input');
    items.push({
      styleNo: inputs[0].value.trim(),
      productName: inputs[1].value.trim(),
      description: inputs[2].value.trim(),
      fabric: inputs[3].value.trim(),
      colors: inputs[4].value.trim(),
      sizes: inputs[5].value.trim(),
      moq: parseFloat(inputs[6].value) || 0,
      unitPrice: parseFloat(inputs[7].value) || 0,
      total: (parseFloat(inputs[6].value) || 0) * (parseFloat(inputs[7].value) || 0)
    });
  });

  var subtotal = items.reduce(function (s, i) { return s + i.total; }, 0);
  var discountVal = parseFloat(document.getElementById('qf_discount').value) || 0;
  var discountType = document.getElementById('qf_discountType').value;
  var discountAmount = discountType === 'percentage' ? subtotal * discountVal / 100 : discountVal;
  if (discountAmount > subtotal) discountAmount = subtotal;
  var hangerCost = parseFloat(document.getElementById('qf_hangerCost').value) || 0;
  var totalMOQ = items.reduce(function (s, i) { return s + (parseFloat(i.moq) || 0); }, 0);
  var hangerAmount = totalMOQ * hangerCost;
  var grandTotal = subtotal - discountAmount + hangerAmount;

  var q = {
    id: q_editingId || q_uid(),
    quoteNo: document.getElementById('qf_quoteNo').value.trim(),
    quoteDate: document.getElementById('qf_quoteDate').value,
    validUntil: document.getElementById('qf_validUntil').value,
    customerName: document.getElementById('qf_customerName').value.trim(),
    customerCompany: document.getElementById('qf_customerCompany').value.trim(),
    customerAddress: document.getElementById('qf_customerAddress').value.trim(),
    customerContact: document.getElementById('qf_customerName').value.trim(),
    customerEmail: document.getElementById('qf_customerEmail').value.trim(),
    customerPhone: document.getElementById('qf_customerPhone').value.trim(),
    season: document.getElementById('qf_season').value.trim(),
    currency: document.getElementById('qf_currency').value,
    items: items,
    subtotal: subtotal,
    discount: discountVal,
    discountType: discountType,
    discountAmount: discountAmount,
    hangerCost: hangerCost,
    hangerAmount: hangerAmount,
    grandTotal: grandTotal,
    paymentTerms: document.getElementById('qf_paymentTerms').value.trim(),
    deliveryTerms: document.getElementById('qf_deliveryTerms').value.trim(),
    leadTime: document.getElementById('qf_leadTime').value.trim(),
    notes: document.getElementById('qf_notes').value.trim(),
    status: document.getElementById('qf_status').value,
    preparedBy: (q_getSettings().userName || 'User'),
    createdAt: q_editingId ? (q_getData().find(function (x) { return x.id === q_editingId; }) || {}).createdAt || new Date().toISOString() : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };

  var data = q_getData();
  if (q_editingId) {
    var idx = data.findIndex(function (x) { return x.id === q_editingId; });
    if (idx >= 0) data[idx] = q; else data.push(q);
  } else {
    data.push(q);
    q_editingId = q.id;
  }
  q_saveData(data);
  q_showToast('Quotation saved successfully', 'success');

  if (preview) {
    q_previewQuotation(q.id);
  } else {
    q_renderList();
  }
}

function q_deleteQuotation(id) {
  q_showConfirm('Delete Quotation', 'Are you sure you want to delete this quotation? This action cannot be undone.', function () {
    var data = q_getData();
    data = data.filter(function (q) { return q.id !== id; });
    q_saveData(data);
    q_showToast('Quotation deleted', 'success');
    q_renderList();
  });
}

function q_showConfirm(title, body, callback) {
  document.getElementById('qModalTitle').textContent = title;
  document.getElementById('qModalBody').textContent = body;
  document.getElementById('qConfirmModal').classList.add('show');
  document.getElementById('qModalConfirmBtn').onclick = function () {
    callback();
    q_closeModal();
  };
}
function q_closeModal() {
  document.getElementById('qConfirmModal').classList.remove('show');
}

function q_saveSettingsForm() {
  var fields = ['companyName', 'userName', 'companyAddress', 'companyPhone', 'companyEmail', 'companyTaxId', 'custCompany', 'custContact', 'custAddress', 'custPhone', 'custEmail', 'defaultCurrency', 'defaultHangerCost', 'defaultDiscount', 'defaultPaymentTerms', 'defaultDeliveryTerms', 'defaultLeadTime', 'defaultValidity', 'defaultNotes'];
  var obj = {};
  fields.forEach(function (f) {
    var el = document.getElementById('qs_' + f);
    if (el) obj[f] = el.value;
  });
  var existing = q_getSettings();
  var merged = Object.assign({}, existing, obj);
  q_saveSettings(merged);
  q_showToast('Settings saved', 'success');
  q_showList();
}

// ===== Navigation =====
function q_setNavActive(id) {
  var links = document.querySelectorAll('#qSubnav a');
  for (var i = 0; i < links.length; i++) links[i].classList.remove('active');
  var el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function q_showList() {
  q_renderList();
  q_setNavActive('qnav-list');
}

function q_newQuotationNav() {
  q_newQuotation();
  q_setNavActive('qnav-new');
}

}
