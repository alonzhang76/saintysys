<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 - 舜天汉唐服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260812">
<script src="js/xlsx.full.min.js?v=20260821"></script>
<style>
.no-spinner::-webkit-inner-spin-button,
.no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.no-spinner { -moz-appearance: textfield; }
.modal-lg .modal-body { max-height: calc(60vh + 40mm); }
.modal.modal-lg { max-width: 1100px; }
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-area">
    <div class="app-header">
      <button class="header-toggle">☰</button>
      <span class="header-title">订单管理</span>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="App.backupData()">📦</button>
        <div class="header-user"><span>👤</span><span class="user-name">管理员</span></div>
        <button class="btn btn-sm" onclick="App.logout()">🚪</button>
      </div>
    </div>
    <div class="app-content">
      <!-- 标签页 -->
      <div class="tabs" id="orderTabs" style="margin-bottom:0;">
        <div class="tab-item active" data-tab="orders" onclick="switchOrderTab('orders')">订单列表</div>
        <div class="tab-item" data-tab="materials" onclick="switchOrderTab('materials')">物料登记</div>
        <div class="tab-item" data-tab="sizes" onclick="switchOrderTab('sizes')">尺寸表</div>
        <div class="tab-item" data-tab="layout" onclick="switchOrderTab('layout')">款式图</div>
      </div>

      <!-- 订单列表 -->
      <div id="ordersTab">
        <!-- 统计卡片 -->
        <div class="stat-grid" id="statCards"></div>

        <!-- 表格区域 -->
        <div class="table-wrap">
          <div class="filter-bar">
            <div class="search-input">
              <input type="text" id="searchInput" class="form-input" placeholder="按PO/款号/客户搜索" oninput="renderTable()">
            </div>
            <select id="statusFilter" class="form-select" onchange="renderTable()">
              <option value="">全部状态</option>
              <option value="草稿">草稿</option>
              <option value="待排产">待排产</option>
              <option value="生产中">生产中</option>
              <option value="已发货">已发货</option>
              <option value="已完成">已完成</option>
              <option value="已取消">已取消</option>
            </select>
            <select id="customerFilter" class="form-select" onchange="renderTable()">
              <option value="">全部客户</option>
            </select>
          </div>
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">订单列表</span>
            </div>
            <div class="table-toolbar-right">
              <button class="btn btn-primary" onclick="openForm()">➕</button>
            </div>
          </div>
          <div id="orderTable"></div>
        </div>
      </div>

      <!-- 物料登记 -->
      <div id="materialsTab" style="display:none;">
        <div class="table-wrap">
          <div class="filter-bar">
            <div class="search-input">
              <input type="text" id="matSearchInput" class="form-input" placeholder="搜索PO/款号/名称/供应商" oninput="renderMaterials()">
            </div>
            <select id="matCategoryFilter" class="form-select" onchange="renderMaterials()">
              <option value="">全部类别</option>
              <option value="面料">面料</option>
              <option value="里料">里料</option>
              <option value="衬">衬</option>
              <option value="填充料">填充料</option>
              <option value="辅料">辅料</option>
              <option value="水洗">水洗</option>
            </select>
            <select id="matOrderFilter" class="form-select" onchange="renderMaterials()">
              <option value="">全部订单</option>
            </select>
          </div>
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">物料登记</span>
              <span class="text-muted" id="matCountLabel" style="font-size:12px;"></span>
            </div>
            <div class="table-toolbar-right">
              <button class="btn btn-sm" onclick="syncMaterialsToModules()" title="同步当前数据到各模块">🔄 同步到模块</button>
              <button class="btn btn-primary" onclick="openMaterialModal()" title="新增登记">➕</button>
            </div>
          </div>
          <div id="materialsTable"></div>
        </div>
      </div>

      <!-- 尺寸表 -->
      <div id="sizesTab" style="display:none;">
        <div class="table-wrap">
          <div class="filter-bar">
            <div class="search-input">
              <input type="text" id="sizeSearchInput" class="form-input" placeholder="搜索PO号或款号" oninput="renderSizeSheets()">
            </div>
            <select id="sizeTypeFilter" class="form-select" onchange="renderSizeSheets()">
              <option value="">全部类型</option>
              <option value="头样">头样</option>
              <option value="尺码样">尺码样</option>
              <option value="产前样">产前样</option>
              <option value="船样">船样</option>
              <option value="照片样">照片样</option>
              <option value="大货">大货</option>
              <option value="客供尺寸表">客供尺寸表</option>
            </select>
            <button class="btn btn-sm" onclick="downloadSizeTemplate()" title="下载模板">📄 模板</button>
            <button class="btn btn-sm" onclick="document.getElementById('sizeImportInput').click()" title="导入Excel">📥 导入</button>
            <input type="file" id="sizeImportInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleSizeImport(event)">
            <button class="btn btn-sm" onclick="clearAllSizeSheets()" title="清空全部">🗑️ 清空</button>
          </div>
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">尺寸表</span>
              <span class="text-muted" id="sizeSheetCount" style="font-size:12px;"></span>
            </div>
            <div class="table-toolbar-right" id="sizeSheetToolbar"></div>
          </div>
          <div id="sizeSheetContainer"></div>
        </div>
      </div>

      <!-- 款式图 -->
      <div id="layoutTab" style="display:none;">
        <div class="table-wrap">
          <div class="filter-bar">
            <div class="search-input">
              <input type="text" id="layoutSearchInput" class="form-input" placeholder="输入款号搜索款式图（如 111057）" oninput="searchLayoutImages()">
            </div>
            <button class="btn btn-sm" onclick="document.getElementById('layoutFolderInput').click()" title="选择款式图文件夹">📁 选择文件夹</button>
            <input type="file" id="layoutFolderInput" webkitdirectory style="display:none" onchange="loadLayoutFolder(event)">
            <span id="layoutFolderName" style="font-size:12px;color:var(--muted);"></span>
          </div>
          <div class="table-toolbar">
            <div class="table-toolbar-left">
              <span class="card-title">款式图预览</span>
              <span class="text-muted" id="layoutCount" style="font-size:12px;"></span>
            </div>
            <div class="table-toolbar-right">
              <label style="font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;margin-right:8px;">
                <input type="checkbox" id="layoutSelectAll" onchange="toggleLayoutSelectAll(this.checked)" style="width:14px;height:14px;"> 全选
              </label>
              <button class="btn btn-sm" onclick="printLayoutImages()" title="打印选中或全部匹配图片">🖨️ 打印PDF</button>
            </div>
          </div>
          <div id="layoutContainer"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js?v=20260821b"></script>
<!-- Supabase 登录守卫 -->
<script src="js/localstorage-patch.js?v=20260822h"></script>
<script src="js/supabase-store.js?v=20260822h"></script>
<script src="js/init-page.js?v=20260821b"></script>
<script src="js/auth-guard.js?v=20260821b"></script>
<script type="module" src="js/admin-config.js?v=20260813"></script>
<script type="module" src="js/form-submit.js?v=20260813"></script>
<script type="module" src="js/logout.js?v=20260813"></script>
<script>
// ===== 云端同步：提前注册监听器 =====
var PageDataSyncGuard = {
  inited: false, pending: false,
  watchKeys: ["orders", "contacts"],
  emptyCheckKeys: ["orders"],
  afterInit: function() {
    var self = this; this.inited = true;
    function doRefresh() { try { if (typeof window.renderAll === 'function') window.renderAll(); } catch(e) {} }
    if (self.pending) setTimeout(doRefresh, 200);
    setTimeout(function() {
      var allEmpty = self.emptyCheckKeys.every(function(k){
        try{ var a=App.store.get(k,[]); return !a||a.length===0; }catch(e){return true;}
      });
      if (allEmpty) doRefresh();
    }, 2000);
  }
};
window.addEventListener('cloud-data-updated', function(e){
  var keys = (e.detail&&e.detail.keys)||[];
  var need = keys.some(function(k){ return PageDataSyncGuard.watchKeys.indexOf(k)>=0; });
  if (need) {
    if (!PageDataSyncGuard.inited) { PageDataSyncGuard.pending=true; return; }
    try { if (typeof window.renderAll==='function') window.renderAll(); } catch(e){}
  }
});

window.renderAll = function() { try { renderStats(); renderCustomerFilter(); renderTable(); } catch(e) {} };

App.init('order');
App.checkLogin();
App.initSampleData();
App.enforcePagePermission('order');
  setTimeout(function() { if (window.PageDataSyncGuard) window.PageDataSyncGuard.afterInit(); }, 0);

// ===== 工具函数 =====

// 根据联系人ID获取客户公司名
function getCustomerName(customerId) {
  const contacts = App.store.get('contacts', []);
  const c = contacts.find(c => c.id === customerId);
  return c ? c.name : customerId || '-';
}

// 根据联系人ID获取联系人姓名（用于planner/designer/pManager）
function getContactPersonName(contactId) {
  const contacts = App.store.get('contacts', []);
  const c = contacts.find(c => c.id === contactId);
  if (!c) return contactId || '-';
  return c.contactPerson || c.name || contactId;
}

// 自动生成订单号 ORD-2026-XXXX
function genOrderNo() {
  const orders = App.store.get('orders', []);
  const year = new Date().getFullYear();
  let maxNum = 0;
  orders.forEach(o => {
    const match = o.orderNo && o.orderNo.match(/ORD-\d{4}-(\d{4})/);
    if (match) {
      const num = parseInt(match[1]);
      if (num > maxNum) maxNum = num;
    }
  });
  const nextNum = String(maxNum + 1).padStart(4, '0');
  return `ORD-${year}-${nextNum}`;
}

// ===== 统计卡片 =====
function renderStats() {
  const orders = App.store.get('orders', []);
  const total = orders.length;
  const inProduction = orders.filter(o => o.status === '生产中').length;
  const pending = orders.filter(o => o.status === '待排产').length;
  const shipped = orders.filter(o => o.status === '已发货').length;

  const cards = [
    { icon: '📋', bg: '#e8f1f5', color: '#004D6D', label: '订单总数', value: total, sub: '全部订单' },
    { icon: '🏭', bg: '#fff8ed', color: '#d9883a', label: '生产中', value: inProduction, sub: '正在生产' },
    { icon: '⏳', bg: '#f9fafb', color: '#6b7280', label: '待排产', value: pending, sub: '等待排产' },
    { icon: '🚚', bg: '#ecfdfa', color: '#0d9488', label: '已发货', value: shipped, sub: '已发出' },
  ];

  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg};color:${c.color};">${c.icon}</div>
      <div class="stat-info">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value" style="color:${c.color};">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    </div>
  `).join('');
}

// ===== 客户筛选下拉 =====
function renderCustomerFilter() {
  const customers = App.store.get('contacts', []).filter(c => c.type === '客户');
  const filter = document.getElementById('customerFilter');
  const currentVal = filter.value;
  filter.innerHTML = '<option value="">全部客户</option>' +
    customers.map(c => `<option value="${c.id}">${App.utils.escapeHtml(c.name)}</option>`).join('');
  filter.value = currentVal;
}

// ===== 获取筛选后数据 =====
function getFilteredOrders() {
  const orders = App.store.get('orders', []);
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const customer = document.getElementById('customerFilter').value;

  const filtered = orders.filter(o => {
    // 搜索条件：订单号或款号
    if (search) {
      const orderNo = (o.orderNo || '').toLowerCase();
      const styleNo = (o.styleNo || '').toLowerCase();
      if (!orderNo.includes(search) && !styleNo.includes(search)) return false;
    }
    // 状态筛选
    if (status && o.status !== status) return false;
    // 客户筛选
    if (customer && o.customerId !== customer) return false;
    return true;
  });
  // 按订单日期倒序（空值排末尾）
  return App.utils.sortByDateDesc(filtered, ['orderDate', 'etd']);
}

// ===== 渲染表格 =====
function renderTable() {
  const data = getFilteredOrders();
  const allChecked = data.length > 0 && data.every(o => _selectedOrderIds.has(o.id));
  App.renderTable('orderTable', {
    columns: [
      { key: 'id', title: `<input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">`, width: '40px', render: (v) => `<input type="checkbox" ${_selectedOrderIds.has(v) ? 'checked' : ''} onchange="toggleSelect('${v}', this.checked)">` },
      { key: 'orderNo', title: 'PO', width: '130px' },
      { key: 'styleNo', title: 'Style No.', width: '110px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'customerId', title: 'Customer', width: '110px', render: (v) => App.utils.escapeHtml(getCustomerName(v)) },
      { key: 'orderDate', title: 'Date', width: '95px' },
      { key: 'season', title: 'Season', width: '70px', render: (v) => v || '-' },
      { key: 'styleDescription', title: 'Style Desc', width: '120px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'packageId', title: 'Package ID', width: '110px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'assType', title: 'Ass.Type', width: '60px', render: (v) => v || '-' },
      { key: 'colorCode', title: 'Color Code', width: '80px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'colorName', title: 'Color', width: '80px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'quantity', title: 'Qty', width: '70px', render: (v) => v ? Number(v).toLocaleString() : '-' },
      { key: 'unitPrice', title: 'U/Prx', width: '80px', render: (v) => {
        if (!App.canSeePrice()) return v ? '<span class="text-muted">*</span>' : '-';
        return v ? App.utils.formatMoney(v) : '-';
      } },
      { key: 'totalAmount', title: 'TTL Amount', width: '100px', render: (v) => {
        if (!App.canSeePrice()) return v ? '<span class="text-muted">*</span>' : '-';
        return v ? App.utils.formatMoney(v) : '-';
      } },
      { key: 'shipMethod', title: 'Shp Method', width: '80px', render: (v) => v || '-' },
      { key: 'etd', title: 'ETD', width: '95px' },
      { key: 'status', title: 'Status', width: '80px', render: (v) => App.statusTag(v || '草稿') },
      { key: 'remark', title: 'Remarks', width: '130px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
    ],
    data: data,
    actions: (row) => `
      <button class="btn btn-sm" title="查看详情" onclick="viewDetail('${row.id}')">👁️</button>
      <button class="btn btn-sm" title="编辑" onclick="openForm('${row.id}')">✏️</button>
      <button class="btn btn-sm btn-danger" title="删除" onclick="deleteOrder('${row.id}')">🗑️</button>
    `
  });
}

// ===== 尺码矩阵状态 =====
let _sizeMatrix = { sizeGroupId: null, sizes: [], rows: [] };

// ===== 表格选中状态 =====
let _selectedOrderIds = new Set();

function toggleSelectAll(checked) {
  const data = getFilteredOrders();
  if (checked) {
    data.forEach(o => _selectedOrderIds.add(o.id));
  } else {
    data.forEach(o => _selectedOrderIds.delete(o.id));
  }
  renderTable();
}

function toggleSelect(id, checked) {
  if (checked) {
    _selectedOrderIds.add(id);
  } else {
    _selectedOrderIds.delete(id);
  }
  // 只更新表头全选框状态，不重建整个表格
  const allChecked = getFilteredOrders().every(o => _selectedOrderIds.has(o.id));
  const headerCb = document.querySelector('#orderTable thead input[type="checkbox"]');
  if (headerCb) headerCb.checked = allChecked;
}

function loadSizeGroup() {
  const groups = App.store.get('maintSizes', []);
  const container = document.getElementById('sizeMatrixContainer');
  if (!container) return;

  if (groups.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px;border:2px dashed var(--border);border-radius:var(--radius);">
        <p style="color:var(--muted);margin-bottom:10px;">尺码表中暂无尺码组</p>
        <a href="maintenance.html" class="btn btn-primary" style="font-size:12px;padding:4px 12px;">前往尺码表添加</a>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div style="margin-bottom:8px;color:var(--muted);font-size:12px;">请选择一个尺码组：</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;">
      ${groups.map(g => `
        <div onclick="OrderModule.selectSizeGroup('${g.id}')" style="padding:10px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--primary)';this.style.background='var(--primary-light)'" onmouseout="this.style.borderColor='var(--border)';this.style.background=''">
          <div style="font-weight:600;font-size:13px;">${App.utils.escapeHtml(g.category)} / ${App.utils.escapeHtml(g.part)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:4px;">${(g.sizes || []).join(', ')}</div>
        </div>
      `).join('')}
    </div>`;
}

// 全局选择尺码组的方法
const OrderModule = {
  selectSizeGroup(gid) {
    if (!gid) return;
    const groups = App.store.get('maintSizes', []);
    const g = groups.find(x => x.id === gid);
    if (!g) return;
    _sizeMatrix = {
      sizeGroupId: g.id,
      sizes: [...(g.sizes || [])],
      rows: [{ packageId: '', assType: '', colorCode: '', colorName: '', noOfCartons: '', quantities: {} }]
    };
    renderSizeMatrix();
  }
};

function renderSizeMatrix() {
  const container = document.getElementById('sizeMatrixContainer');
  if (!container) return;

  if (!_sizeMatrix.sizes.length) {
    container.innerHTML = `
      <div style="text-align:center;padding:20px;border:2px dashed var(--border);border-radius:var(--radius);">
        <p style="color:var(--muted);margin-bottom:10px;">尚未选择尺码组</p>
        <button class="btn btn-primary" onclick="loadSizeGroup()">📏 从尺码表选择</button>
      </div>`;
    return;
  }

  const sizes = _sizeMatrix.sizes;
  const sizeCols = sizes.map(s => `<th style="width:50px;text-align:center;">${App.utils.escapeHtml(s)}</th>`).join('');

  let rowsHtml = '';
  let totalQty = 0;
  _sizeMatrix.rows.forEach((row, idx) => {
    const qtyCells = sizes.map((s, si) => {
      const val = row.quantities[s] || '';
      return `<td style="padding:2px;"><input type="number" class="form-input sm no-spinner" style="width:50px;text-align:center;padding:2px;font-size:12px;" value="${val}" oninput="updateMatrixQty(${idx}, '${s}', this.value)"></td>`;
    }).join('');

    // 行小计 = 类型为SOLID时仅取尺码数量之和，否则 × 箱数
    const sizeSum = sizes.reduce((sum, s) => sum + (parseInt(row.quantities[s]) || 0), 0);
    const cartons = parseInt(row.noOfCartons) || 0;
    const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
    totalQty += rowTotal;

    const assTypeOpts = ['A', 'B', 'C', 'D', 'SOLID'].map(opt =>
      `<option value="${opt}" ${row.assType === opt ? 'selected' : ''}>${opt}</option>`
    ).join('');

    rowsHtml += `
      <tr>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:130px;padding:2px;font-size:12px;" placeholder="包装ID" value="${App.utils.escapeHtml(row.packageId)}" oninput="updateMatrixRow(${idx}, 'packageId', this.value)"></td>
        <td style="padding:2px;"><select class="form-select sm" style="width:70px;padding:2px;font-size:12px;" onchange="updateMatrixRow(${idx}, 'assType', this.value); updateMatrixTotals();"><option value="">类型</option>${assTypeOpts}</select></td>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:55px;padding:2px;font-size:12px;" placeholder="色号" value="${App.utils.escapeHtml(row.colorCode)}" oninput="updateMatrixRow(${idx}, 'colorCode', this.value)"></td>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:110px;padding:2px;font-size:12px;" placeholder="颜色" value="${App.utils.escapeHtml(row.colorName)}" oninput="updateMatrixRow(${idx}, 'colorName', this.value)"></td>
        <td style="padding:2px;"><input type="number" class="form-input sm no-spinner" style="width:45px;text-align:center;padding:2px;font-size:12px;" placeholder="箱数" value="${row.noOfCartons}" oninput="updateMatrixRow(${idx}, 'noOfCartons', this.value); updateMatrixTotals();"></td>
        ${qtyCells}
        <td style="text-align:center;font-weight:600;color:var(--primary);" id="rowSub-${idx}">${rowTotal}</td>
        <td style="padding:2px;"><button class="btn btn-sm btn-danger" title="删除行" onclick="removeMatrixRow(${idx})" style="padding:2px 6px;">🗑️</button></td>
      </tr>`;
  });

  // 合计行（每列：SOLID行取尺码数量，其他行 数量×箱数）
  const totalCells = sizes.map((s, si) => {
    const colSum = _sizeMatrix.rows.reduce((sum, r) => {
      const qty = parseInt(r.quantities[s]) || 0;
      return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
    }, 0);
    return `<td style="text-align:center;font-weight:600;color:var(--primary);" id="colTotal-${si}">${colSum}</td>`;
  }).join('');

  container.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">

      <table class="data-table" style="min-width:100%;font-size:12px;">

          <tr>

            <th style="width:70px;">类型</th>
            <th style="width:55px;">色号</th>
            <th style="width:110px;">颜色</th>
            <th style="width:50px;">箱数</th>
            ${sizeCols}
            <th style="width:60px;">小计</th>
            <th style="width:45px;"></th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <thead>
          <tr style="background:var(--primary-light);">
            <td colspan="5" style="font-weight:600;text-align:right;">合计：</td>
            ${totalCells}
            <td style="font-weight:700;color:var(--primary);text-align:center;" id="grandTotal">${totalQty}</td>
            <td></td>
          </tr>
        </thead>
      </table>
    </div>
  `;
  // 更新总数量和总箱数字段
  const qtyInput = document.getElementById('f_qtyInCartons');
  if (qtyInput) qtyInput.value = totalQty;
  const cartonsInput = document.getElementById('f_noOfCartons');
  if (cartonsInput) {
    const totalCartons = _sizeMatrix.rows.reduce((sum, r) => sum + (parseInt(r.noOfCartons) || 0), 0);
    cartonsInput.value = totalCartons;
  }
  calcTotal();
}

function updateMatrixRow(idx, field, val) {
  if (!_sizeMatrix.rows[idx]) return;
  _sizeMatrix.rows[idx][field] = val;
}

function updateMatrixQty(idx, size, val) {
  if (!_sizeMatrix.rows[idx]) return;
  _sizeMatrix.rows[idx].quantities[size] = val;
  updateMatrixTotals();
}

// 轻量更新合计数值（不重建DOM，避免输入框失焦）
function updateMatrixTotals() {
  const sizes = _sizeMatrix.sizes;
  let totalQty = 0;
  _sizeMatrix.rows.forEach((row, idx) => {
    const sizeSum = sizes.reduce((sum, s) => sum + (parseInt(row.quantities[s]) || 0), 0);
    const cartons = parseInt(row.noOfCartons) || 0;
    const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
    totalQty += rowTotal;
    const subEl = document.getElementById(`rowSub-${idx}`);
    if (subEl) subEl.textContent = rowTotal;
  });
  // 列合计
  sizes.forEach((s, si) => {
    const colSum = _sizeMatrix.rows.reduce((sum, r) => {
      const qty = parseInt(r.quantities[s]) || 0;
      return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
    }, 0);
    const colEl = document.getElementById(`colTotal-${si}`);
    if (colEl) colEl.textContent = colSum;
  });
  // 总计
  const grandEl = document.getElementById('grandTotal');
  if (grandEl) grandEl.textContent = totalQty;
  const matrixTotalEl = document.getElementById('matrixTotal');
  if (matrixTotalEl) matrixTotalEl.textContent = totalQty;
  // 更新总数量和总箱数字段
  const qtyInput = document.getElementById('f_qtyInCartons');
  if (qtyInput) qtyInput.value = totalQty;
  const cartonsInput = document.getElementById('f_noOfCartons');
  if (cartonsInput) {
    const totalCartons = _sizeMatrix.rows.reduce((sum, r) => sum + (parseInt(r.noOfCartons) || 0), 0);
    cartonsInput.value = totalCartons;
  }
  calcTotal();
}

function addMatrixRow() {
  _sizeMatrix.rows.push({ packageId: '', assType: '', colorCode: '', colorName: '', noOfCartons: '', quantities: {} });
  renderSizeMatrix();
}

function removeMatrixRow(idx) {
  _sizeMatrix.rows.splice(idx, 1);
  renderSizeMatrix();
}

// 根据客户加载对应人员（Planner/Designer/P.Manager）
function loadCustomerPersonnel(customerId, existingOrder) {
  const plannerSel = document.getElementById('f_planner');
  const designerSel = document.getElementById('f_designer');
  const pManagerSel = document.getElementById('f_pManager');
  if (!plannerSel || !designerSel || !pManagerSel) return;

  const contacts = App.store.get('contacts', []);
  const customer = contacts.find(c => c.id === customerId);
  if (!customer) {
    [plannerSel, designerSel, pManagerSel].forEach(s => s.innerHTML = '<option value="">请选择</option>');
    return;
  }
  // 获取该客户公司下所有联系人记录（同名）
  const companyContacts = contacts.filter(c => c.name === customer.name && c.contactPerson);

  // 按职位关键词严格匹配（无匹配则返回空，不回退显示全部）
  const matchByKeywords = (keywords) => {
    return companyContacts.filter(c => {
      const pos = (c.position || '').toLowerCase();
      return keywords.some(kw => pos.includes(kw.toLowerCase()));
    });
  };

  const buildOptions = (contacts, selectedId) => {
    return '<option value="">请选择</option>' +
      contacts.map(c => `<option value="${c.id}" ${selectedId === c.id ? 'selected' : ''}>${App.utils.escapeHtml(c.contactPerson)}${c.position ? ' (' + App.utils.escapeHtml(c.position) + ')' : ''}</option>`).join('');
  };

  const ex = existingOrder || {};
  plannerSel.innerHTML = buildOptions(matchByKeywords(['planner', '计划']), ex.planner);
  designerSel.innerHTML = buildOptions(matchByKeywords(['design', '设计']), ex.designer);
  pManagerSel.innerHTML = buildOptions(matchByKeywords(['manager', '经理', '生产']), ex.pManager);
}

// 自动计算总金额
function calcTotal() {
  const qty = parseFloat(document.getElementById('f_qtyInCartons')?.value) || 0;
  const price = parseFloat(document.getElementById('f_unitPrice')?.value) || 0;
  const total = qty * price;
  const totalEl = document.getElementById('f_totalAmount');

// ===== 保存表单 =====
function saveForm(id) {
  const orderNo = document.getElementById('f_orderNo').value.trim();
  const styleNo = document.getElementById('f_styleNo').value.trim();
  const customerId = document.getElementById('f_customerId').value;
  const orderDate = document.getElementById('f_orderDate').value;
  const season = document.getElementById('f_season').value;
  const styleDescription = document.getElementById('f_styleDesc').value.trim();
  // 包装信息从尺码矩阵汇总（取各行非空值的唯一集合，逗号连接）
  const joinUnique = (field) => [...new Set(_sizeMatrix.rows.map(r => r[field]).filter(v => v))].join(', ');
  const packageId = joinUnique('packageId');
  const assType = joinUnique('assType');
  const colorCode = joinUnique('colorCode');
  const colorName = joinUnique('colorName');
  const noOfCartons = parseFloat(document.getElementById('f_noOfCartons').value) || 0;
  const quantity = parseFloat(document.getElementById('f_qtyInCartons').value) || 0;
  const shipMethod = document.getElementById('f_shipMethod').value;
  const etd = document.getElementById('f_etd').value;
  const planner = document.getElementById('f_planner').value;
  const designer = document.getElementById('f_designer').value;
  const pManager = document.getElementById('f_pManager').value;
  const remark = document.getElementById('f_remark').value.trim();

  // 表单验证
  if (!orderNo) { App.toast('请输入PO (订单号)', 'error'); return; }
  if (!styleNo) { App.toast('请输入Style No.', 'error'); return; }
  if (!customerId) { App.toast('请选择Customer (客户)', 'error'); return; }

  const orders = App.store.get('orders', []);

  // 价格字段：无权限用户看不到也改不了，保留原值
  const existingOrder = id ? orders.find(o => o.id === id) : null;
  const priceInputEl = document.getElementById('f_unitPrice');
  const unitPrice = priceInputEl ? (parseFloat(priceInputEl.value) || 0) : (existingOrder ? (existingOrder.unitPrice || 0) : 0);
  const totalAmount = quantity * unitPrice;

  const data = {
    orderNo, styleNo, customerId, orderDate, season, styleDescription,
    packageId, assType, colorCode, colorName,
    noOfCartons, quantity, unitPrice, totalAmount,
    shipMethod, etd, planner, designer, pManager,
    remark,
    sizeMatrix: JSON.parse(JSON.stringify(_sizeMatrix)),
  };

  if (id) {
    const idx = orders.findIndex(o => o.id === id);
    if (idx >= 0) orders[idx] = { ...orders[idx], ...data };
    App.toast('订单更新成功', 'success');
  } else {
    orders.push({ id: App.utils.genId('ORD'), status: '草稿', ...data });
    App.toast('订单创建成功', 'success');
  }

  App.store.set('orders', orders);
  App.modal.close();
  renderStats();
  renderTable();
}

// ===== 打印订单详情PDF =====
function printOrderPDF(id) {
  const orders = App.store.get('orders', []);
  const order = orders.find(o => o.id === id);
  if (!order) { App.toast('订单不存在', 'error'); return; }

  const seasonMap = { SS: '春夏', FW: '秋冬', AW: '秋冬', Holiday: '假日' };
  const shipMap = { Sea: '海运', Air: '空运', Express: '快递' };
  const customerName = getCustomerName(order.customerId);
  const plannerName = order.planner ? getContactPersonName(order.planner) : '-';
  const designerName = order.designer ? getContactPersonName(order.designer) : '-';
  const pManagerName = order.pManager ? getContactPersonName(order.pManager) : '-';
  const totalCartons = (order.noOfCartons && order.noOfCartons > 0) ? order.noOfCartons :
    (order.sizeMatrix ? order.sizeMatrix.rows.reduce((s,r)=>s+(parseInt(r.noOfCartons)||0),0) : 0);

  // 关联数据
  const styleNo = order.styleNo;
  const fabrics = App.store.get('fabrics', []).filter(f => f.styleNo === styleNo);
  const accessories = App.store.get('accessories', []).filter(a => a.styleNo === styleNo);
  const samples = App.store.get('samples', []).filter(s => s.styleNo === styleNo);
  const productions = App.store.get('productions', []).filter(p => p.styleNo === styleNo || p.orderNo === order.orderNo);

  const esc = App.utils.escapeHtml;
  const bgCA = '-webkit-print-color-adjust:exact;print-color-adjust:exact;';
  const thStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;background:#e8f1f5;text-align:left;' + bgCA;
  const tdStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;';
  const tcStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;text-align:center;';

  // 尺码矩阵HTML（SOLID不乘箱数，A/B/C/D乘箱数）
  let matrixHtml = '';
  if (order.sizeMatrix && order.sizeMatrix.sizes && order.sizeMatrix.sizes.length) {
    const sm = order.sizeMatrix;
    const sizeCols = sm.sizes.map(s => `<th style="${tcStyle}background:#e8f1f5;${bgCA}">${esc(s)}</th>`).join('');
    let rowsHtml = '';
    sm.rows.forEach(row => {
      const qtyCells = sm.sizes.map(s => {
        const val = row.quantities && row.quantities[s] ? row.quantities[s] : '-';
        return `<td style="${tcStyle}">${val}</td>`;
      }).join('');
      const sizeSum = sm.sizes.reduce((sum, s) => sum + (parseInt(row.quantities?.[s]) || 0), 0);
      const cartons = parseInt(row.noOfCartons) || 0;
      const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
      rowsHtml += `<tr>
        <td style="${tdStyle}">${esc(row.packageId || '-')}</td>
        <td style="${tcStyle}">${esc(row.assType || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorCode || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorName || '-')}</td>
        <td style="${tcStyle}">${row.noOfCartons || '-'}</td>
        ${qtyCells}
        <td style="${tcStyle}font-weight:600;">${rowTotal}</td>
      </tr>`;
    });
    const totalCells = sm.sizes.map(s => {
      const colSum = sm.rows.reduce((sum, r) => {
        const qty = parseInt(r.quantities?.[s]) || 0;
        return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
      }, 0);
      return `<td style="${tcStyle}font-weight:600;background:#f3f4f6;${bgCA}">${colSum}</td>`;
    }).join('');
    const grandTotal = sm.rows.reduce((sum, r) => {
      const sizeSum = sm.sizes.reduce((s, sz) => s + (parseInt(r.quantities?.[sz]) || 0), 0);
      const cartons = parseInt(r.noOfCartons) || 0;
      return sum + (r.assType === 'SOLID' ? sizeSum : sizeSum * cartons);
    }, 0);
    matrixHtml = `
      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;">
        <thead>
          <tr>
            <th style="${thStyle}">包装ID</th>
            <th style="${thStyle}">类型</th>
            <th style="${thStyle}">色号</th>
            <th style="${thStyle}">颜色</th>
            <th style="${thStyle}">箱数</th>
            ${sizeCols}
            <th style="${thStyle}">小计</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          <tr style="background:#f3f4f6;${bgCA}">
            <td colspan="5" style="${tdStyle}text-align:right;font-weight:600;">合计：</td>
            ${totalCells}
            <td style="${tcStyle}font-weight:700;">${grandTotal}</td>
          </tr>
        </tfoot>
      </table>`;
  }

  // 通用表格生成
  const buildTable = (columns, data) => {
    if (!data || data.length === 0) return '<div style="font-size:10px;color:#999;padding:4px;">暂无数据</div>';
    const heads = columns.map(c => `<th style="${thStyle}">${c.title}</th>`).join('');
    const rows = data.map(row => {
      const cells = columns.map(c => {
        let v = row[c.key];
        if (c.render) v = c.render(row[c.key], row);
        if (v === null || v === undefined || v === '') v = '-';
        return `<td style="${tdStyle}">${v}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;margin-bottom:10px;"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  };

  const samplesTable = buildTable([
    { key: 'stage', title: '阶段' },
    { key: 'round', title: '轮次' },
    { key: 'sampleDate', title: '日期' },
    { key: 'factory', title: '打样厂' },
    { key: 'size', title: '尺码' },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], samples);

  const fabricsTable = buildTable([
    { key: 'fabricName', title: '面料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'composition', title: '成分' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], fabrics);

  const accessoriesTable = buildTable([
    { key: 'accessoryName', title: '辅料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'spec', title: '规格' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], accessories);

  const productionsTable = buildTable([
    { key: 'factoryType', title: '工厂类型' },
    { key: 'factoryName', title: '工厂名称' },
    { key: 'startDate', title: '开始日期' },
    { key: 'expectedEnd', title: '预计完成' },
    { key: 'qtyPlanned', title: '计划数' },
    { key: 'qtyCompleted', title: '已完成' },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], productions);

  const printDate = App.utils.formatDate(new Date());
  const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单详情 - ${esc(order.orderNo)}</title>
<style>
  @page {
    size: A4;
    margin: 12mm 10mm 14mm 10mm;
    @bottom-left {
      content: "打印日期：${printDate}";
      font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
      font-size: 9px;
      color: #666;
      border-top: 1px solid #ddd;
      padding-top: 3mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @bottom-right {
      content: "第 " counter(page) " / " counter(pages) " 页";
      font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
      font-size: 9px;
      color: #666;
      border-top: 1px solid #ddd;
      padding-top: 3mm;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; color: #222; font-size: 11px; line-height: 1.4; }
  .doc-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #004D6D; padding-bottom: 6px; margin-bottom: 10px; }
  .doc-header .company { font-size: 18px; font-weight: 700; color: #004D6D; }
  .doc-header .company-en { font-size: 10px; color: #666; margin-top: 1px; }
  .doc-header .doc-title { text-align: right; }
  .doc-header .doc-title h2 { font-size: 14px; color: #004D6D; margin-bottom: 4px; }
  .doc-header .doc-title .kv { display: flex; justify-content: flex-end; gap: 2px; margin-top: 2px; font-size: 11px; }
  .doc-header .doc-title .kv .k { background: #d32f2f; color: #fff; padding: 2px 8px; font-weight: 600; border-radius: 3px 0 0 3px; white-space: nowrap; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc-header .doc-title .kv .v { background: #d32f2f; color: #fff; padding: 2px 8px; font-weight: 700; border-radius: 0 3px 3px 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .section-title { font-size: 11px; font-weight: 700; color: #004D6D; border-left: 3px solid #004D6D; padding-left: 5px; margin: 8px 0 4px; }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .info-table td { border: 1px solid #ccc; padding: 3px 6px; font-size: 10px; vertical-align: top; }
  .info-table .label { background: #f3f4f6; font-weight: 600; color: #555; white-space: nowrap; width: 90px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc-footer-screen { font-size: 9px; color: #666; display: flex; justify-content: space-between; margin-top: 14px; padding-top: 4mm; border-top: 1px solid #ddd; }

</head>
<body>
  <div class="doc-header">

    </div>

      <div class="kv"><span class="k">PO</span><span class="v">${esc(order.orderNo)}</span></div>

  <div class="section-title">订单信息</div>

    <tr>
      <td class="label">Date</td><td>${App.utils.formatDate(order.orderDate)}</td>

      <td class="label">Season</td><td>${esc(seasonMap[order.season] || order.season || '-')}</td>

    </tr>
    <tr>
      <td class="label">Style Desc</td><td colspan="7">${esc(order.styleDescription || '-')}</td>
    </tr>
  </table>

  ${matrixHtml ? `
  <div class="section-title">尺码数量分配</div>
  ${matrixHtml}
  ` : ''}

  <div class="section-title">价格与数量</div>
  <table class="info-table">

      <td class="label">No. of Cartons</td><td>${totalCartons}</td>
      <td class="label">Qty in Cartons</td><td>${(order.quantity || 0).toLocaleString()}</td>
      <td class="label">U/Prx</td><td>${App.canSeePrice() ? (order.unitPrice ? App.utils.formatMoney(order.unitPrice) : '-') : (order.unitPrice ? '*' : '-')}</td>
      <td class="label">TTL Amount</td><td style="font-weight:700;">${App.canSeePrice() ? (order.totalAmount ? App.utils.formatMoney(order.totalAmount) : '-') : (order.totalAmount ? '*' : '-')}</td>
    </tr>
  </table>

  <table class="info-table">

      <td class="label">Shp Method</td><td>${shipMap[order.shipMethod] || order.shipMethod || '-'}</td>

let currentOrderTab = 'orders';
let _sizeSheetSearch = '';

function switchOrderTab(tab) {
  currentOrderTab = tab;
  document.querySelectorAll('#orderTabs .tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.getElementById('ordersTab').style.display = tab === 'orders' ? '' : 'none';
  document.getElementById('materialsTab').style.display = tab === 'materials' ? '' : 'none';
  document.getElementById('sizesTab').style.display = tab === 'sizes' ? '' : 'none';

// 处理尺寸表Excel导入
function handleSizeImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';

  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '', header: 1, raw: false });

      if (rows.length < 2) {
        App.toast('文件格式错误，至少需要2行数据', 'error');
        return;
      }

      const sheets = getSizeSheets();
      let importCount = 0;
      let skipCount = 0;

      const { processed, skipped } = parseSizeSheetRows(rows);
      processed.forEach(sheet => {
        const existsIdx = sheets.findIndex(s => s.orderNo === sheet.orderNo && s.styleNo === sheet.styleNo && (s.sampleType || '大货') === (sheet.sampleType || '大货'));
        if (existsIdx >= 0) {
          sheets[existsIdx] = sheet;
        } else {
          sheets.push(sheet);
        }
        importCount++;
      });
      skipCount = skipped;

      saveSizeSheets(sheets);
      renderSizeSheets();

      let msg = `导入完成：成功 ${importCount} 份尺寸表`;
      if (skipCount > 0) msg += `，跳过 ${skipCount} 行（格式不匹配）`;
      App.toast(msg, 'success');
    } catch (err) {
      console.error('导入失败:', err);
      App.toast('导入失败，请检查文件格式', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Excel日期序列号转字符串
function formatExcelDate(val) {
  if (val === null || val === undefined || val === '') return '';
  // 已经是字符串日期（如 2026/7/3）
  if (typeof val === 'string') return val.trim();
  // Date对象（cellDates:true时）
  if (val instanceof Date) {
    const y = val.getFullYear();
    const m = val.getMonth() + 1;
    const d = val.getDate();
    return `${y}/${m}/${d}`;
  }
  // 数字序列号（如46243）
  if (typeof val === 'number') {
    const date = new Date(Math.round((val - 25569) * 86400 * 1000));
    const y = date.getUTCFullYear();
    const m = date.getUTCMonth() + 1;
    const d = date.getUTCDate();
    return `${y}/${m}/${d}`;
  }
  return String(val).trim();
}

// 解析尺寸表数据行
function parseSizeSheetRows(rows) {
  const result = { processed: [], skipped: 0 };
  if (rows.length < 2) return result;

  const headerRow = rows[0].map(h => String(h).trim());
  const headers = {
    po: headerRow.findIndex(h => h.includes('PO') || h.includes('po') || h === 'PO号'),
    styleNo: headerRow.findIndex(h => h.includes('款号') || h.includes('style') || h.toLowerCase().includes('style')),
    sampleType: headerRow.findIndex(h => h === '类型' || h === '样衣类型'),
    date: headerRow.findIndex(h => h === '日期' || h === 'date' || h.toLowerCase() === 'date'),
    code: headerRow.findIndex(h => h === '部位编号' || h === '部位'),
    en: headerRow.findIndex(h => h === '英文名称' || h === '英文'),
    cn: headerRow.findIndex(h => h === '中文名称' || h === '中文'),
    tolerance: headerRow.findIndex(h => h === '公差' || h === 'tolerance' || h.toLowerCase() === 'tolerance'),
  };

  if (headers.po === -1 || headers.styleNo === -1 || headers.code === -1) {
    result.skipped = rows.length - 1;
    return result;
  }

  const sizeStartIdx = Math.max(
    headers.en, headers.cn, headers.tolerance,
    headers.po, headers.styleNo, headers.date, headers.code,
    headers.sampleType
  ) + 1;

  const sizeCols = [];
  for (let i = sizeStartIdx; i < headerRow.length; i++) {
    if (headerRow[i]) sizeCols.push({ col: i, size: headerRow[i] });
  }

  const sheetMap = {};
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;

    const orderNo = headers.po >= 0 ? String(row[headers.po] || '').trim() : '';
    const styleNo = headers.styleNo >= 0 ? String(row[headers.styleNo] || '').trim() : '';
    const sampleType = headers.sampleType >= 0 ? String(row[headers.sampleType] || '').trim() : '';
    const date = headers.date >= 0 ? formatExcelDate(row[headers.date]) : '';
    const code = headers.code >= 0 ? String(row[headers.code] || '').trim() : '';
    const en = headers.en >= 0 ? String(row[headers.en] || '').trim() : '';
    const cn = headers.cn >= 0 ? String(row[headers.cn] || '').trim() : '';
    const tolerance = headers.tolerance >= 0 ? String(row[headers.tolerance] || '').trim() : '';

    if (!code) { result.skipped++; continue; }

    const key = `${orderNo}_${styleNo}_${sampleType}`;
    if (!sheetMap[key]) {
      sheetMap[key] = {
        id: App.utils.genId('SS'),
        orderNo, styleNo, sampleType: sampleType || '大货', date,
        sizes: sizeCols.map(sc => sc.size),
        rows: []
      };
    }

    const values = {};
    sizeCols.forEach(sc => {
      values[sc.size] = row[sc.col] !== undefined && row[sc.col] !== null ? String(row[sc.col]).trim() : '';
    });

    sheetMap[key].rows.push({ code, en, cn, tolerance, values });
  }

  result.processed = Object.values(sheetMap);
  return result;
}

// ===== 款式图标签页 =====
let _layoutFiles = [];      // 存储选择的文件夹中的图片文件
let _layoutFolderName = '';  // 文件夹名称
let _selectedLayoutFiles = new Set();  // 选中的图片文件名
let _layoutUrlMap = {};      // 文件名 -> objectURL 映射
const _layoutImageExts = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp'];

// 加载款式图文件夹
function loadLayoutFolder(event) {
  const files = event.target.files;
  if (!files || files.length === 0) return;

  _layoutFiles = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const name = f.name.toLowerCase();
    if (_layoutImageExts.some(ext => name.endsWith(ext))) {
      _layoutFiles.push(f);
    }
  }

  _layoutFolderName = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : '已选择文件夹';
  _selectedLayoutFiles.clear();
  _layoutUrlMap = {};
  document.getElementById('layoutFolderName').textContent = `📁 ${_layoutFolderName}（${_layoutFiles.length} 张图片）`;
  searchLayoutImages();
}

// 搜索款式图
function searchLayoutImages() {
  const container = document.getElementById('layoutContainer');
  const countEl = document.getElementById('layoutCount');
  const search = document.getElementById('layoutSearchInput').value.trim().toLowerCase();

  if (_layoutFiles.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:#999;">
        <div style="font-size:48px;margin-bottom:12px;">📂</div>
        <div style="margin-bottom:8px;">请先选择款式图文件夹</div>
        <div style="font-size:12px;color:#999;">点击"📁 选择文件夹"按钮，选择项目中的 layout 文件夹</div>
      </div>`;
    countEl.textContent = '';
    return;
  }

  if (!search) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:#999;">
        <div style="font-size:48px;margin-bottom:12px;">🔍</div>
        <div>请输入款号进行搜索（如 111057）</div>
      </div>`;
    countEl.textContent = `共 ${_layoutFiles.length} 张图片`;
    return;
  }

  // 精确匹配 + 部分匹配
  const exact = [];
  const partial = [];
  _layoutFiles.forEach(f => {
    const name = f.name.toLowerCase();
    // 去掉扩展名后的文件名
    const baseName = name.replace(/\.[^.]+$/, '');
    // 精确匹配：文件名完全等于搜索词，或以 搜索词- 开头
    if (baseName === search || baseName.startsWith(search + '-') || baseName.startsWith(search + '_')) {
      exact.push(f);
    } else if (baseName.includes(search)) {
      partial.push(f);
    }
  });

  const matched = [...exact, ...partial];
  const selCount = matched.filter(f => _selectedLayoutFiles.has(f.name)).length;
  countEl.textContent = `匹配 ${matched.length} 张 / 选中 ${selCount} 张 / 共 ${_layoutFiles.length} 张`;

  // 更新全选复选框状态
  const selectAllCb = document.getElementById('layoutSelectAll');
  if (selectAllCb) {
    selectAllCb.checked = matched.length > 0 && matched.every(f => _selectedLayoutFiles.has(f.name));
  }

  if (matched.length === 0) {
    container.innerHTML = `
      <div style="text-align:center;padding:40px;color:#999;">
        <div style="font-size:48px;margin-bottom:12px;">📷</div>
        <div>未找到包含"${search}"的款式图</div>
      </div>`;
    return;
  }

  container.innerHTML = matched.map(f => {
    const url = URL.createObjectURL(f);
    _layoutUrlMap[f.name] = url;
    const displayName = f.name.replace(/\.[^.]+$/, '');
    const checked = _selectedLayoutFiles.has(f.name);
    return `
      <div class="layout-card" style="display:inline-block;vertical-align:top;margin:8px;border:1px solid ${checked ? 'var(--primary)' : 'var(--border)'};border-radius:8px;overflow:hidden;background:#fff;width:240px;${checked ? 'box-shadow:0 0 0 2px var(--primary-light);' : ''}">
        <div style="position:relative;overflow:hidden;background:#f5f5f5;height:280px;display:flex;align-items:center;justify-content:center;">
          <img src="${url}" style="max-width:100%;max-height:100%;object-fit:contain;" onclick="previewLayoutImage('${url}', '${f.name}')" onerror="this.parentElement.innerHTML='<span style=\\'color:#ccc;\\'>图片加载失败</span>'">
          <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleLayoutSelect('${f.name}', this.checked)" style="position:absolute;top:6px;left:6px;width:18px;height:18px;cursor:pointer;">
        </div>
        <div style="padding:8px 10px;font-size:12px;border-top:1px solid var(--border-light);">
          <div style="font-weight:600;color:var(--primary);">${App.utils.escapeHtml(displayName)}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px;">${f.name}</div>
        </div>
      </div>`;
  }).join('');
}

// 切换图片选中
function toggleLayoutSelect(fileName, checked) {
  if (checked) {
    _selectedLayoutFiles.add(fileName);
  } else {
    _selectedLayoutFiles.delete(fileName);
  }
  // 更新工具栏计数
  const countEl = document.getElementById('layoutCount');
  const search = document.getElementById('layoutSearchInput').value.trim().toLowerCase();
  const matched = _layoutFiles.filter(f => {
    const baseName = f.name.toLowerCase().replace(/\.[^.]+$/, '');
    return baseName.includes(search);
  });
  const selCount = matched.filter(f => _selectedLayoutFiles.has(f.name)).length;
  countEl.textContent = `匹配 ${matched.length} 张 / 选中 ${selCount} 张 / 共 ${_layoutFiles.length} 张`;
}

// 全选/取消全选当前匹配的图片
function toggleLayoutSelectAll(checked) {
  const search = document.getElementById('layoutSearchInput').value.trim().toLowerCase();
  const matched = _layoutFiles.filter(f => {
    const baseName = f.name.toLowerCase().replace(/\.[^.]+$/, '');
    return baseName.includes(search);
  });
  if (checked) {
    matched.forEach(f => _selectedLayoutFiles.add(f.name));
  } else {
    matched.forEach(f => _selectedLayoutFiles.delete(f.name));
  }
  searchLayoutImages();
}

// 打印尺寸表为PDF
function printSizeSheet(id) {
  const sheet = getSizeSheets().find(s => s.id === id);
  if (!sheet) return;

  const sizes = sheet.sizes || [];

}

// 渲染订单下拉筛选
function renderMaterialOrderFilter() {
  const sel = document.getElementById('matOrderFilter');
  if (!sel) return;
  const orders = App.store.get('orders', []);
  const cur = sel.value;
  const opts = ['<option value="">全部订单</option>'];
  orders
    .slice()
    .sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || ''))
    .forEach(o => opts.push(`<option value="${o.orderNo}" ${o.orderNo === cur ? 'selected' : ''}>${o.orderNo}${o.styleNo ? ' · ' + o.styleNo : ''}</option>`));

// 获取筛选后的物料登记列表
function getFilteredMaterials() {
  const list = getOrderMaterials();
  const search = (document.getElementById('matSearchInput')?.value || '').trim().toLowerCase();
  const cat = document.getElementById('matCategoryFilter')?.value || '';
  const order = document.getElementById('matOrderFilter')?.value || '';

  return list.filter(m => {
    if (cat && m.category !== cat) return false;
    if (order && m.orderNo !== order) return false;
    if (search) {
      const str = [m.orderNo, m.styleNo, m.name, m.supplier, m.spec, m.remark, m.washMethod, m.usagePart].join(' ').toLowerCase();
      if (!str.includes(search)) return false;
    }
    return true;
  });
}

// 生成水洗单号（WS-XXXX）
function _matGenWashNo() {
  const washes = App.store.get('washes', []);
  let maxNum = 0;
  washes.forEach(w => {
    const m = w.washNo && w.washNo.match(/WS-(\d+)/);
    if (m) maxNum = Math.max(maxNum, parseInt(m[1]));
  });
  return `WS-${String(maxNum + 1).padStart(4, '0')}`;
}

// 生成面里衬 / 辅料编号：STIG + YYYYMM + 4位随机
function _matGenCode(prefix) {
  const d = new Date();
  const ym = d.getFullYear().toString() + String(d.getMonth() + 1).padStart(2, '0');
  const r = String(Math.floor(Math.random() * 9000) + 1000);
  return `${prefix || 'STIG'}${ym}${r}`;
}

// 类别切换时切换字段显示与供应商选项
function _matOnCategoryChange(val) {
  const cat = MAT_CATEGORIES._map[val] || MAT_CATEGORIES[0];
  const contacts = App.store.get('contacts', []);
  const list = getOrderMaterials();
  const m = _matEditingId ? (list.find(x => x.id === _matEditingId) || {}) : {};
  const fabricSuppliers = contacts.filter(c => c.type === '面里衬厂').map(c => `<option value="${App.utils.escapeHtml(c.name)}" ${m.supplier === c.name ? 'selected' : ''}>${c.name}</option>`).join('');
  const accessorySuppliers = contacts.filter(c => c.type === '辅料厂').map(c => `<option value="${App.utils.escapeHtml(c.name)}" ${m.supplier === c.name ? 'selected' : ''}>${c.name}</option>`).join('');
  const washFactories = contacts.filter(c => c.type === '水洗厂').map(c => `<option value="${App.utils.escapeHtml(c.name)}" ${m.supplier === c.name ? 'selected' : ''}>${c.name}</option>`).join('');

  const isFabric = cat.target === 'fabric';
  const isAccessory = cat.target === 'accessory';
  const isWash = cat.target === 'wash';

  const labelName = document.getElementById('label_name');
  const labelSupplier = document.getElementById('label_supplier');
  if (labelName) labelName.textContent = (isWash ? (document.getElementById('m_washCategory')?.value === '成衣水洗' ? '成衣名称' : '面料名称') : '名称') + '*';
  if (labelSupplier) labelSupplier.textContent = isWash ? '水洗厂' : (isAccessory ? '辅料供应商' : '面里衬厂');

  const wrapSupplier = document.getElementById('wrap_supplier');
  if (wrapSupplier) {
    const ph = isWash ? '选择水洗厂' : (isAccessory ? '选择辅料供应商' : '选择面里衬厂');
    const inner = isFabric ? fabricSuppliers : (isAccessory ? accessorySuppliers : washFactories);
    wrapSupplier.innerHTML = `<select class="form-select" id="m_supplier" style="width:100%;"><option value="">${ph}</option>${inner}</select>`;
  }

  const show = (id, bool) => { const el = document.getElementById(id); if (el) el.style.display = bool ? '' : 'none'; };
  show('group_usagePart', !isWash);
  show('group_spec', !isWash);
  show('group_color', !isWash);
  show('group_composition', isFabric);
  show('group_washMethod', isWash);
  show('group_washCategory', isWash);
  show('group_qty', !isWash);
  show('group_unit', !isWash);
  show('group_price', !isWash);
  show('group_shipFactory', !isWash);
  show('group_date1', true);
  show('group_date2', !isWash);
  show('group_date3', !isWash);
  show('group_shipDate', !isWash);

  // 如果类别切换到水洗，把主日期字段标签改为"水洗日期"
  const d1 = document.getElementById('m_date1');
  if (d1) {
    const lbl = d1.previousElementSibling;
    if (lbl && lbl.classList.contains('form-label')) lbl.textContent = isWash ? '水洗日期' : (isFabric ? '寄样日期' : '寄样日期');
  }

  // 切换水洗类型时同步名称标签
  const wc = document.getElementById('m_washCategory');
  if (wc) {
    wc.onchange = () => {
      const lblName = document.getElementById('label_name');
      if (lblName) lblName.textContent = (wc.value === '成衣水洗' ? '成衣名称' : '面料名称') + '*';
    };
  }
}

// 保存物料登记并自动同步到对应模块
function saveMaterial() {
  const category = document.getElementById('m_category').value;
  const cat = MAT_CATEGORIES._map[category];
  const orderNo = document.getElementById('m_orderNo').value.trim();
  const styleNo = document.getElementById('m_styleNo').value.trim();
  const name = document.getElementById('m_name').value.trim();
  if (!category || !name) { App.toast('请填写类别和名称', 'warning'); return; }

  const data = {
    orderNo,
    styleNo,
    category,
    name,
    usagePart: document.getElementById('m_usagePart').value.trim(),
    supplier: document.getElementById('m_supplier').value,
    spec: document.getElementById('m_spec').value.trim(),
    color: document.getElementById('m_color').value.trim(),
    fabricComposition: document.getElementById('m_composition').value.trim(),
    washMethod: document.getElementById('m_washMethod')?.value?.trim() || '',
    washCategory: document.getElementById('m_washCategory')?.value || '面料水洗',
    qtyOrdered: Number(document.getElementById('m_qty').value) || 0,
    unit: document.getElementById('m_unit').value,
    unitPrice: Number(document.getElementById('m_price').value) || 0,
    shipFactory: document.getElementById('m_shipFactory').value,
    date: document.getElementById('m_date1').value,
    contractDate: document.getElementById('m_date2').value,
    confirmedDate: document.getElementById('m_date3').value,
    shipDate: document.getElementById('m_shipDate').value,
    arrivalDate: document.getElementById('m_arrivalDate').value,
    remark: document.getElementById('m_remark').value.trim(),
    updateDate: App.utils.today(),
  };

  const list = getOrderMaterials();
  let syncedTargetId = null;
  if (_matEditingId) {
    const idx = list.findIndex(x => x.id === _matEditingId);
    if (idx !== -1) {
      syncedTargetId = list[idx].syncedTargetId || null;
      list[idx] = { ...list[idx], ...data, syncedToModule: false };
    }
  } else {
    data.id = App.utils.genId('OM');
    data.createDate = App.utils.today();
    data.syncedToModule = false;
    list.push(data);
  }

  // 先保存登记
  saveOrderMaterials(list);

  // 同步到对应模块
  try {
    const targetInfo = syncOneMaterialToModules({ ...data, syncedTargetId }, true);
    // 回写同步状态和目标ID
    const idx = list.findIndex(x => x.id === data.id || x.id === _matEditingId);
    if (idx !== -1 && targetInfo) {
      list[idx].syncedToModule = true;
      list[idx].syncedTargetId = targetInfo.id;
      list[idx].syncedTargetTable = targetInfo.table;
      saveOrderMaterials(list);
    }
    App.toast('已保存并同步到' + (cat.target === 'fabric' ? '面里衬管理' : cat.target === 'accessory' ? '辅料管理' : '水洗管理'), 'success');
  } catch (e) {
    console.error(e);
    App.toast('保存成功，但同步失败：' + (e.message || e), 'error');
  }

  App.modal.close();
  renderMaterials();
}

// 单条同步（从列表按钮触发）
function syncOneMaterial(id) {
  const list = getOrderMaterials();
  const idx = list.findIndex(x => x.id === id);
  if (idx === -1) return;
  const m = list[idx];
  try {
    const info = syncOneMaterialToModules(m, true);
    if (info) {
      list[idx].syncedToModule = true;
      list[idx].syncedTargetId = info.id;
      list[idx].syncedTargetTable = info.table;
      saveOrderMaterials(list);
      App.toast('同步成功 → ' + (info.table === 'fabrics' ? '面里衬管理' : info.table === 'accessories' ? '辅料管理' : '水洗管理'), 'success');
      renderMaterials();
    }
  } catch (e) {
    console.error(e);
    App.toast('同步失败：' + (e.message || e), 'error');
  }
}

// 批量同步所有未同步的数据
function syncMaterialsToModules() {
  const list = getOrderMaterials();
  let updated = 0;
  list.forEach((m, idx) => {
    try {
      const info = syncOneMaterialToModules(m, false);
      if (info) {
        list[idx].syncedToModule = true;
        list[idx].syncedTargetId = info.id;
        list[idx].syncedTargetTable = info.table;
        updated++;
      }
    } catch (e) {
      console.error('同步失败:', m.id, e);
    }
  });
  saveOrderMaterials(list);
  App.toast(`已同步 ${updated} 条记录到各模块`, updated ? 'success' : 'info');
  renderMaterials();
}

// 核心：将一条物料登记记录同步到 fabric / accessory / wash 模块
// 若记录已带 syncedTargetId，则更新该条，否则新增
// forceDuplicate=false 时若已存在 styleNo+name+category 的相同记录，则跳过，返回 { id, table }
function syncOneMaterialToModules(m, forceDuplicate = false) {
  const cat = MAT_CATEGORIES._map[m.category];
  if (!cat) throw new Error('未知类别');

  const today = App.utils.today();

  if (cat.target === 'fabric') {
    const fabrics = App.store.get('fabrics', []);
    const sampleSentDate = m.date || '';
    const base = {
      styleNo: m.styleNo || '',
      fabricType: cat.fabricType || m.category,
      fabricName: m.name,
      usagePart: m.usagePart || '',
      supplier: m.supplier || '',
      composition: m.fabricComposition || '',
      color: m.color || '',
      colorCard: '',
      weightGsm: 0,
      width: '',
      sampleRounds: 1,
      sampleSentDate,
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
      contractNo: '',
      contractDate: m.contractDate || '',
      unitPrice: m.unitPrice || 0,
      qtyOrdered: m.qtyOrdered || 0,
      unit: m.unit || '米',
      shipFactory: m.shipFactory || '',
      shipDate: m.shipDate || '',
      arrivalDate: m.arrivalDate || '',
      remark: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
    };

    // 根据日期自动推进状态
    let status = '待打样';
    const STATUS_FLOW = ['待打样', '寄样中', '已确认', '采购合同', '发货中', '已到货'];
    if (base.arrivalDate) status = '已到货';
    else if (base.shipDate) status = '发货中';
    else if (base.contractDate) status = '采购合同';
    else if (base.confirmedDate) status = '已确认';
    else if (base.sampleSentDate) status = '寄样中';
    base.status = status;

    // 编号：有则保留，无则生成
    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = fabrics.findIndex(f => f.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = fabrics.findIndex(f =>
        (f.styleNo || '') === (m.styleNo || '') &&
        (f.fabricName || '') === (m.name || '') &&
        (f.fabricType || '') === (cat.fabricType || m.category)
      );
    }

    if (targetIdx !== -1) {
      const f = fabrics[targetIdx];
      fabrics[targetIdx] = { ...f, ...base, fabricCode: f.fabricCode || _matGenCode('STIG'), id: f.id };
    } else {
      base.id = App.utils.genId('F');
      base.fabricCode = _matGenCode('STIG');
      fabrics.push(base);
    }
    App.store.set('fabrics', fabrics);
    return { id: base.id || fabrics[targetIdx].id, table: 'fabrics' };
  }

  if (cat.target === 'accessory') {
    const accessories = App.store.get('accessories', []);
    const sampleSentDate = m.date || '';
    const base = {
      styleNo: m.styleNo || '',
      accessoryName: m.name,
      usagePart: m.usagePart || '',
      supplier: m.supplier || '',
      spec: m.spec || '',
      color: m.color || '',
      sampleRounds: 1,
      sampleSentDate,
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
      contractNo: '',
      contractDate: m.contractDate || '',
      unitPrice: m.unitPrice || 0,
      qtyOrdered: m.qtyOrdered || 0,
      unit: m.unit || '个',
      shipFactory: m.shipFactory || '',
      shipDate: m.shipDate || '',
      arrivalDate: m.arrivalDate || '',
      remark: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
    };

    let status = '待打样';
    const STATUS_FLOW = ['待打样', '寄样中', '已确认', '采购合同', '发货中', '已到货'];
    if (base.arrivalDate) status = '已到货';
    else if (base.shipDate) status = '发货中';
    else if (base.contractDate) status = '采购合同';
    else if (base.confirmedDate) status = '已确认';
    else if (base.sampleSentDate) status = '寄样中';
    base.status = status;

    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = accessories.findIndex(a => a.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = accessories.findIndex(a =>
        (a.styleNo || '') === (m.styleNo || '') &&
        (a.accessoryName || '') === (m.name || '') &&
        (a.color || '') === (m.color || '')
      );
    }

    if (targetIdx !== -1) {
      const a = accessories[targetIdx];
      accessories[targetIdx] = { ...a, ...base, accessoryCode: a.accessoryCode || _matGenCode('STIG'), id: a.id };
    } else {
      base.id = App.utils.genId('A');
      base.accessoryCode = _matGenCode('STIG');
      accessories.push(base);
    }
    App.store.set('accessories', accessories);
    return { id: base.id || accessories[targetIdx].id, table: 'accessories' };
  }

  if (cat.target === 'wash') {
    const washes = App.store.get('washes', []);
    const washCategory = m.washCategory || '面料水洗';
    const washDate = m.date || today;
    const factory = m.supplier || '';
    const rounds = [{
      round: 1,
      washDate,
      factory,
      washResult: m.washMethod || '',
      status: '寄样中',
      customerFeedback: '',
      confirmedDate: m.confirmedDate || '',
    }];
    const base = {
      washNo: '',
      washCategory,
      styleNo: m.styleNo || '',
      itemName: m.name,
      washMethod: m.washMethod || '',
      targetColor: m.color || '',
      techNotes: (m.remark ? m.remark + '  ' : '') + (m.orderNo ? '[PO: ' + m.orderNo + ']' : ''),
      factory,
      rounds,
      status: '寄样中',
      remark: m.orderNo ? ('[PO: ' + m.orderNo + ']') : '',
      createDate: today,
    };
    // 已确认就推进状态
    if (m.confirmedDate) base.status = '已确认';

    let targetIdx = -1;
    if (m.syncedTargetId) targetIdx = washes.findIndex(w => w.id === m.syncedTargetId);
    if (targetIdx === -1 && !forceDuplicate) {
      targetIdx = washes.findIndex(w =>
        (w.styleNo || '') === (m.styleNo || '') &&
        (w.itemName || '') === (m.name || '') &&
        (w.washCategory || '') === washCategory
      );
    }

    if (targetIdx !== -1) {
      const w = washes[targetIdx];
      // 已有水洗记录：追加一轮
      const existingRounds = w.rounds && w.rounds.length ? w.rounds.slice() : [];
      const nextRound = existingRounds.length + 1;
      existingRounds.push({ ...rounds[0], round: nextRound, status: m.confirmedDate ? '已确认' : '寄样中', confirmedDate: m.confirmedDate || '' });
      washes[targetIdx] = {
        ...w,
        washMethod: base.washMethod || w.washMethod,
        targetColor: base.targetColor || w.targetColor,
        techNotes: base.techNotes || w.techNotes,
        factory: base.factory || w.factory,
        rounds: existingRounds,
        status: m.confirmedDate ? '已确认' : w.status,
      };
    } else {
      base.id = App.utils.genId('WS');
      base.washNo = _matGenWashNo();
      washes.push(base);
    }
    App.store.set('washes', washes);
    return { id: base.id || washes[targetIdx].id, table: 'washes' };
  }

  throw new Error('未知目标模块');
}

// 删除物料登记
function deleteMaterial(id) {
  App.confirm('删除这条物料登记记录？（不会删除已同步到各模块的数据）', () => {
    const list = getOrderMaterials().filter(x => x.id !== id);
    saveOrderMaterials(list);
    App.toast('已删除', 'success');
    renderMaterials();
  });
}

renderStats();
renderCustomerFilter();
renderTable();

_sizeSheetSearch = '';
