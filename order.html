<div class="app-layout">

<script>
// ===== 云端同步：提前注册监听器 =====
var PageDataSyncGuard = {
  inited: false, pending: false,
  watchKeys: ["orders", "contacts"],
  emptyCheckKeys: ["orders"],
  afterInit: function() {
    var self = this; this.inited = true;
    function doRefresh() { try { if (typeof window.renderAll === 'function') window.renderAll(); } catch(e) {} }
    if (self.pending) setTimeout(doRefresh, 200);
    setTimeout(function() {
      var allEmpty = self.emptyCheckKeys.every(function(k){
        try{ var a=App.store.get(k,[]); return !a||a.length===0; }catch(e){return true;}
      });
      if (allEmpty) doRefresh();
    }, 2000);
  }
};
window.addEventListener('cloud-data-updated', function(e){
  var keys = (e.detail&&e.detail.keys)||[];
  var need = keys.some(function(k){ return PageDataSyncGuard.watchKeys.indexOf(k)>=0; });
  if (need) {
    if (!PageDataSyncGuard.inited) { PageDataSyncGuard.pending=true; return; }
    try { if (typeof window.renderAll==='function') window.renderAll(); } catch(e){}
  }
});

window.renderAll = function() { try { renderStats(); renderCustomerFilter(); renderTable(); } catch(e) {} };

App.init('order');
App.checkLogin();
App.initSampleData();
App.enforcePagePermission('order');
  setTimeout(function() { if (window.PageDataSyncGuard) window.PageDataSyncGuard.afterInit(); }, 0);

// ===== 诊断：检测 Supabase Storage 可用性 & 订单款号 3011043 真实路径 =====
setTimeout(async function() {
  var bucket = window.STORAGE_BUCKET || 'app-photos';
  console.log('%c[order] Supabase 诊断:', 'background:#f3f4f6;padding:2px 6px;border-radius:4px;font-weight:bold;');
  console.log('  SUPABASE_URL:', window.SUPABASE_URL);
  console.log('  STORAGE_BUCKET:', bucket);
  console.log('  SUPABASE_ANON_KEY:', window.SUPABASE_ANON_KEY ? '(已设置)' : '(未设置)');
  console.log('  window.supabase:', !!window.supabase);
  console.log('  window.SupabaseSubmit:', !!window.SupabaseSubmit);
  console.log('  window.SupabaseStore:', !!window.SupabaseStore, '_isInitialized:',
    window.SupabaseStore && window.SupabaseStore._isInitialized ? window.SupabaseStore._isInitialized() : 'N/A');

  // 先把订单记录的真实 styleNo + 自带 styleImg_path 打印出来（最准）
  try {
    var orders = (App && App.store && typeof App.store.get === 'function') ? (App.store.get('orders') || []) : [];
    console.log('[order] 订单数=' + orders.length,
      orders.map(function(o){ return {id:o.id, styleNo:o.styleNo||'', styleImg_path:o.styleImg_path||'', fullImg_path:o.fullImg_path||''}; }));
  } catch(_) {}

  // 共享 styleImages 缓存（styleImages key 存在 localStorage / Supabase 里）
  try {
    var ls = window._origLocalStorage || window.localStorage;
    var raw = ls.getItem('styleImages');
    var cacheDump = raw ? JSON.parse(raw) : null;
    console.log('[order] styleImages(共享缓存) 条目数=' + (cacheDump ? Object.keys(cacheDump).length : 0), cacheDump || {});
    if (cacheDump) {
      Object.keys(cacheDump).forEach(function(k){
        if (!k) return;
        var item = cacheDump[k] || {};
        console.log('   · 款号=' + k + '  styleImg=' + (item.styleImg_path||'') + '  fullImg=' + (item.fullImg_path||''));
      });
    }
  } catch(_e) { console.warn('[order] 打印 styleImages 缓存失败:', _e && _e.message ? _e.message : _e); }

  // 原生 Storage.list 探测 order/ 前缀 + 桶根 + 订单里第一个款号的文件夹
  if (window.supabase && window.supabase.storage) {
    var listAndLog = function(prefix, label) {
      window.supabase.storage.from(bucket).list(prefix || '', { limit: 20 }).then(function(res) {
        if (res.error) {
          console.error('[order] Storage list(' + label + ') 失败:', res.error.message,
            '→ 请确认 patch_rls_shared_mode.sql 已经在 SQL Editor 执行过（放开 storage.objects SELECT 给 authenticated）');
        } else {
          var data = res.data || [];
          console.log('[order] Storage ' + label + ' 文件数=' + data.length + '  (前12项):',
            data.slice(0, 12).map(function(f){ return (f.type === 'folder' ? '[DIR] ' : '[FILE] ') + f.name; }));
        }
      }).catch(function(err) {
        console.error('[order] Storage ' + label + ' 异常:', err && err.message);
      });
    };
    listAndLog('order', 'order/ 子目录');
    listAndLog('', '桶根目录');

    // 用订单里第一个 styleNo 直接探测款号文件夹
    try {
      var orders2 = (App && App.store) ? (App.store.get('orders') || []) : [];
      for (var oi = 0; oi < orders2.length; oi++) {
        var sn = (orders2[oi].styleNo || '').trim();
        if (!sn) continue;
        listAndLog(sn, '款号文件夹="' + sn + '/"');
        listAndLog(sn.toLowerCase(), '款号文件夹(lower)="' + sn.toLowerCase() + '/"');
        listAndLog(sn.toUpperCase(), '款号文件夹(upper)="' + sn.toUpperCase() + '/"');
        break;
      }
    } catch(_e2) {}
  }

  // 再多一条：直接用 fetch + Authorization 调 Storage REST list（绕开 supabase-js，排查是不是 client 库问题）
  try {
    var sbUrl = (window.SUPABASE_URL || '').replace(/\/$/, '');
    var anon = window.SUPABASE_ANON_KEY || '';
    if (sbUrl && anon) {
      var userTok = null;
      try {
        if (window.supabase && window.supabase.auth && typeof window.supabase.auth.getSession === 'function') {
          var _sd = await window.supabase.auth.getSession();
          if (_sd && _sd.data && _sd.data.session && _sd.data.session.access_token) userTok = _sd.data.session.access_token;
        }
      } catch(_ee) {}
      var auth = 'Bearer ' + (userTok || anon);
      var lr = await fetch(sbUrl + '/storage/v1/object/list/' + encodeURIComponent(bucket), {
        method: 'POST', cache: 'no-store',
        headers: { 'apikey': anon, 'Authorization': auth, 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefix: '', limit: 30 })
      });
      console.log('[order] REST list 桶根: HTTP ' + lr.status + '  (带JWT=' + !!userTok + '). ' +
        (lr.ok ? '✅ RLS SELECT 已开（LIST 通了）' : '❌ RLS SELECT 仍然拒绝 → 需要执行 patch_rls_shared_mode.sql 第二块'));
      if (lr.ok) {
        var lj = await lr.json();
        if (Array.isArray(lj)) {
          console.log('[order] REST list 桶根前 20 项:',
            lj.slice(0, 20).map(function(e){ return (e.type === 'folder' ? '[DIR] ' : '[FILE] ') + e.name; }));
        }
      }
    }
  } catch(_restE) {
    console.warn('[order] REST list 探测异常:', _restE && _restE.message ? _restE.message : _restE);
  }
}, 2000);

/**
 * 手动强制云端同步：
 * 1) 先触发一次 refreshFromCloud / independentPoll（拉取其它电脑写入的数据）
 * 2) 再触发 runAutoBackup（把本地所有 key 写回云端，防止本地数据有漏网的）
 * 3) 完成后重新渲染整页
 */
window.forceSyncCloud = function forceSyncCloud() {
  if (App && App.toast) App.toast('☁️ 正在同步云端…（最多 10 秒）', 'info', 4000);
  console.log('[forceSyncCloud] 开始执行手动云同步...');
  var stepsDone = 0;
  var totalSteps = 4;
  function next() {
    stepsDone++;
    if (stepsDone >= totalSteps) {
      try { if (typeof window.renderAll === 'function') window.renderAll(); } catch(_) {}
      try { if (App && App.toast) App.toast('✅ 同步完成，列表已刷新', 'success', 2000); } catch(_) {}
      console.log('[forceSyncCloud] 同步完成');
    }
  }

  // Step 1: SupabaseStore.refreshFromCloud
  try {
    var store = window.SupabaseStore;
    if (store) {
      var fn = store.forceRefreshFromCloud || store.refreshFromCloud || store.refreshViaREST;
      if (fn) {
        Promise.resolve(fn.call(store)).then(function(){ next(); }).catch(function(){ next(); });
      } else next();
    } else next();
  } catch(_e) { next(); }

  // Step 2: independentPoll（独立 REST 兜底轮询，即使 store 不可用也生效）
  try {
    if (typeof window.independentPoll === 'function') {
      Promise.resolve(window.independentPoll()).then(function(){ next(); }).catch(function(){ next(); });
    } else next();
  } catch(_) { next(); }

  // Step 3: runAutoBackup（把本地 key 强制重新走 cloud-write-request 上传）
  setTimeout(function(){
    try {
      var ALL_KEYS = [
        'styles', 'orders', 'fabrics', 'accessories', 'samples',
        'feedbacks', 'productions', 'invoices', 'payments', 'collections',
        'consumptions', 'consumption_categories',
        'contacts', 'customers', 'suppliers', 'favoriteContacts',
        'washes', 'shippings', 'users', 'permissions',
        'maintFabrics', 'maintAccessories',
        'express_delivery_data_v2', 'pl_records_v1', 'pl_draft_v1',
        'sht_sample_data_v2', 'sht_size_tables_v2', 'sizeSheets', 'styleImages'
      ];
      var origLS = window._origLocalStorage || window.localStorage;
      var needBackup = 0;
      ALL_KEYS.forEach(function(k){
        try {
          var raw = origLS.getItem(k);
          if (raw && raw !== '[]' && raw !== 'null') {
            window.dispatchEvent(new CustomEvent('cloud-write-request', {
              detail: { key: k, value: JSON.parse(raw), ts: Date.now(), force: 1 }
            }));
            needBackup++;
          }
        } catch(_e) {}
      });
      console.log('[forceSyncCloud] 本地备份入队 ' + needBackup + ' 个键');
    } finally { next(); }
  }, 800);

  // Step 4: 最后再等 independent write queue 有时间刷新一次 + 重渲染
  setTimeout(function(){
    try { if (typeof window.renderAll === 'function') window.renderAll(); } catch(_) {}
    next();
  }, 2000);
};

// ===== 工具函数 =====

// 根据联系人ID获取客户公司名
function getCustomerName(customerId) {
  const contacts = App.store.get('contacts', []);
  const c = contacts.find(c => c.id === customerId);
  return c ? c.name : customerId || '-';
}

// 根据联系人ID获取联系人姓名（用于planner/designer/pManager）
function getContactPersonName(contactId) {
  const contacts = App.store.get('contacts', []);
  const c = contacts.find(c => c.id === contactId);
  if (!c) return contactId || '-';
  return c.contactPerson || c.name || contactId;
}

// 自动生成订单号 ORD-2026-XXXX
function genOrderNo() {
  const orders = App.store.get('orders', []);
  const year = new Date().getFullYear();
  let maxNum = 0;
  orders.forEach(o => {
    const match = o.orderNo && o.orderNo.match(/ORD-\d{4}-(\d{4})/);
    if (match) {
      const num = parseInt(match[1]);
      if (num > maxNum) maxNum = num;
    }
  });
  const nextNum = String(maxNum + 1).padStart(4, '0');
  return `ORD-${year}-${nextNum}`;
}

// ===== 统计卡片 =====
function renderStats() {
  const orders = App.store.get('orders', []);
  const total = orders.length;
  const inProduction = orders.filter(o => o.status === '生产中').length;
  const pending = orders.filter(o => o.status === '待排产').length;
  const shipped = orders.filter(o => o.status === '已发货').length;

  const cards = [
    { icon: '📋', bg: '#e8f1f5', color: '#004D6D', label: '订单总数', value: total, sub: '全部订单' },
    { icon: '🏭', bg: '#fff8ed', color: '#d9883a', label: '生产中', value: inProduction, sub: '正在生产' },
    { icon: '⏳', bg: '#f9fafb', color: '#6b7280', label: '待排产', value: pending, sub: '等待排产' },
    { icon: '🚚', bg: '#ecfdfa', color: '#0d9488', label: '已发货', value: shipped, sub: '已发出' },
  ];

  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg};color:${c.color};">${c.icon}</div>
      <div class="stat-info">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value" style="color:${c.color};">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    </div>
  `).join('');
}

// ===== 客户筛选下拉 =====
function renderCustomerFilter() {
  const customers = App.store.get('contacts', []).filter(c => c.type === '客户');
  const filter = document.getElementById('customerFilter');
  const currentVal = filter.value;
  filter.innerHTML = '<option value="">全部客户</option>' +
    customers.map(c => `<option value="${c.id}">${App.utils.escapeHtml(c.name)}</option>`).join('');
  filter.value = currentVal;
}

// ===== 获取筛选后数据 =====
function getFilteredOrders() {
  const orders = App.store.get('orders', []);
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const customer = document.getElementById('customerFilter').value;

  const filtered = orders.filter(o => {
    // 搜索条件：订单号或款号
    if (search) {
      const orderNo = (o.orderNo || '').toLowerCase();
      const styleNo = (o.styleNo || '').toLowerCase();
      if (!orderNo.includes(search) && !styleNo.includes(search)) return false;
    }
    // 状态筛选
    if (status && o.status !== status) return false;
    // 客户筛选
    if (customer && o.customerId !== customer) return false;
    return true;
  });
  // 按订单日期倒序（空值排末尾）
  return App.utils.sortByDateDesc(filtered, ['orderDate', 'etd']);
}

// ===== OrderImg forward 存根（解决 renderTable 先于 const OrderImg 执行导致水合全丢的竞态） =====
// 页面 <script> 里 renderTable() 在 L460，const OrderImg = {...} 才在 L993，差了 530 行。
// 这里把 window.OrderImg 先挂上 stubs：
//   · 存根内立刻做能做的（用 StyleImgCache 直接 resolve Img src、用 getStyleImagesForStyleNo backfill）
//   · 做不了的（openRowFullscreen / navTableRow 等）塞 _orderImgPendingQueue，等真 OrderImg 注册后 flush。
(function(){
  if (window.OrderImg) return;
  var pendingQueue = [];
  function fireWhenReady() {
    // 真 OrderImg 注册之后调用
    var real = window.__OrderImgReal;
    if (!real) return;
    while (pendingQueue.length) {
      var item = pendingQueue.shift();
      try {
        if (item.type === 'hydrate' && typeof real.hydrateTableImages === 'function') real.hydrateTableImages();
        else if (item.type === 'backfill' && typeof real.backfillTableImages === 'function') real.backfillTableImages();
        else if (item.type === 'openRow' && typeof real.openRowFullscreen === 'function') real.openRowFullscreen(item.id);
        else if (item.type === 'openRowByStyleNo' && typeof real.openRowFullscreenByStyleNo === 'function') real.openRowFullscreenByStyleNo(item.id, item.styleNo);
        else if (item.type === 'nav' && typeof real.navTableRow === 'function') real.navTableRow(item.ev, item.id, item.dir);
      } catch(e) { console.warn('[OrderImg.stub] flush pending 抛异常:', item.type, e && e.message ? e.message : e); }
    }
  }

  // hydrate 内联：直接给 <img data-order-img="orderId"> 的 src 赋值（等价 OrderImg.hydrateTableImages）
  function stubHydrate() {
    var list = document.querySelectorAll('img[data-order-img]');
    list.forEach(function(img){
      try {
        var orderId = img.getAttribute('data-order-img');
        var orders = (App && App.store && typeof App.store.get === 'function') ? (App.store.get('orders') || []) : [];
        var order = orders.find(function(o){ return o.id === orderId; });
        if (!order) return;
        var idx = parseInt(order._thumbIdx || '0', 10);
        var p = (idx === 1 && order.fullImg_path) ? order.fullImg_path : (order.styleImg_path || order.fullImg_path);
        if (!p || p.startsWith('data:image')) {
          if (p) img.src = p;
          return;
        }
        (async function(){
          var src = window.resolveImageUrl ? (await resolveImageUrl(p)) : null;
          if (src) img.src = src;
          else if (window.OrderImg && typeof window.OrderImg._directUrl === 'function') img.src = window.OrderImg._directUrl(p);
        })();
      } catch(_) {}
    });
  }

  // backfill 内联：给 <img data-order-img-backfill> 按款号找图并填 src（等价 OrderImg.backfillTableImages）
  async function stubBackfill() {
    if (!window.getStyleImagesForStyleNo) return;
    var nodes = document.querySelectorAll('img[data-order-img-backfill]');
    if (nodes.length === 0) return;
    var groups = {};
    nodes.forEach(function(img){
      var sn = (img.getAttribute('data-style-no') || '').trim();
      if (sn) (groups[sn] = groups[sn] || []).push(img);
    });
    var sns = Object.keys(groups);
    for (var i = 0; i < sns.length; i++) {
      var sn = sns[i];
      var items = groups[sn];
      try {
        var r = await getStyleImagesForStyleNo(sn);
        if (!r) {
          items.forEach(function(img){
            var cell = img.parentElement;
            if (cell) {
              var sp = cell.querySelector('span');
              if (sp) sp.textContent = '无';
            }
          });
          continue;
        }
        var signed = r.styleImg_signed || null;
        if (!signed && r.styleImg_path && window.resolveImageUrl) signed = await resolveImageUrl(r.styleImg_path, { hintStyleNo: sn });
        if (!signed && r.fullImg_path && window.resolveImageUrl)  signed = await resolveImageUrl(r.fullImg_path,  { hintStyleNo: sn });
        items.forEach(function(img){
          var cell = img.parentElement;
          if (signed) {
            img.src = signed;
            img.style.display = 'block';
            if (cell) {
              var sp = cell.querySelector('span');
              if (sp) sp.style.display = 'none';
            }
          } else {
            if (cell) {
              var sp2 = cell.querySelector('span');
              if (sp2) sp2.textContent = '无';
            }
          }
        });
      } catch(e) { console.warn('[OrderImg.stubBackfill] 款号=' + sn + ' 抛异常:', e && e.message ? e.message : e); }
    }
  }

  window.OrderImg = {
    __stub: true,
    hydrateTableImages: function(){ try { stubHydrate(); } catch(e){ console.warn(e && e.message); } if (!window.__OrderImgReal) pendingQueue.push({type:'hydrate'}); else fireWhenReady(); },
    backfillTableImages: function(){ try { stubBackfill(); } catch(e){ console.warn(e && e.message); } if (!window.__OrderImgReal) pendingQueue.push({type:'backfill'}); else fireWhenReady(); },
    openRowFullscreen: function(id){ pendingQueue.push({type:'openRow', id: id}); },
    openRowFullscreenByStyleNo: function(id, styleNo){ pendingQueue.push({type:'openRowByStyleNo', id: id, styleNo: styleNo}); },
    navTableRow: function(ev, id, dir){ pendingQueue.push({type:'nav', ev: ev, id: id, dir: dir}); },
    _flush: fireWhenReady
  };
  // 暴露一个"真 OrderImg 注册完成"的 hook：在 const OrderImg = {...} 末尾调用 OrderImg._registerAsReal()
  window.__orderImgSetReal = function(real) {
    window.__OrderImgReal = real;
    // 把 real 上的方法挂回到 window.OrderImg 上（后续代码拿到的是完全体，不再走 stub）
    Object.keys(real).forEach(function(k){
      if (typeof real[k] === 'function') window.OrderImg[k] = real[k].bind(real);
      else window.OrderImg[k] = real[k];
    });
    window.OrderImg.__stub = false;
    window.OrderImg.__real = real;
    fireWhenReady();
  };
})();

// ===== 渲染表格 =====
function renderTable() {
  const data = getFilteredOrders();
  const allChecked = data.length > 0 && data.every(o => _selectedOrderIds.has(o.id));
  App.renderTable('orderTable', {
    columns: [
      { key: 'id', title: `<input type="checkbox" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">`, width: '40px', render: (v) => `<input type="checkbox" ${_selectedOrderIds.has(v) ? 'checked' : ''} onchange="toggleSelect('${v}', this.checked)">` },
      { key: 'styleImg_path', title: '图片', width: '70px', render: (v, row) => {
        var imgs = [];
        if (row.styleImg_path) imgs.push(row.styleImg_path);
        if (row.fullImg_path) imgs.push(row.fullImg_path);
        var hasOwn = imgs.length > 0;

        // ============ 新增：渲染时直接用共享 styleImages 缓存，秒显缩略图，不等 backfill ============
        if (!hasOwn && row.styleNo && window.StyleImgCache) {
          try {
            var sc = StyleImgCache.resolve(String(row.styleNo).trim());
            if (sc && (sc.styleImg_path || sc.fullImg_path)) {
              if (sc.styleImg_path) imgs.push(sc.styleImg_path);
              if (sc.fullImg_path)  imgs.push(sc.fullImg_path);
              hasOwn = imgs.length > 0;
              if (hasOwn) {
                // 把共享缓存找到的路径临时挂到 row 上，hydrateTableImages 就会按 orderImg 分支去 resolve + 渲染
                // 注意：不写回订单 payload（避免把别的模块的图片路径污染进订单记录，除非用户手动保存）
                if (!row._sharedStyleImg) {
                  row._sharedStyleImg = sc.styleImg_path || '';
                  row._sharedFullImg  = sc.fullImg_path  || '';
                  if (!row.styleImg_path) row.styleImg_path = sc.styleImg_path || '';
                  if (!row.fullImg_path)  row.fullImg_path  = sc.fullImg_path  || '';
                }
              }
            }
          } catch(_scErr) {}
        }

        var canBackfill = !hasOwn && row.styleNo;
        if (!hasOwn && !canBackfill) return '<span style="color:var(--text-muted);font-size:11px;">无</span>';

        if (hasOwn) {
          var idx = parseInt(row._thumbIdx || '0', 10);
          var currentImg = imgs[idx] || imgs[0];
          var dots = imgs.length > 1 ? imgs.map(function(_, i){ return '<span style="display:inline-block;width:4px;height:4px;border-radius:50%;background:' + (i===idx?'var(--primary)':'var(--border)') + ';margin:0 1px;"></span>'; }).join('') : '';
          var navBtns = imgs.length > 1 ? '<button onclick="OrderImg.navTableRow(event,\'' + row.id + '\',-1)" style="position:absolute;left:0;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;padding:0;">‹</button><button onclick="OrderImg.navTableRow(event,\'' + row.id + '\',1)" style="position:absolute;right:0;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;padding:0;">›</button>' : '';
          var imgSrc = '';
          if (currentImg) {
            if (currentImg.startsWith('data:image')) {
              imgSrc = currentImg;
            } else {
              // ========== 关键修复：列 render 就启动一次 resolve，不依赖 OrderImg.hydrateTableImages（哪怕 OrderImg 还没定义） ==========
              // 用 setTimeout(0) 微任务发起，避免 App.renderTable 同步阶段卡 long task。
              // 生成的数据属性带原始路径，hydrate 还能重复做一次兜底。
              var safePath = currentImg.replace(/"/g,'&quot;');
              try {
                if (window.resolveImageUrl) {
                  (async function(pathToResolve, orderIdForLog){
                    try {
                      var signed = await resolveImageUrl(pathToResolve);
                      if (!signed) return;
                      // 到了异步回调里，DOM 已挂树；按 orderId 找到 <img data-order-img> 填 src
                      var targetImg = document.querySelector('img[data-order-img="' + orderIdForLog + '"]');
                      if (targetImg) { targetImg.src = signed; targetImg.style.display = 'block'; }
                      // 顺带把同 row 其他 backfill 节点也填上
                      var siblings = document.querySelectorAll('img[data-order-img][data-row-not-used]');
                      void siblings;
                    } catch(_rerr) {
                      console.warn('[renderTable styleImg column] resolveImageUrl 异常: path=' + pathToResolve, _rerr && _rerr.message ? _rerr.message : _rerr);
                    }
                  })(currentImg, row.id);
                }
              } catch(_ee) {}
            }
          }
          var dataAttr = currentImg ? (' data-raw-path="' + currentImg.replace(/"/g,'&quot;') + '"') : '';
          return '<div style="position:relative;display:flex;flex-direction:column;align-items:center;">' +
            '<img data-order-img="' + row.id + '" src="' + (imgSrc || '') + '"' + dataAttr + ' style="width:48px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;' + (imgSrc ? '' : 'display:none;') + '" onclick="OrderImg.openRowFullscreen(\'' + row.id + '\')">' +
            dots + navBtns + '</div>';
        }
        // backfill 占位：渲染带查找标记的 img，后续 hydrate 填入
        return '<div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:48px;">' +
          '<img data-order-img-backfill="' + row.id + '" data-style-no="' + App.utils.escapeHtml(row.styleNo || '') + '" src="" style="width:48px;height:48px;object-fit:cover;border-radius:4px;display:none;cursor:pointer;" onclick="OrderImg.openRowFullscreenByStyleNo(\'' + row.id + '\', ' + JSON.stringify(row.styleNo ? String(row.styleNo).replace(/'/g,"\\'") : '') + ')">' +
          '<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:10px;">🔍</span></div>';
      } },
      { key: 'orderNo', title: 'PO', width: '130px' },
      { key: 'styleNo', title: 'Style No.', width: '110px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'customerId', title: 'Customer', width: '110px', render: (v) => App.utils.escapeHtml(getCustomerName(v)) },
      { key: 'orderDate', title: 'Date', width: '95px' },
      { key: 'season', title: 'Season', width: '70px', render: (v) => v || '-' },
      { key: 'fabricComposition', title: 'Fabric', width: '120px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'styleDescription', title: 'Style Desc', width: '120px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'packageId', title: 'Package ID', width: '110px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'assType', title: 'Ass.Type', width: '60px', render: (v) => v || '-' },
      { key: 'colorCode', title: 'Color Code', width: '80px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'colorName', title: 'Color', width: '80px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
      { key: 'quantity', title: 'Qty', width: '70px', render: (v) => v ? Number(v).toLocaleString() : '-' },
      { key: 'unitPrice', title: 'U/Prx', width: '80px', render: (v) => {
        if (!App.canSeePrice()) return v ? '<span class="text-muted">*</span>' : '-';
        return v ? App.utils.formatMoney(v) : '-';
      } },
      { key: 'totalAmount', title: 'TTL Amount', width: '100px', render: (v) => {
        if (!App.canSeePrice()) return v ? '<span class="text-muted">*</span>' : '-';
        return v ? App.utils.formatMoney(v) : '-';
      } },
      { key: 'shipMethod', title: 'Shp Method', width: '80px', render: (v) => v || '-' },
      { key: 'etd', title: 'ETD', width: '95px' },
      { key: 'status', title: 'Status', width: '80px', render: (v) => App.statusTag(v || '草稿') },
      { key: 'remark', title: 'Remarks', width: '130px', render: (v) => v ? App.utils.escapeHtml(v) : '-' },
    ],
    data: data,
    actions: (row) => `
      <button class="btn btn-sm" title="查看详情" onclick="viewDetail('${row.id}')">👁️</button>
      <button class="btn btn-sm" title="编辑" onclick="openForm('${row.id}')">✏️</button>
      <button class="btn btn-sm btn-danger" title="删除" onclick="deleteOrder('${row.id}')">🗑️</button>
    `
  });
  // 水合图片缩略图：try/catch 单条包，任何异常都不能短路掉 backfill（这是为什么之前款图不显示的头号原因）
  if (window.OrderImg) {
    var __stubNote = window.OrderImg.__stub ? '(forward-stub模式)' : '(完全体)';
    try {
      if (OrderImg.hydrateTableImages) OrderImg.hydrateTableImages();
      console.log('[renderTable] ✅ hydrateTableImages 同步段完成 ' + __stubNote);
    } catch(eH) {
      console.warn('[renderTable] ⚠️ hydrateTableImages 抛异常（不影响 backfill 继续）:', eH && eH.message ? eH.message : eH);
    }
    if (OrderImg.backfillTableImages && window.getStyleImagesForStyleNo) {
      // 150ms 先试一次（大多数 App.renderTable 同步 DOM），不行 900ms 再来一次（异步渲染/React 风格的兜底）
      var backfillRetries = [120, 900];
      backfillRetries.forEach(function(delay){
        setTimeout(function(){
          try { OrderImg.backfillTableImages(); }
          catch(eB) { console.error('[renderTable] backfillTableImages 延迟 ' + delay + 'ms 执行异常:', eB && eB.message ? eB.message : eB); }
        }, delay);
      });
    } else {
      console.log('[renderTable] ⚠️ 跳过 backfill：OrderImg.backfillTableImages=' + !!(OrderImg && OrderImg.backfillTableImages) +
        '  getStyleImagesForStyleNo=' + !!window.getStyleImagesForStyleNo);
    }
  } else {
    // 理论上走不到（renderTable() 上面已经挂了 forward stub），真走到了就再补一次 stub + 1500ms 轮询。
    console.log('[renderTable] ⚠️ window.OrderImg 尚未定义，启动 1500ms 轮询等待定义');
    var __waitT0 = Date.now();
    var __waitPoll = setInterval(function(){
      if (window.OrderImg) {
        clearInterval(__waitPoll);
        try { if (window.OrderImg.hydrateTableImages) window.OrderImg.hydrateTableImages(); } catch(_){}
        if (window.OrderImg.backfillTableImages && window.getStyleImagesForStyleNo) {
          try { window.OrderImg.backfillTableImages(); } catch(_){}
          setTimeout(function(){ try { window.OrderImg.backfillTableImages(); } catch(_){} }, 900);
        }
        return;
      }
      if (Date.now() - __waitT0 > 1500) {
        clearInterval(__waitPoll);
        console.warn('[renderTable] 等待 window.OrderImg 超时 1.5s，放弃水合');
      }
    }, 60);
  }
}

// ===== 尺码矩阵状态 =====
let _sizeMatrix = { sizeGroupId: null, allSizes: [], sizes: [], rows: [] };

// ===== 表格选中状态 =====
let _selectedOrderIds = new Set();

function toggleSelectAll(checked) {
  const data = getFilteredOrders();
  if (checked) {
    data.forEach(o => _selectedOrderIds.add(o.id));
  } else {
    data.forEach(o => _selectedOrderIds.delete(o.id));
  }
  renderTable();
}

function toggleSelect(id, checked) {
  if (checked) {
    _selectedOrderIds.add(id);
  } else {
    _selectedOrderIds.delete(id);
  }
  // 只更新表头全选框状态，不重建整个表格
  const allChecked = getFilteredOrders().every(o => _selectedOrderIds.has(o.id));
  const headerCb = document.querySelector('#orderTable thead input[type="checkbox"]');
  if (headerCb) headerCb.checked = allChecked;
}

// 全局选择尺码组的方法
const OrderModule = {
  selectSizeGroup(gid) {
    if (!gid) return;
    const groups = App.store.get('maintSizes', []);
    const g = groups.find(x => x.id === gid);
    if (!g) return;
    _sizeMatrix = {
      sizeGroupId: g.id,
      allSizes: [...(g.sizes || [])],
      sizes: [...(g.sizes || [])],
      rows: [{ packageId: '', assType: '', colorCode: '', colorName: '', noOfCartons: '', quantities: {} }]
    };
    renderSizeMatrix();
  }
};

// 移除某个尺码列
function removeMatrixSize(sizeName) {
  if (!_sizeMatrix.allSizes) return;
  _sizeMatrix.sizes = _sizeMatrix.sizes.filter(s => s !== sizeName);
  // 同时清除各行中该尺码的数量数据
  _sizeMatrix.rows.forEach(row => {
    if (row.quantities && row.quantities[sizeName] !== undefined) {
      delete row.quantities[sizeName];
    }
  });
  renderSizeMatrix();
}

// 添加回已移除的尺码
function addMatrixSize(sizeName) {
  if (!_sizeMatrix.allSizes) return;
  if (_sizeMatrix.sizes.includes(sizeName)) return;
  _sizeMatrix.sizes.push(sizeName);
  // 保持原始排序
  _sizeMatrix.sizes.sort((a, b) => {
    const ia = _sizeMatrix.allSizes.indexOf(a);
    const ib = _sizeMatrix.allSizes.indexOf(b);
    return ia - ib;
  });
  renderSizeMatrix();
}

function renderSizeMatrix() {
  const container = document.getElementById('sizeMatrixContainer');
  if (!container) return;

  if (!_sizeMatrix.sizes.length) {
    const removedSizes = (_sizeMatrix.allSizes || []).filter(s => !_sizeMatrix.sizes.includes(s));
    const removedOpts = removedSizes.map(s => `<option value="${App.utils.escapeHtml(s)}">${App.utils.escapeHtml(s)}</option>`).join('');
    container.innerHTML = `
      <div style="text-align:center;padding:20px;border:2px dashed var(--border);border-radius:var(--radius);">
        <p style="color:var(--muted);margin-bottom:10px;">尚未选择尺码</p>
        <button class="btn btn-primary" onclick="loadSizeGroup()">📏 从尺码表选择</button>
        ${removedSizes.length ? `
          <div style="margin-top:10px;display:flex;gap:6px;justify-content:center;align-items:center;">
            <select id="addSizeSel" class="form-select sm" style="width:70px;">${removedOpts}</select>
            <button class="btn btn-sm btn-primary" onclick="addMatrixSize(document.getElementById('addSizeSel').value)" style="padding:4px 10px;">➕ 添加尺码</button>
          </div>` : ''}
      </div>`;
    return;
  }

  const sizes = _sizeMatrix.sizes;
  const sizeCols = sizes.map(s => `<th style="width:50px;text-align:center;position:relative;">${App.utils.escapeHtml(s)}<span onclick="removeMatrixSize('${App.utils.escapeHtml(s)}')" style="cursor:pointer;margin-left:3px;color:#e74c3c;font-size:11px;font-weight:bold;" title="移除该尺码">✕</span></th>`).join('');

  let rowsHtml = '';
  let totalQty = 0;
  _sizeMatrix.rows.forEach((row, idx) => {
    const qtyCells = sizes.map((s, si) => {
      const val = row.quantities[s] || '';
      return `<td style="padding:2px;"><input type="number" class="form-input sm no-spinner" style="width:50px;text-align:center;padding:2px;font-size:12px;" value="${val}" oninput="updateMatrixQty(${idx}, '${s}', this.value)"></td>`;
    }).join('');

    // 行小计 = 类型为SOLID时仅取尺码数量之和，否则 × 箱数
    const sizeSum = sizes.reduce((sum, s) => sum + (parseInt(row.quantities[s]) || 0), 0);
    const cartons = parseInt(row.noOfCartons) || 0;
    const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
    totalQty += rowTotal;

    const assTypeOpts = ['A', 'B', 'C', 'D', 'SOLID'].map(opt =>
      `<option value="${opt}" ${row.assType === opt ? 'selected' : ''}>${opt}</option>`
    ).join('');

    rowsHtml += `
      <tr>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:130px;padding:2px;font-size:12px;" placeholder="包装ID" value="${App.utils.escapeHtml(row.packageId)}" oninput="updateMatrixRow(${idx}, 'packageId', this.value)"></td>
        <td style="padding:2px;"><select class="form-select sm" style="width:70px;padding:2px;font-size:12px;" onchange="updateMatrixRow(${idx}, 'assType', this.value); updateMatrixTotals();"><option value="">类型</option>${assTypeOpts}</select></td>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:55px;padding:2px;font-size:12px;" placeholder="色号" value="${App.utils.escapeHtml(row.colorCode)}" oninput="updateMatrixRow(${idx}, 'colorCode', this.value)"></td>
        <td style="padding:2px;"><input type="text" class="form-input sm" style="width:110px;padding:2px;font-size:12px;" placeholder="颜色" value="${App.utils.escapeHtml(row.colorName)}" oninput="updateMatrixRow(${idx}, 'colorName', this.value)"></td>
        <td style="padding:2px;"><input type="number" class="form-input sm no-spinner" style="width:45px;text-align:center;padding:2px;font-size:12px;" placeholder="箱数" value="${row.noOfCartons}" oninput="updateMatrixRow(${idx}, 'noOfCartons', this.value); updateMatrixTotals();"></td>
        ${qtyCells}
        <td style="text-align:center;font-weight:600;color:var(--primary);" id="rowSub-${idx}">${rowTotal}</td>
        <td style="padding:2px;"><button class="btn btn-sm btn-danger" title="删除行" onclick="removeMatrixRow(${idx})" style="padding:2px 6px;">🗑️</button></td>
      </tr>`;
  });

  // 合计行（每列：SOLID行取尺码数量，其他行 数量×箱数）
  const totalCells = sizes.map((s, si) => {
    const colSum = _sizeMatrix.rows.reduce((sum, r) => {
      const qty = parseInt(r.quantities[s]) || 0;
      return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
    }, 0);
    return `<td style="text-align:center;font-weight:600;color:var(--primary);" id="colTotal-${si}">${colSum}</td>`;
  }).join('');

  // 构建"添加尺码"下拉（显示已移除的尺码）
  const removedSizes = (_sizeMatrix.allSizes || []).filter(s => !_sizeMatrix.sizes.includes(s));
  let addSizeHtml = '';
  if (removedSizes.length) {
    const removedOpts = removedSizes.map(s => `<option value="${App.utils.escapeHtml(s)}">${App.utils.escapeHtml(s)}</option>`).join('');
    addSizeHtml = `<select id="addSizeSel" class="form-select sm" style="width:65px;padding:2px 6px;font-size:12px;">${removedOpts}</select>
      <button class="btn btn-sm btn-primary" onclick="addMatrixSize(document.getElementById('addSizeSel').value)" style="padding:2px 8px;">➕ 添加尺码</button>`;
  }

  container.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;">
      <span class="text-muted font-sm">尺码组：</span>

      <button class="btn btn-sm" onclick="loadSizeGroup()" style="padding:2px 8px;">🔄 更换</button>

      ${addSizeHtml}
      <span style="flex:1;"></span>
      <span class="font-sm">合计数量：<strong style="color:var(--primary);font-size:14px;" id="matrixTotal">${totalQty}</strong></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="data-table" style="min-width:100%;font-size:12px;">
        <thead>
          <tr>
            <th style="width:130px;">包装ID</th>

        </thead>
        <tbody>${rowsHtml}</tbody>
        <thead>
          <tr style="background:var(--primary-light);">
            <td colspan="5" style="font-weight:600;text-align:right;">合计：</td>
            ${totalCells}
            <td style="font-weight:700;color:var(--primary);text-align:center;" id="grandTotal">${totalQty}</td>
            <td></td>
          </tr>
        </thead>
      </table>
    </div>
  `;
  // 更新总数量和总箱数字段
  const qtyInput = document.getElementById('f_qtyInCartons');
  if (qtyInput) qtyInput.value = totalQty;
  const cartonsInput = document.getElementById('f_noOfCartons');
  if (cartonsInput) {
    const totalCartons = _sizeMatrix.rows.reduce((sum, r) => sum + (parseInt(r.noOfCartons) || 0), 0);
    cartonsInput.value = totalCartons;
  }
  calcTotal();
}

function updateMatrixRow(idx, field, val) {
  if (!_sizeMatrix.rows[idx]) return;
  _sizeMatrix.rows[idx][field] = val;
}

function updateMatrixQty(idx, size, val) {
  if (!_sizeMatrix.rows[idx]) return;
  _sizeMatrix.rows[idx].quantities[size] = val;
  updateMatrixTotals();
}

// 轻量更新合计数值（不重建DOM，避免输入框失焦）
function updateMatrixTotals() {
  const sizes = _sizeMatrix.sizes;
  let totalQty = 0;
  _sizeMatrix.rows.forEach((row, idx) => {
    const sizeSum = sizes.reduce((sum, s) => sum + (parseInt(row.quantities[s]) || 0), 0);
    const cartons = parseInt(row.noOfCartons) || 0;
    const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
    totalQty += rowTotal;
    const subEl = document.getElementById(`rowSub-${idx}`);
    if (subEl) subEl.textContent = rowTotal;
  });
  // 列合计
  sizes.forEach((s, si) => {
    const colSum = _sizeMatrix.rows.reduce((sum, r) => {
      const qty = parseInt(r.quantities[s]) || 0;
      return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
    }, 0);
    const colEl = document.getElementById(`colTotal-${si}`);
    if (colEl) colEl.textContent = colSum;
  });
  // 总计
  const grandEl = document.getElementById('grandTotal');
  if (grandEl) grandEl.textContent = totalQty;
  const matrixTotalEl = document.getElementById('matrixTotal');
  if (matrixTotalEl) matrixTotalEl.textContent = totalQty;
  // 更新总数量和总箱数字段
  const qtyInput = document.getElementById('f_qtyInCartons');
  if (qtyInput) qtyInput.value = totalQty;
  const cartonsInput = document.getElementById('f_noOfCartons');
  if (cartonsInput) {
    const totalCartons = _sizeMatrix.rows.reduce((sum, r) => sum + (parseInt(r.noOfCartons) || 0), 0);
    cartonsInput.value = totalCartons;
  }
  calcTotal();
}

function addMatrixRow() {
  _sizeMatrix.rows.push({ packageId: '', assType: '', colorCode: '', colorName: '', noOfCartons: '', quantities: {} });
  renderSizeMatrix();
}

function removeMatrixRow(idx) {
  _sizeMatrix.rows.splice(idx, 1);
  renderSizeMatrix();
}

// ===== 订单图片上传模块 =====
const OrderImg = {
  _fileToDataUrl: function(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = function() { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  },

  getSignedUrl: async function(path) {
    if (!path) return null;
    if (path.startsWith('data:image')) return path;
    if (window.supabase) {
      try {
        var sb = window.supabase;
        var BUCKET = window.STORAGE_BUCKET || 'app-photos';
        var res = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
        if (res && !res.error && res.data) return res.data.signedUrl || null;
      } catch(_e) {}
    }
    if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
      try {
        var BUCKET2 = window.STORAGE_BUCKET || 'app-photos';
        var url = window.SUPABASE_URL + '/storage/v1/object/sign/' + encodeURIComponent(BUCKET2) + '/' + encodeURIComponent(path);
        var resp = await fetch(url, {
          method: 'POST',
          headers: {
            'apikey': window.SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: '{}'
        });
        if (resp.ok) {
          var data = await resp.json();
          if (data && data.signedUrl) return data.signedUrl;
        }
      } catch(_e2) {}
    }
    return null;
  },

  _directUrl: function(p) {
    if (!p) return '';
    if (p.startsWith('data:image')) return p;
    var bucket = window.STORAGE_BUCKET || 'app-photos';
    return (window.SUPABASE_URL || '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + encodeURIComponent(p);
  },

  onFileChange: async function(type, input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var prefix = type === 'style' ? 'orderStyleImg' : 'orderFullImg';
    var statusEl = document.getElementById(prefix + 'Status');
    var pathEl = document.getElementById(prefix + 'Path');
    var nameEl = document.getElementById(prefix + 'Name');
    var previewImg = document.getElementById(prefix + 'Preview');
    var placeholder = document.getElementById(prefix + 'Placeholder');
    if (!statusEl) return;

    if (file.size > 10 * 1024 * 1024) {
      statusEl.className = 'status error';
      statusEl.textContent = '图片超过 10MB 限制';
      return;
    }

    // 删除旧图
    var oldPath = pathEl ? pathEl.value : '';
    if (oldPath && !oldPath.startsWith('data:image') && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
      try { await SupabaseSubmit.deletePicture(oldPath); } catch(_e) {}
    }

    statusEl.className = 'status loading';
    statusEl.textContent = '正在上传中...';

    // base64 兜底
    var base64DataUrl = null;
    try { base64DataUrl = await this._fileToDataUrl(file); } catch(_e) {}

    // 本地预览
    var localUrl = URL.createObjectURL(file);
    if (previewImg) { previewImg.src = localUrl; previewImg.style.display = 'block'; }
    if (placeholder) placeholder.style.display = 'none';

    // 尝试 Supabase 上传
    var supabaseOk = false;
    var supabaseError = null;
    if (!window.SupabaseSubmit || typeof SupabaseSubmit.uploadPicture !== 'function') {
      supabaseError = '上传模块未加载';
    } else {
      try {
        var styleNo = '';
        try { var snEl = document.getElementById('f_styleNo'); if (snEl) styleNo = (snEl.value || '').trim(); } catch(_) {}
        var result = await SupabaseSubmit.uploadPicture(file, 'order', styleNo);
        if (result && result.path) {
          if (pathEl) pathEl.value = result.path;
          if (nameEl) nameEl.value = result.fileName || file.name;
          statusEl.className = 'status ok';
          statusEl.textContent = '✓ 上传成功：' + (result.fileName || file.name);
          try {
            var s = await this.getSignedUrl(result.path);
            if (s && previewImg) previewImg.src = s;
          } catch(_x) {}
          supabaseOk = true;
        } else {
          supabaseError = '上传返回空结果';
        }
      } catch(err) {
        supabaseError = (err && err.message) || String(err);
      }
    }

    // Supabase 失败 → base64 兜底
    if (!supabaseOk && base64DataUrl) {
      console.warn('[OrderImg] Supabase 上传失败(' + supabaseError + ')，使用 base64 兜底');
      if (pathEl) pathEl.value = base64DataUrl;
      if (nameEl) nameEl.value = file.name || '';
      if (previewImg) previewImg.src = base64DataUrl;
      statusEl.className = 'status error';
      statusEl.textContent = '⚠️ 云端上传失败(' + (supabaseError || '未知原因') + ')，图片仅本地保存';
      try { if (App && App.toast) App.toast('⚠️ 云端上传失败：' + (supabaseError || '未知原因') + '，图片仅保存在本地', 'error'); } catch(_) {}
      supabaseOk = true;
    }
    if (!supabaseOk) {
      statusEl.className = 'status error';
      statusEl.textContent = '上传失败：' + (supabaseError || '请重试');
      try { if (App && App.toast) App.toast('上传失败：' + (supabaseError || '请重试'), 'error'); } catch(_) {}
      return;
    }
    var _s = statusEl;
    setTimeout(function(){ if (_s && _s.className.indexOf('ok')>=0) { _s.className = 'status'; _s.textContent = ''; } }, 3000);
  },

  hydratePreview: async function(type, path) {
    var prefix = type === 'style' ? 'orderStyleImg' : 'orderFullImg';
    var previewImg = document.getElementById(prefix + 'Preview');
    var placeholder = document.getElementById(prefix + 'Placeholder');
    if (!previewImg || !path) return;
    if (path.startsWith('data:image')) {
      previewImg.src = path;
      previewImg.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
      return;
    }
    try {
      var signed = await this.getSignedUrl(path);
      if (signed) {
        previewImg.src = signed;
        previewImg.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
        return;
      }
    } catch(_e) {}
    var directUrl = this._directUrl(path);
    if (directUrl) {
      previewImg.src = directUrl;
      previewImg.style.display = 'block';
      if (placeholder) placeholder.style.display = 'none';
    }
  },

  // 按款号自动从缓存回查图片（缓存未命中则搜索 Supabase Storage）
  autoPopulateImagesFromCache: function(forceStyleNo) {
    var self = this;
    var styleNo = (forceStyleNo || '').trim();
    if (!styleNo) {
      var styleNoEl = document.getElementById('f_styleNo');
      if (styleNoEl) styleNo = styleNoEl.value.trim();
    }
    if (!styleNo) return;

    var stylePath = document.getElementById('orderStyleImgPath');
    var hasCurrentStyle = stylePath && stylePath.value;
    if (hasCurrentStyle) return;

    var done = function(cached, fromWhere) {
      if (!cached) return;
      var populated = false;
      if (!hasCurrentStyle && cached.styleImg_path) {
        stylePath.value = cached.styleImg_path;
        var nameEl = document.getElementById('orderStyleImgName');
        if (nameEl) nameEl.value = cached.styleImg_name || '';
        var previewImg = document.getElementById('orderStyleImgPreview');
        if (previewImg) {
          previewImg.src = cached.styleImg_signed || cached.styleImg_path;
          previewImg.style.display = 'block';
        }
        var placeholder = document.getElementById('orderStyleImgPlaceholder');
        if (placeholder) placeholder.style.display = 'none';
        populated = true;
      }
      // 同步大图数据到隐藏字段（兼容旧订单）
      if (cached.fullImg_path) {
        var fullPath = document.getElementById('orderFullImgPath');
        if (fullPath) fullPath.value = cached.fullImg_path;
        var nameEl2 = document.getElementById('orderFullImgName');
        if (nameEl2) nameEl2.value = cached.fullImg_name || '';
      }
      if (populated && window.StyleImgCache) {
        StyleImgCache.set(styleNo, {
          styleImg_path: cached.styleImg_path,
          styleImg_name: cached.styleImg_name,
          fullImg_path: cached.fullImg_path,
          fullImg_name: cached.fullImg_name
        });
        console.log('[OrderImg] ' + fromWhere + '，款号=' + styleNo);
        try { if (App && App.toast) App.toast('已自动加载款号 ' + styleNo + ' 的图片（' + fromWhere + '）', 'info', 2200); } catch(_) {}
      }
    };

    // 策略1：先查缓存
    if (window.StyleImgCache) {
      var cached = StyleImgCache.resolve(styleNo);
      if (cached && (cached.styleImg_path || cached.fullImg_path)) {
        done(cached, '缓存');
        return;
      }
    }

    // 策略2：去 Supabase Storage 按款号搜索文件名
    if (window.SupabaseSubmit && typeof SupabaseSubmit.findStyleImages === 'function') {
      try {
        if (App && App.toast) App.toast('正在从云端查找款号 ' + styleNo + ' 的图片…', 'info', 1500);
        SupabaseSubmit.findStyleImages(styleNo).then(function(result){
          if (result) done(result, '云端');
        }).catch(function(e){ console.warn('[OrderImg] findStyleImages 失败', e); });
      } catch(_err) {}
    }
  },

    if (imgs.length < 2) return;

  // 按款号云端搜索，回填表格缩略图（自身没图但 styleNo 设置了的记录）
  backfillTableImages: async function() {
    console.log('[OrderImg.backfillTableImages] 🚀 开始，检查 window.getStyleImagesForStyleNo=' + !!window.getStyleImagesForStyleNo);
    if (!window.getStyleImagesForStyleNo) return;
    var imgs = document.querySelectorAll('img[data-order-img-backfill]');
    console.log('[OrderImg.backfillTableImages] 表格内待回填 img 节点数=' + imgs.length);
    if (imgs.length === 0) return;
    var groups = {};
    imgs.forEach(function(img){
      var sn = (img.getAttribute('data-style-no') || '').trim();
      if (!sn) return;
      (groups[sn] = groups[sn] || []).push(img);
    });
    var styleNos = Object.keys(groups);
    console.log('[OrderImg.backfillTableImages] 待搜索的款号列表=' + JSON.stringify(styleNos));
    for (var i = 0; i < styleNos.length; i++) {
      var sn = styleNos[i];
      var elements = groups[sn];
      try {
        console.log('[OrderImg.backfillTableImages] 🔍 当前款号=' + sn + ', 覆盖行数=' + elements.length);
        var r = await getStyleImagesForStyleNo(sn);
        if (!r) {
          console.log('[OrderImg.backfillTableImages] ❌ 款号=' + sn + ' getStyleImagesForStyleNo 返回 null，表格显示"无"');
          elements.forEach(function(img){
            var cell = img.parentElement;
            if (cell) {
              var sp = cell.querySelector('span');
              if (sp) sp.textContent = '无';
            }
          });
          continue;
        }
        console.log('[OrderImg.backfillTableImages] ✅ 款号=' + sn + ' 结果: styleImg_path=' + (r.styleImg_path || '') + ' fullImg_path=' + (r.fullImg_path || ''));
        var signedUrl = r.styleImg_signed || null;
        if (!signedUrl && r.styleImg_path && window.resolveImageUrl) signedUrl = await resolveImageUrl(r.styleImg_path, { hintStyleNo: sn });
        var paths = [];
        if (r.styleImg_path) paths.push(r.styleImg_path);
        if (r.fullImg_path)  paths.push(r.fullImg_path);
        var self = this;
        elements.forEach(function(img){
          var orderId = img.getAttribute('data-order-img-backfill') || '';
          var cell = img.parentElement;
          if (signedUrl) {
            img.src = signedUrl;
            img.style.display = 'block';
            if (cell) {
              var sp = cell.querySelector('span');
              if (sp) sp.style.display = 'none';
            }
            if (paths.length >= 2) {
              img.setAttribute('data-backfill-paths', JSON.stringify(paths));
              // 加 prev/next 按钮
              var hasNav = cell.querySelector('button');
              if (!hasNav) {
                var prev = document.createElement('button');
                prev.textContent = '‹';
                prev.style.cssText = 'position:absolute;left:0;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;padding:0;line-height:1;';
                prev.onclick = function(ev){ ev.stopPropagation(); if (window.OrderImg) OrderImg.navTableRow(ev, orderId, -1); };
                var next = document.createElement('button');
                next.textContent = '›';
                next.style.cssText = 'position:absolute;right:0;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;padding:0;line-height:1;';
                next.onclick = function(ev){ ev.stopPropagation(); if (window.OrderImg) OrderImg.navTableRow(ev, orderId, 1); };
                cell.appendChild(prev); cell.appendChild(next);
              }
            }
          } else {
            console.warn('[OrderImg.backfillTableImages] ⚠️ 款号=' + sn + ' 有路径但签名URL为空（RLS sign 权限异常？）');
            if (cell) {
              var sp2 = cell.querySelector('span');
              if (sp2) sp2.textContent = '无';
            }
          }
        });
      } catch(_e) {
        console.error('[OrderImg.backfillTableImages] 款号=' + sn + ' 抛异常:', _e && _e.message ? _e.message : _e);
      }
      if (i < styleNos.length - 1) await new Promise(function(r){ setTimeout(r, 60); });
    }
    console.log('[OrderImg.backfillTableImages] ✅ 全部款号处理完毕');
  },

// 根据客户加载对应人员（Planner/Designer/P.Manager）
function loadCustomerPersonnel(customerId, existingOrder) {
  const plannerSel = document.getElementById('f_planner');
  const designerSel = document.getElementById('f_designer');
  const pManagerSel = document.getElementById('f_pManager');
  if (!plannerSel || !designerSel || !pManagerSel) return;

  const contacts = App.store.get('contacts', []);
  const customer = contacts.find(c => c.id === customerId);
  if (!customer) {
    [plannerSel, designerSel, pManagerSel].forEach(s => s.innerHTML = '<option value="">请选择</option>');
    return;
  }
  // 获取该客户公司下所有联系人记录（同名）
  const companyContacts = contacts.filter(c => c.name === customer.name && c.contactPerson);

  // 按职位关键词严格匹配（无匹配则返回空，不回退显示全部）
  const matchByKeywords = (keywords) => {
    return companyContacts.filter(c => {
      const pos = (c.position || '').toLowerCase();
      return keywords.some(kw => pos.includes(kw.toLowerCase()));
    });
  };

  const buildOptions = (contacts, selectedId) => {
    return '<option value="">请选择</option>' +
      contacts.map(c => `<option value="${c.id}" ${selectedId === c.id ? 'selected' : ''}>${App.utils.escapeHtml(c.contactPerson)}${c.position ? ' (' + App.utils.escapeHtml(c.position) + ')' : ''}</option>`).join('');
  };

  const ex = existingOrder || {};
  plannerSel.innerHTML = buildOptions(matchByKeywords(['planner', '计划']), ex.planner);
  designerSel.innerHTML = buildOptions(matchByKeywords(['design', '设计']), ex.designer);
  pManagerSel.innerHTML = buildOptions(matchByKeywords(['manager', '经理', '生产']), ex.pManager);
}

// 自动计算总金额
function calcTotal() {
  const qty = parseFloat(document.getElementById('f_qtyInCartons')?.value) || 0;
  const price = parseFloat(document.getElementById('f_unitPrice')?.value) || 0;
  const total = qty * price;
  const totalEl = document.getElementById('f_totalAmount');
  if (totalEl) totalEl.value = App.utils.formatMoney(total);
}

// ===== 保存表单 =====
function saveForm(id) {
  const orderNo = document.getElementById('f_orderNo').value.trim();
  const styleNo = document.getElementById('f_styleNo').value.trim();
  const customerId = document.getElementById('f_customerId').value;
  const orderDate = document.getElementById('f_orderDate').value;
  const season = document.getElementById('f_season').value;
  const styleDescription = document.getElementById('f_styleDesc').value.trim();
  const fabricComposition = document.getElementById('f_fabricComposition')?.value.trim() || '';
  // 包装信息从尺码矩阵汇总（取各行非空值的唯一集合，逗号连接）
  const joinUnique = (field) => [...new Set(_sizeMatrix.rows.map(r => r[field]).filter(v => v))].join(', ');
  const packageId = joinUnique('packageId');
  const assType = joinUnique('assType');
  const colorCode = joinUnique('colorCode');
  const colorName = joinUnique('colorName');
  const noOfCartons = parseFloat(document.getElementById('f_noOfCartons').value) || 0;
  const quantity = parseFloat(document.getElementById('f_qtyInCartons').value) || 0;
  const shipMethod = document.getElementById('f_shipMethod').value;
  const etd = document.getElementById('f_etd').value;
  const planner = document.getElementById('f_planner').value;
  const designer = document.getElementById('f_designer').value;
  const pManager = document.getElementById('f_pManager').value;
  const remark = document.getElementById('f_remark').value.trim();
  const styleImg_path = document.getElementById('orderStyleImgPath')?.value || '';
  const styleImg_name = document.getElementById('orderStyleImgName')?.value || '';
  const fullImg_path = document.getElementById('orderFullImgPath')?.value || '';
  const fullImg_name = document.getElementById('orderFullImgName')?.value || '';

  // 表单验证
  if (!orderNo) { App.toast('请输入PO (订单号)', 'error'); return; }
  if (!styleNo) { App.toast('请输入Style No.', 'error'); return; }
  if (!customerId) { App.toast('请选择Customer (客户)', 'error'); return; }

  const orders = App.store.get('orders', []);

  // 价格字段：无权限用户看不到也改不了，保留原值
  const existingOrder = id ? orders.find(o => o.id === id) : null;
  const priceInputEl = document.getElementById('f_unitPrice');
  const unitPrice = priceInputEl ? (parseFloat(priceInputEl.value) || 0) : (existingOrder ? (existingOrder.unitPrice || 0) : 0);
  const totalAmount = quantity * unitPrice;

  const data = {
    orderNo, styleNo, customerId, orderDate, season, fabricComposition, styleDescription,
    packageId, assType, colorCode, colorName,
    noOfCartons, quantity, unitPrice, totalAmount,
    shipMethod, etd, planner, designer, pManager,
    remark, styleImg_path, styleImg_name, fullImg_path, fullImg_name,
    sizeMatrix: JSON.parse(JSON.stringify(_sizeMatrix)),
  };

  if (id) {
    const idx = orders.findIndex(o => o.id === id);
    if (idx >= 0) orders[idx] = { ...orders[idx], ...data };
    App.toast('订单更新成功', 'success');
  } else {
    orders.push({ id: App.utils.genId('ORD'), status: '草稿', ...data });
    App.toast('订单创建成功', 'success');
  }

  App.store.set('orders', orders);
  // 更新款式图片共享缓存
  if (window.StyleImgCache) {
    StyleImgCache.updateIfChanged(styleNo, {
      styleImg_path: styleImg_path,
      styleImg_name: styleImg_name,
      fullImg_path: fullImg_path,
      fullImg_name: fullImg_name
    });
  }
  App.modal.close();
  renderStats();
  renderTable();
}

// ===== 删除订单 =====
function deleteOrder(id) {
  App.confirm('确定要删除此订单吗？删除后不可恢复。', () => {
    let orders = App.store.get('orders', []);
    const order = orders.find(o => o.id === id);
    // 删除 Supabase 图片（跳过 base64 和被其他款号共享引用的图片）
    if (order) {
      if (order.styleImg_path && !order.styleImg_path.startsWith('data:image')) {
        var isSharedS = window.StyleImgCache && StyleImgCache.isShared(order.styleImg_path, order.styleNo);
        if (!isSharedS && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
          try { SupabaseSubmit.deletePicture(order.styleImg_path); } catch(_e) {}
        }
      }
      if (order.fullImg_path && !order.fullImg_path.startsWith('data:image')) {
        var isSharedF = window.StyleImgCache && StyleImgCache.isShared(order.fullImg_path, order.styleNo);
        if (!isSharedF && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
          try { SupabaseSubmit.deletePicture(order.fullImg_path); } catch(_e) {}
        }
      }
      // 从缓存中移除（仅当没有其他模块引用时）
      if (window.StyleImgCache && order.styleNo) {
        var stillReferenced = false;
        try {
          var cons = App.store.get('consumptions', []);
          stillReferenced = cons.some(function(c){ return c.styleNo === order.styleNo && (c.styleImg_path || c.fullImg_path); });
        } catch(_e) {}
        if (!stillReferenced) StyleImgCache.remove(order.styleNo);
      }
    }
    orders = orders.filter(o => o.id !== id);
    App.store.set('orders', orders);
    App.toast('订单已删除', 'success');
    renderStats();
    renderTable();
  });
}

function viewDetail(id) {
  const orders = App.store.get('orders', []);

  if (!order) return;

  const styleNo = order.styleNo;
  const fabrics = App.store.get('fabrics', []).filter(f => f.styleNo === styleNo);
  const accessories = App.store.get('accessories', []).filter(a => a.styleNo === styleNo);
  const samples = App.store.get('samples', []).filter(s => s.styleNo === styleNo);
  const productions = App.store.get('productions', []).filter(p => p.styleNo === styleNo || p.orderNo === order.orderNo);

  const seasonMap = { SS: '春夏', FW: '秋冬', AW: '秋冬', Holiday: '假日' };
  const shipMap = { Sea: '海运', Air: '空运', Express: '快递' };

  // 尺码矩阵渲染
  let matrixHtml = '';
  if (order.sizeMatrix && order.sizeMatrix.sizes && order.sizeMatrix.sizes.length) {
    const sm = order.sizeMatrix;
    const sizeCols = sm.sizes.map(s => `<th style="text-align:center;padding:4px;font-size:12px;">${App.utils.escapeHtml(s)}</th>`).join('');

    let rowsHtml = '';
    sm.rows.forEach(row => {
      const qtyCells = sm.sizes.map(s => {
        const val = row.quantities && row.quantities[s] ? row.quantities[s] : '-';
        return `<td style="text-align:center;padding:4px;font-size:12px;">${val}</td>`;
      }).join('');
      const sizeSum = sm.sizes.reduce((sum, s) => sum + (parseInt(row.quantities?.[s]) || 0), 0);
      const cartons = parseInt(row.noOfCartons) || 0;
      const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;

      rowsHtml += `
        <tr>
          <td style="padding:4px;font-size:12px;">${App.utils.escapeHtml(row.packageId || '-')}</td>
          <td style="padding:4px;font-size:12px;">${App.utils.escapeHtml(row.assType || '-')}</td>
          <td style="padding:4px;font-size:12px;">${App.utils.escapeHtml(row.colorCode || '-')}</td>
          <td style="padding:4px;font-size:12px;">${App.utils.escapeHtml(row.colorName || '-')}</td>
          <td style="text-align:center;padding:4px;font-size:12px;">${row.noOfCartons || '-'}</td>
          ${qtyCells}
          <td style="text-align:center;font-weight:600;color:var(--primary);padding:4px;font-size:12px;">${rowTotal}</td>
        </tr>`;
    });

    const totalCells = sm.sizes.map(s => {
      const colSum = sm.rows.reduce((sum, r) => {
        const qty = parseInt(r.quantities?.[s]) || 0;
        return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
      }, 0);
      return `<td style="text-align:center;font-weight:600;color:var(--primary);padding:4px;font-size:12px;">${colSum}</td>`;
    }).join('');
    const grandTotal = sm.rows.reduce((sum, r) => {
      const sizeSum = sm.sizes.reduce((s, sz) => s + (parseInt(r.quantities?.[sz]) || 0), 0);
      const cartons = parseInt(r.noOfCartons) || 0;
      return sum + (r.assType === 'SOLID' ? sizeSum : sizeSum * cartons);
    }, 0);

    matrixHtml = `
      <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
        <div class="card-header"><span class="card-title">📏 尺码数量分配 (${sm.sizes.join(' · ')})</span></div>
        <div style="overflow-x:auto;padding:0 8px 4px;">
          <table class="data-table" style="width:100%;font-size:12px;">
            <thead>
              <tr>
                <th style="padding:4px;font-size:12px;">包装ID</th>
                <th style="padding:4px;font-size:12px;">类型</th>
                <th style="padding:4px;font-size:12px;">色号</th>
                <th style="padding:4px;font-size:12px;">颜色</th>
                <th style="padding:4px;font-size:12px;">箱数</th>
                ${sizeCols}
                <th style="padding:4px;font-size:12px;">小计</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
            <tfoot>
              <tr style="background:var(--primary-light);">
                <td colspan="5" style="font-weight:600;text-align:right;padding:4px;font-size:12px;">合计：</td>
                ${totalCells}
                <td style="font-weight:700;color:var(--primary);text-align:center;padding:4px;font-size:12px;">${grandTotal}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>`;
  }

  const body = `
    <div style="text-align:right;margin-bottom:6px;">
      <button class="btn btn-primary btn-sm" onclick="printOrderPDF('${id}')" title="打印PDF">🖨️</button>
    </div>

    <!-- 订单信息（含款式信息） -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">📋 订单信息</span></div>
      <div style="display:flex;gap:4px 12px;padding:0 12px 6px;flex-wrap:nowrap;">
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Date</span><span class="detail-value">${App.utils.formatDate(order.orderDate)}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Customer</span><span class="detail-value">${App.utils.escapeHtml(getCustomerName(order.customerId))}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">PO</span><span class="detail-value font-bold">${App.utils.escapeHtml(order.orderNo)}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Season</span><span class="detail-value">${seasonMap[order.season] || order.season || '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Style No.</span><span class="detail-value">${App.utils.escapeHtml(order.styleNo || '-')}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Fabric Composition</span><span class="detail-value">${App.utils.escapeHtml(order.fabricComposition || '-')}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Style Desc</span><span class="detail-value">${App.utils.escapeHtml(order.styleDescription || '-')}</span></div>
      </div>
    </div>

    ${matrixHtml}

    <!-- 价格与数量 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">💰 价格与数量</span></div>
      <div style="display:flex;gap:4px 12px;padding:0 12px 6px;flex-wrap:nowrap;">
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">No. of Cartons</span><span class="detail-value">${(order.noOfCartons && order.noOfCartons > 0) ? order.noOfCartons : (order.sizeMatrix ? order.sizeMatrix.rows.reduce((s,r)=>s+(parseInt(r.noOfCartons)||0),0) : '-')}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Qty in Cartons</span><span class="detail-value">${(order.quantity || 0).toLocaleString()}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">U/Prx</span><span class="detail-value">${App.canSeePrice() ? (order.unitPrice ? App.utils.formatMoney(order.unitPrice) : '-') : (order.unitPrice ? '*' : '-')}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">TTL Amount</span><span class="detail-value font-bold">${App.canSeePrice() ? (order.totalAmount ? App.utils.formatMoney(order.totalAmount) : '-') : (order.totalAmount ? '*' : '-')}</span></div>
      </div>
    </div>

    <!-- 物流与人员 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">🚚 出运 / 👥 客户联系人</span></div>
      <div style="display:flex;gap:4px 12px;padding:0 12px 6px;flex-wrap:nowrap;">
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Shp Method</span><span class="detail-value">${shipMap[order.shipMethod] || order.shipMethod || '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">ETD (交货日期)</span><span class="detail-value">${order.etd ? App.utils.formatDate(order.etd) : '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Planner</span><span class="detail-value">${order.planner ? App.utils.escapeHtml(getContactPersonName(order.planner)) : '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Designer</span><span class="detail-value">${order.designer ? App.utils.escapeHtml(getContactPersonName(order.designer)) : '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">P. Manager</span><span class="detail-value">${order.pManager ? App.utils.escapeHtml(getContactPersonName(order.pManager)) : '-'}</span></div>
        <div class="detail-item" style="flex:1;min-width:0;"><span class="detail-label">Status</span><span class="detail-value">${App.statusTag(order.status || '草稿')}</span></div>
      </div>
    </div>

    <!-- 图片 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">🖼️ 款式图片</span></div>
      <div style="display:flex;gap:12px;padding:8px 12px;flex-wrap:wrap;">
        ${(function(){
          var imgs = [];
          if (order.styleImg_path) imgs.push({ path: order.styleImg_path, label: '款式图' });
          if (order.fullImg_path) imgs.push({ path: order.fullImg_path, label: '大图' });
          if (imgs.length === 0) return '<span style="color:var(--text-muted);font-size:12px;padding:8px;">暂无图片</span>';
          return imgs.map(function(img, idx) {
            var p = img.path;
            var dataAttr = 'data-order-detail-img="' + idx + '"';
            var src = p && p.startsWith('data:image') ? p : '';
            return '<div style="position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;" onclick="OrderImg.openRowFullscreen(\'' + order.id + '\')">' +
              '<img ' + dataAttr + ' src="' + src + '" style="width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--border);">' +
              '<span style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + img.label + '</span>' +
            '</div>';
          }).join('');
        })()}
      </div>
    </div>

    <!-- 样衣记录 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">样衣记录 (${samples.length})</span></div>
      <div id="detail_samples"></div>
    </div>
    <!-- 面料信息 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">面料信息 (${fabrics.length})</span></div>
      <div id="detail_fabrics"></div>
    </div>
    <!-- 辅料信息 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);margin-bottom:6px;">
      <div class="card-header"><span class="card-title">辅料信息 (${accessories.length})</span></div>
      <div id="detail_accessories"></div>
    </div>
    <!-- 生产记录 -->
    <div class="card" style="box-shadow:none;border:1px solid var(--border-light);">
      <div class="card-header"><span class="card-title">生产记录 (${productions.length})</span></div>
      <div id="detail_productions"></div>
    </div>
  `;

  App.modal.open({
    title: '订单详情',
    body: body,
    footer: `<button class="btn" onclick="App.modal.close()">✖️</button>`,
    size: 'lg'
  });

  // 水合详情图片
  if (window.OrderImg && OrderImg.hydrateDetailImages) {
    setTimeout(function(){ OrderImg.hydrateDetailImages(id); }, 100);
  }

  // 渲染样衣记录表格
  App.renderTable('detail_samples', {
    columns: [
      { key: 'stage', title: '阶段', width: '80px' },
      { key: 'round', title: '轮次', width: '60px' },
      { key: 'sampleDate', title: '日期', width: '110px' },
      { key: 'factory', title: '样衣工厂' },
      { key: 'size', title: '尺码', width: '60px' },
      { key: 'status', title: '状态', width: '80px', render: (v) => App.statusTag(v) },
    ],
    data: samples
  });

  // 渲染面料信息表格
  App.renderTable('detail_fabrics', {
    columns: [
      { key: 'fabricName', title: '面料名称' },
      { key: 'supplier', title: '供应商' },
      { key: 'composition', title: '成分' },
      { key: 'color', title: '颜色', width: '80px' },
      { key: 'qtyOrdered', title: '数量', width: '90px', render: (v, row) => `${v} ${row.unit || ''}` },
      { key: 'status', title: '状态', width: '80px', render: (v) => App.statusTag(v) },
    ],
    data: fabrics
  });

  // 渲染辅料信息表格
  App.renderTable('detail_accessories', {
    columns: [
      { key: 'accessoryName', title: '辅料名称' },
      { key: 'supplier', title: '供应商' },
      { key: 'spec', title: '规格' },
      { key: 'color', title: '颜色', width: '80px' },
      { key: 'qtyOrdered', title: '数量', width: '90px', render: (v, row) => `${v} ${row.unit || ''}` },
      { key: 'status', title: '状态', width: '80px', render: (v) => App.statusTag(v) },
    ],
    data: accessories
  });

  // 渲染生产记录表格
  App.renderTable('detail_productions', {
    columns: [
      { key: 'factoryType', title: '工厂类型', width: '90px' },
      { key: 'factoryName', title: '工厂名称' },
      { key: 'startDate', title: '开始日期', width: '110px' },
      { key: 'expectedEnd', title: '预计完成', width: '110px' },
      { key: 'qtyPlanned', title: '计划数', width: '80px' },
      { key: 'qtyCompleted', title: '已完成', width: '80px' },
      { key: 'status', title: '状态', width: '80px', render: (v) => App.statusTag(v) },
    ],
    data: productions
  });
}

// ===== 打印订单详情PDF =====
function printOrderPDF(id) {
  const orders = App.store.get('orders', []);
  const order = orders.find(o => o.id === id);
  if (!order) { App.toast('订单不存在', 'error'); return; }

  const seasonMap = { SS: '春夏', FW: '秋冬', AW: '秋冬', Holiday: '假日' };
  const shipMap = { Sea: '海运', Air: '空运', Express: '快递' };
  const customerName = getCustomerName(order.customerId);
  const plannerName = order.planner ? getContactPersonName(order.planner) : '-';
  const designerName = order.designer ? getContactPersonName(order.designer) : '-';
  const pManagerName = order.pManager ? getContactPersonName(order.pManager) : '-';
  const totalCartons = (order.noOfCartons && order.noOfCartons > 0) ? order.noOfCartons :
    (order.sizeMatrix ? order.sizeMatrix.rows.reduce((s,r)=>s+(parseInt(r.noOfCartons)||0),0) : 0);

  // 关联数据
  const styleNo = order.styleNo;
  const fabrics = App.store.get('fabrics', []).filter(f => f.styleNo === styleNo);
  const accessories = App.store.get('accessories', []).filter(a => a.styleNo === styleNo);
  const samples = App.store.get('samples', []).filter(s => s.styleNo === styleNo);
  const productions = App.store.get('productions', []).filter(p => p.styleNo === styleNo || p.orderNo === order.orderNo);

  const esc = App.utils.escapeHtml;
  const bgCA = '-webkit-print-color-adjust:exact;print-color-adjust:exact;';
  const thStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;background:#e8f1f5;text-align:left;' + bgCA;
  const tdStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;';
  const tcStyle = 'border:1px solid #333;padding:3px 6px;font-size:10px;text-align:center;';

  // 尺码矩阵HTML（SOLID不乘箱数，A/B/C/D乘箱数）
  let matrixHtml = '';
  if (order.sizeMatrix && order.sizeMatrix.sizes && order.sizeMatrix.sizes.length) {
    const sm = order.sizeMatrix;
    const sizeCols = sm.sizes.map(s => `<th style="${tcStyle}background:#e8f1f5;${bgCA}">${esc(s)}</th>`).join('');
    let rowsHtml = '';
    sm.rows.forEach(row => {
      const qtyCells = sm.sizes.map(s => {
        const val = row.quantities && row.quantities[s] ? row.quantities[s] : '-';
        return `<td style="${tcStyle}">${val}</td>`;
      }).join('');
      const sizeSum = sm.sizes.reduce((sum, s) => sum + (parseInt(row.quantities?.[s]) || 0), 0);
      const cartons = parseInt(row.noOfCartons) || 0;
      const rowTotal = row.assType === 'SOLID' ? sizeSum : sizeSum * cartons;
      rowsHtml += `<tr>
        <td style="${tdStyle}">${esc(row.packageId || '-')}</td>
        <td style="${tcStyle}">${esc(row.assType || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorCode || '-')}</td>
        <td style="${tdStyle}">${esc(row.colorName || '-')}</td>
        <td style="${tcStyle}">${row.noOfCartons || '-'}</td>
        ${qtyCells}
        <td style="${tcStyle}font-weight:600;">${rowTotal}</td>
      </tr>`;
    });
    const totalCells = sm.sizes.map(s => {
      const colSum = sm.rows.reduce((sum, r) => {
        const qty = parseInt(r.quantities?.[s]) || 0;
        return sum + (r.assType === 'SOLID' ? qty : qty * (parseInt(r.noOfCartons) || 0));
      }, 0);
      return `<td style="${tcStyle}font-weight:600;background:#f3f4f6;${bgCA}">${colSum}</td>`;
    }).join('');
    const grandTotal = sm.rows.reduce((sum, r) => {
      const sizeSum = sm.sizes.reduce((s, sz) => s + (parseInt(r.quantities?.[sz]) || 0), 0);
      const cartons = parseInt(r.noOfCartons) || 0;
      return sum + (r.assType === 'SOLID' ? sizeSum : sizeSum * cartons);
    }, 0);
    matrixHtml = `
      <table style="width:100%;border-collapse:collapse;margin-bottom:10px;">
        <thead>
          <tr>
            <th style="${thStyle}">包装ID</th>
            <th style="${thStyle}">类型</th>
            <th style="${thStyle}">色号</th>
            <th style="${thStyle}">颜色</th>
            <th style="${thStyle}">箱数</th>
            ${sizeCols}
            <th style="${thStyle}">小计</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          <tr style="background:#f3f4f6;${bgCA}">
            <td colspan="5" style="${tdStyle}text-align:right;font-weight:600;">合计：</td>
            ${totalCells}
            <td style="${tcStyle}font-weight:700;">${grandTotal}</td>
          </tr>
        </tfoot>
      </table>`;
  }

  // 通用表格生成
  const buildTable = (columns, data) => {
    if (!data || data.length === 0) return '<div style="font-size:10px;color:#999;padding:4px;">暂无数据</div>';
    const heads = columns.map(c => `<th style="${thStyle}">${c.title}</th>`).join('');
    const rows = data.map(row => {
      const cells = columns.map(c => {
        let v = row[c.key];
        if (c.render) v = c.render(row[c.key], row);
        if (v === null || v === undefined || v === '') v = '-';
        return `<td style="${tdStyle}">${v}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;margin-bottom:10px;"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>`;
  };

  const samplesTable = buildTable([
    { key: 'stage', title: '阶段' },
    { key: 'round', title: '轮次' },
    { key: 'sampleDate', title: '日期' },
    { key: 'factory', title: '打样厂' },
    { key: 'size', title: '尺码' },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], samples);

  const fabricsTable = buildTable([
    { key: 'fabricName', title: '面料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'composition', title: '成分' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], fabrics);

  const accessoriesTable = buildTable([
    { key: 'accessoryName', title: '辅料名称' },
    { key: 'supplier', title: '供应商' },
    { key: 'spec', title: '规格' },
    { key: 'color', title: '颜色' },
    { key: 'qtyOrdered', title: '数量', render: (v, row) => `${v || '-'} ${row.unit || ''}` },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], accessories);

  const productionsTable = buildTable([
    { key: 'factoryType', title: '工厂类型' },
    { key: 'factoryName', title: '工厂名称' },
    { key: 'startDate', title: '开始日期' },
    { key: 'expectedEnd', title: '预计完成' },
    { key: 'qtyPlanned', title: '计划数' },
    { key: 'qtyCompleted', title: '已完成' },
    { key: 'status', title: '状态', render: (v) => v || '-' },
  ], productions);

  const printDate = App.utils.formatDate(new Date());
  const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>订单详情 - ${esc(order.orderNo)}</title>
<style>
  @page {
    size: A4;
    margin: 12mm 10mm 14mm 10mm;
    @bottom-left {
      content: "打印日期：${printDate}";
      font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
      font-size: 9px;
      color: #666;
      border-top: 1px solid #ddd;
      padding-top: 3mm;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @bottom-right {
      content: "第 " counter(page) " / " counter(pages) " 页";
      font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif;
      font-size: 9px;
      color: #666;
      border-top: 1px solid #ddd;
      padding-top: 3mm;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; color: #222; font-size: 11px; line-height: 1.4; }
  .doc-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #004D6D; padding-bottom: 6px; margin-bottom: 10px; }
