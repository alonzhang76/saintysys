/* ========== 用料及纸板页面 - 作用域限定在 .consumption ========== */
.consumption * { box-sizing: border-box; }

/* ===== 统计卡片 4列 ===== */

.consumption .stat-card:hover { border-color: var(--primary, #004D6D); }
.consumption .stat-icon {
  width: 28px; height: 28px; border-radius: var(--radius, 4px);
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;

.consumption .stat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
.consumption .stat-label { font-size: 11px; color: var(--muted, #6b7280); font-weight: 500; line-height: 1.2; }

.consumption .stat-icon.blue   { background: var(--primary-light, #e8f1f5); color: var(--primary, #004D6D); }
.consumption .stat-icon.purple { background: #f0edff; color: #5e52c6; }
.consumption .stat-icon.teal   { background: #e0f2fe; color: #0369a1; }
.consumption .stat-icon.orange { background: #fff4e5; color: var(--warning, #d9883a); }

/* ===== Tabs 风格 ===== */
.consumption .tabs {
  display: flex; border-bottom: 1px solid var(--border-light, #f3f4f6);
  margin: 0 0 12px; padding: 0; gap: 4px;
}
.consumption .tab-item {
  padding: 5px 14px; cursor: pointer; border: none; background: transparent;

.consumption .tab-item:hover { color: var(--primary, #004D6D); }

.consumption .tab-content.active { display: block; }

}
.consumption .style-card {

<script>
// ===== 云端同步守卫 =====
var PageDataSyncGuard = {
  inited: false, pending: false,
  watchKeys: ["consumptions","consumption_categories","contacts"],
  emptyCheckKeys: ["consumptions"],
  afterInit: function() {
    var self = this; this.inited = true;
    function doRefresh() { try { if (typeof window.renderAll === 'function') window.renderAll(); } catch(e) {} }
    if (self.pending) setTimeout(doRefresh, 200);
    setTimeout(function() {
      var allEmpty = self.emptyCheckKeys.every(function(k){
        try{ var a=App.store.get(k,[]); return !a||a.length===0; }catch(e){return true;}
      });
      if (allEmpty) doRefresh();
    }, 2000);
  }
};
window.addEventListener('cloud-data-updated', function(e){
  var keys = (e.detail&&e.detail.keys)||[];
  var need = keys.some(function(k){ return PageDataSyncGuard.watchKeys.indexOf(k)>=0; });
  if (need) {
    if (!PageDataSyncGuard.inited) { PageDataSyncGuard.pending=true; return; }
    try { if (typeof window.renderAll==='function') window.renderAll(); } catch(e){}
  }
});

App.init('consumption');
App.checkLogin();
App.initSampleData();
App.enforcePagePermission('consumption');
setTimeout(function() { if (window.PageDataSyncGuard) window.PageDataSyncGuard.afterInit(); }, 0);

// ===== 诊断：检测 Supabase Storage 可用性 =====
setTimeout(function() {
  var bucket = window.STORAGE_BUCKET || 'app-photos';
  console.log('[consumption] Supabase 诊断:');
  console.log('  SUPABASE_URL:', window.SUPABASE_URL);
  console.log('  STORAGE_BUCKET:', bucket);
  console.log('  SUPABASE_ANON_KEY:', window.SUPABASE_ANON_KEY ? '(已设置)' : '(未设置)');
  console.log('  window.supabase:', !!window.supabase);
  console.log('  window.SupabaseSubmit:', !!window.SupabaseSubmit);
  console.log('  window.SupabaseStore:', !!window.SupabaseStore, '_isInitialized:',
    window.SupabaseStore && window.SupabaseStore._isInitialized ? window.SupabaseStore._isInitialized() : 'N/A');
  console.log('  SupabaseSubmit.uploadPicture:', !!(window.SupabaseSubmit && typeof SupabaseSubmit.uploadPicture === 'function'));
  if (window.supabase && window.supabase.storage) {
    window.supabase.storage.from(bucket).list('consumption', { limit: 1 }).then(function(res) {
      if (res.error) {
        console.error('[consumption] Storage list 失败:', res.error.message, '（请检查 RLS Storage SELECT 策略是否允许 authenticated 角色 SELECT app-photos 下 consumption/ 路径）');
      } else {
        console.log('[consumption] Storage 连接正常，当前 consumption/ 下有 ' + ((res.data && res.data.length) || 0) + ' 个文件');
      }
    }).catch(function(err) {
      console.error('[consumption] Storage 连接异常:', err && err.message);
    });
  }
}, 1500);

/**
 * 手动强制云端同步（与 order.html 的 forceSyncCloud 相同，避免重复代码）
 * 如果全局已有此函数则复用，没有则自己定义一次
 */
if (!window.forceSyncCloud) {
  window.forceSyncCloud = function forceSyncCloud() {
    if (App && App.toast) App.toast('☁️ 正在同步云端…（最多 10 秒）', 'info', 4000);
    console.log('[forceSyncCloud] 开始执行手动云同步...');
    var stepsDone = 0;
    var totalSteps = 4;
    function next() {
      stepsDone++;
      if (stepsDone >= totalSteps) {
        try { if (typeof renderList === 'function') renderList(); else if (typeof Cons.renderList === 'function') Cons.renderList(); } catch(_) {}
        try { if (App && App.toast) App.toast('✅ 同步完成，列表已刷新', 'success', 2000); } catch(_) {}
        console.log('[forceSyncCloud] 同步完成');
      }
    }
    try {
      var store = window.SupabaseStore;
      if (store) {
        var fn = store.forceRefreshFromCloud || store.refreshFromCloud || store.refreshViaREST;
        if (fn) Promise.resolve(fn.call(store)).then(function(){ next(); }).catch(function(){ next(); });
        else next();
      } else next();
    } catch(_e) { next(); }

    try {
      if (typeof window.independentPoll === 'function') {
        Promise.resolve(window.independentPoll()).then(function(){ next(); }).catch(function(){ next(); });
      } else next();
    } catch(_) { next(); }

    setTimeout(function(){
      try {
        var ALL_KEYS = [
          'styles', 'orders', 'fabrics', 'accessories', 'samples',
          'feedbacks', 'productions', 'invoices', 'payments', 'collections',
          'consumptions', 'consumption_categories',
          'contacts', 'customers', 'suppliers', 'favoriteContacts',
          'washes', 'shippings', 'users', 'permissions',
          'maintFabrics', 'maintAccessories',
          'express_delivery_data_v2', 'pl_records_v1', 'pl_draft_v1',
          'sht_sample_data_v2', 'sht_size_tables_v2', 'sizeSheets', 'styleImages'
        ];
        var origLS = window._origLocalStorage || window.localStorage;
        var needBackup = 0;
        ALL_KEYS.forEach(function(k){
          try {
            var raw = origLS.getItem(k);
            if (raw && raw !== '[]' && raw !== 'null') {
              window.dispatchEvent(new CustomEvent('cloud-write-request', {
                detail: { key: k, value: JSON.parse(raw), ts: Date.now(), force: 1 }
              }));
              needBackup++;
            }
          } catch(_) {}
        });
        console.log('[forceSyncCloud] 本地备份入队 ' + needBackup + ' 个键');
      } finally { next(); }
    }, 800);

    setTimeout(function(){
      try { if (typeof renderList === 'function') renderList(); else if (typeof Cons.renderList === 'function') Cons.renderList(); } catch(_) {}
      next();
    }, 2000);
  };
}

// ======================================================
// ===== 用料及纸板 - 主模块
// ======================================================
var Cons = {
  currentTab: 'list',
  compareList: [],
  editingId: null,
  fabricData: [],
  specData: [],
  fullscreenImgs: [],
  fullscreenIdx: 0,

  // ===== 辅助：ID 生成 =====
  genId: function() {
    return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  },

  // ===== 数据读取 =====
  getConsumptions: function() {
    try { return App.store.get('consumptions', []) || []; } catch(e) { return []; }
  },
  setConsumptions: function(arr) {
    App.store.set('consumptions', arr);
  },
  // ===== 清空本地列表，仅保留云端(Supabase)数据 =====
  clearStyles: function() {
    if (!confirm('确认清空款式列表并从云端重新加载？\n\n此操作会清除本地未同步的数据，仅保留已存储到 Supabase 的数据。')) return;
    var doRender = function(){ try { renderAll(); } catch(e){} };
    var finishLocal = function(msg, type){
      App.toast(msg, type);
      doRender();
    };
    if (window.SupabaseStore && typeof window.SupabaseStore.get === 'function') {
      App.toast('正在从云端重新加载…', 'info');
      // 先清空内存缓存中的 consumptions，强制走云端查询
      try {
        if (window.SupabaseStore._getCache) {
          var c = window.SupabaseStore._getCache();
          if (c) delete c['consumptions'];
        }
      } catch(e){}
      window.SupabaseStore.get('consumptions', []).then(function(cloudData){
        var arr = Array.isArray(cloudData) ? cloudData : [];
        // 用云端数据覆盖本地原始 localStorage（原始方法，不二次触发云端写入）
        try { window._origLocalStorage.setItem('consumptions', JSON.stringify(arr)); } catch(e){}
        // 同步更新内存缓存
        try {
          if (window.SupabaseStore._getCache) {
            var c2 = window.SupabaseStore._getCache();
            if (c2) c2['consumptions'] = JSON.parse(JSON.stringify(arr));
          }
        } catch(e){}
        App.toast('已从云端重新加载（共 ' + arr.length + ' 款）', 'success');
        doRender();
      }).catch(function(e){
        App.toast('云端加载失败，已保留本地数据：' + (e && e.message || e), 'error');
        doRender();
      });
    } else {
      // 无云同步：仅清空本地
      if (!confirm('云同步未就绪，是否仅清空本地列表？')) return;
      try { window._origLocalStorage.removeItem('consumptions'); } catch(e){}
      try {
        if (window.SupabaseStore && window.SupabaseStore._getCache) {
          var c3 = window.SupabaseStore._getCache();
          if (c3) delete c3['consumptions'];
        }
      } catch(e){}
      finishLocal('已清空本地列表', 'warning');
    }
  },
  getCategories: function() {
    try {
      var cats = App.store.get('consumption_categories', null);
      if (cats && Array.isArray(cats) && cats.length > 0) return cats;
    } catch(e) {}
    return ['面料','里料','辅料','无纺衬','其他'];
  },
  setCategories: function(arr) {
    App.store.set('consumption_categories', arr);
  },
  // 填充品名/年份筛选下拉框（保留当前选中值）
  populateFilters: function(data) {
    var nameSel = document.getElementById('filterName');
    var yearSel = document.getElementById('filterYear');
    if (!nameSel || !yearSel) return;
    var curName = nameSel.value;
    var curYear = yearSel.value;
    var names = {};
    (data || []).forEach(function(s){ if (s && s.name) names[s.name] = true; });
    nameSel.innerHTML = '<option value="">全部品名</option>' +
      Object.keys(names).sort().map(function(n){
        return '<option value="' + App.utils.escapeHtml(n) + '"' + (n === curName ? ' selected' : '') + '>' + App.utils.escapeHtml(n) + '</option>';
      }).join('');
    var years = {};
    (data || []).forEach(function(s){
      if (s && s.date) {
        var y = String(s.date).substr(0, 4);
        if (/^\d{4}$/.test(y)) years[y] = true;
      }
    });
    yearSel.innerHTML = '<option value="">全部年份</option>' +
      Object.keys(years).sort().reverse().map(function(y){
        return '<option value="' + y + '"' + (y === curYear ? ' selected' : '') + '>' + y + '</option>';
      }).join('');
  },

  // ===== 数据迁移 + 示例数据 =====
  migrateAndEnsure: function() {
    var arr = this.getConsumptions();
    if (!arr || arr.length === 0) {
      // 尝试迁移旧数据
      try {
        var old = localStorage.getItem('clothing_cost_styles_v3');
        if (old) {
          try {
            var oldArr = JSON.parse(old);
            if (Array.isArray(oldArr) && oldArr.length > 0) {
              var migrated = oldArr.map(function(s){
                return {
                  id: s.id || ('id_m_' + Math.random().toString(36).substr(2,9)),
                  date: s.date || '',
                  designer: s.designer || '',
                  season: s.season || '',
                  styleNo: s.styleNo || '',
                  name: s.name || '',
                  price: s.price || '',
                  styleImg_path: s.styleImg_path || (s.styleImg && s.styleImg.startsWith && s.styleImg.startsWith('data:image') ? s.styleImg : ''),
                  styleImg_name: s.styleImg_name || '',
                  fullImg_path: s.fullImg_path || (s.fullImg && s.fullImg.startsWith && s.fullImg.startsWith('data:image') ? s.fullImg : ''),
                  fullImg_name: s.fullImg_name || '',
                  fabrics: Array.isArray(s.fabrics) ? s.fabrics : [],
                  craft: s.craft || '',
                  specs: Array.isArray(s.specs) ? s.specs : []
                };
              });
              this.setConsumptions(migrated);
              arr = migrated;
            }
          } catch(_e) {}
        }
      } catch(_e) {}
    }

    var cats = App.store.get('consumption_categories', null);
    if (!cats || !Array.isArray(cats) || cats.length === 0) {
      try {
        var oldCat = localStorage.getItem('clothing_cost_categories_v3');
        if (oldCat) {
          try {
            var oldCats = JSON.parse(oldCat);
            if (Array.isArray(oldCats) && oldCats.length > 0) {
              this.setCategories(oldCats);
            }
          } catch(_e) {}
        }
      } catch(_e) {}
    }
    // 确保类别
    var currentCats = this.getCategories();
    if (!currentCats || !Array.isArray(currentCats) || currentCats.length === 0) {
      this.setCategories(['面料','里料','辅料','无纺衬','其他']);
    }
    // 初始化时仅首次注入示例；避免用户删除最后一条后又自动创建一条导致"删除无效"
    var seededKey = '_consumption_seeded_v1';
    try {
      if (!localStorage.getItem(seededKey)) {
        var data = this.getConsumptions();
        if (!data || data.length === 0) {
          this.setConsumptions([this.createSampleStyle()]);
        }
        localStorage.setItem(seededKey, '1');
      }
    } catch(_e) {}
  },

  createSampleStyle: function() {
    return {
      id: this.genId(),
      date: new Date().toISOString().split('T')[0],
      designer: '周',
      season: '2024春夏',
      styleNo: 'GW27-003',
      name: '童裤',
      price: '18',
      styleImg_path: '',
      styleImg_name: '',
      fullImg_path: '',
      fullImg_name: '',
      fabrics: [
        { category: '面料', spec: 'XM-1289', composition: '70%C 30%Tencel', beforeWeight: '260gsm', afterWeight: '290gsm', width: '1.5', spec2: '', consumption: '1.02', part: '大身（腰口滚条）', shrink: '经-5% 纬-1%', remark: '' },
        { category: '面料', spec: '', composition: '', beforeWeight: '', afterWeight: '', width: '1.45', spec2: '', consumption: '1.09', part: '', shrink: '', remark: '' },
        { category: '里料', spec: 'T/C', composition: '', beforeWeight: '', afterWeight: '', width: '1.43', spec2: '', consumption: '0.1', part: '前袋布', shrink: '', remark: '' },

  // ===== 获取 signed URL =====
  getSignedUrl: async function(path) {
    if (!path) return null;
    if (path.startsWith('data:image')) return path;
    // 1) 优先用 JS client（最稳定）
    if (window.supabase) {
      try {
        var sb = window.supabase;
        var BUCKET = window.STORAGE_BUCKET || 'app-photos';
        var res = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
        if (res && !res.error && res.data) return res.data.signedUrl || null;
      } catch(_e) {}
    }
    // 2) REST API 兜底（无需 JS client 就绪）
    if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
      try {
        var BUCKET2 = window.STORAGE_BUCKET || 'app-photos';
        var url = window.SUPABASE_URL + '/storage/v1/object/sign/' + encodeURIComponent(BUCKET2) + '/' + encodeURIComponent(path);
        var resp = await fetch(url, {
          method: 'POST',
          headers: {
            'apikey': window.SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: '{}'
        });
        if (resp.ok) {
          var data = await resp.json();
          if (data && data.signedUrl) return data.signedUrl;
        }
      } catch(_e2) {}
    }
    return null;
  },

  // ===== 根据 prefix 还原 kind（style=款式图 / full=大图） =====
  _kindOfPrefix: function(prefix) {
    return prefix.indexOf('style') >= 0 ? 'style' : (prefix.indexOf('full') >= 0 ? 'full' : 'style');
  },

  // ===== 设置上传框状态 =====
  _setBoxState: function(prefix, state) {
    var box = document.getElementById(prefix + 'box');
    if (!box) return;
    var previewImg = document.getElementById(prefix + 'picPreview');
    var hintEl = box.querySelector('.upload-hint');
    var kind = this._kindOfPrefix(prefix);
    var isStyle = kind === 'style';
    var icon = isStyle ? '📷' : '🏞️';
    var mainText = isStyle ? '点击上传款式图' : '点击上传大图';
    var subText = isStyle ? '' : '（可选，打印时为第2页）';

    if (state === 'empty') {
      box.classList.remove('has-img');
      if (previewImg) { previewImg.src = ''; previewImg.style.display = 'none'; }
      // 重建 upload-hint 占位符
      if (hintEl) { try { box.removeChild(hintEl); } catch(_) {} }
      hintEl = document.createElement('div');
      hintEl.className = 'upload-hint';
      hintEl.innerHTML =
        '<div class="icon camera">' + icon + '</div>' +
        '<div>' + mainText + '</div>' +
        (subText ? '<div style="font-size:11px;margin-top:4px;">' + subText + '</div>' : '');
      box.appendChild(hintEl);
    } else if (state === 'has-img') {
      box.classList.add('has-img');
      if (hintEl) { try { box.removeChild(hintEl); } catch(_) {} }
      if (previewImg) previewImg.style.display = 'block';
    }
  },

  // ===== 上传一张图片到 Supabase，并更新预览/隐藏字段/状态 =====
  // 供 onPicFileChange（本地文件）和 nasPickForCons（NAS 文件）共用
  _uploadPicture: async function(prefix, file) {
    var statusEl = document.getElementById(prefix + 'picStatus');
    var pathEl = document.getElementById(prefix + 'picture_path');
    var nameEl = document.getElementById(prefix + 'picture_name');
    var previewImg = document.getElementById(prefix + 'picPreview');
    var box = document.getElementById(prefix + 'box');
    if (!statusEl || !box || !file) return false;
    var fmtSize = (App && App.utils && typeof App.utils.formatSize === 'function') ? App.utils.formatSize(file.size) : (file.size + ' B');
    if (file.size > 10 * 1024 * 1024) {
      statusEl.className = 'status error';
      statusEl.textContent = '图片超过 10MB 限制（当前 ' + fmtSize + '）';
      return false;
    }
    // 先删除旧图（跳过 base64 data URL）
    var oldPath = (pathEl && pathEl.value) || '';
    if (oldPath && !oldPath.startsWith('data:image') && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
      try { await SupabaseSubmit.deletePicture(oldPath); } catch(e) { console.warn('[consumption] deletePicture warn:', e); }
    }
    statusEl.className = 'status loading';
    statusEl.textContent = '正在上传中... ' + (file.name || '');
    // 先做 base64 兜底（读取文件为 data URL）
    var base64DataUrl = null;
    try {
      base64DataUrl = await this._fileToDataUrl(file);
    } catch(_e) {
      console.warn('[consumption] base64 fallback failed:', _e);
    }
    // 显示本地预览
    try {
      var localUrl = URL.createObjectURL(file);
      if (previewImg) { previewImg.style.display = 'block'; previewImg.src = localUrl; }
      this._setBoxState(prefix, 'has-img');
    } catch(_e) {}
    // 尝试 Supabase 上传
    var supabaseOk = false;
    var supabaseError = null;
    if (!window.SupabaseSubmit || typeof SupabaseSubmit.uploadPicture !== 'function') {
      console.error('[consumption] SupabaseSubmit.uploadPicture 不可用！window.SupabaseSubmit =', !!window.SupabaseSubmit);
      supabaseError = '上传模块未加载';
    } else {
      try {
        var styleNo = '';
        try { var snEl = document.getElementById('c_f_styleNo'); if (snEl) styleNo = (snEl.value || '').trim(); } catch(_) {}
        console.log('[consumption] 尝试上传到 Supabase: bucket=' + (window.STORAGE_BUCKET || 'app-photos') + ', file=' + file.name + ', size=' + file.size + (styleNo ? ', styleNo=' + styleNo : ''));
        var result = await SupabaseSubmit.uploadPicture(file, 'consumption', styleNo);
        if (result && result.path) {
          if (pathEl) pathEl.value = result.path;
          if (nameEl) nameEl.value = result.fileName || file.name;
          statusEl.className = 'status ok';
          statusEl.textContent = '✓ 上传成功：' + (result.fileName || file.name);
          // 尝试用 signed URL 替换 blob 预览
          try {
            var s = await this.getSignedUrl(result.path);
            if (s && previewImg) previewImg.src = s;
          } catch(_x) {}
          supabaseOk = true;
          console.log('[consumption] Supabase 上传成功: path=' + result.path);
        } else {
          supabaseError = '上传返回空结果';
          console.error('[consumption] Supabase upload returned null/empty');
        }
      } catch (err) {
        supabaseError = (err && err.message) || String(err);
        console.error('[consumption] Supabase upload exception:', err);
      }
    }
    // Supabase 上传失败 → 使用 base64 兜底
    if (!supabaseOk && base64DataUrl) {
      console.warn('[consumption] Supabase 上传失败(' + supabaseError + ')，使用 base64 兜底');
      if (pathEl) pathEl.value = base64DataUrl;
      if (nameEl) nameEl.value = file.name || '';
      if (previewImg) previewImg.src = base64DataUrl;
      statusEl.className = 'status error';
      statusEl.textContent = '⚠️ 云端上传失败(' + (supabaseError || '未知原因') + ')，图片仅本地保存';
      // 给用户一个警告 toast
      try { if (App && App.toast) App.toast('⚠️ 云端上传失败：' + (supabaseError || '未知原因') + '，图片仅保存在本地', 'error'); } catch(_) {}
      supabaseOk = true;
    }
    if (!supabaseOk) {
      statusEl.className = 'status error';
      statusEl.textContent = '上传失败：' + (supabaseError || '请重试');
      this._setBoxState(prefix, 'empty');
      try { if (App && App.toast) App.toast('上传失败：' + (supabaseError || '请重试'), 'error'); } catch(_) {}
      return false;
    }
    // 几秒后隐藏 status 条
    var _s = statusEl;
    setTimeout(function(){ if (_s && _s.className.indexOf('ok')>=0) { _s.className = 'status'; _s.textContent = ''; } }, 3000);
    return true;
  },

  // ===== File → base64 data URL =====
  _fileToDataUrl: function(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = function() { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  },

  // ===== 图片上传回调（本地文件） =====
  onPicFileChange: async function(prefix, inputEl) {
    var file = inputEl.files && inputEl.files[0];
    if (!file) return;
    try { await this._uploadPicture(prefix, file); }
    catch(err) { console.error('[consumption] onPicFileChange err:', err); }
    finally { inputEl.value = ''; }
  },

  onPicDelete: async function(prefix) {
    var pathEl = document.getElementById(prefix + 'picture_path');
    var nameEl = document.getElementById(prefix + 'picture_name');
    var statusEl = document.getElementById(prefix + 'picStatus');
    var oldPath = (pathEl && pathEl.value) || '';
    if (oldPath && !oldPath.startsWith('data:image') && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
      try { await SupabaseSubmit.deletePicture(oldPath); } catch(e) { console.warn('[consumption] deletePicture warn:', e); }
    }
    if (pathEl) pathEl.value = '';
    if (nameEl) nameEl.value = '';
    if (statusEl) { statusEl.className = 'status'; statusEl.textContent = ''; }
    this._setBoxState(prefix, 'empty');
    return false;
  },

  hydratePicPreview: async function(prefix) {
    var pathEl = document.getElementById(prefix + 'picture_path');
    var previewImg = document.getElementById(prefix + 'picPreview');
    if (!pathEl || !previewImg) return;
    var p = pathEl.value; if (!p) return;
    // base64 data URL → 直接显示
    if (p.startsWith('data:image')) {
      previewImg.src = p;
      previewImg.style.display = 'block';
      this._setBoxState(prefix, 'has-img');
      return;
    }
    try {
      var signed = await this.getSignedUrl(p);
      if (signed) { previewImg.src = signed; previewImg.style.display = 'block'; this._setBoxState(prefix, 'has-img'); return; }
    } catch(_e) {}
    // 兜底：用直接下载 URL
    var bucket = window.STORAGE_BUCKET || 'app-photos';
    var directUrl = (window.SUPABASE_URL || '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + encodeURIComponent(p);
    previewImg.src = directUrl;
    previewImg.style.display = 'block';
    this._setBoxState(prefix, 'has-img');
    var self = this;
    previewImg.onerror = function() {
      previewImg.onerror = null;
      self._setBoxState(prefix, 'empty');
      var statusEl = document.getElementById(prefix + 'picStatus');
      if (statusEl) { statusEl.className = 'status error'; statusEl.textContent = '图片加载失败，请重新上传'; }
    };
  },

        '<button type="button" class="nas-pick-btn" id="' + prefix + 'nasBtn" onclick="event.stopPropagation(); nasPickForCons(\'' + prefixSafe + '\')">' +
          nasBtnSvg + ' 从NAS选择' +
        '</button>' +
      '</div>' +
    '</div>';
  },

    // 自动从缓存回查图片（按款号共享）
    setTimeout(function(){ self.autoPopulateImagesFromCache(); }, 100);
  },

  // ===== 按款号自动从缓存回查图片（缓存未命中则搜索 Supabase Storage）=====
  autoPopulateImagesFromCache: function() {
    var self = this;
    var styleNoEl = document.getElementById('c_f_styleNo');
    if (!styleNoEl) return;
    var styleNo = styleNoEl.value.trim();
    if (!styleNo) return;
    // 如果当前记录已有图片，不覆盖
    var stylePath = document.getElementById('c_style_picture_path');
    var fullPath = document.getElementById('c_full_picture_path');
    var hasCurrentStyle = stylePath && stylePath.value;
    var hasCurrentFull = fullPath && fullPath.value;
    if (hasCurrentStyle && hasCurrentFull) return;

    var done = function(cached, fromWhere) {
      if (!cached) return;
      var populated = false;
      if (!hasCurrentStyle && cached.styleImg_path) {
        stylePath.value = cached.styleImg_path;
        var nameEl = document.getElementById('c_style_picture_name');
        if (nameEl) nameEl.value = cached.styleImg_name || '';
        var previewImg = document.getElementById('c_style_picPreview');
        if (previewImg) {
          previewImg.src = cached.styleImg_signed || cached.styleImg_path;
          previewImg.style.display = 'block';
        }
        var placeholder = document.getElementById('c_style_PicturePlaceholder') || document.querySelector('#c_style_box .upload-hint');
        if (placeholder) placeholder.style.display = 'none';
        var sbox = document.getElementById('c_style_box');
        if (sbox) sbox.classList.add('has-img');
        populated = true;
      }
      if (!hasCurrentFull && cached.fullImg_path) {
        fullPath.value = cached.fullImg_path;
        var nameEl2 = document.getElementById('c_full_picture_name');
        if (nameEl2) nameEl2.value = cached.fullImg_name || '';
        var previewImg2 = document.getElementById('c_full_picPreview');
        if (previewImg2) {
          previewImg2.src = cached.fullImg_signed || cached.fullImg_path;
          previewImg2.style.display = 'block';
        }
        var placeholder2 = document.getElementById('c_full_PicturePlaceholder') || document.querySelector('#c_full_box .upload-hint');
        if (placeholder2) placeholder2.style.display = 'none';
        var fbox = document.getElementById('c_full_box');
        if (fbox) fbox.classList.add('has-img');
        populated = true;
      }
      if (populated && window.StyleImgCache) {
        StyleImgCache.set(styleNo, {
          styleImg_path: cached.styleImg_path,
          styleImg_name: cached.styleImg_name,
          fullImg_path: cached.fullImg_path,
          fullImg_name: cached.fullImg_name
        });
        console.log('[consumption] ' + fromWhere + '，款号=' + styleNo);
        try { if (App && App.toast) App.toast('已自动加载款号 ' + styleNo + ' 的图片（' + fromWhere + '）', 'info', 2200); } catch(_) {}
      }
    };

    // 策略1：先查缓存
    if (window.StyleImgCache) {
      var cached = StyleImgCache.resolve(styleNo);
      if (cached && (cached.styleImg_path || cached.fullImg_path)) {
        done(cached, '缓存');
        return;
      }
    }

    // 策略2：去 Supabase Storage 按款号搜索文件名
    if (window.SupabaseSubmit && typeof SupabaseSubmit.findStyleImages === 'function') {
      try {
        if (App && App.toast) App.toast('正在从云端查找款号 ' + styleNo + ' 的图片…', 'info', 1500);
        SupabaseSubmit.findStyleImages(styleNo).then(function(result){
          if (result) done(result, '云端');
        }).catch(function(e){ console.warn('[consumption] findStyleImages 失败', e); });
      } catch(_err) {}
    }
  },

    clearTimeout(self._styleNoTimer);
    self._styleNoTimer = setTimeout(function(){ self.autoPopulateImagesFromCache(); }, 400);

  saveCategories: function() {
    var newCats = (window.Cons.tmpCats || []).map(function(c){ return (c || '').trim(); }).filter(Boolean);
    if (newCats.length === 0) { alert('至少保留一个类别'); return; }
    // 确保未分类 作为 fallback
    var oldCats = this.getCategories();
    var removed = oldCats.filter(function(c){ return newCats.indexOf(c) < 0; });
    if (removed.length > 0) {
      // 清理数据中已删除的类别
      var data = this.getConsumptions();
      var changed = false;
      data.forEach(function(s){
        (s.fabrics || []).forEach(function(f){
          if (removed.indexOf(f.category) >= 0) { f.category = '未分类'; changed = true; }
        });
      });
      if (changed) this.setConsumptions(data);
    }
    this.setCategories(newCats);
    App.modal.close();
    App.toast('类别已更新', 'success');
    // 重新渲染编辑器面料表格
    if (this.editingId !== undefined || document.getElementById('c_fabricBody')) {
      this.renderFabricTable();
    }
  },

  // ===== 保存款号 =====
  saveStyle: function() {
    var self = this;
    var styleNo = (document.getElementById('c_f_styleNo').value || '').trim();
    if (!styleNo) {
      alert('请输入款号！');
      document.getElementById('c_f_styleNo').focus();
      return;
    }
    var styleImg_path = (document.getElementById('c_style_picture_path') || {}).value || '';
    var styleImg_name = (document.getElementById('c_style_picture_name') || {}).value || '';
    var fullImg_path = (document.getElementById('c_full_picture_path') || {}).value || '';
    var fullImg_name = (document.getElementById('c_full_picture_name') || {}).value || '';

    var obj = {
      id: self.editingId || self.genId(),
      date: (document.getElementById('c_f_date').value || '').trim(),
      designer: (document.getElementById('c_f_designer').value || '').trim(),
      season: (document.getElementById('c_f_season').value || '').trim(),
      styleNo: styleNo,
      name: (document.getElementById('c_f_name').value || '').trim(),
      price: (document.getElementById('c_f_price').value || '').trim(),
      styleImg_path: styleImg_path,
      styleImg_name: styleImg_name,
      fullImg_path: fullImg_path,
      fullImg_name: fullImg_name,
      fabrics: JSON.parse(JSON.stringify(self.fabricData || [])),
      craft: (document.getElementById('c_f_craft').value || '').trim(),
      remark: (document.getElementById('c_f_remark').value || '').trim(),
      specs: JSON.parse(JSON.stringify(self.specData || []))
    };

    var data = self.getConsumptions();
    var dupIdx = data.findIndex(function(s){ return s.styleNo === obj.styleNo && s.id !== obj.id; });
    if (dupIdx >= 0) {
      if (!confirm('款号【' + obj.styleNo + '】已存在，是否仍保存（将重复）？')) return;
    }

    if (self.editingId) {
      var idx = data.findIndex(function(s){ return s.id === self.editingId; });
      if (idx >= 0) {
        // 图片若被替换且旧图不同，删除旧图（已在上传时处理，这里仅兜底比较）
        var old = data[idx];
        data[idx] = obj;
      } else {
        data.push(obj);
      }
    } else {
      data.push(obj);
    }
    self.setConsumptions(data);
    // 更新款式图片共享缓存
    if (window.StyleImgCache) {
      StyleImgCache.updateIfChanged(obj.styleNo, {
        styleImg_path: obj.styleImg_path,
        styleImg_name: obj.styleImg_name,
        fullImg_path: obj.fullImg_path,
        fullImg_name: obj.fullImg_name
      });
    }
    App.toast('保存成功', 'success');
    App.modal.close();
    renderAll();
  },

  // ===== 删除款号 =====
  deleteStyle: function(id) {
    var self = this;
    if (!confirm('确认删除该款号？此操作不可撤销。')) return;
    var data = self.getConsumptions();
    var idx = data.findIndex(function(s){ return s.id === id; });
    if (idx < 0) return;
    var item = data[idx];
    // 检查图片是否被其他款号共享引用（缓存中）
    var isSharedStyle = window.StyleImgCache && item.styleImg_path && !item.styleImg_path.startsWith('data:image') && StyleImgCache.isShared(item.styleImg_path, item.styleNo);
    var isSharedFull = window.StyleImgCache && item.fullImg_path && !item.fullImg_path.startsWith('data:image') && StyleImgCache.isShared(item.fullImg_path, item.styleNo);
    // 删除图片（跳过 base64 data URL 和被共享引用的图片）
    if (item.styleImg_path && !item.styleImg_path.startsWith('data:image') && !isSharedStyle && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
      try { SupabaseSubmit.deletePicture(item.styleImg_path); } catch(e) {}
    }
    if (item.fullImg_path && !item.fullImg_path.startsWith('data:image') && !isSharedFull && window.SupabaseSubmit && typeof SupabaseSubmit.deletePicture === 'function') {
      try { SupabaseSubmit.deletePicture(item.fullImg_path); } catch(e) {}
    }
    // 从缓存中移除该款号
    if (window.StyleImgCache && item.styleNo) {
      // 只有当没有其他模块引用此款号的图片时才移除
      var stillReferenced = false;
      try {
        var orders = App.store.get('orders', []);
        stillReferenced = orders.some(function(o){ return o.styleNo === item.styleNo && (o.styleImg_path || o.fullImg_path); });
      } catch(_e) {}
      if (!stillReferenced) StyleImgCache.remove(item.styleNo);
    }
    data.splice(idx, 1);
    self.setConsumptions(data);
    App.toast('已删除', 'success');
    renderAll();
  },

  // ===== 全屏图片查看器 =====
  openFullscreen: function(imgs, startIdx) {
    if (!imgs || imgs.length === 0) return;
    var self = this;
    self.fullscreenImgs = imgs;
    self.fullscreenIdx = startIdx || 0;
    self.updateFullscreenImg();
    document.getElementById('fullscreenOverlay').classList.add('active');
  },
  // 按款号打开全屏（卡片自身没存图时使用，先查再显示）
  openFullscreenByStyleNo: async function(styleNo, styleId) {
    if (!styleNo) return;
    var self = this;
    try { if (App && App.toast) App.toast('正在查找款号 ' + styleNo + ' 的图片…', 'info', 1200); } catch(_) {}
    var imgs = null;
    if (window.getStyleImagesForStyleNo) {
      try { imgs = await getStyleImagesForStyleNo(styleNo); } catch(_e) {}
    }
    var paths = [];
    if (imgs) {
      if (imgs.styleImg_path) paths.push(imgs.styleImg_path);
      if (imgs.fullImg_path)  paths.push(imgs.fullImg_path);
    }
    // 兜底：从 thumb 缓存中取回已渲染的 URL
    if (paths.length === 0 && styleId) {
      var t = document.querySelector('.style-thumb[data-style-id="' + styleId + '"]');
      if (t) {
        var img = t.querySelector('img');
        if (img && img.src && /^https?:/i.test(img.src)) { self.openFullscreen([img.src], 0); return; }
      }
    }
    if (paths.length > 0) self.openFullscreen(paths, 0);
    else try { if (App && App.toast) App.toast('未找到款号 ' + styleNo + ' 的图片', 'warning'); } catch(_) {}
  },
  updateFullscreenImg: async function() {
    var self = this;
    var imgEl = document.getElementById('fullscreenImg');
    var cap = document.getElementById('fullscreenCaption');
    if (!imgEl) return;
    var src = self.fullscreenImgs[self.fullscreenIdx] || '';
    imgEl.src = '';
    if (!src) return;
    var resolved = src;
    if (!src.startsWith('data:image') && !/^https?:\/\//i.test(src) && window.resolveImageUrl) {
      resolved = await resolveImageUrl(src) || src;
    }
    if (!resolved && !src.startsWith('data:image') && !/^https?:\/\//i.test(src)) {
      var bucket = window.STORAGE_BUCKET || 'app-photos';
      resolved = (window.SUPABASE_URL || '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + encodeURIComponent(src);
    }
    imgEl.src = resolved;
    cap.textContent = (self.fullscreenIdx + 1) + ' / ' + Math.max(1, self.fullscreenImgs.length);
  },
  navFullscreen: function(dir) {
    var self = this;
    var n = self.fullscreenImgs.length;
    self.fullscreenIdx = (self.fullscreenIdx + dir + n) % n;
    self.updateFullscreenImg();
  },
  closeFullscreen: function(e) {
    if (e && e.target && e.target.closest('.fullscreen-img-wrap')) return;
    this.closeFullscreenDirect();
  },
  closeFullscreenDirect: function() {
    document.getElementById('fullscreenOverlay').classList.remove('active');
    var imgEl = document.getElementById('fullscreenImg');
    if (imgEl) imgEl.src = '';
    this.fullscreenImgs = [];
    this.fullscreenIdx = 0;
  },
  onFullscreenKeydown: function(e) {
    if (!document.getElementById('fullscreenOverlay').classList.contains('active')) return;
    if (e.key === 'Escape') { this.closeFullscreenDirect(); }
    else if (e.key === 'ArrowLeft') { this.navFullscreen(-1); }
    else if (e.key === 'ArrowRight') { this.navFullscreen(1); }
  },

  // ===== 对比功能 =====
  updateCompareDatalist: function() {
    var data = this.getConsumptions();
    var dl = document.getElementById('compareDatalist');
    if (!dl) return;
    dl.innerHTML = data.map(function(s){
      return '<option value="' + App.utils.escapeHtml(s.styleNo) + '">' + App.utils.escapeHtml(s.name || '') + '</option>';
    }).join('');
  },
  onCompareKeydown: function(e) {
    if (e.key === 'Enter') { e.preventDefault(); this.addToCompare(); }
  },
  addToCompare: function() {
    var input = document.getElementById('compareSelect');
    var val = (input.value || '').trim();
    if (!val) return;
    var data = this.getConsumptions();
    var found = data.find(function(s){ return s.id === val; })
             || data.find(function(s){ return s.styleNo === val; })
             || data.find(function(s){ return (s.styleNo || '').toLowerCase() === val.toLowerCase(); });
    if (!found) { App.toast('未找到对应款号', 'error'); return; }
    if (this.compareList.indexOf(found.id) >= 0) { App.toast('该款号已在对比列表', 'warning'); return; }
    this.compareList.push(found.id);
    input.value = '';
    this.renderCompareTags();
    renderCompareTable();

Cons.navThumb = function(el, styleId, dir) {
  var thumb = el.closest('.style-thumb');
  if (!thumb) return;
  var data = Cons.getConsumptions();
  var s = data.find(function(x){ return x.id === styleId; });
  var imgs = [];
  if (s) {
    if (s.styleImg_path) imgs.push(s.styleImg_path);
    if (s.fullImg_path)  imgs.push(s.fullImg_path);
  }
  // 兜底：如果自身没图，但是 backfill 填充过的，取 backfill-paths
  if (imgs.length === 0) {
    var raw = thumb.getAttribute('data-backfill-paths');
    if (raw) {
      try { imgs = JSON.parse(raw); } catch(_) {}
    }
  }
  if (!imgs || imgs.length < 2) return;
  var idx = parseInt(thumb.dataset.thumbIdx || '0', 10);
  idx = (idx + dir + imgs.length) % imgs.length;
  thumb.dataset.thumbIdx = String(idx);
  var imgEl = thumb.querySelector('img');
  var dots = thumb.querySelectorAll('.thumb-dot');
  dots.forEach(function(d, i){ d.classList.toggle('active', i === idx); });
  if (!imgEl) return;
  var p = imgs[idx];
  if (p && p.startsWith('data:image')) { imgEl.src = p; return; }
  (async function(){
    var src = window.resolveImageUrl ? (await resolveImageUrl(p)) : (await Cons.getSignedUrl(p));
    if (src) { imgEl.src = src; return; }
    var bucket = window.STORAGE_BUCKET || 'app-photos';
    var directUrl = (window.SUPABASE_URL || '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + encodeURIComponent(p);
    imgEl.src = directUrl;
  })();
};

function hydrateThumbImages() {
  var imgs = document.querySelectorAll('#styleGrid .style-thumb img[data-cons-path]');
  imgs.forEach(function(img){
    var p = img.getAttribute('data-cons-path');
    if (!p) return;
    if (p.startsWith('data:image')) {
      img.src = p; img.style.display = 'block'; return;
    }
    (async function(){
      var src = window.resolveImageUrl ? (await resolveImageUrl(p)) : (await Cons.getSignedUrl(p));
      if (!src) {
        var bucket = window.STORAGE_BUCKET || 'app-photos';
        src = (window.SUPABASE_URL || '') + '/storage/v1/object/public/' + encodeURIComponent(bucket) + '/' + encodeURIComponent(p);
      }
      img.src = src; img.style.display = 'block';
    })();
  });
}

/**
 * 按款号云端搜索并回填卡片图（只回填自身没图但 data-style-no-backfill 标记的 img）
 * 同一 styleNo 去重搜索一次，批处理避免重复请求
 */
async function backfillThumbImagesByStyleNo() {
  if (!window.getStyleImagesForStyleNo) return;
  var imgs = document.querySelectorAll('#styleGrid .style-thumb img[data-style-no-backfill]');
  if (imgs.length === 0) return;

  // 收集去重
  var groups = {};
  imgs.forEach(function(img){
    var sn = (img.getAttribute('data-style-no-backfill') || '').trim();
    if (!sn) return;
    (groups[sn] = groups[sn] || []).push(img);
  });

  var styleNos = Object.keys(groups);
  for (var i = 0; i < styleNos.length; i++) {
    (async function(sn, elements){
      try {
        var result = await getStyleImagesForStyleNo(sn);
        if (!result) {
          // 没找到：替换占位文字为「暂无图片」
          elements.forEach(function(img){
            var thumb = img.closest('.style-thumb');
            var ph = thumb ? thumb.querySelector('.placeholder-text') : null;
            if (ph) ph.textContent = '📷 暂无图片';
          });
          return;
        }
        var pathToUse = result.styleImg_signed || null;
        var pathStorage = result.styleImg_path || '';
        var pathsForFullscreen = [];
        if (result.styleImg_path) pathsForFullscreen.push(result.styleImg_path);
        if (result.fullImg_path)  pathsForFullscreen.push(result.fullImg_path);
        if (!pathToUse && pathStorage && window.resolveImageUrl) pathToUse = await resolveImageUrl(pathStorage);

        elements.forEach(function(img){
          var styleId = img.getAttribute('data-style-id') || '';
          var thumb = img.closest('.style-thumb');
          if (pathToUse) {
            img.src = pathToUse;
            img.style.display = 'block';
            var ph = thumb ? thumb.querySelector('.placeholder-text') : null;
            if (ph) ph.style.display = 'none';
            if (thumb) thumb.classList.add('has-backfilled');
            // 更新缩略图点击 onclick（已有的 openFullscreenByStyleNo 保持可用）
            if (thumb && pathsForFullscreen.length > 0 && styleId) {
              // 保留原 onclick（openFullscreenByStyleNo），它会再次查找（缓存已在）
            }
            // 若有 2 张图，给缩略图加上向前向后切换
            if (thumb && pathsForFullscreen.length >= 2) {
              // 把 backfilled 的 paths 存到 thumb 上，供 navThumb 使用
              thumb.setAttribute('data-backfill-paths', JSON.stringify(pathsForFullscreen));
              var dotsWrap = thumb.querySelector('.thumb-dots');
              if (dotsWrap) dotsWrap.innerHTML = pathsForFullscreen.map(function(_,k){return '<div class="thumb-dot '+(k===0?'active':'')+'"></div>';}).join('');
              // 加 prev/next 按钮
              var hasPrev = thumb.querySelector('.thumb-nav.prev');
              if (!hasPrev) {
                var prev = document.createElement('div'); prev.className = 'thumb-nav prev'; prev.innerHTML = '&#10094;';
                prev.setAttribute('onclick', "event.stopPropagation(); Cons.navThumb(this, '" + styleId + "', -1);");
                var next = document.createElement('div'); next.className = 'thumb-nav next'; next.innerHTML = '&#10095;';
                next.setAttribute('onclick', "event.stopPropagation(); Cons.navThumb(this, '" + styleId + "', 1);");
                thumb.insertBefore(prev, thumb.firstChild);
                thumb.appendChild(next);
              }
            }
          } else {
            var ph2 = thumb ? thumb.querySelector('.placeholder-text') : null;
            if (ph2) ph2.textContent = '📷 暂无图片';
          }
        });
      } catch(_err) {}
    })(styleNos[i], groups[styleNos[i]]);
    // 串行间隔一下，避免瞬间并发太多 Supabase 请求
    if (i < styleNos.length - 1) await new Promise(function(r){ setTimeout(r, 60); });
  }
}

async function nasPickForCons(prefix) {

  try {
    if (nasBtn) { nasBtn.disabled = true; nasBtn.style.opacity = .6; }
    var picks = await App.pickFromNas({ multi:false, filter:'images', view:'large' });
    if (!picks || picks.length === 0) return; // 用户取消
    var pick = picks[0];
    if (nasBtn) nasBtn.textContent = '⬇ 正在下载「' + pick.name + '」...';
    var got = await App.utils.nasFetchAsFile(pick.logicPath);

      if (nasBtnInner) {

  if (Cons.compareList.length === 0) {
    container.innerHTML = '<div class="empty-state">' +
      '<div class="empty-icon">📊</div><p>请从上方选择款号进行对比</p></div>';
    return;
  }
  var data = Cons.getConsumptions();
  var list = Cons.compareList.map(function(id){ return data.find(function(s){ return s.id === id; }); }).filter(Boolean);
  if (list.length === 0) return;
  container.innerHTML = buildCompareTableHTML(list, false);
}

function buildCompareTableHTML(list, forPrint) {
  var allFabricFields = ['spec', 'composition', 'beforeWeight', 'afterWeight', 'width', 'spec2', 'consumption', 'part', 'shrink', 'remark'];
  var fabricFieldNames = {
    spec: '规格（名称）', composition: '成份', beforeWeight: '洗前克重', afterWeight: '洗后克重',
    width: '门幅（米）', spec2: '规格', consumption: '耗料（米）', part: '使用部位', shrink: '缩率', remark: '备注'
  };
  var allSpecParts = [];
  var specSeen = {};
  list.forEach(function(s){
    (s.specs || []).forEach(function(sp){
      if (sp.part && !specSeen[sp.part]) { specSeen[sp.part] = true; allSpecParts.push(sp.part); }
    });
  });

  function isEmpty(v) { return !v || (typeof v === 'string' && (v.trim() === '' || v === '-')); }
  function allEmpty(values) { return values.every(function(v){ return isEmpty(v); }); }

  var html = '<table class="compare-table"><thead><tr>';
  html += '<th class="field-name">对比项</th>';
  list.forEach(function(s){
    html += '<th>' + App.utils.escapeHtml(s.styleNo) + (s.name ? '<br><small style="font-weight:normal;color:var(--muted);">' + App.utils.escapeHtml(s.name) + '</small>' : '') + '</th>';
  });
  html += '</tr></thead><tbody>';

  // 基本信息
  var hasBasic = false, basicHtml = '';
  [['date','日期'],['designer','设计师'],['season','Season'],['styleNo','款号'],['name','品名'],['price','工费'],['craft','特殊工艺'],['remark','备注']].forEach(function(kv){
    var k = kv[0], label = kv[1];
    var values = list.map(function(s){ var v = s[k]; return (v === undefined || v === null || v === '') ? '-' : String(v); });
    if (allEmpty(values)) return;
    hasBasic = true;
    var allSame = values.every(function(v){ return v === values[0]; });
    basicHtml += '<tr><td class="field-name">' + label + '</td>';
    values.forEach(function(v){
      basicHtml += '<td' + (!allSame ? ' class="diff-highlight"' : '') + '>' + App.utils.escapeHtml(v) + '</td>';
    });
    basicHtml += '</tr>';
  });
  if (hasBasic) {
    html += '<tr class="section-header"><td colspan="' + (list.length + 1) + '">基本信息</td></tr>' + basicHtml;
  }

  // 面料按类别分组
  var cats = Cons.getCategories();
  var allCats = [];
  var catSet = {};
  cats.forEach(function(c){ catSet[c] = true; allCats.push(c); });
  list.forEach(function(s){ (s.fabrics || []).forEach(function(f){
    if (f.category && !catSet[f.category]) { catSet[f.category] = true; allCats.push(f.category); }
  });});
  allCats.forEach(function(cat){
    var maxRows = Math.max.apply(null, list.map(function(s){
      return (s.fabrics || []).filter(function(f){ return f.category === cat; }).length;
    }));
    if (maxRows <= 0) return;
    var catHtml = '';
    var hasContent = false;
    for (var i = 0; i < maxRows; i++) {
      allFabricFields.forEach(function(field){
        var rowValues = list.map(function(s){
          var items = (s.fabrics || []).filter(function(f){ return f.category === cat; });
          return (items[i] && items[i][field]) ? String(items[i][field]) : '-';
        });
        if (allEmpty(rowValues)) return;
        hasContent = true;
        var defVal = rowValues[0];
        var allSame = rowValues.every(function(v){ return v === defVal; });
        catHtml += '<tr><td class="field-name">' + App.utils.escapeHtml(cat) + (i+1) + ' - ' + fabricFieldNames[field] + '</td>';
        rowValues.forEach(function(v){
          var needDiff = !allSame && !isEmpty(v);
          catHtml += '<td' + (needDiff ? ' class="diff-highlight"' : '') + '>' + App.utils.escapeHtml(v) + '</td>';
        });
        catHtml += '</tr>';
      });
    }
    if (hasContent) {
      html += '<tr class="section-header"><td colspan="' + (list.length + 1) + '">' + App.utils.escapeHtml(cat) + '</td></tr>' + catHtml;
    }
  });

  // 规格尺寸 - 尺寸
  if (allSpecParts.length > 0) {
    var sizeHtml = '', hasSize = false;
    allSpecParts.forEach(function(part){
      var values = list.map(function(s){
        var sp = (s.specs || []).find(function(p){ return p.part === part; });
        return (sp && sp.size) ? String(sp.size) : '-';
      });
      if (allEmpty(values)) return;
      hasSize = true;
      var allSame = values.every(function(v){ return v === values[0]; });
      sizeHtml += '<tr><td class="field-name">' + App.utils.escapeHtml(part) + ' (cm)</td>';
      values.forEach(function(v){
        sizeHtml += '<td' + (!allSame && !isEmpty(v) ? ' class="diff-highlight"' : '') + '>' + App.utils.escapeHtml(v) + '</td>';
      });
      sizeHtml += '</tr>';
    });
    if (hasSize) {
      html += '<tr class="section-header"><td colspan="' + (list.length + 1) + '">规格尺寸 - 尺寸</td></tr>' + sizeHtml;
    }
    // 备注
    var remHtml = '', hasRem = false;
    allSpecParts.forEach(function(part){
      var values = list.map(function(s){
        var sp = (s.specs || []).find(function(p){ return p.part === part; });
        return (sp && sp.remark) ? String(sp.remark) : '-';
      });
      if (allEmpty(values)) return;
      hasRem = true;
      var allSame = values.every(function(v){ return v === values[0]; });
      remHtml += '<tr><td class="field-name">' + App.utils.escapeHtml(part) + ' - 常规档差</td>';
      values.forEach(function(v){
        remHtml += '<td' + (!allSame && !isEmpty(v) ? ' class="diff-highlight"' : '') + '>' + App.utils.escapeHtml(v) + '</td>';
      });
      remHtml += '</tr>';
    });
    if (hasRem) {
      html += '<tr class="section-header"><td colspan="' + (list.length + 1) + '">规格尺寸 - 常规档差</td></tr>' + remHtml;
    }
  }
  html += '</tbody></table>';
  return html;
}

// ===== 打印 HTML =====

  var html = '';

    '<div class="print-info-left">' +

      '<div class="print-info-line"><span class="print-label">Season：</span><span class="print-tag tag-yellow">' + App.utils.escapeHtml(style.season || '-') + '</span></div>' +
      '<div class="print-info-line"><span class="print-label">款号：</span><span class="print-tag tag-red">' + App.utils.escapeHtml(style.styleNo || '-') + '</span></div>' +
      '<div class="print-info-line"><span class="print-label">品名：</span><span class="print-tag tag-red">' + App.utils.escapeHtml(style.name || '-') + '</span></div>' +
      '<div class="print-info-line"><span class="print-label">工费：</span><span class="print-tag tag-green">' + App.utils.escapeHtml(style.price || '-') + ' 元</span></div>' +
    '</div>' +
    '<div class="print-title-right">Counter用料表<div class="print-date">收到样衣/资料日期：' + App.utils.escapeHtml(style.date || '-') + '</div></div>' +
  '</div>';

  // 款式图小图
  html += '<div class="print-style-img">';

  else html += '<span style="color:#999;font-size:10px;">款式图</span>';
  html += '</div>';

  // 面料表
  if (style.fabrics && style.fabrics.length > 0) {
    html += '<div class="print-section"><h4>面料 / 辅料明细</h4>';
    html += '<table class="print-table"><thead><tr>' +
      '<th style="width:40px;">类别</th><th>规格名称</th><th style="width:70px;">成份</th>' +
      '<th style="width:55px;">洗前<br>克重</th><th style="width:55px;">洗后<br>克重</th>' +
      '<th style="width:42px;">有效门幅</th><th style="width:40px;">规格</th>' +
      '<th style="width:42px;">耗料</th><th style="width:75px;">使用部位</th>' +
      '<th style="width:65px;">缩率</th><th style="width:65px;">备注</th>' +
    '</tr></thead><tbody>';
    var curCat = '';
    style.fabrics.forEach(function(f){
      var showCat = f.category !== curCat;
      curCat = f.category;
      html += '<tr>' +
        '<td>' + (showCat ? App.utils.escapeHtml(f.category || '') : '') + '</td>' +
        '<td style="white-space:pre-wrap;">' + App.utils.escapeHtml(f.spec || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.composition || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.beforeWeight || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.afterWeight || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.width || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.spec2 || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.consumption || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.part || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.shrink || '') + '</td>' +
        '<td>' + App.utils.escapeHtml(f.remark || '') + '</td>' +

    });
    html += '</tbody></table></div>';
  }

  // 工艺
  html += '<div class="print-section"><h4>特殊工艺说明</h4><div class="print-craft">' + App.utils.escapeHtml(style.craft || '-') + '</div></div>';

  // 备注
  if (style.remark && style.remark.trim()) {

      '<span>打印人：' + userName + '</span>' +
      '<span>第 2 页 / 共 ' + totalPages + ' 页</span>' +
    '</div></div>';
  }
  return html;
}

// ===== renderAll =====
function renderAll() {
  // 数据保证（仅初始化迁移用，不再自动创建示例数据）
  Cons.migrateAndEnsure();
  // 更新新增按钮显示偏好
  try {
    var btn = document.getElementById('btnAddStyle');
    if (btn) {
      var iconsOnly = App.preferences && App.preferences.get && App.preferences.get('iconsOnly');
      if (iconsOnly) { btn.textContent = '➕'; }
      else { btn.textContent = '➕ 新增款号'; }
    }
  } catch(_e) {}
  // 按当前 Tab 渲染
  if (Cons.currentTab === 'compare') {
    Cons.updateCompareDatalist();
    Cons.renderCompareTags();
    renderCompareTable();
  } else {
    renderList();
    Cons.updateCompareDatalist();
  }
}

// 键盘监听（全屏图片）
document.addEventListener('keydown', function(e){ Cons.onFullscreenKeydown(e); }, true);

// 页面就绪后首渲染
document.addEventListener('DOMContentLoaded', function(){ renderAll(); });
// 兜底：若 DOMContentLoaded 已过
if (document.readyState === 'interactive' || document.readyState === 'complete') {
  setTimeout(function(){ renderAll(); }, 0);
}
