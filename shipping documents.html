<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装箱单管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f1f5f9;--card-bg:#fff;
  --border:#cbd5e1;--text:#1e293b;--text-light:#64748b;--success:#16a34a;
  --danger:#dc2626;--warning:#d97706;--header-yellow:#ffff00;
}
body{font-family:Arial,sans-serif;font-size:13px;background:var(--bg);color:var(--text);}
/* Tab Bar */
.tab-bar{display:flex;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.tab-btn{flex:1;padding:10px 16px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn:hover{background:#f8fafc;color:var(--text);}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:#eff6ff;}
.tab-btn .icon{font-size:15px;}
/* Tab Content */
.tab-content{display:none;padding:16px;max-width:1400px;margin:0 auto;}
.tab-content.active{display:block;}
/* Form Sections */
.section{background:var(--card-bg);border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
.section-title{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-group label{font-size:11px;font-weight:600;color:var(--text-light);}
.form-group input,.form-group select,.form-group textarea{padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.1);}
.form-group input[readonly]{background:#f8fafc;color:var(--text-light);}
.form-group input.input-empty,.form-group textarea.input-empty{background:#fffbeb;border-color:#fcd34d;}
/* Buttons */
.btn{padding:6px 12px;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#15803d;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#b91c1c;}
.btn-warning{background:var(--warning);color:#fff;}
.btn-warning:hover{background:#b45309;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:#f8fafc;border-color:var(--primary);}
.btn-sm{padding:3px 8px;font-size:11px;}
.btn-icon{padding:4px 7px;font-size:13px;line-height:1;}
/* Carton Table */
.table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:11px;}
.data-table th{background:#f1f5f9;padding:4px 6px;text-align:center;border:1px solid var(--border);font-weight:600;white-space:nowrap;}
.data-table td{padding:4px 6px;border:1px solid var(--border);text-align:center;}
.data-table td input{width:100%;padding:3px 4px;border:1px solid transparent;border-radius:3px;font-size:11px;text-align:center;font-family:inherit;background:transparent;}
.data-table td input:focus{outline:none;border-color:var(--primary);background:#fff;}
.data-table td input[readonly]{font-weight:600;color:var(--primary);}
.data-table .col-del{width:30px;}
.data-table .total-row td{background:#eff6ff;font-weight:700;}
/* Size Manager */
.size-manager{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.size-tag{display:inline-flex;align-items:center;gap:4px;background:#e0e7ff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;}
.size-tag .remove{cursor:pointer;color:var(--danger);font-weight:bold;}
.size-input{width:50px;padding:3px 6px;border:1px solid var(--border);border-radius:3px;font-size:11px;text-align:center;}
/* Order Qty Table */
.order-qty-table{width:100%;border-collapse:collapse;font-size:11px;}
.order-qty-table th{background:#f1f5f9;padding:5px;border:1px solid var(--border);text-align:center;}
.order-qty-table td{padding:5px;border:1px solid var(--border);text-align:center;}
.order-qty-table td input{width:100%;padding:3px;border:1px solid transparent;text-align:center;font-size:11px;font-family:inherit;background:transparent;}
.order-qty-table td input:focus{outline:none;border-color:var(--primary);background:#fff;}
/* Cards */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.record-card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 2px 4px rgba(0,0,0,.06);border:1px solid var(--border);transition:box-shadow .2s;cursor:pointer;position:relative;}
.record-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);}
.record-card .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.record-card .card-style{font-size:15px;font-weight:700;color:var(--primary);}
.record-card .card-date{font-size:10px;color:var(--text-light);}
.record-card .card-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
.record-card .card-info .label{color:var(--text-light);font-size:11px;}
.record-card .card-info .value{font-weight:600;}
.record-card .card-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.record-card .stat{flex:1;text-align:center;}
.record-card .stat .num{font-size:16px;font-weight:700;color:var(--primary);}
.record-card .stat .lbl{font-size:10px;color:var(--text-light);}
.record-card .card-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.record-card .card-actions .btn{flex:1;justify-content:center;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}
/* PL Document */
.pl-toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;}
.pl-select{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;min-width:300px;}
.pl-preview{background:#fff;border:1px solid var(--border);border-radius:4px;overflow:auto;}
/* PL Table (Excel replica) */
.pl-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;}
.pl-table td,.pl-table th{border:1px solid #000;padding:1px 3px;}
.pl-table .company-name{background:var(--header-yellow);font-size:20pt;font-weight:bold;text-align:center;vertical-align:middle;padding:4px;}
.pl-table .info-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .info-value{text-align:center;font-size:10pt;padding:1px 5px;}
.pl-table .info-value.bold{font-weight:bold;}
.pl-table .section-header{font-size:14pt;font-weight:bold;text-align:left;padding:2px 5px;}
.pl-table .col-header{font-weight:bold;text-align:center;vertical-align:middle;font-size:10pt;padding:2px 3px;}
.pl-table .col-sub{text-align:center;font-size:10pt;padding:1px 3px;}
.pl-table .data-cell{text-align:center;font-size:10pt;padding:1px 3px;}
.pl-table .data-cell.right{text-align:right;}
.pl-table .data-cell.center{text-align:center;}
.pl-table .total-cell{font-weight:bold;text-align:center;font-size:10pt;padding:1px 3px;}
.pl-table .total-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .summary-label{font-weight:bold;text-align:left;font-size:10pt;padding:1px 5px;}
.pl-table .summary-cell{text-align:center;font-size:10pt;padding:1px 3px;}
.pl-table .summary-cell.bold{font-weight:bold;}
/* Remove number input spinners */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
input[type="number"]{ -moz-appearance:textfield; }
/* Invoice Table */
.inv-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:11pt;margin:0 auto;width:100%;}
.inv-table td{border:1px solid #000;padding:2px 5px;}
.inv-table .inv-company{font-family:Arial,sans-serif;font-size:18pt;font-weight:bold;text-align:center;padding:6px;}
.inv-table .inv-addr{font-family:Arial,sans-serif;font-size:12pt;text-align:center;padding:2px 5px;}
.inv-table .inv-title{font-family:Arial,sans-serif;font-size:12pt;text-align:center;padding:2px 5px;}
.inv-table .inv-label{text-align:right;font-size:10pt;padding:1px 5px;white-space:nowrap;}
.inv-table .inv-val{text-align:left;font-size:11pt;padding:1px 5px;}
.inv-table .inv-text{font-size:11pt;padding:1px 5px;text-align:left;}
.inv-table .inv-header{text-align:center;font-size:12pt;padding:3px 5px;font-weight:normal;}
.inv-table .inv-cell{text-align:center;font-size:12pt;padding:2px 5px;}
.inv-table .inv-cell.left{text-align:left;}
.inv-table .inv-cell.right{text-align:right;}
.inv-table .inv-terms{text-align:center;font-size:12pt;padding:1px 5px;}
.inv-table .inv-total{text-align:right;font-size:12pt;padding:2px 5px;}
.inv-table .inv-ttl-label{text-align:right;font-size:12pt;padding:2px 5px;}
.inv-table .inv-remark{font-family:Arial,sans-serif;font-size:9pt;text-align:left;padding:1px 5px;border:none;}
.inv-table .inv-remark-label{font-family:Arial,sans-serif;font-size:9pt;text-align:right;padding:1px 5px;border:none;}
.inv-table .inv-noborder{border:none;padding:1px 5px;}
.inv-table .inv-section-label{font-family:Arial,sans-serif;font-size:9pt;text-align:right;padding:1px 5px;border:none;}
/* Customs Table (with borders) */
.cus-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:12pt;margin:0 auto;width:100%;}
.cus-table td{border:1px solid #000;padding:4px 6px;font-size:12pt;}
/* Customs Declaration Table */
.cus-decl-table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;width:100%;}
.cus-decl-table td{border:1px solid #000;padding:3px 5px;font-size:10pt;line-height:1.6;}
/* Customs Invoice Form (borderless, left-aligned) */
.cus-form{font-family:Arial,sans-serif;font-size:10pt;margin:0 auto;width:100%;border-collapse:collapse;}
.cus-form td{padding:3px 5px;font-size:10pt;border:none;vertical-align:top;line-height:1.5;}
.cus-form .ctr{text-align:center;}
.cus-form .rgt{text-align:right;}
.cus-form .b{font-weight:bold;}
.cus-form .l{font-size:16pt;font-weight:bold;padding:6px 5px;}
.cus-form .m{font-size:14pt;font-weight:bold;padding:4px 5px;}
.cus-form .s{font-size:10pt;padding:3px 5px;}
.cus-form .bt{border-top:1px solid #000;}
.cus-form .bb{border-bottom:1px solid #000;}
.cus-form .bl{border-left:1px solid #000;}
.cus-form .br{border-right:1px solid #000;}
.cus-form .gap{height:14px;border:none;}
/* Customs PL Form */
.cus-pl-form{font-family:Arial,sans-serif;font-size:12pt;margin:0 auto;width:100%;border-collapse:collapse;}
.cus-pl-form td{padding:4px 6px;font-size:12pt;border:none;vertical-align:top;line-height:1.5;}
.cus-pl-form .ctr{text-align:center;}
.cus-pl-form .rgt{text-align:right;}
.cus-pl-form .b{font-weight:bold;}
.cus-pl-form .kt{font-family:Arial,sans-serif;font-size:14pt;font-weight:bold;}
.cus-pl-form .en{font-family:Arial,sans-serif;font-size:12pt;}
.cus-pl-form .gap{height:24px;border:none;}
/* Declaration Elements Form (no borders, no header) */
.cus-elem-form{font-family:Arial,sans-serif;font-size:14pt;margin:0 auto;width:100%;border-collapse:collapse;}
.cus-elem-form td{padding:5px 8px;font-size:14pt;border:none;vertical-align:top;line-height:1.5;}
.cus-elem-form .label{font-family:Arial,sans-serif;font-size:14pt;}
.cus-elem-form .value{font-family:Arial,sans-serif;font-size:14pt;}
/* Doc Cards */
.doc-cards{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center;}
.doc-card{background:#fff;border:2px solid var(--border);border-radius:4px;padding:4px 8px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px;height:10mm;min-width:20mm;font-size:11px;font-weight:600;white-space:nowrap;}
.doc-card:hover{border-color:var(--primary);box-shadow:0 1px 4px rgba(37,99,235,.1);}
.doc-card.active{border-color:var(--primary);background:#eff6ff;}
.doc-card .doc-icon{font-size:14px;}
.doc-card .doc-name{font-size:11px;font-weight:600;}
.doc-print-btn{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:600;height:10mm;display:inline-flex;align-items:center;gap:4px;transition:background .15s;}
.doc-print-btn:hover{background:var(--primary-dark);}
/* Print */
@media print{
  .tab-bar,.tab-content,.pl-toolbar,.doc-cards,.doc-print-btn,.doc-print-group{display:none!important;}
  #printArea{display:block!important;}
  body{background:#fff;}
  @page landscape-page{size:A4 landscape;margin:5mm;}
  @page portrait-page{size:A4 portrait;margin:10mm;}
  .print-doc-landscape{page:landscape-page;}
  .print-doc-portrait{page:portrait-page;}
  .page-break{page-break-after:always;}
}
#printArea{display:none;}
@media print{
  #printArea.pl-print{page:landscape-page;}
  #printArea.inv-print{page:portrait-page;}
}
/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#f1f5f9;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:8px;padding:20px;max-width:400px;width:90%;box-shadow:0 4px 20px rgba(0,0,0,.15);}
.modal h3{margin-bottom:12px;font-size:15px;}
.modal p{font-size:13px;color:var(--text-light);margin-bottom:16px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('entry')"><span class="icon">✏</span>数据录入</button>
  <button class="tab-btn" onclick="switchTab('records')"><span class="icon">📋</span>数据记录</button>
  <button class="tab-btn" onclick="switchTab('docs')"><span class="icon">📄</span>报关和清关文件</button>
</div>

<!-- Tab 1: Data Entry -->
<div id="tab-entry" class="tab-content active">
  <div class="section">
    <div class="section-title">📌 基本信息</div>
    <div class="form-grid">
      <div class="form-group"><label>款号 (Style) - 可多个，逗号分隔</label><input id="f-style" list="styleList" placeholder="如: 1110577 或 1110577, 1110584" onchange="onStyleChange()"><datalist id="styleList"></datalist></div>
      <div class="form-group"><label>订单号 (PO No.) - 自动填充，可手动添加</label><input id="f-poNo" placeholder="自动填充，多个订单号用逗号分隔" style="background:#fff;" oninput="onPoNoChange()"></div>
      <div class="form-group"><label>商品描述</label><input id="f-itemDesc" placeholder="自动填充，可手动修改" style="background:#fff;"></div>
      <div class="form-group"><label>总订单数量 (PC)</label><input id="f-totalOrder" type="number" readonly style="background:#f0fdf4;color:var(--success);font-weight:700;"></div>
      <div class="form-group"><label>总实际数量 (PC)</label><input id="f-totalActual" type="number" readonly style="background:#f0fdf4;color:var(--success);font-weight:700;"></div>
      <div class="form-group"><label>差异数量 (Variation)</label><input id="f-variation" type="number" readonly style="background:#fef3c7;color:var(--warning);font-weight:700;"></div>
      <div class="form-group"><label>差异比例 (%)</label><input id="f-variationPct" type="number" step="0.1" readonly style="background:#fef3c7;color:var(--warning);font-weight:700;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 发票与贸易信息</div>
    <div class="form-grid">
      <div class="form-group"><label>发票号 (Invoice No.)</label><input id="f-invoiceNo" placeholder="如: S26X0070027"></div>
      <div class="form-group"><label>发票日期 (Invoice Date)</label><input id="f-invoiceDate" type="date"></div>
      <div class="form-group"><label>公司地址 (Company Addr)</label><input id="f-companyAddr" placeholder="如: ROOM 317 3F MACHINERY BUILDING..."></div>
      <div class="form-group"><label>买方全称 (Buyer Full Name)</label><input id="f-buyerFull" placeholder="如: CASTRO MODEL LTD"></div>
      <div class="form-group"><label>买方地址 (Buyer Address)</label><input id="f-buyerAddr" placeholder="如: 31 ORT ISRAEL ST.BAT YAM 59590 ISRAEL"></div>
      <div class="form-group"><label>船名航次 (Ship per)</label><input id="f-shipPer" placeholder="如: ZIM RUBY/V 9W BY SEA"></div>
      <div class="form-group"><label>ETD</label><input id="f-etd" type="date"></div>
      <div class="form-group"><label>起运港 (From)</label><input id="f-fromPort" placeholder="如: SHANGHAI,CHINA"></div>
      <div class="form-group"><label>目的港 (To)</label><input id="f-toPort" placeholder="如: ASHDOD,ISRAEL"></div>
      <div class="form-group"><label>详细商品描述 (Full Desc)</label><input id="f-fullDesc" placeholder="如: 62% Polyester 22% Wool..."></div>
      <div class="form-group"><label>单价 USD (Unit Price)</label><input id="f-unitPrice" type="number" step="0.01" placeholder="如: 19.2" oninput="calcInvoiceAmount()"></div>
      <div class="form-group"><label>衣架费 USD/件 (Hanging Fee)</label><input id="f-hangingFee" type="number" step="0.01" placeholder="如: 1.1" oninput="calcInvoiceAmount()"></div>
      <div class="form-group"><label>价格条款 (Price Terms)</label><input id="f-priceTerms" placeholder="如: FOB SHANGHAI"></div>
      <div class="form-group"><label>商品总金额 USD</label><input id="f-goodsAmount" type="number" readonly style="background:#f0fdf4;color:var(--success);font-weight:700;"></div>
      <div class="form-group"><label>衣架费总额 USD</label><input id="f-hangingTotal" type="number" readonly style="background:#f0fdf4;color:var(--success);font-weight:700;"></div>
      <div class="form-group"><label>发票总金额 USD</label><input id="f-invoiceTotal" type="number" readonly style="background:#eff6ff;color:var(--primary);font-weight:700;font-size:14px;"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🚢 出运信息</div>
    <div class="form-grid">
      <div class="form-group"><label>运输方式</label><select id="f-shipMethod"><option value="海运">海运</option><option value="空运">空运</option><option value="陆运">陆运</option></select></div>
      <div class="form-group"><label>货代公司</label><input id="f-forwarder" placeholder="如: 货代公司名称"></div>
      <div class="form-group"><label>集装箱号</label><input id="f-containerNo" placeholder="如: MSCU1234567"></div>
      <div class="form-group"><label>提单号 (B/L No)</label><input id="f-blNo" placeholder="提单号"></div>
      <div class="form-group"><label>报关单号</label><input id="f-customsNo" placeholder="海关报关单号"></div>
      <div class="form-group"><label>装柜日期</label><input id="f-loadingDate" type="date"></div>
      <div class="form-group"><label>预计到港 (ETA)</label><input id="f-eta" type="date"></div>
      <div class="form-group"><label>实际到港</label><input id="f-actualArrival" type="date"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">🏦 银行信息 <button class="btn btn-outline btn-sm" id="bankEditBtn" onclick="toggleBankEdit()" style="margin-left:auto;">修改</button></div>
    <div class="form-grid">
      <div class="form-group"><label>付款方式</label><input id="f-paymentTerms" value="T/T payment" readonly style="background:#f8fafc;color:var(--text-light);"></div>
      <div class="form-group"><label>收款公司 (Company)</label><input id="f-bankCompany" placeholder="如: JIANGSU SAINTY HANTANG TRADING CO.,LTD" readonly style="background:#f8fafc;color:var(--text-light);"></div>
      <div class="form-group"><label>收款地址 (Address)</label><input id="f-bankAddr" placeholder="如: ROOM 317 3F..." readonly style="background:#f8fafc;color:var(--text-light);"></div>
      <div class="form-group"><label>银行名称 (Bank)</label><input id="f-bankName" placeholder="如: BANK OF NINGBO" readonly style="background:#f8fafc;color:var(--text-light);"></div>
      <div class="form-group"><label>银行地址 (Bank Address)</label><input id="f-bankAddr2" placeholder="如: NO.6 FINANCIAL..." readonly style="background:#f8fafc;color:var(--text-light);"></div>
      <div class="form-group"><label>SWIFT</label><input id="f-swift" placeholder="如: BKNBCN2N" readonly style="background:#f8fafc;color:var(--text-light);"></div>

<script>
// ==================== State Management ====================
const STORAGE_KEY = 'pl_records_v1';
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentSizes = ['34','36','38','40','42','44'];
let editingId = null;
let currentDocType = 'pl';
// 硬编码公司信息
const COMPANY_EN = 'JIANGSU SAINTY HANTANG TRADING CO., LTD.';
const COMPANY_CN = '江苏舜天汉唐贸易有限公司';
// 银行信息字段ID列表
const BANK_FIELD_IDS = ['f-paymentTerms','f-bankCompany','f-bankAddr','f-bankName','f-bankAddr2','f-swift','f-acctNo'];

// ==================== Tab Switching ====================
function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['entry','records','docs'][i] === tabId);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-'+tabId).classList.add('active');
  if (tabId === 'records') renderRecords();
  if (tabId === 'docs') populatePLSelect();
}

// ==================== Style Lookup (from Order Management) ====================
function getOrders() {
  try { return JSON.parse(localStorage.getItem('orders') || '[]'); }
  catch(e) { return []; }
}

function sortSizes(sizes) {
  const order = {'XXXS':-3,'XXS':-2,'XS':-1,'S':0,'M':1,'L':2,'XL':3,'XXL':4,'XXXL':5,'XXXXL':6,'2XL':4,'3XL':5,'4XL':6,'5XL':7,'FREE':999};
  const getKey = (s) => {
    if (!s) return 9999;
    const up = String(s).trim().toUpperCase();
    const num = parseFloat(up);
    if (!isNaN(num) && up.match(/^\d+(\.\d+)?$/)) return num;
    if (order[up] !== undefined) return 1000 + order[up];
    if (!isNaN(num)) return num;
    return 9000;
  };
  return [...sizes].sort((a, b) => getKey(a) - getKey(b));
}

function populateStyleList() {
  const orders = getOrders();
  const styleSet = new Set();
  orders.forEach(o => { if (o.styleNo) styleSet.add(o.styleNo); });
  const dl = document.getElementById('styleList');
  if (dl) dl.innerHTML = Array.from(styleSet).map(s => `<option value="${s}">`).join('');
}

function onStyleChange() {
  const styleRaw = document.getElementById('f-style').value.trim();
  const poEl = document.getElementById('f-poNo');
  const descEl = document.getElementById('f-itemDesc');
  const totalEl = document.getElementById('f-totalOrder');
  
  if (!styleRaw) {
    poEl.value = '';
    descEl.value = '';
    totalEl.value = '';
    recalculateAll();
    return;
  }
  
  // 解析多个款号（逗号分隔）
  const styles = styleRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if (styles.length === 0) {
    poEl.value = '';
    descEl.value = '';
    totalEl.value = '';
    recalculateAll();
    return;
  }
  
  const orders = getOrders();
  let allPoNos = [];
  let totalQty = 0;
  let firstDesc = '';
  let firstUnitPrice = 0;
  let mergedSizes = new Set();
  let mergedQty = {};

  styles.forEach(style => {
    const matched = orders.filter(o => o.styleNo === style);
    if (matched.length === 0) {
      showToast('未在订单管理中找到款号: ' + style, 'error');
    } else {
      matched.forEach(o => {
        if (o.orderNo && !allPoNos.includes(o.orderNo)) {
          allPoNos.push(o.orderNo);
        }
        totalQty += parseInt(o.quantity) || 0;
        if (!firstDesc && o.styleDescription) {
          firstDesc = o.styleDescription;
        }
        if (!firstUnitPrice && o.unitPrice) {
          firstUnitPrice = parseFloat(o.unitPrice) || 0;
        }
        // 收集尺码和数量
        if (o.sizeMatrix && o.sizeMatrix.sizes) {
          o.sizeMatrix.sizes.forEach(s => mergedSizes.add(s));
        }
        if (o.sizeMatrix && o.sizeMatrix.rows) {
          const isSolid = (o.type === 'SOLID');
          o.sizeMatrix.rows.forEach(row => {
            if (row.quantities) {
              const ctns = isSolid ? 1 : (parseInt(row.noOfCartons) || 1);
              Object.keys(row.quantities).forEach(size => {
                mergedSizes.add(size);
                mergedQty[size] = (mergedQty[size] || 0) + (parseInt(row.quantities[size]) || 0) * ctns;
              });
            }
          });
        }
      });
    }
  });

  // 填充订单号（去重）
  poEl.value = allPoNos.join(', ');
  // 填充商品描述（取第一个匹配的）
  if (firstDesc) descEl.value = firstDesc;
  // 填充总订单数量
  totalEl.value = totalQty;
  // 填充发票信息 - 单价
  const upEl = document.getElementById('f-unitPrice');
  if (upEl && firstUnitPrice) upEl.value = firstUnitPrice;
  // 填充尺码和订单数量
  if (mergedSizes.size > 0) {
    currentSizes = sortSizes(Array.from(mergedSizes));
    // 更新 orderQty 数据
    if (typeof currentOrderQty === 'undefined') { window.currentOrderQty = {}; }
    currentOrderQty = mergedQty;
    renderSizeTags();
    renderOrderQtyTable();
    renderCartonTable();
    // renderOrderQtyTable 从 DOM 读取数量，渲染后需写入 DOM 以正确显示
    currentSizes.forEach((s, i) => {
      const el = document.getElementById('orderQty-' + i);
      if (el && mergedQty[s] !== undefined) el.value = mergedQty[s];
    });
  }
  recalculateAll();
}

function onPoNoChange() {
  const poRaw = document.getElementById('f-poNo').value.trim();
  const totalEl = document.getElementById('f-totalOrder');
  
  if (!poRaw) {
    totalEl.value = '';
    recalculateAll();
    return;
  }
  
  // 解析多个订单号（逗号分隔）
  const poNos = poRaw.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if (poNos.length === 0) {
    totalEl.value = '';
    recalculateAll();
    return;
  }
  
  const orders = getOrders();
  let totalQty = 0;
  let matchedAny = false;
  
  poNos.forEach(poNo => {
    const order = orders.find(o => o.orderNo === poNo);
    if (order) {
      totalQty += parseInt(order.quantity) || 0;
      matchedAny = true;
    }
  });
  
  if (matchedAny) {
    totalEl.value = totalQty;
  }
  // 如果没有匹配的订单号，保留用户输入的值不变（可能用户想手动控制）
  recalculateAll();
}

// ==================== Bank Info Edit (Password Protected) ====================
function toggleBankEdit() {
  const btn = document.getElementById('bankEditBtn');
  if (btn.textContent === '修改') {
    const pwd = prompt('请输入密码以修改银行信息：');
    if (pwd === null) return;
    if (pwd !== '2601') { showToast('密码错误', 'error'); return; }
    BANK_FIELD_IDS.forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.removeAttribute('readonly'); el.style.background = ''; el.style.color = ''; }
    });
    btn.textContent = '锁定';
    btn.classList.remove('btn-outline');
    btn.classList.add('btn-warning');
  } else {
    lockBankFields();
  }
}

function lockBankFields() {
  const btn = document.getElementById('bankEditBtn');
  BANK_FIELD_IDS.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.setAttribute('readonly', ''); el.style.background = '#f8fafc'; el.style.color = 'var(--text-light)'; }
  });
  if (btn) { btn.textContent = '修改'; btn.classList.remove('btn-warning'); btn.classList.add('btn-outline'); }
}

// ==================== Size Management ====================
function renderSizeTags() {
  const c = document.getElementById('size-tags');
  c.innerHTML = '';
  currentSizes.forEach((s,i) => {
    const tag = document.createElement('span');
    tag.className = 'size-tag';
    tag.innerHTML = `${s} <span class="remove" onclick="removeSize(${i})">×</span>`;
    c.appendChild(tag);
  });
}

function addSize() {
  const inp = document.getElementById('newSize');
  const val = inp.value.trim();
  if (val && !currentSizes.includes(val)) {
    currentSizes.push(val);
    inp.value = '';
    renderSizeTags();
    renderOrderQtyTable();
    renderCartonTable();
  }
}

function removeSize(idx) {
  currentSizes.splice(idx,1);
  renderSizeTags();
  renderOrderQtyTable();
  renderCartonTable();
  recalculateAll();
}

// ==================== Order Qty Table ====================
function renderOrderQtyTable() {
  const tbl = document.getElementById('orderQtyTable');
  let html = '<thead><tr><th>订单数量 (Order Qty PC)</th>';
  currentSizes.forEach(s => html += `<th>${s}</th>`);
  html += '<th>合计</th></tr></thead><tbody><tr>';
  html += '<td style="font-weight:600;text-align:left;padding-left:8px;">Order Qty PC</td>';
  currentSizes.forEach((s,i) => {
    html += `<td><input type="number" id="orderQty-${i}" value="${getOrderQty(i)}" oninput="recalculateAll()" min="0"></td>`;
  });
  html += '<td><input type="number" id="orderQtyTotal" readonly style="font-weight:700;background:#eff6ff;"></td>';
  html += '</tr></tbody>';
  tbl.innerHTML = html;
  try { recalculateAll(); } catch(e) {}
}

function getOrderQty(idx) {
  const el = document.getElementById('orderQty-'+idx);
  return el ? el.value : '';
}

// ==================== Carton Table ====================
function renderCartonTable() {
  const tbl = document.getElementById('cartonTable');
  // Header
  let hdr = '<thead><tr>';
  hdr += '<th rowspan="2">Carton no.<br>From</th>';
  hdr += '<th rowspan="2">Carton no.<br>To</th>';
  hdr += '<th rowspan="2">Code</th>';
  hdr += '<th rowspan="2">Color</th>';
  hdr += '<th colspan="'+currentSizes.length+'">SIZES</th>';
  hdr += '<th rowspan="2">Qty per<br>ctn (PC)</th>';
  hdr += '<th rowspan="2">Qty of<br>ctn (CTN)</th>';
  hdr += '<th rowspan="2">Total qty<br>(PC)</th>';
  hdr += '<th colspan="2">Per ctn.</th>';
  hdr += '<th colspan="2">Total</th>';
  hdr += '<th colspan="3">Dimension (cm)</th>';
  hdr += '<th rowspan="2">Volume<br>(CBM)</th>';
  hdr += '<th rowspan="2"></th>';
  hdr += '</tr><tr>';
  currentSizes.forEach(s => hdr += `<th>${s}</th>`);
  hdr += '<th>Gross W<br>(KG)</th>';
  hdr += '<th>Net W<br>(KG)</th>';
  hdr += '<th>Gross W<br>(KG)</th>';
  hdr += '<th>Net W<br>(KG)</th>';
  hdr += '<th>L</th><th>W</th><th>H</th>';
  hdr += '</tr></thead>';
  // Body
  let body = '<tbody id="cartonBody"></tbody>';
  // Footer (totals)
  let foot = '<tfoot><tr class="total-row"><td colspan="4" style="text-align:right;font-weight:700;">Total:</td>';
  currentSizes.forEach((s,i) => {
    foot += `<td id="totalSize-${i}">0</td>`;
  });
  foot += '<td></td>'; // qty per ctn
  foot += '<td id="totalCtn">0</td>';
  foot += '<td id="totalQty">0</td>';
  foot += '<td></td><td></td>'; // per ctn gross/net
  foot += '<td id="totalGrossW">0</td>';
  foot += '<td id="totalNetW">0</td>';
  foot += '<td colspan="3"></td>'; // dimensions
  foot += '<td id="totalVolume">0</td>';
  foot += '<td></td>';
  foot += '</tr></tfoot>';
  tbl.innerHTML = hdr + body + foot;
  // Add default rows if empty
  const bodyEl = document.getElementById('cartonBody');
  if (bodyEl.children.length === 0) {
    addCartonRow();
  }
}

function applyCartonWeight() {
  const weightInp = document.getElementById('f-cartonWeight');
  if (!weightInp) return;
  const cartonWt = parseFloat(weightInp.value) || 0;
  if (cartonWt <= 0) {
    showToast('请输入有效的纸箱重量', 'error');
    return;
  }
  const body = document.querySelector('#cartonTable tbody');
  if (!body) return;
  let count = 0;
  body.querySelectorAll('tr').forEach(row => {
    const netInp = row.querySelector('.ctn-net');
    const grossInp = row.querySelector('.ctn-gross');
    if (netInp && grossInp) {
      const netVal = parseFloat(netInp.value) || 0;
      grossInp.value = (netVal + cartonWt).toFixed(2);
      count++;
    }
  });
  if (count > 0) {
    recalculateAll();
    showToast('已更新 ' + count + ' 行毛重（净重 + ' + cartonWt + 'kg）', 'success');
  } else {
    showToast('没有可更新的装箱行', 'error');
  }
}

// ==================== Auto Calculations ====================
function recalculateAll() {
  if (!document.getElementById('cartonBody')) return;
  const sizes = currentSizes;
  const sizeTotals = {};
  sizes.forEach(s => sizeTotals[s] = 0);
  let totalCtn = 0, totalQty = 0, totalGross = 0, totalNet = 0, totalVol = 0;

  const rows = document.querySelectorAll('#cartonBody tr');
  rows.forEach(row => {
    // Qty per ctn = sum of size qtys
    let perCtn = 0;
    row.querySelectorAll('.ctn-size').forEach(inp => {
      const v = parseFloat(inp.value) || 0;
      perCtn += v;
      sizeTotals[inp.dataset.size] = (sizeTotals[inp.dataset.size]||0) + v * (parseFloat(row.querySelector('.ctn-num').value)||0);
    });
    row.querySelector('.ctn-per').value = perCtn || '';

    const ctnNum = parseFloat(row.querySelector('.ctn-num').value) || 0;
    const totalQ = perCtn * ctnNum;
    row.querySelector('.ctn-total').value = totalQ || '';

    const grossPer = parseFloat(row.querySelector('.ctn-gross').value) || 0;
    const netPer = parseFloat(row.querySelector('.ctn-net').value) || 0;
    const grossTotal = grossPer * ctnNum;
    const netTotal = netPer * ctnNum;
    row.querySelector('.ctn-gross-total').value = +(grossTotal.toFixed(2)) || '';
    row.querySelector('.ctn-net-total').value = +(netTotal.toFixed(2)) || '';

    const dimL = parseFloat(row.querySelector('.ctn-dimL').value) || 0;
    const dimW = parseFloat(row.querySelector('.ctn-dimW').value) || 0;
    const dimH = parseFloat(row.querySelector('.ctn-dimH').value) || 0;
    const vol = (dimL * dimW * dimH / 1000000) * ctnNum;
    row.querySelector('.ctn-vol').value = vol ? +(vol.toFixed(4)) : '';

    totalCtn += ctnNum;
    totalQty += totalQ;
    totalGross += grossTotal;
    totalNet += netTotal;
    totalVol += vol;
  });

  // Update totals footer
  sizes.forEach((s,i) => {
    const el = document.getElementById('totalSize-'+i);
    if (el) el.textContent = sizeTotals[s] || '';
  });
  const setTxt = (id,val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  const setVal = (id,val) => { const el=document.getElementById(id); if(el) el.value=val; };
  setTxt('totalCtn', totalCtn || '');
  setTxt('totalQty', totalQty || '');
  setTxt('totalGrossW', totalGross ? +totalGross.toFixed(2) : '');
  setTxt('totalNetW', totalNet ? +totalNet.toFixed(2) : '');
  setTxt('totalVolume', totalVol ? +totalVol.toFixed(2) : '');

  // Order qty total
  let orderTotal = 0;
  sizes.forEach((s,i) => {
    const v = parseFloat(document.getElementById('orderQty-'+i)?.value) || 0;
    orderTotal += v;
  });
  setVal('orderQtyTotal', orderTotal || '');

  // Header totals
  setVal('f-totalOrder', orderTotal || '');
  setVal('f-totalActual', totalQty || '');
  const variation = totalQty - orderTotal;
  setVal('f-variation', variation || '');
  const variationPct = orderTotal > 0 ? (variation / orderTotal * 100) : 0;
  setVal('f-variationPct', variationPct ? +variationPct.toFixed(1) : '');
  calcInvoiceAmount();
}

function saveRecord() {
  const data = collectFormData();
  if (!data.style) { showToast('请填写款号 (Style)', 'error'); return; }
  if (data.cartons.length === 0) { showToast('请至少添加一行装箱明细', 'error'); return; }

  // 发票号不能与出运记录重复（非空时检查）
  if (data.invoiceNo && data.invoiceNo.trim()) {
    const invNo = data.invoiceNo.trim();
    const dup = records.find(r => r.id !== editingId && r.invoiceNo && r.invoiceNo.trim() === invNo);
    if (dup) { showToast('发票号 "' + invNo + '" 在出运记录中已存在，不能重复！', 'error'); return; }
  }

  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) records[idx] = data;
  } else {
    records.push(data);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  editingId = null;
  lockBankFields();
  showToast('保存成功！', 'success');
  switchTab('records');
  clearForm();
}

function showToast(msg, type) {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;top:60px;right:20px;padding:10px 20px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:opacity .3s;background:${type==='success'?'#16a34a':type==='error'?'#dc2626':'#2563eb'};`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity='0'; setTimeout(()=>toast.remove(), 300); }, 2000);
}

// ==================== Empty Input Highlight ====================
function refreshEmptyHighlight() {
  document.querySelectorAll('.form-group input[id^="f-"], .form-group textarea[id^="f-"]').forEach(el => {
    if (el.readOnly || el.type === 'hidden') return;
    if (!el.value || el.value.trim() === '') {
      el.classList.add('input-empty');
    } else {
      el.classList.remove('input-empty');
    }
  });
}
document.addEventListener('input', function(e) {
  if (e.target.matches('.form-group input[id^="f-"], .form-group textarea[id^="f-"]')) {
    if (e.target.value && e.target.value.trim()) {
      e.target.classList.remove('input-empty');
    } else {
      e.target.classList.add('input-empty');
    }
  }
});

    Object.keys(draft.fields || {}).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = draft.fields[id];
    });
    // 恢复尺码
    if (draft.sizes && draft.sizes.length > 0) {
      currentSizes = [...draft.sizes];

    renderSizeTags();
    renderOrderQtyTable();

    // 恢复装箱明细

      draft.cartonData.forEach(data => addCartonRow(data));

    recalculateAll();
    lockBankFields();

  container.innerHTML = '<div class="cards-grid">';

// ==================== Invoice Generation ====================
function formatDateStr(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d.getDate()}-${months[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
  } catch { return dateStr; }
}

function generateInvoiceTable(rec) {
  const qty = rec.totalActualQty || 0;
  const unitPrice = rec.unitPrice || 0;
  const hangingFee = rec.hangingFee || 0;
  const goodsAmt = +(qty * unitPrice).toFixed(2);
  const hangingTotal = +(qty * hangingFee).toFixed(2);
  const invTotal = +(goodsAmt + hangingTotal).toFixed(2);
  const invDate = formatDateStr(rec.invoiceDate);
  const etdStr = formatDateStr(rec.etd);
  const remarks = (rec.remarks || '').split('\n').filter(r => r.trim());

  let html = '<table class="inv-table">';

  // Company name
  html += `<tr><td colspan="6" class="inv-company">${rec.company || ''}</td></tr>`;
  // Company address
  html += `<tr><td colspan="6" class="inv-addr">${rec.companyAddr || ''}</td></tr>`;
  // INVOICE title
  html += `<tr><td colspan="6" class="inv-title">   INVOICE</td></tr>`;
  // Empty
  html += `<tr><td colspan="6" class="inv-noborder" style="height:8px;"></td></tr>`;
  // Invoice No.
  html += `<tr><td colspan="2" class="inv-noborder"></td><td class="inv-label">INVOICE No.</td><td class="inv-val">${rec.invoiceNo || ''}</td><td colspan="2" class="inv-noborder"></td></tr>`;
  // Date
  html += `<tr><td colspan="2" class="inv-noborder"></td><td class="inv-label">Date:</td><td class="inv-val">${invDate}</td><td colspan="2" class="inv-noborder"></td></tr>`;
  // Empty
  html += `<tr><td colspan="6" class="inv-noborder" style="height:8px;"></td></tr>`;
  // Invoice of / by / address / from / as per order / ship per / from-to
  html += `<tr><td colspan="6" class="inv-text">INVOICE of As below</td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">by  ${rec.buyerFull || rec.buyer || ''}</td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">${rec.buyerAddr || ''}</td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">from    ${rec.company || ''}</td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">as per order accepted on     </td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">to be shipped per ${rec.shipPer || ''}  ETD ${etdStr}</td></tr>`;
  html += `<tr><td colspan="6" class="inv-text">from  ${rec.fromPort || ''}          to    ${rec.toPort || ''}       via          by the undersigned.</td></tr>`;
  // Empty
  html += `<tr><td colspan="6" class="inv-noborder" style="height:8px;"></td></tr>`;

  // Table header
  html += `<tr>`;
  html += `<td class="inv-header">Quantity<br>（PCS）</td>`;
  html += `<td class="inv-header">Full Description of Goods</td>`;
  html += `<td class="inv-header">Style No.</td>`;
  html += `<td class="inv-header">PO</td>`;
  html += `<td class="inv-header">Unit Price(USD)</td>`;
  html += `<td class="inv-header">Total Amount(USD)</td>`;
  html += `</tr>`;
  // Price terms
  html += `<tr><td colspan="4" class="inv-noborder"></td><td class="inv-terms">${rec.priceTerms || ''}</td><td class="inv-noborder"></td></tr>`;
  // Data row - goods
  html += `<tr>`;
  html += `<td class="inv-cell">${qty}</td>`;
  html += `<td class="inv-cell left">${rec.fullDesc || rec.itemDesc || ''}</td>`;
  html += `<td class="inv-cell">${rec.style || ''}</td>`;
  html += `<td class="inv-cell">${rec.poNo || ''}</td>`;
  html += `<td class="inv-cell">${unitPrice}</td>`;
  html += `<td class="inv-cell">${goodsAmt}</td>`;
  html += `</tr>`;
  // Hanging fee row
  if (hangingFee > 0) {
    html += `<tr>`;
    html += `<td class="inv-noborder"></td>`;
    html += `<td class="inv-cell left">Hanging Fee</td>`;
    html += `<td colspan="2" class="inv-noborder"></td>`;
    html += `<td class="inv-cell">${hangingFee}</td>`;
    html += `<td class="inv-cell">${hangingTotal}</td>`;
    html += `</tr>`;
  }
  // TTL row
  html += `<tr>`;
  html += `<td class="inv-ttl-label">TTL:</td>`;
  html += `<td colspan="4" class="inv-noborder"></td>`;
  html += `<td class="inv-total">${invTotal}</td>`;
  html += `</tr>`;

  // Remarks section
  html += `<tr><td colspan="6" class="inv-noborder" style="height:6px;"></td></tr>`;
  html += `<tr><td class="inv-remark-label">REMARKS:</td><td colspan="5" class="inv-noborder"></td></tr>`;
  remarks.forEach(r => {
    html += `<tr><td class="inv-noborder"></td><td colspan="5" class="inv-remark">${r}</td></tr>`;
  });

  // Bank details section
  html += `<tr><td colspan="6" class="inv-noborder" style="height:6px;"></td></tr>`;
  html += `<tr><td colspan="6" class="inv-section-label" style="text-align:left;">Bank details:</td></tr>`;
  html += `<tr><td class="inv-remark-label">${rec.paymentTerms || ''}</td><td colspan="5" class="inv-noborder"></td></tr>`;
  const bankLines = [
    rec.bankCompany ? `COMPANY: ${rec.bankCompany}` : '',
    rec.bankAddr ? `ADDRESS: ${rec.bankAddr}` : '',
    rec.bankName ? `BANK: ${rec.bankName}` : '',
    rec.bankAddr2 ? `ADDRESS: ${rec.bankAddr2}` : '',
    rec.swift ? `SWIFT: ${rec.swift}` : '',
    rec.acctNo ? `A/C NO.: ${rec.acctNo}` : '',
  ].filter(l => l);
  bankLines.forEach(line => {
    html += `<tr><td class="inv-noborder"></td><td colspan="5" class="inv-remark">${line}</td></tr>`;
  });

  html += '</table>';
  return html;
}

function calcInvoiceAmount() {
  const qty = parseFloat(document.getElementById('f-totalActual')?.value) || 0;
  const unitPrice = parseFloat(document.getElementById('f-unitPrice')?.value) || 0;
  const hangingFee = parseFloat(document.getElementById('f-hangingFee')?.value) || 0;
  const goodsAmt = qty * unitPrice;
  const hangingTotal = qty * hangingFee;
  const invoiceTotal = goodsAmt + hangingTotal;
  const setV = (id,v) => { const el=document.getElementById(id); if(el) el.value=v; };
  setV('f-goodsAmount', goodsAmt ? +goodsAmt.toFixed(2) : '');
  setV('f-hangingTotal', hangingTotal ? +hangingTotal.toFixed(2) : '');
  setV('f-invoiceTotal', invoiceTotal ? +invoiceTotal.toFixed(2) : '');
  calcCustomsAmount();
}

function calcCustomsAmount() {
  const qty = parseFloat(document.getElementById('f-totalActual')?.value) || 0;
  const customsPrice = parseFloat(document.getElementById('f-customsPrice')?.value) || 0;
  const total = qty * customsPrice;
  const setV = (id,v) => { const el=document.getElementById(id); if(el) el.value=v; };
  setV('f-customsTotal', total ? +total.toFixed(2) : '');
}

function generatePLTableV2(rec) {
  const sizes = rec.sizes || ['34','36','38','40','42','44'];
  const cartons = rec.cartons || [];

  // Calculate total columns: From(1)+To(1)+Code(1)+Color(1)+sizes(n)+perCtn(1)+ctnNum(1)+totalQty(1)+grossPer(1)+netPer(1)+grossTotal(1)+netTotal(1)+dimL(1)+dimW(1)+dimH(1)+vol(1) = n+16
  const n = sizes.length;
  const tc = n + 14; // total columns: 3(from~to,code,color) + n(sizes) + 11(perCtn,ctnNum,totalQty,grossPer,netPer,grossTotal,netTotal,dimL,dimW,dimH,vol)

  let html = '<table class="pl-table">';

  // Row 1: Company name
  html += `<tr><td colspan="${tc}" class="company-name">${rec.company || ''}</td></tr>`;
  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;height:6px;"></td></tr>`;

  // Info rows: label(colspan=2) + value(colspan=2) + rest empty
  const infos = [
    ['Buyer', rec.buyerFull || rec.buyer, false],
    ['Style', rec.style, false],
    ['PO No.', rec.poNo, false],
    ['Item description', rec.itemDesc, false],
    ['Total order Qty PC', rec.totalOrderQty, false],
    ['Total actual Qty PC', rec.totalActualQty, true],
  ];
  infos.forEach(([label,val,bold]) => {
    html += `<tr><td colspan="2" class="info-label">${label}</td><td colspan="2" class="info-value${bold?' bold':''}">${val??''}</td><td colspan="${tc-4}" style="border:none;"></td></tr>`;
  });

  // Variation row (special: has value + percentage)
  const pctStr = rec.variationPct ? (rec.variationPct.toFixed(1) + '%') : '';
  html += `<tr>`;
  html += `<td colspan="2" class="info-label">Variation on Order</td>`;
  html += `<td colspan="2" class="info-value bold">${rec.variation??''}</td>`;
  html += `<td class="info-value bold">${pctStr}</td>`;
  html += `<td colspan="${tc-5}" style="border:none;"></td>`;
  html += `</tr>`;

  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;height:6px;"></td></tr>`;

  // Detail section header row ("Detail:" + "Per ctn." + "Total")
  // Positions (1-indexed): 1-2=From/To, 3=Code, 4=Color, 5..5+n-1=sizes, 5+n=perCtn, 6+n=ctnNum, 7+n=totalQty, 8+n=grossPer, 9+n=netPer, 10+n=grossTotal, 11+n=netTotal, 12+n=dimL, 13+n=dimW, 14+n=dimH, 15+n=vol
  // "Per ctn." spans grossPer+netPer = cols (8+n) to (9+n) = 2 cols
  // "Total" spans grossTotal+netTotal = cols (10+n) to (11+n) = 2 cols
  html += `<tr>`;
  html += `<td colspan="3" style="font-weight:bold;border-left:1px solid #000;border-top:1px solid #000;padding:1px 5px;">Detail:</td>`;
  // sizes area - no border on top for these
  html += `<td colspan="${n}" style="border:none;"></td>`;
  // ctnNum, totalQty - no top border
  html += `<td colspan="3" style="border:none;"></td>`;
  // Per ctn. header
  html += `<td colspan="2" style="font-weight:bold;border:1px solid #000;padding:1px 3px;text-align:left;">Per ctn.</td>`;
  // Total header
  html += `<td colspan="2" style="font-weight:bold;border:1px solid #000;padding:1px 3px;text-align:left;">Total</td>`;
  // dimensions + vol - no top border
  html += `<td colspan="4" style="border:none;"></td>`;
  html += `</tr>`;

  // Header row 1 (row 12)
  html += `<tr>`;
  html += `<td rowspan="2" class="col-header">Carton no.</td>`;
  html += `<td rowspan="2" class="col-header">Code:</td>`;
  html += `<td rowspan="2" class="col-header">Color</td>`;
  html += `<td colspan="${n}" class="col-header">SIZES</td>`;
  html += `<td class="col-header">Qty per<br>ctn.</td>`;
  html += `<td class="col-header">Qty of<br>ctn</td>`;
  html += `<td class="col-header">Total<br>qty</td>`;
  html += `<td class="col-header">Gross W</td>`;
  html += `<td class="col-header">Net W</td>`;
  html += `<td class="col-header">Gross W</td>`;
  html += `<td class="col-header">Net W</td>`;
  html += `<td colspan="3" class="col-header">Dimension of ctn, mm</td>`;
  html += `<td class="col-header">Volume</td>`;
  html += `</tr>`;

  // Header row 2 (row 13 - sub headers)
  html += `<tr>`;
  sizes.forEach(s => html += `<td class="col-sub">${s}</td>`);
  html += `<td class="col-sub">PC</td>`;
  html += `<td class="col-sub">CTN</td>`;
  html += `<td class="col-sub">PC</td>`;
  html += `<td class="col-sub">KG</td>`;
  html += `<td class="col-sub">KG</td>`;
  html += `<td class="col-sub">KG</td>`;
  html += `<td class="col-sub">KG</td>`;
  html += `<td class="col-sub">L</td>`;
  html += `<td class="col-sub">W</td>`;
  html += `<td class="col-sub">H</td>`;
  html += `<td class="col-sub">CBM</td>`;
  html += `</tr>`;

  // Data rows (cartons)
  // Check if all cartons have same dimensions (for merging)
  const allSameDim = cartons.length > 0 && cartons.every(c =>
    c.dimL === cartons[0].dimL && c.dimW === cartons[0].dimW && c.dimH === cartons[0].dimH
  );

  // Also check if all have same code and color
  const allSameCode = cartons.length > 0 && cartons.every(c => c.code === cartons[0].code);
  const allSameColor = cartons.length > 0 && cartons.every(c => c.color === cartons[0].color);

  cartons.forEach((c, idx) => {
    html += `<tr>`;
    // Carton no.
    html += `<td class="data-cell center">${(c.from && c.to) ? (c.from === c.to ? c.from : c.from + '~' + c.to) : (c.from||c.to||'')}</td>`;
    // Code (merge if all same)
    if (allSameCode) {
      if (idx === 0) html += `<td rowspan="${cartons.length}" class="data-cell">${c.code||''}</td>`;
    } else {
      html += `<td class="data-cell">${c.code||''}</td>`;
    }
    // Color (merge if all same)
    if (allSameColor) {
      if (idx === 0) html += `<td rowspan="${cartons.length}" class="data-cell">${c.color||''}</td>`;
    } else {
      html += `<td class="data-cell">${c.color||''}</td>`;
    }
    // Sizes
    sizes.forEach(s => {
      const v = c.sizes ? c.sizes[s] : 0;
      html += `<td class="data-cell">${v||''}</td>`;
    });
    // Qty per ctn
    html += `<td class="data-cell">${c.perCtn||''}</td>`;
    // Qty of ctn
    html += `<td class="data-cell">${c.ctnNum||''}</td>`;
    // Total qty
    html += `<td class="data-cell" style="font-size:11pt;">${c.totalQty||''}</td>`;
    // Gross W per ctn
    html += `<td class="data-cell">${c.grossPer||''}</td>`;
    // Net W per ctn
    html += `<td class="data-cell">${c.netPer||''}</td>`;
    // Gross W total
    html += `<td class="data-cell">${c.grossTotal ? +c.grossTotal.toFixed(2) : ''}</td>`;
    // Net W total
    html += `<td class="data-cell">${c.netTotal ? +c.netTotal.toFixed(2) : ''}</td>`;
    // Dimensions (merge if all same)
    if (allSameDim) {
      if (idx === 0) {
        html += `<td rowspan="${cartons.length}" class="data-cell">${c.dimL||''}</td>`;
        html += `<td rowspan="${cartons.length}" class="data-cell">${c.dimW||''}</td>`;
        html += `<td rowspan="${cartons.length}" class="data-cell">${c.dimH||''}</td>`;
        // Volume (also merged)
        const totalVol = cartons.reduce((s,cc) => s + (cc.volume||0), 0);
        html += `<td rowspan="${cartons.length}" class="data-cell">${totalVol ? +totalVol.toFixed(2) : ''}</td>`;
      }
    } else {
      html += `<td class="data-cell">${c.dimL||''}</td>`;
      html += `<td class="data-cell">${c.dimW||''}</td>`;
      html += `<td class="data-cell">${c.dimH||''}</td>`;
      html += `<td class="data-cell">${c.volume ? +c.volume.toFixed(4) : ''}</td>`;
    }
    html += `</tr>`;
  });

  // Total row
  const totals = calculateTotals(rec);
  html += `<tr>`;
  html += `<td colspan="3" class="total-label">Total:</td>`;
  sizes.forEach(s => {
    html += `<td class="total-cell">${totals.sizeTotals[s]||0}</td>`;
  });
  html += `<td></td>`; // per ctn
  html += `<td class="total-cell">${totals.ctnNum}</td>`;
  html += `<td class="total-cell">${totals.totalQty}</td>`;
  html += `<td></td><td></td>`; // per ctn gross/net
  html += `<td class="total-cell">${totals.grossTotal.toFixed(2)}</td>`;
  html += `<td class="total-cell">${totals.netTotal.toFixed(2)}</td>`;
  html += `<td colspan="3"></td>`; // dimensions
  if (!allSameDim) {
    html += `<td class="total-cell">${totals.volume.toFixed(2)}</td>`;
  } else {
    html += `<td></td>`;
  }
  html += `</tr>`;

  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;height:6px;"></td></tr>`;

  // Summary section
  html += `<tr><td colspan="${tc}" class="section-header">Summary:</td></tr>`;

  // Summary header row 1
  // In original: A27:B28 merged (empty), C27:C28="Color", D27:J27="Sizes", K27:K28="Total:"
  // Map to our columns: label(2) + Color(1) + Sizes(n) + Total(1) = n+4
  // Rest are empty
  html += `<tr>`;
  html += `<td rowspan="2" style="border:1px solid #000;"></td>`;
  html += `<td rowspan="2" class="col-header">Color</td>`;
  html += `<td colspan="${n}" class="col-header">Sizes</td>`;
  html += `<td rowspan="2" class="col-header">Total:</td>`;
  html += `<td colspan="${tc - n - 3}" style="border:none;"></td>`;
  html += `</tr>`;

  // Summary header row 2 (size numbers)
  html += `<tr>`;
  sizes.forEach(s => html += `<td class="col-sub">${s}</td>`);
  html += `<td colspan="${tc - n - 3}" style="border:none;"></td>`;
  html += `</tr>`;

  // Summary data rows (by color)
  const colors = getColorsFromCartons(cartons);
  const summaryRows = ['Order Qty PC', 'Actual Qty PC', 'Excess Qty', '% of order'];
  const summaryData = calculateSummaryByColor(rec, sizes, colors);

  summaryRows.forEach((rowLabel, rowIdx) => {
    html += `<tr>`;
    html += `<td class="summary-label">${rowLabel}</td>`;
    if (rowIdx === 0) {
      // Color column merged for all 4 rows
      colors.forEach((color, ci) => {
        if (ci === 0) {
          html += `<td rowspan="4" class="summary-cell bold">${color}</td>`;
        }
      });
    } else {
      // Color already rendered via rowspan
    }
    // If no colors, still need the cell
    if (colors.length === 0 && rowIdx === 0) {
      html += `<td rowspan="4" class="summary-cell"></td>`;
    }

    if (colors.length === 0) {
      sizes.forEach(s => html += `<td class="summary-cell"></td>`);
      html += `<td class="summary-cell"></td>`;
    } else {
      const color = colors[0]; // First (and typically only) color
      sizes.forEach(s => {
        let val = '';
        if (rowIdx === 0) val = (summaryData.orderQty[color] && summaryData.orderQty[color][s]) || '';
        else if (rowIdx === 1) val = (summaryData.actualQty[color] && summaryData.actualQty[color][s]) || '';
        else if (rowIdx === 2) val = (summaryData.excessQty[color] && summaryData.excessQty[color][s]) || '';
        else if (rowIdx === 3) {
          const pct = (summaryData.actualQty[color] && summaryData.actualQty[color][s] && summaryData.orderQty[color] && summaryData.orderQty[color][s]) ?
            (summaryData.actualQty[color][s] / summaryData.orderQty[color][s]) : 0;
          val = pct ? (pct * 100).toFixed(1) + '%' : '';
        }
        html += `<td class="summary-cell${rowIdx===1?' bold':''}">${val}</td>`;
      });
      // Total column
      let totalVal = '';
      if (rowIdx === 0) totalVal = (summaryData.orderQtyTotal[color]) || '';
      else if (rowIdx === 1) totalVal = (summaryData.actualQtyTotal[color]) || '';
      else if (rowIdx === 2) totalVal = (summaryData.excessQtyTotal[color]) || '';
      else if (rowIdx === 3) {
        const pct = (summaryData.actualQtyTotal[color] && summaryData.orderQtyTotal[color]) ?
          (summaryData.actualQtyTotal[color] / summaryData.orderQtyTotal[color]) : 0;
        totalVal = pct ? (pct * 100).toFixed(1) + '%' : '';
      }
      html += `<td class="summary-cell">${totalVal}</td>`;
    }
    html += `<td colspan="${tc - n - 3}" style="border:none;"></td>`;
    html += `</tr>`;
  });

  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;height:6px;"></td></tr>`;

  // Total order section
  html += `<tr><td colspan="${tc}" class="section-header">Total order:</td></tr>`;

  // Total order header
  // In original: A35:B36 merged, C35:K35="Sizes", then C36-H36 are size numbers, K36="Total:"
  // Map: label(2) + "Sizes" header(1) + sizes(n) ... hmm
  // Actually original has: A35:B36 (empty), C35:K35="Sizes" (merged), then row 36 has size numbers
  // But K column is "Total:" in K27:K28. In the total order section, K35:K36 should also be "Total:"? Let me check...
  // C35:K35 = "Sizes", C36=34, D36=36,... H36=44, K36="Total:"
  // So: empty(2) + Sizes(merged across color+sizes) ... hmm this is different.
  // Actually C35:K35 is merged = "Sizes", and K is part of this merge. Then K36="Total:"
  // Wait, that's contradictory. C35:K35 is merged, but K36 is separate.
  // Let me re-read: C35:K35 merged = "Sizes". K36 = "Total:".
  // So in row 35: cols C-K are merged as "Sizes". In row 36: C-H are size numbers, I-J are empty, K="Total:"
  // Hmm, but that means K is split in row 36. The merge C35:K35 covers row 35 only.

  // For our HTML, let's do:
  // Row 1: empty(2) + "Sizes"(colspan=n+1, covering color col + size cols) ... no
  // Actually, let me map it differently. In the total order section, there's no color column.
  // Layout: empty(2) + Sizes(n) + Total(1) + rest empty
  // Row 35: empty(2) + "Sizes"(colspan=n) + "Total:"(1, rowspan 2) ... hmm

  // Let me simplify: match the original layout
  // Row 35-36: A:B merged (empty, rowspan 2), C35:?? = "Sizes" (row 35), C36-H36 = size numbers (row 36), then "Total:" at the end
  // In original: A35:B36 merged, C35:K35="Sizes", C36=34,...,H36=44, K36="Total:"
  // Since C35:K35 is merged, it spans C through K. K36 is "Total:".
  // But our column mapping is different. Let me just do:
  // empty(2, rowspan 2) + "Sizes"(n cols, row 35) + "Total:"(1, rowspan 2) + rest empty
  // Row 36: size numbers (n cols) + [total already covered by rowspan]

  html += `<tr>`;
  html += `<td rowspan="2" style="border:1px solid #000;"></td>`;
  html += `<td colspan="${n}" class="col-header">Sizes</td>`;
  html += `<td rowspan="2" class="col-header">Total:</td>`;
  html += `<td colspan="${tc - n - 2}" style="border:none;"></td>`;
  html += `</tr>`;

  html += `<tr>`;
  sizes.forEach(s => html += `<td class="col-sub">${s}</td>`);
  html += `<td colspan="${tc - n - 2}" style="border:none;"></td>`;
  html += `</tr>`;

  // Total order data rows
  const totalOrderData = calculateTotalOrderSummary(rec, sizes);
  const orderRows = ['Order Qty PC', 'Actual Qty PC', 'Excess Qty', '% of order'];
  orderRows.forEach((label, rowIdx) => {
    html += `<tr>`;
    html += `<td class="summary-label">${label}</td>`;
    sizes.forEach(s => {
      let val = '';
      if (rowIdx === 0) val = totalOrderData.orderQty[s] || '';
      else if (rowIdx === 1) val = totalOrderData.actualQty[s] || '';
      else if (rowIdx === 2) val = totalOrderData.excessQty[s] || '';
      else if (rowIdx === 3) {
        const pct = totalOrderData.actualQty[s] && totalOrderData.orderQty[s] ?
          (totalOrderData.actualQty[s] / totalOrderData.orderQty[s]) : 0;
        val = pct ? (pct * 100).toFixed(1) + '%' : '';
      }
      html += `<td class="summary-cell${rowIdx===1?' bold':''}">${val}</td>`;
    });
    // Total
    let totalVal = '';
    if (rowIdx === 0) totalVal = totalOrderData.orderQtyTotal || '';
    else if (rowIdx === 1) totalVal = totalOrderData.actualQtyTotal || '';
    else if (rowIdx === 2) totalVal = totalOrderData.excessQtyTotal || '';
    else if (rowIdx === 3) {
      const pct = totalOrderData.actualQtyTotal && totalOrderData.orderQtyTotal ?
        (totalOrderData.actualQtyTotal / totalOrderData.orderQtyTotal) : 0;
      totalVal = pct ? (pct * 100).toFixed(1) + '%' : '';
    }
    html += `<td class="summary-cell">${totalVal}</td>`;
    html += `<td colspan="${tc - n - 2}" style="border:none;"></td>`;
    html += `</tr>`;
  });

  html += '</table>';
  return html;
}

// ==================== Calculation Helpers ====================
function calculateTotals(rec) {
  const sizes = rec.sizes || [];
  const cartons = rec.cartons || [];
  const sizeTotals = {};
  sizes.forEach(s => sizeTotals[s] = 0);
  let ctnNum = 0, totalQty = 0, grossTotal = 0, netTotal = 0, volume = 0;

  cartons.forEach(c => {
    ctnNum += c.ctnNum || 0;
    totalQty += c.totalQty || 0;
    grossTotal += c.grossTotal || 0;
    netTotal += c.netTotal || 0;
    volume += c.volume || 0;
    if (c.sizes) {
      sizes.forEach(s => {
        sizeTotals[s] += (c.sizes[s] || 0) * (c.ctnNum || 0);
      });
    }
  });

  return { sizeTotals, ctnNum, totalQty, grossTotal, netTotal, volume };
}

function getColorsFromCartons(cartons) {
  const colors = [];
  cartons.forEach(c => {
    if (c.color && !colors.includes(c.color)) colors.push(c.color);
  });
  return colors;
}

function calculateSummaryByColor(rec, sizes, colors) {
  const orderQty = {};
  const actualQty = {};
  const excessQty = {};
  const orderQtyTotal = {};
  const actualQtyTotal = {};
  const excessQtyTotal = {};

  colors.forEach(color => {
    orderQty[color] = {};
    actualQty[color] = {};
    excessQty[color] = {};
    orderQtyTotal[color] = 0;
    actualQtyTotal[color] = 0;
    excessQtyTotal[color] = 0;

    sizes.forEach(s => {
      // Order qty per size (from the order qty data, attributed to this color)
      // If only one color, all order qty goes to it
      // If multiple colors, we distribute proportionally or just use total
      const oq = (rec.orderQty && rec.orderQty[s]) || 0;
      if (colors.length === 1) {
        orderQty[color][s] = oq;
      } else {
        // For multiple colors, calculate actual qty per color per size
        // and use the same order qty for all colors (not ideal but functional)
        orderQty[color][s] = oq;
      }

      // Actual qty: sum of carton size qtys for this color
      let aq = 0;
      rec.cartons.forEach(c => {
        if (c.color === color && c.sizes) {
          aq += (c.sizes[s] || 0) * (c.ctnNum || 0);
        }
      });
      actualQty[color][s] = aq;
      excessQty[color][s] = aq - orderQty[color][s];

      orderQtyTotal[color] += orderQty[color][s];
      actualQtyTotal[color] += actualQty[color][s];
      excessQtyTotal[color] += excessQty[color][s];
    });
  });

  return { orderQty, actualQty, excessQty, orderQtyTotal, actualQtyTotal, excessQtyTotal };
}

function calculateTotalOrderSummary(rec, sizes) {
  const orderQty = {};
  const actualQty = {};
  const excessQty = {};
  let orderQtyTotal = 0, actualQtyTotal = 0, excessQtyTotal = 0;

  sizes.forEach(s => {
    orderQty[s] = (rec.orderQty && rec.orderQty[s]) || 0;
    let aq = 0;
    rec.cartons.forEach(c => {
      if (c.sizes) aq += (c.sizes[s] || 0) * (c.ctnNum || 0);
    });
    actualQty[s] = aq;
    excessQty[s] = aq - orderQty[s];
    orderQtyTotal += orderQty[s];
    actualQtyTotal += aq;
    excessQtyTotal += excessQty[s];
  });

  return { orderQty, actualQty, excessQty, orderQtyTotal, actualQtyTotal, excessQtyTotal };
}

        html += `<td rowspan="${cartons.length}" style="text-align:center;border:1px solid #000;">${totalVol?+totalVol.toFixed(2):''}</td>`;
      }
    } else {
      html += `<td style="text-align:center;border:1px solid #000;">${c.dimL||''}</td>`;
      html += `<td style="text-align:center;border:1px solid #000;">${c.dimW||''}</td>`;
      html += `<td style="text-align:center;border:1px solid #000;">${c.dimH||''}</td>`;
      html += `<td style="text-align:center;border:1px solid #000;">${c.volume?+c.volume.toFixed(4):''}</td>`;
    }
    html += `</tr>`;
  });

  // Total row
  const totals = calculateTotals(rec);
  html += `<tr>`;
  html += `<td colspan="3" style="font-weight:bold;border:1px solid #000;">Total:</td>`;
  sizes.forEach(s => html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.sizeTotals[s]||0}</td>`);
  html += `<td style="border:1px solid #000;"></td>`;
  html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.ctnNum}</td>`;
  html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.totalQty}</td>`;
  html += `<td style="border:1px solid #000;"></td><td style="border:1px solid #000;"></td>`;
  html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.grossTotal.toFixed(2)}</td>`;
  html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.netTotal.toFixed(2)}</td>`;
  html += `<td colspan="3" style="border:1px solid #000;"></td>`;
  html += `<td style="font-weight:bold;text-align:center;border:1px solid #000;">${totals.volume.toFixed(2)}</td>`;
  html += `</tr>`;

  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;"></td></tr>`;

  // Summary section
  html += `<tr><td colspan="${tc}" style="font-size:14pt;font-weight:bold;">Summary:</td></tr>`;
  html += `<tr>`;
  html += `<td rowspan="2" style="border:1px solid #000;"></td>`;
  html += `<td rowspan="2" style="font-weight:bold;text-align:center;border:1px solid #000;">Color</td>`;
  html += `<td colspan="${n}" style="font-weight:bold;text-align:center;border:1px solid #000;">Sizes</td>`;
  html += `<td rowspan="2" style="font-weight:bold;text-align:center;border:1px solid #000;">Total:</td>`;
  html += `<td colspan="${tc-n-3}" style="border:none;"></td>`;
  html += `</tr>`;
  html += `<tr>`;
  sizes.forEach(s => html += `<td style="text-align:center;border:1px solid #000;">${s}</td>`);
  html += `<td colspan="${tc-n-3}" style="border:none;"></td>`;
  html += `</tr>`;

  // Summary data
  const colors = getColorsFromCartons(cartons);
  const summaryData = calculateSummaryByColor(rec, sizes, colors);
  const summaryRows = ['Order Qty PC', 'Actual Qty PC', 'Excess Qty', '% of order'];
  summaryRows.forEach((rowLabel, rowIdx) => {
    html += `<tr>`;
    html += `<td style="font-weight:bold;border:1px solid #000;">${rowLabel}</td>`;
    if (rowIdx === 0 && colors.length > 0) {
      html += `<td rowspan="4" style="font-weight:bold;text-align:center;border:1px solid #000;">${colors[0]}</td>`;
    } else if (rowIdx === 0) {
      html += `<td rowspan="4" style="border:1px solid #000;"></td>`;
    }
    if (colors.length > 0) {
      const color = colors[0];
      sizes.forEach(s => {
        let val = '';
        if (rowIdx === 0) val = (summaryData.orderQty[color] && summaryData.orderQty[color][s]) || '';
        else if (rowIdx === 1) val = (summaryData.actualQty[color] && summaryData.actualQty[color][s]) || '';
        else if (rowIdx === 2) val = (summaryData.excessQty[color] && summaryData.excessQty[color][s]) || '';
        else if (rowIdx === 3) {
          const pct = (summaryData.actualQty[color] && summaryData.actualQty[color][s] && summaryData.orderQty[color] && summaryData.orderQty[color][s]) ?
            (summaryData.actualQty[color][s] / summaryData.orderQty[color][s]) : 0;
          val = pct ? (pct * 100).toFixed(1) + '%' : '';
        }
        html += `<td style="text-align:center;border:1px solid #000;${rowIdx===1?'font-weight:bold;':''}">${val}</td>`;
      });
      let totalVal = '';
      if (rowIdx === 0) totalVal = summaryData.orderQtyTotal[colors[0]] || '';
      else if (rowIdx === 1) totalVal = summaryData.actualQtyTotal[colors[0]] || '';
      else if (rowIdx === 2) totalVal = summaryData.excessQtyTotal[colors[0]] || '';
      else if (rowIdx === 3) {
        const pct = (summaryData.actualQtyTotal[colors[0]] && summaryData.orderQtyTotal[colors[0]]) ?
          (summaryData.actualQtyTotal[colors[0]] / summaryData.orderQtyTotal[colors[0]]) : 0;
        totalVal = pct ? (pct * 100).toFixed(1) + '%' : '';
      }
      html += `<td style="text-align:center;border:1px solid #000;">${totalVal}</td>`;
    } else {
      sizes.forEach(s => html += `<td style="border:1px solid #000;"></td>`);
      html += `<td style="border:1px solid #000;"></td>`;
    }
    html += `<td colspan="${tc-n-3}" style="border:none;"></td>`;
    html += `</tr>`;
  });

  // Empty
  html += `<tr><td colspan="${tc}" style="border:none;"></td></tr>`;

  // Total order section
  html += `<tr><td colspan="${tc}" style="font-size:14pt;font-weight:bold;">Total order:</td></tr>`;
  html += `<tr>`;
  html += `<td rowspan="2" style="border:1px solid #000;"></td>`;
  html += `<td colspan="${n}" style="font-weight:bold;text-align:center;border:1px solid #000;">Sizes</td>`;
  html += `<td rowspan="2" style="font-weight:bold;text-align:center;border:1px solid #000;">Total:</td>`;
  html += `<td colspan="${tc-n-2}" style="border:none;"></td>`;
  html += `</tr>`;
  html += `<tr>`;
  sizes.forEach(s => html += `<td style="text-align:center;border:1px solid #000;">${s}</td>`);
  html += `<td colspan="${tc-n-2}" style="border:none;"></td>`;
  html += `</tr>`;

  const totalOrderData = calculateTotalOrderSummary(rec, sizes);
  const orderRows2 = ['Order Qty PC', 'Actual Qty PC', 'Excess Qty', '% of order'];
  orderRows2.forEach((label, rowIdx) => {
    html += `<tr>`;
    html += `<td style="font-weight:bold;border:1px solid #000;">${label}</td>`;
    sizes.forEach(s => {
      let val = '';
      if (rowIdx === 0) val = totalOrderData.orderQty[s] || '';
      else if (rowIdx === 1) val = totalOrderData.actualQty[s] || '';
      else if (rowIdx === 2) val = totalOrderData.excessQty[s] || '';
      else if (rowIdx === 3) {
        const pct = totalOrderData.actualQty[s] && totalOrderData.orderQty[s] ?
          (totalOrderData.actualQty[s] / totalOrderData.orderQty[s]) : 0;
        val = pct ? (pct * 100).toFixed(1) + '%' : '';
      }
      html += `<td style="text-align:center;border:1px solid #000;${rowIdx===1?'font-weight:bold;':''}">${val}</td>`;
    });
    let totalVal = '';
    if (rowIdx === 0) totalVal = totalOrderData.orderQtyTotal || '';
    else if (rowIdx === 1) totalVal = totalOrderData.actualQtyTotal || '';
    else if (rowIdx === 2) totalVal = totalOrderData.excessQtyTotal || '';
    else if (rowIdx === 3) {
      const pct = totalOrderData.actualQtyTotal && totalOrderData.orderQtyTotal ?
        (totalOrderData.actualQtyTotal / totalOrderData.orderQtyTotal) : 0;
      totalVal = pct ? (pct * 100).toFixed(1) + '%' : '';
    }
    html += `<td style="text-align:center;border:1px solid #000;">${totalVal}</td>`;
    html += `<td colspan="${tc-n-2}" style="border:none;"></td>`;
    html += `</tr>`;
  });

  html += '</table></body></html>';

  const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `PL_${rec.style||'unnamed'}_${rec.poNo||''}.xls`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function generateCustomsInvoice(rec) {
  const qty = rec.totalActualQty || 0;
  const unitPrice = rec.customsPrice || 0;

  const invDate = formatDateStr(rec.invoiceDate);
  const etdDate = formatDateStr(rec.etd);

  const buyerLines = (rec.buyerAddr || '').split('\n').filter(r => r.trim());
  const ns = 'border:none;';
  const med = 'border-bottom:1.5px solid #000;';

  let html = '<table class="cus-form">';
  // Company header - LEFT-aligned with leading spaces (matching original)
  html += `<tr><td colspan="10" class="l" style="${ns}">             ${rec.companyCn||'江苏舜天汉唐贸易有限公司'}</td></tr>`;
  html += `<tr><td colspan="10" class="m" style="${ns}">  ${rec.company||''}</td></tr>`;
  html += `<tr><td colspan="10" class="s" style="${ns}">      ${rec.companyAddr||''}</td></tr>`;
  // Title - LEFT-aligned with leading spaces (not centered)
  html += `<tr><td colspan="10" class="l" style="${ns}">                      发   票</td></tr>`;
  html += `<tr><td colspan="10" class="m" style="${ns}">                  INVOICE</td></tr>`;
  // Invoice No. (right side, cols 7-9)
  html += `<tr><td colspan="7" style="${ns}"></td><td style="${ns}">发 票 号 码</td><td colspan="2" style="${ns}">${rec.invoiceNo||''}</td></tr>`;
  html += `<tr><td colspan="7" style="${ns}"></td><td colspan="3" style="${ns}"> INVOICE NO.</td></tr>`;
  // TO: buyer info (left) | 合约号码 (right)
  html += `<tr><td colspan="7" style="${ns}">TO： M/S.</td><td style="${ns}">合 约 号 码</td><td colspan="2" style="${ns}">${rec.contractNo||''}</td></tr>`;
  html += `<tr><td colspan="7" style="${ns}">${rec.buyerFull||rec.buyer||''}</td><td colspan="3" style="${ns}"> S/C NO.</td></tr>`;
  // Buyer address lines
  buyerLines.forEach(line => {
    html += `<tr><td colspan="7" style="${ns}">${line}</td></tr>`;
  });
  // 日期 (right) - with bottom border (medium line separator)
  html += `<tr><td colspan="7" class="bb" style="${ns}"></td><td class="bb" style="${ns}">日          期</td><td colspan="2" class="bb" style="${ns}">${invDate}</td></tr>`;
  html += `<tr><td colspan="7" style="${ns}"></td><td colspan="3" style="${ns}"> DATE</td></tr>`;
  // 船期 / 付款方式 / 运输方式 - with top border and vertical separators
  html += `<tr><td class="bt bl" style="${ns}">船期：</td><td colspan="2" class="bt" style="${ns}">${etdDate}</td><td class="bt bl" style="${ns}">付款方式</td><td colspan="3" class="bt" style="${ns}">${rec.paymentTerms||'T/T'}</td><td class="bt bl" style="${ns}">运输方式：</td><td colspan="2" class="bt" style="${ns}">BY SEA</td></tr>`;
  html += `<tr><td colspan="3" class="b bb bl" style="${ns}"> Sailing date:</td><td colspan="4" class="b bb" style="${ns}"> Term of payment:</td><td colspan="3" class="b bb" style="${ns}"> Mode of transport:</td></tr>`;
  // 船名 / 原产地 / 目的国 - with top border
  html += `<tr><td class="bt bl" style="${ns}">船名：</td><td colspan="2" class="bt" style="${ns}">${rec.shipPer||''}</td><td class="bt bl" style="${ns}">原产地：</td><td colspan="2" class="bt" style="${ns}">${rec.originCountry||'CHINA'}</td><td class="bt bl" style="${ns}">目的国：</td><td colspan="3" class="bt" style="${ns}">${rec.toPort||''}</td></tr>`;
  html += `<tr><td colspan="3" class="b bb bl" style="${ns}"> Vessel name:</td><td colspan="3" class="b bb" style="${ns}"> Country of origin:</td><td colspan="4" class="b bb" style="${ns}"> Final destination:</td></tr>`;
  // Price terms
  html += `<tr><td colspan="7" style="${ns}"></td><td colspan="3" style="${ns}">${rec.priceTerms||'FOB SHANGHAI'}</td></tr>`;
  html += '</table>';

  // Product table (with borders) - matching original column merge pattern
  html += '<table class="cus-table">';
  // Header row
  html += `<tr><td colspan="3" style="text-align:center;">DESCRIPTION</td><td colspan="2" style="text-align:center;">STYLE NO.</td><td colspan="2" style="text-align:center;">ORDER NO.</td><td style="text-align:center;">PIECES</td><td style="text-align:center;">PRICE</td><td style="text-align:center;">ORDER SUM</td></tr>`;

  html += '</table>';

  // Shipping marks (borderless)
  html += '<table class="cus-form">';
  html += `<tr class="gap"><td colspan="10"></td></tr>`;
  html += `<tr><td colspan="10" style="${ns}">Shipping Marker:</td></tr>`;
  marks.forEach(m => {
    html += `<tr><td colspan="10" style="${ns}">${m}</td></tr>`;
  });
  html += `<tr class="gap"><td colspan="10"></td></tr>`;
  html += `<tr><td colspan="10" style="${ns}">HS Code: ${rec.hsCode||''}</td></tr>`;
  html += `<tr><td colspan="10" style="${ns}">中文品名: ${rec.cnName||''}</td></tr>`;
  html += `<tr class="gap"><td colspan="10"></td></tr>`;
  html += `<tr><td colspan="10" class="rgt" style="${ns}">${rec.company||''}</td></tr>`;
  html += '</table>';
  return html;
}

function generateCustomsPL(rec) {

  const totalNet = cartons.reduce((s,c) => s + (c.netTotal||0), 0);
  const totalVol = cartons.reduce((s,c) => s + (c.volume||0), 0);
  const invDate = formatDateStr(rec.invoiceDate);

function generateDeclElements(rec) {
  const elements = [
    ['1:品名;', rec.cnName || ''],
    ['2:品牌类型;', rec.brandType || ''],
    ['3:出口享惠情况;', rec.exportPref || ''],
    ['4:织造方法(机织等);', rec.weaveMethod || ''],
    ['5:种类(上衣);', rec.declCategory || ''],
    ['6:类别(女式);', rec.declGender || ''],
    ['7:成分含量;', rec.compositionCn || ''],
    ['8:是否全开襟;', rec.fullOpen || ''],
    ['9:是否有拉链;', rec.hasZipper || ''],
    ['10:品牌;', rec.declBrand || ''],
    ['11:货号;', rec.customsItemNo || ''],
  ];
  let html = '<table class="cus-elem-form">';
  // Each element: label (col 0) | value (col 1) - no borders, no header
  elements.forEach(([label, val]) => {
    html += `<tr><td class="label">${label}</td><td class="value">${val}</td></tr>`;
  });
  html += '</table>';
  return html;
}

function generateContract(rec) {
  const qty = rec.totalActualQty || 0;

  const invDate = formatDateStr(rec.invoiceDate);

  let html = '<table class="cus-table">';
  html += `<tr><td colspan="4" style="font-size:16pt;font-weight:bold;text-align:center;${s}">外 贸 合 同</td></tr>`;
  html += `<tr><td colspan="4" style="font-size:14pt;font-weight:bold;text-align:center;${s}">CONTRACT</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  html += `<tr><td style="${s}">Contract No.</td><td style="${s}">${rec.contractNo||''}</td><td style="${s}">Date</td><td style="${s}">${invDate}</td></tr>`;
  html += `<tr><td style="${s}">Invoice No.</td><td style="${s}">${rec.invoiceNo||''}</td><td style="${s}">Place</td><td style="${s}">${rec.fromPort||''}</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  // Parties
  html += `<tr><td style="${s}">卖方<br>SELLER</td><td colspan="3" style="${s}">${rec.company||''}<br>${rec.companyAddr||''}<br>信用代码: ${rec.creditCode||''}</td></tr>`;
  html += `<tr><td style="${s}">买方<br>BUYER</td><td colspan="3" style="${s}">${rec.buyerFull||rec.buyer||''}<br>${rec.buyerAddr||''}</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  // Terms
  html += `<tr><td style="${s}">价格条款<br>Price Terms</td><td style="${s}">${rec.priceTerms||''}</td><td style="${s}">付款方式<br>Payment</td><td style="${s}">${rec.paymentTerms||''}</td></tr>`;
  html += `<tr><td style="${s}">运输方式<br>Shipping</td><td style="${s}">${rec.shipPer||'BY SEA'}</td><td style="${s}">起运港/目的港<br>Port</td><td style="${s}">${rec.fromPort||''} → ${rec.toPort||''}</td></tr>`;
  html += `<tr><td style="${s}">装运期限<br>Shipment</td><td style="${s}">${formatDateStr(rec.etd)}</td><td style="${s}">到货港<br>Dest. Port</td><td style="${s}">${rec.destPort||rec.toPort||''}</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  // Goods
  html += `<tr><td style="${s}">货号<br>Art. No.</td><td style="${s}">品名及规格<br>Description</td><td style="${s}">数量<br>Qty</td><td style="${s}">单价及总价<br>Unit Price / Total</td></tr>`;
  html += `<tr><td style="${s}">${rec.style||''}</td><td style="${s}">${rec.fullDesc||rec.itemDesc||''}<br>HS: ${rec.hsCode||''}</td><td style="${s}">${qty} PCS</td><td style="${s}">${unitPrice} USD<br>${total} USD</td></tr>`;
  html += `<tr><td colspan="2" style="border:none;text-align:right;${s}">TOTAL:</td><td style="${s}">${qty} PCS</td><td style="${s}">${total} USD</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  // Bank info
  html += `<tr><td style="${s}">收款信息<br>Bank Details</td><td colspan="3" style="${s}">${rec.bankCompany||''}<br>${rec.bankName||''} ${rec.swift||''}<br>A/C NO.: ${rec.acctNo||''}</td></tr>`;
  html += `<tr><td colspan="4" style="border:none;height:10px;"></td></tr>`;
  // Signature
  html += `<tr><td colspan="2" style="${s};text-align:center;height:40px;">卖方签章<br>SELLER</td><td colspan="2" style="${s};text-align:center;height:40px;">买方签章<br>BUYER</td></tr>`;
  html += '</table>';
  return html;
}

let modalCallback = null;

}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  modalCallback = null;
}

  if (modalCallback) modalCallback();
  closeModal();
};
