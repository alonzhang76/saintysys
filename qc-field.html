  var fFilter = document.getElementById('dashFactoryFilter');
  var qFilter = document.getElementById('dashQcFilter');
  var curF = fFilter.value, curQ = qFilter.value;
  fFilter.innerHTML = '<option value="">全部服装厂</option>' + factories.map(f=>'<option value="'+esc(f)+'" '+(curF===f?'selected':'')+'>'+esc(f)+'</option>').join('');
  qFilter.innerHTML = '<option value="">全部QC</option>' + qcs.map(q=>'<option value="'+esc(q)+'" '+(curQ===q?'selected':'')+'>'+esc(q)+'</option>').join('');
  fFilter.value = curF; qFilter.value = curQ;

  var fVal = fFilter.value, qVal = qFilter.value;
  var filtered = records.filter(r=>{
    if(fVal && r.factory!==fVal) return false;
    if(qVal && r.qcName!==qVal) return false;
    return true;
  });

  var container = document.getElementById('ganttContainer');
  if(filtered.length === 0){
    container.innerHTML = '<div class="qc-empty-state"><div class="icon">📊</div><p>暂无数据</p></div>';
    return;
  }

  // Header
  var html = '<div class="qc-gantt-container"><div class="qc-gantt-header">';
  html += '<div class="qc-gantt-info">服装厂 / 款号</div>';
  html += '<div class="qc-gantt-stages">';
  html += '<div class="qc-gantt-stage check-col">最新检查</div>';
  STAGES_WASH.forEach(s=>{ html += '<div class="qc-gantt-stage">'+s.short+'</div>'; });
  STAGES_GARMENT.filter(s=>s.key!=='g_online').forEach(s=>{ html += '<div class="qc-gantt-stage">'+s.short+'</div>'; });
  html += '</div><div class="qc-gantt-delivery">交期</div></div>';

  // Rows
  filtered.forEach(r=>{
    var pct = getProgressPercent(r);
    var today = new Date(); today.setHours(0,0,0,0);
    var countdown = '', cdClass = 'ok';
    if(r.deliveryDate){
      var dd = new Date(r.deliveryDate);
      var days = Math.ceil((dd - today) / (1000*60*60*24));
      if(days < 0){ countdown = '逾期'+(-days)+'天'; cdClass='overdue'; }
      else if(days <= 7){ countdown = '剩'+days+'天'; cdClass='soon'; }
      else { countdown = '剩'+days+'天'; cdClass='ok'; }
    }

    html += '<div class="qc-gantt-row" onclick="viewRecord(\''+r.id+'\')" style="cursor:pointer;">';
    html += '<div class="qc-gantt-info"><div class="factory">'+esc(r.factory)+'</div><div class="meta">'+esc(r.styleNo)+' | '+esc(r.qcName)+' | '+esc(r.orderNo)+'</div></div>';
    html += '<div class="qc-gantt-stages">';
    // 最新检查 column (first)
    var onlineRecs = r.garment?.onlineRecords||[];
    var latestRec = onlineRecs.length>0 ? onlineRecs[onlineRecs.length-1] : null;
    if(latestRec){
      html += '<div class="qc-gantt-stage check-col" title="最新检查 - '+esc(latestRec.qcName||'-')+' '+(latestRec.date||'')+'"><span class="stage-name">'+esc(latestRec.qcName||'-')+'</span><span class="stage-date">'+(latestRec.date?latestRec.date.slice(5):'')+'</span></div>';
    } else {
      html += '<div class="qc-gantt-stage check-col empty" title="最新检查 - 无记录"><span class="stage-name">-</span></div>';
    }
    STAGES_WASH.forEach(s=>{
      if(!r.needWash){
        html += '<div class="qc-gantt-stage na" title="不适用"><span class="stage-name">'+s.short+'</span></div>';
      } else {
        var st = getStageStatus(r, s.key);
        var dt = getStageDate(r, s.key);
        html += '<div class="qc-gantt-stage '+st+'" title="'+s.name+' - '+(st==='done'?'已完成':st==='progress'?'进行中':st==='issue'?'有问题':'未开始')+(dt?' ('+dt+')':'')+'"><span class="stage-name">'+s.short+'</span>'+(dt?'<span class="stage-date">'+dt.slice(5)+'</span>':'')+(st==='issue'?'<span class="issue-flag">!</span>':'')+'</div>';
      }
    });
    STAGES_GARMENT.filter(s=>s.key!=='g_online').forEach(s=>{
      var st = getStageStatus(r, s.key);
      var dt = getStageDate(r, s.key);
      html += '<div class="qc-gantt-stage '+st+'" title="'+s.name+' - '+(st==='done'?'已完成':st==='progress'?'进行中':st==='issue'?'有问题':'未开始')+(dt?' ('+dt+')':'')+'"><span class="stage-name">'+s.short+'</span>'+(dt?'<span class="stage-date">'+dt.slice(5)+'</span>':'')+(st==='issue'?'<span class="issue-flag">!</span>':'')+'</div>';
    });
    html += '</div>';
    html += '<div class="qc-gantt-delivery"><div class="date">'+(r.deliveryDate||'-')+'</div><div class="countdown '+cdClass+'">'+countdown+'</div></div>';
    html += '</div>';
  });

  html += '</div>';
  container.innerHTML = html;
}

// ==================== 详情弹窗 ====================
function showDetailModal(r){
  document.getElementById('modalTitle').textContent = r.factory + ' - ' + r.styleNo;
  var g = r.garment, w = r.washing;
  var status = getOverallStatus(r);
  var pct = getProgressPercent(r);
  var statusMap = {done:'已完成',progress:'进行中',issue:'有问题',overdue:'已逾期',pending:'未开始'};
  var matStatusMap = {consistent:'核对一致',inconsistent:'有差异',pending:'待核对'};

  var html = '<div class="qc-detail-section"><h3>📋 基础信息</h3><div class="qc-detail-grid">';
  html += detailItem('服装厂', r.factory);
  html += detailItem('QC姓名', r.qcName);
  html += detailItem('订单号', r.orderNo);
  html += detailItem('款号', r.styleNo);
  html += detailItem('交期', r.deliveryDate);
  html += detailItem('状态', statusMap[status]||status);
  html += detailItem('进度', pct+'%');
  html += '</div></div>';

  if(r.styleImage){
    // r.styleImage 可能是 base64 data URL / 绝对 URL / Supabase path
    var si = String(r.styleImage || '');
    if(si.indexOf('data:image')===0 || si.indexOf('http')===0){
      html += '<div class="qc-detail-section"><h3>📷 款式图</h3><img src="'+escAttr(si)+'" onclick="openImageFullscreen(\''+escAttr(si)+'\')" style="cursor:zoom-in;max-width:200px;max-height:280px;border-radius:6px;border:1px solid var(--qc-border);"></div>';
    } else {
      // Supabase Storage path → 交给 resolveModalImages 异步加载
      html += '<div class="qc-detail-section"><h3>📷 款式图</h3><img data-img-path="'+escAttr(si)+'" src="" style="max-width:200px;min-width:160px;min-height:220px;max-height:280px;border-radius:6px;border:1px solid var(--qc-border);cursor:zoom-in;background:#f8f9fa;" alt="加载中..."></div>';
    }
  }

  // 尺寸数量表（兼容旧 sizes 格式与新 sizeSnapshot 格式）
  var snapshot = r.sizeSnapshot;
  if(snapshot && snapshot.rows && snapshot.sizes && snapshot.rows.length){
    html += '<div class="qc-detail-section"><h3>📏 订单各尺寸数量</h3><table class="qc-detail-table"><thead><tr>'+
      '<th>包装ID</th><th>Ass.Type</th><th>Color Code</th><th>Color</th><th>箱数</th>' +
      snapshot.sizes.map(function(s){ return '<th style="text-align:center;">'+esc(s)+'</th>'; }).join('') +
      '<th style="text-align:center;">合计</th></tr></thead><tbody>';
    var grandTotal = 0;
    snapshot.rows.forEach(function(row){
      html += '<tr>'+
        '<td>'+esc(row.packageId || '-')+'</td>'+
        '<td>'+esc(row.assType || '-')+'</td>'+
        '<td>'+esc(row.colorCode || '-')+'</td>'+
        '<td>'+esc(row.colorName || '-')+'</td>'+
        '<td style="text-align:center;">'+(row.noOfCartons || '-')+'</td>' +
        snapshot.sizes.map(function(s){
          var q = (row.quantities && row.quantities[s]) || 0;
          return '<td style="text-align:center;">'+(q > 0 ? q : '-')+'</td>';
        }).join('') +
        '<td style="text-align:center;font-weight:600;">'+(row.rowTotal || 0)+'</td>' +
        '</tr>';
      grandTotal += (row.rowTotal || 0);
    });
    html += '<tr style="background:#f8f9fa;font-weight:600;"><td colspan="'+(5+snapshot.sizes.length)+'" style="text-align:right;">总计</td><td style="text-align:center;">'+grandTotal+'</td></tr>';
    html += '</tbody></table></div>';
  } else if(r.sizes && r.sizes.length){
    html += '<div class="qc-detail-section"><h3>📏 尺寸数量</h3><table class="qc-detail-table"><thead><tr><th>尺码</th><th>数量</th></tr></thead><tbody>';
    var total = 0;
    r.sizes.forEach(s=>{ html += '<tr><td>'+esc(s.size)+'</td><td>'+s.qty+'</td></tr>'; total += s.qty; });
    html += '<tr><td style="font-weight:600;">合计</td><td style="font-weight:600;">'+total+'</td></tr>';
    html += '</tbody></table></div>';
  }

  // Flow diagram
  var allStages = r.needWash ? [...STAGES_WASH, ...STAGES_GARMENT] : STAGES_GARMENT;
  html += '<div class="qc-detail-section"><h3>🔄 工序流程</h3><div class="qc-flow-diagram">';
  allStages.forEach((s,i)=>{
    if(i>0) html += '<span class="qc-flow-arrow">→</span>';
    var st = getStageStatus(r, s.key);
    html += '<span class="qc-flow-node '+st+'">'+s.short+'</span>';
  });
  html += '</div></div>';

  // Washing details
  if(r.needWash && w){
    html += '<div class="qc-detail-section"><h3>🌊 水洗版块</h3><div class="qc-detail-grid">';
    html += detailItem('水洗标样确认', (w.sampleReceived?.confirmed?'✅ 已确认':'⬜ 未确认')+(w.sampleReceived?.date?' ('+w.sampleReceived.date+')':''));
    html += detailItem('头缸时间', w.firstBatch?.date||'-');
    html += detailItem('头缸数量', w.firstBatch?.quantity||'-');
    html += detailItem('头缸问题', w.firstBatch?.issues||'-');
    if(normalizeImages(w.firstBatch?.image).length){
      html += detailIssueImage(w.firstBatch.image, '头缸问题图片');
    }
    html += detailItem('大货水洗方法', (w.bulkMethod?.confirmed?'✅ ':'')+ (w.bulkMethod?.method||'-'));
    html += detailItem('大货水洗时间', w.bulkWashing?.date||'-');
    html += detailItem('大货水洗结束', w.bulkWashing?.endDate||'-');
    html += detailItem('大货总缸数', w.bulkWashing?.totalBatches||'-');
    html += detailItem('大货水洗问题', w.bulkWashing?.issues||'-');
    if(normalizeImages(w.bulkWashing?.image).length){
      html += detailIssueImage(w.bulkWashing.image, '大货水洗问题图片');
    }
    html += detailItem('问题整改', w.bulkWashing?.rectification||'-');
    html += detailItem('大货问题解决', (w.bulkResolved?.resolved?'✅ 已解决':'⬜ 未解决')+(w.bulkResolved?.date?' ('+w.bulkResolved.date+')':''));
    html += '</div></div>';
  }

  // Garment details
  if(g){
    html += '<div class="qc-detail-section"><h3>👕 服装版块</h3><div class="qc-detail-grid">';
    html += detailItem('封样样衣', (g.sealedSample?.confirmed?'✅ 已确认':'⬜ 未确认')+(g.sealedSample?.date?' ('+g.sealedSample.date+')':''));
    html += detailItem('封样意见', g.sealedSample?.opinion||'-');
    html += detailItem('PP产前样', (g.ppSample?.confirmed?'✅ 已确认':'⬜ 未确认')+(g.ppSample?.date?' ('+g.ppSample.date+')':''));
    html += detailItem('PP产前样备注', g.ppSample?.notes||'-');
    html += detailItem('面里辅料核对', (matStatusMap[g.materialsCheck?.status]||'-')+(g.materialsCheck?.date?' ('+g.materialsCheck.date+')':''));
    html += detailItem('辅料核对备注', g.materialsCheck?.notes||'-');
    if(normalizeImages(g.materialsCheck?.image).length){
      html += detailIssueImage(g.materialsCheck.image, '辅料核对图片');
    }
    html += detailItem('开裁时间', g.cuttingDate||'-');
    html += detailItem('上机缝制', g.sewStartDate||'-');
    html += detailItem('缝制结束', g.sewEndDate||'-');
    html += detailItem('后道整理', g.finishDate||'-');
    html += detailItem('包装日期', g.packDate||'-');
    html += detailItem('出货日期', g.shipDate||'-');
    html += '</div></div>';
  }

  // Online records
  if(g?.onlineRecords?.length){
    html += '<div class="qc-detail-section"><h3>🏭 上线记录</h3><table class="qc-detail-table"><thead><tr><th>序号</th><th>日期</th><th>QC姓名</th><th>查看备注</th></tr></thead><tbody>';
    g.onlineRecords.forEach((o,i)=>{
      html += '<tr><td>'+(i+1)+'</td><td>'+(o.date||'-')+'</td><td>'+(esc(o.qcName)||'-')+'</td><td>'+(esc(o.notes)||'-')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Production issues
  if(g?.productionIssues?.length){
    html += '<div class="qc-detail-section"><h3>⚠ 生产问题及整改</h3><table class="qc-detail-table"><thead><tr><th>序号</th><th>发现日期</th><th>问题描述</th><th>整改措施</th><th>状态</th><th>解决日期</th><th>问题图片</th></tr></thead><tbody>';
    g.productionIssues.forEach((p,i)=>{
      html += '<tr><td>'+(i+1)+'</td><td>'+(p.date||'-')+'</td><td>'+(esc(p.issue)||'-')+'</td><td>'+(esc(p.rectification)||'-')+'</td><td>'+(p.status==='resolved'?'<span class="qc-status-badge qc-status-done">已解决</span>':'<span class="qc-status-badge qc-status-issue">未解决</span>')+'</td><td>'+(p.resolvedDate||'-')+'</td><td>'+detailIssueImageCell(p.image)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Action buttons
  html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;"><button class="qc-btn qc-btn-primary" onclick="closeModal();editRecord(\''+r.id+'\')">编辑</button><button class="qc-btn qc-btn-outline" onclick="closeModal()">关闭</button></div>';

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('show');
  // 异步解析所有 Supabase 路径的图片
  setTimeout(resolveModalImages, 50);
}
function detailItem(label, value){
  return '<div class="qc-detail-item"><span class="label">'+label+'</span><span class="value">'+esc(String(value||'-'))+'</span></div>';
}
// 详情弹窗：渲染一个固定问题图片块（支持多图数组）
function detailIssueImage(imgData, label){
  // 兼容旧单图格式（对象）和新多图格式（数组）
  var imgs = normalizeImages(imgData);
  if(imgs.length === 0) return '';
  var dateStr = imgs[0].date ? ' (' + imgs[0].date + ')' : '';
  var html = '<div class="qc-detail-item" style="grid-column:1/-1;">'+
    '<span class="label">'+esc(label)+dateStr+'（'+imgs.length+'张）</span>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
  imgs.forEach(function(im, i){
    var p = im.path;
    if(!p) return;
    if(typeof p === 'string' && p.indexOf('data:image') === 0){
      html += '<img src="'+escAttr(p)+'" style="max-width:160px;max-height:200px;border-radius:6px;border:1px solid var(--qc-border);cursor:zoom-in;" onclick="openImageFullscreen(\''+escAttr(p)+'\')">';
    } else {
      html += '<img data-img-path="'+escAttr(p)+'" src="" style="max-width:160px;max-height:200px;border-radius:6px;border:1px solid var(--qc-border);cursor:zoom-in;background:#f8f9fa;" alt="加载中..." title="'+escAttr(im.name||'')+'">';
    }
  });
  html += '</div></div>';
  return html;
}
// 详情弹窗：生产问题表格中的图片单元格（支持多图数组）
function detailIssueImageCell(imgData){
  var imgs = normalizeImages(imgData);
  if(imgs.length === 0) return '-';
  var html = '';
  imgs.forEach(function(im, i){
    var p = im.path;
    if(!p) return;
    if(typeof p === 'string' && p.indexOf('data:image') === 0){
      html += '<img src="'+escAttr(p)+'" style="width:46px;height:46px;object-fit:cover;border-radius:4px;border:1px solid var(--qc-border);cursor:zoom-in;margin-right:2px;" onclick="openImageFullscreen(\''+escAttr(p)+'\')" title="'+escAttr(im.date||'')+'">';
    } else {
      html += '<img data-img-path="'+escAttr(p)+'" src="" style="width:46px;height:46px;object-fit:cover;border-radius:4px;border:1px solid var(--qc-border);background:#f8f9fa;cursor:zoom-in;margin-right:2px;" alt="..." title="'+escAttr(im.date||'')+'">';
    }
  });
  return html || '-';
}
// 详情弹窗渲染后：解析所有 [data-img-path] 为 signed URL
function resolveModalImages(){
  var imgs = document.querySelectorAll('#modalBody img[data-img-path]');
  if(imgs.length === 0) return;
  // 从 modalTitle 提取款号（格式 "工厂 - 款号"）给 resolveImageUrl 用（款号 fallback 路径匹配非常关键）
  var sn = '';
  try{
    var modalTitle = document.getElementById('modalTitle');
    if(modalTitle){
      var parts = modalTitle.textContent.split(/\s*-\s*/);
      if(parts.length >= 2) sn = (parts[parts.length-1] || '').trim();
    }
  }catch(_){}
  imgs.forEach(function(img){
    var path = img.getAttribute('data-img-path');
    if(!path) return;
    // 点击全屏
    img.onclick = function(){ openImageFullscreenByPath(path); };
    img.style.cursor = 'zoom-in';
    // 先尝试 StyleImgCache signed URL 兜底（款号 → 款式图快速回显）
    try{
      if(window.StyleImgCache && sn){
        var ent = StyleImgCache.resolve(sn);
        if(ent && (ent.styleImg_path === path || ent.fullImg_path === path)){
          var signedUrl = ent.styleImg_signed || ent.fullImg_signed;
          if(signedUrl){ img.src = signedUrl; }
        }
      }
    }catch(_){}
    // 本地缓存：styleImages 同 path 的 signed URL 立即填
    try{
      var cache = JSON.parse(localStorage.getItem('styleImages') || '{}');
      if(cache && typeof cache === 'object'){
        for(var _k in cache){
          var en = cache[_k];
          if(en && (en.styleImg_path === path || en.fullImg_path === path)){
            var _s = en.styleImg_signed || en.fullImg_signed;
            if(_s){ img.src = _s; break; }
          }
        }
      }
    }catch(_){}
    // 核心：resolveImageUrl（REST 直签 + 款号 fallback）— 对齐订单列表速度
    _resolvePicUrl(path, { hintStyleNo: sn, requireReady: false }).then(function(url){
      if(url){ img.src = url; img.alt = ''; }
      else img.alt = '加载失败';
    });
  });
}
function closeModal(){
  document.getElementById('detailModal').classList.remove('show');
}

// ==================== 工具 ====================
function esc(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escAttr(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ==================== 初始化 ====================
function init(){
  loadData();
  updateCount();
  populateContactDatalists();
  populateStyleNoDatalist();
  renderQcTags();
  // 初始化三个固定问题图片块（空白状态）
  ['wFirstIssue','wBulkIssue','gMatIssue'].forEach(function(prefix){
    renderIssueImageBlock(prefix);
  });
}

init();
