// ===== 上传一张图片到 Supabase，并更新预览/隐藏字段/状态 =====
// 供 onSamplePicFileChange（本地文件）和 nasPickForSample（NAS 文件）共用
async function _uploadSamplePicture(prefix, file) {
  var statusEl = document.getElementById(prefix + 'picStatus');
  var pathEl = document.getElementById(prefix + 'picture_path');
  var nameEl = document.getElementById(prefix + 'picture_name');
  var fnameEl = document.getElementById(prefix + 'picFilename');
  var delBtn = document.getElementById(prefix + 'picDelBtn');
  var previewImg = document.getElementById(prefix + 'picPreview');
  if (!statusEl || !file) return false;
  if (!window.SupabaseSubmit || typeof SupabaseSubmit.uploadPicture !== 'function') {
    statusEl.className = 'pic-upload-status err';
    statusEl.textContent = '上传模块未加载，请刷新页面后重试';
    return false;
  }
  if (file.size > 5 * 1024 * 1024) {
    statusEl.className = 'pic-upload-status err';
    statusEl.textContent = '图片超过 5MB 限制（当前 ' + App.utils.formatSize && typeof App.utils.formatSize === 'function' ? App.utils.formatSize(file.size) : (file.size + ' B') + '）';
    return false;
  }
  statusEl.className = 'pic-upload-status loading';
  statusEl.textContent = '正在上传中... ' + (file.name || '');
  try {
    var localUrl = URL.createObjectURL(file);
    if (previewImg) { previewImg.src = localUrl; previewImg.style.display = 'block'; }
  } catch(_e) {}
  try {
    var result = await SupabaseSubmit.uploadPicture(file, 'sample');
    if (!result || !result.path) {
      statusEl.className = 'pic-upload-status err';
      statusEl.textContent = '上传失败，请重试';
      return false;
    }
    if (pathEl) pathEl.value = result.path;
    if (nameEl) nameEl.value = result.fileName || file.name;
    if (fnameEl) { fnameEl.textContent = result.fileName || file.name; fnameEl.style.display = ''; }
    if (delBtn) delBtn.disabled = false;
    statusEl.className = 'pic-upload-status ok';
    statusEl.textContent = '✓ 上传成功：' + (result.fileName || file.name);
    try {
      if (typeof getSignedUrlForPath === 'function') {
        var s = await getSignedUrlForPath(result.path);
        if (s && previewImg) previewImg.src = s;
      }
    } catch(_x) {}
    return true;
  } catch (err) {
    console.error('[sample] upload exception:', err);
    statusEl.className = 'pic-upload-status err';
    statusEl.textContent = '上传异常：' + (err && err.message ? err.message : String(err));
    return false;
  }
}

// ===== 从云盘 NAS 选择图片注入 sample 表单 =====
async function nasPickForSample(prefix) {
  var nasBtn = null;
  try {
    // 定位「从NAS选择」按钮，在点击时提供状态
    var box = document.querySelector('#' + prefix + 'picFile') ? document.querySelector('#' + prefix + 'picFile').closest('.pic-upload-box') : null;
    if (box) nasBtn = box.querySelector('.pic-upload-nas-btn');
    if (nasBtn) { nasBtn.disabled = true; nasBtn.style.opacity = .6; }
    var picks = await App.pickFromNas({ multi:false, filter:'images', view:'large' });
    if (!picks || picks.length === 0) return; // 用户取消
    var pick = picks[0];
    if (nasBtn) nasBtn.textContent = '⬇ 正在下载「' + pick.name + '」...';
    var got = await App.utils.nasFetchAsFile(pick.logicPath);
    var ok = await _uploadSamplePicture(prefix, got.file);
    if (ok) {
      try {
        if (App && App.toast) App.toast('✅ 已从 NAS 注入：' + pick.name, 'success');
      } catch(_) {}
    }
  } catch(err) {
    console.warn('[sample] nasPickForSample fail:', err);
    var msg = err && err.message ? err.message : String(err);
    try {
      if (App && App.toast) App.toast('❌ 选择失败：' + msg, 'error');
      else alert('从 NAS 选择失败：' + msg);
    } catch(_) { alert('选择失败：' + msg); }
  } finally {
    if (nasBtn) {
      nasBtn.disabled = false;
      nasBtn.style.opacity = '';

// 辅助：取路径的签名 URL（容错）
async function getSignedUrlForPath(storagePath) {
  if (!storagePath) return null;
  // 1) JS client
  if (window.supabase) {
    try {
      var sb = window.supabase;
      var BUCKET = window.STORAGE_BUCKET || 'app-photos';
      var res = await sb.storage.from(BUCKET).createSignedUrl(storagePath, 3600);
      if (res && !res.error && res.data) return res.data.signedUrl || null;
    } catch(_e) {}
  }
  // 2) REST API 兜底
  if (window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
    try {
      var BUCKET2 = window.STORAGE_BUCKET || 'app-photos';
      var url = window.SUPABASE_URL + '/storage/v1/object/sign/' + encodeURIComponent(BUCKET2) + '/' + encodeURIComponent(storagePath);
      var resp = await fetch(url, {
        method: 'POST',
        headers: {
          'apikey': window.SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
          'Content-Type': 'application/json'
        },
        body: '{}'
      });
      if (resp.ok) {
        var data = await resp.json();
        if (data && data.signedUrl) return data.signedUrl;
      }
    } catch(_e2) {}
  }
  return null;
}
// 辅助：表单打开后回填预览图显示（用 signed URL 或本地 blob）
async function hydratePicPreview(prefix) {
  var pathEl = document.getElementById(prefix + 'picture_path');
  var previewImg = document.getElementById(prefix + 'picPreview');
  if (!pathEl || !previewImg) return;
  var p = pathEl.value; if (!p) return;
  try {
    var signed = await getSignedUrlForPath(p);
    if (signed) { previewImg.src = signed; previewImg.style.display = 'block'; return; }
  } catch(_e) {}
  previewImg.style.display = 'none';
}

// ===== 关键修复：SupabaseStore 初始化完成后，强制重新加载样衣计划数据 =====
// 原因：_init 等 SupabaseReady 后执行，但 SamplePlan 的初始 loadData() 可能在数据加载前已执行
// 此外确保「样衣计划」Tab 也能在切换到之前就加载到最新数据
(function waitAndInitSamplePlan() {
  var tries = 0;
  var maxTries = 30; // 最多等待 30 次
  function check() {
    var store = window.SupabaseStore;
    var storeReady = store && store._isInitialized && store._isInitialized();
    var hasData = false;
    try {
      if (store && store.getSync) {
        var d = store.getSync('sht_sample_data_v2', []);
        hasData = Array.isArray(d) && d.length > 0;
      }
    } catch(e) {}

    if (storeReady || hasData || tries >= maxTries) {
      // 关键修复：无论是否已在「样衣计划」Tab，store 就绪后都必须调用 init() 加载数据；
      // 旧逻辑仅在 _samplePlanInited=true 时才调用 init，导致首次运行时 init 永不执行
      // （_samplePlanInited 被直接置 true 但 init 未调用，后续 switchTab 也因 flag 已 true 而跳过）
      if (typeof SamplePlan !== 'undefined' && SamplePlan.init) {
        console.log('[sample.html] 初始化触发 SamplePlan.init() 时机:',
          'storeReady=' + storeReady, 'hasData=' + hasData, 'tries=' + tries);
        SamplePlan.init();
        window._samplePlanInited = true;
      }
      // 同时刷新通用的样衣表格（从 App.store 读取）
      renderStats();
      renderTabs();
      renderFilterBar();
      renderSampleTable();
      return;
    }
    tries++;
    setTimeout(check, 1000);
  }
  setTimeout(check, 500);
})();

window.addEventListener('cloud-data-updated', function(e) {
  var keys = e.detail.keys || [];
  var hasShtSample = keys.indexOf('sht_sample_data_v2') >= 0;
  var hasShtSize = keys.indexOf('sht_size_tables_v2') >= 0;
  var hasSamples = keys.indexOf('samples') >= 0;
  var hasSizes = keys.indexOf('sizeSheets') >= 0;

  var onlySamples = (hasSamples && !hasShtSample && !hasShtSize && !hasSizes && keys.length === 1);
  var needRefresh = hasShtSample || hasShtSize || hasSamples || hasSizes;

  if (needRefresh) {
    console.log('[sample.html] 云端数据变更，刷新页面数据 keys=', keys.join(','),
      onlySamples ? '(仅samples→仅刷新表格，不重跑 SamplePlan)' : '');
    renderStats();
    renderTabs();
    renderFilterBar();
    renderSampleTable();

    if (!onlySamples && typeof SamplePlan !== 'undefined') {
      window._samplePlanInited = false;
      try {
        var store = window.SupabaseStore;
        var origLS = window._origLocalStorage || localStorage;
        if (store && store.getSync && origLS) {
          var d1 = store.getSync('sht_sample_data_v2', null);
          var d2 = store.getSync('sht_size_tables_v2', null);
          if (d1 !== null) origLS.setItem('sht_sample_data_v2', JSON.stringify(d1));
          if (d2 !== null) origLS.setItem('sht_size_tables_v2', JSON.stringify(d2));
        }
      } catch(e) {}
      if (SamplePlan.init && currentTab === '样衣计划') {
        SamplePlan.init();
        window._samplePlanInited = true;
      }
    }
  }
});
});

<script>
/* ============================================================
 *  样衣计划 (SamplePlan) 模块
 *  集成自 sample arrangement/index.html（去掉登录窗口）
 *  所有函数/变量/ID 都加了 SamplePlan 命名空间和 sp_ 前缀
 * ============================================================ */
(function(SP) {
  'use strict';

  // ===== Storage Keys =====
  const STORAGE_KEY = 'sht_sample_data_v2';
  const SIZE_TABLE_KEY = 'sht_size_tables_v2';
  const PICTURE_BASE = 'picture/';

    selectedId: null, editingId: null, sizeTables: [],

  };

  SP.columns = [
    { key: 'index', label: '#', sortable: false, width: '36px' },
    { key: '状态', label: '状态', sortable: true, width: '60px' },
    { key: '面辅料准备情况', label: '面辅料', sortable: true, width: '80px' },

    { key: '款号', label: '款号', sortable: true },
    { key: '样衣类型', label: '样衣类型', sortable: true },
    { key: '打样轮次', label: '轮次', sortable: true, width: '46px' },
    { key: '尺码', label: '尺码', sortable: true, width: '50px' },
    { key: '数量', label: '数量', sortable: true, width: '46px' },
    { key: '要求交期', label: '要求交期', sortable: true },
    { key: '上手时间', label: '上手时间', sortable: true },
    { key: '落手时间', label: '落手时间', sortable: true },
    { key: '备注', label: '备注', sortable: false },
    { key: 'actions', label: '操作', sortable: false, width: '62px' }
  ];
  const columns = SP.columns;

  SP.typeBadges = { '头样':'badge-blue', '尺码样':'badge-purple', '产前样':'badge-teal', '照片样':'badge-orange', '船样':'badge-green' };
  SP.statusBadges = { '未上手':'badge-gray', '未出样':'badge-orange', '已出样':'badge-green' };
  SP.matBadges = { '已到位':'badge-green', '部分到位':'badge-orange', '未到位':'badge-red' };
  const typeBadges = SP.typeBadges, statusBadges = SP.statusBadges, matBadges = SP.matBadges;

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  SP.esc = esc;
  function fmtDate(d) { return d || '<span style="color:var(--sp-muted)">—</span>'; }
  function fmtExcelDate(val) {
    if (!val && val !== 0) return '';
    if (val instanceof Date) return val.toISOString().split('T')[0];
    if (typeof val === 'number') { const d = new Date((val - 25569) * 86400 * 1000); return d.toISOString().split('T')[0]; }
    const s = String(val).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.split('T')[0]; return s;
  }
  function getStatus(row) { if (row['落手时间']) return '已出样'; if (row['上手时间']) return '未出样'; return '未上手'; }
  function countUniqueStyleNos(records) { return new Set(records.map(r => r['款号']).filter(Boolean)).size; }

  // ===== Storage =====
  function loadData() {
    try { const saved = localStorage.getItem(STORAGE_KEY); state.data = saved ? JSON.parse(saved) : []; } catch(e) { state.data = []; }
    try { const sizeSaved = localStorage.getItem(SIZE_TABLE_KEY); state.sizeTables = sizeSaved ? JSON.parse(sizeSaved) : []; } catch(e) { state.sizeTables = []; }
  }

  // ===== 样衣计划 → 头样/尺码样/产前样/船样/照片样 Tab 实时同步 =====
  // 原则：
  //  1) 不改变头样等 Tab 的表格列与字段结构，严格按原 samples record 字段写入
  //  2) 仅处理带 samplePlanId 标记的记录，原系统手动创建的记录永远保留不碰
  //  3) 按"样衣类型"→ stageKey 映射后自然进入对应 Tab 的过滤
  function syncSamplePlanToTabs() {
    try {
      if (typeof App === 'undefined' || !App.store || typeof STAGE_DEFS === 'undefined') return;
      const typeToStageKey = {};

      const PLAN_PREFIX = 'SPL_';                 // 同步生成的 id 前缀，稳定更新

      const allSamples = App.store.get('samples', []);
      if (!Array.isArray(allSamples)) return;
      // 1) 先移除之前同步过来的所有记录（保留用户手动建的）
      const preserved = allSamples.filter(s => !s[MARKER]);
      // 2) 按样衣类型重建同步记录；single/multiRound 分别按原系统字段规则
      const mapped = [];
      const srcData = Array.isArray(state.data) ? state.data : [];
      srcData.forEach(r => {
        const stageName = r['样衣类型'] || '';
        const stageKey = typeToStageKey[stageName];
        if (stageKey === undefined || stageKey === null) return; // 类型未知则跳过
        const def = STAGE_DEFS[Number(stageKey)];
        if (!def) return;
        const base = {
          id: PLAN_PREFIX + (r.id || ('gen_' + Math.random().toString(36).slice(2, 9))),
          styleNo: r['款号'] || '',
          stageKey: Number(stageKey),
          [MARKER]: String(r.id || ''),   // 原始 SamplePlan.id 关联标记
          factory: r['样衣工'] || '',
          size: r['尺码'] || '',
          qty: parseInt(r['数量']) || 0,
          arrangeDate: r['要求交期'] || '',   // 表头不直接显示；要求交期作为打样安排日
          sampleDate: r['落手时间'] || '',    // 寄样日期 = 落手完成时
          receivedSampleDate: '',             // 客户收妥日期留空（计划阶段未知）
          status: '未确认',                    // 计划默认未确认，后续原系统手动确认
          confirmedBy: '',
          confirmedDate: '',
          techNotes: r['备注'] || '',
          picture_path: r['picture_path'] || r['图片路径'] || '',
          picture_name: r['picture_name'] || r['图片文件名'] || '',
          // 其它原系统字段保持 undefined，不破坏结构：fabric/lining/fabricType/colorType/accessoryType/unitPrice
        };
        if (def.multiRound) {
          // 尺码样 / 产前样（stageKey=1, 2）→ rounds 数组；single-level 字段清空
          base.rounds = [{
            round: parseInt(r['打样轮次']) || 1,
            arrangeDate: r['要求交期'] || '',
            sampleDate: r['落手时间'] || '',
            receivedSampleDate: '',
            factory: r['样衣工'] || '',
            size: r['尺码'] || '',
            qty: parseInt(r['数量']) || 0,
            unitPrice: 0, fabric: '', lining: '',
            fabricType: '大货', colorType: '大货', accessoryType: '大货',
            status: '未确认', confirmedBy: '', confirmedDate: '',
            techNotes: r['备注'] || '',
          }];
          base.round = base.arrangeDate = base.sampleDate = base.receivedSampleDate =
            base.factory = base.size = base.qty = base.unitPrice = base.fabric =
            base.lining = base.fabricType = base.colorType = base.accessoryType =
            base.status = base.confirmedBy = base.confirmedDate = base.techNotes = undefined;
        } else {
          base.rounds = null;
        }
        mapped.push(base);
      });

      // 关键修复：如果没有有效的映射数据，但原系统有 samplePlanId 记录，
      // 说明 SamplePlan 数据可能尚未从云端加载完成，或样衣类型字段无法匹配，
      // 此时保留原记录不做删除，避免"卡片显示有记录但表格为空"的不一致问题
      const hasMarkeredRecords = allSamples.some(s => s[MARKER]);
      if (mapped.length === 0 && hasMarkeredRecords) {
        console.log('[syncSamplePlanToTabs] 无有效映射数据，保留原有记录不做同步 (srcData.length=' + srcData.length + ')');
        return;
      }

      const combined = preserved.concat(mapped);
      App.store.set('samples', combined);

      // 3) 若当前显示的是原系统表格区域（非样衣计划 Tab），立即刷新视图
      if (typeof currentTab !== 'undefined' && currentTab !== '样衣计划') {
        if (typeof renderStats === 'function') renderStats();
        if (typeof renderSampleTable === 'function') renderSampleTable();
      }
    } catch (err) {
      // 同步静默失败，不打断 SamplePlan 的正常保存
      if (typeof console !== 'undefined' && console.error) console.error('[syncSamplePlanToTabs]', err);
    }
  }

  // 数据同步队列：批量写入 Supabase，避免频繁请求
  let _spSyncTimer = null;
  let _spSyncPending = false;
  async function flushToSupabase() {
    // 关键修复：写入前立即刷新 _recentWrites 保护窗口（10秒）
    // 防止 init-page.js 在异步写入完成前把云端旧数据回灌到本地
    try {
      const sb = window.SupabaseStore;
      if (sb && sb._recentWrites) {
        const now = Date.now();
        if (state.data) sb._recentWrites[STORAGE_KEY] = now;
        if (state.sizeTables) sb._recentWrites[SIZE_TABLE_KEY] = now;
        // samples 表也同步保护（syncSamplePlanToTabs 可能刚写入）
        sb._recentWrites['samples'] = now;
      }
    } catch(e) {}
    if (state.data) {
      try {
        if (window.SupabaseStore && typeof window.SupabaseStore.set === 'function') {
          await window.SupabaseStore.set(STORAGE_KEY, state.data);
        }
      } catch(e) { console.warn('[SamplePlan] Supabase 同步失败:', e); }
    }
    if (state.sizeTables) {
      try {
        if (window.SupabaseStore && typeof window.SupabaseStore.set === 'function') {
          await window.SupabaseStore.set(SIZE_TABLE_KEY, state.sizeTables);
        }
      } catch(e) { console.warn('[SamplePlan] 尺寸表 Supabase 同步失败:', e); }
    }
    _spSyncPending = false;
  }
  function scheduleSync() {
    _spSyncPending = true;
    if (_spSyncTimer) return;
    _spSyncTimer = setTimeout(() => {
      _spSyncTimer = null;
      flushToSupabase();
    }, 300); // 300ms 防抖合并多次保存
  }

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e) { showToast('保存失败：存储空间不足', 'error'); }
    // 关键修复：通过 App.store.set 同步到云端（走 bridge → setSync → 异步写云端）
    // 这样 _recentWrites 会被设置，init-page.js 轮询会在保护期内跳过此 key
    if (window.App && App.store) {
      try { App.store.set(STORAGE_KEY, state.data); } catch(e) {}
    }
    scheduleSync();
    syncSamplePlanToTabs();
  }
  function saveSizeTables() {
    try { localStorage.setItem(SIZE_TABLE_KEY, JSON.stringify(state.sizeTables)); } catch(e) { showToast('保存失败：存储空间不足', 'error'); }
    if (window.App && App.store) {
      try { App.store.set(SIZE_TABLE_KEY, state.sizeTables); } catch(e) {}
    }
  }

  function renderStats() {

  // ===== Table =====
  function renderTableHead() {
    document.getElementById('sp_tableHead').innerHTML = '<tr>' + columns.map(col => {
      const sorted = state.sortField === col.key ? 'sorted' : '';
      const sortClass = col.sortable ? '' : 'no-sort';
      const sortIcon = col.sortable ? `<span class="sort-icon">${state.sortDirection === 'asc' ? '▲' : '▼'}</span>` : '';
      const width = col.width ? `style="min-width:${col.width}"` : '';
      return `<th class="${sorted} ${sortClass}" ${width} onclick="${col.sortable ? `SamplePlan.handleSort('${col.key}')` : ''}">${col.label}${sortIcon}</th>`;
    }).join('') + '</tr>';
  }
  function renderTable() {
    const tbody = document.getElementById('sp_tableBody');
    const data = state.filteredData;
    if (state.sortField) {
      data.sort((a, b) => {
        let va, vb;
        if (state.sortField === '状态') { va = getStatus(a); vb = getStatus(b); }
        else { va = a[state.sortField] || ''; vb = b[state.sortField] || ''; }
        if (typeof va === 'number' && typeof vb === 'number') return state.sortDirection === 'asc' ? va - vb : vb - va;
        va = String(va); vb = String(vb);
        return state.sortDirection === 'asc' ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
      });
    }
    const totalPages = Math.max(1, Math.ceil(data.length / state.pageSize));
    if (state.currentPage > totalPages) state.currentPage = totalPages;
    const start = (state.currentPage - 1) * state.pageSize;
    const pageData = data.slice(start, start + state.pageSize);
    if (pageData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${columns.length}"><div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>暂无数据</p></div></td></tr>`;
      renderPagination(); return;
    }
    const today = new Date().toISOString().split('T')[0];
    tbody.innerHTML = pageData.map((row, i) => {
      const isSelected = state.selectedId === row.id;
      const idx = start + i + 1;
      const status = getStatus(row);
      const sBadge = statusBadges[status] || 'badge-gray';
      const tBadge = typeBadges[row['样衣类型']] || 'badge-gray';
      const mBadge = matBadges[row['面辅料准备情况']] || 'badge-gray';
      let dotClass = 'dot-green';
      if (!row['落手时间'] && row['要求交期']) {
        const diff = (new Date(row['要求交期']) - new Date(today)) / (1000*60*60*24);
        if (diff < 0) dotClass = 'dot-red';
        else if (diff <= 3) dotClass = 'dot-orange';
      }
      return `<tr class="${isSelected ? 'selected' : ''}" onclick="SamplePlan.selectRow('${row.id}')">
        <td style="text-align:center;color:var(--sp-muted)">${idx}</td>
        <td title="${esc(status)}"><span class="badge ${sBadge}">${status}</span></td>
        <td title="${esc(row['面辅料准备情况'] || '')}"><span class="badge ${mBadge}">${esc(row['面辅料准备情况'] || '')}</span></td>
        <td title="${esc(row['样衣工'] || '')}">${esc(row['样衣工'] || '')}</td>
        <td title="${esc(row['款号'] || '')}"><strong>${esc(row['款号'] || '')}</strong></td>
        <td title="${esc(row['样衣类型'] || '')}"><span class="badge ${tBadge}">${esc(row['样衣类型'] || '')}</span></td>
        <td style="text-align:center" title="第${esc(row['打样轮次'] || 1)}轮">${row['打样轮次'] || 1}</td>
        <td title="${esc(row['尺码'] || '')}">${esc(row['尺码'] || '')}</td>
        <td style="text-align:center" title="${row['数量'] || 0}件">${row['数量'] || 0}</td>
        <td title="${esc(row['要求交期'] || '')}"><span class="urgent-dot ${dotClass}"></span>${fmtDate(row['要求交期'])}</td>
        <td title="${esc(row['上手时间'] || '')}">${fmtDate(row['上手时间'])}</td>
        <td title="${esc(row['落手时间'] || '')}">${fmtDate(row['落手时间'])}</td>
        <td title="${esc(row['备注'] || '')}">${esc(row['备注'] || '')}</td>
        <td class="td-actions"><div class="row-actions" onclick="event.stopPropagation()">
          <button class="row-action-btn edit" onclick="SamplePlan.openForm('${row.id}')" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="row-action-btn delete" onclick="SamplePlan.deleteRecord('${row.id}')" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div></td>
      </tr>`;
    }).join('');
    renderPagination();
  }
  function renderPagination() {
    const total = state.filteredData.length;
    const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    const start = total === 0 ? 0 : (state.currentPage - 1) * state.pageSize + 1;
    const end = Math.min(state.currentPage * state.pageSize, total);
    const maxShow = 5;
    let s = Math.max(1, state.currentPage - 2);
    let e = Math.min(totalPages, s + maxShow - 1);
    if (e - s < maxShow - 1) s = Math.max(1, e - maxShow + 1);
    let pages = '';
    for (let i = s; i <= e; i++) pages += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" onclick="SamplePlan.changePage(${i})">${i}</button>`;
    document.getElementById('sp_pagination').innerHTML = `
      <div class="page-info">共 <b>${total}</b> 条记录，显示第 <b>${start}</b>-<b>${end}</b> 条</div>
      <div class="page-controls">
        <select class="page-size-select" onchange="SamplePlan.changePageSize(this.value)">
          <option value="10" ${state.pageSize===10?'selected':''}>10条/页</option>
          <option value="20" ${state.pageSize===20?'selected':''}>20条/页</option>
          <option value="50" ${state.pageSize===50?'selected':''}>50条/页</option>
          <option value="100" ${state.pageSize===100?'selected':''}>100条/页</option>
        </select>
        <button class="page-btn" onclick="SamplePlan.changePage(1)" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button>
        <button class="page-btn" onclick="SamplePlan.changePage(${state.currentPage-1})" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        ${pages}
        <button class="page-btn" onclick="SamplePlan.changePage(${state.currentPage+1})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        <button class="page-btn" onclick="SamplePlan.changePage(${totalPages})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg></button>
      </div>`;
  }
  SP.changePage = function(p) { state.currentPage = p; renderTable(); };
  SP.changePageSize = function(s) { state.pageSize = parseInt(s); state.currentPage = 1; renderTable(); };

  // ===== Search / Filter =====
  SP.applyFilters = function() {
    const q = document.getElementById('sp_searchInput').value.trim().toLowerCase();
    const fStatus = document.getElementById('sp_filterStatus').value;
    const fType = document.getElementById('sp_filterType').value;
    const fMat = document.getElementById('sp_filterMaterial').value;
    const fFrom = document.getElementById('sp_filterDateFrom').value;
    const fTo = document.getElementById('sp_filterDateTo').value;
    state.filteredData = state.data.filter(row => {
      if (q && !Object.values(row).some(v => String(v || '').toLowerCase().includes(q))) return false;
      if (fStatus && getStatus(row) !== fStatus) return false;
      if (fType && row['样衣类型'] !== fType) return false;
      if (fMat && row['面辅料准备情况'] !== fMat) return false;
      if (fFrom && row['要求交期'] && row['要求交期'] < fFrom) return false;
      if (fTo && row['要求交期'] && row['要求交期'] > fTo) return false;
      return true;
    });
    const seen = new Set();
    state.filteredData = state.filteredData.filter(row => {
      const key = `${row['款号']||''}|${row['打样轮次']||1}|${row['尺码']||''}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    state.currentPage = 1;
    renderStats(); renderTable();
  };
  SP.clearFilters = function() {
    document.getElementById('sp_searchInput').value = '';
    document.getElementById('sp_filterStatus').value = '';
    document.getElementById('sp_filterType').value = '';
    document.getElementById('sp_filterMaterial').value = '';
    document.getElementById('sp_filterDateFrom').value = '';
    document.getElementById('sp_filterDateTo').value = '';
    SP.applyFilters();
  };
  SP.handleSort = function(field) {
    if (state.sortField === field) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
    else { state.sortField = field; state.sortDirection = 'asc'; }
    renderTableHead(); renderTable();
  };

  // ===== Row Selection / Image Preview =====
  let panelJustOpened = false;
  SP.selectRow = function(id) {
    state.selectedId = id;
    renderTable();
    const row = state.data.find(r => r.id === id);
    if (row) showImagePreview(row);
  };
  function showImagePreview(row) {
    panelJustOpened = true;
    document.getElementById('sp_imagePanel').classList.add('active');
    const wrapper = document.getElementById('sp_imageWrapper');
    const styleNo = row['款号'] || '';
    const picPath = row['picture_path'] || row['图片路径'] || '';
    const picName = row['picture_name'] || row['图片文件名'] || '';
    // 取原始文件扩展名（如果有记录）
    var origExt = null;
    if (picName && picName.indexOf('.') >= 0) {
      origExt = picName.split('.').pop().toLowerCase();
    }
    const formats = ['jpg','jpeg','png','webp','gif'];
    // 渲染占位 loading
    wrapper.innerHTML = `<div class="image-placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>正在加载图片...</p>
      <p class="hint">款号：${esc(styleNo)}</p>
    </div>`;

    // 尝试把找到的图片显示到 wrapper
    function showSrc(src, isRemote) {
      wrapper.innerHTML = '';
      var img = new Image();
      img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;';
      img.onload = function() { wrapper.appendChild(img); };
      img.onerror = function() { fallbackLocal(); };
      img.src = src;
    }
    // 显示「未找到」占位
    function showNotFound() {
      wrapper.innerHTML = `<div class="image-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>未找到图片</p>
        <p class="hint">请将图片放入 picture 文件夹<br>命名为「${esc(styleNo)}.jpg」<br>或在「添加/编辑样衣」表单中上传图片</p>
      </div>`;
    }
    // 本地 picture/ 文件夹兜底遍历
    var fi = 0;
    function fallbackLocal() {
      if (fi >= formats.length) { showNotFound(); return; }
      var img = new Image();
      img.onload = function() { wrapper.innerHTML = ''; img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;'; wrapper.appendChild(img); };
      img.onerror = function() { fi++; fallbackLocal(); };
      img.src = PICTURE_BASE + styleNo + '.' + formats[fi];
    }
    // 回补匹配到的 picture_path / picture_name 到 SamplePlan 当前记录
    function patchRecordPath(path, name) {
      try {
        if (!row.id) return;
        var changed = false;
        if (path && !row['picture_path']) { row['picture_path'] = path; changed = true; }
        if (name && !row['picture_name']) { row['picture_name'] = name; changed = true; }
        if (changed) saveData();
      } catch(_e) {}
    }
    // ============ 4 级回退策略 ============
    // Level 1: 记录已保存 picture_path → 直接签名 URL 显示
    if (picPath && (typeof getSignedUrlForPath === 'function')) {
      (async function tryLevel1(){
        try {
          var signed = await getSignedUrlForPath(picPath);
          if (signed) { showSrc(signed, true); return; }
        } catch(_e){}
        tryLevel2();
      })();
      return;
    }
    // Level 2: 按款号 + 原始扩展名 在 Supabase Storage 查找（支持 UUID 前缀文件名 xxx-1122.jpg）
    function tryLevel2() {
      if (!styleNo || !window.SupabaseSubmit || typeof SupabaseSubmit.findPictureByStyleNo !== 'function') {
        tryLevel3(); return;
      }
      (async function doFind(){
        try {
          var found = await SupabaseSubmit.findPictureByStyleNo(styleNo, 'sample', origExt);
          if (found && (found.signedUrl || found.path)) {
            var signed2 = found.signedUrl;
            if (!signed2 && found.path && (typeof getSignedUrlForPath === 'function')) {
              signed2 = await getSignedUrlForPath(found.path);
            }
            // 回补 picture_path / 原始文件名（从 path 末段取文件名）
            var _name = picName || (found.path ? found.path.split('/').pop() : '');
            if (found.path) patchRecordPath(found.path, _name);
            if (signed2) { showSrc(signed2, true); return; }
          }
        } catch(err) { console.warn('[showImagePreview] level2 error:', err); }
        tryLevel3();
      })();
    }
    // Level 3: 跨 userId 扫描时使用 findPictureByStyleNo 的策略 2/3 已经在 level2 内部执行过了，这里再兜底：非 'sample' 子目录尝试 'uploads' / 根目录
    function tryLevel3() {
      if (!styleNo || !window.SupabaseSubmit || typeof SupabaseSubmit.findPictureByStyleNo !== 'function') {
        fallbackLocal(); return;
      }
      (async function doFind3(){
        try {
          // 如果 level2 用 sample 没找到，试试老目录名 uploads 以及通用根（subFolder="" 会被转成默认值，但 findPictureByStyleNo 的策略3 也会直接查 subFolder/）
          var found = await SupabaseSubmit.findPictureByStyleNo(styleNo, 'uploads', origExt);
          if (found && (found.signedUrl || found.path)) {
            var signed3 = found.signedUrl;
            if (!signed3 && found.path && (typeof getSignedUrlForPath === 'function')) {
              signed3 = await getSignedUrlForPath(found.path);
            }
            var _name = picName || (found.path ? found.path.split('/').pop() : '');
            if (found.path) patchRecordPath(found.path, _name);
            if (signed3) { showSrc(signed3, true); return; }
          }
        } catch(err){ console.warn('[showImagePreview] level3 error:', err); }
        fallbackLocal(); // Level 4: 本地 picture/ 文件夹兜底
      })();
    }
    // 入口：如果没走 level1，直接从 level2 开始
    if (picPath && !(typeof getSignedUrlForPath === 'function')) {

    const mBadge = matBadges[row['面辅料准备情况']] || 'badge-gray';

  SP.deleteRecord = function(id) {
    const row = state.data.find(r => r.id === id);
    if (!row) return;
    if (!confirm(`确认删除款号「${row['款号']}」的${row['样衣类型']}记录？`)) return;
    state.data = state.data.filter(r => r.id !== id);
    saveData();
    // 删除操作：立即写入云端，取消 scheduleSync 300ms 延迟，避免轮询期间覆盖
    if (_spSyncTimer) { clearTimeout(_spSyncTimer); _spSyncTimer = null; }
    flushToSupabase();
    if (state.selectedId === id) SP.closeImagePanel();
    SP.applyFilters();
    showToast('删除成功', 'success');
  };

  // 供 deleteSample 调用：当原Tab删除来自样衣计划的同步记录时，同步删除源记录（防止复活）
  SP._deleteSourceRecord = function(sourceId) {
    if (!sourceId) return false;
    const before = state.data.length;
    state.data = state.data.filter(r => String(r.id || '') !== String(sourceId));
    if (state.data.length === before) return false; // 没变化
    saveData();
    // 立即写入云端，跳过 scheduleSync 的防抖延迟
    if (_spSyncTimer) { clearTimeout(_spSyncTimer); _spSyncTimer = null; }
    flushToSupabase();
    SP.applyFilters();
    return true;
  };

        '面辅料准备情况': r['面辅料准备情况']||'', '备注': r['备注']||''
      }));
      const ws = XLSX.utils.json_to_sheet(exportData);

      XLSX.writeFile(wb, `AA_样衣数据导出_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast(`已导出 ${data.length} 条记录`, 'success', 5000);
      return;

      { header: '序号', key: '序号', width: 6 },

      { header: '备注', key: '备注', width: 30 }
    ];
    ws.getRow(1).font = { bold: true };
    ws.getRow(1).alignment = { horizontal: 'center' };
    for (let i = 0; i < data.length; i++) {
      const r = data[i];

        '序号': i + 1, '样衣工': r['样衣工'] || '', '款号': r['款号'] || '', '款式图': '',
        '样衣类型': r['样衣类型'] || '', '打样轮次': r['打样轮次'] || 1, '尺码': r['尺码'] || '', '数量': r['数量'] || 0,

        '面辅料准备情况': r['面辅料准备情况'] || '', '备注': r['备注'] || ''
      });
      ws.getRow(row.number).height = 32;
    }
    const buffer = await wb.xlsx.writeBuffer();

        if (jsonData.length === 0) { showToast('Excel文件为空', 'error'); return; }
        let styleNo = '', templateDate = '', templateType = '';

        if (jsonData[2] && jsonData[2][0] === '类型' && jsonData[2][1]) templateType = String(jsonData[2][1]).trim();

        const existingIdx = state.sizeTables.findIndex(st => String(st['款号']) === String(styleNo));

  function bindSpKeyboard() {
    if (_spKDListener) return;
    _spKDListener = function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('sp_modalOverlay').classList.contains('active')) SP.closeForm();
        else if (document.getElementById('sp_imagePanel').classList.contains('active')) SP.closeImagePanel();
      }
    };
    document.addEventListener('keydown', _spKDListener);
    // 【已取消：点击遮罩空白自动关闭表单】
    // 避免误操作导致填了一半的数据丢失，现只允许用 取消按钮 / 保存 / ESC 键 关闭表单
    // 旧代码：document.getElementById('sp_modalOverlay').addEventListener('click', function(e) { if (e.target === this) SP.closeForm(); });
    document.addEventListener('click', function(e) {
      if (panelJustOpened) { panelJustOpened = false; return; }

    updateWorkerList();
    renderStats();

    renderTable();
    renderSizeTables();
    bindSpKeyboard();
    syncSamplePlanToTabs();   // 首次进入也同步一次（把历史的样衣计划推送到原系统 Tab）

    // 页面关闭前确保数据写入 Supabase
    window.addEventListener('beforeunload', function() {
      if (_spSyncPending) {

        } catch(e) {}
      }

  };

  // 手动立即同步（可在设置或调试时使用）
  SP.syncNow = async function() {

  };
})(window.SamplePlan = window.SamplePlan || {});

function esc(s) {
  if (window.App && window.App.utils && window.App.utils.escapeHtml) {
    return window.App.utils.escapeHtml(s);
  }
  return (s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escBR(s) { return esc(s).replace(/\n/g,'<br>'); }

function formatDate(d) {
  try {
    var dt = new Date(d);
    return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  } catch(e) { return d; }
}

function imgSrc(img) { return typeof img === 'string' ? img : img.src; }
function imgPrintSize(img) { return typeof img === 'object' && img.printSize ? img.printSize : 'full'; }

      html += '<textarea data-sr-cmt="' + c.id + '" data-field="description">' + esc(c.description) + '</textarea>';
      html += '</div>';
    }
    html += '<div class="comment-field full">';
    html += '<label>' + (isSimple ? '说明' : '意见') + '</label>';
    html += '<textarea data-sr-cmt="' + c.id + '" data-field="suggestion">' + esc(c.suggestion) + '</textarea>';
    html += '</div>';
    html += '</div>';
    html += '<div class="comment-images" id="sr-imgs-' + c.id + '">';
    html += c.images.map(function(img, i) {
      var src = imgSrc(img);
      var psize = imgPrintSize(img);
      return '<div class="comment-img-wrap">' +
        '<img src="' + src + '" data-sr-img-cid="' + c.id + '" data-sr-img-idx="' + i + '">' +
        '<button class="img-del" data-sr-img-del-cid="' + c.id + '" data-sr-img-del-idx="' + i + '">×</button>' +
        '<button class="img-edit" data-sr-img-edit-cid="' + c.id + '" data-sr-img-edit-idx="' + i + '">标注</button>' +
        '<select class="img-print-size" data-sr-img-size-cid="' + c.id + '" data-sr-img-size-idx="' + i + '">' +
          '<option value="full"' + (psize==='full'?' selected':'') + '>铺满</option>' +
          '<option value="half"' + (psize==='half'?' selected':'') + '>半宽</option>' +
          '<option value="third"' + (psize==='third'?' selected':'') + '>三分之一</option>' +
          '<option value="quarter"' + (psize==='quarter'?' selected':'') + '>四分之一</option>' +
        '</select>' +
      '</div>';
    }).join('');
    html += '</div>';
    html += '<div class="comment-actions">';
    html += '<button class="btn btn-outline btn-sm" data-sr-add-img="' + c.id + '">📷 添加图片</button>';
    html += '<button class="btn btn-danger btn-sm" data-sr-del-cmt="' + c.id + '">🗑 删除</button>';
    html += '</div>';
    html += '</div>';
    return html;
  }).join('');
}

// ===== Image Annotation =====
function openAnnotModal(cid, imgIdx) {
  annotState.editingCommentId = cid;
  annotState.editingImageIdx = imgIdx;
  annotState.shapes = [];
  annotState.img = null;
  var wrap = $('sr-annotCanvasWrap');
  if (wrap) wrap.innerHTML = '<div class="annot-upload-prompt">请先上传图片，然后在图片上添加标注</div>';
  annotState.canvas = null;
  annotState.ctx = null;
  if (imgIdx >= 0) {
    var c = comments.find(function(c) { return c.id === cid; });
    if (c && c.images[imgIdx]) {
      var img = new Image();
      img.onload = function() {
        var maxW = wrap.clientWidth;
        var maxH = wrap.clientHeight;
        var ratio = Math.min(maxW / img.width, maxH / img.height, 1);
        var w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
        wrap.innerHTML = '';
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.style.maxWidth = '100%';
        wrap.appendChild(canvas);
        annotState.canvas = canvas;
        annotState.ctx = canvas.getContext('2d');
        annotState.shapes = [{type:'image', img: img, x: 0, y: 0, w: w, h: h}];
        drawCanvas();
        canvas.onmousedown = onAnnotMouseDown;
        canvas.onmousemove = onAnnotMouseMove;
        canvas.onmouseup = onAnnotMouseUp;
        canvas.onmouseleave = onAnnotMouseUp;
        canvas.onwheel = onAnnotWheel;
      };
      img.src = imgSrc(c.images[imgIdx]);
    }
  }
  var modal = $('sr-annotModal');
  if (modal) modal.classList.add('show');
}

function closeAnnotModal() {
  var modal = $('sr-annotModal');
  if (modal) modal.classList.remove('show');
}

function setAnnotTool(tool, el) {
  annotState.tool = tool;
  annotState.movingShapeIdx = -1;
  $$('.annot-tool[data-tool]').forEach(function(t) { t.classList.remove('active'); });
  if (el) el.classList.add('active');
  if (annotState.canvas) annotState.canvas.style.cursor = tool === 'move' ? 'move' : 'crosshair';
  drawCanvas();
}

function autoSwitchToMove() {
  var moveBtn = $$('.annot-tool[data-tool="move"]');
  if (moveBtn.length > 0) setAnnotTool('move', moveBtn[0]);
}

function loadAnnotImage(event) {
  var files = Array.from(event.target.files);
  if (!files.length) return;
  var wrap = $('sr-annotCanvasWrap');
  var maxW = wrap.clientWidth;
  var maxH = wrap.clientHeight;
  var gap = 10;
  var imgs = [];
  var loaded = 0;
  files.forEach(function(file, fi) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        imgs[fi] = img;
        loaded++;
        if (loaded === files.length) {
          var targetH = Math.min.apply(null, imgs.map(function(im) { return im.height; }));
          var scaled = imgs.map(function(im) {
            var ratio = targetH / im.height;
            return { img: im, w: Math.round(im.width * ratio), h: Math.round(targetH) };
          });
          var totalW = scaled.reduce(function(s, im) { return s + im.w; }, 0) + gap * (scaled.length - 1);
          if (totalW > maxW && scaled.length > 1) {
            var sf = maxW / totalW;
            scaled.forEach(function(im) { im.w = Math.round(im.w * sf); im.h = Math.round(im.h * sf); });
            totalW = scaled.reduce(function(s, im) { return s + im.w; }, 0) + gap * (scaled.length - 1);
          }
          var cw = Math.max(totalW, scaled[0].w);
          var ch = scaled[0].h;
          wrap.innerHTML = '';
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          canvas.style.maxWidth = '100%';
          wrap.appendChild(canvas);
          annotState.canvas = canvas;
          annotState.ctx = canvas.getContext('2d');
          annotState.img = null;
          annotState.shapes = [];
          var xPos = 0;
          scaled.forEach(function(im) {
            annotState.shapes.push({type:'image', img: im.img, x: xPos, y: 0, w: im.w, h: im.h});
            xPos += im.w + gap;
          });
          drawCanvas();
          canvas.onmousedown = onAnnotMouseDown;
          canvas.onmousemove = onAnnotMouseMove;
          canvas.onmouseup = onAnnotMouseUp;
          canvas.onmouseleave = onAnnotMouseUp;
          canvas.onwheel = onAnnotWheel;
          if (files.length > 1) {
            showToast('已加载 ' + files.length + ' 张图片，可使用移动工具拖动换位', 'success');
          }
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

function setupAnnotCanvas(img) {
  var wrap = $('sr-annotCanvasWrap');
  wrap.innerHTML = '';
  var maxW = wrap.clientWidth;
  var maxH = wrap.clientHeight;
  var w = img.width, h = img.height;
  var ratio = Math.min(maxW / w, maxH / h, 1);
  w = Math.round(w * ratio); h = Math.round(h * ratio);
  var canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  wrap.appendChild(canvas);
  annotState.canvas = canvas;
  annotState.ctx = canvas.getContext('2d');
  drawCanvas();
  canvas.onmousedown = onAnnotMouseDown;
  canvas.onmousemove = onAnnotMouseMove;
  canvas.onmouseup = onAnnotMouseUp;
  canvas.onmouseleave = onAnnotMouseUp;
  canvas.onwheel = onAnnotWheel;
}

function getCanvasPos(e) {
  var rect = annotState.canvas.getBoundingClientRect();
  var scaleX = annotState.canvas.width / rect.width;
  var scaleY = annotState.canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function hitTestShape(s, px, py) {
  var tol = 8;
  var rot = s.rotation || 0;
  if (rot !== 0) {
    var c = getShapeCenter(s);
    var rad = -rot * Math.PI / 180;
    var dx = px - c.x, dy = py - c.y;
    px = c.x + dx * Math.cos(rad) - dy * Math.sin(rad);
    py = c.y + dx * Math.sin(rad) + dy * Math.cos(rad);
  }
  if (['arrow','dashSingle','dashDouble','doubleSolid','solidLine','xLine','dimLine'].indexOf(s.type) >= 0) {
    return distToSeg(px, py, s.x1, s.y1, s.x2, s.y2) < tol + (s.lineWidth || 2);
  }
  if (s.type === 'curve' || s.type === 'curveDashed' || s.type === 'curveSolid') {
    var steps = 20;
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var mt = 1 - t;
      var bx = mt * mt * s.x1 + 2 * mt * t * s.cx + t * t * s.x2;
      var by = mt * mt * s.y1 + 2 * mt * t * s.cy + t * t * s.y2;
      if (Math.hypot(px - bx, py - by) < tol + (s.lineWidth || 2)) return true;
    }
    return false;
  }
  if (['rect','fillRect','dashRect','mosaic','image','textBox','text','strikeText','callout'].indexOf(s.type) >= 0) {
    var x = Math.min(s.x, s.x + (s.w||0)), y = Math.min(s.y, s.y + (s.h||0));
    var w = Math.abs(s.w||0), h = Math.abs(s.h||0);
    return px >= x - tol && px <= x + w + tol && py >= y - tol && py <= y + h + tol;
  }
  if (s.type === 'circle') {
    return Math.abs(Math.hypot(px - s.x, py - s.y) - s.r) < tol;
  }
  return false;
}

function distToSeg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  var t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function moveShape(s, dx, dy) {
  if (s.x1 !== undefined) { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
  if (s.cx !== undefined) { s.cx += dx; s.cy += dy; }
  else if (s.x !== undefined && s.x1 === undefined) { s.x += dx; s.y += dy; }
  if (s.tipX !== undefined) { s.tipX += dx; s.tipY += dy; }
}

function scaleShape(s, factor) {
  if (s.x1 !== undefined) {
    var cx = (s.x1 + s.x2) / 2, cy = (s.y1 + s.y2) / 2;
    s.x1 = cx + (s.x1 - cx) * factor;
    s.y1 = cy + (s.y1 - cy) * factor;
    s.x2 = cx + (s.x2 - cx) * factor;
    s.y2 = cy + (s.y2 - cy) * factor;
    if (s.cx !== undefined) {
      s.cx = cx + (s.cx - cx) * factor;
      s.cy = cy + (s.cy - cy) * factor;
    }
  } else if (s.w !== undefined) {
    var cx2 = s.x + s.w / 2, cy2 = s.y + s.h / 2;
    s.w *= factor; s.h *= factor;
    s.x = cx2 - s.w / 2; s.y = cy2 - s.h / 2;
    if (s.tipX !== undefined) {
      s.tipX = cx2 + (s.tipX - cx2) * factor;
      s.tipY = cy2 + (s.tipY - cy2) * factor;
    }
  } else if (s.r !== undefined) {
    s.r = Math.max(2, s.r * factor);
  }
  if (s.lineWidth !== undefined && s.type !== 'mosaic') {
    s.lineWidth = Math.max(1, Math.min(20, s.lineWidth * factor));
  }
  if (s.fontSize !== undefined) {
    s.fontSize = Math.max(8, Math.min(72, s.fontSize * factor));
  }
}

function onAnnotWheel(e) {
  if (annotState.tool !== 'move' || annotState.movingShapeIdx < 0) return;
  e.preventDefault();
  var factor = e.deltaY < 0 ? 1.1 : 0.9;
  scaleShape(annotState.shapes[annotState.movingShapeIdx], factor);
  drawCanvas();
}

function getShapeCenter(s) {
  if (s.x1 !== undefined) return { x: (s.x1 + s.x2) / 2, y: (s.y1 + s.y2) / 2 };
  if (s.w !== undefined) return { x: s.x + s.w / 2, y: s.y + s.h / 2 };
  if (s.r !== undefined) return { x: s.x, y: s.y };
  if (s.x !== undefined) return { x: s.x, y: s.y };
  return { x: 0, y: 0 };
}

function rotateShape(s, deltaDeg) {
  s.rotation = (s.rotation || 0) + deltaDeg;
}

function rotateSelected(deltaDeg) {
  if (annotState.tool !== 'move' || annotState.movingShapeIdx < 0) {
    showToast('请先用移动工具选中标注', 'info');
    return;
  }
  var s = annotState.shapes[annotState.movingShapeIdx];
  if (s.type === 'mosaic') {
    showToast('马赛克不支持旋转', 'info');
    return;
  }
  rotateShape(s, deltaDeg);
  drawCanvas();
  var deg = ((s.rotation % 360) + 360) % 360;
  showToast('已旋转至 ' + Math.round(deg) + '°', 'success');
}

function insertImage(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var cw = annotState.canvas.width, ch = annotState.canvas.height;
      var w = img.width, h = img.height;
      var maxDim = Math.min(cw, ch) * 0.4;
      var ratio = Math.min(maxDim / w, maxDim / h, 1);
      w = Math.round(w * ratio); h = Math.round(h * ratio);
      annotState.shapes.push({type:'image', img: img, x:(cw-w)/2, y:(ch-h)/2, w: w, h: h});
      drawCanvas();
      showToast('图片已插入，切换到移动工具后可拖动、滚轮缩放、方向键旋转', 'success');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function getShapeBounds(s) {
  if (s.type === 'curve' || s.type === 'curveDashed' || s.type === 'curveSolid') {
    var minX = Math.min(s.x1, s.x2, s.cx) - 4;
    var minY = Math.min(s.y1, s.y2, s.cy) - 4;
    var maxX = Math.max(s.x1, s.x2, s.cx) + 4;
    var maxY = Math.max(s.y1, s.y2, s.cy) + 4;
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }
  if (s.x1 !== undefined) {
    return { x: Math.min(s.x1, s.x2) - 4, y: Math.min(s.y1, s.y2) - 4, w: Math.abs(s.x2 - s.x1) + 8, h: Math.abs(s.y2 - s.y1) + 8 };
  }
  if (s.w !== undefined) {
    return { x: Math.min(s.x, s.x + s.w) - 4, y: Math.min(s.y, s.y + s.h) - 4, w: Math.abs(s.w) + 8, h: Math.abs(s.h) + 8 };
  }
  if (s.r !== undefined) {
    return { x: s.x - s.r - 4, y: s.y - s.r - 4, w: s.r * 2 + 8, h: s.r * 2 + 8 };
  }
  return null;
}

function onAnnotMouseDown(e) {
  if (!annotState.canvas) return;
  var pos = getCanvasPos(e);
  if (annotState.tool === 'move') {
    if (annotState.movingShapeIdx >= 0) {
      var sel = annotState.shapes[annotState.movingShapeIdx];
      if (sel && (sel.type === 'curve' || sel.type === 'curveDashed' || sel.type === 'curveSolid')) {
        var d = Math.hypot(pos.x - sel.cx, pos.y - sel.cy);
        if (d <= 10) {
          annotState.isAdjustingCurve = true;
          drawCanvas();
          return;
        }
      }
    }
    for (var i = annotState.shapes.length - 1; i >= 0; i--) {
      if (hitTestShape(annotState.shapes[i], pos.x, pos.y)) {
        var s = annotState.shapes[i];
        if ((s.type === 'textBox' || s.type === 'text' || s.type === 'strikeText' || s.type === 'callout') && annotState.lastClickInfo) {
          var info = annotState.lastClickInfo;
          var now = Date.now();
          if (info.idx === i && (now - info.time) < 400) {
            annotState.lastClickInfo = null;
            annotState.movingShapeIdx = i;
            annotState.isMoving = false;
            startTextEdit(s);
            return;
          }
        }
        annotState.lastClickInfo = { idx: i, time: Date.now() };
        annotState.movingShapeIdx = i;
        annotState.isMoving = true;
        annotState.moveLastX = pos.x;
        annotState.moveLastY = pos.y;
        drawCanvas();
        return;
      }
    }
    annotState.movingShapeIdx = -1;
    annotState.lastClickInfo = null;
    drawCanvas();
    return;
  }
  if (annotState.tool === 'callout') {
    annotState.isDrawing = true;
    annotState.startX = pos.x;
    annotState.startY = pos.y;
    return;
  }
  annotState.isDrawing = true;
  annotState.startX = pos.x;
  annotState.startY = pos.y;
}

function startTextEdit(s) {
  var wrap = $('sr-annotCanvasWrap');
  var canvas = annotState.canvas;
  var wrapRect = wrap.getBoundingClientRect();
  var canvasRect = canvas.getBoundingClientRect();
  var offsetX = canvasRect.left - wrapRect.left;
  var offsetY = canvasRect.top - wrapRect.top;
  var x = Math.min(s.x, s.x + s.w), y = Math.min(s.y, s.y + s.h);
  var w = Math.abs(s.w), h = Math.abs(s.h);
  var oldTa = document.getElementById('sr-annotEditText');
  if (oldTa) oldTa.remove();
  var ta = document.createElement('textarea');
  ta.id = 'sr-annotEditText';
  ta.style.position = 'absolute';
  ta.style.left = (offsetX + x) + 'px';
  ta.style.top = (offsetY + y) + 'px';
  ta.style.width = Math.max(w, 40) + 'px';
  ta.style.height = Math.max(h, 24) + 'px';
  ta.style.border = '2px solid #1a56db';
  ta.style.background = '#fff';
  ta.style.color = '#000';
  ta.style.fontSize = '13px';
  ta.style.textAlign = 'center';
  ta.style.resize = 'none';
  ta.style.padding = '4px';
  ta.style.zIndex = '100';
  ta.style.outline = 'none';
  ta.style.boxSizing = 'border-box';
  ta.style.cursor = 'text';
  ta.value = s.text || '';
  wrap.appendChild(ta);
  setTimeout(function() { ta.focus(); ta.select(); }, 50);
  var closed = false;
  var close = function(save) {
    if (closed) return;
    closed = true;
    if (save) s.text = ta.value;
    ta.remove();
    drawCanvas();
  };
  setTimeout(function() {
    if (!closed) ta.addEventListener('blur', function() { close(true); });
  }, 150);
  ta.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); close(true); }
  });
  ta.addEventListener('mousedown', function(ev) { ev.stopPropagation(); });
}

function onAnnotDoubleClick(e) {
  if (annotState.tool !== 'move') return;
  if (document.getElementById('sr-annotEditText')) return;
  var pos = getCanvasPos(e);
  for (var i = annotState.shapes.length - 1; i >= 0; i--) {
    var s = annotState.shapes[i];
    if ((s.type === 'textBox' || s.type === 'text' || s.type === 'strikeText' || s.type === 'callout') && hitTestShape(s, pos.x, pos.y)) {
      annotState.movingShapeIdx = i;
      annotState.isMoving = false;
      startTextEdit(s);
      return;
    }
  }
}

function onAnnotMouseMove(e) {
  if (!annotState.canvas) return;
  var pos = getCanvasPos(e);
  if (annotState.tool === 'move' && annotState.isAdjustingCurve && annotState.movingShapeIdx >= 0) {
    var s = annotState.shapes[annotState.movingShapeIdx];
    s.cx = pos.x;
    s.cy = pos.y;
    drawCanvas();
    return;
  }
  if (annotState.tool === 'move' && annotState.isMoving && annotState.movingShapeIdx >= 0) {
    var dx = pos.x - annotState.moveLastX;
    var dy = pos.y - annotState.moveLastY;
    moveShape(annotState.shapes[annotState.movingShapeIdx], dx, dy);
    annotState.moveLastX = pos.x;
    annotState.moveLastY = pos.y;
    drawCanvas();
    return;
  }
  if (!annotState.isDrawing) return;
  drawCanvas();
  var ctx = annotState.ctx;
  ctx.strokeStyle = annotState.color;
  ctx.fillStyle = annotState.color;
  ctx.lineWidth = annotState.lineWidth;
  if (annotState.tool === 'arrow') drawArrow(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'dashSingle') drawDashedLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'dashDouble') drawDoubleDashedLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'doubleSolid') drawDoubleSolidLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'solidLine') drawSingleSolidLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'xLine') drawXLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'curve') {
    var cp = getDefaultCurveCP(annotState.startX, annotState.startY, pos.x, pos.y);
    drawCurveLine(ctx, annotState.startX, annotState.startY, cp.cx, cp.cy, pos.x, pos.y);
  }
  else if (annotState.tool === 'curveDashed') {
    var cp2 = getDefaultCurveCP(annotState.startX, annotState.startY, pos.x, pos.y);
    drawCurveSimple(ctx, annotState.startX, annotState.startY, cp2.cx, cp2.cy, pos.x, pos.y, true);
  }
  else if (annotState.tool === 'curveSolid') {
    var cp3 = getDefaultCurveCP(annotState.startX, annotState.startY, pos.x, pos.y);
    drawCurveSimple(ctx, annotState.startX, annotState.startY, cp3.cx, cp3.cy, pos.x, pos.y, false);
  }
  else if (annotState.tool === 'fillRect') drawFillRect(ctx, annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY, annotState.color, annotState.lineWidth);
  else if (annotState.tool === 'dashRect') drawDashedRect(ctx, annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
  else if (annotState.tool === 'dimLine') drawDimLine(ctx, annotState.startX, annotState.startY, pos.x, pos.y);
  else if (annotState.tool === 'rect') ctx.strokeRect(annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
  else if (annotState.tool === 'circle') {
    var r = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY);
    ctx.beginPath(); ctx.arc(annotState.startX, annotState.startY, r, 0, Math.PI * 2); ctx.stroke();
  }
  else if (annotState.tool === 'mosaic') {
    ctx.save(); ctx.strokeStyle = '#666'; ctx.setLineDash([5, 3]); ctx.lineWidth = 1;
    ctx.strokeRect(annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
    ctx.restore();
  }
  else if (annotState.tool === 'textBox') {
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = annotState.lineWidth;
    ctx.strokeRect(annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
    ctx.restore();
  }
  else if (annotState.tool === 'text' || annotState.tool === 'strikeText') {
    ctx.save();
    ctx.strokeStyle = '#999';
    ctx.setLineDash([5, 3]);
    ctx.lineWidth = 1;
    ctx.strokeRect(annotState.startX, annotState.startY, pos.x - annotState.startX, pos.y - annotState.startY);
    ctx.restore();
  }
  else if (annotState.tool === 'callout') {
    var bw = 120, bh = 50;
    drawCallout(ctx, {
      type: 'callout', tipX: annotState.startX, tipY: annotState.startY,
      x: pos.x - bw / 2, y: pos.y - bh / 2, w: bw, h: bh,
      text: '', color: annotState.color, lineWidth: annotState.lineWidth, fontSize: 13
    });
  }
}

function onAnnotMouseUp(e) {
  if (annotState.tool === 'move') {
    annotState.isMoving = false;
    annotState.isAdjustingCurve = false;
    return;
  }
  if (!annotState.isDrawing) return;
  annotState.isDrawing = false;
  var pos = getCanvasPos(e);
  if (annotState.tool === 'arrow') {
    annotState.shapes.push({type:'arrow', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'dashSingle') {
    annotState.shapes.push({type:'dashSingle', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'dashDouble') {
    annotState.shapes.push({type:'dashDouble', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'doubleSolid') {
    annotState.shapes.push({type:'doubleSolid', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'solidLine') {
    annotState.shapes.push({type:'solidLine', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'xLine') {
    annotState.shapes.push({type:'xLine', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'curve') {
    var cp4 = getDefaultCurveCP(annotState.startX, annotState.startY, pos.x, pos.y);
    annotState.shapes.push({type:'curve', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, cx:cp4.cx, cy:cp4.cy, color:annotState.color, lineWidth:annotState.lineWidth});
    showToast('弧长已绘制，拖动蓝色圆点可调整弧度', 'success');
    autoSwitchToMove();
  } else if (annotState.tool === 'curveDashed') {

    annotState.shapes.push({type:'curveDashed', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, cx:cp5.cx, cy:cp5.cy, color:annotState.color, lineWidth:annotState.lineWidth});
    showToast('弯曲虚线已绘制，拖动蓝色圆点可调整弧度', 'success');
    autoSwitchToMove();
  } else if (annotState.tool === 'curveSolid') {
    var cp6 = getDefaultCurveCP(annotState.startX, annotState.startY, pos.x, pos.y);
    annotState.shapes.push({type:'curveSolid', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, cx:cp6.cx, cy:cp6.cy, color:annotState.color, lineWidth:annotState.lineWidth});
    showToast('弯曲实线已绘制，拖动蓝色圆点可调整弧度', 'success');
    autoSwitchToMove();
  } else if (annotState.tool === 'fillRect') {
    annotState.shapes.push({type:'fillRect', x:annotState.startX, y:annotState.startY, w:pos.x-annotState.startX, h:pos.y-annotState.startY, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'dashRect') {
    annotState.shapes.push({type:'dashRect', x:annotState.startX, y:annotState.startY, w:pos.x-annotState.startX, h:pos.y-annotState.startY, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'dimLine') {
    annotState.shapes.push({type:'dimLine', x1:annotState.startX, y1:annotState.startY, x2:pos.x, y2:pos.y, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'rect') {
    annotState.shapes.push({type:'rect', x:annotState.startX, y:annotState.startY, w:pos.x-annotState.startX, h:pos.y-annotState.startY, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'circle') {
    var r2 = Math.hypot(pos.x - annotState.startX, pos.y - annotState.startY);
    annotState.shapes.push({type:'circle', x:annotState.startX, y:annotState.startY, r: r2, color:annotState.color, lineWidth:annotState.lineWidth});
  } else if (annotState.tool === 'mosaic') {
    var bs = Math.max(4, annotState.lineWidth * 3);
    annotState.shapes.push({type:'mosaic', x:annotState.startX, y:annotState.startY, w:pos.x-annotState.startX, h:pos.y-annotState.startY, blockSize: bs});
  } else if (annotState.tool === 'textBox') {
    var w = pos.x - annotState.startX, h = pos.y - annotState.startY;
    if (Math.abs(w) > 10 && Math.abs(h) > 10) {
      annotState.shapes.push({type:'textBox', x:annotState.startX, y:annotState.startY, w: w, h: h, text:'', color:'#000', lineWidth:annotState.lineWidth, fontSize:13});

      autoSwitchToMove();
    }
  } else if (annotState.tool === 'text') {
    var w2 = pos.x - annotState.startX, h2 = pos.y - annotState.startY;
    if (Math.abs(w2) > 10 && Math.abs(h2) > 10) {
      annotState.shapes.push({type:'text', x:annotState.startX, y:annotState.startY, w: w2, h: h2, text:'', color:annotState.color, lineWidth:annotState.lineWidth, fontSize:13});
      showToast('文字框已创建，已切换至移动工具，双击框内可输入文字', 'success');
      autoSwitchToMove();
    }
  } else if (annotState.tool === 'strikeText') {
    var w3 = pos.x - annotState.startX, h3 = pos.y - annotState.startY;
    if (Math.abs(w3) > 10 && Math.abs(h3) > 10) {
      annotState.shapes.push({type:'strikeText', x:annotState.startX, y:annotState.startY, w: w3, h: h3, text:'', color:annotState.color, lineWidth:annotState.lineWidth, fontSize:13});
      showToast('划线文字已创建，已切换至移动工具，双击框内可输入文字', 'success');
      autoSwitchToMove();
    }
  } else if (annotState.tool === 'callout') {
    var bw2 = 120, bh2 = 50;
    annotState.shapes.push({
      type: 'callout', tipX: annotState.startX, tipY: annotState.startY,
      x: pos.x - bw2 / 2, y: pos.y - bh2 / 2, w: bw2, h: bh2,
      text: '', color: annotState.color, lineWidth: annotState.lineWidth, fontSize: 13
    });
    showToast('标注气泡已创建，双击气泡内可输入文字', 'success');
    autoSwitchToMove();

  drawCanvas();
}

function drawArrow(ctx, x1, y1, x2, y2) {
  var headLen = 12 + annotState.lineWidth * 2;
  var angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath(); ctx.fill();
}

function drawDashedLine(ctx, x1, y1, x2, y2) {
  ctx.save();
  ctx.setLineDash([8, 4]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

function drawDoubleDashedLine(ctx, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.hypot(dx, dy);
  if (len < 1) return;
  var offset = 2 + annotState.lineWidth * 0.5;
  var nx = -dy / len * offset;
  var ny = dx / len * offset;
  ctx.save();
  ctx.setLineDash([8, 4]);
  ctx.beginPath(); ctx.moveTo(x1 + nx, y1 + ny); ctx.lineTo(x2 + nx, y2 + ny); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1 - nx, y1 - ny); ctx.lineTo(x2 - nx, y2 - ny); ctx.stroke();
  ctx.restore();
}

function drawFillRect(ctx, x, y, w, h, color, lineWidth) {
  var rx = Math.min(x, x + w), ry = Math.min(y, y + h);
  var rw = Math.abs(w), rh = Math.abs(h);
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = color || '#000';
  ctx.fillRect(rx, ry, rw, rh);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color || '#000';
  ctx.lineWidth = lineWidth || 2;
  ctx.strokeRect(rx, ry, rw, rh);
  ctx.restore();
}

function drawCallout(ctx, s) {
  var bx = Math.min(s.x, s.x + s.w), by = Math.min(s.y, s.y + s.h);
  var bw = Math.abs(s.w), bh = Math.abs(s.h);
  var r = Math.min(10, bw / 4, bh / 4);
  var cx = bx + bw / 2, cy = by + bh / 2;
  var dx = s.tipX - cx, dy = s.tipY - cy;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  var connX, connY, connSide;
  if (adx > ady) {
    if (dx > 0) { connX = bx + bw; connY = cy; connSide = 'right'; }
    else { connX = bx; connY = cy; connSide = 'left'; }
  } else {
    if (dy > 0) { connX = cx; connY = by + bh; connSide = 'bottom'; }
    else { connX = cx; connY = by; connSide = 'top'; }
  }
  var baseW = Math.min(20, bw * 0.3, bh * 0.3);
  var col = s.color || '#ff0000';
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  if (connSide === 'top') {
    ctx.lineTo(connX - baseW / 2, by);
    ctx.lineTo(s.tipX, s.tipY);
    ctx.lineTo(connX + baseW / 2, by);
  }
  ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by, bx + bw, by + r, r);
  if (connSide === 'right') {
    ctx.lineTo(bx + bw, connY - baseW / 2);
    ctx.lineTo(s.tipX, s.tipY);
    ctx.lineTo(bx + bw, connY + baseW / 2);
  }
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  if (connSide === 'bottom') {
    ctx.lineTo(connX + baseW / 2, by + bh);
    ctx.lineTo(s.tipX, s.tipY);
    ctx.lineTo(connX - baseW / 2, by + bh);
  }
  ctx.lineTo(bx + r, by + bh);
  ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
  if (connSide === 'left') {
    ctx.lineTo(bx, connY + baseW / 2);
    ctx.lineTo(s.tipX, s.tipY);
    ctx.lineTo(bx, connY - baseW / 2);
  }
  ctx.lineTo(bx, by + r);
  ctx.arcTo(bx, by, bx + r, by, r);
  ctx.closePath();
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = s.lineWidth || 2;
  ctx.stroke();
  if (s.text) {
    var fontSize = s.fontSize || 13;
    ctx.font = fontSize + 'px Arial';
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var lines = s.text.split('\n');
    var lineHeight = fontSize * 1.3;
    var startY = cy - (lines.length - 1) * lineHeight / 2;
    lines.forEach(function(line, i) { ctx.fillText(line, cx, startY + i * lineHeight); });
  } else {
    ctx.fillStyle = '#ccc';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('双击输入文字', cx, cy);
  }
  ctx.restore();
}

function drawCurveSimple(ctx, x1, y1, cx, cy, x2, y2, dashed) {
  ctx.save();
  if (dashed) ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.stroke();
  ctx.restore();
}

function drawTextInBox(ctx, s) {
  var x = Math.min(s.x, s.x + s.w), y = Math.min(s.y, s.y + s.h);
  var w = Math.abs(s.w), h = Math.abs(s.h);
  ctx.save();
  if (s.text) {
    var fontSize = s.fontSize || 13;
    ctx.fillStyle = s.color || '#000';
    ctx.font = fontSize + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var lines = s.text.split('\n');
    var lineHeight = fontSize * 1.3;
    var startY = y + h / 2 - (lines.length - 1) * lineHeight / 2;
    lines.forEach(function(line, i) {
      ctx.fillText(line, x + w / 2, startY + i * lineHeight);
    });
  } else {
    ctx.strokeStyle = '#ccc';
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }
  ctx.restore();
}

function drawTextBox(ctx, s) {
  var x = Math.min(s.x, s.x + s.w), y = Math.min(s.y, s.y + s.h);
  var w = Math.abs(s.w), h = Math.abs(s.h);

  ctx.fillStyle = '#ffffff';

    });

function drawDashedRect(ctx, x, y, w, h) {
  ctx.save();
  ctx.setLineDash([8, 4]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

function drawDimLine(ctx, x1, y1, x2, y2) {
  var headLen = 10 + annotState.lineWidth * 2;
  var tickLen = 8 + annotState.lineWidth;
  var angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6), y2 - headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6), y2 - headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + headLen * Math.cos(angle - Math.PI/6), y1 + headLen * Math.sin(angle - Math.PI/6));
  ctx.lineTo(x1 + headLen * Math.cos(angle + Math.PI/6), y1 + headLen * Math.sin(angle + Math.PI/6));
  ctx.closePath(); ctx.fill();
  var perpAngle = angle + Math.PI / 2;
  var tx = Math.cos(perpAngle) * tickLen;
  var ty = Math.sin(perpAngle) * tickLen;
  ctx.beginPath();
  ctx.moveTo(x1 - tx, y1 - ty); ctx.lineTo(x1 + tx, y1 + ty);
  ctx.moveTo(x2 - tx, y2 - ty); ctx.lineTo(x2 + tx, y2 + ty);
  ctx.stroke();
}

function drawDoubleSolidLine(ctx, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.hypot(dx, dy);
  if (len < 1) return;
  var offset = 2 + annotState.lineWidth * 0.5;
  var nx = -dy / len * offset;
  var ny = dx / len * offset;
  ctx.beginPath(); ctx.moveTo(x1 + nx, y1 + ny); ctx.lineTo(x2 + nx, y2 + ny); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1 - nx, y1 - ny); ctx.lineTo(x2 - nx, y2 - ny); ctx.stroke();
}

function drawSingleSolidLine(ctx, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawXLine(ctx, x1, y1, x2, y2) {
  var minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  var minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
  ctx.beginPath(); ctx.moveTo(minX, minY); ctx.lineTo(maxX, maxY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(minX, maxY); ctx.lineTo(maxX, minY); ctx.stroke();
}

function getDefaultCurveCP(x1, y1, x2, y2) {
  var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  var dx = x2 - x1, dy = y2 - y1;
  var len = Math.hypot(dx, dy);
  if (len < 1) return { cx: mx, cy: my };
  var offset = len * 0.25;
  return { cx: mx - dy / len * offset, cy: my + dx / len * offset };
}

function drawCurveLine(ctx, x1, y1, cx, cy, x2, y2) {
  var headLen = 10 + annotState.lineWidth * 2;
  var tickLen = 8 + annotState.lineWidth;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(cx, cy, x2, y2);
  ctx.stroke();
  var ang1 = Math.atan2(cy - y1, cx - x1);
  var ang2 = Math.atan2(cy - y2, cx - x2);
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + headLen * Math.cos(ang1 - Math.PI/6), y1 + headLen * Math.sin(ang1 - Math.PI/6));
  ctx.lineTo(x1 + headLen * Math.cos(ang1 + Math.PI/6), y1 + headLen * Math.sin(ang1 + Math.PI/6));
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 + headLen * Math.cos(ang2 - Math.PI/6), y2 + headLen * Math.sin(ang2 - Math.PI/6));
  ctx.lineTo(x2 + headLen * Math.cos(ang2 + Math.PI/6), y2 + headLen * Math.sin(ang2 + Math.PI/6));
  ctx.closePath(); ctx.fill();
  var perp1 = ang1 + Math.PI / 2;
  var t1x = Math.cos(perp1) * tickLen, t1y = Math.sin(perp1) * tickLen;
  ctx.beginPath();
  ctx.moveTo(x1 - t1x, y1 - t1y); ctx.lineTo(x1 + t1x, y1 + t1y);
  var perp2 = ang2 + Math.PI / 2;
  var t2x = Math.cos(perp2) * tickLen, t2y = Math.sin(perp2) * tickLen;
  ctx.moveTo(x2 - t2x, y2 - t2y); ctx.lineTo(x2 + t2x, y2 + t2y);
  ctx.stroke();
}

function drawStrikeText(ctx, s) {
  var x = Math.min(s.x, s.x + s.w), y = Math.min(s.y, s.y + s.h);
  var w = Math.abs(s.w), h = Math.abs(s.h);
  ctx.save();
  if (s.text) {
    var fontSize = s.fontSize || 13;
    ctx.font = fontSize + 'px Arial';
    ctx.fillStyle = s.color || '#000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var lines = s.text.split('\n');
    var lineHeight = fontSize * 1.3;
    var startY = y + h / 2 - (lines.length - 1) * lineHeight / 2;
    lines.forEach(function(line, i) {
      var ly = startY + i * lineHeight;
      ctx.fillText(line, x + w / 2, ly);
      var metrics = ctx.measureText(line);
      ctx.strokeStyle = s.color || '#000';
      ctx.lineWidth = Math.max(1, fontSize / 6);
      ctx.beginPath();
      ctx.moveTo(x + w / 2 - metrics.width / 2, ly);
      ctx.lineTo(x + w / 2 + metrics.width / 2, ly);
      ctx.stroke();
    });
  } else {
    ctx.strokeStyle = '#ccc';
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);
  }
  ctx.restore();
}

function drawMosaic(ctx, x, y, w, h, blockSize) {
  if (w < 0) { x += w; w = -w; }
  if (h < 0) { y += h; h = -h; }
  x = Math.max(0, Math.floor(x));
  y = Math.max(0, Math.floor(y));
  w = Math.min(annotState.canvas.width - x, Math.floor(w));
  h = Math.min(annotState.canvas.height - y, Math.floor(h));
  if (w <= 0 || h <= 0) return;
  var bs = Math.max(2, blockSize);
  for (var by = 0; by < h; by += bs) {
    for (var bx = 0; bx < w; bx += bs) {
      var bw = Math.min(bs, w - bx);
      var bh = Math.min(bs, h - by);
      var data = ctx.getImageData(x + bx, y + by, bw, bh).data;
      var r = 0, g = 0, b = 0, count = 0;
      for (var i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; count++; }
      ctx.fillStyle = 'rgb(' + Math.round(r/count) + ',' + Math.round(g/count) + ',' + Math.round(b/count) + ')';
      ctx.fillRect(x + bx, y + by, bw, bh);
    }
  }
}

function drawCanvas() {
  if (!annotState.ctx || !annotState.canvas) return;
  var ctx = annotState.ctx;
  ctx.clearRect(0, 0, annotState.canvas.width, annotState.canvas.height);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, annotState.canvas.width, annotState.canvas.height);
  annotState.shapes.forEach(function(s) {
    ctx.save();
    var rot = s.rotation || 0;
    if (rot !== 0 && s.type !== 'mosaic') {
      var c = getShapeCenter(s);
      ctx.translate(c.x, c.y);
      ctx.rotate(rot * Math.PI / 180);
      ctx.translate(-c.x, -c.y);
    }
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = s.lineWidth;
    if (s.type === 'arrow') drawArrow(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'dashSingle') drawDashedLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'dashDouble') drawDoubleDashedLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'doubleSolid') drawDoubleSolidLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'solidLine') drawSingleSolidLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'xLine') drawXLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'curve') drawCurveLine(ctx, s.x1, s.y1, s.cx, s.cy, s.x2, s.y2);
    else if (s.type === 'curveDashed') drawCurveSimple(ctx, s.x1, s.y1, s.cx, s.cy, s.x2, s.y2, true);
    else if (s.type === 'curveSolid') drawCurveSimple(ctx, s.x1, s.y1, s.cx, s.cy, s.x2, s.y2, false);
    else if (s.type === 'fillRect') drawFillRect(ctx, s.x, s.y, s.w, s.h, s.color, s.lineWidth);
    else if (s.type === 'dashRect') drawDashedRect(ctx, s.x, s.y, s.w, s.h);
    else if (s.type === 'dimLine') drawDimLine(ctx, s.x1, s.y1, s.x2, s.y2);
    else if (s.type === 'text') drawTextInBox(ctx, s);
    else if (s.type === 'strikeText') drawStrikeText(ctx, s);
    else if (s.type === 'textBox') drawTextBox(ctx, s);
    else if (s.type === 'callout') drawCallout(ctx, s);
    else if (s.type === 'rect') ctx.strokeRect(s.x, s.y, s.w, s.h);
    else if (s.type === 'circle') { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke(); }
    else if (s.type === 'mosaic') drawMosaic(ctx, s.x, s.y, s.w, s.h, s.blockSize);
    else if (s.type === 'image' && s.img) ctx.drawImage(s.img, s.x, s.y, s.w, s.h);
    ctx.restore();
  });
  if (annotState.tool === 'move' && annotState.movingShapeIdx >= 0) {
    var sel = annotState.shapes[annotState.movingShapeIdx];
    var b = getShapeBounds(sel);
    if (b) {
      ctx.save();
      var rot2 = sel.rotation || 0;
      if (rot2 !== 0 && sel.type !== 'mosaic') {
        var c2 = getShapeCenter(sel);
        ctx.translate(c2.x, c2.y);
        ctx.rotate(rot2 * Math.PI / 180);
        ctx.translate(-c2.x, -c2.y);
      }
      ctx.strokeStyle = '#1a56db';
      ctx.setLineDash([5, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.restore();
      if (sel.type === 'curve' || sel.type === 'curveDashed' || sel.type === 'curveSolid') {
        ctx.save();
        var mx = (sel.x1 + sel.x2) / 2, my = (sel.y1 + sel.y2) / 2;
        ctx.strokeStyle = '#1a56db';
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(sel.cx, sel.cy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#1a56db';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(sel.cx, sel.cy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }
  }
}

function undoAnnot() {
  if (annotState.shapes.length === 0) { showToast('没有可撤销的标注', 'info'); return; }
  annotState.shapes.pop();
  drawCanvas();

}

  if (annotState.shapes.length === 0) { showToast('没有可清除的标注', 'info'); return; }

}
