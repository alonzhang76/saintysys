          ${field('安排日期', App.utils.formatDate(r.arrangeDate))}${field('寄样日期', App.utils.formatDate(r.sampleDate))}${field('收妥客寄样衣日期', App.utils.formatDate(r.receivedSampleDate))}${field('样衣工厂', App.utils.escapeHtml(r.factory))}${field('尺码', App.utils.escapeHtml(r.size))}${field('件数', r.qty ? r.qty + ' 件' : '')}${field('单价', r.unitPrice ? '¥' + Number(r.unitPrice).toFixed(2) : '')}${field('面料及克重', App.utils.escapeHtml(r.fabric))}${field('里料及克重', App.utils.escapeHtml(r.lining))}${field('面里料', r.fabricType ? '<span class=\"tag ' + (r.fabricType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + r.fabricType + '</span>' : '')}${field('颜色', r.colorType ? '<span class=\"tag ' + (r.colorType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + r.colorType + '</span>' : '')}${field('辅料', r.accessoryType ? '<span class=\"tag ' + (r.accessoryType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + r.accessoryType + '</span>' : '')}${field('确认人', App.utils.escapeHtml(r.confirmedBy))}${field('确认日期', App.utils.formatDate(r.confirmedDate))}
        </div>
        <div class="mt-8"><div class="detail-label mb-4">客人意见 / 备注</div><div style="background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.5;min-height:32px;">${App.utils.escapeHtml(r.techNotes) || '<span class=\"text-muted\">暂无</span>'}</div></div>
      </div>`).join('');
    body += `</div>`;
  } else {
    body += `<div class="mt-16" style="border-top:1px solid var(--border-light);padding-top:12px;"><div class="detail-grid">
      ${field('安排日期', App.utils.formatDate(s.arrangeDate))}${field('寄样日期', App.utils.formatDate(s.sampleDate))}${field('收妥客寄样衣日期', App.utils.formatDate(s.receivedSampleDate))}${field('样衣工厂', App.utils.escapeHtml(s.factory))}${field('尺码', App.utils.escapeHtml(s.size))}${field('件数', s.qty ? s.qty + ' 件' : '')}${field('单价', s.unitPrice ? '¥' + Number(s.unitPrice).toFixed(2) : '')}${field('面料及克重', App.utils.escapeHtml(s.fabric))}${field('里料及克重', App.utils.escapeHtml(s.lining))}${field('面里料', s.fabricType ? '<span class=\"tag ' + (s.fabricType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + s.fabricType + '</span>' : '')}${field('颜色', s.colorType ? '<span class=\"tag ' + (s.colorType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + s.colorType + '</span>' : '')}${field('辅料', s.accessoryType ? '<span class=\"tag ' + (s.accessoryType === '大货' ? 'tag-green' : 'tag-orange') + '\">' + s.accessoryType + '</span>' : '')}${field('状态', App.statusTag(s.status || '未确认'))}${field('确认人', App.utils.escapeHtml(s.confirmedBy))}${field('确认日期', App.utils.formatDate(s.confirmedDate))}
    </div>
    <div class="mt-8"><div class="detail-label mb-4">备注</div><div style="background:#f9fafb;border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.5;min-height:36px;">${App.utils.escapeHtml(s.techNotes) || '<span class=\"text-muted\">暂无备注</span>'}</div></div></div>`;
  }
  const footer = `<button class="btn" onclick="App.modal.close()">✖️</button><button class="btn btn-primary" onclick="App.modal.close(); openSampleModal('${s.id}')">✏️</button>`;
  App.modal.open({ title: '样衣详情', body, footer, size: 'lg' });
}
function deleteSample(id) { App.confirm('确定要删除这条样衣记录吗？', () => { const samples = getSamples().filter(s => s.id !== id); App.store.set('samples', samples); _selectedIds.delete(id); App.toast('样衣记录已删除', 'success'); renderStats(); renderSampleTable(); }); }
function resetFilter() { filterState = { search: '', status: '' }; renderFilterBar(); renderSampleTable(); }

// ===== 页面初始化（等待 Supabase 就绪后执行） =====
_init(function() {
App.init('sample');
App.checkLogin();
App.initSampleData();
App.enforcePagePermission('sample');

migrateSamples();
renderStats();
renderTabs();
renderFilterBar();
renderSampleTable();
});
</script>

<script>
/* ============================================================
 *  样衣计划 (SamplePlan) 模块
 *  集成自 sample arrangement/index.html（去掉登录窗口）
 *  所有函数/变量/ID 都加了 SamplePlan 命名空间和 sp_ 前缀
 * ============================================================ */
(function(SP) {
  'use strict';

  // ===== Storage Keys =====
  const STORAGE_KEY = 'sht_sample_data_v2';
  const SIZE_TABLE_KEY = 'sht_size_tables_v2';
  const PICTURE_BASE = 'picture/';

  // ===== State =====
  SP.state = {
    data: [], filteredData: [], currentPage: 1, pageSize: 20,
    sortField: '要求交期', sortDirection: 'asc',
    selectedId: null, editingId: null, sizeTables: [],
    sizeSearchQuery: '', expandedSizeTables: new Set(),
    _pendingPictureFile: null
  };
  const state = SP.state;

  SP.columns = [
    { key: 'index', label: '#', sortable: false, width: '36px' },
    { key: '状态', label: '状态', sortable: true, width: '60px' },
    { key: '面辅料准备情况', label: '面辅料', sortable: true, width: '80px' },
    { key: '样衣工', label: '样衣工', sortable: true },
    { key: '款号', label: '款号', sortable: true },
    { key: '样衣类型', label: '样衣类型', sortable: true },
    { key: '打样轮次', label: '轮次', sortable: true, width: '46px' },
    { key: '尺码', label: '尺码', sortable: true, width: '50px' },
    { key: '数量', label: '数量', sortable: true, width: '46px' },
    { key: '要求交期', label: '要求交期', sortable: true },
    { key: '上手时间', label: '上手时间', sortable: true },
    { key: '落手时间', label: '落手时间', sortable: true },
    { key: '备注', label: '备注', sortable: false },
    { key: 'actions', label: '操作', sortable: false, width: '62px' }
  ];
  const columns = SP.columns;

  SP.typeBadges = { '头样':'badge-blue', '尺码样':'badge-purple', '产前样':'badge-teal', '照片样':'badge-orange', '船样':'badge-green' };
  SP.statusBadges = { '未上手':'badge-gray', '未出样':'badge-orange', '已出样':'badge-green' };
  SP.matBadges = { '已到位':'badge-green', '部分到位':'badge-orange', '未到位':'badge-red' };
  const typeBadges = SP.typeBadges, statusBadges = SP.statusBadges, matBadges = SP.matBadges;

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  SP.esc = esc;
  function fmtDate(d) { return d || '<span style="color:var(--sp-muted)">—</span>'; }
  function fmtExcelDate(val) {
    if (!val && val !== 0) return '';
    if (val instanceof Date) return val.toISOString().split('T')[0];
    if (typeof val === 'number') { const d = new Date((val - 25569) * 86400 * 1000); return d.toISOString().split('T')[0]; }
    const s = String(val).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.split('T')[0]; return s;
  }
  function getStatus(row) { if (row['落手时间']) return '已出样'; if (row['上手时间']) return '未出样'; return '未上手'; }
  function countUniqueStyleNos(records) { return new Set(records.map(r => r['款号']).filter(Boolean)).size; }

  // ===== Storage =====
  function loadData() {
    try { 
      const saved = localStorage.getItem(STORAGE_KEY); 
      const parsed = saved ? JSON.parse(saved) : [];
      state.data = Array.isArray(parsed) ? parsed : []; 
    } catch(e) { state.data = []; }
    try { 
      const sizeSaved = localStorage.getItem(SIZE_TABLE_KEY); 
      const parsed = sizeSaved ? JSON.parse(sizeSaved) : [];
      state.sizeTables = Array.isArray(parsed) ? parsed : []; 
    } catch(e) { state.sizeTables = []; }
  }

  // ===== 样衣计划 → 头样/尺码样/产前样/船样/照片样 Tab 实时同步 =====
  // 原则：
  //  1) 不改变头样等 Tab 的表格列与字段结构，严格按原 samples record 字段写入
  //  2) 仅处理带 samplePlanId 标记的记录，原系统手动创建的记录永远保留不碰
  //  3) 按"样衣类型"→ stageKey 映射后自然进入对应 Tab 的过滤
  function syncSamplePlanToTabs() {
    try {
      if (typeof App === 'undefined' || !App.store || typeof STAGE_DEFS === 'undefined') return;
      const typeToStageKey = {};
      STAGE_DEFS.forEach(d => { typeToStageKey[d.name] = d.key; });

      const PLAN_PREFIX = 'SPL_';                 // 同步生成的 id 前缀，稳定更新
      const MARKER = 'samplePlanId';              // 专属标记：仅带此 key 的记录会被同步逻辑替换
      const allSamples = App.store.get('samples', []);
      if (!Array.isArray(allSamples)) return;
      // 1) 先移除之前同步过来的所有记录（保留用户手动建的）
      const preserved = allSamples.filter(s => !s[MARKER]);
      // 2) 按样衣类型重建同步记录；single/multiRound 分别按原系统字段规则
      const mapped = [];
      const srcData = Array.isArray(state.data) ? state.data : [];
      srcData.forEach(r => {
        const stageName = r['样衣类型'] || '';
        const stageKey = typeToStageKey[stageName];
        if (stageKey === undefined || stageKey === null) return; // 类型未知则跳过
        const def = STAGE_DEFS[Number(stageKey)];
        if (!def) return;
        const base = {
          id: PLAN_PREFIX + (r.id || ('gen_' + Math.random().toString(36).slice(2, 9))),
          styleNo: r['款号'] || '',
          stageKey: Number(stageKey),
          [MARKER]: String(r.id || ''),   // 原始 SamplePlan.id 关联标记
          factory: r['样衣工'] || '',
          size: r['尺码'] || '',
          qty: parseInt(r['数量']) || 0,
          arrangeDate: r['要求交期'] || '',   // 表头不直接显示；要求交期作为打样安排日
          sampleDate: r['落手时间'] || '',    // 寄样日期 = 落手完成时
          receivedSampleDate: '',             // 客户收妥日期留空（计划阶段未知）
          status: '未确认',                    // 计划默认未确认，后续原系统手动确认
          confirmedBy: '',
          confirmedDate: '',
          techNotes: r['备注'] || '',
          // 其它原系统字段保持 undefined，不破坏结构：fabric/lining/fabricType/colorType/accessoryType/unitPrice
        };
        if (def.multiRound) {
          // 尺码样 / 产前样（stageKey=1, 2）→ rounds 数组；single-level 字段清空
          base.rounds = [{
            round: parseInt(r['打样轮次']) || 1,
            arrangeDate: r['要求交期'] || '',
            sampleDate: r['落手时间'] || '',
            receivedSampleDate: '',
            factory: r['样衣工'] || '',
            size: r['尺码'] || '',
            qty: parseInt(r['数量']) || 0,
            unitPrice: 0, fabric: '', lining: '',
            fabricType: '大货', colorType: '大货', accessoryType: '大货',
            status: '未确认', confirmedBy: '', confirmedDate: '',
            techNotes: r['备注'] || '',
          }];
          base.round = base.arrangeDate = base.sampleDate = base.receivedSampleDate =
            base.factory = base.size = base.qty = base.unitPrice = base.fabric =
            base.lining = base.fabricType = base.colorType = base.accessoryType =
            base.status = base.confirmedBy = base.confirmedDate = base.techNotes = undefined;
        } else {
          base.rounds = null;
        }
        mapped.push(base);
      });
      const combined = preserved.concat(mapped);
      App.store.set('samples', combined);

      // 3) 若当前显示的是原系统表格区域（非样衣计划 Tab），立即刷新视图
      if (typeof currentTab !== 'undefined' && currentTab !== '样衣计划') {
        if (typeof renderStats === 'function') renderStats();
        if (typeof renderSampleTable === 'function') renderSampleTable();
      }
    } catch (err) {
      // 同步静默失败，不打断 SamplePlan 的正常保存
      if (typeof console !== 'undefined' && console.error) console.error('[syncSamplePlanToTabs]', err);
    }
  }

  // 数据同步队列：批量写入 Supabase，避免频繁请求
  let _spSyncTimer = null;
  let _spSyncPending = false;
  async function flushToSupabase() {
    // 写入样衣数据
    if (state.data) {
      try {
        if (window.SupabaseStore && typeof window.SupabaseStore.set === 'function') {
          await window.SupabaseStore.set(STORAGE_KEY, state.data);
        }
      } catch(e) { console.warn('[SamplePlan] Supabase 同步失败:', e); }
    }
    // 写入尺寸表数据
    if (state.sizeTables) {
      try {
        if (window.SupabaseStore && typeof window.SupabaseStore.set === 'function') {
          await window.SupabaseStore.set(SIZE_TABLE_KEY, state.sizeTables);
        }
      } catch(e) { console.warn('[SamplePlan] 尺寸表 Supabase 同步失败:', e); }
    }
    _spSyncPending = false;
  }
  function scheduleSync() {
    _spSyncPending = true;
    if (_spSyncTimer) return;
    _spSyncTimer = setTimeout(() => {
      _spSyncTimer = null;
      flushToSupabase();
    }, 300); // 300ms 防抖合并多次保存
  }

  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e) { showToast('保存失败：存储空间不足', 'error'); }
    scheduleSync();
    syncSamplePlanToTabs();
  }
  function saveSizeTables() {
    try { localStorage.setItem(SIZE_TABLE_KEY, JSON.stringify(state.sizeTables)); }
    catch(e) { showToast('保存失败：存储空间不足', 'error'); }
    scheduleSync();
  }

  // ===== Dropdown =====
  SP.toggleDropdown = function(e, id) {
    e.stopPropagation();
    const menu = document.getElementById(id);
    const isActive = menu.classList.contains('active');
    document.querySelectorAll('#samplePlanContainer .dropdown-menu').forEach(m => m.classList.remove('active'));
    if (!isActive) menu.classList.add('active');
  };
  document.addEventListener('click', function() { document.querySelectorAll('#samplePlanContainer .dropdown-menu').forEach(m => m.classList.remove('active')); });

  // ===== Toast =====
  function showToast(message, type, duration) {
    type = type || 'info';
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
      error: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' };
    toast.innerHTML = (icons[type] || '') + ' ' + esc(message);
    document.getElementById('sp_toastContainer').appendChild(toast);
    setTimeout(() => toast.remove(), duration || 3000);
  }

  // ===== Stats Render =====
  function renderStats() {
    const data = state.filteredData;
    const total = data.length;
    const qtySum = data.reduce((s, r) => s + (parseInt(r['数量']) || 0), 0);
    const typeCounts = { '头样':0, '尺码样':0, '产前样':0, '照片样':0, '船样':0 };
    data.forEach(r => { if (typeCounts[r['样衣类型']] !== undefined) typeCounts[r['样衣类型']]++; });
    const today = new Date().toISOString().split('T')[0];
    const noEnd = data.filter(r => !r['落手时间']);
    const dueSoon = noEnd.filter(r => r['要求交期'] && r['要求交期'] >= today).length;
    const overdue = noEnd.filter(r => r['要求交期'] && r['要求交期'] < today).length;
    const stNotStart = countUniqueStyleNos(data.filter(r => getStatus(r) === '未上手'));
    const stInProgress = countUniqueStyleNos(data.filter(r => getStatus(r) === '未出样'));
    const stDone = countUniqueStyleNos(data.filter(r => getStatus(r) === '已出样'));
    const ic = {
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>',
      qty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
      tou: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>',
      chi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      chan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      zhao: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      chuan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18l2-10h14l2 10"/><path d="M2 18h20v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>',
      wait: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      run: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
      done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      due: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
      over: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    };
    const iconBox = (cls, svg) => `<div class="stat-icon ${cls}">${svg}</div>`;
    document.getElementById('sp_statsGrid').innerHTML = [
      { cls:'blue', svg:ic.list, val:total, label:'样衣总数' },
      { cls:'teal', svg:ic.qty, val:qtySum, label:'数量合计' },
      { cls:'blue', svg:ic.tou, val:typeCounts['头样'], label:'头样' },
      { cls:'purple', svg:ic.chi, val:typeCounts['尺码样'], label:'尺码样' },
      { cls:'teal', svg:ic.chan, val:typeCounts['产前样'], label:'产前样' },
      { cls:'orange', svg:ic.zhao, val:typeCounts['照片样'], label:'照片样' },
      { cls:'green', svg:ic.chuan, val:typeCounts['船样'], label:'船样' },
      { cls:'gray', svg:ic.wait, val:stNotStart, label:'未上手(款号)' },
      { cls:'orange', svg:ic.run, val:stInProgress, label:'未出样(款号)' },
      { cls:'green', svg:ic.done, val:stDone, label:'已出样(款号)' },
      { cls:'orange', svg:ic.due, val:dueSoon, label:'即将到期' },
      { cls:'red', svg:ic.over, val:overdue, label:'已逾期' }
    ].map(c => `<div class="stat-card glass">${iconBox(c.cls, c.svg)}<div class="stat-info"><div class="stat-value">${c.val}</div><div class="stat-label">${c.label}</div></div></div>`).join('');
  }

  // ===== Table =====
  function renderTableHead() {
    document.getElementById('sp_tableHead').innerHTML = '<tr>' + columns.map(col => {
      const sorted = state.sortField === col.key ? 'sorted' : '';
      const sortClass = col.sortable ? '' : 'no-sort';
      const sortIcon = col.sortable ? `<span class="sort-icon">${state.sortDirection === 'asc' ? '▲' : '▼'}</span>` : '';
      const width = col.width ? `style="min-width:${col.width}"` : '';
      return `<th class="${sorted} ${sortClass}" ${width} onclick="${col.sortable ? `SamplePlan.handleSort('${col.key}')` : ''}">${col.label}${sortIcon}</th>`;
    }).join('') + '</tr>';
  }
  function renderTable() {
    const tbody = document.getElementById('sp_tableBody');
    const data = state.filteredData;
    if (state.sortField) {
      data.sort((a, b) => {
        let va, vb;
        if (state.sortField === '状态') { va = getStatus(a); vb = getStatus(b); }
        else { va = a[state.sortField] || ''; vb = b[state.sortField] || ''; }
        if (typeof va === 'number' && typeof vb === 'number') return state.sortDirection === 'asc' ? va - vb : vb - va;
        va = String(va); vb = String(vb);
        return state.sortDirection === 'asc' ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
      });
    }
    const totalPages = Math.max(1, Math.ceil(data.length / state.pageSize));
    if (state.currentPage > totalPages) state.currentPage = totalPages;
    const start = (state.currentPage - 1) * state.pageSize;
    const pageData = data.slice(start, start + state.pageSize);
    if (pageData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="${columns.length}"><div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>暂无数据</p></div></td></tr>`;
      renderPagination(); return;
    }
    const today = new Date().toISOString().split('T')[0];
    tbody.innerHTML = pageData.map((row, i) => {
      const isSelected = state.selectedId === row.id;
      const idx = start + i + 1;
      const status = getStatus(row);
      const sBadge = statusBadges[status] || 'badge-gray';
      const tBadge = typeBadges[row['样衣类型']] || 'badge-gray';
      const mBadge = matBadges[row['面辅料准备情况']] || 'badge-gray';
      let dotClass = 'dot-green';
      if (!row['落手时间'] && row['要求交期']) {
        const diff = (new Date(row['要求交期']) - new Date(today)) / (1000*60*60*24);
        if (diff < 0) dotClass = 'dot-red';
        else if (diff <= 3) dotClass = 'dot-orange';
      }
      return `<tr class="${isSelected ? 'selected' : ''}" onclick="SamplePlan.selectRow('${row.id}')">
        <td style="text-align:center;color:var(--sp-muted)">${idx}</td>
        <td title="${esc(status)}"><span class="badge ${sBadge}">${status}</span></td>
        <td title="${esc(row['面辅料准备情况'] || '')}"><span class="badge ${mBadge}">${esc(row['面辅料准备情况'] || '')}</span></td>
        <td title="${esc(row['样衣工'] || '')}">${esc(row['样衣工'] || '')}</td>
        <td title="${esc(row['款号'] || '')}"><strong>${esc(row['款号'] || '')}</strong></td>
        <td title="${esc(row['样衣类型'] || '')}"><span class="badge ${tBadge}">${esc(row['样衣类型'] || '')}</span></td>
        <td style="text-align:center" title="第${esc(row['打样轮次'] || 1)}轮">${row['打样轮次'] || 1}</td>
        <td title="${esc(row['尺码'] || '')}">${esc(row['尺码'] || '')}</td>
        <td style="text-align:center" title="${row['数量'] || 0}件">${row['数量'] || 0}</td>
        <td title="${esc(row['要求交期'] || '')}"><span class="urgent-dot ${dotClass}"></span>${fmtDate(row['要求交期'])}</td>
        <td title="${esc(row['上手时间'] || '')}">${fmtDate(row['上手时间'])}</td>
        <td title="${esc(row['落手时间'] || '')}">${fmtDate(row['落手时间'])}</td>
        <td title="${esc(row['备注'] || '')}">${esc(row['备注'] || '')}</td>
        <td class="td-actions"><div class="row-actions" onclick="event.stopPropagation()">
          <button class="row-action-btn edit" onclick="SamplePlan.openForm('${row.id}')" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="row-action-btn delete" onclick="SamplePlan.deleteRecord('${row.id}')" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div></td>
      </tr>`;
    }).join('');
    renderPagination();
  }
  function renderPagination() {
    const total = state.filteredData.length;
    const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
    const start = total === 0 ? 0 : (state.currentPage - 1) * state.pageSize + 1;
    const end = Math.min(state.currentPage * state.pageSize, total);
    const maxShow = 5;
    let s = Math.max(1, state.currentPage - 2);
    let e = Math.min(totalPages, s + maxShow - 1);
    if (e - s < maxShow - 1) s = Math.max(1, e - maxShow + 1);
    let pages = '';
    for (let i = s; i <= e; i++) pages += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" onclick="SamplePlan.changePage(${i})">${i}</button>`;
    document.getElementById('sp_pagination').innerHTML = `
      <div class="page-info">共 <b>${total}</b> 条记录，显示第 <b>${start}</b>-<b>${end}</b> 条</div>
      <div class="page-controls">
        <select class="page-size-select" onchange="SamplePlan.changePageSize(this.value)">
          <option value="10" ${state.pageSize===10?'selected':''}>10条/页</option>
          <option value="20" ${state.pageSize===20?'selected':''}>20条/页</option>
          <option value="50" ${state.pageSize===50?'selected':''}>50条/页</option>
          <option value="100" ${state.pageSize===100?'selected':''}>100条/页</option>
        </select>
        <button class="page-btn" onclick="SamplePlan.changePage(1)" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button>
        <button class="page-btn" onclick="SamplePlan.changePage(${state.currentPage-1})" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        ${pages}
        <button class="page-btn" onclick="SamplePlan.changePage(${state.currentPage+1})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        <button class="page-btn" onclick="SamplePlan.changePage(${totalPages})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg></button>
      </div>`;
  }
  SP.changePage = function(p) { state.currentPage = p; renderTable(); };
  SP.changePageSize = function(s) { state.pageSize = parseInt(s); state.currentPage = 1; renderTable(); };

  // ===== Search / Filter =====
  SP.applyFilters = function() {
    const q = document.getElementById('sp_searchInput').value.trim().toLowerCase();
    const fStatus = document.getElementById('sp_filterStatus').value;
    const fType = document.getElementById('sp_filterType').value;
    const fMat = document.getElementById('sp_filterMaterial').value;
    const fFrom = document.getElementById('sp_filterDateFrom').value;
    const fTo = document.getElementById('sp_filterDateTo').value;
    state.filteredData = state.data.filter(row => {
      if (q && !Object.values(row).some(v => String(v || '').toLowerCase().includes(q))) return false;
      if (fStatus && getStatus(row) !== fStatus) return false;
      if (fType && row['样衣类型'] !== fType) return false;
      if (fMat && row['面辅料准备情况'] !== fMat) return false;
      if (fFrom && row['要求交期'] && row['要求交期'] < fFrom) return false;
      if (fTo && row['要求交期'] && row['要求交期'] > fTo) return false;
      return true;
    });
    const seen = new Set();
    state.filteredData = state.filteredData.filter(row => {
      const key = `${row['款号']||''}|${row['打样轮次']||1}|${row['尺码']||''}`;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    state.currentPage = 1;
    renderStats(); renderTable();
  };
  SP.clearFilters = function() {
    document.getElementById('sp_searchInput').value = '';
    document.getElementById('sp_filterStatus').value = '';
    document.getElementById('sp_filterType').value = '';
    document.getElementById('sp_filterMaterial').value = '';
    document.getElementById('sp_filterDateFrom').value = '';
    document.getElementById('sp_filterDateTo').value = '';
    SP.applyFilters();
  };
  SP.handleSort = function(field) {
    if (state.sortField === field) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
    else { state.sortField = field; state.sortDirection = 'asc'; }
    renderTableHead(); renderTable();
  };

  // 加载图片：优先 Supabase 上传图片，回退本地 picture 文件夹
  async function loadImageForRow(row) {
    const wrapper = document.getElementById('sp_imageWrapper');
    const styleNo = row['款号'] || '';
    const formats = ['jpg','jpeg','png','webp','gif'];

    // 1) 优先加载 Supabase 上传的图片（使用存储的 picture_path）
    if (row['picture_path']) {
      const ss = await ensureSupabase();
      if (ss) {
        try {
          const url = await ss.getFileUrl(row['picture_path'], 300);
          if (url) {
            const img = new Image();
            img.onload = () => {
              wrapper.innerHTML = '';
              img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;';
              wrapper.appendChild(img);
              document.getElementById('sp_deletePicBtn').style.display = 'inline-flex';
            };
            img.onerror = () => {
              console.warn('[SamplePlan] Supabase 图片加载失败，尝试按款号匹配');
              tryMatchSupabaseThenLocal(wrapper, styleNo, formats, row);
            };
            img.src = url;
            return;
          }
        } catch (e) {
          console.warn('[SamplePlan] getFileUrl 失败，尝试按款号匹配:', e);
        }
      }
    }

    // 2) picture_path 不存在或失效 → 按款号在 Supabase 中查找
    tryMatchSupabaseThenLocal(wrapper, styleNo, formats, row);
  }

  // 先尝试在 Supabase 中按款号匹配文件，再回退本地
  async function tryMatchSupabaseThenLocal(wrapper, styleNo, formats, row) {
    const ss = await ensureSupabase();
    if (ss && ss.findPictureByStyleNo) {
      // 提取原始文件名中的扩展名用于精确匹配
      const pictureName = row && row['picture_name'] ? row['picture_name'] : '';
      let originalExt = null;
      if (pictureName) {
        const parts = pictureName.split('.');
        if (parts.length >= 2) originalExt = parts.pop().toLowerCase();
      }

      try {
        const matched = await ss.findPictureByStyleNo(styleNo, 'sample', originalExt);
        if (matched && matched.signedUrl) {
          const img = new Image();
          img.onload = () => {
            wrapper.innerHTML = '';
            img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;border-radius:4px;';
            wrapper.appendChild(img);
            // 自动补全 picture_path，避免下次再匹配
            if (row && matched.path && row['picture_path'] !== matched.path) {
              row['picture_path'] = matched.path;
              saveData();
            }
          };
          img.onerror = () => {
            console.warn('[SamplePlan] 匹配到的 Supabase 图片加载失败，回退到本地');
            tryLocalPicture(wrapper, styleNo, formats);
          };
          img.src = matched.signedUrl;
          return;
        }
      } catch (e) {
        console.warn('[SamplePlan] findPictureByStyleNo 失败:', e);
      }
    }
    // 3) 最终回退：本地 picture 文件夹
    tryLocalPicture(wrapper, styleNo, formats);
  }

  function tryLocalPicture(wrapper, styleNo, formats) {
    document.getElementById('sp_deletePicBtn').style.display = 'none';
    let fi = 0;
    function tryLoad() {
      if (fi >= formats.length) {
        wrapper.innerHTML = `<div class="image-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>未找到图片</p>
          <p class="hint">点击「上传图片」按钮上传款式图<br>或将图片放入 picture 文件夹命名为「${esc(styleNo)}.jpg」</p>
        </div>`;
        return;
      }
      const img = new Image();
      img.onload = () => { wrapper.innerHTML = ''; img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;'; wrapper.appendChild(img); };
      img.onerror = () => { fi++; tryLoad(); };
      img.src = PICTURE_BASE + styleNo + '.' + formats[fi];
    }
    tryLoad();
  }

  // ===== Picture Upload / Delete =====
  // 等待 Supabase 模块加载完成（容错时序）
  async function ensureSupabase() {
    if (typeof window.SupabaseSubmit !== 'undefined') return window.SupabaseSubmit;
    // 等待最多 5 秒
    for (let i = 0; i < 50; i++) {
      await new Promise(function(r) { setTimeout(r, 100); });
      if (typeof window.SupabaseSubmit !== 'undefined') return window.SupabaseSubmit;
    }
    return null;
  }

  // 触发图片预览面板中的上传
  SP.triggerUploadPicture = function() {
    document.getElementById('sp_pictureInput').click();
  };
  // 处理图片预览面板中的文件选择
  SP.handlePictureUpload = async function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('图片超过 5MB 限制', 'error');
      event.target.value = '';
      return;
    }
    const ss = await ensureSupabase();
    if (!ss) {
      showToast('图片上传模块未加载，请刷新页面', 'error');
      event.target.value = '';
      return;
    }
    const row = state.data.find(r => r.id === currentPanelRowId);
    if (!row) { event.target.value = ''; return; }

    // 删除旧图片（如果有）
    if (row['picture_path']) {
      await ss.deletePicture(row['picture_path']);
    }

    const result = await ss.uploadPicture(file, 'sample');
    event.target.value = '';
    if (!result) return;

    // 更新记录
    row['picture_path'] = result.path;
    row['picture_name'] = result.fileName || file.name;
    saveData();
    showToast('图片上传成功', 'success');
    // 重新加载图片
    loadImageForRow(row);
  };
  // 删除上传的图片
  SP.deleteUploadedPicture = async function() {
    const row = state.data.find(r => r.id === currentPanelRowId);
    if (!row || !row['picture_path']) return;
    if (!confirm('确定删除已上传的款式图吗？')) return;
    const ss = await ensureSupabase();
    if (ss) await ss.deletePicture(row['picture_path']);
    delete row['picture_path'];
    saveData();
    showToast('图片已删除', 'success');
    loadImageForRow(row);
  };

  // 表单中的图片上传
  SP.triggerFormPictureUpload = function() {
    document.getElementById('sp_formPictureInput').click();
  };
  SP.handleFormPictureChange = async function(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('图片超过 5MB 限制', 'error');
      event.target.value = '';
      return;
    }
    // 预览本地
    const reader = new FileReader();

      document.getElementById('sp_formPictureImg').src = e.target.result;
      document.getElementById('sp_formPicturePlaceholder').style.display = 'none';
      document.getElementById('sp_formPicturePreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
    // 保存 file 引用，在 saveRecord 时上传
    state._pendingPictureFile = file;
    event.target.value = '';
  };

  // ===== Form =====
  SP.openForm = function(id) {
    const overlay = document.getElementById('sp_modalOverlay');
    if (!overlay) return;
    document.getElementById('sp_sampleForm').reset();
    document.getElementById('sp_editId').value = '';
    state._pendingPictureFile = null;
    if (id) {
      const srcData = Array.isArray(state.data) ? state.data : [];
      const row = srcData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('sp_modalTitle').textContent = '编辑样衣';
      state.editingId = id;
      document.getElementById('sp_editId').value = id;
      document.getElementById('sp_f_worker').value = row['样衣工'] || '';
      document.getElementById('sp_f_styleNo').value = row['款号'] || '';
      document.getElementById('sp_f_type').value = row['样衣类型'] || '头样';
      document.getElementById('sp_f_round').value = row['打样轮次'] || 1;
      document.getElementById('sp_f_size').value = row['尺码'] || '';
      document.getElementById('sp_f_qty').value = row['数量'] || 1;
      document.getElementById('sp_f_dueDate').value = row['要求交期'] || '';
      document.getElementById('sp_f_startDate').value = row['上手时间'] || '';
      document.getElementById('sp_f_endDate').value = row['落手时间'] || '';
      document.getElementById('sp_f_material').value = row['面辅料准备情况'] || '已到位';
      document.getElementById('sp_f_remarks').value = row['备注'] || '';
      // 回显已有图片
      if (row['picture_path']) {
        document.getElementById('sp_f_picturePath').value = row['picture_path'];
        // 加载 signed URL 预览（异步，不阻塞表单）
        ensureSupabase().then(function(ss) {
          if (!ss) return;
          ss.getFileUrl(row['picture_path'], 60).then(function(url) {
            if (url) {
              document.getElementById('sp_formPictureImg').src = url;
              document.getElementById('sp_formPicturePlaceholder').style.display = 'none';
              document.getElementById('sp_formPicturePreview').style.display = 'block';
            } else if (ss.findPictureByStyleNo) {
              // picture_path 失效 → 按款号匹配
              const picName = row['picture_name'] || '';
              let picExt = null;
              if (picName) { const p = picName.split('.'); if (p.length >= 2) picExt = p.pop().toLowerCase(); }
              ss.findPictureByStyleNo(row['款号'] || '', 'sample', picExt).then(function(matched) {
                if (matched && matched.signedUrl) {
                  document.getElementById('sp_formPictureImg').src = matched.signedUrl;
                  document.getElementById('sp_f_picturePath').value = matched.path;
                  row['picture_path'] = matched.path;
                  saveData();
                  document.getElementById('sp_formPicturePlaceholder').style.display = 'none';
                  document.getElementById('sp_formPicturePreview').style.display = 'block';
                }
              });
            }
          });
        });
      } else {
        // picture_path 不存在 → 按款号在 Supabase 中查找
        SP.clearFormPicture();
        const fPicName = row['picture_name'] || '';
        let fPicExt = null;
        if (fPicName) { const fp = fPicName.split('.'); if (fp.length >= 2) fPicExt = fp.pop().toLowerCase(); }
        ensureSupabase().then(function(formSs) {
          if (formSs && formSs.findPictureByStyleNo) {
            formSs.findPictureByStyleNo(row['款号'] || '', 'sample', fPicExt).then(function(matched) {
              if (matched && matched.signedUrl) {
                document.getElementById('sp_formPictureImg').src = matched.signedUrl;
                document.getElementById('sp_f_picturePath').value = matched.path;
                row['picture_path'] = matched.path;
                saveData();
                document.getElementById('sp_formPicturePlaceholder').style.display = 'none';
                document.getElementById('sp_formPicturePreview').style.display = 'block';
              }

    const list = document.getElementById('sp_sizeList');
    const q = state.sizeSearchQuery.toLowerCase();
    const filtered = q ? state.sizeTables.filter(st => String(st['款号']).toLowerCase().includes(q)) : state.sizeTables;
    if (filtered.length === 0) {
      list.innerHTML = `<div class="glass" style="padding:50px 20px;text-align:center;color:var(--sp-muted)">
        <svg style="width:44px;height:44px;margin-bottom:10px;opacity:0.3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <p style="font-size:14px">${q ? '未找到匹配的尺寸表' : '暂无尺寸表，请导入Excel文件'}</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(st => {
      const isExpanded = state.expandedSizeTables.has(st.id);
      const infoHTML = (st['日期'] || st['类型']) ? `<div class="size-card-info">
        ${st['日期'] ? `<span>日期: <b>${esc(st['日期'])}</b></span>` : ''}
        ${st['类型'] ? `<span>类型: <b>${esc(st['类型'])}</b></span>` : ''}
        <span>${st.rows}行 × ${st.cols}列</span><span>导入: ${st.importDate}</span></div>`
        : `<div class="size-card-info"><span>${st.rows}行 × ${st.cols}列</span><span>导入: ${st.importDate}</span></div>`;
      let tableHTML = '';
      if (isExpanded) {
        tableHTML = `<div class="size-table-scroll"><table class="size-table-preview">
          ${st.data.map((row, ri) => {
            if (ri === 0 || (ri === 3 && row[0] === '部位编号')) {
              return `<thead><tr>${row.map(c => `<th>${esc(String(c))}</th>`).join('')}</tr></thead>`;
            }
            if (ri < 3 && row[0] && ['款号','日期','类型'].includes(row[0])) return '';
            return `<tr>${row.map(c => `<td>${esc(String(c))}</td>`).join('')}</tr>`;
          }).join('')}
        </table></div>`;
      }
      const detailIcon = isExpanded
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
      return `<div class="size-card glass ${isExpanded ? 'expanded' : ''}" id="sp_size-card-${st.id}">
        <div class="size-card-header">
          <div class="size-card-title"><span class="badge badge-blue">${esc(st['款号'])}</span></div>
          <div class="row-actions">
            <button class="size-detail-btn" onclick="SamplePlan.toggleSizeTableDetail('${st.id}')">${isExpanded ? '收起' : '详情'} ${detailIcon}</button>
            <button class="row-action-btn edit" onclick="SamplePlan.exportSizeTable('${st.id}')" title="导出Excel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button class="row-action-btn delete" onclick="SamplePlan.deleteSizeTable('${st.id}')" title="删除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
        ${infoHTML}${tableHTML}</div>`;
    }).join('');
  }
  SP.toggleSizeTableDetail = function(id) {
    if (state.expandedSizeTables.has(id)) state.expandedSizeTables.delete(id);
    else state.expandedSizeTables.add(id);
    renderSizeTables();
  };
  SP.handleSizeSearch = function() {
    state.sizeSearchQuery = document.getElementById('sp_sizeSearchInput').value.trim();
    renderSizeTables();
  };
  SP.deleteSizeTable = function(id) {
    const st = state.sizeTables.find(s => s.id === id); if (!st) return;
    if (!confirm(`确认删除款号「${st['款号']}」的尺寸表？`)) return;
    state.sizeTables = state.sizeTables.filter(s => s.id !== id);
    state.expandedSizeTables.delete(id);
    saveSizeTables(); renderSizeTables(); showToast('删除成功', 'success');
  };
  SP.exportSizeTable = function(id) {
    const st = state.sizeTables.find(s => s.id === id); if (!st) return;
    const ws = XLSX.utils.aoa_to_sheet(st.data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '尺寸表');
    XLSX.writeFile(wb, `尺寸表_${st['款号']}.xlsx`);
    showToast('导出成功', 'success');
  };

  // ===== Tab Switch (子标签) =====
  SP.switchTab = function(tab) {
    document.querySelectorAll('#samplePlanContainer .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.querySelectorAll('#samplePlanContainer .tab-content').forEach(c => c.classList.toggle('active', c.id === 'sp_tab-' + tab));
  };

  // ===== Worker List =====
  function updateWorkerList() {
    const workers = [...new Set(state.data.map(r => r['样衣工']).filter(Boolean))];
    document.getElementById('sp_workerList').innerHTML = workers.map(w => `<option value="${esc(w)}">`).join('');
  }

  // ===== Keyboard Events (仅限在 sample-plan 中生效) =====
  let _spKDListener = null;
  function bindSpKeyboard() {
    if (_spKDListener) return;
    _spKDListener = function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('sp_modalOverlay').classList.contains('active')) SP.closeForm();
        else if (document.getElementById('sp_imagePanel').classList.contains('active')) SP.closeImagePanel();
      }
    };
    document.addEventListener('keydown', _spKDListener);
    // 【已取消：点击遮罩空白自动关闭表单】
    // 避免误操作导致填了一半的数据丢失，现只允许用 取消按钮 / 保存 / ESC 键 关闭表单
    // 旧代码：document.getElementById('sp_modalOverlay').addEventListener('click', function(e) { if (e.target === this) SP.closeForm(); });
    document.addEventListener('click', function(e) {
      if (panelJustOpened) { panelJustOpened = false; return; }
      const panel = document.getElementById('sp_imagePanel');
      if (panel.classList.contains('active') && !panel.contains(e.target)) SP.closeImagePanel();
    });
  }

  // ===== Init (首次进入样衣计划 Tab 才调用) =====
  SP.init = function() {
    loadData();
    state.filteredData = [...state.data];
    state.filteredData.sort((a, b) => String(a['要求交期'] || '').localeCompare(String(b['要求交期'] || '')));
    updateWorkerList();
    renderStats();
    renderTableHead();
    renderTable();
    renderSizeTables();
    bindSpKeyboard();
    syncSamplePlanToTabs();   // 首次进入也同步一次（把历史的样衣计划推送到原系统 Tab）

    // 页面关闭前确保数据写入 Supabase
    window.addEventListener('beforeunload', function() {
      if (_spSyncPending) {
        // 同步写入（使用 fetch keepalive 或同步方式）
        try {
          if (window.SupabaseStore && window.SupabaseStore._flushSync) {
            window.SupabaseStore._flushSync();
          }
          // 同时直接写入（绕过异步队列）
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
          localStorage.setItem(SIZE_TABLE_KEY, JSON.stringify(state.sizeTables));
        } catch(e) {}
      }
    });
  };

  // 手动立即同步（可在设置或调试时使用）
  SP.syncNow = async function() {
    await flushToSupabase();
    showToast('数据已同步到云端', 'success');
  };
})(window.SamplePlan = window.SamplePlan || {});
</script>
</body>
</html>
