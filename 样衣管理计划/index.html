<script>
// ===================== State =====================
const STORAGE_KEY = 'sht_sample_data_v2';
const SIZE_TABLE_KEY = 'sht_size_tables_v2';

let state = {
  data: [],
  filteredData: [],
  currentPage: 1,
  pageSize: 20,
  sortField: '要求交期',
  sortDirection: 'asc',
  selectedId: null,
  editingId: null,
  sizeTables: [],
  sizeSearchQuery: '',
  expandedSizeTables: new Set()
};

const columns = [
  { key: 'index', label: '#', sortable: false, width: '36px' },
  { key: '状态', label: '状态', sortable: true, width: '60px' },
  { key: '面辅料准备情况', label: '面辅料', sortable: true, width: '80px' },
  { key: '样衣工', label: '样衣工', sortable: true },
  { key: '款号', label: '款号', sortable: true },
  { key: '样衣类型', label: '样衣类型', sortable: true },
  { key: '打样轮次', label: '轮次', sortable: true, width: '46px' },
  { key: '尺码', label: '尺码', sortable: true, width: '50px' },
  { key: '数量', label: '数量', sortable: true, width: '46px' },
  { key: '要求交期', label: '要求交期', sortable: true },
  { key: '上手时间', label: '上手时间', sortable: true },
  { key: '落手时间', label: '落手时间', sortable: true },
  { key: '备注', label: '备注', sortable: false },
  { key: 'actions', label: '操作', sortable: false, width: '62px' }
];

const typeBadges = { '头样':'badge-blue', '尺码样':'badge-purple', '产前样':'badge-teal', '照片样':'badge-orange', '船样':'badge-green' };
const statusBadges = { '未上手':'badge-gray', '未出样':'badge-orange', '已出样':'badge-green' };
const matBadges = { '已到位':'badge-green', '部分到位':'badge-orange', '未到位':'badge-red' };

// ===================== Status Logic =====================
function getStatus(row) {
  if (row['落手时间']) return '已出样';
  if (row['上手时间']) return '未出样';
  return '未上手';
}

function countUniqueStyleNos(records) {
  return new Set(records.map(r => r['款号']).filter(Boolean)).size;
}

// ===================== Data Management =====================
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    state.data = saved ? JSON.parse(saved) : [];
  } catch(e) { state.data = []; }
  try {
    const sizeSaved = localStorage.getItem(SIZE_TABLE_KEY);
    state.sizeTables = sizeSaved ? JSON.parse(sizeSaved) : [];
  } catch(e) { state.sizeTables = []; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
  catch(e) { showToast('保存失败：存储空间不足', 'error'); }
}

function saveSizeTables() {
  try { localStorage.setItem(SIZE_TABLE_KEY, JSON.stringify(state.sizeTables)); }
  catch(e) { showToast('保存失败：存储空间不足', 'error'); }
}

// ===================== Dropdown =====================
function toggleDropdown(e, id) {
  e.stopPropagation();
  const menu = document.getElementById(id);
  const isActive = menu.classList.contains('active');
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
  if (!isActive) menu.classList.add('active');
}

document.addEventListener('click', function() {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
});

// ===================== Stats Rendering =====================
function renderStats() {
  const data = state.filteredData;
  const total = data.length;
  const qtySum = data.reduce((s, r) => s + (parseInt(r['数量']) || 0), 0);
  const typeCounts = { '头样':0, '尺码样':0, '产前样':0, '照片样':0, '船样':0 };
  data.forEach(r => { if (typeCounts[r['样衣类型']] !== undefined) typeCounts[r['样衣类型']]++; });

  const today = new Date().toISOString().split('T')[0];
  const noEnd = data.filter(r => !r['落手时间']);
  const dueSoon = noEnd.filter(r => r['要求交期'] && r['要求交期'] >= today).length;
  const overdue = noEnd.filter(r => r['要求交期'] && r['要求交期'] < today).length;

  const stNotStart = countUniqueStyleNos(data.filter(r => getStatus(r) === '未上手'));
  const stInProgress = countUniqueStyleNos(data.filter(r => getStatus(r) === '未出样'));
  const stDone = countUniqueStyleNos(data.filter(r => getStatus(r) === '已出样'));

  const iconBox = (cls, svg) => `<div class="stat-icon ${cls}">${svg}</div>`;
  const ic = {
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>',
    qty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',

// ===================== Table Rendering =====================
function renderTableHead() {
  document.getElementById('tableHead').innerHTML = '<tr>' + columns.map(col => {
    const sorted = state.sortField === col.key ? 'sorted' : '';
    const sortClass = col.sortable ? '' : 'no-sort';
    const sortIcon = col.sortable ? `<span class="sort-icon">${state.sortDirection === 'asc' ? '▲' : '▼'}</span>` : '';
    const width = col.width ? `style="min-width:${col.width}"` : '';
    return `<th class="${sorted} ${sortClass}" ${width} onclick="${col.sortable ? `handleSort('${col.key}')` : ''}">${col.label}${sortIcon}</th>`;
  }).join('') + '</tr>';
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const data = state.filteredData;

  if (state.sortField) {
    data.sort((a, b) => {
      let va, vb;
      if (state.sortField === '状态') { va = getStatus(a); vb = getStatus(b); }
      else { va = a[state.sortField] || ''; vb = b[state.sortField] || ''; }
      if (typeof va === 'number' && typeof vb === 'number') return state.sortDirection === 'asc' ? va - vb : vb - va;
      va = String(va); vb = String(vb);
      return state.sortDirection === 'asc' ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
    });
  }

  const totalPages = Math.max(1, Math.ceil(data.length / state.pageSize));
  if (state.currentPage > totalPages) state.currentPage = totalPages;
  const start = (state.currentPage - 1) * state.pageSize;
  const pageData = data.slice(start, start + state.pageSize);

  if (pageData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${columns.length}"><div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>暂无数据</p>
    </div></td></tr>`;
    renderPagination();
    return;
  }

  const today = new Date().toISOString().split('T')[0];

  tbody.innerHTML = pageData.map((row, i) => {
    const isSelected = state.selectedId === row.id;
    const idx = start + i + 1;
    const status = getStatus(row);
    const statusBadge = statusBadges[status] || 'badge-gray';
    const typeBadge = typeBadges[row['样衣类型']] || 'badge-gray';
    const matBadge = matBadges[row['面辅料准备情况']] || 'badge-gray';

    let dotClass = 'dot-green';
    if (!row['落手时间'] && row['要求交期']) {
      const diff = (new Date(row['要求交期']) - new Date(today)) / (1000*60*60*24);
      if (diff < 0) dotClass = 'dot-red';
      else if (diff <= 3) dotClass = 'dot-orange';
    }

    return `<tr class="${isSelected ? 'selected' : ''}" onclick="selectRow('${row.id}')">
      <td style="text-align:center;color:var(--muted)">${idx}</td>
      <td title="${esc(status)}"><span class="badge ${statusBadge}">${status}</span></td>
      <td title="${esc(row['面辅料准备情况'] || '')}"><span class="badge ${matBadge}">${esc(row['面辅料准备情况'] || '')}</span></td>
      <td title="${esc(row['样衣工'] || '')}">${esc(row['样衣工'] || '')}</td>
      <td title="${esc(row['款号'] || '')}"><strong>${esc(row['款号'] || '')}</strong></td>
      <td title="${esc(row['样衣类型'] || '')}"><span class="badge ${typeBadge}">${esc(row['样衣类型'] || '')}</span></td>
      <td style="text-align:center" title="第${esc(row['打样轮次'] || 1)}轮">${row['打样轮次'] || 1}</td>
      <td title="${esc(row['尺码'] || '')}">${esc(row['尺码'] || '')}</td>
      <td style="text-align:center" title="${row['数量'] || 0}件">${row['数量'] || 0}</td>
      <td title="${esc(row['要求交期'] || '')}"><span class="urgent-dot ${dotClass}"></span>${fmtDate(row['要求交期'])}</td>
      <td title="${esc(row['上手时间'] || '')}">${fmtDate(row['上手时间'])}</td>
      <td title="${esc(row['落手时间'] || '')}">${fmtDate(row['落手时间'])}</td>
      <td title="${esc(row['备注'] || '')}">${esc(row['备注'] || '')}</td>
      <td class="td-actions"><div class="row-actions" onclick="event.stopPropagation()">
        <button class="row-action-btn edit" onclick="openForm('${row.id}')" title="编辑">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="row-action-btn delete" onclick="deleteRecord('${row.id}')" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div></td>
    </tr>`;
  }).join('');

  renderPagination();
}

// ===================== Pagination =====================
function renderPagination() {
  const total = state.filteredData.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  const start = total === 0 ? 0 : (state.currentPage - 1) * state.pageSize + 1;
  const end = Math.min(state.currentPage * state.pageSize, total);
  const maxShow = 5;
  let s = Math.max(1, state.currentPage - 2);
  let e = Math.min(totalPages, s + maxShow - 1);
  if (e - s < maxShow - 1) s = Math.max(1, e - maxShow + 1);
  let pages = '';
  for (let i = s; i <= e; i++) pages += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;

  document.getElementById('pagination').innerHTML = `
    <div class="page-info">共 <b>${total}</b> 条记录，显示第 <b>${start}</b>-<b>${end}</b> 条</div>
    <div class="page-controls">
      <select class="page-size-select" onchange="changePageSize(this.value)">
        <option value="10" ${state.pageSize===10?'selected':''}>10条/页</option>
        <option value="20" ${state.pageSize===20?'selected':''}>20条/页</option>
        <option value="50" ${state.pageSize===50?'selected':''}>50条/页</option>
        <option value="100" ${state.pageSize===100?'selected':''}>100条/页</option>
      </select>
      <button class="page-btn" onclick="changePage(1)" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button>
      <button class="page-btn" onclick="changePage(${state.currentPage-1})" ${state.currentPage===1?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      ${pages}
      <button class="page-btn" onclick="changePage(${state.currentPage+1})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button class="page-btn" onclick="changePage(${totalPages})" ${state.currentPage===totalPages?'disabled':''}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg></button>
    </div>`;
}

function changePage(p) { state.currentPage = p; renderTable(); }
function changePageSize(s) { state.pageSize = parseInt(s); state.currentPage = 1; renderTable(); }

// ===================== Search & Filter =====================
function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const fStatus = document.getElementById('filterStatus').value;
  const fType = document.getElementById('filterType').value;
  const fMat = document.getElementById('filterMaterial').value;
  const fFrom = document.getElementById('filterDateFrom').value;
  const fTo = document.getElementById('filterDateTo').value;

  state.filteredData = state.data.filter(row => {
    if (q && !Object.values(row).some(v => String(v || '').toLowerCase().includes(q))) return false;
    if (fStatus && getStatus(row) !== fStatus) return false;
    if (fType && row['样衣类型'] !== fType) return false;
    if (fMat && row['面辅料准备情况'] !== fMat) return false;
    if (fFrom && row['要求交期'] && row['要求交期'] < fFrom) return false;
    if (fTo && row['要求交期'] && row['要求交期'] > fTo) return false;
    return true;
  });

  const seen = new Set();
  state.filteredData = state.filteredData.filter(row => {
    const key = `${row['款号']||''}|${row['打样轮次']||1}|${row['尺码']||''}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  state.currentPage = 1;
  renderStats();
  renderTable();
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('filterStatus').value = '';
  document.getElementById('filterType').value = '';
  document.getElementById('filterMaterial').value = '';
  document.getElementById('filterDateFrom').value = '';
  document.getElementById('filterDateTo').value = '';
  applyFilters();
}

// ===================== Sort =====================
function handleSort(field) {
  if (state.sortField === field) state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
  else { state.sortField = field; state.sortDirection = 'asc'; }
  renderTableHead();
  renderTable();
}

// ===================== Row Selection & Image Preview =====================
let panelJustOpened = false;
function selectRow(id) {
  state.selectedId = id;
  renderTable();
  const row = state.data.find(r => r.id === id);
  if (row) showImagePreview(row);
}

function showImagePreview(row) {
  panelJustOpened = true;
  document.getElementById('imagePanel').classList.add('active');
  const wrapper = document.getElementById('imageWrapper');
  const styleNo = row['款号'] || '';
  const formats = ['jpg','jpeg','png','webp','gif'];
  let fi = 0;

  function tryLoad() {
    if (fi >= formats.length) {
      wrapper.innerHTML = `<div class="image-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>未找到图片</p>
        <p class="hint">请将图片放入 picture 文件夹<br>命名为「${esc(styleNo)}.jpg」</p>
      </div>`;
      return;
    }
    const img = new Image();
    img.onload = () => { wrapper.innerHTML = ''; img.style.cssText = 'max-width:100%;max-height:480px;width:auto;height:auto;object-fit:contain;display:block;'; wrapper.appendChild(img); };
    img.onerror = () => { fi++; tryLoad(); };
    img.src = `picture/${styleNo}.${formats[fi]}`;
  }
  tryLoad();

  const typeBadge = typeBadges[row['样衣类型']] || 'badge-gray';
  document.getElementById('imageInfoGrid').innerHTML = `
    <div class="image-info-item"><div class="label">款号</div><div class="value">${esc(styleNo)}</div></div>
    <div class="image-info-item"><div class="label">样衣类型</div><div class="value"><span class="badge ${typeBadge}">${esc(row['样衣类型']||'')}</span></div></div>
    <div class="image-info-item"><div class="label">样衣工</div><div class="value">${esc(row['样衣工']||'')}</div></div>
    <div class="image-info-item"><div class="label">打样轮次</div><div class="value">第${row['打样轮次']||1}轮</div></div>
    <div class="image-info-item"><div class="label">尺码/数量</div><div class="value">${esc(row['尺码']||'-')} / ${row['数量']||0}件</div></div>
    <div class="image-info-item"><div class="label">要求交期</div><div class="value">${fmtDate(row['要求交期'])}</div></div>`;
}

function closeImagePanel() {
  document.getElementById('imagePanel').classList.remove('active');
  state.selectedId = null;
  renderTable();
}

function openSizeTableFromPreview() {
  const row = state.data.find(r => r.id === state.selectedId);
  if (!row) return;
  const styleNo = String(row['款号'] || '');
  closeImagePanel();
  switchTab('sizeTables');
  document.getElementById('sizeSearchInput').value = styleNo;
  state.sizeSearchQuery = styleNo;
  const sizeTable = state.sizeTables.find(st => String(st['款号']) === styleNo);
  if (sizeTable) {
    state.expandedSizeTables.add(sizeTable.id);
  }
  renderSizeTables();
  if (!sizeTable) {
    showToast(`未找到款号「${styleNo}」的尺寸表，请先导入`, 'info');
  } else {
    setTimeout(() => {
      const card = document.getElementById(`size-card-${sizeTable.id}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 200);
  }
}

// ===================== Form =====================
function openForm(id) {
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('sampleForm').reset();
  document.getElementById('editId').value = '';

  if (id) {
    const row = state.data.find(r => r.id === id);
    if (!row) return;
    document.getElementById('modalTitle').textContent = '编辑样衣';
    state.editingId = id;
    document.getElementById('editId').value = id;
    document.getElementById('f_worker').value = row['样衣工'] || '';
    document.getElementById('f_styleNo').value = row['款号'] || '';
    document.getElementById('f_type').value = row['样衣类型'] || '头样';
    document.getElementById('f_round').value = row['打样轮次'] || 1;
    document.getElementById('f_size').value = row['尺码'] || '';
    document.getElementById('f_qty').value = row['数量'] || 1;
    document.getElementById('f_dueDate').value = row['要求交期'] || '';
    document.getElementById('f_startDate').value = row['上手时间'] || '';
    document.getElementById('f_endDate').value = row['落手时间'] || '';
    document.getElementById('f_material').value = row['面辅料准备情况'] || '已到位';
    document.getElementById('f_remarks').value = row['备注'] || '';
  } else {
    document.getElementById('modalTitle').textContent = '添加样衣';
    state.editingId = null;
    document.getElementById('f_dueDate').value = new Date().toISOString().split('T')[0];
  }
  overlay.classList.add('active');
  setTimeout(() => document.getElementById('f_worker').focus(), 300);
}

function closeForm() {
  document.getElementById('modalOverlay').classList.remove('active');
  state.editingId = null;
}

function saveRecord(event) {
  event.preventDefault();
  const id = document.getElementById('editId').value;
  const record = {
    样衣工: document.getElementById('f_worker').value.trim(),
    款号: document.getElementById('f_styleNo').value.trim(),
    样衣类型: document.getElementById('f_type').value,
    打样轮次: parseInt(document.getElementById('f_round').value) || 1,
    尺码: document.getElementById('f_size').value.trim(),
    数量: parseInt(document.getElementById('f_qty').value) || 0,
    要求交期: document.getElementById('f_dueDate').value,
    上手时间: document.getElementById('f_startDate').value,
    落手时间: document.getElementById('f_endDate').value,
    面辅料准备情况: document.getElementById('f_material').value,
    备注: document.getElementById('f_remarks').value.trim()
  };
  if (!record['样衣工'] || !record['款号'] || !record['要求交期']) { showToast('请填写必填字段', 'error'); return; }

  if (id) {
    const idx = state.data.findIndex(r => r.id === id);
    if (idx >= 0) { state.data[idx] = { ...state.data[idx], ...record }; showToast('修改成功', 'success'); }
  } else {
    record.id = Date.now().toString();
    state.data.push(record);
    showToast('添加成功', 'success');
  }
  saveData();
  applyFilters();
  closeForm();
}

function deleteRecord(id) {
  const row = state.data.find(r => r.id === id);
  if (!row) return;
  if (!confirm(`确认删除款号「${row['款号']}」的${row['样衣类型']}记录？`)) return;
  state.data = state.data.filter(r => r.id !== id);
  saveData();
  if (state.selectedId === id) closeImagePanel();
  applyFilters();
  showToast('删除成功', 'success');
}

function suggestRound(styleNo) {
  if (!styleNo) return;
  const existing = state.data.filter(r => r['款号'] === styleNo);
  if (existing.length > 0 && !state.editingId) {
    document.getElementById('f_round').value = Math.max(...existing.map(r => r['打样轮次'] || 1));
  }
}

  if (typeof ExcelJS === 'undefined') {
    const exportData = data.map((r, i) => ({
      '序号': i+1, '样衣工': r['样衣工']||'', '款号': r['款号']||'', '款式图': '',
      '样衣类型': r['样衣类型']||'', '打样轮次': r['打样轮次']||1, '尺码': r['尺码']||'', '数量': r['数量']||0,

  }
  showToast('正在生成Excel，请稍候...', 'info');

  ws.columns = [
    { header: '序号', key: '序号', width: 6 },

function importFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (rows.length === 0) { showToast('文件中没有数据', 'error'); return; }
      if (!confirm(`将导入 ${rows.length} 条记录，追加到现有数据中。确认继续？`)) { event.target.value = ''; return; }
      const newRecords = rows.map(row => ({
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        '样衣工': row['样衣工']||'', '款号': row['款号']||'', '样衣类型': row['样衣类型']||'头样',
        '打样轮次': parseInt(row['打样轮次'])||1, '尺码': row['尺码']||'', '数量': parseInt(row['数量'])||0,
        '要求交期': fmtExcelDate(row['要求交期']), '上手时间': fmtExcelDate(row['上手时间']),
        '落手时间': fmtExcelDate(row['落手时间']), '面辅料准备情况': row['面辅料准备情况']||'已到位', '备注': row['备注']||''
      }));
      state.data = state.data.concat(newRecords);
      saveData();
      applyFilters();
      updateWorkerList();
      showToast(`已导入 ${newRecords.length} 条记录`, 'success');
    } catch(err) { showToast('导入失败：' + err.message, 'error'); }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function restoreData() {

function restoreDataFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result);
      if (!backup.data || !Array.isArray(backup.data.samples)) {
        showToast('文件格式不正确，请使用系统备份的JSON文件', 'error');
        event.target.value = '';
        return;
      }
      const sampleCount = backup.data.samples.length;
      const sizeTableCount = (backup.data.sizeTables && Array.isArray(backup.data.sizeTables)) ? backup.data.sizeTables.length : 0;
      if (!confirm(`将恢复以下数据，当前数据将被覆盖：\n\n  样衣数据：${sampleCount} 条\n  尺寸表数据：${sizeTableCount} 条\n\n确认继续？`)) {
        event.target.value = '';
        return;
      }
      state.data = backup.data.samples;
      state.sizeTables = backup.data.sizeTables || [];
      saveData();
      saveSizeTables();
      applyFilters();
      updateWorkerList();
      renderSizeTables();
      showToast(`恢复成功：样衣数据 ${sampleCount} 条，尺寸表 ${sizeTableCount} 条`, 'success', 5000);
    } catch(err) { showToast('恢复失败：' + err.message, 'error'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ===================== Size Table Import =====================
function importSizeTable(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const jsonData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
      if (jsonData.length === 0) { showToast('Excel文件为空', 'error'); return; }

      // Extract 款号 from template (row 0, col 1) or filename
      let styleNo = '';
      let templateDate = '';
      let templateType = '';
      if (jsonData[0] && jsonData[0][0] === '款号' && jsonData[0][1]) {
        styleNo = String(jsonData[0][1]).trim();
      }
      if (jsonData[1] && jsonData[1][0] === '日期' && jsonData[1][1]) {
        templateDate = fmtExcelDate(jsonData[1][1]);
      }
      if (jsonData[2] && jsonData[2][0] === '类型' && jsonData[2][1]) {
        templateType = String(jsonData[2][1]).trim();
      }

      if (!styleNo) {
        const fileName = file.name.replace(/\.(xlsx|xls|csv)$/i, '');
        const input = prompt('未能从模板中识别款号，请输入此尺寸表对应的款号：', fileName);
        if (!input) { event.target.value = ''; return; }
        styleNo = input.trim();
      }

      const sizeTable = {
        id: Date.now().toString(),
        款号: styleNo,
        日期: templateDate,
        类型: templateType,
        data: jsonData,
        fileName: file.name,
        importDate: new Date().toISOString().split('T')[0],
        rows: jsonData.length,
        cols: jsonData[0] ? jsonData[0].length : 0
      };

      const existingIdx = state.sizeTables.findIndex(st => String(st['款号']) === String(styleNo));
      if (existingIdx >= 0) {
        if (!confirm(`款号「${styleNo}」已存在尺寸表，是否覆盖？`)) { event.target.value = ''; return; }
        state.sizeTables[existingIdx] = sizeTable;
      } else {
        state.sizeTables.push(sizeTable);
      }
      saveSizeTables();
      renderSizeTables();
      showToast(`尺寸表已保存：${styleNo}`, 'success');
    } catch(err) { showToast('导入失败：' + err.message, 'error'); }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

      tableHTML = `<div class="size-table-scroll">

            return `<tr>${row.map(c => `<td>${esc(String(c))}</td>`).join('')}</tr>`;

    return `<div class="size-card glass ${isExpanded ? 'expanded' : ''}" id="size-card-${st.id}">
      <div class="size-card-header">
        <div class="size-card-title">
          <span class="badge badge-blue">${esc(st['款号'])}</span>
        </div>
        <div class="row-actions">
          <button class="size-detail-btn" onclick="toggleSizeTableDetail('${st.id}')">${isExpanded ? '收起' : '详情'} ${detailIcon}</button>
          <button class="row-action-btn edit" onclick="exportSizeTable('${st.id}')" title="导出Excel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="row-action-btn delete" onclick="deleteSizeTable('${st.id}')" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      ${infoHTML}
      ${tableHTML}
    </div>`;
  }).join('');

function toggleSizeTableDetail(id) {
  if (state.expandedSizeTables.has(id)) {
    state.expandedSizeTables.delete(id);
  } else {
    state.expandedSizeTables.add(id);
  }
  renderSizeTables();
}

function handleSizeSearch() {
  state.sizeSearchQuery = document.getElementById('sizeSearchInput').value.trim();
  renderSizeTables();
}

function deleteSizeTable(id) {
  const st = state.sizeTables.find(s => s.id === id);
  if (!st) return;
  if (!confirm(`确认删除款号「${st['款号']}」的尺寸表？`)) return;
  state.sizeTables = state.sizeTables.filter(s => s.id !== id);
  state.expandedSizeTables.delete(id);
  saveSizeTables();
  renderSizeTables();
  showToast('删除成功', 'success');
}

function exportSizeTable(id) {
  const st = state.sizeTables.find(s => s.id === id);
  if (!st) return;
  const ws = XLSX.utils.aoa_to_sheet(st.data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '尺寸表');
  XLSX.writeFile(wb, `尺寸表_${st['款号']}.xlsx`);
  showToast('导出成功', 'success');
}

// ===================== Toast =====================
function showToast(message, type, duration) {
  type = type || 'info';
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = {
    success: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
    error: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };
  toast.innerHTML = (icons[type] || '') + ' ' + esc(message);
  toast.style.maxWidth = '500px';
  toast.style.lineHeight = '1.5';
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(() => toast.remove(), duration || 3000);
}

// ===================== Utilities =====================
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function fmtDate(d) { return d || '<span style="color:var(--muted)">—</span>'; }

function fmtExcelDate(val) {
  if (!val && val !== 0) return '';
  if (val instanceof Date) return val.toISOString().split('T')[0];
  if (typeof val === 'number') {
    const date = new Date((val - 25569) * 86400 * 1000);
    return date.toISOString().split('T')[0];
  }
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.split('T')[0];
  return s;
}

function updateWorkerList() {
  const workers = [...new Set(state.data.map(r => r['样衣工']).filter(Boolean))];
  document.getElementById('workerList').innerHTML = workers.map(w => `<option value="${esc(w)}">`).join('');
}

// ===================== Keyboard & Events =====================
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('active')) closeForm();
    else if (document.getElementById('imagePanel').classList.contains('active')) closeImagePanel();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); openForm(); }
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeForm();
});

document.addEventListener('click', function(e) {
  if (panelJustOpened) { panelJustOpened = false; return; }
  const panel = document.getElementById('imagePanel');
  if (panel.classList.contains('active') && !panel.contains(e.target)) {
    closeImagePanel();
  }
});

// ===================== Login =====================
function doLogout() {
  document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('active'));
  sessionStorage.removeItem('sht_login');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  const overlay = document.getElementById('loginOverlay');
  overlay.style.display = 'flex';
  overlay.classList.remove('hidden');
  document.getElementById('loginUser').focus();
}

function doLogin() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const errEl = document.getElementById('loginError');
  if (user === 'alonzhang' && pass === '2601') {
    sessionStorage.setItem('sht_login', 'ok');
    document.getElementById('loginOverlay').classList.add('hidden');
    setTimeout(() => { document.getElementById('loginOverlay').style.display = 'none'; }, 500);
    if (!window._appInited) { init(); window._appInited = true; }
  } else {
    errEl.classList.add('show');
    document.getElementById('loginPass').value = '';
    setTimeout(() => errEl.classList.remove('show'), 2500);
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.getElementById('loginOverlay').classList.contains('hidden') === false) {
    doLogin();
  }
});

// ===================== Init =====================
function init() {
  loadData();
  state.filteredData = [...state.data];
  state.filteredData.sort((a, b) => String(a['要求交期'] || '').localeCompare(String(b['要求交期'] || '')));
  updateWorkerList();
  renderStats();
  renderTableHead();
  renderTable();
  renderSizeTables();
}

if (sessionStorage.getItem('sht_login') === 'ok') {
  document.getElementById('loginOverlay').style.display = 'none';
  init();
}
</script>
