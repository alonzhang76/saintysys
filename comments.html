  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.cat-tab[data-cat="all"]')?.classList.add('active');
  renderComments();
  switchTab('entry');
  showToast('已加载记录，可编辑后保存', 'info');
}

function deleteRecord(id) {
  if (!confirm('确认删除此记录？')) return;
  records = records.filter(r => r.id !== id);
  safeStorage.setItem('sampleReviewRecords', JSON.stringify(records));
  renderRecords();
  showToast('记录已删除', 'success');
}

function renderRecords() {
  const list = document.getElementById('recordList');
  const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const filtered = searchTerm ? records.filter(r =>
    [r.style, r.order, r.product, r.size, r.factory, r.date, r.type].some(v =>
      (v || '').toLowerCase().includes(searchTerm)
    )
  ) : records;
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><div style="font-size:36px;margin-bottom:8px;">📋</div><p>' + (searchTerm ? '未找到匹配的记录' : '暂无保存的记录') + '</p></div>';
    return;
  }
  list.innerHTML = filtered.map(r => `
    <div class="record-card" onclick="editRecord('${r.id}')">
      <div class="rec-header">

// Round numeric values to 1 decimal place
function roundNum(v) {
  if (v === null || v === undefined || v === '') return v;
  const s = v.toString().trim();
  // Only round if it's a pure number (not text like "A", "B", "1/2 BUST...")
  if (/^-?\d+\.?\d*$/.test(s) && s !== '-' && !isNaN(parseFloat(s))) {
    return parseFloat(s).toFixed(1);
  }
  return v;
}

async function importSizeExcel(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    let rows = [];
    if (file.name.toLowerCase().endsWith('.csv')) {
      const text = await file.text();
      rows = parseCSV(text);
    } else if (file.name.toLowerCase().endsWith('.xlsx')) {
      rows = await parseXLSX(file);
    } else {
      showToast('请使用 .xlsx 或 .csv 格式', 'error');
      return;
    }
    if (rows.length === 0) { showToast('文件中未找到数据', 'error'); return; }
    // Detect format: new format has key-value pairs in first rows (e.g. "款号" | value)
    const firstCell = (rows[0][0] || '').toString().trim();
    const isNewFormat = ['款号','日期','类型','PO号'].includes(firstCell);
    if (isNewFormat) {
      // Extract metadata from key-value rows
      const meta = {};
      let headerRowIdx = -1;
      for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const key = (rows[i][0] || '').toString().trim();
        const val = (rows[i][1] || '').toString().trim();
        if (['款号','日期','类型','PO号'].includes(key)) {
          meta[key] = val;
        } else if (key === '部位编号' || key === '部位' || (rows[i].length >= 4 && rows[i].slice(0,4).some(c => ['部位编号','测量部位','中文名称','公差'].includes((c||'').toString().trim())))) {
          headerRowIdx = i;
          break;
        }
      }
      // If not found, search for header row
      if (headerRowIdx === -1) {
        for (let i = 0; i < rows.length; i++) {
          if ((rows[i][0] || '').toString().trim() === '部位编号') { headerRowIdx = i; break; }
        }
      }
      if (headerRowIdx === -1) { showToast('未找到尺寸表表头（部位编号）', 'error'); return; }
      const header = rows[headerRowIdx];
      const dataRows = rows.slice(headerRowIdx + 1).filter(r => r.some(c => c && c.toString().trim())).map(r => r.map(c => roundNum(c)));
      sizeTableData = { meta, header, dataRows };
    } else {
      // Old format: row[0] is header, row[1+] is data
      sizeTableData = { meta: {}, header: rows[0], dataRows: rows.slice(1).filter(r => r.some(c => c && c.toString().trim())).map(r => r.map(c => roundNum(c))) };
      // Try to extract metadata from old format
      if (rows.length > 1) {
        const header = rows[0];
        const r0 = rows[1];
        const colMap = {};
        header.forEach((h, i) => { colMap[(h||'').toString().trim()] = i; });
        if (colMap['款号'] !== undefined && r0[colMap['款号']]) sizeTableData.meta['款号'] = r0[colMap['款号']].trim();
        if (colMap['日期'] !== undefined && r0[colMap['日期']]) sizeTableData.meta['日期'] = r0[colMap['日期']].trim();
        if (colMap['类型'] !== undefined && r0[colMap['类型']]) sizeTableData.meta['类型'] = r0[colMap['类型']].trim();
        if (colMap['PO号'] !== undefined && r0[colMap['PO号']]) sizeTableData.meta['PO号'] = r0[colMap['PO号']].trim();
      }
    }
    renderSizeTable(sizeTableData);
    // Auto-fill fields from metadata
    const meta = sizeTableData.meta || {};
    if (meta['款号']) document.getElementById('h-style').value = meta['款号'];
    if (meta['PO号']) document.getElementById('h-order').value = meta['PO号'];
    if (meta['日期']) {
      let dateVal = meta['日期'].toString().trim();
      // Check if it's an Excel date serial number (pure number, typically 30000-60000)
      if (/^\d+$/.test(dateVal) && parseInt(dateVal) > 20000 && parseInt(dateVal) < 80000) {
        const serial = parseInt(dateVal);
        // Excel epoch: Dec 30, 1899 (accounting for 1900 leap year bug)
        const dt = new Date(Date.UTC(1899, 11, 30) + serial * 86400000);
        const yyyy = dt.getUTCFullYear();
        const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(dt.getUTCDate()).padStart(2, '0');
        dateVal = `${yyyy}/${parseInt(mm)}/${parseInt(dd)}`;
        meta['日期'] = dateVal;
      }
      // Parse date - handle formats like 2026/8/12 or 2026-08-12
      const dateStr = dateVal.replace(/\//g, '-');
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const yyyy = parts[0].padStart(4, '0');
        const mm = parts[1].padStart(2, '0');
        const dd = parts[2].padStart(2, '0');
        document.getElementById('h-date').value = `${yyyy}-${mm}-${dd}`;
      }
    }
    if (meta['类型']) {
      const typeVal = meta['类型'].trim();
      const sel = document.getElementById('h-type');
      const opt = [...sel.options].find(o => o.value === typeVal);
      if (opt) sel.value = typeVal;
    }
    showToast('尺寸表导入成功', 'success');
  } catch(e) {
    showToast('导入失败: ' + e.message, 'error');
  }
  event.target.value = '';
}

function parseCSV(text) {
  // Remove BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cell += '"'; i++; }
        else inQ = false;
      } else cell += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (ch === '\r') {}
      else cell += ch;
    }
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

async function parseXLSX(file) {
  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  // Find EOCD
  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('无效的XLSX文件');
  const cdCount = view.getUint16(eocd + 10, true);
  const cdOffset = view.getUint32(eocd + 16, true);
  // Parse central directory
  const files = {};
  let off = cdOffset;
  for (let i = 0; i < cdCount; i++) {
    if (view.getUint32(off, true) !== 0x02014b50) break;
    const method = view.getUint16(off + 10, true);
    const compSize = view.getUint32(off + 20, true);
    const nameLen = view.getUint16(off + 28, true);
    const extraLen = view.getUint16(off + 30, true);
    const commentLen = view.getUint16(off + 32, true);
    const localOff = view.getUint32(off + 42, true);
    const name = new TextDecoder().decode(bytes.slice(off + 46, off + 46 + nameLen));
    files[name] = { method, compSize, localOff };
    off += 46 + nameLen + extraLen + commentLen;
  }
  // Extract helper
  async function extract(name) {
    const f = files[name];
    if (!f) return null;
    const localNameLen = view.getUint16(f.localOff + 26, true);
    const localExtraLen = view.getUint16(f.localOff + 28, true);
    const dataOff = f.localOff + 30 + localNameLen + localExtraLen;
    const compressed = bytes.slice(dataOff, dataOff + f.compSize);
    if (f.method === 0) return compressed;
    if (f.method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('浏览器不支持XLSX解析，请使用CSV格式');
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([compressed]).stream().pipeThrough(ds);
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return null;
  }
  // Shared strings
  const sharedStrings = [];
  const ssXml = await extract('xl/sharedStrings.xml');
  if (ssXml) {
    const ssText = new TextDecoder().decode(ssXml);
    const re = /<si>([\s\S]*?)<\/si>/g;
    let m;
    while (m = re.exec(ssText)) {
      const texts = [];
      const tRe = /<t[^>]*>([\s\S]*?)<\/t>/g;
      let tm;
      while (tm = tRe.exec(m[1])) texts.push(tm[1]);
      sharedStrings.push(texts.join(''));
    }
  }
  // Find sheet file via rels
  const relsXml = await extract('xl/_rels/workbook.xml.rels');
  const relsMap = {};
  if (relsXml) {
    const relsText = new TextDecoder().decode(relsXml);
    const relRe = /<Relationship[^>]*Id="([^"]*)"[^>]*Target="([^"]*)"/g;
    let rm;
    while (rm = relRe.exec(relsText)) relsMap[rm[1]] = rm[2];
  }
  const wbXml = await extract('xl/workbook.xml');
  let sheetTarget = 'xl/worksheets/sheet1.xml';
  if (wbXml) {
    const wbText = new TextDecoder().decode(wbXml);
    const sm = wbText.match(/<sheet[^>]*r:id="([^"]*)"/);
    if (sm && relsMap[sm[1]]) {
      const t = relsMap[sm[1]];
      sheetTarget = t.startsWith('/') ? t.slice(1) : `xl/${t}`;
    }
  }
  const sheetXml = await extract(sheetTarget);
  if (!sheetXml) throw new Error('无法读取工作表');
  const sheetText = new TextDecoder().decode(sheetXml);
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  let rowMatch;
  while (rowMatch = rowRe.exec(sheetText)) {
    const cells = [];
    // Match both <c ...>content</c> and self-closing <c .../>
    const cellRe = /<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*?)\/>/g;
    let cm;
    while (cm = cellRe.exec(rowMatch[1])) {
      const attrs = (cm[1] !== undefined ? cm[1] : cm[3] || '');
      const content = cm[2] || '';
      // Extract r attribute (cell reference like "A1")
      const rMatch = attrs.match(/r="([A-Z]+)\d+"/);
      if (!rMatch) continue;
      const col = rMatch[1];
      // Extract t attribute (cell type)
      const tMatch = attrs.match(/t="(\w+)"/);
      const type = tMatch ? tMatch[1] : '';
      // Extract value or inline string
      const vMatch = content.match(/<v>([\s\S]*?)<\/v>/);
      const isMatch = content.match(/<is><t>([\s\S]*?)<\/t><\/is>/);
      let cellVal = '';
      if (isMatch) cellVal = isMatch[1];
      else if (type === 's' && vMatch) cellVal = sharedStrings[parseInt(vMatch[1])] || '';
      else if (type === 'str' && vMatch) cellVal = vMatch[1];
      else if (vMatch) cellVal = vMatch[1];
      cells.push({ col, val: cellVal });
    }
    if (cells.length > 0) {
      const maxIdx = cells.reduce((mx, c) => Math.max(mx, colNameToIdx(c.col)), 0);
      const rowArr = new Array(maxIdx + 1).fill('');
      cells.forEach(c => { rowArr[colNameToIdx(c.col)] = c.val; });
      rows.push(rowArr);
    }
  }
  return rows;
}

function colNameToIdx(name) {
  let idx = 0;
  for (let i = 0; i < name.length; i++) idx = idx * 26 + (name.charCodeAt(i) - 64);
  return idx - 1;
}

function renderSizeTable(data) {
  const container = document.getElementById('sizeTableContainer');
  if (!data) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><div style="font-size:36px;margin-bottom:8px;">📊</div><p>请导入Excel文件以显示尺寸表</p></div>';
    return;
  }
  // Handle both new format ({meta, header, dataRows}) and old format (array of arrays)
  let meta, header, dataRows;
  if (Array.isArray(data)) {
    // Old format: array of arrays
    header = data[0];
    dataRows = data.slice(1);
    meta = {};
  } else {
    meta = data.meta || {};
    header = data.header || [];
    dataRows = data.dataRows || [];
  }
  if (!header || header.length === 0 || dataRows.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);"><div style="font-size:36px;margin-bottom:8px;">📊</div><p>请导入Excel文件以显示尺寸表</p></div>';
    return;
  }
  // Build column index map
  const colMap = {};
  header.forEach((h, i) => { colMap[(h||'').toString().trim()] = i; });
  // Support both "测量部位" and "英文名称" column names
  const enCol = colMap['测量部位'] !== undefined ? colMap['测量部位'] : colMap['英文名称'];
  // Size columns = everything not in known columns
  const known = ['PO号','款号','类型','日期','部位编号','测量部位','英文名称','中文名称','公差'];
  const sizeColIdx = [];
  header.forEach((h, i) => { if (h && !known.includes(h.toString().trim())) sizeColIdx.push(i); });
  // Info bar
  let html = '<div class="size-info-bar">';
  ['款号','日期','类型','PO号'].forEach(name => {
    if (meta[name]) html += `<span><b>${name}：</b>${esc(meta[name])}</span>`;
  });
  if (html === '<div class="size-info-bar">') html += '<span style="color:var(--text-light);">无元数据</span>';
  html += '</div>';
  // Build table
  html += '<div style="overflow-x:auto;"><table class="size-table"><thead><tr>';
  html += '<th>部位编号</th><th style="min-width:120px;">测量部位</th><th>中文名称</th><th>公差</th>';
  sizeColIdx.forEach(i => html += `<th>${esc(header[i])}</th>`);
  html += '</tr></thead><tbody>';
  dataRows.forEach(row => {
    html += '<tr>';
    html += `<td>${esc(row[colMap['部位编号']]||'')}</td>`;
    html += `<td style="text-align:left;white-space:normal;">${esc(row[enCol]||'')}</td>`;
    html += `<td style="text-align:left;">${esc(row[colMap['中文名称']]||'')}</td>`;
    html += `<td>${esc(row[colMap['公差']]||'')}</td>`;
    sizeColIdx.forEach(i => html += `<td>${esc(row[i]||'')}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

      html += `<div style="border-left:3px solid #c9a84c;border-top:1px solid #e8eef5;border-bottom:1px solid #e8eef5;background:linear-gradient(135deg,#fafbfd,#f5f7fb);border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:10px;page-break-inside:avoid;">
        <div style="font-size:12pt;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
          <span style="color:#1a3a6b;"><b>${i+1}.</b>${isSimple ? '' : ` ${getLocLabel(cat)}：<b>${escBR(c.location)||'—'}</b>`}</span>
          <span style="font-size:11pt;background:${sevColor};color:#fff;padding:2px 12px;border-radius:12px;font-weight:600;">严重程度：${sevText}</span>
        </div>`;
      if (!isSimple && c.description && c.description.trim()) {
        html += `<div style="font-size:12pt;margin-bottom:6px;line-height:1.6;white-space:pre-wrap;"><b style="color:#1a3a6b;">问题描述：</b>${escBR(c.description)}</div>`;
      }
      if (c.suggestion && c.suggestion.trim()) {
        html += `<div style="font-size:12pt;margin-bottom:6px;line-height:1.6;white-space:pre-wrap;"><b style="color:#1a3a6b;">${isSimple ? '说明' : '意见'}：</b>${escBR(c.suggestion)}</div>`;
      }
      if (c.images.length > 0) {
        html += '<div style="margin-top:6px;">';
        c.images.forEach(img => {
          const psize = imgPrintSize(img);
          const widths = {full:'100%',half:'50%',third:'33%',quarter:'25%'};
          const w = widths[psize] || '100%';
          const align = psize === 'full' ? 'center' : 'left';
          html += `<img src="${imgSrc(img)}" class="print-comment-img" style="width:${w};height:auto;border:1px solid #c9a84c;border-radius:4px;margin-bottom:6px;display:block;${psize!=='full'?'margin-right:auto;':''}">`;
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += `</div>`;
  });
  if (!hasComments) html += '<div style="text-align:center;padding:20px;color:#64748b;">暂无修改意见</div>';
  // Size chart (if imported, page break before)
  if (sizeTableData) {
    let stMeta, stHeader, stDataRows;
    if (Array.isArray(sizeTableData)) {
      stHeader = sizeTableData[0];
      stDataRows = sizeTableData.slice(1);
      stMeta = {};
    } else {
      stMeta = sizeTableData.meta || {};
      stHeader = sizeTableData.header || [];
      stDataRows = sizeTableData.dataRows || [];
    }
    if (stHeader && stHeader.length > 0 && stDataRows.length > 0) {
    const colMap = {};
    stHeader.forEach((h, i) => { colMap[(h||'').toString().trim()] = i; });
    const enCol = colMap['测量部位'] !== undefined ? colMap['测量部位'] : colMap['英文名称'];
    const known = ['PO号','款号','类型','日期','部位编号','测量部位','英文名称','中文名称','公差'];
    const sizeColIdx = [];
    stHeader.forEach((h, i) => { if (h && !known.includes(h.toString().trim())) sizeColIdx.push(i); });
    html += '<div class="page-break"></div>';
    html += `<div class="print-section-header"><div class="sh-bar"></div><div class="sh-title">尺寸表</div><div class="sh-line"></div></div>`;
    // Info bar with gold accent
    html += '<table style="width:100%;border-collapse:collapse;margin-bottom:4mm;font-size:10pt;border-left:3px solid #c9a84c;background:#fdf8ed;"><tr>';
    ['款号','日期','类型','PO号'].forEach(name => {
      if (stMeta[name]) html += `<td style="padding:4px 10px;"><b style="color:#1a3a6b;">${name}：</b>${esc(stMeta[name])}</td>`;
    });
    html += '</tr></table>';
    // Size table with navy header and gold borders
    html += '<table style="width:100%;border-collapse:collapse;font-size:9px;">';
    html += '<thead><tr style="background:#1a3a6b;color:#fff;">';
    html += '<th style="border:1px solid #1a3a6b;padding:3px 3px;text-align:center;">部位编号</th>';
    html += '<th style="border:1px solid #1a3a6b;padding:3px 3px;min-width:100px;text-align:center;">测量部位</th>';
    html += '<th style="border:1px solid #1a3a6b;padding:3px 3px;text-align:center;">中文名称</th>';
    html += '<th style="border:1px solid #1a3a6b;padding:3px 3px;text-align:center;">公差</th>';
    sizeColIdx.forEach(i => html += `<th style="border:1px solid #1a3a6b;padding:3px 3px;text-align:center;">${esc(stHeader[i])}</th>`);
    html += '</tr></thead><tbody>';
    stDataRows.forEach((row, ri) => {
      const rowBg = ri % 2 === 1 ? '#fff' : '#f5f7fb';
      html += `<tr style="background:${rowBg};">`;
      html += `<td style="border:1px solid #c9a84c;padding:2px 3px;text-align:center;">${esc(row[colMap['部位编号']]||'')}</td>`;
      html += `<td style="border:1px solid #c9a84c;padding:2px 3px;text-align:left;">${esc(row[enCol]||'')}</td>`;
      html += `<td style="border:1px solid #c9a84c;padding:2px 3px;text-align:left;">${esc(row[colMap['中文名称']]||'')}</td>`;
      html += `<td style="border:1px solid #c9a84c;padding:2px 3px;text-align:center;">${esc(row[colMap['公差']]||'')}</td>`;
      sizeColIdx.forEach(i => html += `<td style="border:1px solid #c9a84c;padding:2px 3px;text-align:center;">${esc(row[i]||'')}</td>`);
      html += '</tr>';
    });
    html += '</tbody></table>';
    }
  }
  const printArea = document.getElementById('printArea');
  // Add dynamic @page rule with footer (no size property to avoid PDF rotation)
  const today = new Date();
  const printDate = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let dynStyle = document.getElementById('dynamicPrintStyle');
  if (!dynStyle) { dynStyle = document.createElement('style'); dynStyle.id = 'dynamicPrintStyle'; document.head.appendChild(dynStyle); }
  dynStyle.textContent = `@page{margin:15mm 15mm 18mm 15mm;@bottom-left{content:"打印日期：${printDate}";font-size:9pt;color:#1a3a6b;}@bottom-center{content:"第 " counter(page) " 页 / 共 " counter(pages) " 页";font-size:9pt;color:#1a3a6b;}@bottom-right{content:"联系人：陈娟";font-size:9pt;color:#c9a84c;font-weight:600;}}`;
  printArea.innerHTML = html;
  printArea.style.display = 'block';
  // Hide toast and other UI elements before printing
  const toastEl = document.getElementById('toast');
  if (toastEl) toastEl.classList.remove('show');
  // Use onafterprint to cleanup
  const cleanup = () => {
    dynStyle.remove();
    document.title = origTitle;
    printArea.style.display = 'none';
    printArea.innerHTML = '';
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.print();
  // Fallback cleanup in case afterprint doesn't fire
  setTimeout(cleanup, 1000);
}

function formatDate(d) {
  try {
    const dt = new Date(d);
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  } catch { return d; }
}

// ==================== Toast ====================
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = type || 'info';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ==================== Init ====================
const savedRecords = safeStorage.getItem('sampleReviewRecords');
if (savedRecords) { try { records = JSON.parse(savedRecords); } catch(e) { records = []; } }
document.getElementById('h-date').value = new Date().toISOString().split('T')[0];
addMatRow();
renderComments();
</script>
</body>
</html>
