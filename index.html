<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 舜天汉唐服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260812">
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-area">
    <div class="app-header">
      <button class="header-toggle">☰</button>
      <span class="header-title">首页仪表盘</span>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="App.backupData()">📦</button>
        <div class="header-user">
          <span>👤</span>
          <span class="user-name">管理员</span>
        </div>
        <button class="btn btn-sm" onclick="App.logout()">🚪</button>
      </div>
    </div>
    <div class="app-content">
      <!-- 统计卡片 -->
      <div class="stat-grid" id="statCards"></div>

      <!-- 进行中的订单 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">进行中的订单</span>
          <a href="order.html" class="btn btn-sm">查看全部 →</a>
        </div>
        <div id="recentOrders"></div>
      </div>

      <!-- 待处理客户意见 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">待处理客户意见</span>
          <a href="feedback.html" class="btn btn-sm">查看全部 →</a>
        </div>
        <div id="pendingFeedback"></div>
      </div>

      <!-- 款号状态分布 -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">款号状态分布</span>
        </div>
        <div id="styleStatus"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/common.js?v=20260812"></script>
<!-- Supabase 云端同步 + 独立轮询 -->
<script src="js/localstorage-patch.js?v=20260822g"></script>
<script src="js/supabase-store.js?v=20260822g"></script>
<script src="js/init-page.js?v=20260822g"></script>
<!-- Supabase 登录守卫（经典脚本，同步覆盖 App.checkLogin 等方法 + 异步 getUser 校验）-->
<script src="js/auth-guard.js?v=20260813"></script>
<!-- 管理员邮箱配置（仅控制界面显示，真正权限由 Supabase RLS 保证）-->
<script type="module" src="js/admin-config.js?v=20260813"></script>
<!-- 统一表单提交 + 文件上传 helper（提供 window.SupabaseSubmit，并自动绑定 data-supabase-form）-->
<script type="module" src="js/form-submit.js?v=20260813"></script>
<!-- 退出登录（兼容 #logout-button/#logout-btn/#logout；现有 onclick="App.logout()" 由 auth-guard 接管）-->
<script type="module" src="js/logout.js?v=20260813"></script>
<script>
// ===== 云端同步：提前注册监听器 =====
var PageDataSyncGuard = {
  inited: false, pending: false,
  watchKeys: ["styles","orders","fabrics","samples","feedbacks","productions","collections","customers","contacts","invoices","payments"],
  emptyCheckKeys: ["styles","orders","fabrics","samples","feedbacks","productions","collections"],
  afterInit: function() {
    var self = this; this.inited = true;
    function doRefresh() {
      try {
        if (typeof window.renderStats === 'function') window.renderStats();
        if (typeof window.renderRecent === 'function') window.renderRecent();
        if (typeof window.renderProblems === 'function') window.renderProblems();
      } catch(e) {}
    }
    if (self.pending) setTimeout(doRefresh, 200);
    setTimeout(function() {
      var allEmpty = self.emptyCheckKeys.every(function(k){
        try{ var a=App.store.get(k,[]); return !a||a.length===0; }catch(e){return true;}
      });
      if (allEmpty) doRefresh();
    }, 2000);
  }
};
window.addEventListener('cloud-data-updated', function(e){
  var keys = (e.detail&&e.detail.keys)||[];
  var need = keys.some(function(k){ return PageDataSyncGuard.watchKeys.indexOf(k)>=0; });
  if (need) {
    if (!PageDataSyncGuard.inited) { PageDataSyncGuard.pending=true; return; }
    try {
      if (typeof window.renderStats === 'function') window.renderStats();
      if (typeof window.renderRecent === 'function') window.renderRecent();
      if (typeof window.renderProblems === 'function') window.renderProblems();
    } catch(e){}
  }
});

App.init('index');
App.checkLogin();
App.initSampleData();
App.enforcePagePermission('index');
  setTimeout(function() { if (window.PageDataSyncGuard) window.PageDataSyncGuard.afterInit(); }, 0);

const styles = App.store.get('styles', []);
const orders = App.store.get('orders', []);
const fabrics = App.store.get('fabrics', []);
const samples = App.store.get('samples', []);
const feedbacks = App.store.get('feedbacks', []);
const productions = App.store.get('productions', []);
const collections = App.store.get('collections', []);

// 渲染统计卡片
function renderStats() {
  const totalRevenue = collections.filter(c => c.status === '已收汇').reduce((s, c) => s + (c.amount || 0), 0);
  const inProduction = productions.filter(p => p.status === '生产中').length;
  const pendingFeedback = feedbacks.filter(f => !f.resolved).length;
  
  const cards = [
    { icon: '👗', bg: '#e8f1f5', color: '#004D6D', label: '款号总数', value: styles.length, sub: '本季在产款式' },
    { icon: '📋', bg: '#ecfdf5', color: '#2d9d5f', label: '订单总数', value: orders.length, sub: `${orders.filter(o => o.status === '生产中').length} 个生产中` },
    { icon: '🏭', bg: '#fff8ed', color: '#d9883a', label: '在产工单', value: inProduction, sub: '服装厂+水洗厂' },
    { icon: '💬', bg: '#fef2f2', color: '#d44848', label: '待处理意见', value: pendingFeedback, sub: '客户未确认意见' },
    { icon: '💰', bg: '#f5f3ff', color: '#6d28d9', label: '已收汇(USD)', value: App.utils.formatMoney(totalRevenue), sub: '本季收汇总计' },
    { icon: '✂️', bg: '#ecfdfa', color: '#0d9488', label: '样衣总数', value: samples.length, sub: `${samples.filter(s => s.status === '需修改').length} 个待修改` },
  ];

  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${c.bg};color:${c.color};">${c.icon}</div>
      <div class="stat-info">
        <div class="stat-label">${c.label}</div>
        <div class="stat-value" style="color:${c.color};">${c.value}</div>
        <div class="stat-sub">${c.sub}</div>
      </div>
    </div>
  `).join('');
}

// 渲染近期订单
function renderRecentOrders() {
  const recent = orders.slice(0, 5);
  App.renderTable('recentOrders', {
    columns: [
      { key: 'orderNo', title: '订单号', width: '140px' },
      { key: 'styleNo', title: '款号' },
      { key: 'customerId', title: '客户', render: (v) => {
        const c = App.store.get('customers', []).find(c => c.id === v);
        return c ? c.name : v;
      }},
      { key: 'quantity', title: '数量', width: '80px' },
      { key: 'totalAmount', title: '总金额', width: '120px', render: (v, row) => `${row.currency} ${App.utils.formatMoney(v)}` },
      { key: 'deliveryDate', title: '交期', width: '110px' },
      { key: 'status', title: '状态', width: '90px', render: (v) => App.statusTag(v) },
    ],
    data: recent
  });
}

// 渲染待处理意见
function renderPendingFeedback() {
  const pending = feedbacks.filter(f => !f.resolved);
  if (pending.length === 0) {
    document.getElementById('pendingFeedback').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        <div class="empty-text">暂无待处理意见</div>
      </div>`;
    return;
  }
  App.renderTable('pendingFeedback', {
    columns: [
      { key: 'styleNo', title: '款号', width: '160px' },
      { key: 'feedbackType', title: '类型', width: '80px', render: (v) => `<span class="tag tag-blue">${v}</span>` },
      { key: 'content', title: '意见内容' },
      { key: 'priority', title: '优先级', width: '80px', render: (v) => App.statusTag(v) },
      { key: 'feedbackDate', title: '日期', width: '110px' },
    ],
    data: pending
  });
}

// 渲染款号状态分布
function renderStyleStatus() {
  const statusCount = {};
  styles.forEach(s => {
    statusCount[s.status] = (statusCount[s.status] || 0) + 1;
  });
  
  const total = styles.length || 1;
  const statusOrder = ['草稿', '打样中', '待确认', '生产中', '已完成'];
  
  let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
  statusOrder.forEach(status => {
    const count = statusCount[status] || 0;
    const pct = Math.round(count / total * 100);
    const colorMap = { '草稿': '', '打样中': '', '待确认': 'warning', '生产中': '', '已完成': 'success' };
    html += `
      <div>
        <div class="flex-between mb-8">
          <span>${App.statusTag(status)} ${status}</span>
          <span class="text-muted font-sm">${count} 款 (${pct}%)</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill ${colorMap[status] || ''}" style="width:${pct}%"></div>
        </div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('styleStatus').innerHTML = html;
}

renderStats();
renderRecentOrders();
renderPendingFeedback();
renderStyleStatus();
</script>
</body>
</html>
