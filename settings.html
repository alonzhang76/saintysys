<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设置 - 舜天汉唐服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260812">
<style>
.settings-tabs { display:flex;border-bottom:2px solid var(--border);margin-bottom:16px; }
.settings-tab { padding:10px 20px;cursor:pointer;font-size:14px;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px; }
.settings-tab.active { color:var(--primary);border-bottom-color:var(--primary);font-weight:600; }
.perm-matrix { width:100%;border-collapse:collapse;font-size:12px; }
.perm-matrix th, .perm-matrix td { border:1px solid var(--border-light);padding:6px 8px;text-align:center; }
.perm-matrix th { background:#f3f4f6;font-weight:600; }
.perm-matrix td:first-child, .perm-matrix th:first-child { text-align:left; }
.perm-check { cursor:pointer;width:16px;height:16px; }
.perm-check:disabled { cursor:not-allowed;opacity:0.4; }
.avatar { display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:600;margin-right:8px; }
.perm-btn { cursor:pointer;border:none;background:none;font-size:16px;padding:2px 6px; }
.perm-btn-w { color:#2563eb; }
.perm-btn-r { color:#6b7280; }
.perm-btn-n { color:#d1d5db; }
.user-status-active { color:#059669;font-weight:600; }
.user-status-disabled { color:#9ca3af; }
</style>
</head>
<body>
<div class="app-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-area">
    <div class="app-header">
      <button class="header-toggle">☰</button>
      <span class="header-title">设置</span>
      <div class="header-actions">
        <button class="btn btn-sm" onclick="App.backupData()">📦</button>
        <div class="header-user"><span>👤</span><span class="user-name" id="userName">管理员</span></div>
        <button class="btn btn-sm" onclick="App.logout()">🚪</button>
      </div>
    </div>
    <div class="app-content">
      <div class="settings-tabs">
        <div class="settings-tab active" onclick="switchTab('users')">👥 用户</div>
        <div class="settings-tab" onclick="switchTab('roles')">🛡️ 用户组</div>
        <div class="settings-tab" onclick="switchTab('advanced')">⚙️ 高级设置</div>
        <div class="settings-tab" onclick="switchTab('nas')">☁️ 云盘 NAS</div>
      </div>

      <div id="tab-users"></div>
      <div id="tab-roles" style="display:none;"></div>
      <div id="tab-advanced" style="display:none;"></div>
      <div id="tab-nas" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="js/common.js?v=20260822f"></script>
<!-- Supabase 登录守卫 -->
<script src="js/auth-guard.js?v=20260822c"></script>
<!-- Supabase 存储层：localStorage → Supabase -->
<script type="module" src="js/supabase.js?v=20260822ff"></script>
<script src="js/supabase-store.js?v=20260822j"></script>
<script src="js/localstorage-patch.js?v=20260822h"></script>
<script src="js/supabase-bridge.js?v=20260822f"></script>
<script type="module" src="js/admin-config.js?v=20260813"></script>
<script type="module" src="js/form-submit.js?v=20260813"></script>
<script type="module" src="js/logout.js?v=20260813"></script>
<script src="js/init-page.js?v=20260822b"></script>
<script>
// ===== 提前注册：云端数据变更监听器 =====
var _SettingsInited = false;
var _SettingsPendingRefresh = false;
window.addEventListener('cloud-data-updated', function(e) {
  var keys = e.detail.keys || [];
  var needRefresh = keys.some(function(k) {
    return k === 'users' || k === 'permissions' || k === 'nas_config' || k === 'nas_folder_perms';
  });
  if (needRefresh) {
    if (!_SettingsInited) {
      console.log('[settings.html] PENDING 云端数据已缓存，_init完成后 reload:', keys.join(','));
      _SettingsPendingRefresh = true;
      return;
    }
    console.log('[settings.html] 云端数据变更 -> reload:', keys.join(','));
    try {
      if (typeof window.renderUsers === 'function') renderUsers();
      if (typeof window.renderRoles === 'function') renderRoles();
      if (typeof window.renderAdvanced === 'function') renderAdvanced();
      if (typeof window.renderNas === 'function') renderNas();
    } catch(e) {}
  }
});

// ===== 设置模块（函数定义在全局作用域） =====

// 全局变量（跨函数共享）
let currentUser = null;
let canAccessSettings = false;

// 关键修复：监听 auth-guard 异步角色加载完成事件，立即刷新页面权限状态
window.addEventListener('auth-role-updated', function(e) {
  console.log('[settings.html] 收到 auth-role-updated 事件:', e.detail);
  if (currentUser) {
    currentUser = App.getCurrentUser();
    // 重新计算权限
    if (renderUsers) renderUsers();
    if (renderRoles) renderRoles();
    if (renderAdvanced) renderAdvanced();
    if (renderNas) renderNas();
  }
});

// 辅助函数：检查当前用户是否为管理员（角色管理员或管理员邮箱）
function isAdminUser() {
  if (!currentUser) return false;
  // 角色是管理员
  if (App.roles[currentUser.role]?.isAdmin) return true;
  // 邮箱在管理员列表中
  const adminEmails = window.ADMIN_EMAILS || [];
  if (adminEmails.indexOf(currentUser.email) >= 0) return true;
  // 关键修复：也检查 App.getPermission('settings') 是否为 write（与 canAccessSettings 保持一致）
  // 防止权限矩阵数据中 settings 模块配置为 write 但 isAdminUser 仍返回 false
  if (App.getPermission && App.getPermission('settings') === 'write') return true;
  return false;
}

// ===== 标签页切换 =====
let currentTab = 'users';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.settings-tab').forEach(el => el.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  else { var t = document.querySelector('.settings-tab[onclick*="switchTab(\''+tab+'\'')]; if (t) t.classList.add('active'); }
  document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
  document.getElementById('tab-roles').style.display = tab === 'roles' ? 'block' : 'none';
  document.getElementById('tab-advanced').style.display = tab === 'advanced' ? 'block' : 'none';
  document.getElementById('tab-nas').style.display = tab === 'nas' ? 'block' : 'none';
  if (tab === 'users') renderUsers();
  if (tab === 'roles') renderRoles();
  if (tab === 'advanced') renderAdvanced();
  if (tab === 'nas') renderNas();
}

// ===== 用户管理 =====
function getUsers() {
  return App.store.get('users', []);
}

function saveUsers(users) {
  // 双写：localStorage + 云端（防止 refreshFromCloud 覆盖本地新值）
  App.store.set('users', users);
  if (window.SupabaseStore && typeof window.SupabaseStore.setSync === 'function') {
    window.SupabaseStore.setSync('users', users);
  }
}

function renderUsers() {
  const users = getUsers();
  const isAdmin = isAdminUser(); // 修复：同时检查角色和管理员邮箱
  const canEdit = isAdmin; // 只有管理员能增删改用户

  let html = `
    <div class="table-toolbar">
      <div class="table-toolbar-left">
        <span class="card-title">用户列表（共 ${users.length} 人）</span>
      </div>
      <div class="table-toolbar-right">
        ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="openUserModal()" title="新增用户">➕ 新增</button>` : ''}
      </div>
    </div>
    <table class="data-table">
      <thead><tr>
        <th style="width:40px;"></th>
        <th>用户名</th>
        <th>邮箱</th>
        <th>描述</th>
        <th>角色</th>
        <th>状态</th>
        <th style="width:100px;">操作</th>
      </tr></thead>
      <tbody>
  `;

  users.forEach(u => {
    const isSelf = u.id === currentUser?.id;
    const roleName = App.roles[u.role]?.name || u.role;
    const statusTag = u.status === 'active'
      ? '<span class="user-status-active">● 正常</span>'
      : '<span class="user-status-disabled">● 已禁用</span>';
    html += `
      <tr>
        <td><span class="avatar">${(u.username || '?')[0].toUpperCase()}</span></td>
        <td><strong>${App.utils.escapeHtml(u.username)}</strong>${isSelf ? ' <span class="tag tag-blue" style="font-size:10px;">我</span>' : ''}</td>
        <td style="font-size:12px;color:var(--text-muted);">${App.utils.escapeHtml(u.email || '-')}</td>
        <td>${App.utils.escapeHtml(u.description || '-')}</td>
        <td>${App.utils.escapeHtml(roleName)}</td>
        <td>${statusTag}</td>
        <td style="white-space:nowrap;">
          ${canEdit ? `
            <button class="btn btn-text btn-sm" onclick="openUserModal('${u.id}')" title="编辑">✏️</button>
            ${!isSelf ? `<button class="btn btn-text btn-sm" onclick="toggleUserStatus('${u.id}')" title="${u.status === 'active' ? '禁用' : '启用'}">${u.status === 'active' ? '🚫' : '✅'}</button>` : ''}
            ${!isSelf ? `<button class="btn btn-text btn-sm" onclick="deleteUser('${u.id}')" title="删除">🗑️</button>` : ''}
          ` : '<span class="text-muted">-</span>'}
        </td>
      </tr>
    `;
  });

  html += '</tbody></table>';
  document.getElementById('tab-users').innerHTML = html;
}

function openUserModal(id) {
  const isAdmin = isAdminUser(); // 修复：同时检查角色和管理员邮箱
  if (!isAdmin) { App.toast('无权限', 'error'); return; }

  const users = getUsers();
  const user = id ? users.find(u => u.id === id) : {};
  const isEdit = !!id;
  const isSelf = isEdit && user.id === currentUser?.id;

  const roleOptions = Object.keys(App.roles).map(key => {
    const r = App.roles[key];
    const selected = (user.role || 'user') === key ? 'selected' : '';
    return `<option value="${key}" ${selected}>${r.name}</option>`;
  }).join('');

  const body = `
    <div class="form-group">
      <label class="form-label">用户名<span class="required">*</span></label>
      <input type="text" class="form-input" id="m_username" value="${App.utils.escapeHtml(user.username || '')}" placeholder="显示名称（登录用邮箱）">
    </div>
    <div class="form-group">
      <label class="form-label">邮箱<span class="required">*</span></label>
      <input type="email" class="form-input" id="m_email" value="${App.utils.escapeHtml(user.email || '')}" placeholder="必须与Supabase登录邮箱完全一致">
    </div>
    <div class="form-group">
      <label class="form-label">密码${isEdit ? '（留空不修改）' : '<span class="required">*</span>'}</label>
      <input type="password" class="form-input" id="m_password" placeholder="请输入密码">
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <input type="text" class="form-input" id="m_description" value="${App.utils.escapeHtml(user.description || '')}" placeholder="如：张三-业务跟单">
    </div>
    <div class="form-group">
      <label class="form-label">角色</label>
      <select class="form-select" id="m_role" ${isSelf ? 'disabled' : ''}>
        ${roleOptions}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">状态</label>
      <select class="form-select" id="m_status" ${isSelf ? 'disabled' : ''}>
        <option value="active" ${user.status !== 'disabled' ? 'selected' : ''}>正常</option>
        <option value="disabled" ${user.status === 'disabled' ? 'selected' : ''}>已禁用</option>
      </select>
    </div>
  `;

  const footer = `
    <button class="btn" onclick="App.modal.close()">✖️</button>
    <button class="btn btn-primary" onclick="saveUser('${id || ''}')">💾</button>
  `;

  App.modal.open({
    title: isEdit ? '编辑用户' : '新增用户',
    body, footer, size: 'sm', closeOnOverlay: false
  });
}

function saveUser(id) {
  const username = document.getElementById('m_username').value.trim();
  const email = (document.getElementById('m_email')?.value || '').trim();
  const password = document.getElementById('m_password').value;
  const description = document.getElementById('m_description').value.trim();
  const role = document.getElementById('m_role').value;
  const status = document.getElementById('m_status').value;

  if (!username) { App.toast('请输入用户名', 'warning'); return; }
  if (!email) { App.toast('请输入邮箱（必须与Supabase登录邮箱一致）', 'warning'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { App.toast('邮箱格式不正确', 'warning'); return; }

  const users = getUsers();
  const isEdit = !!id;

  if (isEdit) {
    const idx = users.findIndex(u => u.id === id);
    if (idx === -1) return;
    users[idx].email = email;
    users[idx].description = description;
    users[idx].role = role;
    users[idx].status = status;
    if (password) users[idx].password = password;
    App.toast('用户已更新', 'success');
  } else {
    if (!password) { App.toast('请输入密码', 'warning'); return; }
    // 检查用户名是否重复
    if (users.some(u => u.username === username)) {
      App.toast('用户名已存在', 'warning');
      return;
    }
    users.push({
      id: 'U-' + String(users.length + 1).padStart(4, '0'),
      username, email, password, description, role, status,
      createDate: new Date().toISOString().slice(0, 10)
    });
    App.toast('用户已添加', 'success');
  }

  saveUsers(users);
  App.modal.close();
  renderUsers();
}

function toggleUserStatus(id) {
  const isAdmin = isAdminUser(); // 修复：同时检查角色和管理员邮箱
  if (!isAdmin) return;
  if (id === currentUser?.id) { App.toast('不能禁用自己', 'warning'); return; }
  const users = getUsers();
  const idx = users.findIndex(u => u.id === id);
  if (idx === -1) return;
  users[idx].status = users[idx].status === 'active' ? 'disabled' : 'active';
  saveUsers(users);
  renderUsers();
}

function deleteUser(id) {
  const isAdmin = isAdminUser(); // 修复：同时检查角色和管理员邮箱
  if (!isAdmin) return;
  if (id === currentUser?.id) { App.toast('不能删除自己', 'warning'); return; }
  App.confirm('确定要删除该用户吗？', () => {
    const users = getUsers().filter(u => u.id !== id);
    saveUsers(users);
    App.toast('用户已删除', 'success');
    renderUsers();
  });
}

// ===== 用户组/权限管理 =====
// 使用"待保存缓存 + 保存按钮"模式：修改时不落盘，点击保存才双写本地+云端
let _pendingPerms = null;       // 当前编辑中的权限对象
let _baselinePerms = null;      // 保存按钮点击后/页面刚加载时的基线，用于对比是否有未保存变更

function _deepClonePerms(p) {
  try { return JSON.parse(JSON.stringify(p || {})); } catch(e) { return {}; }
}
function _permsEqual(a, b) {
  try { return JSON.stringify(a||{}) === JSON.stringify(b||{}); } catch(e) { return false; }
}
function _hasPermChanges() {
  return !_permsEqual(_pendingPerms, _baselinePerms);
}

function renderRoles() {
  const isAdmin = isAdminUser();
  const canEdit = isAdmin;

  const roles = App.roles;
  const modules = App.modulePermissions;
  let stored = App.store.get('permissions', {});

  // 兼容迁移：旧的 feedback 模块权限 → consumption（用料及纸板），防止用户之前保存的权限丢失
  if (stored && stored.feedback && !stored.consumption) {
    stored.consumption = JSON.parse(JSON.stringify(stored.feedback));
    try {
      App.store.set('permissions', stored);
      if (window.SupabaseStore && typeof window.SupabaseStore.setSync === 'function') {
        window.SupabaseStore.setSync('permissions', stored);
      }
    } catch(_) {}
  }

  // 初始化待保存缓存（首次进入页面或刚执行完重置后触发）
  if (!_pendingPerms || !_baselinePerms) {
    _pendingPerms = _deepClonePerms(stored);
    _baselinePerms = _deepClonePerms(stored);
  }
  const perms = _pendingPerms;

  // 构建权限矩阵
  let matrixHtml = '<table class="perm-matrix"><thead><tr><th>模块</th>';
  Object.values(roles).forEach(r => {
    if (!r.isAdmin) matrixHtml += `<th>${r.name}</th>`;
  });
  matrixHtml += '</tr></thead><tbody>';

  Object.keys(modules).forEach(modKey => {
    matrixHtml += `<tr><td style="font-weight:600;">${modules[modKey]}</td>`;
    Object.keys(roles).forEach(roleKey => {
      const roleDef = roles[roleKey];
      if (roleDef.isAdmin) return;
      const modPerm = perms[modKey] || {};
      const perm = modPerm[roleKey] || 'read';
      const disabled = !canEdit ? 'disabled' : '';

      if (!canEdit) {
        const display = perm === 'write' ? '✏️ 读写' : (perm === 'hidden' ? '🚫 不显示' : (perm === 'none' ? '⛔ 无' : '👁️ 只读'));
        matrixHtml += `<td>${display}</td>`;
      } else {
        matrixHtml += `<td>
          <select onchange="setPendingPerm('${modKey}','${roleKey}',this.value)" ${disabled} style="width:80px;font-size:11px;padding:2px;">
            <option value="write" ${perm === 'write' ? 'selected' : ''}>读写</option>
            <option value="read" ${perm === 'read' ? 'selected' : ''}>只读</option>
            <option value="none" ${perm === 'none' ? 'selected' : ''}>无</option>
            <option value="hidden" ${perm === 'hidden' ? 'selected' : ''}>不显示</option>
          </select>
        </td>`;
      }
    });
    matrixHtml += '</tr>';
  });

  matrixHtml += '</tbody></table>';

  const changed = _hasPermChanges();
  const saveBtnCls = changed ? 'btn-sm btn-primary' : 'btn-sm';
  const saveBadge = changed ? ' <span style="color:#fff;background:#d97706;border-radius:3px;padding:0 5px;font-size:10px;">未保存</span>' : '';
  const cancelDisabled = changed ? '' : 'disabled';

  const helpText = canEdit
    ? '<div class="text-muted" style="margin-top:8px;font-size:12px;">💡 提示：系统管理员始终拥有所有模块的读写权限，不受下表限制。<br>权限说明：读写=可查看可编辑｜只读=可查看不可编辑｜无=不可访问（侧边栏可见但点击显示无权限）｜不显示=侧边栏不显示该模块<br><b style="color:#c2410c;">修改后请点击上方「💾 保存权限」按钮</b>，才会写入 localStorage 和 Supabase。相关用户需重新登录后新权限生效。</div>'
    : '<div class="text-muted" style="margin-top:8px;font-size:12px;">💡 您是只读模式，如需修改权限请联系管理员。</div>';

  document.getElementById('tab-roles').innerHTML = `
    <div class="table-toolbar">
      <div class="table-toolbar-left">
        <span class="card-title">模块权限矩阵</span>${saveBadge}
      </div>
      <div class="table-toolbar-right">
        ${canEdit ? `
          <button class="btn btn-sm" onclick="batchSetPendingPerms('write')" title="全部设为读写">全设读写</button>
          <button class="btn btn-sm" onclick="batchSetPendingPerms('read')" title="全部设为只读">全设只读</button>
          <button class="btn btn-sm btn-danger" onclick="resetPerms()" title="恢复默认">↻ 恢复默认</button>
          <button class="btn btn-sm" onclick="cancelPendingPerms()" ${cancelDisabled} title="放弃当前未保存的修改">↩ 取消修改</button>
          <button class="btn ${saveBtnCls}" onclick="savePendingPerms()" title="将修改写入 localStorage 并同步到 Supabase">💾 保存权限</button>
        ` : ''}
      </div>
    </div>
    <div style="overflow-x:auto;">${matrixHtml}</div>
    ${helpText}
  `;
}

// 仅修改 pending 缓存，不落盘
function setPendingPerm(modKey, roleKey, value) {
  if (!_pendingPerms) _pendingPerms = {};
  if (!_pendingPerms[modKey]) _pendingPerms[modKey] = {};
  _pendingPerms[modKey][roleKey] = value;
  // 重新渲染工具栏（更新保存按钮状态 / 未保存标签），不重建 select 也无焦点问题，但为了简单直接重渲染整个矩阵
  renderRoles();
}

// 批量修改 pending
function batchSetPendingPerms(value) {
  App.confirm('确定将所有模块的权限都设为「' + (value === 'write' ? '读写' : '只读') + '」吗？（仅进入待保存缓存，需点击「保存权限」才会生效）', function() {
    const modules = App.modulePermissions;
    const roles = App.roles;
    if (!_pendingPerms) _pendingPerms = {};
    Object.keys(modules).forEach(modKey => {
      if (!_pendingPerms[modKey]) _pendingPerms[modKey] = {};
      Object.keys(roles).forEach(roleKey => {
        if (roles[roleKey].isAdmin) return;
        _pendingPerms[modKey][roleKey] = value;
      });
    });
    renderRoles();
    App.toast('已更新到待保存缓存，请点击「💾 保存权限」以生效', 'info');
  });
}

// 放弃当前未保存的修改
function cancelPendingPerms() {
  if (!_hasPermChanges()) { App.toast('没有未保存的修改', 'info'); return; }
  App.confirm('确认放弃当前所有未保存的权限修改？', function() {
    const stored = App.store.get('permissions', {});
    _pendingPerms = _deepClonePerms(stored);
    _baselinePerms = _deepClonePerms(stored);
    renderRoles();
    App.toast('已恢复到最后一次保存的状态', 'success');
  });
}

// 真正保存：双写 localStorage + Supabase，防止后续被 refreshFromCloud 覆盖
function savePendingPerms() {
  if (!_hasPermChanges()) { App.toast('没有需要保存的修改', 'info'); return; }
  App.confirm('确认将当前权限配置写入本地并同步到云端？其他用户需重新登录后新权限生效。', function() {
    const toSave = _deepClonePerms(_pendingPerms);
    // 双写：localStorage + 云端
    App.store.set('permissions', toSave);
    if (window.SupabaseStore && typeof window.SupabaseStore.setSync === 'function') {
      try { window.SupabaseStore.setSync('permissions', toSave); } catch(_) {}
    }
    // 清理 localStorage 旧缓存以防被 App.store.get 的兜底读取又翻回来
    try { localStorage.setItem('permissions', JSON.stringify(toSave)); } catch(_) {}
    // 更新基线
    _baselinePerms = _deepClonePerms(toSave);
    // 触发当前页面权限重算
    if (window.App && window.App._currentPageModule) {
      try { App.enforcePagePermission(window.App._currentPageModule); } catch(_) {}
    }
    renderRoles();
    App.toast('✅ 权限已保存并同步到 Supabase', 'success');
  });
}

function resetPerms() {
  App.confirm('确定恢复默认权限配置吗？会清除所有自定义权限（同样会先进入待保存，点击保存后才会生效）', function() {
    // 清空本地缓存和云端缓存，然后用 initSampleData 重建默认
    try { localStorage.removeItem('permissions'); } catch(_) {}
    if (window.SupabaseStore && typeof window.SupabaseStore.remove === 'function') {
      try { window.SupabaseStore.remove('permissions'); } catch(_) {}
    }
    App.initSampleData();
    const def = App.store.get('permissions', {});
    _pendingPerms = _deepClonePerms(def);
    _baselinePerms = _deepClonePerms(def);
    renderRoles();
    App.toast('已恢复为默认权限（已自动写入本地 + 云端）', 'success');
  });
}

function _defaultNasConfig() {
  return {
    serverUrl: '',            // 如 http://192.168.1.50:9008 或 https://xxx.ugreen.link:9009
    webdavPath: '/webdav',    // 绿联 NAS WebDAV 默认路径通常是 /webdav，可按需改成 /dav 等
    rootFolder: '/服装外贸系统',   // 在 WebDAV 里的基础目录（可自定义）
    username: '',
    password: '',             // 明文保存在 localStorage，注意：浏览器端存储密码不是绝对安全，建议创建 NAS 端专用低权限账号
    mode: 'lan',              // lan / ugreen_ddns / portmap（仅提示用户，方便备注）
    uploadMaxMb: 500,
    verifySsl: true,          // 自签证书时可设为 false（用户注意风险）
  };
}
function getNasConfig() {
  try {
    var raw = App.store.get('nas_config', null);
    if (!raw) return _defaultNasConfig();
    return Object.assign(_defaultNasConfig(), raw);
  } catch (e) { return _defaultNasConfig(); }
}
function saveNasConfig() {
  if (!isAdminUser()) { App.toast('仅管理员可修改 NAS 配置', 'error'); return; }
  var cfg = _defaultNasConfig();
  cfg.serverUrl  = (document.getElementById('nas_serverUrl').value  || '').trim().replace(/\/+$/, '');
  cfg.webdavPath = document.getElementById('nas_webdavPath').value.trim() || '/webdav';
  cfg.rootFolder = document.getElementById('nas_rootFolder').value.trim() || '/';
  cfg.username   = document.getElementById('nas_username').value.trim();
  cfg.password   = document.getElementById('nas_password').value;
  cfg.mode       = document.getElementById('nas_mode').value;
  cfg.uploadMaxMb = parseInt(document.getElementById('nas_max').value || '500', 10) || 500;
  cfg.verifySsl  = document.getElementById('nas_verifySsl').checked;
  if (!cfg.serverUrl) { App.toast('请填写 WebDAV 服务器地址', 'error'); return; }
  if (cfg.rootFolder.charAt(0) !== '/') cfg.rootFolder = '/' + cfg.rootFolder;
  // 双写
  App.store.set('nas_config', cfg);
  try { localStorage.setItem('nas_config', JSON.stringify(cfg)); } catch(e) {}
  if (window.SupabaseStore && typeof window.SupabaseStore.setSync === 'function') {
    try { window.SupabaseStore.setSync('nas_config', cfg); } catch(e) {}
  }
  App.toast('✅ NAS 配置已保存并同步到云端', 'success');
}
async function testNasConn() {
  var btn = document.getElementById('nas_testBtn');
  if (!btn) return;
  btn.disabled = true; btn.textContent = '测试中...';
  try {
    // 先把表单最新的值拼到临时 config
    var cfg = _defaultNasConfig();
    cfg.serverUrl  = (document.getElementById('nas_serverUrl').value  || '').trim().replace(/\/+$/, '');
    cfg.webdavPath = document.getElementById('nas_webdavPath').value.trim() || '/webdav';
    cfg.rootFolder = document.getElementById('nas_rootFolder').value.trim() || '/';
    cfg.username   = document.getElementById('nas_username').value.trim();
    cfg.password   = document.getElementById('nas_password').value;
    if (!cfg.serverUrl) throw new Error('请填写服务器地址');
    // 发起 PROPFIND 来验证（Depth:0 读取根目录属性）
    var base = cfg.serverUrl + (cfg.webdavPath.startsWith('/') ? cfg.webdavPath : '/' + cfg.webdavPath);
    var target = base + (cfg.rootFolder === '/' ? '/' : (cfg.rootFolder.startsWith('/') ? cfg.rootFolder : '/' + cfg.rootFolder));
    var headers = { 'Depth': '0' };
    if (cfg.username) headers['Authorization'] = 'Basic ' + btoa(cfg.username + ':' + cfg.password);
    var resp = await fetch(target, {
      method: 'PROPFIND',
      headers: headers,
      credentials: 'omit',
      signal: AbortSignal.timeout(10000),
    });
    if (resp.ok) App.toast('✅ 连接成功：WebDAV HTTP ' + resp.status, 'success');
    else if (resp.status === 401) App.toast('❌ 认证失败：账号或密码不正确', 'error');
    else if (resp.status === 404) App.toast('⚠️ 路径不存在(404)，请确认 WebDAV路径 和 根目录', 'warning');
    else App.toast('❌ 连接失败 HTTP ' + resp.status, 'error');
  } catch (err) {
    console.warn('[NAS] test error:', err);
    App.toast('❌ 连接异常：' + (err && err.message ? err.message : String(err)), 'error');
  } finally {
    btn.disabled = false; btn.textContent = '🔌 连接测试';
  }
}

function exportData() {
  const keys = ['styles', 'orders', 'fabrics', 'accessories', 'samples', 'feedbacks', 'consumptions', 'consumption_categories', 'productions', 'invoices', 'payments', 'collections', 'contacts', 'customers', 'suppliers', 'favoriteContacts', 'washes', 'shippings', 'users', 'permissions', 'nas_config', 'nas_folder_perms'];
  const backup = { exportTime: new Date().toISOString(), version: localStorage.getItem('dataVersion') };
  keys.forEach(key => {
    const data = localStorage.getItem(key);
    if (data) backup[key] = data;
  });
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sainty-hantang-export-${App.utils.formatDate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  App.toast('数据导出成功', 'success');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        if (data.users && data.permissions) {
          App.confirm('导入将覆盖现有所有数据，确定继续？', () => {
            Object.keys(data).forEach(key => {
              if (key === 'exportTime' || key === 'version') return;
              localStorage.setItem(key, data[key]);
            });
            App.toast('数据导入成功，请刷新页面', 'success');
            setTimeout(() => location.reload(), 1500);
          });
        } else {
          App.toast('文件格式不正确', 'error');
        }
      } catch (err) {
        App.toast('文件解析失败', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearAllData() {
  App.confirm('确定要清空所有数据吗？此操作不可恢复！', () => {
    localStorage.clear();
    sessionStorage.clear();
    App.toast('数据已清空，请重新登录', 'success');

      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('username', 'admin');

      localStorage.setItem('currentUserId', 'U-0001');
      localStorage.setItem('refDPR', window.devicePixelRatio.toString());
      App.initSampleData();
      location.reload();
    }, 1000);
  });
}
