<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 舜天汉唐服装外贸系统</title>
<link rel="stylesheet" href="css/common.css?v=20260812">
<style>
.login-btn-wrap { text-align:center; margin-top:4px; }
.login-btn { padding:6px 36px;font-size:13px; }
/* 登录提示区域 */
#login-message {
  min-height: 18px;
  margin-top: 8px;
  font-size: 12px;
  text-align: center;
  color: #6b7280;
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">👔</div>
    </div>
    <div class="login-title">舜天汉唐服装外贸系统</div>
    <div class="login-subtitle">Sainty Hantang Garment Trade System</div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">邮箱</label>
        <input type="email" class="form-input" id="email" name="email" placeholder="请输入邮箱" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <div class="login-btn-wrap">
        <button type="submit" class="btn btn-primary login-btn" id="loginBtn">登 录</button>
      </div>
      <!-- 登录提示区域：中文提示信息展示在这里 -->
      <div id="login-message" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>
<!-- 保留 common.js，便于复用 App.toast 等基础工具；登录逻辑由 js/login.js 接管 -->
<script src="js/common.js?v=20260812"></script>
<!-- Supabase 登录逻辑：使用 supabase.auth.signInWithPassword，不硬编码用户名/密码 -->
<script type="module" src="js/login.js?v=20260813"></script>
</body>
</html>
