<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC验货报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --qc-blue-deep: #0f2b55;
    --qc-blue: #1f4582;
    --qc-blue-soft: #2c477a;
    --qc-gold: #c9a961;
    --qc-gold-soft: #f4e4b7;
    --qc-gold-tint: #8c7a44;
  }

  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    overflow: auto;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: var(--qc-blue-deep);
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: #1d2a3a;
  }

  /* 页面占满屏幕，同时保持 A4 横版 297:210 ≈ 1.414 的比例，不拉伸变形 */
  .stage {
    width: 100vw;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 0;
    background:
      radial-gradient(ellipse at top, rgba(201,169,97,0.10) 0%, transparent 60%),
      linear-gradient(180deg, #0f2b55 0%, #0a1d3c 100%);
  }
  .container {
    /* 按 A4 横比例贴合视口：按宽度 100vw 拉伸，如果高度超视口则按高度反推宽度 */
    width: 100vw;
    height: calc(100vw / 1.414);
    max-height: 100vh;
    max-width: calc(100vh * 1.414);
    /* 回退值：当视口很宽（横屏）时按高度限制，很窄时按宽度限制 */
    background: #fff;
    padding: 6mm 4mm 8mm;
    position: relative;
    border-radius: 0;
    box-shadow:
      0 18px 48px rgba(0,0,0,0.55),
      0 0 0 1px rgba(201,169,97,0.35);
    overflow: auto;
    /* 内嵌金边（深蓝外描边 + 1mm 内嵌金色细线，沉稳大气相框感） */
    outline: 1px solid var(--qc-gold);
    flex-shrink: 0;
  }
  /* 容器内再包一层：装饰金边 */
  .container::before {
    content: "";
    position: fixed;
    display: none;
  }
  .container::after {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid var(--qc-gold);
    pointer-events: none;
  }

  /* 打印按钮：嵌入页面右上角（公司名同一行），不再悬浮视口 */
  .print-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 10;
    width: 42px;
    height: 36px;
    border: 1px solid var(--qc-gold);
    border-radius: 4px;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(15,43,85,0.35), inset 0 1px 0 rgba(201,169,97,0.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .print-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15,43,85,0.5), inset 0 1px 0 rgba(201,169,97,0.55); }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  td {
    border: 1px solid var(--qc-blue-soft);
    padding: 4px 7px;
    font-size: 9.5pt;
    vertical-align: middle;
    height: 24px;
    white-space: normal;
    word-break: break-all;
    overflow: visible;
    background: #fff;
  }

  /* Column widths based on Excel proportions */
  col.col-A { width: 8.1%; }
  col.col-B { width: 4.95%; }
  col.col-C { width: 4.95%; }
  col.col-D { width: 6.9%; }
  col.col-E { width: 5.9%; }
  col.col-F { width: 5.9%; }
  col.col-G { width: 4.6%; }
  col.col-H { width: 10.9%; }
  col.col-I { width: 6.7%; }
  col.col-J { width: 11.3%; }
  col.col-K { width: 6.9%; }
  col.col-L { width: 8.4%; }
  col.col-M { width: 6.9%; }
  col.col-N { width: 8.4%; }

  .company-name {
    text-align: center;
    font-size: 19pt;
    font-weight: 800;
    border: none !important;
    padding: 10px 0 4px;
    letter-spacing: 2.5px;
    color: var(--qc-blue-deep);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 -1px 0 rgba(15,43,85,0.05);
    position: relative;
  }
  .company-name::after {
    content: "";
    display: block;
    margin: 8px auto 0;
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--qc-gold), transparent);
  }

  .report-title {
    text-align: center;
    font-size: 22pt;
    font-weight: 800;
    border: none !important;
    padding: 6px 0 10px;
    letter-spacing: 10px;
    position: relative;
    color: var(--qc-blue-deep);
  }
  .report-title::after {
    content: "";
    display: block;
    margin: 10px auto 0;
    width: 60%;
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(90deg, transparent, var(--qc-blue), var(--qc-gold), var(--qc-blue), transparent);
  }
  .report-title::before {
    content: "";
    display: block;
    margin: 0 auto 6px;
    width: 18px;
    height: 18px;
    background:
      radial-gradient(circle at center, var(--qc-gold) 0 4px, transparent 4px 7px, var(--qc-blue) 7px 9px, transparent 9px);
  }

  .date-row td { border: none !important; }
  .date-label {
    text-align: right;
    padding-right: 14px;
    font-size: 10pt;
    color: var(--qc-blue-soft);
    font-weight: 500;
    letter-spacing: 1px;
  }

  .spacer-row td {
    border: none !important;
    height: 6px;
    padding: 0;
    background: transparent !important;
  }

  .info-label {
    text-align: left;
    padding-left: 8px;
    font-size: 10pt;
    font-weight: 600;
    color: var(--qc-gold-soft);
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.35);
  }
  .info-value { text-align: left; color: #1d2a3a; }

  .progress-label {
    text-align: left;
    padding-left: 8px;
    font-weight: 600;
    color: var(--qc-gold-soft);
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.35);
  }
  .progress-header {
    text-align: center;
    font-size: 10pt;
    font-weight: 700;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.4);
    letter-spacing: 2px;
  }
  .progress-value { text-align: center; }

  /* 数量相关：靠右，数值加粗，“件”字弱化 */
  .qty-cell {
    text-align: right !important;
    padding-right: 10px !important;
    font-weight: 600;
    color: #1d2a3a;
  }
  .qty-cell[contenteditable="true"] {
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
    cursor: text;
    outline: none;
  }
  .qty-cell[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
  }
  .qty-num {
    font-size: 10.5pt;
    font-weight: 700;
    color: var(--qc-blue-deep);
  }
  .qty-unit {
    font-size: 8.5pt;
    font-weight: 400;
    color: var(--qc-gold-tint);
    margin-left: 3px;
  }

  .description-area {
    text-align: left;
    vertical-align: top;
    padding: 8px 10px;
    font-weight: bold;
    font-size: 14pt;
    background:
      linear-gradient(180deg, #ffffff 0%, #f8f6ef 100%);
    border: 1px solid var(--qc-blue-soft) !important;
  }
  .description-area[contenteditable="true"] {
    cursor: text;
    outline: none;
  }
  .description-area[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
  }

  .checklist-header {
    text-align: center;
    font-weight: 700;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.4);
    letter-spacing: 2px;
  }

  .category-name {
    text-align: left;
    padding-left: 8px;
    font-weight: 600;
    color: var(--qc-blue-deep);
  }
  .checklist-row:nth-child(odd) .category-name { background: #f4f2ea; }

  .check-cell { text-align: center; background: #f9fafb; }
  .notes-cell {
    text-align: left;
    padding: 3px 6px;
    background: #fff;
  }
  .notes-cell[contenteditable="true"] {
    cursor: text;
    outline: none;
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
  }
  .notes-cell[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
  }

  .checkbox {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--qc-blue-soft);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    background: #fff;
    transition: all .12s ease;
    box-shadow: inset 0 0 0 1px rgba(201, 169, 97, 0.25);
  }
  .checkbox:hover { border-color: var(--qc-gold); box-shadow: inset 0 0 0 1px var(--qc-gold); }
  .checkbox.checked {
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border-color: var(--qc-gold);
    box-shadow: inset 0 0 0 1px var(--qc-gold);
  }
  .checkbox.checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: -1px;
    width: 5px;
    height: 10px;
    border: solid var(--qc-gold-soft);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .sig-label {
    border: none !important;
    text-align: left;
    padding-left: 8px;
    font-size: 10.5pt;
    font-weight: 600;
    color: var(--qc-blue-deep);
  }
  .sig-line {
    border: none !important;
    border-bottom: 1.5px solid var(--qc-blue-soft) !important;
  }
  .sig-empty { border: none !important; }

  /* 屏幕页尾：隐藏（不在屏幕显示打印日期） */
  .footer-info {
    display: none !important;
  }

  /* ====== 打印样式：与屏幕一致（蓝配金黑白化、90%缩放更稳、页尾日期/页码分离） ====== */
  @media print {
    @page {
      size: A4 landscape;
      /* 底部留 14mm 给页脚文字，且让日期与页码分别居左/右 */
      margin: 6mm 6mm 14mm 6mm;
      @bottom-left {
        content: "打印日期：" counter(pFooterDate);
      }
      @bottom-right {
        content: "第 " counter(page) " 页 / 共 " counter(pages) " 页";
      }
    }
    /* 把页脚日期/页码的 content 都定义到 @page，避免"日期+页码挤在一处" */
    @page :first {
      @bottom-left {
        content: "打印日期：" counter(pFooterDate);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 10pt;
        color: #000;
      }
      @bottom-right {
        content: "第 " counter(page) " 页 / 共 " counter(pages) " 页";
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 10pt;
        color: #000;
      }
    }

    html, body { height: auto; width: auto; overflow: visible; }
    body { background: #fff; padding: 0; display: block; }
    .stage { display: block; width: auto; height: auto; overflow: visible; padding: 0; }
    .container {
      width: 100%;
      height: auto;
      min-height: auto;
      padding: 0;
      margin: 0;
      box-shadow: none;
      border-radius: 0;
      outline: none;
      overflow: visible;
      /* 90% 缩放：保持和屏幕呈现的比例一致，同时不裁切 */
      transform: scale(0.9);
      transform-origin: top left;
      width: 111.11%;
    }
    .container::before, .container::after { display: none; }
    .print-btn { display: none !important; }
    .footer-info { display: none !important; }

    td { border: 1px solid #000 !important; padding: 2px 4px; font-size: 9pt; background: #fff !important; color: #000 !important; }
    .company-name { color: #000 !important; text-shadow: none; }
    .company-name::after { background: #000 !important; }
    .report-title { color: #000 !important; }
    .report-title::before { background: radial-gradient(circle at center, #000 0 4px, transparent 4px 7px, #000 7px 9px, transparent 9px); }
    .report-title::after { background: linear-gradient(90deg, transparent, #000, transparent) !important; }
    .info-label, .progress-label, .progress-header, .checklist-header {
      background: #fff !important;
      color: #000 !important;
      box-shadow: none !important;
      border: 1px solid #000 !important;
    }
    .checklist-row:nth-child(odd) .category-name { background: #fff !important; }
    .description-area { background: #fff !important; color: #000 !important; }
    .check-cell { background: #fff !important; }
    .qty-unit { color: #000 !important; opacity: .75; }
    .checkbox { border: 1.5px solid #000 !important; background: #fff !important; box-shadow: none !important; }
    .checkbox.checked { background: #000 !important; border-color: #000 !important; box-shadow: none !important; }
    .checkbox.checked::after { border-color: #fff !important; }
    .sig-line { border-bottom: 1.5px #000 solid !important; }
  }
</style>
</head>

<script>
function toggleCheck(el) {
  el.classList.toggle('checked');
}

function printReport() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  // 清空先前遗留的 @page 注入样式
  var old = document.getElementById('print-page-style');
  if (old) old.remove();

  var style = document.createElement('style');
  style.id = 'print-page-style';
  // 日期放 @bottom-left,页码放 @bottom-right：彻底分离，避免挤在一处
  style.textContent = '\
    @page {\n\
      size: A4 landscape;\n\
      margin: 6mm 6mm 14mm 6mm;\n\
      @bottom-left {\n\
        content: "打印日期：' + dateStr + '";\n\
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;\n\
        font-size: 10pt;\n\
        color: #000;\n\
      }\n\
      @bottom-right {\n\
        content: "第 " counter(page) " 页 / 共 " counter(pages) " 页";\n\
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;\n\
        font-size: 10pt;\n\
        color: #000;\n\
      }\n\
    }';
  document.head.appendChild(style);
  window.print();
  setTimeout(function() {
    var el = document.getElementById('print-page-style');
    if (el) el.remove();
  }, 1000);
}

// 从 URL 参数填充验货报告（由外勤登记"验货报告"按钮传入）
function fillFromUrlParams() {
  var params = {};
  try {
    var search = window.location.search.replace(/^\?/, '');
    if (search) {
      search.split('&').forEach(function(pair) {
        var idx = pair.indexOf('=');
        if (idx > 0) {
          var k = pair.slice(0, idx);
          var v = pair.slice(idx + 1);
          params[decodeURIComponent(k)] = decodeURIComponent(v);
        }
      });
    }
  } catch (e) { return; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function set(id, v) {
    var el = document.getElementById(id);
    if (el) el.textContent = v == null ? '' : v;
  }

  // 信息行
  set('infoFactory', params.factory);
  set('infoStyleNo', params.styleNo);
  set('infoOrderNo', params.orderNo);
  set('infoStyleDesc', params.styleDesc);
  // 数量：订单/抽查 + 裁剪/缝制/水洗/包装 填值+"件"并靠右
  setQty('infoOrderQty', params.orderQty);
  setQty('infoCheckQty', params.checkQty);
  setQty('progCutQty', params.cutQty);
  setQty('progSewQty', params.sewQty);
  setQty('progWashQty', params.washQty);
  setQty('progPackQty', params.packQty);
  // 跟单人 = QC姓名
  set('sigMerchandiser', params.qcName);

  function setQty(id, v){
    var el = document.getElementById(id);
    if(!el) return;
    if(v != null && v !== ''){
      el.innerHTML = '<span class="qty-num">' + esc(String(v).replace(/件$/,'')) + '</span><span class="qty-unit">件</span>';
    }else{
      el.textContent = '';
    }
  }

  // 问题描述区：保留"问题描述"标题，追加"面里衬辅料问题及整改" + "生产中问题及整改"逐行
  var descEl = document.getElementById('descArea');
  if (descEl) {
    var parts = ['<div>问题描述</div>'];
    if (params.matNotes) {
      parts.push('<div style="margin-top:6px;font-weight:bold;font-size:10pt;">【面里衬辅料问题及整改】</div>');
      parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(params.matNotes) + '</div>');
    }
    if (params.prodIssues) {
      try {
        var arr = JSON.parse(params.prodIssues);
        if (Array.isArray(arr) && arr.length) {
          parts.push('<div style="margin-top:8px;font-weight:bold;font-size:10pt;">【生产中问题及整改】</div>');
          var statusMap = { open: '未解决', resolved: '已解决' };
          arr.forEach(function(it, i) {
            var line = (i + 1) + '. ';
            if (it.issue) line += '问题：' + it.issue;
            if (it.rect) line += (it.issue ? '；' : '') + '整改：' + it.rect;
            if (it.status) line += '（' + (statusMap[it.status] || it.status) + '）';
            parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(line) + '</div>');
          });
        }
      } catch (_e) {}
    }
    if (parts.length > 1) {
      descEl.innerHTML = parts.join('');
    }
  }

  // 类别列：按传入顺序填充前 N 行；仅"有标签名"的行才显示"正确/错误"checkbox
  if (params.tags) {
    var tags = params.tags.split('|').filter(function(t) { return t !== ''; });
    var rows = document.querySelectorAll('.checklist-row');
    var cbHtml = '<div class="checkbox" onclick="toggleCheck(this)"></div>';
    for (var i = 0; i < rows.length; i++) {
      var hasTag = i < tags.length;
      var cells = rows[i].children;
      cells[0].textContent = hasTag ? tags[i] : '';
      cells[1].innerHTML = hasTag ? cbHtml : '';
      cells[2].innerHTML = hasTag ? cbHtml : '';
    }
  }
}

(function() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  document.getElementById('screenFooter').textContent = '打印日期：' + dateStr;
  document.getElementById('inspectDate').textContent = dateStr;
  // 所有备注单元格可编辑
  document.querySelectorAll('.notes-cell').forEach(function(td){ td.setAttribute('contenteditable','true'); });
  fillFromUrlParams();
})();
