<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC验货报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --qc-blue-deep: #0f2b55;
    --qc-blue: #1f4582;
    --qc-blue-soft: #2c477a;
    --qc-gold: #c9a961;
    --qc-gold-soft: #f4e4b7;
    --qc-gold-tint: #8c7a44;
  }

  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #fff;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: #1d2a3a;
    display: block;
  }

  /* 舞台：直接铺满，不留深蓝色外围背景 */
  .stage {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    background: #fff;
    overflow: auto;
    display: block;
  }
  .container {
    /* 彻底去除 A4 比例限制，直接 100% 占满视口，表格两侧不再有任何空白 */
    width: 100% !important;
    height: 100% !important;
    min-width: 100%;
    min-height: 100%;
    max-width: none !important;
    max-height: none !important;
    background: #fff;
    padding: 8px 14px 14px;
    margin: 0;
    position: relative;
    box-sizing: border-box;
    border: none;
    border-radius: 0;
    outline: none;
    box-shadow: none;
    overflow: auto;
  }
  /* 移除金边/渐变装饰条，避免造成"页面没有贴边"的视觉感 */
  .container::before,
  .container::after { display: none !important; }

  /* 打印按钮：嵌入页面右上角 */
  .print-btn {
    position: fixed;
    top: 8px;
    right: 12px;
    z-index: 50;
    width: 40px;
    height: 34px;
    border: 1px solid var(--qc-gold);
    border-radius: 4px;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(15,43,85,0.28), inset 0 1px 0 rgba(201,169,97,0.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .print-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(15,43,85,0.4), inset 0 1px 0 rgba(201,169,97,0.55); }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  td {
    border: 1px solid var(--qc-blue-soft);
    padding: 4px 7px;
    font-size: 9.5pt;
    vertical-align: middle;
    height: 24px;
    white-space: normal;
    word-break: break-all;
    overflow: visible;
    background: #fff;
  }

  /* Column widths based on Excel proportions */
  col.col-A { width: 8.1%; }
  col.col-B { width: 4.95%; }
  col.col-C { width: 4.95%; }
  col.col-D { width: 6.9%; }
  col.col-E { width: 5.9%; }
  col.col-F { width: 5.9%; }
  col.col-G { width: 4.6%; }
  col.col-H { width: 10.9%; }
  col.col-I { width: 6.7%; }
  col.col-J { width: 11.3%; }
  col.col-K { width: 6.9%; }
  col.col-L { width: 8.4%; }
  col.col-M { width: 6.9%; }
  col.col-N { width: 8.4%; }

  .company-name {
    text-align: center;
    font-size: 19pt;
    font-weight: 800;
    border: none !important;
    padding: 10px 0 4px;
    letter-spacing: 2.5px;
    color: var(--qc-blue-deep);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6), 0 -1px 0 rgba(15,43,85,0.05);
    position: relative;
  }
  .company-name::after {
    content: "";
    display: block;
    margin: 8px auto 0;
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--qc-gold), transparent);
  }

  .report-title {
    text-align: center;
    font-size: 22pt;
    font-weight: 800;
    border: none !important;
    padding: 6px 0 10px;
    letter-spacing: 10px;
    position: relative;
    color: var(--qc-blue-deep);
  }
  .report-title::after {
    content: "";
    display: block;
    margin: 10px auto 0;
    width: 60%;
    height: 2px;
    border-radius: 1px;
    background: linear-gradient(90deg, transparent, var(--qc-blue), var(--qc-gold), var(--qc-blue), transparent);
  }
  .report-title::before {
    content: "";
    display: block;
    margin: 0 auto 6px;
    width: 18px;
    height: 18px;
    background:
      radial-gradient(circle at center, var(--qc-gold) 0 4px, transparent 4px 7px, var(--qc-blue) 7px 9px, transparent 9px);
  }

  .date-row td { border: none !important; }
  .date-label {
    text-align: right;
    padding-right: 14px;
    font-size: 10pt;
    color: var(--qc-blue-soft);
    font-weight: 500;
    letter-spacing: 1px;
  }

  .spacer-row td {
    border: none !important;
    height: 6px;
    padding: 0;
    background: transparent !important;
  }

  .info-label {
    text-align: left;
    padding-left: 8px;
    font-size: 10pt;
    font-weight: 600;
    color: var(--qc-gold-soft);
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.35);
  }
  .info-value { text-align: left; color: #1d2a3a; }

  .progress-label {
    text-align: left;
    padding-left: 8px;
    font-weight: 600;
    color: var(--qc-gold-soft);
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.35);
  }
  .progress-header {
    text-align: center;
    font-size: 10pt;
    font-weight: 700;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.4);
    letter-spacing: 2px;
  }
  .progress-value { text-align: center; }

  /* 数量相关：靠右，数值加粗，“件”字弱化 */
  .qty-cell {
    text-align: right !important;
    padding-right: 10px !important;
    font-weight: 600;
    color: #1d2a3a;
  }
  .qty-cell[contenteditable="true"] {
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
    cursor: text;
    outline: none;
  }
  .qty-cell[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
  }
  .qty-num {
    font-size: 10.5pt;
    font-weight: 700;
    color: var(--qc-blue-deep);
  }
  .qty-unit {
    font-size: 8.5pt;
    font-weight: 400;
    color: var(--qc-gold-tint);
    margin-left: 3px;
  }

  .description-area {
    position: relative;
    text-align: left;
    vertical-align: top;
    padding: 8px 10px;
    font-weight: bold;
    font-size: 14pt;
    background:
      linear-gradient(180deg, #ffffff 0%, #f8f6ef 100%);
    border: 1px solid var(--qc-blue-soft) !important;
  }
  .description-area[contenteditable="true"] { cursor: text; outline: none; }
  .description-area[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
  }
  /* 问题描述框右上角：款号缩略图 约 20×10mm */
  .desc-thumb {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 20mm;
    height: 10mm;
    object-fit: contain;
    background: #fff;
    border: 1px solid var(--qc-gold);
    border-radius: 3px;
    padding: 1px;
    box-shadow: 0 1px 3px rgba(15, 43, 85, 0.2);
    z-index: 2;
    display: none;
  }
  .desc-thumb.show { display: block; }
  /* 当缩略图显示时，描述文字右侧预留 22mm 避免覆盖 */
  .description-area.has-thumb { padding-right: 24mm; }

  .checklist-header {
    text-align: center;
    font-weight: 700;
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    color: var(--qc-gold-soft);
    border: 1px solid var(--qc-blue-deep) !important;
    box-shadow: inset 0 -1px 0 rgba(201, 169, 97, 0.4);
    letter-spacing: 2px;
  }

  .category-name {
    text-align: left;
    padding-left: 8px;
    font-weight: 600;
    color: var(--qc-blue-deep);
  }
  .checklist-row:nth-child(odd) .category-name { background: #f4f2ea; }

  .check-cell { text-align: center; background: #f9fafb; }
  .notes-cell {
    text-align: left;
    padding: 3px 6px;
    background: #fff;
  }
  .notes-cell[contenteditable="true"] {
    cursor: text;
    outline: none;
    background: linear-gradient(180deg, #fffdf5 0%, #fff8e1 100%);
  }
  .notes-cell[contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 2px var(--qc-gold);
  }

  .checkbox {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--qc-blue-soft);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    vertical-align: middle;
    background: #fff;
    transition: all .12s ease;
    box-shadow: inset 0 0 0 1px rgba(201, 169, 97, 0.25);
  }
  .checkbox:hover { border-color: var(--qc-gold); box-shadow: inset 0 0 0 1px var(--qc-gold); }
  .checkbox.checked {
    background: linear-gradient(180deg, var(--qc-blue) 0%, var(--qc-blue-deep) 100%);
    border-color: var(--qc-gold);
    box-shadow: inset 0 0 0 1px var(--qc-gold);
  }
  .checkbox.checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: -1px;
    width: 5px;
    height: 10px;
    border: solid var(--qc-gold-soft);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .sig-label {
    border: none !important;
    text-align: left;
    padding-left: 8px;
    font-size: 10.5pt;
    font-weight: 600;
    color: var(--qc-blue-deep);
  }
  .sig-line {
    border: none !important;
    border-bottom: 1.5px solid var(--qc-blue-soft) !important;
  }
  .sig-empty { border: none !important; }

  /* 屏幕页尾：隐藏（不在屏幕显示打印日期） */
  .footer-info {
    display: none !important;
  }

  /* ====== 打印样式：与屏幕一致（蓝配金黑白化、90%缩放、页尾日期/页码分离、强制1页） ====== */
  @media print {
    /* 声明 margin-box 框架：真正的内容由 printReport() JS 注入 date 覆盖，防止 counter() 空值 */
    @page {
      size: A4 landscape;
      margin: 4mm 4mm 10mm 4mm;
    }

    html, body {
      height: auto !important;
      width: auto !important;
      overflow: visible !important;
      background: #fff !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    body { display: block; }
    .stage {
      display: block !important;
      width: auto !important;
      height: auto !important;
      min-height: 0 !important;
      overflow: visible !important;
      padding: 0 !important;
      background: #fff !important;
    }
    .container {
      /* 固定为 A4 的 90% 物理尺寸：297*0.9=267.3mm / 210*0.9=189mm，严格贴一页，不再用 transform（避免文档流高度失真导致分页） */
      width: 267.3mm !important;
      height: 189mm !important;
      max-width: 267.3mm !important;
      max-height: 189mm !important;
      min-height: 0 !important;
      padding: 2mm 3mm !important;
      margin: 0 auto !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      outline: none !important;
      border: none !important;
      overflow: hidden !important;
      position: relative !important;
      background: #fff !important;
      display: block !important;
      flex: none !important;
    }
    .container::before,
    .container::after { display: none !important; }
    .print-btn { display: none !important; }
    .footer-info { display: none !important; }

    table { width: 100% !important; border-collapse: collapse !important; table-layout: fixed !important; }

    /* 字体/行高/内边距压缩；保留最小行高让左侧表格和右侧 rowspan 描述区高度比例与屏幕一致 */
    td {
      border: 1px solid #000 !important;
      padding: 1px 3px !important;
      font-size: 8.5pt !important;
      line-height: 1.25 !important;
      /* 不给 min-height=0：保留微小的最小高度让表格行撑住，防止rowspan描述区塌缩 */
      min-height: 18px !important;
      height: auto !important;
      background: #fff !important;
      color: #000 !important;
      vertical-align: middle !important;
    }
    tr.checklist-row td { min-height: 18px !important; }

    .company-name {
      color: #000 !important;
      text-shadow: none !important;
      font-size: 17pt !important;
      padding: 4px 0 2px !important;
    }
    .company-name::after { background: #000 !important; margin: 4px auto 0 !important; width: 180px !important; }
    .company-name img { height: 32px !important; margin-right: 10px !important; }

    .report-title {
      color: #000 !important;
      font-size: 18pt !important;
      padding: 2px 0 6px !important;
      letter-spacing: 8px !important;
    }
    .report-title::before {
      width: 14px !important; height: 14px !important; margin: 0 auto 4px !important;
      background: radial-gradient(circle at center, #000 0 3px, transparent 3px 5px, #000 5px 7px, transparent 7px) !important;
    }
    .report-title::after {
      background: linear-gradient(90deg, transparent, #000, transparent) !important;
      margin: 6px auto 0 !important;
      height: 1px !important;
    }

    .date-label { font-size: 9pt !important; padding-right: 8px !important; color: #000 !important; }

    .spacer-row td { height: 3px !important; padding: 0 !important; border: none !important; background: transparent !important; }

    .info-label, .progress-label, .progress-header, .checklist-header {
      background: #fff !important;
      color: #000 !important;
      box-shadow: none !important;
      border: 1px solid #000 !important;
      font-weight: 700 !important;
      font-size: 9pt !important;
      min-height: 20px !important;
    }
    .info-label { padding-left: 5px !important; }
    .progress-label { padding-left: 5px !important; }
    .progress-header, .checklist-header { letter-spacing: 1px !important; }

    .category-name { padding-left: 5px !important; color: #000 !important; font-weight: 600 !important; font-size: 8.5pt !important; }
    .checklist-row:nth-child(odd) .category-name { background: #fff !important; }

    /* 关键：描述区强制填充它所跨的 27 行的全部高度 —— 与左侧表格底部对齐，不再随内容塌缩 */
    .description-area {
      background: #fff !important;
      color: #000 !important;
      border: 1px solid #000 !important;
      font-size: 12pt !important;
      padding: 5px 7px !important;
      line-height: 1.4 !important;
      height: 100% !important;
      min-height: 150mm !important;
      vertical-align: top !important;
      position: relative !important;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    .description-area.has-thumb { padding-right: 25mm !important; }
    .desc-thumb {
      display: block !important;
      width: 20mm !important;
      height: 10mm !important;
      position: absolute !important;
      top: 5px !important;
      right: 6px !important;
      border: 1px solid #000 !important;
      background: #fff !important;
      padding: 1px !important;
      box-shadow: none !important;
      object-fit: contain !important;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    .desc-content { display: block !important; padding: 0 !important; margin: 0 !important; }

    .check-cell { background: #fff !important; text-align: center !important; }
    .notes-cell { background: #fff !important; padding: 1px 3px !important; }

    .qty-cell {
      text-align: right !important;
      padding-right: 6px !important;
      font-weight: 600 !important;
      color: #000 !important;
    }
    .qty-num { font-size: 9.5pt !important; font-weight: 700 !important; color: #000 !important; }
    .qty-unit { font-size: 8pt !important; color: #000 !important; opacity: .8 !important; margin-left: 2px !important; }

    .checkbox {
      width: 12px !important; height: 12px !important;
      border: 1.5px solid #000 !important;
      background: #fff !important;
      box-shadow: none !important;
    }
    .checkbox.checked { background: #000 !important; border-color: #000 !important; box-shadow: none !important; }
    .checkbox.checked::after {
      left: 2px !important; top: -2px !important;
      width: 4px !important; height: 8px !important;
      border-color: #fff !important;
    }

    .sig-label {
      font-size: 9.5pt !important;
      padding-left: 5px !important;
      color: #000 !important;
      border: none !important;
    }
    .sig-line { border-bottom: 1px solid #000 !important; border: none !important; }
    .sig-empty { border: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
<div class="container">
  <button class="print-btn" onclick="printReport()" title="打印">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"></polyline>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
      <rect x="6" y="14" width="12" height="8"></rect>
    </svg>
  </button>
  <table>
    <colgroup>
      <col class="col-A"><col class="col-B"><col class="col-C"><col class="col-D">
      <col class="col-E"><col class="col-F"><col class="col-G"><col class="col-H">
      <col class="col-I"><col class="col-J"><col class="col-K"><col class="col-L">
      <col class="col-M"><col class="col-N">
    </colgroup>

    <!-- Row 1: Company Name -->
    <tr>
      <td colspan="14" class="company-name"><img src="logo.png" alt="logo" style="height:38px;vertical-align:middle;margin-right:14px;">江 苏 舜 天 汉 唐 贸 易 有 限 公 司</td>
    </tr>

    <!-- Row 2: Report Title -->
    <tr>
      <td colspan="14" class="report-title">验货报告</td>
    </tr>

    <!-- Row 3: Date -->
    <tr class="date-row">
      <td colspan="10"></td>
      <td colspan="4" class="date-label">检验日期：<span id="inspectDate"></span></td>
    </tr>

    <!-- Row 4: Spacer -->
    <tr class="spacer-row">
      <td colspan="14"></td>
    </tr>

    <!-- Row 5: Info -->
    <tr>
      <td class="info-label">服装厂</td>
      <td colspan="2" class="info-value" id="infoFactory"></td>
      <td class="info-label">款号</td>
      <td colspan="2" class="info-value" id="infoStyleNo"></td>
      <td class="info-label">订单号</td>
      <td class="info-value" id="infoOrderNo"></td>
      <td class="info-label">款式描述</td>
      <td class="info-value" id="infoStyleDesc"></td>
      <td class="info-label">订单数量</td>
      <td class="info-value qty-cell" id="infoOrderQty"></td>
      <td class="info-label">抽查数量</td>
      <td class="info-value qty-cell" contenteditable="true" id="infoCheckQty"></td>
    </tr>

    <!-- Row 6: Spacer -->
    <tr class="spacer-row">
      <td colspan="14"></td>
    </tr>

    <!-- Row 7: Progress Header -->
    <tr>
      <td class="progress-label">生产进度</td>
      <td colspan="2" class="progress-header">裁剪</td>
      <td class="progress-header">缝制</td>
      <td class="progress-header">水洗</td>
      <td class="progress-header">包装</td>
      <td rowspan="27" colspan="8" class="description-area" contenteditable="true" id="descArea">
        <img class="desc-thumb" id="descThumb" alt="" />
        <div class="desc-content" id="descContent">问题描述</div>
      </td>
    </tr>

    <!-- Row 8: Progress Values -->
    <tr>
      <td class="progress-label">完成数量</td>
      <td colspan="2" class="progress-value qty-cell" contenteditable="true" id="progCutQty"></td>
      <td class="progress-value qty-cell" contenteditable="true" id="progSewQty"></td>
      <td class="progress-value qty-cell" contenteditable="true" id="progWashQty"></td>
      <td class="progress-value qty-cell" contenteditable="true" id="progPackQty"></td>
    </tr>

    <!-- Row 9: Spacer。仅左侧 A-F 6列留空（colspan=6），右侧 8 列由 rowspan=27 的"问题描述"区承接。
         注意：不要写 colspan=14，否则会覆盖描述区所在列，打断 rowspan 导致浏览器渲染错位。 -->
    <tr class="spacer-row">
      <td colspan="6"></td>
    </tr>

    <!-- Row 10: Checklist Header -->
    <tr>
      <td class="checklist-header">类别</td>
      <td class="checklist-header">正确</td>
      <td class="checklist-header">错误</td>
      <td colspan="3" class="checklist-header">备注</td>
    </tr>

    <!-- Rows 11-29: Checklist Items（类别列文字已清空，由外勤登记传入的标签按选中顺序填充） -->
    <tr class="checklist-row">

<script>
function toggleCheck(el) {
  el.classList.toggle('checked');
}

function printReport() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  // 清空先前遗留的 @page 注入样式
  var old = document.getElementById('print-page-style');
  if (old) old.remove();

  var style = document.createElement('style');
  style.id = 'print-page-style';
  // 日期放 @bottom-left,页码放 @bottom-right：彻底分离，避免挤在一处
  style.textContent = '\
    @page {\n\
      size: A4 landscape;\n\
      margin: 6mm 6mm 14mm 6mm;\n\
      @bottom-left {\n\
        content: "打印日期：' + dateStr + '";\n\
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;\n\
        font-size: 10pt;\n\
        color: #000;\n\
      }\n\
      @bottom-right {\n\
        content: "第 " counter(page) " 页 / 共 " counter(pages) " 页";\n\
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;\n\
        font-size: 10pt;\n\
        color: #000;\n\
      }\n\
    }';
  document.head.appendChild(style);
  window.print();
  setTimeout(function() {
    var el = document.getElementById('print-page-style');
    if (el) el.remove();
  }, 1000);
}

// 从 URL 参数填充验货报告（由外勤登记"验货报告"按钮传入）
function fillFromUrlParams() {
  var params = {};
  try {
    var search = window.location.search.replace(/^\?/, '');
    if (search) {
      search.split('&').forEach(function(pair) {
        var idx = pair.indexOf('=');
        if (idx > 0) {
          var k = pair.slice(0, idx);
          var v = pair.slice(idx + 1);
          params[decodeURIComponent(k)] = decodeURIComponent(v);
        }
      });
    }
  } catch (e) { return; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function set(id, v) {
    var el = document.getElementById(id);
    if (el) el.textContent = v == null ? '' : v;
  }

  // 信息行
  set('infoFactory', params.factory);
  set('infoStyleNo', params.styleNo);
  set('infoOrderNo', params.orderNo);
  set('infoStyleDesc', params.styleDesc);
  // 数量：订单/抽查 + 裁剪/缝制/水洗/包装 填值+"件"并靠右
  setQty('infoOrderQty', params.orderQty);
  setQty('infoCheckQty', params.checkQty);
  setQty('progCutQty', params.cutQty);
  setQty('progSewQty', params.sewQty);
  setQty('progWashQty', params.washQty);
  setQty('progPackQty', params.packQty);
  // 跟单人 = QC姓名
  set('sigMerchandiser', params.qcName);

  function setQty(id, v){
    var el = document.getElementById(id);
    if(!el) return;
    if(v != null && v !== ''){
      el.innerHTML = '<span class="qty-num">' + esc(String(v).replace(/件$/,'')) + '</span><span class="qty-unit">件</span>';
    }else{
      el.textContent = '';
    }
  }

  // 问题描述区：保留"问题描述"标题，追加"面里衬辅料问题及整改" + "生产中问题及整改"逐行
  // 写 descContent 而不是 descArea，保持 descArea 内的缩略图 <img id="descThumb"> 不被覆盖
  var descEl = document.getElementById('descContent');
  var descArea = document.getElementById('descArea');
  var thumbEl = document.getElementById('descThumb');
  if (descEl) {
    var parts = ['<div>问题描述</div>'];
    if (params.matNotes) {
      parts.push('<div style="margin-top:6px;font-weight:bold;font-size:10pt;">【面里衬辅料问题及整改】</div>');
      parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(params.matNotes) + '</div>');
    }
    if (params.prodIssues) {
      try {
        var arr = JSON.parse(params.prodIssues);
        if (Array.isArray(arr) && arr.length) {
          parts.push('<div style="margin-top:8px;font-weight:bold;font-size:10pt;">【生产中问题及整改】</div>');
          var statusMap = { open: '未解决', resolved: '已解决' };
          arr.forEach(function(it, i) {
            var line = (i + 1) + '. ';
            if (it.issue) line += '问题：' + it.issue;
            if (it.rect) line += (it.issue ? '；' : '') + '整改：' + it.rect;
            if (it.status) line += '（' + (statusMap[it.status] || it.status) + '）';
            parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(line) + '</div>');
          });
        }
      } catch (_e) {}
    }
    if (parts.length > 1) {
      descEl.innerHTML = parts.join('');
    }
  }
  // 款号缩略图：放在"问题描述"框右上角（约 20×10mm）
  if (thumbEl && params.styleImg) {
    thumbEl.src = params.styleImg;
    thumbEl.classList.add('show');
    if (descArea) descArea.classList.add('has-thumb');
  }

  // 类别列：按传入顺序填充前 N 行；仅"有标签名"的行才显示"正确/错误"checkbox
  if (params.tags) {
    var tags = params.tags.split('|').filter(function(t) { return t !== ''; });
    var rows = document.querySelectorAll('.checklist-row');
    var cbHtml = '<div class="checkbox" onclick="toggleCheck(this)"></div>';
    for (var i = 0; i < rows.length; i++) {
      var hasTag = i < tags.length;
      var cells = rows[i].children;
      cells[0].textContent = hasTag ? tags[i] : '';
      cells[1].innerHTML = hasTag ? cbHtml : '';
      cells[2].innerHTML = hasTag ? cbHtml : '';
    }
  }
}

(function() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  document.getElementById('screenFooter').textContent = '打印日期：' + dateStr;
  document.getElementById('inspectDate').textContent = dateStr;
  // 所有备注单元格可编辑
  document.querySelectorAll('.notes-cell').forEach(function(td){ td.setAttribute('contenteditable','true'); });
  fillFromUrlParams();
})();
