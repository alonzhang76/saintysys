  col.col-K { width: 6.9%; }
  col.col-L { width: 8.4%; }
  col.col-M { width: 6.9%; }
  col.col-N { width: 8.4%; }

    font-size: 18pt;
    font-weight: bold;
    border: none !important;
    padding: 8px 0;
    letter-spacing: 2px;
  }

  .report-title {
    text-align: center;
    font-size: 18pt;
    font-weight: bold;
    border: none !important;
    padding: 6px 0;
  }

  .date-row td { border: none !important; }

  .spacer-row td {

  .info-label {

    font-size: 11pt;

  .progress-label {
    text-align: left;
    padding-left: 4px;
  }
  .progress-header {

    font-size: 11pt;
  }
  .progress-value { text-align: center; }

    text-align: left;

    padding: 4px;
    font-weight: bold;

  .checklist-header {

    padding-left: 6px;

  .notes-cell { text-align: left; padding: 2px 4px; }

  .checkbox {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1.5px solid #333;
    cursor: pointer;
    position: relative;
    vertical-align: middle;
  }
  .checkbox.checked::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 0px;
    width: 5px;
    height: 9px;
    border: solid #000;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

    border: none !important;
    text-align: left;
    padding-left: 4px;
    font-size: 11pt;
  }
  .sig-line {

  .footer-info {

    margin-top: 10px;
    font-size: 10pt;

  /* Print styles */

    .container {

      min-height: auto;
      padding: 0;
      box-shadow: none;
    }
    .print-btn { display: none !important; }

<script>
function toggleCheck(el) {
  el.classList.toggle('checked');
}

function printReport() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');

  var style = document.createElement('style');
  style.id = 'print-page-style';
  style.textContent = '\
    @page {\n\
      size: A4 landscape;\n\
      margin: 5mm 5mm 12mm 5mm;\n\
      @bottom-center {\n\
        content: "打印日期：' + dateStr + '    第 " counter(page) " 页 / 共 " counter(pages) " 页";\n\
        font-family: "宋体", SimSun, serif;\n\
        font-size: 10pt;\n\
      }\n\
    }';
  document.head.appendChild(style);
  window.print();
  setTimeout(function() {
    var el = document.getElementById('print-page-style');
    if (el) el.remove();
  }, 1000);
}

// 从 URL 参数填充验货报告（由外勤登记"验货报告"按钮传入）
function fillFromUrlParams() {
  var params = {};
  try {
    var search = window.location.search.replace(/^\?/, '');
    if (search) {
      search.split('&').forEach(function(pair) {
        var idx = pair.indexOf('=');
        if (idx > 0) {
          var k = pair.slice(0, idx);
          var v = pair.slice(idx + 1);
          params[decodeURIComponent(k)] = decodeURIComponent(v);
        }
      });
    }
  } catch (e) { return; }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function set(id, v) {
    var el = document.getElementById(id);
    if (el) el.textContent = v == null ? '' : v;
  }

  // 信息行
  set('infoFactory', params.factory);
  set('infoStyleNo', params.styleNo);
  set('infoOrderNo', params.orderNo);
  set('infoStyleDesc', params.styleDesc);
  set('infoOrderQty', params.orderQty);
  // 跟单人 = QC姓名
  set('sigMerchandiser', params.qcName);

  // 问题描述区：保留"问题描述"标题，追加"面里衬辅料问题及整改" + "生产中问题及整改"逐行
  var descEl = document.getElementById('descArea');
  if (descEl) {
    var parts = ['<div>问题描述</div>'];
    if (params.matNotes) {
      parts.push('<div style="margin-top:6px;font-weight:bold;font-size:10pt;">【面里衬辅料问题及整改】</div>');
      parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(params.matNotes) + '</div>');
    }
    if (params.prodIssues) {
      try {
        var arr = JSON.parse(params.prodIssues);
        if (Array.isArray(arr) && arr.length) {
          parts.push('<div style="margin-top:8px;font-weight:bold;font-size:10pt;">【生产中问题及整改】</div>');
          var statusMap = { open: '未解决', resolved: '已解决' };
          arr.forEach(function(it, i) {
            var line = (i + 1) + '. ';
            if (it.issue) line += '问题：' + it.issue;
            if (it.rect) line += (it.issue ? '；' : '') + '整改：' + it.rect;
            if (it.status) line += '（' + (statusMap[it.status] || it.status) + '）';
            parts.push('<div style="margin-top:2px;font-weight:normal;font-size:9pt;white-space:pre-wrap;">' + esc(line) + '</div>');
          });
        }
      } catch (_e) {}
    }
    if (parts.length > 1) {
      descEl.innerHTML = parts.join('');
    }
  }

  // 类别列：按传入顺序填充前 N 行；仅"有标签名"的行才显示"正确/错误"checkbox
  if (params.tags) {
    var tags = params.tags.split('|').filter(function(t) { return t !== ''; });
    var rows = document.querySelectorAll('.checklist-row');
    var cbHtml = '<div class="checkbox" onclick="toggleCheck(this)"></div>';
    for (var i = 0; i < rows.length; i++) {
      var hasTag = i < tags.length;
      var cells = rows[i].children;
      cells[0].textContent = hasTag ? tags[i] : '';
      cells[1].innerHTML = hasTag ? cbHtml : '';
      cells[2].innerHTML = hasTag ? cbHtml : '';
    }
  }
}

(function() {
  var now = new Date();
  var dateStr = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0');
  document.getElementById('screenFooter').textContent = '打印日期：' + dateStr;
  document.getElementById('inspectDate').textContent = dateStr;
  fillFromUrlParams();
})();
</script>
