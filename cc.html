    <input type="text" id="searchInput" placeholder="搜索款号/品名/设计师...">
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn" onclick="exportBackup()" title="导出JSON备份文件">💾 备份</button>
      <button class="btn" onclick="document.getElementById('restoreInput').click()" title="从JSON文件恢复数据">📂 恢复</button>
      <button class="btn btn-danger" onclick="clearAllData()" title="清空所有款号和类别数据">🗑️ 清空数据</button>
      <input type="file" id="restoreInput" accept=".json" style="display:none;" onchange="importBackup(event)">
      <button class="btn btn-primary" onclick="openEditor()">+ 新增款号</button>
    </div>
  </div>
  <div class="style-list" id="styleList"></div>
</div>

    <div class="compare-selector">
      <input type="text" id="compareSelect" list="compareDatalist" placeholder="输入款号或选择添加到对比...">
      <datalist id="compareDatalist"></datalist>
      <button class="btn btn-primary" onclick="addToCompare()">添加对比</button>

<script>
// ===== 数据存储 =====
const STORAGE_KEY = 'clothing_cost_styles_v3';
const CAT_KEY = 'clothing_cost_categories_v3';
let styles = [];
let categories = ['面料', '里料', '辅料', '无纺衬', '其他'];
let currentEditId = null;
let compareList = [];
let currentImageData = { style: '', full: '' };

// 初始化
function init() {
  loadCategories();
  loadData();
  renderList();
  updateCompareSelect();
  setupTabs();
  setupSearch();
  renderCatButtons();
}

// ===== 类别管理 =====
function loadCategories() {
  const saved = localStorage.getItem(CAT_KEY);
  if (saved) {
    try {
      categories = JSON.parse(saved);
    } catch(e) {
      categories = ['面料', '里料', '辅料', '无纺衬', '其他'];
    }
  }
}

function saveCategories() {
  localStorage.setItem(CAT_KEY, JSON.stringify(categories));
  if (typeof autoBackup === 'function') autoBackup();
}

function renderCatButtons() {
  const container = document.getElementById('catButtons');
  if (!container) return;
  container.innerHTML = categories.map((cat, idx) => `
    <button class="btn btn-sm ${idx===0?'btn-primary':''}" onclick="addFabricRow('${cat}')">+ ${cat}</button>
  `).join('');
}

function openCategoryManager() {
  renderCategoryList();
  document.getElementById('categoryModal').classList.add('active');
}

function closeCategoryManager() {
  document.getElementById('categoryModal').classList.remove('active');
}

function renderCategoryList() {
  const list = document.getElementById('categoryList');
  list.innerHTML = categories.map((cat, idx) => `
    <div style="display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid #f0f0f0;gap:8px;">
      <input type="text" value="${cat}" style="flex:1;padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;"
        onchange="renameCategory(${idx}, this.value)">
      <button class="btn btn-sm" onclick="moveCategory(${idx}, -1)" title="上移" style="opacity:${idx===0?'0.3':'1'}">↑</button>
      <button class="btn btn-sm" onclick="moveCategory(${idx}, 1)" title="下移" style="opacity:${idx===categories.length-1?'0.3':'1'}">↓</button>
      <button class="btn btn-sm btn-danger" onclick="deleteCategory(${idx})" title="删除">删除</button>
    </div>
  `).join('');
}

function addCategory() {
  const input = document.getElementById('newCatInput');
  const name = input.value.trim();
  if (!name) { alert('请输入类别名称'); return; }
  if (categories.includes(name)) { alert('该类别已存在'); return; }
  categories.push(name);
  saveCategories();
  renderCategoryList();
  renderCatButtons();
  renderFabricTable(fabricData); // 更新下拉选项
  input.value = '';
}

function renameCategory(idx, newName) {
  newName = newName.trim();
  if (!newName) { alert('类别名称不能为空'); renderCategoryList(); return; }
  if (categories.includes(newName) && categories[idx] !== newName) { alert('该类别已存在'); renderCategoryList(); return; }
  const oldName = categories[idx];
  categories[idx] = newName;
  saveCategories();
  renderCatButtons();
  // 更新所有款号中对应的类别名
  styles.forEach(s => {
    (s.fabrics || []).forEach(f => {
      if (f.category === oldName) f.category = newName;
    });
  });
  saveData();
  renderFabricTable(fabricData);
}

function deleteCategory(idx) {
  const name = categories[idx];
  if (!confirm(`确定删除类别"${name}"？\n已有数据中的该类别将变为"未分类"`)) return;
  categories.splice(idx, 1);
  saveCategories();
  renderCategoryList();
  renderCatButtons();
  // 更新已有数据
  styles.forEach(s => {
    (s.fabrics || []).forEach(f => {
      if (f.category === name) f.category = '未分类';
    });
  });
  saveData();
  // 更新当前编辑中的数据
  fabricData.forEach(f => {
    if (f.category === name) f.category = '未分类';
  });
  renderFabricTable(fabricData);
}

function moveCategory(idx, direction) {
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= categories.length) return;
  const temp = categories[idx];
  categories[idx] = categories[newIdx];
  categories[newIdx] = temp;
  saveCategories();
  renderCategoryList();
  renderCatButtons();
}

// 加载数据
function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      styles = JSON.parse(saved);
    } catch(e) {
      styles = [];
    }
  }
  // 无数据时不创建示例
  if (styles.length === 0) {
    // 留空，用户手动添加
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(styles));
  if (typeof autoBackup === 'function') autoBackup();
}

function genId() {
  return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

// ===== 标签页 =====
function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      if (tab.dataset.tab === 'compare') {
        updateCompareSelect();
        renderCompareTable();
      }
    });
  });
}

// ===== 搜索 =====
function setupSearch() {
  document.getElementById('searchInput').addEventListener('input', renderList);
  // 对比输入框回车快捷添加
  const compareInput = document.getElementById('compareSelect');
  if (compareInput) {
    compareInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addToCompare();
      }
    });
  }
}

// ===== 列表渲染 =====
function renderList() {
  const keyword = document.getElementById('searchInput').value.toLowerCase();
  const list = document.getElementById('styleList');
  const filtered = styles.filter(s =>
    s.styleNo.toLowerCase().includes(keyword) ||
    (s.name && s.name.toLowerCase().includes(keyword)) ||
    (s.designer && s.designer.toLowerCase().includes(keyword)) ||
    (s.season && s.season.toLowerCase().includes(keyword))
  );

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="icon">📁</div>
      <p>暂无款号数据，点击右上角"新增款号"开始</p>
    </div>`;
    return;
  }

  list.innerHTML = filtered.map(s => {
    const imgs = [];
    if (s.styleImg) imgs.push(s.styleImg);
    if (s.fullImg) imgs.push(s.fullImg);
    const hasImgs = imgs.length > 0;
    return `
    <div class="style-card" onclick="editStyle('${s.id}')">
      <div class="style-thumb" onclick="event.stopPropagation(); ${hasImgs ? `openFullscreen([${imgs.map(i=>`'${i}'`).join(',')}], 0)` : ''}">
        ${hasImgs ? `<img src="${imgs[0]}" alt="款式图" data-idx="0">` : '📷 暂无图片'}
        ${imgs.length > 1 ? `
          <div class="thumb-nav prev" onclick="event.stopPropagation(); navThumb(this, '${s.id}', -1)">&#10094;</div>
          <div class="thumb-nav next" onclick="event.stopPropagation(); navThumb(this, '${s.id}', 1)">&#10095;</div>
          <div class="thumb-dots">
            ${imgs.map((_, i) => `<div class="thumb-dot ${i===0?'active':''}"></div>`).join('')}
          </div>
        ` : ''}
      </div>
      <h3>${s.styleNo || '未命名'}</h3>
      <p>品名：${s.name || '-'}</p>
      <p>设计师：${s.designer || '-'}</p>
      <p>Season：${s.season || '-'}</p>
      <p>参考加工费：${s.price || '-'} 元</p>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn btn-sm btn-primary" onclick="editStyle('${s.id}')">编辑</button>
        <button class="btn btn-sm" onclick="printStyleById('${s.id}')">打印</button>
        <button class="btn btn-sm btn-danger" onclick="deleteStyle('${s.id}')">删除</button>
      </div>
    </div>
  `;}).join('');
}

// ===== 编辑器 =====
function openEditor() {
  currentEditId = null;
  currentImageData = { style: '', full: '' };
  document.getElementById('editorTitle').textContent = '新增款号';
  resetForm();
  document.getElementById('editorModal').classList.add('active');
}

function editStyle(id) {
  const style = styles.find(s => s.id === id);
  if (!style) return;
  currentEditId = id;
  currentImageData = { style: style.styleImg || '', full: style.fullImg || '' };
  fabricData = JSON.parse(JSON.stringify(style.fabrics || []));
  specData = JSON.parse(JSON.stringify(style.specs || []));
  document.getElementById('editorTitle').textContent = '编辑款号';
  fillForm(style);
  document.getElementById('editorModal').classList.add('active');
}

function closeEditor() {
  document.getElementById('editorModal').classList.remove('active');
}

function resetForm() {
  document.getElementById('f_date').value = new Date().toISOString().split('T')[0];
  document.getElementById('f_designer').value = 'CAD';
  document.getElementById('f_season').value = '';
  document.getElementById('f_styleNo').value = '';
  document.getElementById('f_name').value = '';
  document.getElementById('f_price').value = '';
  document.getElementById('f_craft').value = '';
  currentImageData = { style: '', full: '' };
  updateImagePreview('style', '');
  updateImagePreview('full', '');
  fabricData = [];
  specData = [];
  renderFabricTable(fabricData);
  renderSpecTable(specData);
}

function fillForm(style) {
  document.getElementById('f_date').value = style.date || '';
  document.getElementById('f_designer').value = style.designer || '';
  document.getElementById('f_season').value = style.season || '';
  document.getElementById('f_styleNo').value = style.styleNo || '';
  document.getElementById('f_name').value = style.name || '';
  document.getElementById('f_price').value = style.price || '';
  document.getElementById('f_craft').value = style.craft || '';
  updateImagePreview('style', style.styleImg || '');
  updateImagePreview('full', style.fullImg || '');
  renderFabricTable(fabricData);
  renderSpecTable(specData);
}

// ===== 图片上传 =====
function handleImageUpload(event, type) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentImageData[type] = e.target.result;
    updateImagePreview(type, e.target.result);
  };
  reader.readAsDataURL(file);
}

function updateImagePreview(type, data) {
  const previewId = type === 'style' ? 'styleImgPreview' : 'fullImgPreview';
  const preview = document.getElementById(previewId);
  if (data) {
    preview.innerHTML = `
      <img src="${data}" alt="预览">
      <button class="remove-img" onclick="event.stopPropagation(); removeImage('${type}')">&times;</button>
    `;
  } else {
    const hint = type === 'style'
      ? '<div class="icon">📷</div><div>点击上传款式图</div>'
      : '<div class="icon">🖼️</div><div>点击上传大图</div><div style="font-size:11px;margin-top:4px;">（可选，打印时为第2页）</div>';
    preview.innerHTML = `<div class="upload-hint">${hint}</div>`;
  }
}

function removeImage(type) {
  currentImageData[type] = '';
  updateImagePreview(type, '');
  const inputId = type === 'style' ? 'styleImgInput' : 'fullImgInput';
  document.getElementById(inputId).value = '';
}

// ===== 从云盘 NAS 选择图片注入 cc.html =====
async function nasPickForCc(type) {
  const label = type === 'style' ? '款式图' : '大图';
  const btns = document.querySelectorAll('.nas-pick-btn');
  const targetBtn = (type === 'style') ? btns[0] : btns[1];
  try {
    if (targetBtn) { targetBtn.disabled = true; targetBtn.textContent = '⏳ 正在打开 NAS...'; }
    const picks = await App.pickFromNas({ multi:false, filter:'images', view:'large' });
    if (!picks || picks.length === 0) {
      // 用户取消或未选
      return;
    }
    const pick = picks[0];
    if (targetBtn) { targetBtn.textContent = '⬇ 正在从 NAS 下载「' + pick.name + '」...'; }
    const got = await App.utils.nasFetchAsFile(pick.logicPath);
    const dataUrl = await App.utils.fileToDataUrl(got.file);
    currentImageData[type] = dataUrl;
    updateImagePreview(type, dataUrl);
    try {
      if (App && App.toast) App.toast('✅ 已注入 ' + label + '：' + pick.name + '（' + App.utils.formatSize && typeof App.utils.formatSize === 'function' ? App.utils.formatSize(pick.size) : (pick.size + ' B') + '）', 'success');
    } catch(_) {}
  } catch(err) {
    console.warn('[cc] nasPickForCc fail:', err);
    const msg = err && err.message ? err.message : String(err);
    try {
      if (App && App.toast) App.toast('❌ 选择失败：' + msg, 'error');
      else alert('从 NAS 选择失败：' + msg);
    } catch(_) { alert('选择失败：' + msg); }
  } finally {
    if (targetBtn) {
      targetBtn.disabled = false;
      targetBtn.textContent = type === 'style' ? '📁 从云盘 NAS 选择款式图' : '📁 从云盘 NAS 选择大图';
    }
  }
}

// ===== 面料表格 =====
let fabricData = [];

function renderFabricTable(fabrics) {
  const tbody = document.getElementById('fabricTableBody');
  if (fabrics.length === 0) {
    tbody.innerHTML = `<tr><td colspan="12" style="text-align:center;padding:20px;color:#999;">
      暂无数据，点击上方按钮添加
    </td></tr>`;
    return;
  }

  tbody.innerHTML = fabrics.map((f, idx) => `
    <tr data-idx="${idx}">
      <td>
        <select onchange="updateFabric(${idx}, 'category', this.value)">
          ${categories.map(c => `<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}
          ${!categories.includes(f.category) && f.category ? `<option value="${f.category}" selected>${f.category}</option>` : ''}
        </select>
      </td>
      <td><textarea rows="2" onchange="updateFabric(${idx}, 'spec', this.value)">${f.spec || ''}</textarea></td>
      <td><input type="text" value="${f.composition || ''}" onchange="updateFabric(${idx}, 'composition', this.value)" placeholder="如：70%C 30%T"></td>
      <td><input type="text" value="${f.beforeWeight || ''}" onchange="updateFabric(${idx}, 'beforeWeight', this.value)" placeholder="如：260gsm"></td>
      <td><input type="text" value="${f.afterWeight || ''}" onchange="updateFabric(${idx}, 'afterWeight', this.value)" placeholder="如：290gsm"></td>
      <td><input type="text" value="${f.width || ''}" onchange="updateFabric(${idx}, 'width', this.value)"></td>
      <td><input type="text" value="${f.spec2 || ''}" onchange="updateFabric(${idx}, 'spec2', this.value)"></td>
      <td><input type="text" value="${f.consumption || ''}" onchange="updateFabric(${idx}, 'consumption', this.value)"></td>
      <td><input type="text" value="${f.part || ''}" onchange="updateFabric(${idx}, 'part', this.value)"></td>
      <td><input type="text" value="${f.shrink || ''}" onchange="updateFabric(${idx}, 'shrink', this.value)"></td>
      <td><input type="text" value="${f.remark || ''}" onchange="updateFabric(${idx}, 'remark', this.value)"></td>
      <td class="row-actions">
        <button class="btn btn-sm" onclick="moveFabricRow(${idx}, -1)" title="上移">↑</button>
        <button class="btn btn-sm" onclick="moveFabricRow(${idx}, 1)" title="下移">↓</button>
        <button class="btn btn-sm btn-danger" onclick="deleteFabricRow(${idx})" title="删除">×</button>
      </td>
    </tr>
  `).join('');
}

function addFabricRow(category) {
  fabricData.push({
    category: category || '面料',
    spec: '', composition: '', beforeWeight: '', afterWeight: '',
    width: '', spec2: '', consumption: '', part: '', shrink: '', remark: ''
  });
  renderFabricTable(fabricData);
}

function updateFabric(idx, field, value) {
  fabricData[idx][field] = value;
}

function deleteFabricRow(idx) {
  if (!confirm('确定删除该行？')) return;
  fabricData.splice(idx, 1);
  renderFabricTable(fabricData);
}

function moveFabricRow(idx, direction) {
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= fabricData.length) return;
  const temp = fabricData[idx];
  fabricData[idx] = fabricData[newIdx];
  fabricData[newIdx] = temp;
  renderFabricTable(fabricData);
}

// ===== 规格尺寸表格 =====
let specData = [];

function renderSpecTable(specs) {
  const tbody = document.getElementById('specTableBody');
  if (specs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:20px;color:#999;">
      暂无尺寸数据，点击"添加尺寸"按钮添加
    </td></tr>`;
    return;
  }
  tbody.innerHTML = specs.map((s, idx) => `
    <tr data-idx="${idx}">
      <td><input type="text" value="${s.part || ''}" placeholder="如：裤长" onchange="updateSpec(${idx}, 'part', this.value)"></td>
      <td><input type="text" value="${s.size || ''}" placeholder="如：50" onchange="updateSpec(${idx}, 'size', this.value)"></td>
      <td><input type="text" value="${s.remark || ''}" placeholder="备注" onchange="updateSpec(${idx}, 'remark', this.value)"></td>
      <td class="row-actions">
        <button class="btn btn-sm" onclick="moveSpecRow(${idx}, -1)" title="上移">↑</button>
        <button class="btn btn-sm" onclick="moveSpecRow(${idx}, 1)" title="下移">↓</button>
        <button class="btn btn-sm btn-danger" onclick="deleteSpecRow(${idx})" title="删除">×</button>
      </td>
    </tr>
  `).join('');
}

function addSpecRow() {
  specData.push({ part: '', size: '', remark: '' });
  renderSpecTable(specData);
}

function updateSpec(idx, field, value) {
  specData[idx][field] = value;
}

function deleteSpecRow(idx) {
  if (!confirm('确定删除该尺寸？')) return;
  specData.splice(idx, 1);
  renderSpecTable(specData);
}

function moveSpecRow(idx, direction) {
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= specData.length) return;
  const temp = specData[idx];
  specData[idx] = specData[newIdx];
  specData[newIdx] = temp;
  renderSpecTable(specData);
}

// ===== 保存 =====
function saveStyle() {
  const styleNo = document.getElementById('f_styleNo').value.trim();
  if (!styleNo) {
    alert('请输入款号！');
    return;
  }

  const style = {
    id: currentEditId || genId(),
    date: document.getElementById('f_date').value,
    designer: document.getElementById('f_designer').value.trim(),
    season: document.getElementById('f_season').value.trim(),
    styleNo: styleNo,
    name: document.getElementById('f_name').value.trim(),
    price: document.getElementById('f_price').value.trim(),
    styleImg: currentImageData.style,
    fullImg: currentImageData.full,
    fabrics: JSON.parse(JSON.stringify(fabricData)),
    craft: document.getElementById('f_craft').value.trim(),
    specs: JSON.parse(JSON.stringify(specData))
  };

  if (currentEditId) {
    const idx = styles.findIndex(s => s.id === currentEditId);
    if (idx >= 0) styles[idx] = style;
  } else {
    if (styles.some(s => s.styleNo === styleNo)) {
      if (!confirm('款号已存在，是否继续保存？')) return;
    }
    styles.unshift(style);
  }

  saveData();
  renderList();
  updateCompareSelect();
  closeEditor();
  alert('保存成功！');
}

// ===== 删除 =====
function deleteStyle(id) {
  if (!confirm('确定删除该款号？删除后不可恢复。')) return;
  styles = styles.filter(s => s.id !== id);
  saveData();
  renderList();
  updateCompareSelect();
  compareList = compareList.filter(cid => cid !== id);
  renderCompareTags();
  renderCompareTable();
}

// ===== 对比功能 =====
function updateCompareSelect() {
  const datalist = document.getElementById('compareDatalist');
  datalist.innerHTML = styles.map(s => `<option value="${s.styleNo}">${s.name || ''}</option>`).join('');
}

function addToCompare() {
  const input = document.getElementById('compareSelect');
  const val = input.value.trim();
  if (!val) return;

  // 先尝试按ID匹配，再按款号匹配
  let style = styles.find(s => s.id === val);
  if (!style) {
    style = styles.find(s => s.styleNo === val);
  }
  if (!style) {
    style = styles.find(s => s.styleNo.toLowerCase().includes(val.toLowerCase()));
  }

  if (!style) {
    alert('未找到对应的款号');
    return;
  }

  if (compareList.includes(style.id)) {
    alert('该款号已在对比列表中');
    return;
  }
  compareList.push(style.id);
  input.value = '';
  renderCompareTags();
  renderCompareTable();
}

function removeFromCompare(id) {
  compareList = compareList.filter(cid => cid !== id);
  renderCompareTags();
  renderCompareTable();
}

function clearCompare() {
  compareList = [];
  renderCompareTags();
  renderCompareTable();
}

function renderCompareTags() {
  const tags = document.getElementById('compareTags');
  if (compareList.length === 0) {
    tags.innerHTML = '<span style="color:#999;font-size:12px;">暂无对比项</span>';
    return;
  }
  tags.innerHTML = compareList.map(id => {
    const s = styles.find(st => st.id === id);
    if (!s) return '';
    return `<span class="compare-tag">
      ${s.styleNo}
      <span class="remove" onclick="removeFromCompare('${id}')">&times;</span>
    </span>`;
  }).join('');
}

function renderCompareTable() {
  const container = document.getElementById('compareTableContainer');
  if (compareList.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="icon">📊</div>
      <p>请从上方选择款号进行对比</p>
    </div>`;
    return;
  }

  const compareStyles = compareList.map(id => styles.find(s => s.id === id)).filter(Boolean);
  if (compareStyles.length === 0) return;

  const allFabricFields = ['spec', 'composition', 'beforeWeight', 'afterWeight', 'width', 'spec2', 'consumption', 'part', 'shrink', 'remark'];
  const fabricFieldNames = {
    spec: '规格（名称）', composition: '成份', beforeWeight: '洗前克重', afterWeight: '洗后克重',
    width: '门幅（米）', spec2: '规格', consumption: '耗料（米）', part: '使用部位', shrink: '缩率', remark: '备注'
  };

  const allSpecParts = new Set();
  compareStyles.forEach(s => {
    (s.specs || []).forEach(sp => {
      if (sp.part) allSpecParts.add(sp.part);
    });
  });

  // 辅助函数：判断值是否为空
  function isEmpty(val) {
    return !val || val === '-' || val.trim() === '';
  }

  // 辅助函数：判断一行所有值是否都为空
  function allEmpty(values) {
    return values.every(v => isEmpty(v));
  }

  let html = '<table class="compare-table"><thead><tr>';
  html += '<th class="field-name">对比项</th>';
  compareStyles.forEach(s => {
    html += `<th>${s.styleNo}<br><small>${s.name || ''}</small></th>`;
  });
  html += '</tr></thead><tbody>';

  // 基本信息
  let hasBasicContent = false;
  let basicHtml = '';
  const basicFields = [
    ['date', '日期'], ['designer', '设计师'], ['season', 'Season'], ['styleNo', '款号'], ['name', '品名'], ['price', '参考加工费'], ['craft', '特殊工艺']
  ];
  basicFields.forEach(([key, label]) => {
    const values = compareStyles.map(s => s[key] || '-');
    if (allEmpty(values)) return; // 空行跳过
    hasBasicContent = true;
    const allSame = values.every(v => v === values[0]);
    basicHtml += `<tr><td class="field-name">${label}</td>`;
    values.forEach(v => {
      basicHtml += `<td${!allSame ? ' class="diff-highlight"' : ''}>${v}</td>`;
    });
    basicHtml += '</tr>';
  });
  if (hasBasicContent) {
    html += `<tr class="section-header"><td colspan="${compareStyles.length + 1}">基本信息</td></tr>`;
    html += basicHtml;
  }

  // 面料/辅料 - 按类别分组
  const catList = [...categories];
  catList.forEach(cat => {
    const maxRows = Math.max(...compareStyles.map(s =>
      (s.fabrics || []).filter(f => f.category === cat).length
    ), 0);
    if (maxRows === 0) return;

    let catHtml = '';
    let hasCatContent = false;
    for (let i = 0; i < maxRows; i++) {
      allFabricFields.forEach(field => {
        const rowValues = compareStyles.map(s => {
          const items = (s.fabrics || []).filter(f => f.category === cat);
          return items[i] ? (items[i][field] || '-') : '-';
        });
        if (allEmpty(rowValues)) return; // 空行跳过
        hasCatContent = true;
        const allSame = rowValues.every(v => v === rowValues[0]);
        catHtml += `<tr><td class="field-name">${cat}${i+1} - ${fabricFieldNames[field]}</td>`;
        rowValues.forEach(v => {
          catHtml += `<td${!allSame && v !== '-' ? ' class="diff-highlight"' : ''}>${v}</td>`;
        });
        catHtml += '</tr>';
      });
    }
    if (hasCatContent) {
      html += `<tr class="section-header"><td colspan="${compareStyles.length + 1}">${cat}</td></tr>`;
      html += catHtml;
    }
  });

  // 规格尺寸
  if (allSpecParts.size > 0) {
    let specSizeHtml = '';
    let hasSpecSizeContent = false;
    allSpecParts.forEach(part => {
      const values = compareStyles.map(s => {
        const sp = (s.specs || []).find(p => p.part === part);
        return sp ? (sp.size || '-') : '-';
      });
      if (allEmpty(values)) return; // 空行跳过
      hasSpecSizeContent = true;
      const allSame = values.every(v => v === values[0]);
      specSizeHtml += `<tr><td class="field-name">${part} (cm)</td>`;
      values.forEach(v => {
        specSizeHtml += `<td${!allSame && v !== '-' ? ' class="diff-highlight"' : ''}>${v}</td>`;
      });
      specSizeHtml += '</tr>';
    });
    if (hasSpecSizeContent) {
      html += `<tr class="section-header"><td colspan="${compareStyles.length + 1}">规格尺寸</td></tr>`;
      html += specSizeHtml;
    }

    // 备注对比
    let specRemarkHtml = '';
    let hasSpecRemarkContent = false;
    allSpecParts.forEach(part => {
      const values = compareStyles.map(s => {
        const sp = (s.specs || []).find(p => p.part === part);
        return sp ? (sp.remark || '-') : '-';
      });
      if (allEmpty(values)) return; // 空行跳过
      hasSpecRemarkContent = true;
      const allSame = values.every(v => v === values[0]);
      specRemarkHtml += `<tr><td class="field-name">${part} - 常规档差</td>`;
      values.forEach(v => {
        specRemarkHtml += `<td${!allSame && v !== '-' ? ' class="diff-highlight"' : ''}>${v}</td>`;
      });
      specRemarkHtml += '</tr>';
    });
    if (hasSpecRemarkContent) {
      html += `<tr class="section-header"><td colspan="${compareStyles.length + 1}">规格尺寸 - 常规档差</td></tr>`;
      html += specRemarkHtml;
    }
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

// 打印对比表
function printCompare() {
  if (compareList.length === 0) {
    alert('请先添加要对比的款号');

// ===== 卡片图片翻页 =====
function navThumb(btn, styleId, dir) {
  const style = styles.find(s => s.id === styleId);
  if (!style) return;
  const imgs = [];
  if (style.styleImg) imgs.push(style.styleImg);
  if (style.fullImg) imgs.push(style.fullImg);
  if (imgs.length <= 1) return;

  const thumb = btn.closest('.style-thumb');
  const img = thumb.querySelector('img');
  const dots = thumb.querySelectorAll('.thumb-dot');
  let idx = parseInt(img.dataset.idx || '0');
  idx = (idx + dir + imgs.length) % imgs.length;
  img.src = imgs[idx];
  img.dataset.idx = idx;
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));

  // 更新点击全屏的起始索引
  thumb.onclick = function(e) {
    e.stopPropagation();
    openFullscreen(imgs, idx);
  };
}

// ===== 全屏图片查看 =====
let fsImages = [];
let fsCurrentIndex = 0;

function openFullscreen(images, startIndex) {
  fsImages = images.filter(img => img && img.length > 0);
  if (fsImages.length === 0) return;
  fsCurrentIndex = startIndex || 0;
  renderFullscreen();
  document.getElementById('fullscreenOverlay').classList.add('active');
}

function closeFullscreen() {
  document.getElementById('fullscreenOverlay').classList.remove('active');
}

function renderFullscreen() {
  const img = document.getElementById('fullscreenImg');
  const caption = document.getElementById('fullscreenCaption');
  const prevBtn = document.getElementById('fsPrev');
  const nextBtn = document.getElementById('fsNext');
  img.src = fsImages[fsCurrentIndex];
  caption.textContent = `${fsCurrentIndex + 1} / ${fsImages.length}`;
  prevBtn.style.display = fsImages.length > 1 ? 'flex' : 'none';
  nextBtn.style.display = fsImages.length > 1 ? 'flex' : 'none';
}

function fsPrev() {
  fsCurrentIndex = (fsCurrentIndex - 1 + fsImages.length) % fsImages.length;
  renderFullscreen();
}

function fsNext() {
  fsCurrentIndex = (fsCurrentIndex + 1) % fsImages.length;
  renderFullscreen();
}

// 键盘支持
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('fullscreenOverlay').classList.contains('active')) return;
  if (e.key === 'Escape') closeFullscreen();
  if (e.key === 'ArrowLeft') fsPrev();
  if (e.key === 'ArrowRight') fsNext();
});

// ===== 数据备份与恢复 =====
const BACKUP_KEY = 'clothing_cost_autobackup_v3';

function exportBackup() {
  const data = {
    version: 'v3',
    exportTime: new Date().toISOString(),
    styles: styles,
    categories: categories
  };
  const jsonStr = JSON.stringify(data, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `服装成本测算备份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!confirm('恢复数据将覆盖当前所有数据，确定继续吗？')) {
    event.target.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.styles && Array.isArray(data.styles)) {
        styles = data.styles;
        saveData();
      }
      if (data.categories && Array.isArray(data.categories)) {
        categories = data.categories;
        saveCategories();
      }
      renderList();
      updateCompareSelect();
      renderCatButtons();
      alert('数据恢复成功！');
    } catch (err) {
      alert('文件解析失败，请确认是有效的JSON备份文件');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// 清空所有数据
function clearAllData() {
  if (!confirm('确定要清空所有款号和类别数据吗？此操作不可恢复，建议先备份！')) return;
  if (!confirm('再次确认：真的要删除所有数据吗？')) return;

  styles = [];
  categories = [];
  saveData();
  saveCategories();
  renderList();
  updateCompareSelect();
  renderCatButtons();
  alert('所有数据已清空');
}

function autoBackup() {
  try {
    const data = {
      version: 'v3',
      backupTime: new Date().toISOString(),
      styles: styles,
      categories: categories
    };
    localStorage.setItem(BACKUP_KEY, JSON.stringify(data));
  } catch(e) {
    // 静默失败
  }
}

// 多重自动备份机制
// 1. 页面关闭/刷新前（兼容性较好）
window.addEventListener('beforeunload', function(e) {
  autoBackup();
});

// 2. pagehide 事件（移动端更可靠）
window.addEventListener('pagehide', function(e) {
  autoBackup();
});

// 3. 页面隐藏时（切换标签页、最小化等）
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    autoBackup();
  }
});

// 4. 定时备份兜底（每60秒一次）
setInterval(function() {
  autoBackup();
}, 60000);

// 启动
init();
</script>
